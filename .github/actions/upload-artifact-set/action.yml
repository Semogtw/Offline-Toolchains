name: Upload schema-v2 artifact set
description: Upload one manifest artifact and up to 16 connector-sized archive parts
inputs:
  artifact-set-id:
    required: true
  out:
    required: true
  archive-prefix:
    required: true
  part-count:
    required: true
runs:
  using: composite
  steps:
    - name: Upload manifest and inventory
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-manifest
        path: |
          ${{ inputs.out }}/artifact-set.json
          ${{ inputs.out }}/SBOM.spdx.json
          ${{ inputs.out }}/PARTS.txt
          ${{ inputs.out }}/SHA256SUMS.parts
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 00
      if: fromJSON(inputs.part-count) > 0
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-part-00
        path: ${{ inputs.out }}/${{ inputs.archive-prefix }}.tar.zst.part-00
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 01
      if: fromJSON(inputs.part-count) > 1
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-part-01
        path: ${{ inputs.out }}/${{ inputs.archive-prefix }}.tar.zst.part-01
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 02
      if: fromJSON(inputs.part-count) > 2
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-part-02
        path: ${{ inputs.out }}/${{ inputs.archive-prefix }}.tar.zst.part-02
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 03
      if: fromJSON(inputs.part-count) > 3
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-part-03
        path: ${{ inputs.out }}/${{ inputs.archive-prefix }}.tar.zst.part-03
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 04
      if: fromJSON(inputs.part-count) > 4
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.artifact-set-id }}-part-04
        path: ${{ inputs.out }}/${{ inputs.archive-prefix }}.tar.zst.part-04
        if-no-files-found: error
        compression-level: 0
        retention-days: 1
    - name: Upload part 05
      if: fromJSON(inputs.part-count) > 5
