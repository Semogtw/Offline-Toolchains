name: Apply GoAnime Scrapling host hardening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-host-hardening/*.request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: goanime-scrapling-host-hardening
  cancel-in-progress: false

jobs:
  apply:
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}'
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Toolchains source
        id: trusted_checkout
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Mark host hardening pending
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/goanime_post_status.py \
            --state pending \
            --context goanime-scrapling/host-hardening

      - name: Resolve source-bound request
        id: request
        working-directory: trusted-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-scrapling-host-hardening \
            --workspace .

      - name: Require expected target branch
        id: target
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: test "$TARGET_BRANCH" = 'feat/scrapling-provider-pipeline'

      - name: Checkout exact GoAnime source
        id: source_checkout
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source revision
        id: source_verify
        working-directory: private-source
        shell: bash
        env:
          SOURCE_HINT: ${{ steps.request.outputs.source_hint }}
        run: test "$(git rev-parse HEAD)" = "$SOURCE_HINT"

      - name: Apply scoped host hardening
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-source/scripts/goanime_apply_scrapling_host_hardening.py \
            --repo-root private-source

      - name: Run focused provider preflight tests
        id: tests
        working-directory: private-source/tools/scrapling_provider_pipeline
        shell: bash
        run: python3 tests/test_provider_config_preflight.py

      - name: Enforce narrow diff
        id: diff
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMRT)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = 'tools/scrapling_provider_pipeline/build_provider_cache.py'
          test "${changed[1]}" = 'tools/scrapling_provider_pipeline/tests/test_provider_config_preflight.py'

      - name: Verify target branch did not move
        id: race
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          SOURCE_HINT: ${{ steps.request.outputs.source_hint }}
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote "https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/goanime-mobile.git" "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "$SOURCE_HINT" || {
            echo 'Target branch moved; refusing stale publish.' >&2
            exit 1
          }

      - name: Commit hardening
        id: commit
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/scrapling_provider_pipeline/build_provider_cache.py \
            tools/scrapling_provider_pipeline/tests/test_provider_config_preflight.py
          git commit -m 'fix(scrapling): harden provider host scopes'

      - name: Publish hardening commit
        id: push
        working-directory: private-source
        shell: bash
        env:
          GOANIME_CATALOG_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: |
          set -euo pipefail
          test -n "$GOANIME_CATALOG_WRITE_TOKEN"
          git remote set-url origin "https://x-access-token:${GOANIME_CATALOG_WRITE_TOKEN}@github.com/Semogtw/goanime-mobile.git"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          git remote set-url origin 'https://github.com/Semogtw/goanime-mobile.git'

      - name: Mark host hardening successful
        if: success()
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/goanime_post_status.py \
            --state success \
            --context goanime-scrapling/host-hardening

      - name: Classify host hardening failure
        if: failure()
        continue-on-error: true
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST: ${{ steps.request.outcome }}
          TARGET: ${{ steps.target.outcome }}
          SOURCE_CHECKOUT: ${{ steps.source_checkout.outcome }}
          SOURCE_VERIFY: ${{ steps.source_verify.outcome }}
          PATCH: ${{ steps.patch.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          DIFF: ${{ steps.diff.outcome }}
          RACE: ${{ steps.race.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          phase=unknown
          if [ "$REQUEST" != success ] || [ "$TARGET" != success ]; then phase=request
          elif [ "$SOURCE_CHECKOUT" != success ] || [ "$SOURCE_VERIFY" != success ]; then phase=source
          elif [ "$PATCH" != success ]; then phase=patch
          elif [ "$TESTS" != success ]; then phase=tests
          elif [ "$DIFF" != success ]; then phase=diff
          elif [ "$RACE" != success ]; then phase=race
          elif [ "$COMMIT" != success ]; then phase=commit
          elif [ "$PUSH" != success ]; then phase=push
          fi
          python3 scripts/goanime_post_status.py \
            --state failure \
            --context "goanime-scrapling/host-hardening-$phase"
          python3 scripts/goanime_post_status.py \
            --state failure \
            --context goanime-scrapling/host-hardening

      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
