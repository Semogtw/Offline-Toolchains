name: Apply GoAnime Manga category filter normalization

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-category-filter-normalization-20260822/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-category-filter-normalization-20260822
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-category-filter-normalization-20260822/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'feature/manga-platform'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify current remote head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Apply reviewed category normalization
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/widgets/manga/manga_browse_categories_view.dart')
          text = path.read_text()
          old = """    final genres = <String>{
      for (final item in widget.items)
        for (final genre in item.metadata.genres)
          if (genre.trim().isNotEmpty) genre.trim(),
    }.toList(growable: false)
      ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
"""
          new = """    final genreByKey = <String, String>{};
    for (final item in widget.items) {
      for (final genre in item.metadata.genres) {
        final normalized = genre.trim();
        if (normalized.isEmpty) continue;
        genreByKey.putIfAbsent(normalized.toLowerCase(), () => normalized);
      }
    }
    final genres = genreByKey.values.toList(growable: false)
      ..sort((a, b) => a.toLowerCase().compareTo(b.toLowerCase()));
"""
          if text.count(old) != 1:
              raise SystemExit('category genre-list anchor drifted')
          text = text.replace(old, new, 1)
          old = """      if (_genre != null && !item.metadata.genres.contains(_genre)) return false;
"""
          new = """      if (_genre != null &&
          !item.metadata.genres.any(
            (genre) => genre.trim().toLowerCase() == _genre!.toLowerCase(),
          )) {
        return false;
      }
"""
          if text.count(old) != 1:
              raise SystemExit('category genre-filter anchor drifted')
          path.write_text(text.replace(old, new, 1))

          test = Path('test/widgets/manga/manga_browse_categories_view_test.dart')
          if test.exists():
              raise SystemExit('unexpected pre-existing category normalization test')
          test.write_text(r'''import 'package:flutter/material.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:goanime/services/manga/manga_availability_models.dart';
import 'package:goanime/services/manga/manga_browse_data_source.dart';
import 'package:goanime/widgets/manga/manga_browse_categories_view.dart';
import 'package:goanime_core/goanime_core.dart';

void main() {
  testWidgets('trimmed genre chip keeps its matching item visible', (tester) async {
    final item = _item('work-1', 'Trimmed Work', const [' Action ']);
    await tester.pumpWidget(_app([item]));

    expect(find.text('Action'), findsOneWidget);
    expect(find.text('Trimmed Work'), findsOneWidget);

    await tester.tap(find.text('Action'));
    await tester.pump();

    expect(find.text('Trimmed Work'), findsOneWidget);
  });

  testWidgets('genre chips collapse case and whitespace variants', (tester) async {
    await tester.pumpWidget(
      _app([
        _item('work-1', 'First Work', const ['Action']),
        _item('work-2', 'Second Work', const [' action ']),
      ]),
    );

    expect(find.byType(FilterChip), findsOneWidget);
    await tester.tap(find.byType(FilterChip));
    await tester.pump();

    expect(find.text('First Work'), findsOneWidget);
    expect(find.text('Second Work'), findsOneWidget);
  });
}

MangaBrowseItem _item(String id, String title, List<String> genres) {
  return MangaBrowseItem(
    availability: MangaAvailabilityRecord(
      work: MangaWork(workId: id, canonicalTitle: title),
      sourceLinks: const <MangaSourceLink>[],
      evidence: const <MangaReadabilityEvidence>[],
    ),
    metadata: MangaBrowseMetadata(genres: genres),
  );
}

Widget _app(List<MangaBrowseItem> items) {
  return MaterialApp(
    home: Scaffold(
      body: MangaBrowseCategoriesView(
        items: items,
        labels: MangaBrowseCategoryLabels(
          empty: 'Empty',
          unread: 'Unread',
          offline: 'Offline',
          formatLabel: (format) => format.name,
          statusLabel: (status) => status.name,
        ),
        onOpenWork: (_) {},
      ),
    ),
  );
}
''')
          PY
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Validate category normalization
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/widgets/manga/manga_browse_categories_view.dart test/widgets/manga/manga_browse_categories_view_test.dart >/dev/null
          python3 tools/validate_repository_guards.py
          bash tools/validate_project_health.sh
          git diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/widgets/manga/manga_browse_categories_view_test.dart

      - name: Commit reviewed checkpoint
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/manga/manga_browse_categories_view.dart test/widgets/manga/manga_browse_categories_view_test.dart
          git commit -m 'fix(manga): normalize category genre filters'
          test -z "$(git status --porcelain)"

      - name: Fast-forward private Manga branch
        id: publish
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
