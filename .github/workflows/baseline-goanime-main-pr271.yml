name: Baseline GoAnime main for PR271 comparison

on:
  push:
    branches: [main]
    paths:
      - triggers/goanime-manga-home/baseline-pr271.request

permissions:
  contents: read

concurrency:
  group: goanime-pr271-main-baseline
  cancel-in-progress: true

jobs:
  baseline:
    name: Complete Flutter test suite on pinned main SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            triggers/goanime-manga-home/baseline-pr271.request
          sparse-checkout-cone-mode: false

      - name: Validate pinned main SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          sha=pathlib.Path('trusted/triggers/goanime-manga-home/baseline-pr271.request').read_text().strip()
          if re.fullmatch('[0-9a-f]{40}',sha) is None: raise SystemExit('Must specify exact SHA')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('sha='+sha+'\n')
          PY

      - name: Checkout exact GoAnime main baseline
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 1
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact commit and main ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = '${{ steps.request.outputs.sha }}'
          echo 'GoAnime pinned baseline SHA checked'

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: false

      - name: Resolve dependencies just like PR
        working-directory: source
        run: |
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Run complete main Flutter suite for apples-to-apples baseline
        working-directory: source
        run: flutter test --no-pub

      - name: Securely remove private checkout
        if: always()
        run: rm -rf source
