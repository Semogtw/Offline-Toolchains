name: Attest GoAnime release 1.26.3 full CI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/attest-goanime-release-1.26.3.yml

permissions:
  contents: read

jobs:
  attest:
    name: Attest validated GoAnime commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted toolchains state
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify full-CI provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('reports/goanime-full-ci/33136734714.json').read_text(encoding='utf-8'))
          expected = {
              'schemaVersion': 1,
              'runId': 33136734714,
              'runAttempt': 1,
              'event': 'push',
              'toolchainsTriggerSha': '1ab095727be62e9414394bf3533f2fb47f81a741',
              'normalizeResult': 'success',
              'verifyResult': 'success',
          }
          for key, value in expected.items():
              if report.get(key) != value:
                  raise SystemExit(f'full-CI provenance mismatch for {key}: {report.get(key)!r} != {value!r}')
          PY

      - name: Publish required private commit status
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_SHA: 6fbdcd7164272b093386da5b3dfa17f4efd8997b
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          python3 - <<'PY' > "$RUNNER_TEMP/status.json"
          import json
          print(json.dumps({
              'state': 'success',
              'context': 'Project health, analysis and principal tests',
              'description': 'Validated by Offline-Toolchains full CI run 33136734714',
              'target_url': 'https://github.com/Semogtw/Offline-Toolchains/actions/runs/33136734714',
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Semogtw/goanime-mobile/statuses/$TARGET_SHA" \
            --data-binary @"$RUNNER_TEMP/status.json"
