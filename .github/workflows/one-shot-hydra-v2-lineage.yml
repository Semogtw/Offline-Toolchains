name: One-shot Hydra Drive V2 lineage fix

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-lineage.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Keep legacy and V2 lineage domains separate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts")
          text = path.read_text()

          replacements = [
              (
                  '''            anchor,\n          });\n''',
                  '''            anchor,\n            legacyParentHash: legacyState?.lastSyncedHash ?? null,\n          });\n''',
              ),
              (
                  '''    autoRestore,\n    anchor,\n  }: {\n''',
                  '''    autoRestore,\n    anchor,\n    legacyParentHash,\n  }: {\n''',
              ),
              (
                  '''    autoRestore: boolean;\n    anchor: Awaited<ReturnType<typeof googleDriveSyncAnchorSublevel.get>> | null;\n''',
                  '''    autoRestore: boolean;\n    anchor: Awaited<ReturnType<typeof googleDriveSyncAnchorSublevel.get>> | null;\n    legacyParentHash: string | null;\n''',
              ),
              (
                  '''            parentHash: anchor.aggregateHash,\n''',
                  '''            parentHash: legacyParentHash,\n''',
              ),
              (
                  '''        parentHash: anchor?.aggregateHash ?? null,\n''',
                  '''        parentHash: legacyParentHash,\n''',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one lineage match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Commit and push Hydra fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts
          git commit -m "fix(cloud-save): keep V1 and V2 lineage hashes separate"
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot Toolchains files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-lineage.yml" "triggers/one-shot-hydra-v2-lineage.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed Hydra V2 lineage patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null || true
          done
