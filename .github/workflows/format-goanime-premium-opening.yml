name: Format GoAnime premium opening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-opening-format/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-premium-opening-format
  cancel-in-progress: false

jobs:
  format:
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          path: trusted-source

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-opening-format/*.request' | head -n 1)"
          test -n "$request"
          read -r project sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact GoAnime main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 2
          persist-credentials: false

      - name: Verify request is still main HEAD
        working-directory: source
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_SHA"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply canonical Dart formatting
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/widgets/goanime_opening.dart \
            test/widgets/goanime_opening_test.dart
          git diff --check
          git diff -- lib/widgets/goanime_opening.dart test/widgets/goanime_opening_test.dart

      - name: Commit and push guarded formatting
        id: push
        working-directory: source
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(git status --porcelain)"
          remote_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$remote_main" = "$EXPECTED_SHA"
          git config user.name "goanime-toolchains[bot]"
          git config user.email "goanime-toolchains[bot]@users.noreply.github.com"
          git add lib/widgets/goanime_opening.dart test/widgets/goanime_opening_test.dart
          git commit -m "style(ui): format premium startup opening"
          pushed_sha="$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/main
          printf 'pushed_sha=%s\n' "$pushed_sha" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PUSHED_SHA: ${{ steps.push.outputs.pushed_sha }}
          STATE: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -cn \
            --arg sha "$TARGET_SHA" \
            --arg pushedSha "$PUSHED_SHA" \
            --arg state "$STATE" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,sourceSha:$sha,pushedSha:$pushedSha,state:$state,runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-opening-format/$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record GoAnime opening format $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null
