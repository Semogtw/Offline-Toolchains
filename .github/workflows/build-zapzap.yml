name: Build ZapZap offline cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-zapzap.yml
      - fixtures/zapzap/**
      - triggers/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-zapzap.yml
      - fixtures/zapzap/**

permissions:
  contents: read

concurrency:
  group: zapzap-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.9"

jobs:
  build:
    name: Gradle, AGP, Kotlin and Android dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true

      - name: Configure portable Gradle cache
        shell: bash
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/zapzap-gradle-home" >> "$GITHUB_ENV"

      - name: Hydrate ZapZap dependency graph
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/zapzap-fixture"
          cp -a fixtures/zapzap "$project"
          cd "$project"

          gradle wrapper \
            --gradle-version "$GRADLE_VERSION" \
            --distribution-type bin

          ./gradlew --no-daemon \
            :app:dependencies \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Assemble portable ZapZap cache
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="$RUNNER_TEMP/zapzap-toolchain"
          archive="$RUNNER_TEMP/zapzap-gradle-cache-linux-x64.tar.zst"
          rm -rf "$bundle_root" "$archive" "$archive.sha256"
          mkdir -p "$bundle_root"

          rm -rf "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/workers"
          cp -a "$GRADLE_USER_HOME" "$bundle_root/gradle-home"

          standard_gradle="$(find \
            "$bundle_root/gradle-home/wrapper/dists/gradle-$GRADLE_VERSION-bin" \
            -mindepth 2 -maxdepth 2 -type d -name "gradle-$GRADLE_VERSION" \
            -print -quit)"
          test -n "$standard_gradle"
          custom_gradle_root="$bundle_root/gradle-home/wrapper/dists/cipherlink-gradle-$GRADLE_VERSION"
          mkdir -p "$custom_gradle_root"
          ln -s \
            "$(realpath --relative-to="$custom_gradle_root" "$standard_gradle")" \
            "$custom_gradle_root/gradle-$GRADLE_VERSION"

          cat > "$bundle_root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          bundle_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export GRADLE_USER_HOME="$bundle_root/gradle-home"
          export CI=true
          EOF
          chmod +x "$bundle_root/activate.sh"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "gradle=$GRADLE_VERSION"
            echo "agp=8.7.3"
            echo "kotlin=2.0.21"
            echo "compile_sdk=35"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            sha256sum \
              fixtures/zapzap/settings.gradle.kts \
              fixtures/zapzap/build.gradle.kts \
              fixtures/zapzap/app/build.gradle.kts \
              fixtures/zapzap/tools/test-support/build.gradle.kts
          } > "$bundle_root/MANIFEST.txt"

          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -8' -cf "$archive" zapzap-toolchain
          sha256sum "$archive" > "$archive.sha256"

          parts_dir="$RUNNER_TEMP/zapzap-gradle-cache-linux-x64-parts"
          rm -rf "$parts_dir"
          mkdir -p "$parts_dir"
          split -b 400M -d -a 2 "$archive" "$parts_dir/zapzap-gradle-cache-linux-x64.part-"
          (
            cd "$parts_dir"
            sha256sum zapzap-gradle-cache-linux-x64.part-* > SHA256SUMS.parts
          )

          {
            echo "archive=$(basename "$archive")"
            echo "archive_sha256=$(cut -d' ' -f1 "$archive.sha256")"
            echo "part_size=400M"
            echo "reassemble=cat zapzap-gradle-cache-linux-x64.part-* > $(basename "$archive")"
            echo
            ls -lh "$parts_dir"/zapzap-gradle-cache-linux-x64.part-*
          } > "$parts_dir/PARTS.txt"

          echo "parts_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          for index in $(seq -f '%02g' 0 4); do
            if [[ -f "$parts_dir/zapzap-gradle-cache-linux-x64.part-$index" ]]; then
              echo "part_$index=true" >> "$GITHUB_OUTPUT"
            fi
          done

          ls -lh "$archive" "$archive.sha256" "$parts_dir"/*

      - name: Validate copied cache offline
        shell: bash
        run: |
          set -euo pipefail

          source "$RUNNER_TEMP/zapzap-toolchain/activate.sh"
          custom_gradle="$GRADLE_USER_HOME/wrapper/dists/cipherlink-gradle-$GRADLE_VERSION/gradle-$GRADLE_VERSION/bin/gradle"
          test -x "$custom_gradle"
          "$custom_gradle" --version >/dev/null

          project="$RUNNER_TEMP/zapzap-fixture"
          cd "$project"

          ./gradlew --offline --no-daemon \
            :app:dependencies \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Upload ZapZap cache manifest
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-manifest
          path: |
            ${{ steps.bundle.outputs.manifest_dir }}/PARTS.txt
            ${{ steps.bundle.outputs.manifest_dir }}/SHA256SUMS.parts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ZapZap cache part 00
        if: steps.bundle.outputs.part_00 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-part-00
          path: ${{ steps.bundle.outputs.parts_dir }}/zapzap-gradle-cache-linux-x64.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ZapZap cache part 01
        if: steps.bundle.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-part-01
          path: ${{ steps.bundle.outputs.parts_dir }}/zapzap-gradle-cache-linux-x64.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ZapZap cache part 02
        if: steps.bundle.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-part-02
          path: ${{ steps.bundle.outputs.parts_dir }}/zapzap-gradle-cache-linux-x64.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ZapZap cache part 03
        if: steps.bundle.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-part-03
          path: ${{ steps.bundle.outputs.parts_dir }}/zapzap-gradle-cache-linux-x64.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload ZapZap cache part 04
        if: steps.bundle.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: zapzap-gradle-cache-linux-x64-part-04
          path: ${{ steps.bundle.outputs.parts_dir }}/zapzap-gradle-cache-linux-x64.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
