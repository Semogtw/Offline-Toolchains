name: Dispatch exact GoAnime full CI request

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-full-ci-exact/*.request'

permissions:
  contents: write
  actions: write

concurrency:
  group: dispatch-goanime-full-ci-exact
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact trusted trigger commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            scripts/private_ci_request.py
            triggers/goanime-full-ci-exact
          sparse-checkout-cone-mode: false

      - name: Resolve and dispatch exact private ref
        id: dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(
            git show --pretty='' --name-only HEAD -- \
              'triggers/goanime-full-ci-exact/*.request' \
              | sed '/^$/d' | sort -u
          )
          test "${#changed[@]}" -eq 1 || {
            echo "Expected exactly one full-CI request in trigger commit; got ${#changed[@]}." >&2
            exit 1
          }
          request_path="${changed[0]}"
          test -f "$request_path"
          ref="$(tr -d '\r\n' < "$request_path")"
          test -n "$ref"
          request="$RUNNER_TEMP/goanime-exact-ci-request.json"
          printf '{"project":"goanime","ref":"%s"}\n' "$ref" > "$request"
          normalized="$(python3 scripts/private_ci_request.py "$request")"
          ref="$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["ref"])' "$normalized")"
          gh workflow run run-private-goanime-ci.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "ref=$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized dispatcher receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCHED_REF: ${{ steps.dispatch.outputs.ref }}
          RUN_ID: ${{ github.run_id }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dispatch-report.json"
          python3 - "$report" <<'PY'
          import json, os, sys
          payload = {
              'schemaVersion': 1,
              'dispatcherRunId': int(os.environ['RUN_ID']),
              'toolchainsTriggerSha': os.environ['TRIGGER_SHA'],
              'dispatchedRef': os.environ['DISPATCHED_REF'],
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY
          encoded="$(base64 -w0 < "$report")"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/reports/goanime-full-ci-dispatch/${RUN_ID}.json" \
            -f "message=ci(goanime): report exact CI dispatch ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null
