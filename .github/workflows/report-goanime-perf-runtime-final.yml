name: Report GoAnime final runtime performance publish

on:
  workflow_run:
    workflows: ['Apply GoAnime final runtime performance patches']
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    if: github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Publish sanitized result
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/goanime-perf-runtime-final
          cat > "reports/goanime-perf-runtime-final/${RUN_ID}.json" <<EOF
          {
            "schemaVersion": 1,
            "runId": ${RUN_ID},
            "runAttempt": ${ATTEMPT},
            "conclusion": "${CONCLUSION}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "reports/goanime-perf-runtime-final/${RUN_ID}.json"
          git commit -m "ci(goanime): report runtime perf run ${RUN_ID}"
          git push
