name: Observe GoAnime catalog gates

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-catalog-gate-observer/*.request'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: true

      - name: Collect sanitized workflow states
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/goanime-catalog-gates
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          workflows = {
              "fullCi": "run-private-goanime-ci.yml",
              "finalizer": "goanime-global-catalog-finalize.yml",
              "workerDeploy": "goanime-updates-worker-deploy.yml",
          }
          output = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "workflows": {},
          }
          for key, workflow in workflows.items():
              command = [
                  "gh", "run", "list",
                  "--repo", os.environ["GITHUB_REPOSITORY"],
                  "--workflow", workflow,
                  "--limit", "6",
                  "--json", "databaseId,status,conclusion,event,headSha,displayTitle,createdAt,updatedAt",
              ]
              result = subprocess.run(command, capture_output=True, text=True, check=False)
              if result.returncode != 0:
                  output["workflows"][key] = {"error": "query-failed"}
                  continue
              rows = json.loads(result.stdout or "[]")
              output["workflows"][key] = rows

          path = Path("reports/goanime-catalog-gates/latest.json")
          path.write_text(json.dumps(output, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(output, sort_keys=True))
          PY

      - name: Commit sanitized observer report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/goanime-catalog-gates/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(goanime): observe catalog gates $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
