name: Format GoAnime once

on:
  push:
    paths:
      - '.github/workflows/format-goanime-once.yml'

permissions:
  contents: read

env:
  GOANIME_EXPECTED_SHA: 64c73ead2a5c481f2f95f40cefc2ff8f9b8e669e
  GOANIME_BRANCH: feat/experimental-ai-buffered-upscaling-20260830
  FLUTTER_VERSION: 3.44.1

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_EXPECTED_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Format and push deterministic-only changes
        working-directory: goanime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOANIME_EXPECTED_SHA"

          dart format lib test packages tools

          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//')
          test "${#changed[@]}" -gt 0
          for file in "${changed[@]}"; do
            case "$file" in
              lib/*|test/*|packages/*|tools/*) ;;
              *) echo "unexpected formatted path: $file" >&2; exit 1 ;;
            esac
          done

          git fetch --no-tags origin "refs/heads/${GOANIME_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$GOANIME_EXPECTED_SHA"

          git config user.name 'GoAnime CI'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test packages tools
          git commit -m 'style: format experimental implementation'
          git push origin "HEAD:refs/heads/${GOANIME_BRANCH}"
