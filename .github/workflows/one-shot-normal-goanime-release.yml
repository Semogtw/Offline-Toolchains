name: One-shot normal GoAnime release

on:
  push:
    branches:
      - main
    paths:
      - triggers/goanime-normal-release/megaplay-1.26.2.request

permissions:
  contents: read

concurrency:
  group: goanime-normal-release-1.26.2
  cancel-in-progress: false

env:
  GOANIME_REPOSITORY: Semogtw/goanime-mobile
  SOURCE_REF: 99a823a79a83a46412181798a1326eb04f4ad581
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  ANDROID_TARGET_PLATFORM: android-arm64
  ANDROID_RELEASE_APK_NAME: GoAnime-android-arm64-v8a-release.apk
  GOANIME_OFFICIAL_RELEASE: "true"
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
  UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
  UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
  UPDATE_MANIFEST_PUBLIC_KEY_ID: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_ID }}
  UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
  ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
  RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}

jobs:
  prepare:
    name: Validate source and open staging draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version_name: ${{ steps.prepare.outputs.version_name }}
      build_number: ${{ steps.prepare.outputs.build_number }}
      platforms: ${{ steps.prepare.outputs.platforms }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 99a823a79a83a46412181798a1326eb04f4ad581
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 21
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - name: Prepare normal release
        id: prepare
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AUTO_UPDATER_DSA_PUBLIC_KEY: ${{ secrets.AUTO_UPDATER_DSA_PUBLIC_KEY }}
          AUTO_UPDATER_DSA_PRIVATE_KEY: ${{ secrets.AUTO_UPDATER_DSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_OWNER" = "Semogtw"
          source_sha="$(git rev-parse HEAD)"
          test "$source_sha" = "$SOURCE_REF"
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*$/\1/p' pubspec.yaml | head -n1)"
          build_number="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+)\+([0-9]+).*$/\2/p' pubspec.yaml | head -n1)"
          test "$version" = "1.26.2"
          test "$build_number" = "33"
          release_tag="release-v$version"

          for name in \
            GH_TOKEN FIREBASE_PROJECT_ID FIREBASE_WEB_API_KEY UPDATE_MANIFEST_URL \
            UPDATE_APPCAST_URL UPDATE_MANIFEST_PUBLIC_KEY_ID UPDATE_MANIFEST_PUBLIC_KEY_B64 \
            ANIME_METADATA_SEED_MANIFEST_URL UPDATE_MANIFEST_SIGNING_PRIVATE_KEY \
            CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET \
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD AUTO_UPDATER_DSA_PUBLIC_KEY AUTO_UPDATER_DSA_PRIVATE_KEY
          do
            test -n "${!name:-}" || { echo "::error::$name secret is required."; exit 1; }
          done

          if [[ -z "${RUNTIME_DATABASE_MANIFEST_URL:-}" ]]; then
            case "$UPDATE_MANIFEST_URL" in
              */latest/update.json)
                RUNTIME_DATABASE_MANIFEST_URL="${UPDATE_MANIFEST_URL%/update.json}/runtime_database_manifest.json"
                export RUNTIME_DATABASE_MANIFEST_URL
                ;;
              *)
                echo "::error::RUNTIME_DATABASE_MANIFEST_URL is missing."
                exit 1
                ;;
            esac
          fi

          UPDATE_MANIFEST_PUBLIC_KEY_B64="$UPDATE_MANIFEST_PUBLIC_KEY_B64" python3 - <<'PY'
          import base64, binascii, os, re
          key_id = os.environ["UPDATE_MANIFEST_PUBLIC_KEY_ID"].strip()
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,64}", key_id):
              raise SystemExit("invalid manifest key id")
          try:
              key = base64.b64decode(os.environ["UPDATE_MANIFEST_PUBLIC_KEY_B64"].strip(), validate=True)
          except (binascii.Error, ValueError) as error:
              raise SystemExit(f"invalid manifest public key: {error}")
          if len(key) != 32:
              raise SystemExit("manifest public key must decode to 32 bytes")
          PY

          notes_file="$RUNNER_TEMP/goanime-release-notes.txt"
          printf '%s\n' 'Normal full Flutter release after Shorebird Android base-release incompatibility.' > "$notes_file"
          if gh release view "$release_tag" --repo "$GOANIME_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$release_tag" --repo "$GOANIME_REPOSITORY" --json isDraft --jq .isDraft)" = "true"
            tag_type="$(gh api "repos/$GOANIME_REPOSITORY/git/ref/tags/$release_tag" --jq .object.type)"
            tag_sha="$(gh api "repos/$GOANIME_REPOSITORY/git/ref/tags/$release_tag" --jq .object.sha)"
            if [[ "$tag_type" == "tag" ]]; then
              tag_sha="$(gh api "repos/$GOANIME_REPOSITORY/git/tags/$tag_sha" --jq .object.sha)"
            fi
            test "$tag_sha" = "$source_sha"
            gh release edit "$release_tag" --repo "$GOANIME_REPOSITORY" --draft=true --prerelease=false \
              --title "GoAnime v$version" --notes-file "$notes_file"
          else
            gh release create "$release_tag" --repo "$GOANIME_REPOSITORY" --target "$source_sha" --draft \
              --prerelease=false --title "GoAnime v$version" --notes-file "$notes_file"
          fi
          {
            echo "source_sha=$source_sha"
            echo "release_tag=$release_tag"
            echo "version_name=$version"
            echo "build_number=$build_number"
            echo "platforms=android,windows,linux"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Android arm64 normal release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',android,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and upload Android APK normally
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/goanime-release.jks
          trap 'rm -f android/app/goanime-release.jks android/key.properties' EXIT
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=goanime-release.jks"
          } > android/key.properties
          flutter pub get --enforce-lockfile
          if [[ -z "${RUNTIME_DATABASE_MANIFEST_URL:-}" ]]; then
            RUNTIME_DATABASE_MANIFEST_URL="${UPDATE_MANIFEST_URL%/update.json}/runtime_database_manifest.json"
            export RUNTIME_DATABASE_MANIFEST_URL
          fi
          flutter build apk --release --target-platform="$ANDROID_TARGET_PLATFORM" --no-pub \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL" \
            --dart-define="UPDATE_APPCAST_URL=$UPDATE_APPCAST_URL" \
            --dart-define="UPDATE_MANIFEST_PUBLIC_KEY_ID=$UPDATE_MANIFEST_PUBLIC_KEY_ID" \
            --dart-define="UPDATE_MANIFEST_PUBLIC_KEY_B64=$UPDATE_MANIFEST_PUBLIC_KEY_B64" \
            --dart-define=UPDATE_MANIFEST_SIGNATURE_REQUIRED=true \
            --dart-define="ANIME_METADATA_SEED_MANIFEST_URL=$ANIME_METADATA_SEED_MANIFEST_URL" \
            --dart-define="RUNTIME_DATABASE_MANIFEST_URL=$RUNTIME_DATABASE_MANIFEST_URL"
          mapfile -t apks < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -eq 1
          apk="${apks[0]}"
          test -s "$apk"
          entries="$(unzip -Z1 "$apk" 'lib/*/libapp.so' || true)"
          test "$entries" = "lib/arm64-v8a/libapp.so"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          "$build_tools/apksigner" verify "$apk"
          mkdir -p dist/android-release
          cp "$apk" "dist/android-release/$ANDROID_RELEASE_APK_NAME"
          gh release upload "$RELEASE_TAG" dist/android-release/* --repo "$GOANIME_REPOSITORY" --clobber

  windows:
    name: Windows x64 normal release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',windows,') }}
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      dsa_signature: ${{ steps.build.outputs.dsa_signature }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Windows packaging tools
        run: choco install innosetup openssl -y
      - name: Build and upload Windows normally
        id: build
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          AUTO_UPDATER_DSA_PUBLIC_KEY: ${{ secrets.AUTO_UPDATER_DSA_PUBLIC_KEY }}
          AUTO_UPDATER_DSA_PRIVATE_KEY: ${{ secrets.AUTO_UPDATER_DSA_PRIVATE_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          git config --system core.longpaths true
          $env:AUTO_UPDATER_DSA_PUBLIC_KEY | Set-Content -LiteralPath windows\runner\dsa_pub.pem -Encoding ascii
          $env:AUTO_UPDATER_DSA_PRIVATE_KEY | Set-Content -LiteralPath dsa_priv.pem -Encoding ascii
          try {
            flutter pub get --enforce-lockfile
            if (-not $env:RUNTIME_DATABASE_MANIFEST_URL) {
              $env:RUNTIME_DATABASE_MANIFEST_URL = $env:UPDATE_MANIFEST_URL -replace "/update\.json$", "/runtime_database_manifest.json"
            }
            $flutterArgs = @(
              "build", "windows", "--release", "--no-pub",
              "--dart-define=FIREBASE_PROJECT_ID=$env:FIREBASE_PROJECT_ID",
              "--dart-define=FIREBASE_WEB_API_KEY=$env:FIREBASE_WEB_API_KEY",
              "--dart-define=UPDATE_MANIFEST_URL=$env:UPDATE_MANIFEST_URL",
              "--dart-define=UPDATE_APPCAST_URL=$env:UPDATE_APPCAST_URL",
              "--dart-define=UPDATE_MANIFEST_PUBLIC_KEY_ID=$env:UPDATE_MANIFEST_PUBLIC_KEY_ID",
              "--dart-define=UPDATE_MANIFEST_PUBLIC_KEY_B64=$env:UPDATE_MANIFEST_PUBLIC_KEY_B64",
              "--dart-define=UPDATE_MANIFEST_SIGNATURE_REQUIRED=true",
              "--dart-define=ANIME_METADATA_SEED_MANIFEST_URL=$env:ANIME_METADATA_SEED_MANIFEST_URL",
              "--dart-define=RUNTIME_DATABASE_MANIFEST_URL=$env:RUNTIME_DATABASE_MANIFEST_URL"
            )
            $built = $false
            for ($attempt = 1; $attempt -le 2; $attempt++) {
              & flutter @flutterArgs
              if ($LASTEXITCODE -eq 0) { $built = $true; break }
              if ($attempt -lt 2) {
                Get-ChildItem -Path build\windows\x64 -Filter "mpv-dev-*.7z" -ErrorAction SilentlyContinue | Remove-Item -Force
                Remove-Item -LiteralPath build\windows\x64\CMakeCache.txt -Force -ErrorAction SilentlyContinue
                Remove-Item -LiteralPath build\windows\x64\CMakeFiles -Recurse -Force -ErrorAction SilentlyContinue
              }
            }
            if (-not $built) { throw "Flutter Windows release failed after retry." }
            $shaderTarget = "build\windows\x64\runner\Release\data\flutter_assets\assets\shaders"
            New-Item -ItemType Directory -Force -Path $shaderTarget | Out-Null
            Copy-Item -Path "assets\shaders\*.glsl" -Destination $shaderTarget -Force
            New-Item -ItemType Directory -Force -Path dist\windows-release | Out-Null
            $inno = Join-Path (Get-Item Env:ProgramFiles).Value "Inno Setup 6\ISCC.exe"
            $innoArgs = @(
              "/DAppVersion=$env:VERSION_NAME",
              "/DBuildDir=$PWD\build\windows\x64\runner\Release",
              "/DOutputDir=$PWD\dist\windows-release",
              "packaging\windows\GoAnime.iss"
            )
            & $inno @innoArgs
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
            $installer = Join-Path $PWD "dist\windows-release\GoAnime-windows-x64-setup-$env:VERSION_NAME.exe"
            if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) { throw "Windows installer was not produced." }
            if ((Get-Item -LiteralPath $installer).Length -le 0) { throw "Windows installer is empty." }
            $dartExe = Join-Path $env:FLUTTER_ROOT 'bin\cache\dart-sdk\bin\dart.exe'
            $dartAppData = Join-Path $env:RUNNER_TEMP 'dart-appdata'
            New-Item -ItemType Directory -Force -Path $dartAppData | Out-Null
            $env:APPDATA = $dartAppData
            $output = & $dartExe run auto_updater:sign_update $installer
            if ($LASTEXITCODE -ne 0) { throw "auto_updater signing failed with exit code $LASTEXITCODE." }
            $match = [regex]::Match(($output -join [Environment]::NewLine), 'sparkle:dsaSignature="([^"]+)"')
            if (-not $match.Success) { throw "Unable to extract Windows DSA signature." }
            "dsa_signature=$($match.Groups[1].Value)" >> $env:GITHUB_OUTPUT
            gh release upload $env:RELEASE_TAG dist\windows-release\* --repo $env:GOANIME_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "GitHub release upload failed." }
          } finally {
            Remove-Item -LiteralPath dsa_priv.pem -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath windows\runner\dsa_pub.pem -Force -ErrorAction SilentlyContinue
          }

  linux:
    name: Linux x64 normal release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',linux,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Build and upload Linux normally
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake curl elfutils file flatpak flatpak-builder libfuse2t64 libgtk-3-dev \
            libjsoncpp-dev liblzma-dev libmpv-dev libsecret-1-0 libsecret-1-dev \
            libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            lld llvm ninja-build pkg-config
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          export PATH="$HOME/.cargo/bin:$PATH"
          flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//50 org.gnome.Sdk//50
          flutter pub get --enforce-lockfile
          if [[ -z "${RUNTIME_DATABASE_MANIFEST_URL:-}" ]]; then
            RUNTIME_DATABASE_MANIFEST_URL="${UPDATE_MANIFEST_URL%/update.json}/runtime_database_manifest.json"
            export RUNTIME_DATABASE_MANIFEST_URL
          fi
          flutter build linux --release --no-pub \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_WEB_API_KEY=$FIREBASE_WEB_API_KEY" \
            --dart-define="UPDATE_MANIFEST_URL=$UPDATE_MANIFEST_URL" \
            --dart-define="UPDATE_APPCAST_URL=$UPDATE_APPCAST_URL" \
            --dart-define="UPDATE_MANIFEST_PUBLIC_KEY_ID=$UPDATE_MANIFEST_PUBLIC_KEY_ID" \
            --dart-define="UPDATE_MANIFEST_PUBLIC_KEY_B64=$UPDATE_MANIFEST_PUBLIC_KEY_B64" \
            --dart-define=UPDATE_MANIFEST_SIGNATURE_REQUIRED=true \
            --dart-define="ANIME_METADATA_SEED_MANIFEST_URL=$ANIME_METADATA_SEED_MANIFEST_URL" \
            --dart-define="RUNTIME_DATABASE_MANIFEST_URL=$RUNTIME_DATABASE_MANIFEST_URL"
          mkdir -p dist/linux-release
          bash tools/package_linux_appimage.sh
          flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak packaging/linux/com.goanime.desktop.yml
          flatpak build-bundle build/flatpak-repo dist/linux-release/GoAnime-linux-x86_64.flatpak com.goanime.desktop
          test -s dist/linux-release/GoAnime-linux-x86_64.AppImage
          test -s dist/linux-release/GoAnime-linux-x86_64.flatpak
          gh release upload "$RELEASE_TAG" dist/linux-release/* --repo "$GOANIME_REPOSITORY" --clobber

  publish:
    name: Publish normal release and update channels
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [prepare, android, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Publish signed metadata and update channels
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_NOTES: Normal full Flutter release after Shorebird Android base-release incompatibility.
          GOANIME_RELEASE_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          WINDOWS_DSA_SIGNATURE: ${{ needs.windows.outputs.dsa_signature }}
          UPDATE_ASSET_URL_TEMPLATE: ${{ secrets.UPDATE_ASSET_URL_TEMPLATE }}
          UPDATE_RELEASE_PAGE_URL: ${{ secrets.UPDATE_RELEASE_PAGE_URL }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: bash scripts/goanime-release/publish.sh private-source
