name: Fix GoAnime readability probe host policy

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-readability-probe-host-policy-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-readability-probe-host-policy-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Enforce host policy in readability probe
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply exact-SHA readability probe host-policy fix
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: bash scripts/fix-goanime-readability-probe-host-policy.sh
