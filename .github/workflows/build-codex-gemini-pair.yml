name: Build immutable CodexGemini pair

on:
  push:
    branches:
      - main
    paths:
      - triggers/codex-gemini-pair.json

permissions:
  contents: read

concurrency:
  group: codex-gemini-pair-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONUTF8: "1"
  RUST_BACKTRACE: "1"
  RUST_MIN_STACK: "8388608"

jobs:
  build:
    name: Build exact core binary and pair receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout toolchain control plane
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test and resolve exact pair
        id: pair
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_resolve_codex_pair_trigger
          python3 scripts/resolve_codex_pair_trigger.py \
            triggers/codex-gemini-pair.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout exact core
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pair.outputs.core_repository }}
          ref: ${{ steps.pair.outputs.core_ref }}
          path: core-source
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact wrapper
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.pair.outputs.wrapper_repository }}
          ref: ${{ steps.pair.outputs.wrapper_ref }}
          path: wrapper-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout identities
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          core_commit="$(git -C core-source rev-parse HEAD)"
          wrapper_commit="$(git -C wrapper-source rev-parse HEAD)"
          test "${core_commit,,}" = '${{ steps.pair.outputs.core_ref }}'
          test "${wrapper_commit,,}" = '${{ steps.pair.outputs.wrapper_ref }}'
          printf 'core_commit=%s\n' "$core_commit" >> "$GITHUB_OUTPUT"
          printf 'wrapper_commit=%s\n' "$wrapper_commit" >> "$GITHUB_OUTPUT"

      - name: Install Rust 1.95 and native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake file libcap-dev libseccomp-dev \
            libsqlite3-dev libssl-dev pkg-config protobuf-compiler
          rustup toolchain install 1.95.0 --profile minimal
          rustup default 1.95.0
          rustc --version
          cargo --version

      - name: Verify deterministic core source contract
        id: source_contract
        continue-on-error: true
        working-directory: core-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_external_agent_integration.py \
            --python-only \
            --report "$RUNNER_TEMP/pair-core-source-verification.json"

      - name: Test native artifact manifest contract
        working-directory: core-source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts/native_core_artifact_manifest_test.py

      - name: Build real Codex CLI release binary
        id: binary
        working-directory: core-source/codex-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release -p codex-cli --bin codex
          binary="$PWD/target/release/codex"
          test -f "$binary"
          test -x "$binary"
          sha256="$(sha256sum "$binary" | cut -d' ' -f1)"
          size_bytes="$(stat -c '%s' "$binary")"
          file_description="$(file -b "$binary")"
          readelf -h "$binary" > "$RUNNER_TEMP/codex-elf-header.txt"
          printf 'path=%s\n' "$binary" >> "$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
          printf 'size_bytes=%s\n' "$size_bytes" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$file_description" > "$RUNNER_TEMP/codex-file-description.txt"

      - name: Emit native core provenance manifest
        id: manifest
        working-directory: core-source
        shell: bash
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/codex-native.json"
          python3 scripts/native_core_artifact_manifest.py \
            --binary '${{ steps.binary.outputs.path }}' \
            --target linux-x86_64 \
            --commit '${{ steps.identity.outputs.core_commit }}' \
            --output "$manifest"
          printf 'path=%s\n' "$manifest" >> "$GITHUB_OUTPUT"

      - name: Verify wrapper pin matches immutable pair
        shell: bash
        run: |
          set -euo pipefail
          python3 - \
            wrapper-source/native-core/pin.json \
            '${{ steps.pair.outputs.core_repository }}' \
            '${{ steps.identity.outputs.core_commit }}' <<'PY'
          import json
          import pathlib
          import sys

          pin = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if pin.get("schema_version") != 1:
              raise SystemExit("wrapper native-core pin schema mismatch")
          if pin.get("pair_contract") != "codex-gemini-native-harness-v1":
              raise SystemExit("wrapper native-core pair contract mismatch")
          core = pin.get("core") or {}
          if core.get("repository") != sys.argv[2]:
              raise SystemExit("wrapper native-core repository pin mismatch")
          if str(core.get("commit", "")).lower() != sys.argv[3].lower():
              raise SystemExit("wrapper native-core commit pin mismatch")
          PY

      - name: Test wrapper native core gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest wrapper-source/scripts/lib/native-core-bundle.test.py
          bash -n wrapper-source/scripts/stage-native-core.sh
          python3 wrapper-source/scripts/lib/native-core-bundle.py verify \
            --pin wrapper-source/native-core/pin.json \
            --manifest '${{ steps.manifest.outputs.path }}' \
            --binary '${{ steps.binary.outputs.path }}' \
            --target linux-x86_64

      - name: Stage verified real native core
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/native-core-stage/codex"
          mkdir -p "$(dirname "$destination")"
          printf '#!/bin/sh\necho old-core\n' > "$destination"
          chmod 0755 "$destination"
          bash wrapper-source/scripts/stage-native-core.sh \
            --binary '${{ steps.binary.outputs.path }}' \
            --manifest '${{ steps.manifest.outputs.path }}' \
            --destination "$destination" \
            --target linux-x86_64
          test -x "$destination"
          test -f "$destination.previous"
          test "$(sha256sum "$destination" | cut -d' ' -f1)" = '${{ steps.binary.outputs.sha256 }}'
          printf 'path=%s\n' "$destination" >> "$GITHUB_OUTPUT"

      - name: Write immutable pair receipt
        id: receipt
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/codex-gemini-pair-receipt.json"
          python3 - \
            "$receipt" \
            '${{ steps.identity.outputs.core_commit }}' \
            '${{ steps.identity.outputs.wrapper_commit }}' \
            '${{ steps.binary.outputs.sha256 }}' \
            '${{ steps.binary.outputs.size_bytes }}' \
            "$RUNNER_TEMP/codex-file-description.txt" \
            '${{ steps.manifest.outputs.path }}' \
            '${{ steps.source_contract.outcome }}' <<'PY'
          import json
          import pathlib
          import sys

          file_description = pathlib.Path(sys.argv[6]).read_text(encoding="utf-8").strip()
          manifest = json.loads(pathlib.Path(sys.argv[7]).read_text(encoding="utf-8"))
          receipt = {
              "schema_version": 2,
              "pair_contract": manifest["pair_contract"],
              "core_repository": "Semogtw/codex-gemini-agents",
              "core_commit": sys.argv[2].lower(),
              "wrapper_repository": "Semogtw/codex-desktop-linux-gemini-",
              "wrapper_commit": sys.argv[3].lower(),
              "binary_relative_name": "codex",
              "binary_sha256": sys.argv[4].lower(),
              "binary_size_bytes": int(sys.argv[5]),
              "file_description": file_description,
              "target": manifest["target"],
              "source_contract_status": sys.argv[8],
              "staging_status": "verified-and-staged-in-ci",
          }
          pathlib.Path(sys.argv[1]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          printf 'path=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Verify product checkouts stayed clean
        shell: bash
        run: |
          set -euo pipefail
          git -C core-source diff --exit-code
          git -C wrapper-source diff --exit-code
          test -z "$(git -C core-source status --porcelain=v1)"
          test -z "$(git -C wrapper-source status --porcelain=v1)"

      - name: Upload immutable pair build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-gemini-pair-${{ steps.identity.outputs.core_commit }}-${{ steps.identity.outputs.wrapper_commit }}
          path: |
            ${{ steps.binary.outputs.path }}
            ${{ steps.manifest.outputs.path }}
            ${{ steps.receipt.outputs.path }}
            ${{ runner.temp }}/codex-elf-header.txt
            ${{ runner.temp }}/codex-file-description.txt
            ${{ runner.temp }}/pair-core-source-verification.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 7

      - name: Enforce deterministic source contract
        if: steps.source_contract.outcome != 'success'
        shell: bash
        run: |
          echo 'Deterministic core source contract failed; staging evidence was preserved above.' >&2
          exit 1
