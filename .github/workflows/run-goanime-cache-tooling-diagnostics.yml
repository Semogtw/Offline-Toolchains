name: Run GoAnime cache tooling diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-cache-diagnostics/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-cache-tooling-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-cache-diagnostics/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = 'goanime'
          test "$branch" = 'main'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require read-only private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source
        working-directory: private-source
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ steps.request.outputs.sha }}'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Analyze provider catalog executable
        working-directory: private-source
        run: dart analyze tools/provider_catalog_cache.dart

      - name: Analyze MAL provider executable
        working-directory: private-source
        run: dart analyze tools/build_mal_provider_availability_cache.dart

      - name: Provider catalog full file attempt 1
        id: full1
        continue-on-error: true
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/tools/provider_catalog_cache_test.dart

      - name: Provider catalog full file attempt 2
        id: full2
        continue-on-error: true
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 --reporter expanded test/tools/provider_catalog_cache_test.dart

      - name: Provider catalog randomized file
        id: randomized
        continue-on-error: true
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 --test-randomize-ordering-seed=1701 test/tools/provider_catalog_cache_test.dart

      - name: Live crawler runtime diagnostic
        id: crawl
        continue-on-error: true
        working-directory: private-source
        shell: bash
        env:
          CACHE_BUILDER_MAX_RUNTIME_MINUTES: '5'
        run: |
          set +e
          output="$(dart run tools/provider_catalog_cache.dart --minimum-provider-entries=1 2>&1)"
          status=$?
          if [ "$status" -ne 0 ]; then
            summary="$(printf '%s\n' "$output" | tail -n 8 | tr '\n' ' ' | sed -E 's#https?://[^ ]+#<url>#g; s#/[A-Za-z0-9_.@:+-]+/private-source/#<private-source>/#g' | cut -c1-1200)"
            echo "::error title=GoAnime provider crawler runtime::exit=$status $summary"
            exit "$status"
          fi
          printf '%s\n' "$output" | tail -n 12

      - name: Pinpoint live Goyabu parser failure
        id: goyabu
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          cat > tool/_goyabu_catalog_probe.dart <<'DART'
          import 'dart:io';

          import 'package:http/http.dart' as http;

          import '../tools/provider_catalog_cache.dart' as catalog;

          Future<void> main() async {
            final uri = Uri.parse('https://goyabu.io/lista-de-animes');
            final response = await http.get(
              uri,
              headers: const <String, String>{
                HttpHeaders.userAgentHeader:
                    'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36',
              },
            );
            stdout.writeln('HTTP ${response.statusCode}; bytes=${response.bodyBytes.length}');
            try {
              final parsed = catalog.parseGoyabuCatalogPage(
                response.body,
                pageUrl: uri,
              );
              stdout.writeln(
                'parsed entries=${parsed.entries.length}; pages=${parsed.paginationPages.length}',
              );
            } catch (error, stackTrace) {
              stderr.writeln('GOYABU_PARSE_ERROR=${error.runtimeType}: $error');
              final lines = stackTrace.toString().split('\n').take(8);
              for (final line in lines) {
                stderr.writeln(line.replaceAll(RegExp(r'/[^ ]+/private-source/'), '<private-source>/'));
              }
              exitCode = 17;
            }
          }
          DART
          set +e
          output="$(dart run tool/_goyabu_catalog_probe.dart 2>&1)"
          status=$?
          rm -f tool/_goyabu_catalog_probe.dart
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            summary="$(printf '%s\n' "$output" | tail -n 10 | tr '\n' ' ' | sed -E 's#https?://[^ ]+#<url>#g' | cut -c1-1600)"
            echo "::warning title=Goyabu parser trace::$summary"
          fi
          exit "$status"

      - name: Production provider catalog audit
        id: production
        working-directory: private-source
        shell: bash
        env:
          CACHE_BUILDER_MAX_RUNTIME_MINUTES: '5'
        run: |
          set -euo pipefail
          dart run tools/provider_catalog_cache.dart >/dev/null
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('assets/data/anime_provider_catalog_manifest.json').read_text(encoding='utf-8'))
          providers = manifest.get('providers') or {}
          required = ('animefire', 'animesonline', 'goyabu', 'anitube')
          for provider in required:
              info = providers.get(provider) or {}
              status = str(info.get('status') or 'missing')
              count = int(info.get('count') or 0)
              attempted = int(info.get('attemptedUrls') or 0)
              successful = int(info.get('successfulUrls') or 0)
              print(f'::notice title=GoAnime provider audit::{provider}: status={status}, titles={count}, urls={successful}/{attempted}')
          print(f'::notice title=GoAnime catalog union::titles={int(manifest.get("availableTitleCount") or 0)}, allProvidersComplete={bool(manifest.get("allProvidersComplete"))}')
          PY

      - name: Test MAL provider provenance tooling
        working-directory: private-source
        run: flutter test --no-pub --reporter expanded test/tools/build_mal_provider_availability_cache_test.dart

      - name: Diagnostics summary
        if: always()
        shell: bash
        run: |
          echo '## GoAnime cache diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full file attempt 1: `${{ steps.full1.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Full file attempt 2: `${{ steps.full2.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Randomized file: `${{ steps.randomized.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Live crawler: `${{ steps.crawl.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Goyabu parser probe: `${{ steps.goyabu.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production provider audit: `${{ steps.production.outcome }}`' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
