name: Run GoAnime enabled manga live matrix privately

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-enabled-live-matrix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-enabled-live-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  live-source:
    name: Live ${{ matrix.source }}
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - ptbr.astratoons
          - ptbr.capitoons
          - ptbr.kivaratoons
          - ptbr.leituramanga
          - ptbr.maidscan
          - ptbr.mangadash
          - ptbr.mangaflix
          - ptbr.mangalivreblog
          - ptbr.ninjascan

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-enabled-live-matrix/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Probe enabled provider live
        working-directory: private-source
        shell: bash
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          set -euo pipefail
          log="/tmp/goanime-manga-enabled-live.log"
          set +e
          timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$SOURCE_ID" >"$log" 2>&1
          status=$?
          set -e
          grep -E '^(search_[0-9]+|search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|terminal)=' "$log" || true
          if [ "$status" -eq 0 ] && grep -q '^terminal=readable$' "$log"; then
            echo 'live_result=readable'
            exit 0
          fi
          echo 'live_result=not_readable'
          echo "exit_status=$status"
          tail -n 20 "$log" | sed -E 's#https?://[^ ]+#<url>#g' || true
          exit 1

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" /tmp/goanime-manga-enabled-live.log
