name: Validate GoAnime bounded image lookup caches

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-image-cache-bounds/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-image-cache-bounds
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-image-cache-bounds/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Validate patcher syntax
        working-directory: trusted-source
        run: python3 -m py_compile scripts/prepare-goanime-image-cache-bounds.py

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify current remote head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/GoAnime-Mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Apply bounded cache patch
        run: python3 trusted-source/scripts/prepare-goanime-image-cache-bounds.py --root private-source

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies and validate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/services/anime_image_cache_service.dart test/services/anime_image_cache_service_test.dart >/dev/null
          git -c core.whitespace=cr-at-eol diff --check
          dart analyze lib/services/anime_image_cache_service.dart test/services/anime_image_cache_service_test.dart
          flutter test --no-pub --concurrency=1 test/services/anime_image_cache_service_test.dart
          printf '%s\n' \
            lib/services/anime_image_cache_service.dart \
            test/services/anime_image_cache_service_test.dart | sort > "$RUNNER_TEMP/expected.txt"
          git diff --name-only | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Publish validated outputs to Toolchains
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          put_content() {
            local output="$1"
            local message="$2"
            local encoded="$3"
            local attempt current
            for attempt in 1 2 3 4 5 6; do
              current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$output?ref=main" --jq .sha 2>/dev/null || true)"
              args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$output" -f message="$message" -f content="$encoded" -f branch=main)
              if [ -n "$current" ]; then args+=(-f sha="$current"); fi
              if gh api "${args[@]}" >/dev/null 2>&1; then
                return 0
              fi
              sleep "$attempt"
            done
            echo "Failed to publish $output after retries" >&2
            return 1
          }

          prefix="generated/goanime-image-cache-bounds/$TARGET_SHA"
          for file in lib/services/anime_image_cache_service.dart test/services/anime_image_cache_service_test.dart; do
            output="$prefix/$file"
            encoded="$(base64 -w0 "private-source/$file")"
            put_content "$output" "ci(goanime): publish validated bounded image cache output" "$encoded"
          done
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Record gate status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          OUTPUT_PREFIX: ${{ steps.publish.outputs.prefix }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'status': os.environ['GATE_STATUS'],
            'targetSha': os.environ.get('TARGET_SHA') or None,
            'outputPrefix': os.environ.get('OUTPUT_PREFIX') or None,
            'runId': os.environ.get('GITHUB_RUN_ID'),
          }, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='status/goanime-image-cache-bounds.json'
          for attempt in 1 2 3 4 5 6; do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message="ci(goanime): record bounded image cache status" -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
