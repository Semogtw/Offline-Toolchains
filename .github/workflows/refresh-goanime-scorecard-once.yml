name: Refresh GoAnime scorecard once

on:
  push:
    paths:
      - '.github/workflows/refresh-goanime-scorecard-once.yml'

permissions:
  contents: read

env:
  GOANIME_EXPECTED_SHA: 97d4e227a45dae84b0b6b8ed2b21715c9aaaf819
  GOANIME_BRANCH: feat/experimental-ai-buffered-upscaling-20260830

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_EXPECTED_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Regenerate deterministic scorecard and push one-file commit
        working-directory: goanime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOANIME_EXPECTED_SHA"

          python3 tools/generate_quality_scorecard.py --write

          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//')
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "docs/quality_scorecard.json"

          git fetch --no-tags origin "refs/heads/${GOANIME_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$GOANIME_EXPECTED_SHA"

          git config user.name 'GoAnime CI'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/quality_scorecard.json
          git commit -m 'chore: refresh quality scorecard'
          git push origin "HEAD:refs/heads/${GOANIME_BRANCH}"
