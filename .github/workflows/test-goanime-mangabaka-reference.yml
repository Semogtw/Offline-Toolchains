name: Test GoAnime MangaBaka identity and recommendation pipeline

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangabaka-reference/*.request'

permissions:
  contents: read

jobs:
  verify:
    name: Exact-SHA MangaBaka identity, SQLite sidecar and source checks
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout trusted toolchains trigger
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve requested immutable GoAnime commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangabaka-reference/*.request' | head -n 1)"
          test -n "$request"
          sha="$(tr -d '[:space:]' < "control/$request")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve locked Dart dependencies
        working-directory: private-source
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/goanime_core && dart pub get --enforce-lockfile)

      - name: Python recommendation and source-publisher tests
        working-directory: private-source
        run: python3 -m unittest -v tools.tests.test_manga_recommendation_index

      - name: Format changed MangaBaka and recommendation sources
        working-directory: private-source
        run: |
          dart format --output=none --set-exit-if-changed \
            tools/manga/manga_reference_resolver.dart \
            tools/manga/manga_reference_index.dart \
            tools/manga/manga_metadata_refresh.dart \
            test/tools/manga_reference_resolver_test.dart \
            test/tools/manga_reference_index_test.dart
          bash -n tools/manga/materialize_global_manga_availability_ci.sh

      - name: Run deterministic MangaBaka and identity tests
        working-directory: private-source
        run: |
          flutter test --no-pub --concurrency=1 \
            test/tools/manga_reference_index_test.dart \
            test/tools/manga_reference_resolver_test.dart \
            test/tools/manga_reference_resolution_checkpoint_test.dart \
            test/tools/manga_reference_resolution_integration_test.dart \
            test/tools/manga/manga_metadata_identity_reconciler_test.dart

      - name: Analyze affected Dart sources
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            tools/manga/manga_reference_resolver.dart \
            tools/manga/manga_reference_index.dart \
            tools/manga/manga_metadata_refresh.dart \
            test/tools/manga_reference_resolver_test.dart \
            test/tools/manga_reference_index_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf private-source control
