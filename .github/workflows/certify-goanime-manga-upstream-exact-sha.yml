name: Certify GoAnime manga upstream exact SHA

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-upstream-exact/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-manga-upstream-exact
  cancel-in-progress: false

jobs:
  resolve:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.request.outputs.sha }}
      branch: ${{ steps.request.outputs.branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: request
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-upstream-exact/*.request' | head -n1)"
          test -n "$request"
          read -r project branch requested_sha < "$request"
          test "$project" = goanime
          test "$branch" = 'codex/manga-parity-20260823'
          if [[ -n "${requested_sha:-}" ]]; then
            sha="$requested_sha"
          else
            auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
            sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$branch" | awk '{print $1}')"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"
          printf 'Resolved %s to exact SHA %s\n' "$branch" "$sha" >> "$GITHUB_STEP_SUMMARY"

  static:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: source
        run: |
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
      - name: Provider, manifest and tooling gates
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/services/manga/providers/mangalivre_org_manga_provider.dart \
            test/services/manga/providers/mangalivre_org_manga_provider_test.dart >/dev/null
          flutter test --no-pub --concurrency=2 test/services/manga/providers
          flutter test --no-pub --concurrency=1 \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart
          python3 -m unittest tools.tests.test_audit_keiyoushi_provider_drift
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m compileall -q tools
          python3 tools/validate_repository_guards.py
          bash tools/validate_release_workflows.sh
          bash tools/validate_project_health.sh
          flutter analyze --no-pub
          git diff --check

  live:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        source:
          - ptbr.arthurscan
          - ptbr.astratoons
          - ptbr.capitoons
          - ptbr.hqnow
          - ptbr.hipertoon
          - ptbr.kamisamaexplorer
          - ptbr.kivaratoons
          - ptbr.leituramanga
          - ptbr.ler999
          - ptbr.littletyrant
          - ptbr.maidscan
          - ptbr.mangadash
          - ptbr.mangaflix
          - ptbr.mangalivreblog
          - ptbr.mangalivreorg
          - ptbr.ninjascan
    steps:
      - env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: source
        run: flutter pub get >/dev/null
      - name: Search through reader bytes
        id: probe
        continue-on-error: true
        working-directory: source
        env:
          SOURCE_ID: ${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/live.log"
          set +e
          timeout 300s dart run tools/manga/audit_planned_provider_stage.dart "$SOURCE_ID" > "$log" 2>&1
          code=$?
          set -e
          terminal="$(grep -E '^terminal=' "$log" | tail -n1 | cut -d= -f2- || true)"
          problem="$(grep -E '^(search_[0-9]+|details|chapters|content_[0-9]+|transport_[0-9]+)=(failure|unreadable)$' "$log" | tail -n1 || true)"
          status="$(grep -E '^[a-z0-9_]+_status=' "$log" | tail -n1 | cut -d= -f2- || true)"
          host="$(grep -E '^[a-z0-9_]+_host=' "$log" | tail -n1 | cut -d= -f2- || true)"
          kind="$(grep -E '^[a-z0-9_]+_kind=' "$log" | tail -n1 | cut -d= -f2- || true)"
          classification=failure
          if [[ "$code" -eq 0 && "$terminal" == readable ]]; then
            classification=readable
          elif [[ "$status" == 403 && "$kind" == httpStatus ]]; then
            classification=external_http_403
          fi
          printf 'classification=%s\nterminal=%s\nproblem=%s\nstatus=%s\nhost=%s\nkind=%s\nexit_code=%s\n' \
            "$classification" "${terminal:-unknown}" "${problem:-none}" "${status:-none}" "${host:-none}" "${kind:-none}" "$code" >> "$GITHUB_OUTPUT"
          grep -E '^(search_[0-9]+|search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|transport_[0-9]+|verifier|terminal|[a-z0-9_]+_(type|kind|status|host))=' "$log" \
            | sed -E 's#https?://[^ ]+#<url>#g' || true
      - name: Publish sanitized per-source receipt
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.resolve.outputs.sha }}
          SOURCE_ID: ${{ matrix.source }}
          CLASSIFICATION: ${{ steps.probe.outputs.classification }}
          TERMINAL: ${{ steps.probe.outputs.terminal }}
          PROBLEM: ${{ steps.probe.outputs.problem }}
          STATUS_CODE: ${{ steps.probe.outputs.status }}
          HOST: ${{ steps.probe.outputs.host }}
          KIND: ${{ steps.probe.outputs.kind }}
          EXIT_CODE: ${{ steps.probe.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(jq -cn \
            --arg control "$CONTROL_SHA" \
            --arg sha "$REVIEWED_SHA" \
            --arg source "$SOURCE_ID" \
            --arg classification "${CLASSIFICATION:-failure}" \
            --arg terminal "${TERMINAL:-unknown}" \
            --arg problem "${PROBLEM:-none}" \
            --arg status "${STATUS_CODE:-none}" \
            --arg host "${HOST:-none}" \
            --arg kind "${KIND:-none}" \
            --arg exitCode "${EXIT_CODE:-unknown}" \
            '{schemaVersion:1,controlSha:$control,goanimeSha:$sha,sourceId:$source,classification:$classification,terminal:$terminal,problem:$problem,statusCode:$status,host:$host,failureKind:$kind,exitCode:$exitCode}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-manga-upstream-exact-live/$CONTROL_SHA/$SOURCE_ID.json"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record manga exact live $SOURCE_ID" -f content="$encoded")
          if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null
      - name: Enforce readable live result
        if: always() && steps.probe.outputs.classification != 'readable'
        run: exit 1

  receipt:
    needs: [resolve, static, live]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish exact-SHA receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          STATIC: ${{ needs.static.result }}
          MATRIX_LIVE: ${{ needs.live.result }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          dir="results/goanime-manga-upstream-exact-live/$CONTROL_SHA"
          files_json="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dir" 2>/dev/null || printf '[]')"
          mapfile -t paths < <(printf '%s' "$files_json" | jq -r '.[].path')
          combined='[]'
          for path in "${paths[@]}"; do
            encoded="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .content | tr -d '\n')"
            payload="$(printf '%s' "$encoded" | base64 -d)"
            combined="$(jq -cn --argjson current "$combined" --argjson item "$payload" '$current + [$item]')"
          done

          expected=16
          accounted="$(printf '%s' "$combined" | jq 'length')"
          readable="$(printf '%s' "$combined" | jq '[.[] | select(.classification == "readable")] | length')"
          blocked="$(printf '%s' "$combined" | jq '[.[] | select(.classification == "external_http_403")] | length')"
          failures="$(printf '%s' "$combined" | jq '[.[] | select(.classification != "readable" and .classification != "external_http_403")] | length')"
          blocked_sources="$(printf '%s' "$combined" | jq -c '[.[] | select(.classification == "external_http_403") | .sourceId] | sort')"
          failure_sources="$(printf '%s' "$combined" | jq -c '[.[] | select(.classification != "readable" and .classification != "external_http_403") | .sourceId] | sort')"

          live_state=failure
          if [[ "$accounted" -eq "$expected" && "$readable" -eq "$expected" ]]; then
            live_state=success
          elif [[ "$accounted" -eq "$expected" && "$failures" -eq 0 && $((readable + blocked)) -eq "$expected" && "$blocked" -gt 0 ]]; then
            live_state=blocked_external
          fi

          state=failure
          if [[ "$STATIC" == success && "$live_state" == success ]]; then
            state=success
          elif [[ "$STATIC" == success && "$live_state" == blocked_external ]]; then
            state=blocked_external
          fi

          result="$(jq -cn \
            --arg state "$state" \
            --arg sha "$SHA" \
            --arg static "$STATIC" \
            --arg live "$live_state" \
            --arg matrixLive "$MATRIX_LIVE" \
            --arg control "$CONTROL_SHA" \
            --argjson expected "$expected" \
            --argjson accounted "$accounted" \
            --argjson readable "$readable" \
            --argjson blocked "$blocked" \
            --argjson failures "$failures" \
            --argjson blockedSources "$blocked_sources" \
            --argjson failureSources "$failure_sources" \
            '{schemaVersion:3,state:$state,goanimeSha:$sha,static:$static,live:$live,matrixLiveResult:$matrixLive,enabledProviders:$expected,accountedProviders:$accounted,readableProviders:$readable,externalHttp403Providers:$blocked,failedProviders:$failures,blockedSources:$blockedSources,failureSources:$failureSources,exactSha:true,controlSha:$control}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-manga-upstream-exact/${SHA}.json"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record manga upstream exact ${SHA:0:8}" -f content="$encoded")
          if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
