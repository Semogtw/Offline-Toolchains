name: Run GoAnime manga bundled catalog private CI

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-bundled/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-bundled-private-ci
  cancel-in-progress: false

jobs:
  bundled:
    name: GoAnime manga bundled catalog tests
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private manga branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feature/manga-platform
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get >/dev/null

      - name: Test enumerable bundled catalog
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_bundled_catalog_source_test.dart

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
