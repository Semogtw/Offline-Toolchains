name: Validate GoAnime manga source candidates

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-source-candidates/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-source-candidates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate manga source candidates
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-source-candidates/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify branch still points to reviewed SHA
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze candidate provider scope
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            lib/services/manga/providers/mangadex_manga_provider.dart \
            lib/services/manga/providers/taimu_manga_provider.dart \
            lib/services/manga/providers/manhastro_manga_provider.dart \
            test/services/manga/providers/mangadex_manga_provider_test.dart \
            test/services/manga/providers/taimu_manga_provider_test.dart \
            test/services/manga/providers/manhastro_manga_provider_test.dart

      - name: Test candidate provider adapters
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/services/manga/providers/mangadex_manga_provider_test.dart \
            test/services/manga/providers/taimu_manga_provider_test.dart \
            test/services/manga/providers/manhastro_manga_provider_test.dart

      - name: Inspect candidate rollout metadata
        working-directory: private-source
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          ids = {'ptbr.mangadex', 'ptbr.taimumangas', 'ptbr.manhastro'}
          manifest = json.loads(Path('docs/manga_sources_ptbr.json').read_text())
          records = {
              row.get('goanimeSourceId'): row
              for row in manifest.get('providerRecords', [])
              if isinstance(row, dict) and row.get('goanimeSourceId') in ids
          }
          print('manifest_candidate_records=' + json.dumps(records, ensure_ascii=False, sort_keys=True))

          pins_path = Path('docs/manga_provider_behavior_pins.json')
          if pins_path.exists():
              pins = json.loads(pins_path.read_text())
              matches = []
              def visit(value, path='$'):
                  if isinstance(value, dict):
                      serialized = json.dumps(value, ensure_ascii=False)
                      if any(source_id in serialized for source_id in ids):
                          matches.append({'path': path, 'value': value})
                      for key, child in value.items():
                          if isinstance(child, (dict, list)):
                              visit(child, f'{path}.{key}')
                  elif isinstance(value, list):
                      for index, child in enumerate(value):
                          if isinstance(child, (dict, list)):
                              visit(child, f'{path}[{index}]')
              visit(pins)
              leaves = []
              seen = set()
              for match in reversed(matches):
                  raw = json.dumps(match['value'], ensure_ascii=False, sort_keys=True)
                  if raw in seen:
                      continue
                  seen.add(raw)
                  leaves.append(match)
                  if len(leaves) >= 12:
                      break
              print('behavior_pin_candidate_matches=' + json.dumps(list(reversed(leaves)), ensure_ascii=False, sort_keys=True))
          PY

      - name: Audit Manhastro catalog safety
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          set +e
          timeout 240s dart run tools/manga/audit_planned_provider_catalog_safety.dart ptbr.manhastro | tee /tmp/manhastro_safety_sample.log
          sample_status=${PIPESTATUS[0]}
          set -e
          echo "manhastro_sample_audit_status=$sample_status"

          curl --fail --silent --show-error --location --max-time 60 \
            https://api2.manhastro.net/dados -o /tmp/manhastro_catalog.json
          python3 - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          text = Path('/tmp/manhastro_catalog.json').read_text(errors='replace').strip()
          if text.startswith('\ufeff'):
              text = text[1:].lstrip()
          if text.startswith(")]}'"):
              text = text[4:].lstrip()
          if text.startswith(','):
              text = text[1:].lstrip()
          if text.startswith('_'):
              text = text[1:].lstrip()
          payload = json.loads(text)
          rows = payload.get('data', []) if isinstance(payload, dict) else []
          markers = ('hentai', '18+', '+18', 'adult', 'porn', 'sexo explícito', 'sexo explicito', 'erotica', 'erótica', 'erotico', 'erótico')
          genre_counts = Counter()
          explicit = 0
          for row in rows:
              if not isinstance(row, dict):
                  continue
              genres = row.get('generos') if isinstance(row.get('generos'), list) else []
              genre_texts = [str(value).strip() for value in genres if str(value).strip()]
              genre_counts.update(genre_texts)
              title = ' '.join(str(row.get(key, '') or '') for key in ('titulo_brasil', 'titulo'))
              haystack = (title + ' ' + ' '.join(genre_texts)).lower()
              if any(marker in haystack for marker in markers):
                  explicit += 1
          total = sum(1 for row in rows if isinstance(row, dict))
          ratio = (explicit / total) if total else 0.0
          print(f'manhastro_catalog_total={total}')
          print(f'manhastro_explicit_marker_occurrences={explicit}')
          print(f'manhastro_explicit_marker_ratio={ratio:.6f}')
          print('manhastro_top_genres=' + json.dumps(genre_counts.most_common(20), ensure_ascii=False))
          PY

      - name: Add ephemeral manifest diagnostics
        working-directory: private-source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          validator = Path('lib/services/manga/manga_remote_manifest_validator.dart')
          text = validator.read_text()
          text = text.replace(
              "throw StateError('Provider returned content from an unapproved host.');",
              "throw StateError('Provider returned content from an unapproved host: ${uri.host}.');",
          )
          validator.write_text(text)

          audit = Path('tools/manga/audit_planned_provider_stage.dart')
          text = audit.read_text()
          needle = "  stdout.writeln('${stage}_type=${error.runtimeType}');\n"
          replacement = needle + "  if (error is StateError) stdout.writeln('${stage}_detail=${error.toString()}');\n"
          if needle not in text:
              raise SystemExit('audit diagnostic insertion point not found')
          audit.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Probe live candidates including page bytes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          for source in ptbr.mangadex ptbr.taimumangas ptbr.manhastro; do
            log="/tmp/${source//./_}.log"
            set +e
            timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$source" >"$log" 2>&1
            status=$?
            set -e
            echo "source=$source"
            grep -E '^(search_[0-9]+|search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|transport_[0-9]+|verifier|terminal|[a-z0-9_]+_(type|kind|status|host|detail))=' "$log" || true
            if [ "$status" -ne 0 ] || ! grep -q '^terminal=readable$' "$log"; then
              failed=1
              echo "candidate_result=not_readable"
            else
              echo "candidate_result=readable"
            fi
            rm -f "$log"
          done
          exit "$failed"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" /tmp/ptbr_*.log /tmp/manhastro_*.log /tmp/manhastro_catalog.json
