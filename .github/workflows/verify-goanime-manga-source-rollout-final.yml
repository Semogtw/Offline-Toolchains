name: Verify GoAnime manga source rollout final

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-source-final-verify/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-source-final-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify final manga rollout exact SHA
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-source-final-verify/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify branch still points to exact SHA
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          test "$(git -C private-source rev-parse HEAD)" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Verify docs manifest registry providers and bundled DB
        working-directory: private-source
        run: |
          flutter test --no-pub --concurrency=1 \
            test/architecture/documentation_drift_test.dart \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart \
            test/services/manga/providers/mangadex_manga_provider_test.dart \
            test/services/manga/providers/taimu_manga_provider_test.dart \
            test/services/manga/providers/manhastro_manga_provider_test.dart \
            test/services/manga/manga_http_client_persistence_test.dart \
            test/services/manga/manga_bundled_catalog_source_test.dart \
            test/services/manga/manga_bundled_catalog_v3_source_test.dart \
            test/tools/manga_inventory_search_retry_test.dart \
            test/tools/inventory_manga_catalog_selection_test.dart \
            test/tools/build_global_manga_availability_test.dart

      - name: Analyze final rollout scope
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            tools/manga/validate_manga_provider_manifest.dart \
            tools/manga/inventory_manga_catalog.dart \
            tools/manga/manga_inventory_search_retry.dart \
            lib/services/manga/default_manga_source_providers.dart \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_http_client.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_provider_definitions.dart \
            lib/services/manga/manga_provider_definitions_wave5.dart \
            lib/services/manga/providers/mangadex_manga_provider.dart \
            lib/services/manga/providers/taimu_manga_provider.dart \
            lib/services/manga/providers/manhastro_manga_provider.dart \
            test/services/manga/manga_http_client_persistence_test.dart \
            test/services/manga/providers/mangadex_manga_provider_test.dart \
            test/services/manga/providers/taimu_manga_provider_test.dart \
            test/services/manga/providers/manhastro_manga_provider_test.dart \
            test/tools/manga_inventory_search_retry_test.dart \
            test/tools/inventory_manga_catalog_selection_test.dart
          bash -n tools/manga/materialize_global_manga_availability_ci.sh

      - name: Verify current bundled receipt and runtime cohort
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('docs/manga_sources_ptbr.json').read_text())
          enabled = [
              row['goanimeSourceId']
              for row in manifest.get('providerRecords', [])
              if isinstance(row, dict) and row.get('implementationState') == 'enabled'
          ]
          assert len(enabled) == 18, enabled
          assert 'ptbr.mangadex' in enabled, enabled
          assert 'ptbr.manhastro' in enabled, enabled
          planned = {
              row['goanimeSourceId']
              for row in manifest.get('providerRecords', [])
              if isinstance(row, dict) and row.get('implementationState') == 'planned'
          }
          assert 'ptbr.taimumangas' in planned, planned
          assert 'ptbr.taimumangas' not in enabled, enabled

          receipts = sorted(Path('docs').glob('manga_global_availability_receipt_*.md'))
          assert receipts, 'No global manga availability receipt found'
          receipt = receipts[-1]
          text = receipt.read_text()
          assert 'Enabled providers: **18**' in text, text[:500]
          assert '| `ptbr.mangadex` | exhausted |' in text, 'MangaDex partition is not exhaustive'
          assert '| `ptbr.manhastro` | exhausted |' in text, 'Manhastro partition is not exhaustive'
          assert 'Providers refreshed exhaustively: **2**' in text, 'Targeted refresh receipt is missing'
          assert 'Providers carried forward: **16**' in text, 'Unexpected carried provider count'
          print(f'receipt={receipt}')
          print('enabled_runtime=18')
          print('taimu_state=planned')
          for line in text.splitlines():
              if line.startswith(('- Providers refreshed exhaustively:', '- Providers carried forward:', '- Canonical works bundled:', '- Source occurrences bundled:', '- Readable-proven links:', '- Listed-only links:')):
                  print(line)
          PY
          ! grep -Fq "enabledProviders'] == 16" tools/manga/materialize_global_manga_availability_ci.sh

      - name: Checkout current Keiyoushi source history
        uses: actions/checkout@v6
        with:
          repository: keiyoushi/extensions-source
          ref: 7bd03614b6d2186262e50a6fae1707f45d063989
          path: extensions-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify behavior drift remains clean
        working-directory: private-source
        run: |
          python3 tools/manga/audit_keiyoushi_provider_drift.py \
            --manifest docs/manga_sources_ptbr.json \
            --source-repo ../extensions-source \
            --head 7bd03614b6d2186262e50a6fae1707f45d063989 \
            --json-output /tmp/manga-provider-drift.json
          python3 - <<'PY'
          import json
          data = json.load(open('/tmp/manga-provider-drift.json'))
          summary = data['summary']
          assert summary['enabledProviders'] == 18, summary
          assert summary['clean'] == 18, summary
          assert summary['review-needed'] == 0, summary
          assert summary['critical'] == 0, summary
          assert summary['untracked'] == 0, summary
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Fresh byte probes for promoted sources
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          for source in ptbr.mangadex ptbr.manhastro; do
            log="/tmp/${source//./_}.final.log"
            timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$source" >"$log" 2>&1
            echo "source=$source"
            grep -E '^(search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|transport_[0-9]+|verifier|terminal)=' "$log" || true
            grep -q '^terminal=readable$' "$log"
          done

      - name: Remove private checkouts
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/extensions-source" "$GITHUB_WORKSPACE/control" /tmp/*.final.log /tmp/manga-provider-drift.json
