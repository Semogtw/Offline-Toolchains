name: Request private source bundle

on:
  push:
    branches:
      - build/semogsite-source-bundles
      - build/hydra-source-bundles
    paths:
      - triggers/semogsite-source-bundle.json
      - triggers/hydra-source-bundle.json
  pull_request:
    paths:
      - .github/workflows/request-private-source-bundle.yml
      - .github/workflows/request-goanime-source-bundle.yml
      - .github/workflows/record-goanime-source-receipt.yml
      - .github/workflows/build-private-source-bundle.yml
      - .github/workflows/build-private-semogsite-source-bundle.yml
      - .github/workflows/build-private-hydra-source-bundle.yml
      - .github/workflows/build-hydra.yml
      - scripts/validate-source-bundle-request.py
      - scripts/assemble-source-bundle.sh
      - scripts/build-hydra-toolchain.sh
      - scripts/validate-private-source-workflows.sh
      - scripts/validate-source-receipt-workflow.sh
      - keys/source-bundles-public.asc
      - triggers/private-source-bundle.json
      - triggers/semogsite-source-bundle.json
      - triggers/hydra-source-bundle.json
      - triggers/hydra-toolchain.json
      - docs/GOANIME_SOURCE_BUNDLE.md
      - docs/HYDRA_TOOLCHAIN.md
      - README.md
      - docs/superpowers/specs/2026-07-31-private-source-bundles-design.md
      - docs/superpowers/plans/2026-07-31-private-source-bundles.md

permissions:
  contents: read

jobs:
  validate:
    name: Validate public request and encryption key
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate request schemas
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-source-bundle-request.py \
            triggers/semogsite-source-bundle.json
          python3 scripts/validate-source-bundle-request.py \
            triggers/hydra-source-bundle.json

      - name: Verify committed encryption key
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          export GNUPGHOME="$RUNNER_TEMP/request-keyring"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --import keys/source-bundles-public.asc
          fingerprint="$({
            gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT"
          } | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          test -z "$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1 == "sec" { print $1 }')"

      - name: Run static security guards
        shell: bash
        run: |
          bash scripts/validate-private-source-workflows.sh
          bash scripts/validate-source-receipt-workflow.sh
