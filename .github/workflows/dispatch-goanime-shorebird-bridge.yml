name: Dispatch GoAnime Shorebird patch

on:
  push:
    branches:
      - main
    paths:
      - triggers/goanime-shorebird-dispatch/*.request

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch private app Shorebird workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exact Shorebird workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          APP_REPOSITORY: Semogtw/goanime-mobile
          APP_REF: fix/megaplay-bootstrap-shorebird-20260826
          RELEASE_VERSION: 1.26.1+32
          PLATFORMS: android,windows,linux
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh workflow run .github/workflows/shorebird_patch.yml             --repo "$APP_REPOSITORY"             --ref "$APP_REF"             -f release_version="$RELEASE_VERSION"             -f platforms="$PLATFORMS"

          for attempt in {1..12}; do
            run="$(gh run list               --repo "$APP_REPOSITORY"               --workflow .github/workflows/shorebird_patch.yml               --branch "$APP_REF"               --event workflow_dispatch               --limit 1               --json databaseId,status,headSha,url,createdAt               --jq '.[0] // empty')"
            if [[ -n "$run" ]]; then
              echo "$run"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Shorebird workflow dispatch was accepted but no run appeared."
          exit 1
