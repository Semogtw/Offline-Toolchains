name: Probe GoAnime provider access

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-goanime-provider-access.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Probe AnimeFire public endpoints
        shell: bash
        run: |
          set -euo pipefail
          ua='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
          for url in \
            'https://animefire.io/' \
            'https://animefire.io/animes-atualizados' \
            'https://animefire.io/animes-atualizados/2' \
            'https://animefire.io/lista-de-animes-legendados' \
            'https://animefire.io/lista-de-animes-dublados' \
            'https://animefire.io/pesquisar/one-piece' \
            'https://animefire.io/sitemap.xml' \
            'https://r.jina.ai/https://animefire.io/animes-atualizados'; do
            code="$(curl -L --max-time 25 -sS -o /tmp/body -w '%{http_code}' -A "$ua" -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' "$url" || true)"
            bytes="$(wc -c </tmp/body 2>/dev/null || echo 0)"
            printf '%s -> HTTP %s, %s bytes\n' "$url" "$code" "$bytes"
          done
