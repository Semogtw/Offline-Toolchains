name: Smoke private Hydra source discovery

on:
  push:
    branches: [main]
    paths:
      - "triggers/hydra-source-smoke/*.request"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hydra-source-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: github.repository_owner == 'Semogtw'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
    steps:
      - name: Require private repository token
        shell: bash
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact smoke request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            request="$(find toolchain-control/triggers/hydra-source-smoke -maxdepth 1 -type f -name '*.request' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-)"
          else
            request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/hydra-source-smoke/*.request' | head -n 1)"
            request="toolchain-control/$request"
          fi
          test -n "$request"
          read -r project branch expected_sha < "$request"
          test "$project" = "hydra"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "request_path=$request" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private Hydra revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ steps.request.outputs.expected_sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify requested branch still points to revision
        working-directory: private-source
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/HydraPersonalizado.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          check-latest: false

      - name: Activate Yarn 1
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: private-source/python_rpc/requirements-scrapling.txt

      - name: Install JavaScript dependencies without build side effects
        id: deps
        working-directory: private-source
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Install Electron runtime only
        id: electron
        working-directory: private-source
        run: node node_modules/electron/install.js

      - name: Install pinned Scrapling runtime
        id: scrapling
        working-directory: private-source
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/private-source/hydra-scrapling-browser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python_rpc/requirements-scrapling.txt
          scrapling install --force

      - name: Smoke GameBounty through production discovery ladder
        id: gamebounty
        working-directory: private-source
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/private-source/hydra-scrapling-browser
        run: |
          xvfb-run -a ./node_modules/.bin/electron \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            scripts/run-universal-source-real-smoke.cjs

      - name: Smoke Ecológica Verde structured adapter
        id: ecologica
        working-directory: private-source
        run: node scripts/run-ecologica-verde-adapter-smoke.mjs

      - name: Smoke AnkerGames allowlisted adapter
        id: ankergames
        working-directory: private-source
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/private-source/hydra-scrapling-browser
        run: |
          xvfb-run -a ./node_modules/.bin/electron \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            scripts/run-ankergames-real-smoke.cjs

      - name: Smoke real discovery-to-trusted pipeline
        id: trust_pipeline
        working-directory: private-source
        shell: bash
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/private-source/hydra-scrapling-browser
        run: |
          xvfb-run -a ./node_modules/.bin/electron \
            --no-sandbox --disable-gpu --disable-dev-shm-usage \
            scripts/run-real-source-trust-smoke.cjs

      - name: Prove local trusted option writes real bytes
        id: download_e2e
        working-directory: private-source
        shell: bash
        run: |
          node --import ./scripts/register-ts-node.mjs --test \
            src/main/services/local-download-sources/local-source-download-e2e.test.ts \
            src/shared/downloaders.test.ts

      - name: Publish smoke status
        if: ${{ always() && steps.request.outputs.expected_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.expected_sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          ELECTRON_OUTCOME: ${{ steps.electron.outcome }}
          SCRAPLING_OUTCOME: ${{ steps.scrapling.outcome }}
          GAMEBOUNTY_OUTCOME: ${{ steps.gamebounty.outcome }}
          ECOLOGICA_OUTCOME: ${{ steps.ecologica.outcome }}
          ANKERGAMES_OUTCOME: ${{ steps.ankergames.outcome }}
          TRUST_PIPELINE_OUTCOME: ${{ steps.trust_pipeline.outcome }}
          DOWNLOAD_E2E_OUTCOME: ${{ steps.download_e2e.outcome }}
        run: |
          set -euo pipefail
          status=success
          for outcome in "$DEPS_OUTCOME" "$ELECTRON_OUTCOME" "$SCRAPLING_OUTCOME" "$GAMEBOUNTY_OUTCOME" "$ECOLOGICA_OUTCOME" "$ANKERGAMES_OUTCOME" "$TRUST_PIPELINE_OUTCOME" "$DOWNLOAD_E2E_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              status=failure
            fi
          done
          result="$(jq -n \
            --arg status "$status" \
            --arg targetSha "$TARGET_SHA" \
            --arg targetBranch "$TARGET_BRANCH" \
            --arg requestPath "$REQUEST_PATH" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deps "$DEPS_OUTCOME" \
            --arg electron "$ELECTRON_OUTCOME" \
            --arg scrapling "$SCRAPLING_OUTCOME" \
            --arg gamebounty "$GAMEBOUNTY_OUTCOME" \
            --arg ecologica "$ECOLOGICA_OUTCOME" \
            --arg ankergames "$ANKERGAMES_OUTCOME" \
            --arg trustPipeline "$TRUST_PIPELINE_OUTCOME" \
            --arg downloadE2e "$DOWNLOAD_E2E_OUTCOME" \
            '{status:$status,targetSha:$targetSha,targetBranch:$targetBranch,requestPath:$requestPath,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),steps:{deps:$deps,electron:$electron,scrapling:$scrapling,gamebounty:$gamebounty,ecologica:$ecologica,ankergames:$ankergames,trustPipeline:$trustPipeline,downloadE2e:$downloadE2e}}')"
          path="hydra-smoke-results/${TARGET_SHA}.json"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=hydra-validation-results" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f "message=test(hydra): record smoke ${TARGET_SHA}" -f "content=${encoded}" -f "branch=hydra-validation-results")
          if [ -n "$current_sha" ]; then
            args+=(-f "sha=${current_sha}")
          fi
          gh api "${args[@]}" >/dev/null
