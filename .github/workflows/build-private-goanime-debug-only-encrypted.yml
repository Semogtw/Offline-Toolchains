name: Build private GoAnime debug APK only

on:
  push:
    branches: [main]
    paths:
      - 'triggers/private-goanime-debug-only.json'

permissions:
  contents: read

concurrency:
  group: private-goanime-debug-only
  cancel-in-progress: true

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout trusted toolchain source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-debug-only.json"
          sha="$(python3 - "$request" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          sha = str(payload.get('ref') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('ref must be an exact 40-character commit SHA')
          print(sha)
          PY
          )"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || {
            echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2
            exit 1
          }

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 50
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact private commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git -C private-source rev-parse HEAD)"
          test "$resolved" = '${{ steps.request.outputs.ref }}'
          echo "sha=$resolved" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Disable Flutter analytics
        working-directory: private-source
        run: flutter config --no-analytics

      - name: Resolve app dependencies
        working-directory: private-source
        run: flutter pub get

      - name: Validate project health
        working-directory: private-source
        shell: pwsh
        run: ./tools/validate_project_health.ps1

      - name: Build Android debug APK
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Validate and encrypt APK
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/private-source/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null

          work="$RUNNER_TEMP/goanime-apk"
          gpg_home="$work/gpg"
          mkdir -p "$gpg_home" "$work/transfer"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"

          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"

          encrypted="$work/transfer/GoAnime-${SOURCE_SHA:0:12}-debug.apk.gpg"
          gpg --batch --yes --trust-model always \
            --recipient "$EXPECTED_FINGERPRINT" \
            --output "$encrypted" \
            --encrypt "$apk"
          test -s "$encrypted"

          python3 - "$work/transfer/manifest.json" "$SOURCE_SHA" "$sha256" "$size" <<'PY'
          import datetime, json, sys
          path, source_sha, sha256, size = sys.argv[1:]
          data = {
              'schema_version': 1,
              'source_sha': source_sha,
              'build_type': 'debug-build-only',
              'apk_sha256': sha256,
              'apk_size_bytes': int(size),
              'encryption': 'OpenPGP',
              'recipient_fingerprint': '2DE29DC31427CF0A911AB96175679291435059B0',
              'created_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'quality_gates': 'project-health-only; format/analyze/tests intentionally not claimed',
          }
          with open(path, 'w', encoding='utf-8') as stream:
              json.dump(data, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY

          rm -rf "$GITHUB_WORKSPACE/private-source" "$gpg_home"
          echo "transfer_dir=$work/transfer" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted APK transfer
        uses: actions/upload-artifact@v7
        with:
          name: goanime-private-debug-apk-build-only-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APK_SHA256: ${{ steps.package.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.package.outputs.apk_size }}
        run: |
          {
            echo '## GoAnime debug APK build-only'
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- APK bytes: \`$APK_SIZE\`"
            echo '- Project health passed.'
            echo '- Format/analyze/tests are not claimed by this build-only workflow.'
            echo '- Only OpenPGP ciphertext was uploaded from the public repository.'
          } >> "$GITHUB_STEP_SUMMARY"
