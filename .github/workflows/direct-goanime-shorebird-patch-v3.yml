name: Direct GoAnime Shorebird patch v3

on:
  push:
    branches:
      - main
    paths:
      - triggers/goanime-shorebird-direct-v3/*.request

permissions:
  contents: read

concurrency:
  group: direct-goanime-shorebird-patch-v3
  cancel-in-progress: true

env:
  GOANIME_REF: 28b3ebecbeb6adb846bf437b5cfd98e2c1d8e0e4
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
  UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
  UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
  UPDATE_MANIFEST_PUBLIC_KEY_ID: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_ID }}
  UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
  ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
  RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}

jobs:
  patch:
    name: Shorebird patch (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: linux
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_REF }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false
          show-progress: false

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable Git long paths
        if: ${{ matrix.platform == 'windows' }}
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install Linux build dependencies
        if: ${{ matrix.platform == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake curl file libgtk-3-dev libjsoncpp-dev liblzma-dev libmpv-dev \
            libsecret-1-0 libsecret-1-dev libsoup-3.0-dev libwebkit2gtk-4.1-dev \
            gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            lld llvm ninja-build pkg-config

      - name: Install app dependencies
        working-directory: private-source
        run: flutter pub get --enforce-lockfile

      - name: Derive runtime database manifest URL
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNTIME_DATABASE_MANIFEST_URL:-}" ] && [ -n "${UPDATE_MANIFEST_URL:-}" ]; then
            case "\$UPDATE_MANIFEST_URL" in
              */latest/update.json)
                echo "RUNTIME_DATABASE_MANIFEST_URL=${UPDATE_MANIFEST_URL%/update.json}/runtime_database_manifest.json" >> "\$GITHUB_ENV"
                ;;
              *)
                echo "::error::RUNTIME_DATABASE_MANIFEST_URL is empty and UPDATE_MANIFEST_URL does not end with /latest/update.json."
                exit 1
                ;;
            esac
          fi

      - name: Validate patch config
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FIREBASE_PROJECT_ID:-}"
          test -n "${FIREBASE_WEB_API_KEY:-}"
          test -n "${UPDATE_MANIFEST_URL:-}"
          test -n "${UPDATE_APPCAST_URL:-}"
          test -n "${UPDATE_MANIFEST_PUBLIC_KEY_ID:-}"
          test -n "${UPDATE_MANIFEST_PUBLIC_KEY_B64:-}"
          test -n "${RUNTIME_DATABASE_MANIFEST_URL:-}"

      - name: Create Shorebird patch
        working-directory: private-source
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
          PATCH_PLATFORM: ${{ matrix.platform }}
          RELEASE_VERSION: latest
        shell: bash
        run: |
          set -euo pipefail
          shorebird patch \
            --platforms="\$PATCH_PLATFORM" \
            --release-version="\$RELEASE_VERSION" \
            --dart-define=FIREBASE_PROJECT_ID="\$FIREBASE_PROJECT_ID" \
            --dart-define=FIREBASE_WEB_API_KEY="\$FIREBASE_WEB_API_KEY" \
            --dart-define=UPDATE_MANIFEST_URL="\$UPDATE_MANIFEST_URL" \
            --dart-define=UPDATE_APPCAST_URL="\$UPDATE_APPCAST_URL" \
            --dart-define=UPDATE_MANIFEST_PUBLIC_KEY_ID="\$UPDATE_MANIFEST_PUBLIC_KEY_ID" \
            --dart-define=UPDATE_MANIFEST_PUBLIC_KEY_B64="\$UPDATE_MANIFEST_PUBLIC_KEY_B64" \
            --dart-define=UPDATE_MANIFEST_SIGNATURE_REQUIRED=true \
            --dart-define=ANIME_METADATA_SEED_MANIFEST_URL="\$ANIME_METADATA_SEED_MANIFEST_URL" \
            --dart-define=RUNTIME_DATABASE_MANIFEST_URL="\$RUNTIME_DATABASE_MANIFEST_URL"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source
