name: One-shot Hydra V2 portable paths

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-portable-paths.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Canonicalize Windows and Wine profile paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/services/cloud-save/google-drive/google-drive-v2-snapshot.ts")
          text = path.read_text()
          old = '''export const portableizeDriveV2SourcePath = (\n  sourcePath: string,\n  context: { homeDir: string; winePrefixPath: string | null }\n) => {\n  let portable = normalizeHostPath(sourcePath);\n  if (context.winePrefixPath) {\n    portable = replacePathPrefix(\n      portable,\n      context.winePrefixPath,\n      "%WINEPREFIX%"\n    );\n  }\n  portable = replacePathPrefix(portable, context.homeDir, "%HOME%");\n\n  if (/^[a-zA-Z]:\\//.test(portable)) {\n    const drive = portable[0].toUpperCase();\n    portable = `%DRIVE_${drive}%/${portable.slice(3)}`;\n  } else if (portable.startsWith("/")) {\n    portable = `%ROOT%/${portable.replace(/^\\/+/, "")}`;\n  }\n\n  return normalizeDriveV2LogicalPath(portable);\n};\n'''
          new = '''const portableizeWindowsProfilePath = (value: string) => {\n  const normalized = normalizeHostPath(value);\n  const driveMatch = /^([a-zA-Z]):\\/(.*)$/.exec(normalized);\n  if (!driveMatch) return normalized;\n\n  const drive = driveMatch[1].toUpperCase();\n  const tail = driveMatch[2];\n  if (drive === "C") {\n    const profile = /^Users\\/[^/]+(?:\\/(.*))?$/i.exec(tail);\n    if (profile) {\n      const profileTail = profile[1] ?? "";\n      const appDataRoaming = /^AppData\\/Roaming(?:\\/(.*))?$/i.exec(\n        profileTail\n      );\n      if (appDataRoaming) {\n        return `%APPDATA%${\n          appDataRoaming[1] ? `/${appDataRoaming[1]}` : ""\n        }`;\n      }\n      const appDataLocal = /^AppData\\/Local(?:\\/(.*))?$/i.exec(\n        profileTail\n      );\n      if (appDataLocal) {\n        return `%LOCALAPPDATA%${\n          appDataLocal[1] ? `/${appDataLocal[1]}` : ""\n        }`;\n      }\n      const documents = /^Documents(?:\\/(.*))?$/i.exec(profileTail);\n      if (documents) {\n        return `%DOCUMENTS%${documents[1] ? `/${documents[1]}` : ""}`;\n      }\n      return `%USERPROFILE%${profileTail ? `/${profileTail}` : ""}`;\n    }\n\n    const programData = /^ProgramData(?:\\/(.*))?$/i.exec(tail);\n    if (programData) {\n      return `%PROGRAMDATA%${programData[1] ? `/${programData[1]}` : ""}`;\n    }\n  }\n\n  return `%DRIVE_${drive}%/${tail}`;\n};\n\nexport const portableizeDriveV2SourcePath = (\n  sourcePath: string,\n  context: { homeDir: string; winePrefixPath: string | null }\n) => {\n  let portable = normalizeHostPath(sourcePath);\n  if (context.winePrefixPath) {\n    // Wine's drive_c is the same logical filesystem namespace as C: on\n    // Windows. Normalize it before the generic prefix token so user/profile\n    // aliases can converge across operating systems.\n    portable = replacePathPrefix(\n      portable,\n      path.join(context.winePrefixPath, "drive_c"),\n      "C:"\n    );\n    portable = replacePathPrefix(\n      portable,\n      context.winePrefixPath,\n      "%WINEPREFIX%"\n    );\n  }\n\n  portable = portableizeWindowsProfilePath(portable);\n  portable = replacePathPrefix(portable, context.homeDir, "%HOME%");\n  if (/^%HOME%\\/Documents(?:\\/|$)/i.test(portable)) {\n    portable = portable.replace(/^%HOME%\\/Documents/i, "%DOCUMENTS%");\n  }\n\n  if (/^[a-zA-Z]:\\//.test(portable)) {\n    portable = portableizeWindowsProfilePath(portable);\n  } else if (portable.startsWith("/")) {\n    portable = `%ROOT%/${portable.replace(/^\\/+/, "")}`;\n  }\n\n  return normalizeDriveV2LogicalPath(portable);\n};\n'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one portable path implementation, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push Hydra path canonicalization
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add src/main/services/cloud-save/google-drive/google-drive-v2-snapshot.ts
          git commit -m "fix(cloud-save): canonicalize Windows and Wine V2 paths"
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot Toolchains files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-portable-paths.yml" "triggers/one-shot-hydra-v2-portable-paths.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed Hydra V2 portable path patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null || true
          done
