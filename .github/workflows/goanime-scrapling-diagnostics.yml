name: GoAnime Scrapling deterministic diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-diagnostics/*.request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: goanime-scrapling-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Mark diagnostics pending
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/goanime_post_status.py \
            --state pending \
            --context goanime-scrapling/diagnostics

      - name: Resolve source-bound request
        id: request
        working-directory: trusted-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-scrapling-diagnostics \
            --workspace .

      - name: Checkout exact private GoAnime source
        id: source_checkout
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact GoAnime revision
        id: source_verify
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_hint }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run MAL input preflight
        id: preflight
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: python3 tools/scrapling_provider_pipeline/mal_input_preflight.py --repo-root .

      - name: Report preflight status
        if: always() && steps.preflight.outcome != 'skipped'
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          python3 scripts/goanime_post_status.py \
            --state "$state" \
            --context goanime-scrapling/preflight

      - name: Stop after preflight failure
        if: steps.preflight.outcome == 'failure'
        run: exit 1

      - name: Mark toolchain pending
        if: steps.preflight.outcome == 'success'
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/goanime_post_status.py \
            --state pending \
            --context goanime-scrapling/toolchain

      - name: Set up Python 3.12
        if: steps.preflight.outcome == 'success'
        id: setup_python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-source/tools/scrapling_provider_pipeline/requirements.txt

      - name: Install and verify pinned toolchain
        if: steps.setup_python.outcome == 'success'
        id: toolchain
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement tools/scrapling_provider_pipeline/requirements.txt
          scrapling install
          python ../trusted-source/scripts/goanime_install_patchright.py \
            --browser chromium \
            --attempts 3
          python - <<'PY'
          import importlib.metadata
          expected = {
              'scrapling': '0.4.14',
              'playwright': '1.62.0',
              'patchright': '1.61.2',
          }
          for package, wanted in expected.items():
              actual = importlib.metadata.version(package)
              if actual != wanted:
                  raise SystemExit(f'expected {package} {wanted}, got {actual}')
          PY

      - name: Report toolchain status
        if: always() && steps.preflight.outcome == 'success'
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
        run: |
          state=failure
          if [ "$SETUP_OUTCOME" = success ] && [ "$TOOLCHAIN_OUTCOME" = success ]; then
            state=success
          fi
          python3 scripts/goanime_post_status.py \
            --state "$state" \
            --context goanime-scrapling/toolchain

      - name: Stop after toolchain failure
        if: steps.preflight.outcome == 'success' && (steps.setup_python.outcome != 'success' || steps.toolchain.outcome != 'success')
        run: exit 1

      - name: Run external pipeline unit tests
        if: steps.toolchain.outcome == 'success'
        id: tests
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: python -m unittest discover -s tools/scrapling_provider_pipeline/tests -p 'test_*.py'

      - name: Report test status
        if: always() && steps.toolchain.outcome == 'success'
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          state=failure
          [ "$OUTCOME" = success ] && state=success
          python3 scripts/goanime_post_status.py \
            --state "$state" \
            --context goanime-scrapling/tests

      - name: Stop after test failure
        if: steps.tests.outcome == 'failure'
        run: exit 1

      - name: Mark diagnostics successful
        if: steps.tests.outcome == 'success'
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/goanime_post_status.py \
            --state success \
            --context goanime-scrapling/diagnostics

      - name: Classify early diagnostic failure
        if: failure()
        continue-on-error: true
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.source_checkout.outcome }}
          VERIFY_OUTCOME: ${{ steps.source_verify.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          SETUP_OUTCOME: ${{ steps.setup_python.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          context=diagnostics
          if [ "$REQUEST_OUTCOME" != success ]; then
            context=request
          elif [ "$CHECKOUT_OUTCOME" != success ] || [ "$VERIFY_OUTCOME" != success ]; then
            context=source
          elif [ "$PREFLIGHT_OUTCOME" != success ]; then
            context=preflight
          elif [ "$SETUP_OUTCOME" != success ] || [ "$TOOLCHAIN_OUTCOME" != success ]; then
            context=toolchain
          elif [ "$TESTS_OUTCOME" != success ]; then
            context=tests
          fi
          python3 scripts/goanime_post_status.py \
            --state failure \
            --context "goanime-scrapling/$context"
          python3 scripts/goanime_post_status.py \
            --state failure \
            --context goanime-scrapling/diagnostics

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
