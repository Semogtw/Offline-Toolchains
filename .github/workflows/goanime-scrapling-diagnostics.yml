name: GoAnime Scrapling deterministic diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-diagnostics/*.request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: goanime-scrapling-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Resolve source-bound request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          changed = set()
          removed = set()
          for commit in event.get('commits') or []:
              for key in ('added', 'modified'):
                  changed.update(commit.get(key) or [])
              removed.update(commit.get('removed') or [])
          pattern = re.compile(r'^triggers/goanime-scrapling-diagnostics/[^/]+\.request$')
          requests = sorted(path for path in changed if pattern.fullmatch(path))
          if any(pattern.fullmatch(path) for path in removed):
              raise SystemExit('Deleting a diagnostic request cannot trigger a run')
          if len(requests) != 1:
              raise SystemExit(f'Expected exactly one diagnostic request, got {len(requests)}')

          values = {}
          path = Path('trusted-source') / requests[0]
          for raw_line in path.read_text(encoding='utf-8').splitlines():
              line = raw_line.strip()
              if not line or line.startswith('#'):
                  continue
              if '=' not in line:
                  raise SystemExit(f'Malformed diagnostic request line: {line!r}')
              key, value = line.split('=', 1)
              key = key.strip()
              value = value.strip()
              if key not in {'target_branch', 'source_hint', 'reason'}:
                  raise SystemExit(f'Unknown diagnostic request key: {key}')
              if key in values:
                  raise SystemExit(f'Duplicate diagnostic request key: {key}')
              values[key] = value

          branch = values.get('target_branch', '')
          sha = values.get('source_hint', '').lower()
          if subprocess.run(
              ['git', 'check-ref-format', '--branch', branch],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
              check=False,
          ).returncode != 0:
              raise SystemExit(f'Invalid target branch: {branch!r}')
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('source_hint must be a full 40-character SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'target_branch={branch}\n')
              output.write(f'source_hint={sha}\n')
          PY

      - name: Checkout exact private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.target_branch }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact GoAnime revision
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_hint }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-source/tools/scrapling_provider_pipeline/requirements.txt

      - name: Run deterministic phases with sanitized statuses
        working-directory: private-source
        shell: bash
        env:
          STATUS_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          phase=preflight

          post_status() {
            local context="$1"
            local state="$2"
            CONTEXT="$context" STATE="$state" python3 - <<'PY' > "$RUNNER_TEMP/goanime-diagnostic-status.json"
          import json
          import os
          print(json.dumps({
              'state': os.environ['STATE'],
              'context': os.environ['CONTEXT'],
              'description': 'Sanitized GoAnime Scrapling diagnostic status',
          }))
          PY
            curl --fail --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $STATUS_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @"$RUNNER_TEMP/goanime-diagnostic-status.json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              >/dev/null
          }

          on_exit() {
            code=$?
            if [ "$code" -ne 0 ]; then
              post_status "goanime-scrapling/$phase" failure || true
              post_status 'goanime-scrapling/diagnostics' failure || true
            fi
            rm -f "$RUNNER_TEMP/goanime-diagnostic-status.json"
            unset STATUS_TOKEN
            exit "$code"
          }
          trap on_exit EXIT

          post_status 'goanime-scrapling/preflight' pending
          python tools/scrapling_provider_pipeline/mal_input_preflight.py --repo-root .
          post_status 'goanime-scrapling/preflight' success

          phase=toolchain
          post_status 'goanime-scrapling/toolchain' pending
          python -m pip install --disable-pip-version-check --requirement tools/scrapling_provider_pipeline/requirements.txt
          scrapling install
          python -m patchright install chromium
          python - <<'PY'
          import importlib.metadata
          expected = {
              'scrapling': '0.4.14',
              'playwright': '1.62.0',
              'patchright': '1.61.2',
          }
          for package, wanted in expected.items():
              actual = importlib.metadata.version(package)
              if actual != wanted:
                  raise SystemExit(f'expected {package} {wanted}, got {actual}')
          PY
          post_status 'goanime-scrapling/toolchain' success

          phase=tests
          post_status 'goanime-scrapling/tests' pending
          python -m unittest discover -s tools/scrapling_provider_pipeline/tests -p 'test_*.py'
          post_status 'goanime-scrapling/tests' success
          post_status 'goanime-scrapling/diagnostics' success

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
