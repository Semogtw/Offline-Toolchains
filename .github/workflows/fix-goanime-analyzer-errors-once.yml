name: Fix GoAnime analyzer errors once

on:
  push:
    paths:
      - '.github/workflows/fix-goanime-analyzer-errors-once.yml'

permissions:
  contents: read

env:
  GOANIME_EXPECTED_SHA: c0a36fd2d78032de035d89171d426c087ae1675c
  GOANIME_BRANCH: feat/experimental-ai-buffered-upscaling-20260830
  FLUTTER_VERSION: 3.44.1

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_EXPECTED_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Apply exact analyzer-error fixes
        working-directory: goanime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOANIME_EXPECTED_SHA"

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/platform/desktop/services/cancellation_safe_real_cugan_backend.dart'): [(
                  """    final runner = _processRunner;\n    if (runner is RealCuganPendingCommandCanceller) {\n      try {\n        await runner.cancelPendingCommands();\n""",
                  """    if (_processRunner case final RealCuganPendingCommandCanceller cancellable) {\n      try {\n        await cancellable.cancelPendingCommands();\n""",
              )],
              Path('lib/platform/desktop/services/real_cugan_cli_backend.dart'): [(
                  """    final cancellable = delegate;\n    if (cancellable is RealCuganPendingCommandCanceller) {\n      await cancellable.cancelPendingCommands();\n""",
                  """    if (delegate case final RealCuganPendingCommandCanceller cancellable) {\n      await cancellable.cancelPendingCommands();\n""",
              )],
              Path('tools/experimental_video/real_cugan_helper_benchmark.dart'): [(
                  """import 'dart:convert';\n""",
                  """import 'dart:async';\nimport 'dart:convert';\n""",
              )],
          }

          for file, edits in replacements.items():
              text = file.read_text()
              for old, new in edits:
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exact pattern once in {file}')
                  text = text.replace(old, new)
              file.write_text(text)
          PY

          dart format \
            lib/platform/desktop/services/cancellation_safe_real_cugan_backend.dart \
            lib/platform/desktop/services/real_cugan_cli_backend.dart \
            tools/experimental_video/real_cugan_helper_benchmark.dart

          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//')
          test "${#changed[@]}" -eq 3

          git fetch --no-tags origin "refs/heads/${GOANIME_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$GOANIME_EXPECTED_SHA"

          git config user.name 'GoAnime CI'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/platform/desktop/services/cancellation_safe_real_cugan_backend.dart \
            lib/platform/desktop/services/real_cugan_cli_backend.dart \
            tools/experimental_video/real_cugan_helper_benchmark.dart
          git commit -m 'fix: repair experimental analyzer errors'
          git push origin "HEAD:refs/heads/${GOANIME_BRANCH}"
