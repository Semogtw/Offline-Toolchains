name: Deprecated GoAnime plaintext APK v3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Use encrypted GoAnime APK workflow
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain replacement
        shell: bash
        run: |
          echo 'The v3 plaintext APK handoff is permanently retired.'
          echo 'Use Build private GoAnime APK encrypted instead.'
