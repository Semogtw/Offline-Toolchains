name: Diagnose GoAnime MangaDex connection reuse

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangadex-connection/*.request'

permissions:
  contents: read

jobs:
  diagnose:
    name: Prove MangaDex with connection close
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangadex-connection/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Force MangaDex API connection close only in diagnostic checkout
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/services/manga/providers/mangadex_manga_provider.dart')
          text = path.read_text()
          old = """    'Accept-Language': NetworkHeaders.acceptLanguagePtBr,\n    'Referer': _mangaDexSiteBase.toString(),\n"""
          new = """    'Accept-Language': NetworkHeaders.acceptLanguagePtBr,\n    'Connection': 'close',\n    'Referer': _mangaDexSiteBase.toString(),\n"""
          if old not in text:
              raise SystemExit('MangaDex API header block changed')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get --enforce-lockfile >/dev/null

      - name: Exhaustively enumerate MangaDex
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mangadex-connection-close"
          rm -rf "$out" && mkdir -p "$out"
          timeout 1000s dart run tools/manga/inventory_manga_catalog.dart \
            --only-sources ptbr.mangadex \
            --output-dir "$out" \
            --max-pages 600 \
            --timeout-minutes 16 \
            --max-readability-probes 1 \
            --max-readability-probes-per-provider 1 \
            --readability-concurrent-providers 1 \
            --readability-stale-days 30 \
            --readability-probe-timeout-seconds 10
          python3 - "$out/manga_catalog_inventory.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          row = next(p for p in data['providers'] if p['sourceId'] == 'ptbr.mangadex')
          safe = {k: row.get(k) for k in ('status','stopReason','pagesScanned','rawItems','uniqueOccurrences','duplicateOccurrences','failure')}
          print(json.dumps(safe, sort_keys=True))
          assert row['status'] == 'exhausted', row
          assert row['stopReason'] == 'next_page_token_null', row
          assert row['uniqueOccurrences'] > 10000, row
          PY

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
