name: Apply GoAnime metadata seed fast path

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-apply-metadata-seed-fast-path/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-apply-metadata-seed-fast-path
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-apply-metadata-seed-fast-path/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact branch head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply and validate exact patch
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../trusted-source/scripts/prepare-goanime-metadata-seed-fast-path.py --root .
          sha256sum assets/data/anime_metadata_seed.json | awk '{print $1}' > assets/data/anime_metadata_seed.json.sha256
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          dart format \
            lib/services/anime_metadata_seed_service.dart \
            tools/build_anime_metadata_seed.dart \
            test/services/anime_metadata_seed_reimport_test.dart
          git -c core.whitespace=cr-at-eol diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 \
            test/services/anime_metadata_seed_bundled_test.dart \
            test/services/anime_metadata_seed_reimport_test.dart \
            test/architecture/anime_metadata_seed_publication_guard_test.dart
          test "$(cat assets/data/anime_metadata_seed.json.sha256)" = "$(sha256sum assets/data/anime_metadata_seed.json | awk '{print $1}')"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          .github/workflows/anime_metadata_cache.yml
          assets/data/anime_metadata_seed.json.sha256
          lib/services/anime_metadata_seed_service.dart
          pubspec.yaml
          test/services/anime_metadata_seed_reimport_test.dart
          tools/build_anime_metadata_seed.dart
          EOF
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Commit and push atomically
        id: push
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name 'GoAnime Toolchains'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            .github/workflows/anime_metadata_cache.yml \
            assets/data/anime_metadata_seed.json.sha256 \
            lib/services/anime_metadata_seed_service.dart \
            pubspec.yaml \
            test/services/anime_metadata_seed_reimport_test.dart \
            tools/build_anime_metadata_seed.dart
          git commit -m 'perf(metadata): skip unchanged bundled seed decoding'
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Record status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          PUSHED_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'status': os.environ['GATE_STATUS'],
            'targetSha': os.environ.get('TARGET_SHA') or None,
            'pushedSha': os.environ.get('PUSHED_SHA') or None,
            'runId': os.environ.get('GITHUB_RUN_ID'),
          }, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='status/goanime-apply-metadata-seed-fast-path.json'
          for attempt in 1 2 3 4 5; do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='ci(goanime): record metadata seed fast-path apply status' -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
