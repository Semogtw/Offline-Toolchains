name: Validate exact GoAnime final release

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-final-release-exact/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-final-release-exact
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-final-release-exact/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source and remote branch head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Validate project health
        working-directory: private-source
        run: bash ./tools/validate_project_health.sh

      - name: Test Python tooling
        working-directory: private-source
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate repository guards
        working-directory: private-source
        run: python3 tools/validate_repository_guards.py

      - name: Check formatting
        working-directory: private-source
        run: dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Analyze Flutter project
        working-directory: private-source
        run: flutter analyze --no-pub

      - name: Test Flutter application
        working-directory: private-source
        run: flutter test --no-pub

      - name: Test GoAnime core
        working-directory: private-source/packages/goanime_core
        run: dart test

      - name: Validate release workflow invariants
        working-directory: private-source
        run: bash ./tools/validate_release_workflows.sh

      - name: Build Android debug APK
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Build Android release APK and measure
        id: release
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'isMinifyEnabled = true' android/app/build.gradle.kts
          grep -q 'isShrinkResources = true' android/app/build.gradle.kts
          flutter build apk --release --no-pub
          apk=''
          for candidate in \
            build/app/outputs/flutter-apk/goanime.apk \
            build/app/outputs/flutter-apk/app-release.apk \
            build/app/outputs/apk/release/goanime.apk \
            build/app/outputs/apk/release/app-release.apk; do
            if [ -f "$candidate" ]; then apk="$candidate"; break; fi
          done
          if [ -z "$apk" ]; then
            apk="$(find build/app/outputs -type f -name '*.apk' -path '*release*' -print -quit)"
          fi
          test -n "$apk"
          test -f "$apk"
          bytes="$(stat -c %s "$apk")"
          test "$bytes" -le 150000000
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Release APK: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized release result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          APK_BYTES: ${{ steps.release.outputs.bytes }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/goanime-final-release.json"
          python3 - "$report" <<'PY'
          import json, os, sys
          payload = {
              'schemaVersion': 1,
              'runId': int(os.environ['RUN_ID']),
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'status': os.environ['RESULT'],
              'targetSha': os.environ.get('TARGET_SHA') or None,
              'apkBytes': int(os.environ['APK_BYTES']) if os.environ.get('APK_BYTES') else None,
          }
          with open(sys.argv[1], 'w', encoding='utf-8') as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY
          encoded="$(base64 -w0 < "$report")"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/reports/goanime-final-release-exact/${RUN_ID}.json" \
            -f "message=ci(goanime): report exact final release ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
