name: Handoff full credentialed GoAnime main release APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/handoff-goanime-full-release-private-20260824.yml'
      - 'triggers/goanime-full-main-private-release/*.request'

permissions:
  contents: read
  actions: read

concurrency:
  group: goanime-full-main-private-handoff-20260824
  cancel-in-progress: true

env:
  SOURCE_SHA: 7bd636136b7dac88bd679f1b98f9bec2d605efde
  EXPECTED_PGP_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0

jobs:
  handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout trusted toolchains
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Dispatch exact-main credentialed build
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          actual_sha="$(gh api repos/Semogtw/goanime-mobile/branches/main --jq .commit.sha)"
          test "$actual_sha" = "$SOURCE_SHA" || {
            echo "GoAnime main moved: expected $SOURCE_SHA, found $actual_sha" >&2
            exit 1
          }
          before="$(date -u +%s)"
          gh api --method POST \
            repos/Semogtw/goanime-mobile/actions/workflows/build_full_credentialed_apk.yml/dispatches \
            -f ref=main
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "Credentialed build dispatched for $SOURCE_SHA"

      - name: Resolve dispatched GoAnime run
        id: run
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          BEFORE: ${{ steps.dispatch.outputs.before }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=''
          for attempt in $(seq 1 36); do
            runs="$(gh api 'repos/Semogtw/goanime-mobile/actions/workflows/build_full_credentialed_apk.yml/runs?event=workflow_dispatch&branch=main&per_page=20')"
            run_id="$(jq -r --arg sha "$SOURCE_SHA" --argjson before "$BEFORE" '
              [.workflow_runs[]
               | select(.head_sha == $sha)
               | select((.created_at | fromdateiso8601) >= ($before - 5))]
              | sort_by(.created_at) | last | .id // empty
            ' <<<"$runs")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          test -n "$run_id" || {
            echo 'Unable to resolve dispatched GoAnime credentialed run' >&2
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Resolved GoAnime run $run_id"

      - name: Record resolved run immediately
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          report="$(jq -n \
            --arg source "$SOURCE_SHA" \
            --argjson run "$RUN_ID" \
            --argjson toolchains "$GITHUB_RUN_ID" \
            '{schema_version:2,source_sha:$source,goanime_workflow_run_id:$run,goanime_workflow_run_url:("https://github.com/Semogtw/goanime-mobile/actions/runs/"+($run|tostring)),goanime_build_conclusion:null,source_artifact_id:null,apk_sha256:null,apk_size_bytes:null,toolchains_run_id:$toolchains,toolchains_run_url:("https://github.com/Semogtw/Offline-Toolchains/actions/runs/"+($toolchains|tostring)),distribution:"private artifacts only; no GitHub Release, Play Store, Shorebird, update-manifest publication, or rollout",stage:"building"}')"
          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          path='reports/goanime-full-main-private-release/latest.json'
          old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message="ci(goanime): record private APK run $RUN_ID [skip ci]" -f content="$encoded")
          [[ -n "$old" ]] && args+=(-f sha="$old")
          gh api "${args[@]}" >/dev/null

      - name: Wait for credentialed build
        id: completion
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          status=''
          conclusion=''
          for attempt in $(seq 1 240); do
            run="$(gh api "repos/Semogtw/goanime-mobile/actions/runs/$RUN_ID")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            [[ "$status" == completed ]] && break
            sleep 15
          done
          test "$status" = completed || {
            echo 'Credentialed GoAnime build did not complete inside handoff window' >&2
            exit 1
          }
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "GoAnime run $RUN_ID concluded: $conclusion"
          test "$conclusion" = success

      - name: Download and encrypt private APK
        id: artifact
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-full-handoff"
          mkdir -p "$work/plain" "$work/transfer" "$work/gpg"
          artifacts="$(gh api "repos/Semogtw/goanime-mobile/actions/runs/$RUN_ID/artifacts?per_page=100")"
          artifact_id="$(jq -r '.artifacts[] | select(.name=="goanime-production-equivalent-private-arm64") | .id' <<<"$artifacts" | head -n1)"
          test -n "$artifact_id"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Semogtw/goanime-mobile/actions/artifacts/$artifact_id/zip" \
            -o "$work/source.zip"
          unzip -q "$work/source.zip" -d "$work/plain"
          apk="$(find "$work/plain" -type f -name '*.apk' -print -quit)"
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"

          chmod 700 "$work/gpg"
          export GNUPGHOME="$work/gpg"
          gpg --batch --import "$GITHUB_WORKSPACE/keys/source-bundles-public.asc" >/dev/null 2>&1
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_PGP_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_PGP_FINGERPRINT"
          encrypted="$work/transfer/GoAnime-${SOURCE_SHA:0:12}-full-main-release-arm64.apk.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_PGP_FINGERPRINT" --output "$encrypted" --encrypt "$apk"
          find "$work/plain" -maxdepth 1 -type f ! -name '*.apk' -exec cp {} "$work/transfer/" \;
          jq -n \
            --arg source "$SOURCE_SHA" \
            --argjson run "$RUN_ID" \
            --argjson artifact "$artifact_id" \
            --arg sha "$sha256" \
            --argjson size "$size" \
            '{schema_version:2,source_sha:$source,goanime_workflow_run_id:$run,goanime_source_artifact_id:$artifact,flutter_mode:"release",target:"android-arm64",apk_sha256:$sha,apk_size_bytes:$size,distribution:"private artifacts only; no GitHub Release, Play Store, Shorebird, update-manifest publication, or rollout"}' \
            > "$work/transfer/handoff.json"
          rm -rf "$work/plain" "$work/gpg" "$work/source.zip"
          echo "transfer_dir=$work/transfer" >> "$GITHUB_OUTPUT"
          echo "source_artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted full release handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-full-main-release-private-encrypted
          path: ${{ steps.artifact.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Record final handoff state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
          BUILD_CONCLUSION: ${{ steps.completion.outputs.conclusion }}
          SOURCE_ARTIFACT_ID: ${{ steps.artifact.outputs.source_artifact_id }}
          APK_SHA256: ${{ steps.artifact.outputs.sha256 }}
          APK_SIZE: ${{ steps.artifact.outputs.size }}
        shell: bash
        run: |
          set -euo pipefail
          maybe_json_int() { [[ "$1" =~ ^[0-9]+$ ]] && printf '%s' "$1" || printf 'null'; }
          run_json="$(maybe_json_int "${RUN_ID:-}")"
          artifact_json="$(maybe_json_int "${SOURCE_ARTIFACT_ID:-}")"
          size_json="$(maybe_json_int "${APK_SIZE:-}")"
          toolchains_json="$GITHUB_RUN_ID"
          stage='failed'
          [[ "${BUILD_CONCLUSION:-}" == success && -n "${APK_SHA256:-}" ]] && stage='complete'
          report="$(jq -n \
            --arg source "$SOURCE_SHA" \
            --argjson run "$run_json" \
            --arg conclusion "${BUILD_CONCLUSION:-}" \
            --argjson artifact "$artifact_json" \
            --arg sha "${APK_SHA256:-}" \
            --argjson size "$size_json" \
            --argjson toolchains "$toolchains_json" \
            --arg stage "$stage" \
            '{schema_version:2,source_sha:$source,goanime_workflow_run_id:$run,goanime_workflow_run_url:(if $run then "https://github.com/Semogtw/goanime-mobile/actions/runs/"+($run|tostring) else null end),goanime_build_conclusion:(if $conclusion=="" then null else $conclusion end),source_artifact_id:$artifact,apk_sha256:(if $sha=="" then null else $sha end),apk_size_bytes:$size,toolchains_run_id:$toolchains,toolchains_run_url:("https://github.com/Semogtw/Offline-Toolchains/actions/runs/"+($toolchains|tostring)),distribution:"private artifacts only; no GitHub Release, Play Store, Shorebird, update-manifest publication, or rollout",stage:$stage}')"
          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          path='reports/goanime-full-main-private-release/latest.json'
          old="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message="ci(goanime): finalize private APK handoff ${RUN_ID:-unknown} [skip ci]" -f content="$encoded")
          [[ -n "$old" ]] && args+=(-f sha="$old")
          gh api "${args[@]}" >/dev/null
