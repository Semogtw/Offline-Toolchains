name: Apply GoAnime Manga Metadata Pipelining

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-metadata-pipelining/*.request'

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  GOANIME_BRANCH: feat/manga-metadata-pipelined-requests-20260909

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$WRITE_TOKEN"

      - name: Checkout isolated GoAnime branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_BRANCH }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply start-rate-limited pipelining
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          helper = Path('tools/manga/manga_request_scheduler.dart')
          helper.write_text(r'''import 'dart:async';


typedef MangaRequestDelay = Future<void> Function(Duration duration);

final class MangaRequestStartLimiter {
  MangaRequestStartLimiter({
    required this.interval,
    required MangaRequestDelay delay,
  }) : _delay = delay;

  final Duration interval;
  final MangaRequestDelay _delay;

  Future<void> _tail = Future<void>.value();
  bool _started = false;

  Future<void> waitForTurn() {
    final completer = Completer<void>();
    _tail = _tail.then((_) async {
      if (_started && interval > Duration.zero) {
        await _delay(interval);
      }
      _started = true;
      completer.complete();
    }, onError: (Object error, StackTrace stackTrace) {
      if (!completer.isCompleted) completer.completeError(error, stackTrace);
    });
    return completer.future;
  }
}

Future<List<R>> mapConcurrentOrdered<T, R>(
  List<T> items,
  int maxConcurrent,
  Future<R> Function(T item) operation,
) async {
  if (maxConcurrent <= 0) {
    throw ArgumentError.value(maxConcurrent, 'maxConcurrent', 'must be positive');
  }
  if (items.isEmpty) return <R>[];

  final results = <int, R>{};
  var nextIndex = 0;
  final workers = items.length < maxConcurrent ? items.length : maxConcurrent;

  Future<void> worker() async {
    while (true) {
      final index = nextIndex;
      if (index >= items.length) return;
      nextIndex += 1;
      results[index] = await operation(items[index]);
    }
  }

  await Future.wait(List<Future<void>>.generate(workers, (_) => worker()));
  return List<R>.generate(items.length, (index) => results[index] as R);
}
''', encoding='utf-8')

          md = Path('tools/manga/manga_mangadex_identity_resolver.dart')
          replace_once(md,
