          replace_once(jk, old_helpers, '')
          PY

          dart format \
            tools/manga/manga_request_scheduler.dart \
            tools/manga/manga_mangadex_identity_resolver.dart \
            tools/manga/manga_jikan_bulk_enricher.dart \
            test/tools/manga_mangadex_identity_resolver_test.dart \
            test/tools/manga_jikan_private_detail_concurrency_test.dart

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Verify pipelining GREEN
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/tools/manga_mangadex_identity_resolver_test.dart \
            test/tools/manga_jikan_private_detail_concurrency_test.dart \
            test/tools/manga_metadata_refresh_test.dart
          git diff --check

      - name: Commit isolated implementation
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/manga/manga_request_scheduler.dart \
            tools/manga/manga_mangadex_identity_resolver.dart \
            tools/manga/manga_jikan_bulk_enricher.dart \
            test/tools/manga_mangadex_identity_resolver_test.dart \
            test/tools/manga_jikan_private_detail_concurrency_test.dart
          git commit -m 'perf(manga): pipeline rate-limited metadata requests'
          git push origin HEAD:${GOANIME_BRANCH}
