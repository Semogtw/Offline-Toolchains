              "    this.maxAttempts = 3,\n    this.maxConcurrentRequests = 4,\n    this.requestDelay = defaultMangaDexIdentityRequestDelay,")
          replace_once(md,
              "    if (maxAttempts <= 0) {\n      throw ArgumentError.value(maxAttempts, 'maxAttempts', 'must be positive');\n    }\n",
