              "  final int maxAttempts;\n  final int maxConcurrentDetails;\n  final Duration requestTimeout;\n\n  MangaRequestStartLimiter? _searchRequestLimiter;\n  MangaRequestStartLimiter? _detailRequestLimiter;\n\n  MangaRequestStartLimiter _limiterFor(\n    _JikanRequestLane lane,\n    JikanToolConfig config,\n  ) {\n    return switch (lane) {\n      _JikanRequestLane.search => _searchRequestLimiter ??=\n          MangaRequestStartLimiter(\n            interval: config.minimumRequestDelay,\n            delay: _delay,\n          ),\n      _JikanRequestLane.detail => _detailRequestLimiter ??=\n          MangaRequestStartLimiter(\n            interval: config.minimumRequestDelay,\n            delay: _delay,\n          ),\n    };\n  }\n")
          replace_once(jk,
              "    final entries = <String, MangaMetadataEnrichmentEntry>{};",
              "    final targetList = targets.toList(growable: false);\n    if (maxSearches == 0) {\n      return _enrichKnownDetailsOnly(targetList);\n    }\n\n    final entries = <String, MangaMetadataEnrichmentEntry>{};")
          replace_once(jk,
              "    for (final target in targets) {",
              "    for (final target in targetList) {")
          marker = "  Future<_SearchOutcome> _search(\n"
          method = '''  Future<MangaJikanEnrichmentResult> _enrichKnownDetailsOnly(
    List<MangaMetadataWorkTarget> targets,
  ) async {
    final known = targets
        .where((target) => target.malId != null && target.malId! > 0)
        .toList(growable: false);
    final skipped = targets
        .where((target) => target.malId == null || target.malId! <= 0)
        .map((target) => target.workId)
        .toList(growable: false);
    final detailResults = await mapConcurrentOrdered<
        MangaMetadataWorkTarget,
        ({MangaMetadataWorkTarget target, _JikanMangaDetail? detail})>(
      known,
      maxConcurrentDetails,
      (target) async => (
        target: target,
        detail: await _fetchFull(target.malId!),
      ),
    );

    final entries = <String, MangaMetadataEnrichmentEntry>{};
    final failed = <String>[];
    for (final result in detailResults) {
      final detail = result.detail;
      final malId = result.target.malId!;
      if (detail == null || detail.malId != malId) {
        failed.add(result.target.workId);
        continue;
      }
      entries[result.target.workId] = detail.toEntry(result.target.workId);
    }

    return MangaJikanEnrichmentResult(
      entriesByWorkId: entries,
      searchesAttempted: 0,
      searchTargetsAttempted: 0,
      ambiguousWorkIds: const [],
      unmatchedWorkIds: const [],
      failedWorkIds: failed,
      skippedWorkIds: skipped,
    );
  }

'''
          replace_once(jk, marker, method + marker)
          replace_once(jk,
              "      if (_hasStartedRequest(lane)) {\n        await _delay(config.minimumRequestDelay);\n      }\n      _markRequestStarted(lane, true);\n",
              "      await _limiterFor(lane, config).waitForTurn();\n")
          replace_once(jk,
              "          await _delay(retryAfter);\n          _markRequestStarted(lane, false);\n",
              "          await _delay(retryAfter);\n")
          old_helpers = '''  bool _hasStartedRequest(_JikanRequestLane lane) => switch (lane) {
    _JikanRequestLane.search => _hasStartedSearchRequest,
