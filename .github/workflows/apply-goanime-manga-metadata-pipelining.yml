          replace_once(md, old_fallback, new_fallback)
          replace_once(md,
              "      if (_hasStartedRequest && requestDelay > Duration.zero) {\n        await _delay(requestDelay);\n      }\n      _hasStartedRequest = true;\n",
              "      await _limiter.waitForTurn();\n")

          jk = Path('tools/manga/manga_jikan_bulk_enricher.dart')
          replace_once(jk,
              "import 'manga_metadata_enrichment_models.dart';\n",
              "import 'manga_metadata_enrichment_models.dart';\nimport 'manga_request_scheduler.dart';\n")
          replace_once(jk,
              "    this.maxAttempts = 3,\n    this.requestTimeout = const Duration(seconds: 15),",
              "    this.maxAttempts = 3,\n    this.maxConcurrentDetails = 4,\n    this.requestTimeout = const Duration(seconds: 15),")
          replace_once(jk,
              "    if (maxAttempts <= 0) {\n      throw ArgumentError.value(maxAttempts, 'maxAttempts', 'must be positive');\n    }\n",
