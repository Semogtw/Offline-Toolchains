          replace_once(md,
              "  final int maxAttempts;\n  final Duration requestDelay;",
              "  final int maxAttempts;\n  final int maxConcurrentRequests;\n  final Duration requestDelay;")
          replace_once(md,
              "  bool _hasStartedRequest = false;\n",
              "  MangaRequestStartLimiter? _requestStartLimiter;\n\n  MangaRequestStartLimiter get _limiter => _requestStartLimiter ??=\n      MangaRequestStartLimiter(interval: requestDelay, delay: _delay);\n")
          old_fallback = '''    for (final target in fallback) {
