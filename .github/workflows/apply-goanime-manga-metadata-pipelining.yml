name: Apply GoAnime Manga Metadata Pipelining

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-metadata-pipelining/*.request.json'

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  PIPELINING_SOURCE_BRANCH: feat/manga-metadata-pipelined-requests-20260909

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Toolchains request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve hotfix request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(
            git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD^ HEAD -- \
              'triggers/goanime-manga-metadata-pipelining/*.request.json' | sort | tail -n 1
          )"
          test -n "$request" || {
            echo '::error::Pipelining push did not contain a request file.'
            exit 1
          }

          checkpoint_branch="$(jq -er '.checkpointBranch | strings | select(length > 0)' "$request")"
          source_sha="$(jq -er '.sourceSha | strings | select(length > 0)' "$request")"
          expected_offset="$(jq -er '.expectedMetadataSearchOffset | numbers' "$request")"

          [[ "$checkpoint_branch" =~ ^ci/manga-global-cache-[A-Za-z0-9._-]+$ ]] || {
            echo '::error::Invalid checkpoint branch.'
            exit 1
          }
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo '::error::Invalid immutable source SHA.'
            exit 1
          }
          [[ "$expected_offset" =~ ^[0-9]+$ ]] || {
            echo '::error::expectedMetadataSearchOffset must be a non-negative integer.'
            exit 1
          }

          echo "checkpoint_branch=$checkpoint_branch" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "expected_offset=$expected_offset" >> "$GITHUB_OUTPUT"

      - name: Require private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN" || {
            echo '::error::GOANIME_CATALOG_WRITE_TOKEN is required for the checkpoint hotfix.'
            exit 1
          }

      - name: Checkout exact checkpoint branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.checkpoint_branch }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Validate generation identity and durable cursor
        working-directory: private-source
        shell: bash
        env:
          CHECKPOINT_BRANCH: ${{ steps.request.outputs.checkpoint_branch }}
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          EXPECTED_OFFSET: ${{ steps.request.outputs.expected_offset }}
        run: |
          set -euo pipefail
          state=.ci/manga-global-cache/state.json
          test -f "$state" || {
            echo '::error::Existing checkpoint has no state.json.'
            exit 1
          }

          actual_checkpoint="$(jq -r '.checkpointBranch // ""' "$state")"
          actual_source="$(jq -r '.sourceSha // ""' "$state")"
          actual_offset="$(jq -r '.metadataSearchOffset // -1' "$state")"
          if [[ "$actual_checkpoint" != "$CHECKPOINT_BRANCH" || "$actual_source" != "$SOURCE_SHA" ]]; then
            echo '::error::Generation identity mismatch.'
            echo "expected checkpoint=$CHECKPOINT_BRANCH source=$SOURCE_SHA"
            echo "actual checkpoint=$actual_checkpoint source=$actual_source"
            exit 1
          fi
          if [[ "$actual_offset" != "$EXPECTED_OFFSET" ]]; then
            echo '::error::Metadata cursor moved before hotfix.'
            echo "expected offset=$EXPECTED_OFFSET actual offset=$actual_offset"
            exit 1
          fi

      - name: Cherry-pick verified pipelining commits
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch --no-tags origin \
            "refs/heads/${PIPELINING_SOURCE_BRANCH}:refs/remotes/origin/manga-metadata-pipelining-source"
          git merge-base --is-ancestor \
            f5cc8b78b6463c5e902dbcbcffaec8ca7b694d27 \
            refs/remotes/origin/manga-metadata-pipelining-source
          git cherry-pick \
            57a5b2e583322a0d12bc3eb94ff870b9786a4e02 \
            4b4adfb3bd04521c7bbe7c845d1e686bcd8dcf04 \
            10b9074201e3849a985b8ec5274618aa1a5fe908 \
            f5cc8b78b6463c5e902dbcbcffaec8ca7b694d27

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Verify pipelining before checkpoint push
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/tools/manga_mangadex_identity_resolver_test.dart \
            test/tools/manga_jikan_private_detail_concurrency_test.dart \
            test/tools/manga_metadata_refresh_test.dart
          git diff --check HEAD~4 HEAD

      - name: Push checkpoint hotfix
        working-directory: private-source
        shell: bash
        env:
          CHECKPOINT_BRANCH: ${{ steps.request.outputs.checkpoint_branch }}
        run: |
          set -euo pipefail
          git push origin HEAD:"$CHECKPOINT_BRANCH"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source
