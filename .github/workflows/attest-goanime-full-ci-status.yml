name: Attest GoAnime full CI status

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-status-attest/*.json'

permissions:
  contents: read
  actions: read

jobs:
  attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted attestation request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Validate full-CI evidence and publish protected status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GOANIME_STATUS_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-status-attest/*.json' | head -n 1)"
          test -n "$request"
          test -n "$GOANIME_STATUS_TOKEN"

          eval "$(python3 - "$request" <<'PY'
          import json, re, shlex, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          target = str(data.get('target_sha') or '').strip().lower()
          trigger = str(data.get('validation_trigger_sha') or '').strip().lower()
          run_id = str(data.get('validation_run_id') or '').strip()
          request_path = str(data.get('validation_request_path') or '').strip()
          if not re.fullmatch(r'[0-9a-f]{40}', target): raise SystemExit('invalid target_sha')
          if not re.fullmatch(r'[0-9a-f]{40}', trigger): raise SystemExit('invalid validation_trigger_sha')
          if not re.fullmatch(r'[0-9]+', run_id): raise SystemExit('invalid validation_run_id')
          if not re.fullmatch(r'triggers/goanime-full-ci/[A-Za-z0-9._-]+\.request', request_path):
              raise SystemExit('invalid validation_request_path')
          for key, value in [('TARGET_SHA', target), ('VALIDATION_TRIGGER_SHA', trigger), ('VALIDATION_RUN_ID', run_id), ('VALIDATION_REQUEST_PATH', request_path)]:
              print(f'{key}={shlex.quote(value)}')
          PY
          )"

          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}")"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .head_sha <<<"$run_json")" = "$VALIDATION_TRIGGER_SHA"
          test "$(jq -r .path <<<"$run_json")" = '.github/workflows/run-private-goanime-ci.yml'

          encoded="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${VALIDATION_REQUEST_PATH}?ref=${VALIDATION_TRIGGER_SHA}" --jq .content)"
          validated_target="$(printf '%s' "$encoded" | base64 -d | tr -d '\r\n')"
          test "$validated_target" = "$TARGET_SHA"

          auth="$(printf 'x-access-token:%s' "$GOANIME_STATUS_TOKEN" | base64 -w0)"
          test "$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git | grep -c "$TARGET_SHA")" -ge 1

          GH_TOKEN="$GOANIME_STATUS_TOKEN" gh api --method POST \
            "repos/Semogtw/goanime-mobile/statuses/${TARGET_SHA}" \
            -f state=success \
            -f context='Project health, analysis and principal tests' \
            -f description="Offline-Toolchains full CI run ${VALIDATION_RUN_ID} passed" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${VALIDATION_RUN_ID}" >/dev/null
