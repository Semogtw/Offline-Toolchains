name: Prove GoAnime Manga Reader progress readiness red

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-reader-progress-red-20260822/*.request'

permissions:
  contents: read

jobs:
  prove-red:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-reader-progress-red-20260822/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Apply Reader semantic test only
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          patch="$GITHUB_WORKSPACE/trusted-source/patches/goanime/manga-reader-progress-atomic-tests-20260822.patch"
          git apply --check --include='test/widgets/manga/manga_reader_screen_test.dart' "$patch"
          git apply --include='test/widgets/manga/manga_reader_screen_test.dart' "$patch"
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Prove failed package is incorrectly recorded today
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          dart format test/widgets/manga/manga_reader_screen_test.dart >/dev/null
          flutter test --no-pub test/widgets/manga/manga_reader_screen_test.dart \
            --plain-name 'local package failure exposes retry and reloads the package'

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
