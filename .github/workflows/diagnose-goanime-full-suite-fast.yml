name: Diagnose GoAnime full suite fast

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-full-suite-fast/*.request'

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.1'

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Toolchains request
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-full-suite-fast/*.request' | head -n 1)"
          read -r project sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: |
          flutter config --no-analytics
          flutter pub get
          git diff --exit-code -- pubspec.lock

      - name: Run complete suite
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --reporter expanded 2>&1 | tee "$RUNNER_TEMP/goanime-full-suite-fast.log"

      - name: Persist diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          STATE: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          log_path=""
          raw="$RUNNER_TEMP/goanime-full-suite-fast.log"
          if test -s "$raw"; then
            log_path="results/goanime-full-suite-fast/$GITHUB_RUN_ID.log"
            clean="$RUNNER_TEMP/goanime-full-suite-fast-sanitized.log"
            tail -n 1200 "$raw" | sed -E "s#${GITHUB_WORKSPACE}#<workspace>#g; s#${HOME}#<home>#g; s/(ghp_|github_pat_)[A-Za-z0-9_]+/<redacted-token>/g" > "$clean"
            encoded="$(base64 -w0 < "$clean")"
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$log_path" -f message="ci(result): preserve GoAnime fast full-suite log $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
          fi
          body="$(jq -cn --arg sha "$TARGET_SHA" --arg state "$STATE" --arg logPath "$log_path" --argjson runId "$GITHUB_RUN_ID" '{sourceSha:$sha,state:$state,runId:$runId,logPath:$logPath}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-full-suite-fast/$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record GoAnime fast full-suite $GITHUB_RUN_ID" -f content="$encoded" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
