name: Format GoAnime main on request

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-format-main/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Format private GoAnime main
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Pin starting revision
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Formatting GoAnime main at $sha"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve root dependencies
        shell: bash
        run: flutter pub get

      - name: Resolve goanime_core development dependencies
        working-directory: packages/goanime_core
        shell: bash
        run: dart pub get

      - name: Format tracked Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test packages tools
          git diff --check

      - name: Emit layout-only edit plan
        shell: bash
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          def is_layout(ch: str) -> bool:
              return ch.isspace() or ch == ','

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', '*.dart'],
              text=True,
          ).splitlines()

          plan = {'base': os.environ['PINNED_SHA'], 'files': []}
          for path in changed:
              original = subprocess.check_output(
                  ['git', 'show', f'HEAD:{path}'],
                  text=True,
              )
              formatted = pathlib.Path(path).read_text()

              original_stable = ''.join(ch for ch in original if not is_layout(ch))
              formatted_stable = ''.join(ch for ch in formatted if not is_layout(ch))
              if original_stable != formatted_stable:
                  print(
                      f'Unsafe formatter delta outside whitespace/trailing commas in {path}',
                      file=sys.stderr,
                  )
                  sys.exit(2)

              original_positions = [
                  index for index, ch in enumerate(original) if not is_layout(ch)
              ]
              formatted_positions = [
                  index for index, ch in enumerate(formatted) if not is_layout(ch)
              ]

              edits = []
              boundaries = len(original_positions) + 1
              for gap_index in range(boundaries):
                  original_start = (
                      0
                      if gap_index == 0
                      else original_positions[gap_index - 1] + 1
                  )
                  original_end = (
                      len(original)
                      if gap_index == len(original_positions)
                      else original_positions[gap_index]
                  )
                  formatted_start = (
                      0
                      if gap_index == 0
                      else formatted_positions[gap_index - 1] + 1
                  )
                  formatted_end = (
                      len(formatted)
                      if gap_index == len(formatted_positions)
                      else formatted_positions[gap_index]
                  )

                  before = original[original_start:original_end]
                  after = formatted[formatted_start:formatted_end]
                  if before != after:
                      if any(not is_layout(ch) for ch in before + after):
                          print(
                              f'Unsafe edit span in {path}',
                              file=sys.stderr,
                          )
                          sys.exit(2)
                      edits.append(
                          {
                              'start': original_start,
                              'end': original_end,
                              'replacement': after,
                          }
                      )

              plan['files'].append({'path': path, 'edits': edits})

          print('LAYOUT_EDIT_PLAN=' + json.dumps(plan, separators=(',', ':')))
          PY

      - name: Report result
        if: always()
        shell: bash
        run: echo "Formatted GoAnime ref=${{ steps.pin.outputs.sha }}"
