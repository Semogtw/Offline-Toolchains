name: Format GoAnime main on request

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-format-main/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-format-main
  cancel-in-progress: false

jobs:
  format:
    name: Format private GoAnime main
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Pin starting revision
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Formatting GoAnime main at $sha"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format tracked Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test packages tools
          git diff --check

      - name: Emit whitespace-only edit plan
        shell: bash
        env:
          PINNED_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import difflib
          import json
          import os
          import pathlib
          import subprocess
          import sys

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--', '*.dart'],
              text=True,
          ).splitlines()

          plan = {'base': os.environ['PINNED_SHA'], 'files': []}
          for path in changed:
              original = subprocess.check_output(
                  ['git', 'show', f'HEAD:{path}'],
                  text=True,
              )
              formatted = pathlib.Path(path).read_text()
              matcher = difflib.SequenceMatcher(
                  a=original,
                  b=formatted,
                  autojunk=False,
              )
              edits = []
              for tag, i1, i2, j1, j2 in matcher.get_opcodes():
                  if tag == 'equal':
                      continue
                  before = original[i1:i2]
                  after = formatted[j1:j2]
                  if before.strip() or after.strip():
                      print(
                          f'Unsafe non-whitespace formatter delta in {path} '
                          f'at original[{i1}:{i2}] formatted[{j1}:{j2}]',
                          file=sys.stderr,
                      )
                      sys.exit(2)
                  edits.append(
                      {
                          'start': i1,
                          'end': i2,
                          'replacement': after,
                      }
                  )
              plan['files'].append({'path': path, 'edits': edits})

          print('WHITESPACE_EDIT_PLAN=' + json.dumps(plan, separators=(',', ':')))
          PY

      - name: Report result
        if: always()
        shell: bash
        run: echo "Formatted GoAnime ref=${{ steps.pin.outputs.sha }}"
