name: GoAnime Yuzono PT-BR Anime Full Audit

on:
  push:
    branches:
      - feat/yuzono-ptbr-anime-full-audit-20260910
    paths:
      - 'triggers/goanime-yuzono-anime-full-audit/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable GoAnime probe source SHA
        required: true
      generation_id:
        description: Stable generation identifier
        required: false
        default: ''
      mode:
        description: Audit mode
        required: true
        default: canary
        type: choice
        options:
          - deterministic
          - canary
          - full
      parent_run_id:
        description: Previous run carrying sanitized continuation state
        required: false
        default: ''
      reference_runtime_run_id:
        description: Origin run carrying the immutable runtime for this generation
        required: false
        default: ''
      continuation_index:
        description: Automatic continuation depth
        required: false
        default: '0'
      force_flexible_adapter_fallback:
        description: Test-only exact-source FlexibleAdapter fallback mode
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: goanime-yuzono-full-audit-${{ github.event.inputs.generation_id || github.run_id }}
  cancel-in-progress: false

env:
  YUZONO_REVISION: 36eda914cb77ca8e40552eb800eb07098852fc55
  ANIKKU_REVISION: 41fefe566a00e8eb38dfa7f11802c8bfbe5c16e7
  FLEXIBLE_ADAPTER_SHA: c80135339bcff5f7f8c2c2380329dfc155b26232
  GOANIME_BASELINE_SHA: f350111089aedf248033154e11779dc69fff8f7f

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      generation_id: ${{ steps.request.outputs.generation_id }}
      mode: ${{ steps.request.outputs.mode }}
      parent_run_id: ${{ steps.request.outputs.parent_run_id }}
      reference_runtime_run_id: ${{ steps.request.outputs.reference_runtime_run_id }}
      continuation_index: ${{ steps.request.outputs.continuation_index }}
      force_fallback: ${{ steps.request.outputs.force_fallback }}
    steps:
      - name: Checkout Toolchains request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve immutable audit request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.source_sha || '' }}
          DISPATCH_GENERATION: ${{ github.event.inputs.generation_id || '' }}
          DISPATCH_MODE: ${{ github.event.inputs.mode || '' }}
          DISPATCH_PARENT: ${{ github.event.inputs.parent_run_id || '' }}
          DISPATCH_REFERENCE_RUNTIME_RUN_ID: ${{ github.event.inputs.reference_runtime_run_id || '' }}
          DISPATCH_INDEX: ${{ github.event.inputs.continuation_index || '0' }}
          DISPATCH_FORCE_FALLBACK: ${{ github.event.inputs.force_flexible_adapter_fallback || 'false' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        run: |
          set -euo pipefail
          source_sha="$DISPATCH_SHA"
          generation_id="$DISPATCH_GENERATION"
          mode="$DISPATCH_MODE"
          parent_run_id="$DISPATCH_PARENT"
          reference_runtime_run_id="$DISPATCH_REFERENCE_RUNTIME_RUN_ID"
          continuation_index="$DISPATCH_INDEX"
          force_fallback="$DISPATCH_FORCE_FALLBACK"

          if [[ "$EVENT_NAME" == push ]]; then
            request="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD^ HEAD -- 'triggers/goanime-yuzono-anime-full-audit/*.request' | sort | tail -n 1)"
            test -n "$request" || { echo '::error::No full-audit request in triggering commit'; exit 1; }
            source_sha="$(tr -d ' \n\r' < "$request")"
            generation_id="audit-${GITHUB_RUN_ID}"
            parent_run_id=""
            reference_runtime_run_id=""
            continuation_index="0"
            force_fallback="false"
            if [[ "$COMMIT_MESSAGE" == *"[full]"* ]]; then
              mode="full"
            elif [[ "$COMMIT_MESSAGE" == *"[canary]"* ]]; then
              mode="canary"
            else
              mode="deterministic"
            fi
          fi

          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::source_sha must be an immutable git SHA'; exit 1; }
          [[ "$GOANIME_BASELINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::baseline SHA is invalid'; exit 1; }
          [[ "$YUZONO_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Yuzono SHA is invalid'; exit 1; }
          [[ "$ANIKKU_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Anikku SHA is invalid'; exit 1; }
          [[ "$generation_id" =~ ^[A-Za-z0-9._-]{1,100}$ ]] || { echo '::error::generation_id is invalid'; exit 1; }
          [[ "$mode" =~ ^(deterministic|canary|full)$ ]] || { echo '::error::mode is invalid'; exit 1; }
          [[ "$parent_run_id" =~ ^[0-9]*$ ]] || { echo '::error::parent_run_id is invalid'; exit 1; }
          [[ "$reference_runtime_run_id" =~ ^[0-9]*$ ]] || { echo '::error::reference runtime run id is invalid'; exit 1; }
          [[ "$continuation_index" =~ ^[0-9]+$ ]] || { echo '::error::continuation_index is invalid'; exit 1; }
          [[ "$force_fallback" =~ ^(true|false)$ ]] || { echo '::error::fallback mode is invalid'; exit 1; }
          test -f scripts/goanime_yuzono/validate_continuation_request.py
          python3 scripts/goanime_yuzono/validate_continuation_request.py \
            --parent-run-id "$parent_run_id" \
            --reference-runtime-run-id "$reference_runtime_run_id" \
            --continuation-index "$continuation_index"
          if [[ -n "$parent_run_id" && -z "$reference_runtime_run_id" ]]; then
            echo '::error::continuation must carry reference runtime origin run id'
            exit 1
          fi
          if [[ -z "$parent_run_id" && -n "$reference_runtime_run_id" ]]; then
            echo '::error::reference runtime origin requires a parent continuation run'
            exit 1
          fi
          if [[ "$mode" == deterministic && -n "$reference_runtime_run_id" ]]; then
            echo '::error::deterministic mode cannot carry a reference runtime origin'
            exit 1
          fi
          if [[ -n "$reference_runtime_run_id" && "$force_fallback" == true ]]; then
            echo '::error::continuation cannot request FlexibleAdapter fallback'
            exit 1
          fi

          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "generation_id=$generation_id" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "parent_run_id=$parent_run_id" >> "$GITHUB_OUTPUT"
          echo "reference_runtime_run_id=$reference_runtime_run_id" >> "$GITHUB_OUTPUT"
          echo "continuation_index=$continuation_index" >> "$GITHUB_OUTPUT"
          echo "force_fallback=$force_fallback" >> "$GITHUB_OUTPUT"

      - name: Require private source credential
        env:
          TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact GoAnime probe source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout exact GoAnime baseline
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_BASELINE_SHA }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: baseline-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Verify identities and deterministic gates
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          test "$(git -C baseline-source rev-parse HEAD)" = "$GOANIME_BASELINE_SHA"
          test -f baseline-source/assets/data/anime_provider_catalogs.json
          (cd private-source && python -m unittest discover -s tools/yuzono_anime_probe/tests -p 'test_*.py' -v)

      - name: Write deterministic receipt
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
          GENERATION_ID: ${{ steps.request.outputs.generation_id }}
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          {
            echo '## Yuzono PT-BR full-audit identity'
            echo
            echo "- mode: \`$MODE\`"
            echo "- generation: \`$GENERATION_ID\`"
            echo "- probe source: \`$SOURCE_SHA\`"
            echo "- GoAnime baseline: \`$GOANIME_BASELINE_SHA\`"
            echo "- Yuzono: \`$YUZONO_REVISION\`"
            echo "- Anikku: \`$ANIKKU_REVISION\`"
            echo '- Scope follows GoAnime centralized module policy; upstream isNsfw metadata is preserved without blanket exclusion'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkouts
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/baseline-source"

  reference-runtime:
    name: Build immutable pinned Anikku reference runtime
    needs: deterministic
    if: needs.deterministic.outputs.mode != 'deterministic'
    outputs:
      reference_run_id: ${{ steps.runtime-identity.outputs.reference_run_id }}
      reference_artifact_name: ${{ steps.runtime-identity.outputs.reference_artifact_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      FORCE_FALLBACK: ${{ needs.deterministic.outputs.force_fallback }}
      REFERENCE_RUNTIME_RUN_ID: ${{ needs.deterministic.outputs.reference_runtime_run_id }}
    steps:
      - name: Checkout Toolchains workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GoAnime probe source for first runtime only
        if: needs.deterministic.outputs.reference_runtime_run_id == ''
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout pinned Anikku runtime for first runtime only
        if: needs.deterministic.outputs.reference_runtime_run_id == ''
        uses: actions/checkout@v6
        with:
          repository: komikku-app/anikku
          ref: ${{ env.ANIKKU_REVISION }}
          path: anikku
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Temurin JDK 8 for exact FlexibleAdapter fallback
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify JDK 8 for exact FlexibleAdapter fallback
        shell: bash
        run: |
          set -euo pipefail
          test -x "${JAVA_HOME_8_X64}/bin/java"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Reuse origin immutable reference runtime
        if: needs.deterministic.outputs.reference_runtime_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: yuzono-reference-runtime-${{ needs.deterministic.outputs.generation_id }}
          path: reference-runtime
          github-token: ${{ github.token }}
          run-id: ${{ needs.deterministic.outputs.reference_runtime_run_id }}

      - name: Build one immutable reference runtime
        if: needs.deterministic.outputs.reference_runtime_run_id == '' && needs.deterministic.outputs.continuation_index == '0'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --anikku-root anikku
            --goanime-source-root private-source
            --harness-script private-source/tools/yuzono_anime_probe/android_harness/inject_harness.py
            --output-dir reference-runtime
            --goanime-source-sha "$GOANIME_SOURCE_SHA"
            --anikku-sha "$ANIKKU_REVISION"
            --flexible-adapter-sha "$FLEXIBLE_ADAPTER_SHA"
            --jdk-major 17
          )
          if [[ "$FORCE_FALLBACK" == true ]]; then
            args+=( --force-flexible-adapter-fallback )
          fi
          bash scripts/goanime_yuzono/build_reference_runtime.sh "${args[@]}"

      - name: Verify reference runtime artifact shape
        shell: bash
        run: |
          set -euo pipefail
          test "$(find reference-runtime -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test -z "$(find reference-runtime -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f reference-runtime/anikku-app-debug.apk
          test -f reference-runtime/anikku-app-debug-androidTest.apk
          test -f reference-runtime/reference-runtime-manifest.json

      - name: Verify reference runtime identity and sanitized artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/verify_reference_manifest.py \
            --manifest reference-runtime/reference-runtime-manifest.json \
            --app-apk reference-runtime/anikku-app-debug.apk \
            --test-apk reference-runtime/anikku-app-debug-androidTest.apk \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --anikku-sha "$ANIKKU_REVISION" \
            --flexible-adapter-sha "$FLEXIBLE_ADAPTER_SHA" \
            --jdk-major 17
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --root reference-runtime

      - name: Persist reference runtime origin identity
        id: runtime-identity
        shell: bash
        env:
          GENERATION_ID: ${{ needs.deterministic.outputs.generation_id }}
        run: |
          set -euo pipefail
          origin_run_id="${REFERENCE_RUNTIME_RUN_ID:-$GITHUB_RUN_ID}"
          [[ "$origin_run_id" =~ ^[1-9][0-9]*$ ]] || { echo '::error::reference runtime origin run id is invalid'; exit 1; }
          artifact_name="yuzono-reference-runtime-$GENERATION_ID"
          echo "reference_run_id=$origin_run_id" >> "$GITHUB_OUTPUT"
          echo "reference_artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          {
            echo '## Reference runtime identity'
            echo
            echo "- origin run: \`$origin_run_id\`"
            echo "- artifact: \`$artifact_name\`"
            echo "- generation: \`$GENERATION_ID\`"
            echo '- continuation policy: origin artifact is downloaded and verified; no rebuild is permitted'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable reference runtime
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-reference-runtime-${{ needs.deterministic.outputs.generation_id }}
          path: reference-runtime
          if-no-files-found: error
          retention-days: 14

      - name: Remove transient trees
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/anikku"

  canary:
    name: Instrumented PT-BR canary
    needs:
      - deterministic
      - reference-runtime
    if: needs.deterministic.outputs.mode != 'deterministic' && needs.reference-runtime.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      GENERATION_ID: ${{ needs.deterministic.outputs.generation_id }}
      MODULES: animefire,anikyuu,pifansubs
      MAX_RETRIES: '1'
      MAX_PAGES: '3'
      STAGE_TIMEOUT_SECONDS: '45'
      ANIKKU_ROOT: reference-runtime-tree
    steps:
      - name: Checkout Toolchains workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GoAnime probe source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout pinned Yuzono extensions
        uses: actions/checkout@v6
        with:
          repository: yuzono/anime-extensions
          ref: ${{ env.YUZONO_REVISION }}
          path: yuzono
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Download and verify shared reference runtime
        uses: actions/download-artifact@v4
        with:
          name: yuzono-reference-runtime-${{ needs.deterministic.outputs.generation_id }}
          path: reference-runtime

      - name: Stage verified runtime for emulator harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(find reference-runtime -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test -z "$(find reference-runtime -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f reference-runtime/anikku-app-debug.apk
          test -f reference-runtime/anikku-app-debug-androidTest.apk
          test -f reference-runtime/reference-runtime-manifest.json
          python3 scripts/goanime_yuzono/verify_reference_manifest.py \
            --manifest reference-runtime/reference-runtime-manifest.json \
            --app-apk reference-runtime/anikku-app-debug.apk \
            --test-apk reference-runtime/anikku-app-debug-androidTest.apk \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --anikku-sha "$ANIKKU_REVISION" \
            --flexible-adapter-sha "$FLEXIBLE_ADAPTER_SHA" \
            --jdk-major 17
          mkdir -p \
            reference-runtime-tree/app/build/outputs/apk/debug \
            reference-runtime-tree/app/build/outputs/apk/androidTest
          cp reference-runtime/anikku-app-debug.apk \
            reference-runtime-tree/app/build/outputs/apk/debug/anikku-app-debug.apk
          cp reference-runtime/anikku-app-debug-androidTest.apk \
            reference-runtime-tree/app/build/outputs/apk/androidTest/anikku-app-debug-androidTest.apk

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build canary PT extensions independently
        working-directory: yuzono
        shell: bash
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/goanime-yuzono-canary-gradle"
          mkdir -p "$log_dir"
          for module in animefire anikyuu pifansubs; do
            ok=0
            for attempt in 1 2; do
              echo "Building $module attempt $attempt/2"
              args=( "src:pt:$module:assembleDebug" --no-daemon --stacktrace )
              if (( attempt > 1 )); then args+=( --refresh-dependencies ); fi
              log_path="$log_dir/${module}-attempt-${attempt}.log"
              raw_log="${RUNNER_TEMP}/goanime-yuzono-canary-${module}-attempt-${attempt}.raw.log"
              started_at="$(date +%s)"
              if ./gradlew "${args[@]}" > "$raw_log" 2>&1; then
                elapsed_seconds=$(( $(date +%s) - started_at ))
                printf 'BUILD SUCCESSFUL in %ss\n' "$elapsed_seconds" > "$log_path"
                rm -f "$raw_log"
                ok=1
                break
              fi
              elapsed_seconds=$(( $(date +%s) - started_at ))
              printf 'BUILD FAILED in %ss\n' "$elapsed_seconds" > "$log_path"
              rm -f "$raw_log"
              sleep 20
            done
            if (( ok == 0 )); then echo "::warning::$module did not build; runner will classify extension-build"; fi
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute canary providers in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p "${RUNNER_TEMP}/goanime-yuzono-canary-instrumentation"
            bash private-source/tools/yuzono_anime_probe/android_harness/run_emulator_probes.sh > "${RUNNER_TEMP}/goanime-yuzono-canary-instrumentation/instrumentation.log" 2>&1

      - name: Gate sanitized canary outputs and logs
        id: sanitize-canary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --root probe-state \
            --logs-dir "${RUNNER_TEMP}/goanime-yuzono-canary-gradle" \
            --log "${RUNNER_TEMP}/goanime-yuzono-canary-instrumentation/instrumentation.log"

      - name: Verify accepted canary boundary
        id: verify-canary
        if: always() && steps.sanitize-canary.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/goanime_yuzono/verify_canary.py \
            --root probe-state \
            --manifest reference-runtime/reference-runtime-manifest.json \
            --modules "$MODULES" \
            --structural-module animefire \
            --candidate-modules anikyuu,pifansubs \
            --generation-id "$GENERATION_ID" \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --goanime-baseline-sha "$GOANIME_BASELINE_SHA" \
            --upstream-revision "$YUZONO_REVISION" \
            --anikku-sha "$ANIKKU_REVISION" \
            --output canary-verification/canary-verification.json

      - name: Gate sanitized canary verification
        id: sanitize-canary-verification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --root canary-verification

      - name: Write sanitized canary summary
        if: always() && steps.sanitize-canary.outcome == 'success' && steps.sanitize-canary-verification.outcome == 'success'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          summary = Path(os.environ['GITHUB_STEP_SUMMARY'])
          providers = sorted(Path('probe-state/providers').glob('*.json'))
          lines = ['', '## Instrumented PT-BR canary', '', '| Provider | Status | Stage | Titles | Playback | Failure |', '|---|---|---|---:|---:|---|']
          for path in providers:
              raw = json.loads(path.read_text(encoding='utf-8'))
              lines.append(f"| {raw.get('displayName', path.stem)} | {raw.get('status', 'unknown')} | {raw.get('stage', 'discovered')} | {len(raw.get('titles', []))} | {raw.get('playbackSampleCount', 0)} | {raw.get('failureKind') or ''} |")
          if not providers:
              lines.append('| no result | broken | discovered | 0 | 0 | structural-canary-failure |')
          with summary.open('a', encoding='utf-8') as handle:
              handle.write('\n'.join(lines) + '\n')
          PY

      - name: Upload sanitized canary state
        if: always() && steps.sanitize-canary.outcome == 'success' && steps.sanitize-canary-verification.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-full-audit-canary-${{ github.run_id }}
          path: |
            probe-state
            canary-verification
          if-no-files-found: warn
          retention-days: 7

      - name: Remove transient trees
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/yuzono"

  prepare-full:
    name: Prepare resumable full-audit matrix
    needs:
      - deterministic
      - canary
    if: needs.deterministic.outputs.mode == 'full' && needs.canary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_pending: ${{ steps.plan.outputs.has_pending }}
      pending_count: ${{ steps.plan.outputs.pending_count }}
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      GENERATION_ID: ${{ needs.deterministic.outputs.generation_id }}
      PARENT_RUN_ID: ${{ needs.deterministic.outputs.parent_run_id }}
    steps:
      - name: Checkout Toolchains workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GoAnime probe source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout pinned Yuzono inventory source
        uses: actions/checkout@v6
        with:
          repository: yuzono/anime-extensions
          ref: ${{ env.YUZONO_REVISION }}
          path: yuzono
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Initialize audit plan and restore parent state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit-plan/resume-state/checkpoints audit-plan/resume-state/providers
          if [[ -n "$PARENT_RUN_ID" ]]; then
            mkdir -p inherited-download
            gh run download "$PARENT_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "yuzono-full-audit-consolidated-$GENERATION_ID" \
              --dir inherited-download
            if [[ -d inherited-download/consolidated-state ]]; then
              cp -a inherited-download/consolidated-state/. audit-plan/resume-state/
            else
              echo '::error::Parent run artifact does not contain consolidated-state'
              exit 1
            fi
          fi

      - name: Discover inventory and pending providers
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/private-source"
          python -m tools.yuzono_anime_probe.cli inventory \
            --repo-root yuzono \
            --revision "$YUZONO_REVISION" \
            --output audit-plan/inventory.json
          python -m tools.yuzono_anime_probe.cli pending \
            --inventory audit-plan/inventory.json \
            --checkpoint-dir audit-plan/resume-state/checkpoints \
            --generation-id "$GENERATION_ID" \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --goanime-baseline-sha "$GOANIME_BASELINE_SHA" \
            --upstream-revision "$YUZONO_REVISION" \
            --anikku-revision "$ANIKKU_REVISION" \
            --output audit-plan/pending.json
          python - <<'PY'
          import json
          from pathlib import Path
          inventory = json.loads(Path('audit-plan/inventory.json').read_text(encoding='utf-8'))
          pending = set(json.loads(Path('audit-plan/pending.json').read_text(encoding='utf-8')))
          scoped = [entry for entry in inventory if entry.get('module') in pending]
          Path('audit-plan/pending-inventory.json').write_text(json.dumps(scoped, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m tools.yuzono_anime_probe.cli shard-plan \
            --inventory audit-plan/pending-inventory.json \
            --shards 4 \
            --mode full \
            --output audit-plan/matrix.json

      - name: Export matrix
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          count="$(jq 'length' audit-plan/pending.json)"
          matrix="$(jq -c . audit-plan/matrix.json)"
          if (( count == 0 )); then
            matrix='{"include":[{"shard":0,"modules":[]}]}'
            echo 'has_pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_pending=true' >> "$GITHUB_OUTPUT"
          fi
          echo "pending_count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Pending centrally scoped providers: $count"
          jq -r '.[]' audit-plan/pending.json

      - name: Gate sanitized audit plan before upload
        id: sanitize-plan
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py --root audit-plan

      - name: Upload sanitized audit plan
        if: steps.sanitize-plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-full-audit-plan-${{ github.run_id }}
          path: audit-plan
          retention-days: 7

      - name: Remove transient source trees
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/yuzono" "$GITHUB_WORKSPACE/inherited-download"

  full-shard:
    name: Full audit shard ${{ matrix.shard }}
    needs:
      - deterministic
      - canary
      - prepare-full
      - reference-runtime
    if: needs.prepare-full.outputs.has_pending == 'true' && needs.reference-runtime.result == 'success' && needs.canary.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.prepare-full.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      GENERATION_ID: ${{ needs.deterministic.outputs.generation_id }}
      MODULES: ${{ join(matrix.modules, ',') }}
      MAX_RETRIES: '2'
      MAX_PAGES: '1000'
      STAGE_TIMEOUT_SECONDS: '60'
      SOFT_BUDGET_SECONDS: '18000'
      CONTINUATION_RESERVE_SECONDS: '1800'
      ESTIMATED_NEXT_SECONDS: '900'
      ANIKKU_ROOT: reference-runtime-tree
    steps:
      - name: Checkout Toolchains workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GoAnime probe source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout pinned Yuzono extensions
        uses: actions/checkout@v6
        with:
          repository: yuzono/anime-extensions
          ref: ${{ env.YUZONO_REVISION }}
          path: yuzono
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Download audit plan and inherited state
        uses: actions/download-artifact@v4
        with:
          name: yuzono-full-audit-plan-${{ github.run_id }}
          path: audit-plan

      - name: Download and verify shared reference runtime
        uses: actions/download-artifact@v4
        with:
          name: yuzono-reference-runtime-${{ needs.deterministic.outputs.generation_id }}
          path: reference-runtime

      - name: Stage verified runtime for emulator harness
        shell: bash
        run: |
          set -euo pipefail
          test "$(find reference-runtime -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 3
          test -f reference-runtime/anikku-app-debug.apk
          test -f reference-runtime/anikku-app-debug-androidTest.apk
          test -f reference-runtime/reference-runtime-manifest.json
          python3 scripts/goanime_yuzono/verify_reference_manifest.py \
            --manifest reference-runtime/reference-runtime-manifest.json \
            --app-apk reference-runtime/anikku-app-debug.apk \
            --test-apk reference-runtime/anikku-app-debug-androidTest.apk \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --anikku-sha "$ANIKKU_REVISION" \
            --flexible-adapter-sha "$FLEXIBLE_ADAPTER_SHA" \
            --jdk-major 17
          mkdir -p \
            reference-runtime-tree/app/build/outputs/apk/debug \
            reference-runtime-tree/app/build/outputs/apk/androidTest
          cp reference-runtime/anikku-app-debug.apk \
            reference-runtime-tree/app/build/outputs/apk/debug/anikku-app-debug.apk
          cp reference-runtime/anikku-app-debug-androidTest.apk \
            reference-runtime-tree/app/build/outputs/apk/androidTest/anikku-app-debug-androidTest.apk

      - name: Initialize resumable shard state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probe-state/checkpoints probe-state/providers
          if [[ -d audit-plan/resume-state ]]; then
            cp -a audit-plan/resume-state/. probe-state/
          fi

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Build pending extensions independently
        working-directory: yuzono
        shell: bash
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/goanime-yuzono-full-gradle-${{ matrix.shard }}"
          mkdir -p "$log_dir"
          IFS=',' read -r -a modules <<< "$MODULES"
          for module in "${modules[@]}"; do
            [[ "$module" =~ ^[a-z0-9._-]+$ ]] || { echo "invalid module $module"; exit 2; }
            ok=0
            for attempt in 1 2; do
              echo "Building $module attempt $attempt/2"
              args=( "src:pt:$module:assembleDebug" --no-daemon --stacktrace )
              if (( attempt > 1 )); then args+=( --refresh-dependencies ); fi
              log_path="$log_dir/${module}-attempt-${attempt}.log"
              raw_log="${RUNNER_TEMP}/goanime-yuzono-full-${{ matrix.shard }}-${module}-attempt-${attempt}.raw.log"
              started_at="$(date +%s)"
              if ./gradlew "${args[@]}" > "$raw_log" 2>&1; then
                elapsed_seconds=$(( $(date +%s) - started_at ))
                printf 'BUILD SUCCESSFUL in %ss\n' "$elapsed_seconds" > "$log_path"
                rm -f "$raw_log"
                ok=1
                break
              fi
              elapsed_seconds=$(( $(date +%s) - started_at ))
              printf 'BUILD FAILED in %ss\n' "$elapsed_seconds" > "$log_path"
              rm -f "$raw_log"
              sleep 20
            done
            if (( ok == 0 )); then echo "::warning::$module did not build; provider result will record extension-build"; fi
          done

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute shard in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p "${RUNNER_TEMP}/goanime-yuzono-full-instrumentation-${{ matrix.shard }}"
            bash private-source/tools/yuzono_anime_probe/android_harness/run_emulator_probes.sh > "${RUNNER_TEMP}/goanime-yuzono-full-instrumentation-${{ matrix.shard }}/instrumentation.log" 2>&1

      - name: Gate sanitized shard outputs and logs
        id: sanitize-shard
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --root probe-state \
            --logs-dir "${RUNNER_TEMP}/goanime-yuzono-full-gradle-${{ matrix.shard }}" \
            --log "${RUNNER_TEMP}/goanime-yuzono-full-instrumentation-${{ matrix.shard }}/instrumentation.log"

      - name: Upload sanitized shard checkpoint
        if: always() && steps.sanitize-shard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-full-audit-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: probe-state
          if-no-files-found: warn
          retention-days: 7

      - name: Remove transient trees
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/yuzono"

  finalize-full:
    name: Consolidate, deduplicate and continue
    needs:
      - deterministic
      - canary
      - prepare-full
      - full-shard
      - reference-runtime
    if: always() && needs.prepare-full.result == 'success' && needs.reference-runtime.result == 'success' && needs.canary.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      GENERATION_ID: ${{ needs.deterministic.outputs.generation_id }}
      CONTINUATION_INDEX: ${{ needs.deterministic.outputs.continuation_index }}
      REFERENCE_RUNTIME_RUN_ID: ${{ needs.reference-runtime.outputs.reference_run_id }}
    steps:
      - name: Checkout Toolchains workflow
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact GoAnime probe source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Checkout exact GoAnime catalog baseline
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_BASELINE_SHA }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: baseline-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Download audit plan
        uses: actions/download-artifact@v4
        with:
          name: yuzono-full-audit-plan-${{ github.run_id }}
          path: audit-plan

      - name: Download immutable reference runtime identity
        uses: actions/download-artifact@v4
        with:
          name: yuzono-reference-runtime-${{ needs.deterministic.outputs.generation_id }}
          path: reference-runtime

      - name: Download all current shard states
        if: needs.prepare-full.outputs.has_pending == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: yuzono-full-audit-shard-*-${{ github.run_id }}
          path: shard-download
          merge-multiple: false

      - name: Merge sanitized state
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/private-source"
          mkdir -p empty-state/checkpoints empty-state/providers empty-state/path-identity
          args=( --state-dir empty-state )
          if [[ -d audit-plan/resume-state/checkpoints ]]; then
            args+=( --state-dir audit-plan/resume-state )
          fi
          if [[ -d shard-download ]]; then
            while IFS= read -r state_dir; do
              args+=( --state-dir "$state_dir" )
            done < <(find shard-download -mindepth 1 -maxdepth 1 -type d | sort)
          fi
          python -m tools.yuzono_anime_probe.cli merge-state \
            "${args[@]}" \
            --output-dir consolidated-state \
            --generation-id "$GENERATION_ID" \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --goanime-baseline-sha "$GOANIME_BASELINE_SHA" \
            --upstream-revision "$YUZONO_REVISION" \
            --anikku-revision "$ANIKKU_REVISION"

      - name: Aggregate catalog, deduplicate and compute promotion gate
        shell: bash
        env:
          FULL_SHARD_RESULT: ${{ needs.full-shard.result }}
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/private-source"
          python -m tools.yuzono_anime_probe.cli aggregate \
            --inventory audit-plan/inventory.json \
            --provider-dir consolidated-state/providers \
            --baseline baseline-source/assets/data/anime_provider_catalogs.json \
            --output-dir audit-output
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          matrix = json.loads(Path('audit-plan/matrix.json').read_text(encoding='utf-8'))
          identity_dir = Path('consolidated-state/path-identity')
          shards = []
          for entry in matrix.get('include', []):
              shard = entry.get('shard')
              modules = entry.get('modules')
              if not isinstance(shard, int) or not isinstance(modules, list) or not modules:
                  continue
              provider_execution_started = True
              for module in modules:
                  identity_path = identity_dir / f'{module}.json'
                  try:
                      identity = json.loads(identity_path.read_text(encoding='utf-8'))
                  except (OSError, UnicodeError, json.JSONDecodeError):
                      provider_execution_started = False
                      continue
                  if not isinstance(identity, dict) or identity.get('providerExecutionStarted') is not True:
                      provider_execution_started = False
              conclusion = os.environ['FULL_SHARD_RESULT']
              shards.append({
                  'shard': shard,
                  'modules': modules,
                  'jobConclusion': conclusion,
                  'providerExecutionStarted': provider_execution_started,
                  'aggregateConclusion': conclusion,
              })
          results_path = Path('audit-output/results.json')
          results = json.loads(results_path.read_text(encoding='utf-8'))
          results['workflowEvidence'] = {
              'schemaVersion': 1,
              'fullShardResult': os.environ['FULL_SHARD_RESULT'],
              'shards': shards,
          }
          results_path.write_text(json.dumps(results, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python -m tools.yuzono_anime_probe.cli pending \
            --inventory audit-plan/inventory.json \
            --checkpoint-dir consolidated-state/checkpoints \
            --generation-id "$GENERATION_ID" \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --goanime-baseline-sha "$GOANIME_BASELINE_SHA" \
            --upstream-revision "$YUZONO_REVISION" \
            --anikku-revision "$ANIKKU_REVISION" \
            --output audit-output/pending.json

      - name: Gate independent generation integrity and completion
        id: verify-generation
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/private-source"
          python -m tools.yuzono_anime_probe.cli verify-state \
            --inventory audit-plan/inventory.json \
            --checkpoint-dir consolidated-state/checkpoints \
            --provider-dir consolidated-state/providers \
            --pending audit-output/pending.json \
            --aggregate audit-output/results.json \
            --generation-id "$GENERATION_ID" \
            --goanime-source-sha "$GOANIME_SOURCE_SHA" \
            --goanime-baseline-sha "$GOANIME_BASELINE_SHA" \
            --upstream-revision "$YUZONO_REVISION" \
            --anikku-revision "$ANIKKU_REVISION" \
            --reference-runtime-dir reference-runtime \
            --path-identity-dir consolidated-state/path-identity \
            --flexible-adapter-sha "$FLEXIBLE_ADAPTER_SHA" \
            --jdk-major 17 \
            --output audit-output/verification.json \
            --require-complete

      - name: Gate consolidated outputs before summary and upload
        id: sanitize-final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --root audit-plan \
            --root consolidated-state \
            --root audit-output

      - name: Materialize full-audit summary
        id: materialize-summary
        if: always() && steps.sanitize-final.outcome == 'success'
        shell: bash
        env:
          SUMMARY_FILE: ${{ runner.temp }}/goanime-yuzono-full-summary.md
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          cat audit-output/report.md > "$SUMMARY_FILE"
          pending="$(jq 'length' audit-output/pending.json)"
          {
            echo
            echo '## Generation receipt'
            echo
            echo "- generation: \`$GENERATION_ID\`"
            echo "- continuation index: \`$CONTINUATION_INDEX\`"
            echo "- reference runtime origin run: \`$REFERENCE_RUNTIME_RUN_ID\`"
            echo "- pending providers: \`$pending\`"
            echo "- GoAnime probe SHA: \`$GOANIME_SOURCE_SHA\`"
            echo "- GoAnime baseline SHA: \`$GOANIME_BASELINE_SHA\`"
            echo "- Yuzono SHA: \`$YUZONO_REVISION\`"
            echo "- Anikku SHA: \`$ANIKKU_REVISION\`"
            echo '- Scope: centralized module policy; isNsfw remains metadata and mixed-content anime modules remain candidates; current GoAnime PT production modules are canary/control-only; donghuanosekai, doramogo and muitohentai are excluded as non-conventional; audit-only, with no production registration'
          } >> "$SUMMARY_FILE"
          test -s "$SUMMARY_FILE"

      - name: Gate materialized full-audit summary
        id: sanitize-summary
        if: always() && steps.materialize-summary.outcome == 'success'
        shell: bash
        env:
          SUMMARY_FILE: ${{ runner.temp }}/goanime-yuzono-full-summary.md
        run: |
          set -euo pipefail
          test -f scripts/goanime_yuzono/sanitize_audit_outputs.py
          python3 scripts/goanime_yuzono/sanitize_audit_outputs.py \
            --summary-file "$SUMMARY_FILE"

      - name: Publish sanitized full-audit summary
        if: always() && steps.sanitize-final.outcome == 'success' && steps.sanitize-summary.outcome == 'success'
        shell: bash
        env:
          SUMMARY_FILE: ${{ runner.temp }}/goanime-yuzono-full-summary.md
        run: |
          set -euo pipefail
          cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload consolidated sanitized checkpoint and report
        if: always() && steps.sanitize-final.outcome == 'success' && steps.sanitize-summary.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-full-audit-consolidated-${{ needs.deterministic.outputs.generation_id }}
          path: |
            consolidated-state
            audit-output
            audit-plan/inventory.json
          retention-days: 14

      - name: Schedule bounded automatic continuation
        if: always() && steps.verify-generation.outcome == 'success' && steps.sanitize-final.outcome == 'success' && steps.sanitize-summary.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pending="$(jq 'length' audit-output/pending.json)"
          if (( pending == 0 )); then
            echo 'Audit has no pending providers; no continuation needed.'
            exit 0
          fi
          if (( CONTINUATION_INDEX >= 8 )); then
            echo "::warning::Audit still has $pending pending providers but continuation cap 8 was reached"
            exit 0
          fi
          if [[ "$REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "Automatic continuation is armed but not dispatched from validation branch; promote workflow to $DEFAULT_BRANCH first."
            exit 0
          fi
          next_index=$((CONTINUATION_INDEX + 1))
          gh workflow run goanime-yuzono-ptbr-anime-full-audit.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f source_sha="$GOANIME_SOURCE_SHA" \
            -f generation_id="$GENERATION_ID" \
            -f mode=full \
            -f parent_run_id="$GITHUB_RUN_ID" \
            -f continuation_index="$next_index" \
            -f reference_runtime_run_id="$REFERENCE_RUNTIME_RUN_ID"
          echo "Scheduled continuation $next_index with $pending pending providers."

      - name: Enforce independent generation completeness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s audit-output/verification.json
          jq -e '
            (.consistent == true) and
            (.complete == true) and
            (.pending_count == 0) and
            (.blocker_count == 0) and
            (.missing_result_count == 0) and
            (.identity_mismatch_count == 0) and
            (.accepted_terminal_count == .scoped_count)
          ' audit-output/verification.json >/dev/null

      - name: Remove private checkouts
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/baseline-source"
