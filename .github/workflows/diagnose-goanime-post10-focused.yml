name: Diagnose GoAnime post-10 focused tests

on:
  push:
    branches: [main]
    paths:
      - 'triggers/diagnose-goanime-post10-focused/*.request'

permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/diagnose-goanime-post10-focused/*.request' | head -n1)"
          read -r project base candidate < "control/$request"
          test "$project" = goanime
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.req.outputs.candidate }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
      - name: Reproduce v2 derived snapshot
        working-directory: source
        env:
          BASE: ${{ steps.req.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/services/source/unified_source_stale_fallback_cache_test.dart')
          s=p.read_text()
          marker="import 'package:flutter_test/flutter_test.dart';\n"
          imp="import 'package:goanime_core/goanime_core.dart';\n"
          if imp not in s:
              s=s.replace(marker, marker+imp, 1)
          p.write_text(s)
          for f,line in [
              ('lib/widgets/goanime_opening.dart',"import 'package:flutter/foundation.dart';\n"),
              ('test/widgets/goanime_opening_test.dart',"import 'package:flutter/painting.dart';\n"),
          ]:
              q=Path(f)
              t=q.read_text()
              q.write_text(t.replace(line,'',1))
          PY
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD -- '*.dart')
          files+=(lib/widgets/goanime_opening.dart test/widgets/goanime_opening_test.dart)
          printf '%s\n' "${files[@]}" | sort -u | xargs dart format >/dev/null
          flutter pub get >/dev/null
      - name: Run changed hardening tests
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            test/services/download/download_completion_policy_test.dart
            test/services/download/download_identity_transfer_test.dart
            test/services/download_service_test.dart
            test/services/source/shared_cancellable_work_test.dart
            test/services/source/unified_source_stale_fallback_cache_test.dart
            test/services/unified_source_shared_cancellation_test.dart
          )
          failed=''
          rc=0
          : > "$RUNNER_TEMP/focused.log"
          for test_file in "${tests[@]}"; do
            printf '\n===== %s =====\n' "$test_file" >> "$RUNNER_TEMP/focused.log"
            set +e
            flutter test --no-pub --concurrency=1 "$test_file" >> "$RUNNER_TEMP/focused.log" 2>&1
            current_rc=$?
            set -e
            if [ "$current_rc" -ne 0 ]; then
              failed="$test_file"
              rc="$current_rc"
              break
            fi
          done
          python3 - "$RUNNER_TEMP/focused.log" "$RUNNER_TEMP/report.json" "$failed" "$rc" <<'PY'
          import json,re,sys
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          raw=re.sub(r'(?i)(token|secret|password|authorization)(\s*[:=]\s*)\S+',r'\1\2[redacted]',raw)
          payload={
            'schemaVersion':1,
            'failedTestFile':sys.argv[3] or None,
            'exitCode':int(sys.argv[4]),
            'logTail':raw[-12000:],
          }
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          encoded="$(base64 -w0 < "$RUNNER_TEMP/report.json")"
          path="results/diagnose-goanime-post10-focused/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(diagnose): record post-10 focused result $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
          exit "$rc"
