name: Apply private Hydra patch

on:
  push:
    branches: [main]
    paths:
      - 'triggers/hydra-private-patch/*.request'

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-private-hydra-patch
  cancel-in-progress: false

jobs:
  apply:
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}'
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request and patch
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/hydra-private-patch/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch base_sha patch_path patch_sha256 < "toolchain-control/$request"
          test "$project" = "hydra"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$patch_path" =~ ^\.hydra-patches/[A-Za-z0-9._/-]+\.patch$ ]]
          [[ "$patch_sha256" =~ ^[0-9a-f]{64}$ ]]
          test -f "toolchain-control/$patch_path"
          test ! -L "toolchain-control/$patch_path"
          test "$(wc -c < "toolchain-control/$patch_path")" -le 4194304
          actual_patch_sha256="$(sha256sum "toolchain-control/$patch_path" | awk '{print $1}')"
          test "$actual_patch_sha256" = "$patch_sha256"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "patch_path=$patch_path" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private Hydra base
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ steps.request.outputs.base_sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify branch still points to exact base
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/HydraPersonalizado.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$BASE_SHA"

      - name: Validate and apply controlled patch
        working-directory: private-source
        shell: bash
        env:
          PATCH_PATH: ${{ steps.request.outputs.patch_path }}
        run: |
          set -euo pipefail
          patch_file="$GITHUB_WORKSPACE/toolchain-control/$PATCH_PATH"
          git apply --check "$patch_file"
          git apply "$patch_file"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -ge 1
          test "${#changed[@]}" -le 64
          for path in "${changed[@]}"; do
            if [[ "$path" =~ (^|/)(\.env|secrets?)(/|$) ]] || [[ "$path" == .github/workflows/* ]]; then
              echo "Patch touches protected path: $path" >&2
              exit 1
            fi
          done

      - name: Recheck remote branch before push
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/HydraPersonalizado.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$BASE_SHA"

      - name: Commit and push patch
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          BASE_SHA: ${{ steps.request.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name 'Arthur Almeida'
          git config user.email 'arthurgva1602@gmail.com'
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m 'chore(hydra): apply controlled toolchain patch'
          git remote set-url origin "https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/HydraPersonalizado.git"
          git push --force-with-lease="refs/heads/$TARGET_BRANCH:$BASE_SHA" origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove private and transient data
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control"

  report:
    needs: apply
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publish sanitized controlled-patch receipt
        uses: actions/github-script@v8
        env:
          APPLY_RESULT: ${{ needs.apply.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const marker = `<!-- hydra-controlled-patch-run:${runId} -->`;
            const body = [
              marker,
              '### Apply private Hydra patch',
              '',
              `- Run: [${runId}](https://github.com/${owner}/${repo}/actions/runs/${runId})`,
              `- Conclusion: \`${process.env.APPLY_RESULT}\``,
              '- Private checkout contents, patch payload and credentials are intentionally omitted.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: 4,
              body,
            });
