name: Relay Hydra validation

on:
  push:
    paths:
      - "triggers/hydra-validation-relay.json"

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read validation request
        id: request
        env:
          REQUEST_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/triggers/hydra-validation-relay.json
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          request="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/triggers/hydra-validation-relay.json?ref=${GITHUB_SHA}")"
          ref="$(printf '%s' "$request" | jq -er '.ref | select(type == "string" and length > 0 and length <= 255)')"
          if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ]]; then
            echo "Invalid ref" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Hydra validator
        env:
          GH_TOKEN: ${{ github.token }}
          HYDRA_REF: ${{ steps.request.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -cn --arg ref "$HYDRA_REF" '{ref:"main", inputs:{ref:$ref}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/validate-hydra.yml/dispatches" \
            -d "$body"
