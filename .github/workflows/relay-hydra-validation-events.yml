name: Relay Hydra validation events

on:
  push:
    paths:
      - "triggers/hydra-validation-relay/*.json"

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve validation request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          commit_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}")"
          request_path="$(printf '%s' "$commit_json" | jq -er '[.files[].filename | select(startswith("triggers/hydra-validation-relay/") and endswith(".json"))][0]')"
          if [[ -z "$request_path" || "$request_path" == *$'\n'* || "$request_path" == *$'\r'* ]]; then
            echo "Unable to resolve validation request path" >&2
            exit 1
          fi
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$request_path")"
          request="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${encoded}?ref=${GITHUB_SHA}")"
          ref="$(printf '%s' "$request" | jq -er '.ref | select(type == "string" and length > 0 and length <= 255)')"
          if [[ "$ref" == *$'\n'* || "$ref" == *$'\r'* ]]; then
            echo "Invalid ref" >&2
            exit 1
          fi
          printf 'ref=%s\n' "$ref" >> "$GITHUB_OUTPUT"
          printf 'request_path=%s\n' "$request_path" >> "$GITHUB_OUTPUT"

      - name: Dispatch canonical Hydra validator
        env:
          GH_TOKEN: ${{ github.token }}
          HYDRA_REF: ${{ steps.request.outputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(jq -cn --arg ref "$HYDRA_REF" '{ref:"main",inputs:{ref:$ref}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/validate-hydra.yml/dispatches" \
            -d "$body"

      - name: Remove consumed request
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$REQUEST_PATH")"
          metadata="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${encoded}?ref=main")"
          sha="$(printf '%s' "$metadata" | jq -er '.sha')"
          body="$(jq -cn --arg message "ci(hydra): consume validation relay request" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
          curl --fail-with-body --silent --show-error \
            -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/${encoded}" \
            -d "$body" >/dev/null
