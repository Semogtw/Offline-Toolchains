name: GoAnime Manga Provider Report Check

on:
  push:
    paths:
      - '.github/workflows/goanime-manga-provider-report-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime provider-report branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/manga-catalog-canonicalization-v2-20260906
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Check formatting
        working-directory: private-source
        run: >-
          dart format --output=none --set-exit-if-changed
          tools/manga/build_global_manga_availability.dart
          tools/manga/build_global_manga_availability_impl.dart
          tools/manga/materialize_global_manga_availability_ci.sh
          test/tools/build_global_manga_availability_test.dart
          test/tools/manga_provider_availability_receipt_test.dart
          test/tools/materialize_global_manga_availability_gate_test.dart

      - name: Analyze changed Dart surface
        working-directory: private-source
        run: >-
          flutter analyze --no-pub
          tools/manga/build_global_manga_availability.dart
          tools/manga/build_global_manga_availability_impl.dart
          test/tools/build_global_manga_availability_test.dart
          test/tools/manga_provider_availability_receipt_test.dart
          test/tools/materialize_global_manga_availability_gate_test.dart

      - name: Run provider-report regression tests
        working-directory: private-source
        run: >-
          flutter test --no-pub --concurrency=1
          test/tools/build_global_manga_availability_test.dart
          test/tools/manga_provider_availability_receipt_test.dart
          test/tools/materialize_global_manga_availability_gate_test.dart
