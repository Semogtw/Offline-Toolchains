name: Probe GoAnime catalog write capability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-goanime-catalog-write.yml'
      - 'triggers/probe-goanime-catalog-write.json'

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify dedicated token can write only through GitHub API
        shell: bash
        env:
          TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$TOKEN" || {
            echo 'GOANIME_CATALOG_WRITE_TOKEN is missing.' >&2
            exit 1
          }
          permissions="$(curl --fail-with-body --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Semogtw/goanime-mobile \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("permissions",{}).get("push", False))')"
          test "$permissions" = 'True' || {
            echo 'GOANIME_CATALOG_WRITE_TOKEN exists but lacks push/Contents write permission on Semogtw/goanime-mobile.' >&2
            exit 1
          }
          echo 'Dedicated GoAnime catalog token is present and has push permission.'
