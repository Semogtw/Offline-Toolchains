name: Diagnose GoAnime PR262 adapter contract expectations

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-goanime-pr262-manhastro-expectations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    name: Isolated recommendation adapter regression
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact private GoAnime commit
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: e8738315a37e04a7cd6e99c656b29bf53ca94f70
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.1'
          cache: true

      - name: Run isolated adapter tests and publish assertion-only diagnostics
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile >/dev/null
          set +e
          flutter test --no-pub --reporter expanded test/services/manga/manhastro_recommendations_adapter_test.dart > "$RUNNER_TEMP/adapter-test.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo 'Adapter assertions (synthetic test fixtures only):'
            # Only the synthetic failing assertion block, not private source.
            awk '/draws genuinely new genres from a wider candidate pool \[E\]/{flag=1; count=0} flag && count++<28{print} flag && count>=28{exit}' "$RUNNER_TEMP/adapter-test.log" || true
            grep -E '^([0-9]+:[0-9]+ .*\[E\]| *Expected:| *Actual:| *Which:)' "$RUNNER_TEMP/adapter-test.log" | tail -30 || true
          else
            echo 'All adapter regression tests passed'
          fi
          rm -f "$RUNNER_TEMP/adapter-test.log"
          exit "$status"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$RUNNER_TEMP/adapter-test.log"
