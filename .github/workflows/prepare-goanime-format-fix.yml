name: Prepare verified GoAnime formatting fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-goanime-format-fix.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Checkout exact private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: fc2ab86c7501d7823fac4c3fe1eb3ce6a3a52567
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get

      - name: Format cache builder and verify full format gate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format tools/cache_builder.dart
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = 'tools/cache_builder.dart' || { echo "Unexpected formatted files:"; printf '%s\n' "$changed"; exit 1; }
          dart format --output=none --set-exit-if-changed lib test packages tools
          flutter test test/tools/cache_builder_pagination_test.dart test/tools/cache_builder_test.dart

      - name: Encrypt formatted file
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-format-fix"
          mkdir -p "$work/gpg" "$work/out"
          chmod 700 "$work/gpg"
          export GNUPGHOME="$work/gpg"
          cp "$GITHUB_WORKSPACE/private-source/tools/cache_builder.dart" "$work/cache_builder.dart"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$work/out/cache_builder.dart.gpg" --encrypt "$work/cache_builder.dart"
          sha256sum "$work/cache_builder.dart" > "$work/out/cache_builder.dart.sha256"
          printf '%s\n' 'fc2ab86c7501d7823fac4c3fe1eb3ce6a3a52567' > "$work/out/source-ref.txt"

      - name: Upload encrypted verified formatting handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-format-fix-encrypted-v2
          path: ${{ runner.temp }}/goanime-format-fix/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source" "$RUNNER_TEMP/goanime-format-fix"
