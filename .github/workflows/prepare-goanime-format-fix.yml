name: Prepare verified GoAnime formatting fix

on:
  push:
    branches: [main]
    paths:
      - triggers/private-goanime-format.json

permissions:
  contents: read

concurrency:
  group: private-goanime-format-fix
  cancel-in-progress: true

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-format.json"
          python3 - "$request" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          sha=str(payload.get('ref') or '').strip().lower()
          branch=str(payload.get('branch') or '').strip()
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('ref must be an exact SHA')
          if not re.fullmatch(r'[A-Za-z0-9._/-]{1,200}',branch) or branch.startswith('/') or branch.endswith('/') or '..' in branch:
              raise SystemExit('branch must be a safe existing branch name')
          with open(sys.argv[2],'a',encoding='utf-8') as out:
              out.write(f'ref={sha}\nbranch={branch}\n')
          PY

      - name: Checkout exact private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: true
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.request.outputs.ref }}'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get

      - name: Format only known global-gate debt
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          files=(
            test/services/providers/goyabu_quality_propagation_test.dart
            test/tools/super_animes_anilist_envelope_test.dart
            test/tools/super_animes_completion_policy_test.dart
            test/tools/super_animes_partial_batch_progress_test.dart
            tools/super_animes_anilist_mal_resolver.dart
          )
          dart format "${files[@]}"
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "${files[@]}" | sort)"
          test "$changed" = "$expected" || {
            echo 'Unexpected formatter change set:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          }

      - name: Verify project-wide formatting after cleanup
        working-directory: private-source
        run: dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Publish scoped formatting fix
        id: publish
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_REF: ${{ steps.request.outputs.ref }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_REF" || {
            echo 'Source branch moved during formatting; refusing to overwrite it.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            test/services/providers/goyabu_quality_propagation_test.dart \
            test/tools/super_animes_anilist_envelope_test.dart \
            test/tools/super_animes_completion_policy_test.dart \
            test/tools/super_animes_partial_batch_progress_test.dart \
            tools/super_animes_anilist_mal_resolver.dart
          if git diff --cached --quiet; then
            echo "published_sha=$EXPECTED_REF" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'style: satisfy project-wide Dart formatting gate'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: echo "Published formatting SHA ${{ steps.publish.outputs.published_sha }}"
