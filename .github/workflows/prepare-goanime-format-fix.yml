name: Prepare verified GoAnime formatting fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-goanime-format-fix.yml'

permissions:
  contents: read

jobs:
  prepare:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    env:
      SOURCE_REF: 3f6e59565c11a627950e23c231e5c6dbd4f9ba1d
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Checkout exact private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact private commit
        shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = "$SOURCE_REF"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get

      - name: Format unified catalog files
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/services/anime_metadata_cache_service.dart \
            lib/services/runtime_home_catalog_service.dart \
            tools/anilist_metadata_bulk_loader.dart \
            tools/build_anime_metadata_seed.dart \
            test/services/anime_metadata_home_candidates_test.dart \
            test/services/runtime_home_catalog_partial_cache_repair_test.dart \
            test/tools/anilist_metadata_bulk_loader_test.dart \
            test/tools/build_anime_metadata_seed_catalog_sources_test.dart
          git diff --check
          changed="$(git diff --name-only)"
          expected="$(printf '%s\n' \
            tools/anilist_metadata_bulk_loader.dart \
            test/services/anime_metadata_home_candidates_test.dart | sort)"
          test "$(printf '%s\n' "$changed" | sort)" = "$expected" || {
            echo 'Unexpected formatter change set:'
            printf '%s\n' "$changed"
            exit 1
          }

      - name: Run focused tests against formatted workspace
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub \
            test/services/anime_metadata_home_candidates_test.dart \
            test/services/runtime_home_catalog_seed_fallback_test.dart \
            test/services/runtime_home_catalog_partial_cache_repair_test.dart \
            test/services/runtime_home_catalog_resilience_test.dart \
            test/tools/anilist_metadata_bulk_loader_test.dart \
            test/tools/build_anime_metadata_seed_catalog_sources_test.dart

      - name: Encrypt formatted handoff
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-format-fix"
          mkdir -p "$work/gpg" "$work/out" "$work/payload/tools" "$work/payload/test/services"
          chmod 700 "$work/gpg"
          export GNUPGHOME="$work/gpg"
          cp private-source/tools/anilist_metadata_bulk_loader.dart "$work/payload/tools/"
          cp private-source/test/services/anime_metadata_home_candidates_test.dart "$work/payload/test/services/"
          tar -C "$work/payload" -czf "$work/formatted-files.tar.gz" .
          gpg --batch --import trusted-source/keys/source-bundles-public.asc
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$work/out/formatted-files.tar.gz.gpg" --encrypt "$work/formatted-files.tar.gz"
          sha256sum "$work/formatted-files.tar.gz" > "$work/out/formatted-files.tar.gz.sha256"
          printf '%s\n' "$SOURCE_REF" > "$work/out/source-ref.txt"

      - name: Upload encrypted verified formatting handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-unified-catalog-format-fix
          path: ${{ runner.temp }}/goanime-format-fix/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Cleanup private source
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source" "$RUNNER_TEMP/goanime-format-fix"
