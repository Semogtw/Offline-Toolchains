name: Final semantic production readiness

on:
  push:
    branches: [tooling/validate-semantic-coverage-20260810]
    paths: [.github/workflows/final-semantic-coverage-head.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SUPABASE_URL: https://playwright-fichario.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_playwright_capture_1234567890
    steps:
      - name: Checkout exact Fichario SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: 8f4d6558dc9ffe45f170274832581f050dbfe9d6
          path: app
          fetch-depth: 1
          persist-credentials: false

      - name: Assert source SHA
        working-directory: app
        run: test "$(git rev-parse HEAD)" = "8f4d6558dc9ffe45f170274832581f050dbfe9d6"

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Install dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        working-directory: app
        run: pnpm exec playwright install --with-deps chromium

      - name: Run strict production gates
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee "$RUNNER_TEMP/semantic-production.log") 2>&1
          echo "SOURCE_SHA=$(git rev-parse HEAD)"
          pnpm lint
          pnpm check
          pnpm test
          pnpm build
          pnpm test:source:offline
          pnpm test:functions:check
          pnpm test:e2e
          pnpm test:db:local
          echo "SEMANTIC_PRODUCTION_READY=1"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-production-readiness-log
          path: ${{ runner.temp }}/semantic-production.log
          if-no-files-found: warn
          retention-days: 3
