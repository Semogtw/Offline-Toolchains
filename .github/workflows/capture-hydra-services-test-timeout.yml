name: Capture Hydra services test timeout

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-hydra-services-test-timeout.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-hydra-services-test-timeout
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.1"
  GTK4_LAYER_SHELL_COMMIT: "1c963c51514581c41b9bdae08cdf69171265cdda"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Hydra main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: main
          path: hydra
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          cache: yarn
          cache-dependency-path: hydra/yarn.lock

      - name: Restore compiled dependencies
        id: dependency-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            hydra/node_modules
            hydra/hydra-native
            hydra/hydra-game-agent
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.cache/node-gyp
          key: hydra-dependencies-${{ runner.os }}-${{ env.NODE_VERSION }}-${{ env.GTK4_LAYER_SHELL_COMMIT }}-${{ hashFiles('hydra/yarn.lock') }}

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git libgtk-4-dev meson \
            ninja-build pkg-config python3 wayland-protocols

      - name: Install pinned GTK4 Layer Shell
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/gtk4-layer-shell"
          git init "$source_dir"
          git -C "$source_dir" remote add origin \
            https://github.com/wmww/gtk4-layer-shell.git
          git -C "$source_dir" fetch --depth=1 origin \
            "$GTK4_LAYER_SHELL_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          meson setup "$source_dir/build" "$source_dir" \
            --prefix=/usr/local --libdir=lib \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          meson compile -C "$source_dir/build"
          sudo meson install -C "$source_dir/build"
          sudo ldconfig

      - name: Install exact dependencies when cache missed
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        working-directory: hydra
        env:
          CI: "true"
        run: yarn install --frozen-lockfile --non-interactive

      - name: Capture bounded service test output
        id: tests
        working-directory: hydra
        shell: bash
        run: |
          set -uo pipefail
          mapfile -t tests < <(find src/main/services -type f -name '*.test.ts' -print | sort)

          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            node --import ./scripts/register-ts-node.mjs \
            --test --test-reporter=spec "${tests[@]}" \
            > "$RUNNER_TEMP/hydra-services-tests.log" 2>&1
          status=$?
          set -e

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          {
            echo "hydra_ref=$(git rev-parse HEAD)"
            echo "exit_status=$status"
            echo "test_count=${#tests[@]}"
            echo
            echo "=== failure markers ==="
            grep -nE 'not ok|ERR_|AssertionError|Test failure|tests? failed|timeout|cancelled|Error:' \
              "$RUNNER_TEMP/hydra-services-tests.log" | tail -n 500 || true
            echo
            echo "=== final output ==="
            tail -n 1000 "$RUNNER_TEMP/hydra-services-tests.log"
          } > "$GITHUB_WORKSPACE/diagnostics/hydra-main-services.txt"

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hydra Toolchains"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/hydra-main-services.txt
          git commit -m "diagnostics(hydra): capture services test timeout" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preserve test status
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
