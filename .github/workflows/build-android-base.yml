name: Build shared Android base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-android-base.yml
      - triggers/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-base.yml
      - triggers/android-base.txt

permissions:
  contents: read

concurrency:
  group: android-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 17 and Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Expose Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Build portable Android SDK
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          portable_sdk="$RUNNER_TEMP/android-sdk"
          bundle_root="$RUNNER_TEMP/android-base"
          archive="$RUNNER_TEMP/android-base-linux-x64.tar.zst"

          rm -rf "$portable_sdk" "$bundle_root" "$archive" "$archive.sha256"
          mkdir -p "$portable_sdk" "$bundle_root"

          yes | sdkmanager --sdk_root="$portable_sdk" --licenses >/dev/null || true
          sdkmanager --sdk_root="$portable_sdk" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-33" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "ndk;28.2.13676358" \
            "cmake;3.22.1"

          cp -aL "$JAVA_HOME" "$bundle_root/jdk"
          mv "$portable_sdk" "$bundle_root/android-sdk"

          cat > "$bundle_root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          bundle_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export JAVA_HOME="$bundle_root/jdk"
          export ANDROID_HOME="$bundle_root/android-sdk"
          export ANDROID_SDK_ROOT="$bundle_root/android-sdk"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          for proxy_var in HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; do
            if [[ -v "$proxy_var" && -z "${!proxy_var}" ]]; then
              unset "$proxy_var"
            fi
          done
          unset proxy_var
          export CI=true
          EOF
          chmod +x "$bundle_root/activate.sh"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            "$bundle_root/jdk/bin/java" -version 2>&1
            echo
            "$bundle_root/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$bundle_root/android-sdk" --list_installed
          } > "$bundle_root/MANIFEST.txt"

          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -8' -cf "$archive" android-base
          sha256sum "$archive" > "$archive.sha256"

          parts_dir="$RUNNER_TEMP/android-base-linux-x64-parts"
          rm -rf "$parts_dir"
          mkdir -p "$parts_dir"
          split -b 400M -d -a 2 "$archive" "$parts_dir/android-base-linux-x64.part-"
          (
            cd "$parts_dir"
            sha256sum android-base-linux-x64.part-* > SHA256SUMS.parts
          )

          {
            echo "archive=$(basename "$archive")"
            echo "archive_sha256=$(cut -d' ' -f1 "$archive.sha256")"
            echo "part_size=400M"
            echo "reassemble=cat android-base-linux-x64.part-* > $(basename "$archive")"
            echo
            ls -lh "$parts_dir"/android-base-linux-x64.part-*
          } > "$parts_dir/PARTS.txt"

          echo "parts_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          for index in $(seq -f '%02g' 0 5); do
            if [[ -f "$parts_dir/android-base-linux-x64.part-$index" ]]; then
              echo "part_$index=true" >> "$GITHUB_OUTPUT"
            fi
          done

          ls -lh "$archive" "$archive.sha256" "$parts_dir"/*

      - name: Validate copied base
        shell: bash
        run: |
          set -euo pipefail
          export HTTP_PROXY=
          export HTTPS_PROXY=
          export ALL_PROXY=
          source "$RUNNER_TEMP/android-base/activate.sh"
          test ! -v HTTP_PROXY
          test ! -v HTTPS_PROXY
          test ! -v ALL_PROXY
          java -version
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed >/dev/null
          test -d "$ANDROID_SDK_ROOT/platforms/android-33"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/build-tools/34.0.0"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          test -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358"

      - name: Upload Android base manifest
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-manifest
          path: |
            ${{ steps.bundle.outputs.manifest_dir }}/PARTS.txt
            ${{ steps.bundle.outputs.manifest_dir }}/SHA256SUMS.parts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 00
        if: steps.bundle.outputs.part_00 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-00
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 01
        if: steps.bundle.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-01
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 02
        if: steps.bundle.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-02
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 03
        if: steps.bundle.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-03
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 04
        if: steps.bundle.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-04
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Android base part 05
        if: steps.bundle.outputs.part_05 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64-part-05
          path: ${{ steps.bundle.outputs.parts_dir }}/android-base-linux-x64.part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
