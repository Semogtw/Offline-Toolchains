name: Build shared Android base

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-android-base.yml
      - triggers/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-android-base.yml

permissions:
  contents: read

concurrency:
  group: android-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JDK 17 and Android SDK
    runs-on: ubuntu-24.04
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v6

      - name: Install Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Expose Android command-line tools
        uses: android-actions/setup-android@v3

      - name: Build portable Android SDK
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          portable_sdk="$RUNNER_TEMP/android-sdk"
          bundle_root="$RUNNER_TEMP/android-base"
          archive="$RUNNER_TEMP/android-base-linux-x64.tar.zst"

          rm -rf "$portable_sdk" "$bundle_root" "$archive" "$archive.sha256"
          mkdir -p "$portable_sdk" "$bundle_root"

          yes | sdkmanager --sdk_root="$portable_sdk" --licenses >/dev/null || true
          sdkmanager --sdk_root="$portable_sdk" \
            "cmdline-tools;latest" \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

          cp -aL "$JAVA_HOME" "$bundle_root/jdk"
          mv "$portable_sdk" "$bundle_root/android-sdk"

          cat > "$bundle_root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          bundle_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export JAVA_HOME="$bundle_root/jdk"
          export ANDROID_HOME="$bundle_root/android-sdk"
          export ANDROID_SDK_ROOT="$bundle_root/android-sdk"
          export PATH="$JAVA_HOME/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          export CI=true
          EOF
          chmod +x "$bundle_root/activate.sh"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            "$bundle_root/jdk/bin/java" -version 2>&1
            echo
            "$bundle_root/android-sdk/cmdline-tools/latest/bin/sdkmanager" \
              --sdk_root="$bundle_root/android-sdk" --list_installed
          } > "$bundle_root/MANIFEST.txt"

          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -8' -cf "$archive" android-base
          sha256sum "$archive" > "$archive.sha256"

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=$archive.sha256" >> "$GITHUB_OUTPUT"
          ls -lh "$archive" "$archive.sha256"

      - name: Validate copied base
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/android-base/activate.sh"
          java -version
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list_installed >/dev/null
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/platforms/android-36"
          test -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973"

      - name: Upload shared base
        uses: actions/upload-artifact@v7
        with:
          name: android-base-linux-x64
          path: |
            ${{ steps.bundle.outputs.archive }}
            ${{ steps.bundle.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
