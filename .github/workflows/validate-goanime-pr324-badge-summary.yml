name: Validate GoAnime PR324 badge summary performance

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-pr324-badge-summary/*.request'

permissions:
  contents: read

jobs:
  focused:
    name: Manga compact Favorites badge gates
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            triggers/goanime-pr324-badge-summary
          sparse-checkout-cone-mode: false

      - name: Validate exact GoAnime commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          sha="$(tr -d '\r\n' < trusted/triggers/goanime-pr324-badge-summary/source.request)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout GoAnime branch commit
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 1
          lfs: false

      - name: Install Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: source
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Format changed Dart files
        working-directory: source
        run: |
          dart format \
            lib/services/manga/manga_favorites_badge_tracker.dart \
            lib/services/manga/manga_favorites_badge_summary_source.dart \
            lib/screens/main_navigation_screen.dart \
            test/services/manga/manga_favorites_badge_summary_source_test.dart \
            test/services/manga/manga_favorite_lifecycle_service_test.dart

      - name: Commit formatted Dart files to PR branch when needed
        working-directory: source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: perf/manga-favorites-badge-local-summary-20261021
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          files=(lib/services/manga/manga_favorites_badge_tracker.dart lib/services/manga/manga_favorites_badge_summary_source.dart lib/screens/main_navigation_screen.dart test/services/manga/manga_favorites_badge_summary_source_test.dart test/services/manga/manga_favorite_lifecycle_service_test.dart)
          if git diff --quiet -- "${files[@]}"; then
            echo "Already formatted."
            exit 0
          fi
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'style(manga): apply Dart formatter to PR324'
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Analyze changed Dart files
        working-directory: source
        run: |
          dart analyze \
            lib/services/manga/manga_favorites_badge_tracker.dart \
            lib/services/manga/manga_favorites_badge_summary_source.dart \
            lib/screens/main_navigation_screen.dart \
            test/services/manga/manga_favorites_badge_summary_source_test.dart \
            test/services/manga/manga_favorite_lifecycle_service_test.dart

      - name: Test memoized local browse state
        working-directory: source
        run: |
          flutter test --no-pub \
            test/services/manga/manga_favorites_badge_summary_source_test.dart \
            test/services/manga/manga_favorite_lifecycle_service_test.dart

      - name: Test presentation and favorites regressions
        working-directory: source
        run: flutter test --no-pub test/services/manga/manhastro_presentation_adapter_test.dart

      - name: Remove source checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/source"
