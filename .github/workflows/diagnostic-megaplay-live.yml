name: MegaPlay live diagnostic

on:
  push:
    branches:
      - diagnostic/megaplay-live-20260828

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Compare browser and Android WebView MegaPlay contexts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          DESKTOP_UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36'
          MOBILE_CHROME_UA = 'Mozilla/5.0 (Linux; Android 16; SM-S711B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36'
          ANDROID_WEBVIEW_UA = 'Mozilla/5.0 (Linux; Android 16; SM-S711B Build/BP2A; wv) AppleWebKit/537.36 (KHTML, like Gecko) Version/4.0 Chrome/140.0.0.0 Mobile Safari/537.36'

          def request(url, *, ua=DESKTOP_UA, referer=None, origin=None, accept='application/json,text/plain,*/*'):
              headers = {'User-Agent': ua, 'Accept': accept}
              if referer is not None:
                  headers['Referer'] = referer
              if origin:
                  headers['Origin'] = origin
              req = urllib.request.Request(url, headers=headers)
              try:
                  response = urllib.request.urlopen(req, timeout=20)
                  return response.status, response.geturl(), response.headers, response.read(2_000_000)
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.geturl(), exc.headers, exc.read(256_000)

          def signature(body):
              text = body.decode('utf-8', errors='replace')
              data_id = re.search(r'\bdata-id=[\"\'](\d+)[\"\']', text, re.I)
              error_code = re.search(r'Error Code:\s*(\d+)', text, re.I)
              return data_id.group(1) if data_id else None, error_code.group(1) if error_code else None

          status, _, _, body = request('https://anikotoapi.site/recent-anime?page=1&per_page=2')
          if status != 200:
              raise SystemExit(f'Anikoto recent failed: {status}')
          rows = json.loads(body).get('data', [])
          series_id = next((str(r.get('id') or r.get('series_id') or r.get('anime_id')).strip()
                            for r in rows if isinstance(r, dict) and (r.get('id') or r.get('series_id') or r.get('anime_id'))), None)
          if not series_id:
              raise SystemExit('No Anikoto series id')

          status, _, _, body = request(f'https://anikotoapi.site/series/{urllib.parse.quote(series_id, safe="")}')
          if status != 200:
              raise SystemExit(f'Anikoto series failed: {status}')
          payload = json.loads(body)
          data = payload.get('data') if isinstance(payload.get('data'), dict) else payload
          episodes = data.get('episodes', []) if isinstance(data, dict) else []
          embed_url = None
          for episode in episodes:
              embeds = episode.get('embed_url') if isinstance(episode, dict) else None
              if isinstance(embeds, dict):
                  candidate = embeds.get('sub') or embeds.get('dub')
                  if isinstance(candidate, str) and candidate.startswith('https://megaplay.buzz/stream/'):
                      embed_url = candidate
                      break
          if not embed_url:
              raise SystemExit('No current MegaPlay embed candidate')

          contexts = [
              ('desktop', DESKTOP_UA),
              ('mobile_chrome', MOBILE_CHROME_UA),
              ('android_webview', ANDROID_WEBVIEW_UA),
          ]
          for label, ua in contexts:
              status, final_url, headers, body = request(
                  embed_url,
                  ua=ua,
                  referer='https://goanime.local/',
                  accept='text/html,application/json,text/plain,*/*',
              )
              data_id, error_code = signature(body)
              print(f'{label}_status=', status)
              print(f'{label}_content_type=', headers.get('content-type'))
              print(f'{label}_final_host=', urllib.parse.urlparse(final_url).hostname)
              print(f'{label}_has_data_id=', bool(data_id))
              print(f'{label}_error_code=', error_code)

          print('megaplay_webview_ua_probe=complete')
          PY
