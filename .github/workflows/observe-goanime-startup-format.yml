name: Observe GoAnime startup formatter

on:
  push:
    branches: [main]
    paths:
      - 'triggers/observe-goanime-startup-format/*.request'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture sanitized workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target='format-goanime-startup-opening-private.yml'
          response="$(gh api "repos/$REPO/actions/workflows/$target/runs?per_page=5")"
          report="$(jq -c '{schemaVersion:1,runs:[.workflow_runs[] | {id,status,conclusion,event,head_sha,created_at,updated_at}]}' <<<"$response")"
          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          path="results/observe-goanime-startup-format/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(observe): record startup formatter state $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
