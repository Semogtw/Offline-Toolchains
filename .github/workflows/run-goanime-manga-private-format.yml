name: Format GoAnime manga private source

on:
  workflow_run:
    workflows:
      - Request private project CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: goanime-manga-private-format
  cancel-in-progress: false

jobs:
  format:
    name: Materialize GoAnime manga availability privately
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'build/private-ci' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted request implementation
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false
          sparse-checkout: |
            scripts/private_ci_request.py
            config/workflow-hub-projects.json
          sparse-checkout-cone-mode: false

      - name: Checkout connector request revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/private-ci.json
          sparse-checkout-cone-mode: false

      - name: Normalize trusted request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(python3 trusted-source/scripts/private_ci_request.py request-source/triggers/private-ci.json)"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          request = json.loads(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              for key in ("project", "repository", "ref"):
                  value = request[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe newline in normalized {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Checkout exact private GoAnime revision
        if: steps.request.outputs.project == 'goanime'
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.request.outputs.repository }}
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        if: steps.request.outputs.project == 'goanime'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        if: steps.request.outputs.project == 'goanime'
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Bootstrap detached checkout CAS fix
        if: steps.request.outputs.project == 'goanime'
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tools/manga/materialize_global_manga_availability_ci.sh')
          text = path.read_text(encoding='utf-8')
          old = '''git fetch origin "$TARGET_BRANCH" --quiet
          test "$(git rev-parse "origin/$TARGET_BRANCH")" = "$START_SHA"'''
          new = '''REMOTE_SHA="$(git ls-remote --exit-code origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$REMOTE_SHA" = "$START_SHA"'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'unexpected CAS gate count: {count}')
          text = text.replace(old, new)

          marker = '''git add -- \\
            assets/data/manga_availability.db \\
          '''
          replacement = '''git add -- \\
            tools/manga/materialize_global_manga_availability_ci.sh \\
            assets/data/manga_availability.db \\
          '''
          if marker not in text:
              raise SystemExit('materializer git-add marker not found')
          text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Configure sanitized materializer diagnostics
        if: steps.request.outputs.project == 'goanime'
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/manga-materializer-bash-env" <<'EOF'
          set -E
          trap 'status=$?; printf "[manga-materializer] failed status=%s line=%s\n" "$status" "$LINENO" >&2' ERR
          flutter() {
            if [[ "${1:-}" == "analyze" ]]; then
              command dart fix --apply --code=curly_braces_in_flow_control_structures tools/manga/build_global_manga_availability.dart >/dev/null
              command dart format tools/manga/build_global_manga_availability.dart >/dev/null
            fi
            command flutter "$@"
          }
          EOF

      - name: Materialize global manga availability v3
        if: steps.request.outputs.project == 'goanime'
        working-directory: private-source
        shell: bash
        env:
          BASH_ENV: ${{ runner.temp }}/manga-materializer-bash-env
        run: bash tools/manga/materialize_global_manga_availability_ci.sh

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
