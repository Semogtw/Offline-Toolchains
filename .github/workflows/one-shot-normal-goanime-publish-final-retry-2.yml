name: One-shot normal GoAnime publish final retry 2

on:
  push:
    branches:
      - main
    paths:
      - triggers/goanime-normal-publish-final-retry-2/megaplay-1.26.2.request

permissions:
  contents: read

concurrency:
  group: goanime-normal-release-1.26.2
  cancel-in-progress: false

env:
  GOANIME_REPOSITORY: Semogtw/goanime-mobile
  SOURCE_SHA: 99a823a79a83a46412181798a1326eb04f4ad581
  RELEASE_TAG: release-v1.26.2
  VERSION_NAME: 1.26.2
  BUILD_NUMBER: "33"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  WINDOWS_DSA_SIGNATURE: MD4CHQClv0/xWPCjsz5NC8jRQKKg2Ri9aSLTdOIKkd6FAh0AsxF1fzLMzDFVMbOrprJou0XsvUygBn/vW2xgww==

jobs:
  publish:
    name: Publish normal release and update channels final retry 2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 99a823a79a83a46412181798a1326eb04f4ad581
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Publish signed metadata and update channels
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          UPDATE_ASSET_URL_TEMPLATE: ${{ secrets.UPDATE_ASSET_URL_TEMPLATE }}
          UPDATE_RELEASE_PAGE_URL: ${{ secrets.UPDATE_RELEASE_PAGE_URL }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GOANIME_RELEASE_PLATFORMS: android,windows,linux
          RELEASE_NOTES: Normal full Flutter release after Shorebird Android base-release incompatibility.
        shell: bash
        run: bash scripts/goanime-release/publish.sh private-source
