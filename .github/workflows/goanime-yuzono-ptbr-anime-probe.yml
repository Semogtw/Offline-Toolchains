name: GoAnime Yuzono PT-BR Anime Probe

on:
  push:
    branches:
      - feat/yuzono-ptbr-anime-probe-20260910
    paths:
      - 'triggers/goanime-yuzono-anime-probe/**'
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable GoAnime source SHA
        required: true
      mode:
        description: Probe mode
        required: true
        default: deterministic
        type: choice
        options:
          - deterministic
          - canary
          - full
      generation_id:
        description: Stable generation identifier for resumable runs
        required: false
        default: ''
      parent_run_id:
        description: Previous run carrying consolidated sanitized state
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: goanime-yuzono-anime-probe-${{ github.event.inputs.generation_id || github.run_id }}
  cancel-in-progress: false

env:
  YUZONO_REVISION: 36eda914cb77ca8e40552eb800eb07098852fc55
  ANIKKU_REVISION: 41fefe566a00e8eb38dfa7f11802c8bfbe5c16e7

jobs:
  deterministic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout Toolchains request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve immutable GoAnime source SHA
        id: source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SHA: ${{ github.event.inputs.source_sha || '' }}
        run: |
          set -euo pipefail
          sha="$DISPATCH_SHA"
          if [[ "$EVENT_NAME" == push ]]; then
            request="$(git diff-tree --no-commit-id --name-only --diff-filter=AM -r HEAD^ HEAD -- 'triggers/goanime-yuzono-anime-probe/*.request' | sort | tail -n 1)"
            test -n "$request" || { echo '::error::No Yuzono probe request in triggering commit'; exit 1; }
            sha="$(tr -d ' \n\r' < "$request")"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::source_sha must be a 40-character lowercase git SHA'; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private source credential
        shell: bash
        env:
          TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.source.outputs.sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify requested source identity
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Run Yuzono probe deterministic tests
        working-directory: private-source
        shell: bash
        run: python -m unittest discover -s tools/yuzono_anime_probe/tests -p 'test_*.py' -v

      - name: Write summary
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          {
            echo '## GoAnime Yuzono PT-BR anime probe'
            echo
            echo "- source SHA: \`${SOURCE_SHA:-unknown}\`"
            echo "- Yuzono revision: \`$YUZONO_REVISION\`"
            echo "- Anikku revision: \`$ANIKKU_REVISION\`"
            echo '- private source is not uploaded'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"

  compile-harness:
    name: Compile pinned Anikku harness and AnimeFire extension
    needs: deterministic
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'compile')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Checkout pinned Anikku runtime
        uses: actions/checkout@v6
        with:
          repository: komikku-app/anikku
          ref: ${{ env.ANIKKU_REVISION }}
          path: anikku
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Checkout pinned Yuzono extensions
        uses: actions/checkout@v6
        with:
          repository: yuzono/anime-extensions
          ref: ${{ env.YUZONO_REVISION }}
          path: yuzono
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Inject debug-only GoAnime probe harness
        shell: bash
        run: |
          set -euo pipefail
          python private-source/tools/yuzono_anime_probe/android_harness/inject_harness.py --anikku-root anikku
          grep -q 'android:name=".GoAnimeYuzonoProbeActivity"' anikku/app/src/debug/AndroidManifest.xml
          grep -q 'android:exported="false"' anikku/app/src/debug/AndroidManifest.xml

      - name: Compile pinned Anikku debug Kotlin
        working-directory: anikku
        shell: bash
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Build pinned AnimeFire PT extension
        working-directory: yuzono
        shell: bash
        run: ./gradlew src:pt:animefire:assembleDebug --no-daemon --stacktrace

      - name: Verify extension APK was produced
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find yuzono/src/pt/animefire/build -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          echo "Built AnimeFire extension APK: $(basename "$apk")"

      - name: Write compile receipt
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
        run: |
          {
            echo '## Yuzono Android compile gate'
            echo
            echo "- GoAnime source: \`$SOURCE_SHA\`"
            echo "- Yuzono: \`$YUZONO_REVISION\`"
            echo "- Anikku: \`$ANIKKU_REVISION\`"
            echo '- no APK or private checkout is uploaded'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove transient checkouts
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/anikku" "$GITHUB_WORKSPACE/yuzono"

  canary:
    name: Live PT-BR canary
    needs: deterministic
    if: >-
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'canary')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'canary')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      GOANIME_SOURCE_SHA: ${{ needs.deterministic.outputs.source_sha }}
      GENERATION_ID: ${{ github.event.inputs.generation_id || format('canary-{0}', github.run_id) }}
      MODULES: animefire,dattebayobr,animeito
      MAX_RETRIES: '1'
      MAX_PAGES: '3'
      STAGE_TIMEOUT_SECONDS: '45'
    steps:
      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.deterministic.outputs.source_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Checkout pinned Anikku runtime
        uses: actions/checkout@v6
        with:
          repository: komikku-app/anikku
          ref: ${{ env.ANIKKU_REVISION }}
          path: anikku
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Checkout pinned Yuzono extensions
        uses: actions/checkout@v6
        with:
          repository: yuzono/anime-extensions
          ref: ${{ env.YUZONO_REVISION }}
          path: yuzono
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          show-progress: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v5

      - name: Inject debug-only probe harness
        shell: bash
        run: python private-source/tools/yuzono_anime_probe/android_harness/inject_harness.py --anikku-root anikku

      - name: Assemble pinned Anikku debug APK
        working-directory: anikku
        shell: bash
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build canary PT extensions independently
        working-directory: yuzono
        shell: bash
        run: |
          set +e
          ./gradlew \
            src:pt:animefire:assembleDebug \
            src:pt:dattebayobr:assembleDebug \
            src:pt:animeito:assembleDebug \
            --continue --no-daemon --stacktrace
          echo "Extension build exit code: $? (individual missing APKs are recorded by the harness runner)"
          exit 0

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Execute canary providers in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash private-source/tools/yuzono_anime_probe/android_harness/run_emulator_probes.sh

      - name: Write sanitized canary summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          lines = ["", "## Live PT-BR canary", "", "| Provider | Status | Stage | Mode | Titles | Playback | Failure |", "|---|---|---|---|---:|---:|---|"]
          for path in sorted(Path("probe-state/providers").glob("*.json")):
              raw = json.loads(path.read_text(encoding="utf-8"))
              lines.append(
                  f"| {raw.get('displayName', path.stem)} | {raw.get('status', 'unknown')} | "
                  f"{raw.get('stage', 'discovered')} | {raw.get('languageMode', 'unknown')} | "
                  f"{len(raw.get('titles', []))} | {raw.get('playbackSampleCount', 0)} | "
                  f"{raw.get('failureKind') or ''} |"
              )
          if not list(Path("probe-state/providers").glob("*.json")):
              lines.append("| no result | broken | discovered | unknown | 0 | 0 | structural-canary-failure |")
          summary.write_text(summary.read_text(encoding="utf-8") + "\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Upload sanitized canary state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yuzono-canary-state-${{ github.run_id }}
          path: probe-state
          if-no-files-found: warn
          retention-days: 7

      - name: Remove transient source and APK trees
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/anikku" "$GITHUB_WORKSPACE/yuzono"
