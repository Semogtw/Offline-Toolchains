name: Promote GoAnime manga source candidates

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-source-promotion/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-source-promotion
  cancel-in-progress: false

jobs:
  promote:
    name: Promote validated manga sources
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-source-promotion/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify branch still points to reviewed SHA
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Apply reviewed rollout state
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          reviewed_sha = os.environ['REVIEWED_SHA']
          upstream_sha = '16df97717c304c3f1e309c81acdceaeab5b51314'

          # 1) Keep the Keiyoushi PT-BR inventory accounting stable while allowing
          # explicitly audited providers that live outside that inventory.
          validator = Path('tools/manga/validate_manga_provider_manifest.dart')
          text = validator.read_text()
          old = """  final excludedEntries = _objectList(\n    decoded['excludedSources'],\n    'excludedSources',\n    errors,\n  );\n  final excludedNames = <String>[];\n"""
          new = """  final excludedEntries = _objectList(\n    decoded['excludedSources'],\n    'excludedSources',\n    errors,\n  );\n  final externalProviderNames = _stringList(\n    decoded['externalProviderSourceNames'] ?? const <Object?>[],\n    'externalProviderSourceNames',\n    errors,\n  );\n  final excludedNames = <String>[];\n"""
          if old not in text:
              raise SystemExit('validator insertion point changed')
          text = text.replace(old, new, 1)

          old = """  _rejectDuplicates(allowedNames, 'allowedSourceNames', errors);\n  _rejectDuplicates(excludedNames, 'excludedSources names', errors);\n\n  final overlap = allowedNames.toSet().intersection(excludedNames.toSet());\n  if (overlap.isNotEmpty) {\n    errors.add('allowed/excluded overlap: ${overlap.toList()..sort()}');\n  }\n"""
          new = """  _rejectDuplicates(allowedNames, 'allowedSourceNames', errors);\n  _rejectDuplicates(excludedNames, 'excludedSources names', errors);\n  _rejectDuplicates(\n    externalProviderNames,\n    'externalProviderSourceNames',\n    errors,\n  );\n\n  final overlap = allowedNames.toSet().intersection(excludedNames.toSet());\n  if (overlap.isNotEmpty) {\n    errors.add('allowed/excluded overlap: ${overlap.toList()..sort()}');\n  }\n  final externalOverlap = externalProviderNames.toSet().intersection(\n    <String>{...allowedNames, ...excludedNames},\n  );\n  if (externalOverlap.isNotEmpty) {\n    errors.add(\n      'external provider names must stay outside the PT-BR inventory baseline: '\n      '${externalOverlap.toList()..sort()}',\n    );\n  }\n"""
          if old not in text:
              raise SystemExit('validator overlap block changed')
          text = text.replace(old, new, 1)

          old = """        if (!allowedNames.contains(sourceName)) {\n          errors.add(\n            'provider sourceName is not in allowed baseline: $sourceName',\n          );\n        }\n"""
          new = """        if (!allowedNames.contains(sourceName) &&\n            !externalProviderNames.contains(sourceName)) {\n          errors.add(\n            'provider sourceName is not in allowed baseline or external provider allowlist: '\n            '$sourceName',\n          );\n        }\n"""
          if old not in text:
              raise SystemExit('validator provider baseline block changed')
          validator.write_text(text)

          # 2) Runtime authorization: only candidates with successful live byte proof.
          defaults = Path('lib/services/manga/default_manga_source_providers.dart')
          text = defaults.read_text()
          needle = "  'ptbr.mangalivreorg',\n  'ptbr.ninjascan',\n"
          replacement = "  'ptbr.mangalivreorg',\n  'ptbr.mangadex',\n  'ptbr.manhastro',\n  'ptbr.ninjascan',\n"
          if needle not in text:
              raise SystemExit('default provider insertion point changed')
          defaults.write_text(text.replace(needle, replacement, 1))

          # 3) Manifest records. MangaDex is intentionally outside the PT-BR
          # Keiyoushi snapshot, so it is separately allowlisted and does not alter
          # counts.inventoried/allowed/excluded.
          manifest_path = Path('docs/manga_sources_ptbr.json')
          manifest = json.loads(manifest_path.read_text())
          external = list(manifest.get('externalProviderSourceNames', []))
          if 'MangaDex' not in external:
              external.append('MangaDex')
          rebuilt = {}
          inserted_external = False
          for key, value in manifest.items():
              rebuilt[key] = value
              if key == 'allowedSourceNames':
                  rebuilt['externalProviderSourceNames'] = external
                  inserted_external = True
          if not inserted_external:
              rebuilt['externalProviderSourceNames'] = external
          manifest = rebuilt

          records = manifest.setdefault('providerRecords', [])
          ids = {row.get('goanimeSourceId') for row in records if isinstance(row, dict)}
          if {'ptbr.mangadex', 'ptbr.taimumangas', 'ptbr.manhastro'} & ids:
              raise SystemExit('candidate provider record already exists; refusing duplicate mutation')

          records.extend([
            {
              'sourceName': 'MangaDex',
              'goanimeSourceId': 'ptbr.mangadex',
              'policyState': 'allowed',
              'implementationState': 'enabled',
              'rolloutGates': {
                'fixtureContractPassed': True,
                'liveReadabilityPassed': True,
                'byteProbePassed': True,
                'verifiedAt': '2026-08-28T22:32:08.286832Z',
                'providerSetVersion': reviewed_sha,
              },
              'requiresAuth': False,
              'requiresBrowser': False,
              'supportedContentKinds': ['imageSequence'],
              'engine': 'mangadex_v5_json_api_at_home',
              'referenceImplementation': {
                'repository': 'keiyoushi/extensions-source',
                'revision': upstream_sha,
                'path': 'src/all/mangadex',
                'versionName': '1.4',
              },
              'sourceSafetyAudit': {
                'state': 'reviewed',
                'reviewedAt': '2026-08-28',
                'primaryPurposeExplicitAdult': False,
                'upstreamContentWarning': 'MIXED',
                'evidence': [
                  'Current Keiyoushi metadata declares ContentWarning.MIXED because MangaDex is a global multi-rating platform rather than an adult-primary source.',
                  'The GoAnime provider requests only availableTranslatedLanguage=pt-br and contentRating safe/suggestive for catalog and chapter discovery.',
                  'The exact-SHA live gate completed search, details, PT-BR chapters, AtHome imageSequence resolution and a real remote byte probe without authentication or browser flow.',
                ],
              },
              'rolloutNotes': [
                'Promoted only after 12/12 candidate fixture tests were green and the exact-SHA live gate reached real chapter bytes.',
                'Dynamic MangaDex@Home hosts are authorized only under the mangadex.network DNS suffix with label-boundary matching; lookalike suffixes remain rejected.',
                'MangaDex is external to the frozen Keiyoushi PT-BR inventory baseline, so it is tracked by externalProviderSourceNames and does not change the 114/98/16 inventory accounting.',
              ],
            },
            {
              'sourceName': 'Manhastro',
              'goanimeSourceId': 'ptbr.manhastro',
              'policyState': 'allowed',
              'implementationState': 'enabled',
              'rolloutGates': {
                'fixtureContractPassed': True,
                'liveReadabilityPassed': True,
                'byteProbePassed': True,
                'verifiedAt': '2026-08-28T22:32:29.143389Z',
                'providerSetVersion': reviewed_sha,
              },
              'requiresAuth': False,
              'requiresBrowser': False,
              'supportedContentKinds': ['imageSequence'],
              'engine': 'custom_json_api',
              'referenceImplementation': {
                'repository': 'keiyoushi/extensions-source',
                'revision': upstream_sha,
                'path': 'src/pt/manhastro',
                'versionName': '1.4',
              },
              'sourceSafetyAudit': {
                'state': 'reviewed',
                'reviewedAt': '2026-08-28',
                'primaryPurposeExplicitAdult': False,
                'upstreamContentWarning': 'NSFW',
                'evidence': [
                  'Current Keiyoushi metadata declares ContentWarning.NSFW with an inline note that MIXED may be the more accurate classification.',
                  'The full current /dados catalog audit contained 100 works and only 2 occurrences matched explicit-adult title/genre markers (2.0%); dominant genres were Manga, Romance, Fantasia and Drama.',
                  'The repository safety sampler completed four successful queries and 12 detail checks with zero explicit title or genre marker matches.',
                  'The exact-SHA live gate completed search, details, 136 chapters, imageSequence resolution and a real remote byte probe.',
                ],
              },
              'rolloutNotes': [
                'Promoted because the project policy excludes adult-primary sources, not every source carrying an upstream NSFW/MIXED warning, and current catalog evidence is not adult-primary.',
                'Chapter content currently resolves through albums.manhastro.net, which is explicitly allowlisted rather than permitting arbitrary subdomains.',
              ],
            },
            {
              'sourceName': 'Taimu Mangas',
              'goanimeSourceId': 'ptbr.taimumangas',
              'policyState': 'allowed',
              'implementationState': 'planned',
              'rolloutGates': {
                'fixtureContractPassed': True,
                'liveReadabilityPassed': False,
                'byteProbePassed': False,
                'verifiedAt': '2026-08-28T22:32:25.310981Z',
                'providerSetVersion': reviewed_sha,
              },
              'requiresAuth': False,
              'requiresBrowser': False,
              'supportedContentKinds': ['imageSequence'],
              'engine': 'taimu_reader_json_api',
              'referenceImplementation': {
                'repository': 'keiyoushi/extensions-source',
                'revision': upstream_sha,
                'path': 'src/pt/taimumangas',
                'versionName': '1.4',
              },
              'sourceSafetyAudit': {
                'state': 'reviewed',
                'reviewedAt': '2026-08-28',
                'primaryPurposeExplicitAdult': False,
                'upstreamContentWarning': 'MIXED',
                'evidence': [
                  'Current Keiyoushi metadata declares ContentWarning.MIXED.',
                  'The GoAnime provider hard-disables adult catalog mode with adult=false and implements no authenticated adult preference.',
                  'Fixture coverage proves anonymous search/details/chapters/pages behavior without browser or authentication requirements.',
                ],
              },
              'rolloutNotes': [
                'Implementation and all four source-specific fixture tests are green, but the source remains outside defaultEnabledMangaSourceIds.',
                'Exact-SHA live attempts on 2026-08-28 repeatedly received HTTP 523 from apiv2.taimumangas.com before search results, so live readability and byte gates remain false.',
              ],
            },
          ])
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          # 4) Pin reviewed upstream behavior. Planned Taimu is pinned too so the
          # next availability retry can detect upstream changes before promotion.
          pins_path = Path('docs/manga_provider_behavior_pins.json')
          pins = json.loads(pins_path.read_text())
          pins['auditedHead'] = upstream_sha
          pins['reviewedAt'] = '2026-08-28'
          providers = pins.setdefault('providers', {})
          providers['ptbr.mangadex'] = {
            'path': 'src/all/mangadex',
            'behaviorRevision': upstream_sha,
          }
          providers['ptbr.manhastro'] = {
            'path': 'src/pt/manhastro',
            'behaviorRevision': upstream_sha,
          }
          providers['ptbr.taimumangas'] = {
            'path': 'src/pt/taimumangas',
            'behaviorRevision': upstream_sha,
          }
          pins['providers'] = dict(sorted(providers.items()))
          pins_path.write_text(json.dumps(pins, ensure_ascii=False, indent=2) + '\n')

          # 5) The accounting test must prove the external provider does not mutate
          # the frozen 114/98/16 PT-BR source inventory.
          test_path = Path('test/architecture/manga_provider_manifest_validator_test.dart')
          text = test_path.read_text()
          needle = "        'ptbr.mangalivreorg',\n        'ptbr.ninjascan',\n"
          replacement = "        'ptbr.mangalivreorg',\n        'ptbr.mangadex',\n        'ptbr.manhastro',\n        'ptbr.ninjascan',\n"
          if needle not in text:
              raise SystemExit('manifest validator expected-enabled insertion point changed')
          text = text.replace(needle, replacement, 1)
          marker = "      expect(validation.excluded, 16);\n"
          addition = """      expect(validation.excluded, 16);\n      final manifest = decoded as Map<String, dynamic>;\n      expect(\n        (manifest['externalProviderSourceNames'] as List<dynamic>).cast<String>(),\n        <String>['MangaDex'],\n      );\n"""
          if marker not in text:
              raise SystemExit('manifest accounting assertion point changed')
          test_path.write_text(text.replace(marker, addition, 1))
          PY

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Format changed Dart
        working-directory: private-source
        run: |
          dart format \
            tools/manga/validate_manga_provider_manifest.dart \
            lib/services/manga/default_manga_source_providers.dart \
            test/architecture/manga_provider_manifest_validator_test.dart

      - name: Verify manifest accounting and registry authorization
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart

      - name: Verify provider adapters
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/services/manga/providers/mangadex_manga_provider_test.dart \
            test/services/manga/providers/taimu_manga_provider_test.dart \
            test/services/manga/providers/manhastro_manga_provider_test.dart

      - name: Analyze rollout scope
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            tools/manga/validate_manga_provider_manifest.dart \
            lib/services/manga/default_manga_source_providers.dart \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_http_client.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_provider_definitions.dart \
            lib/services/manga/manga_provider_definitions_wave5.dart \
            lib/services/manga/providers/mangadex_manga_provider.dart \
            lib/services/manga/providers/taimu_manga_provider.dart \
            lib/services/manga/providers/manhastro_manga_provider.dart \
            test/architecture/manga_provider_manifest_validator_test.dart

      - name: Checkout current Keiyoushi source history
        uses: actions/checkout@v6
        with:
          repository: keiyoushi/extensions-source
          ref: 16df97717c304c3f1e309c81acdceaeab5b51314
          path: extensions-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Audit enabled provider behavior drift
        working-directory: private-source
        run: |
          python3 tools/manga/audit_keiyoushi_provider_drift.py \
            --manifest docs/manga_sources_ptbr.json \
            --source-repo ../extensions-source \
            --head 16df97717c304c3f1e309c81acdceaeab5b51314 \
            --json-output /tmp/manga-provider-drift.json
          cat /tmp/manga-provider-drift.json

      - name: Re-probe newly enabled sources through real bytes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          for source in ptbr.mangadex ptbr.manhastro; do
            log="/tmp/${source//./_}.promotion.log"
            timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$source" >"$log" 2>&1
            grep -E '^(search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|transport_[0-9]+|verifier|terminal)=' "$log" || true
            grep -q '^terminal=readable$' "$log"
          done

      - name: Commit validated promotion
        id: commit
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/manga/validate_manga_provider_manifest.dart \
            lib/services/manga/default_manga_source_providers.dart \
            docs/manga_sources_ptbr.json \
            docs/manga_provider_behavior_pins.json \
            test/architecture/manga_provider_manifest_validator_test.dart
          git diff --cached --check
          git diff --cached --quiet && { echo 'no promotion diff'; exit 1; }
          git commit -m 'feat(manga): promote MangaDex and Manhastro providers'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reverify branch and push fast-forward
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          unset auth PRIVATE_REPOSITORIES_TOKEN
          echo "promoted_sha=${{ steps.commit.outputs.sha }}"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/extensions-source" "$GITHUB_WORKSPACE/control" /tmp/*promotion.log /tmp/manga-provider-drift.json
