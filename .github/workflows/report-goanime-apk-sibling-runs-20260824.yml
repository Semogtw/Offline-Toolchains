name: Report GoAnime APK sibling runs

on:
  workflow_run:
    workflows: ['Probe private GoAnime APK trigger']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Record runs for triggering commit
        uses: actions/github-script@v8
        with:
          script: |
            const trigger = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner, repo, head_sha: trigger.head_sha, per_page: 100
            });
            const runs = response.data.workflow_runs.map(r => ({
              id: r.id,
              name: r.name,
              status: r.status,
              conclusion: r.conclusion,
              event: r.event,
              head_sha: r.head_sha,
              created_at: r.created_at,
              updated_at: r.updated_at,
              html_url: r.html_url
            }));
            const report = {
              schema_version: 1,
              trigger_run_id: trigger.id,
              head_sha: trigger.head_sha,
              runs
            };
            const path='reports/goanime-private-release-apk/sibling-runs.json';
            let sha;
            try {
              const old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              if(!Array.isArray(old.data)) sha=old.data.sha;
            } catch(e){ if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,
              message:`ci(goanime): record APK sibling runs ${trigger.id} [skip ci]`,
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),
              branch:'main',sha
            });
