name: Build Fichário offline workspace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-fichario.yml
      - scripts/build-fichario-offline.sh
      - triggers/fichario-toolchain.json

permissions:
  contents: read

concurrency:
  group: fichario-offline-workspace
  cancel-in-progress: true

env:
  NODE_VERSION: "22.16.0"
  PNPM_VERSION: "10.34.5"
  DENO_VERSION: "2.8.1"
  SUPABASE_VERSION: "2.111.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout toolchain definitions
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Read requested Fichário ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          ref="$(jq -r '.ref // "main"' triggers/fichario-toolchain.json)"
          test -n "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout Fichário source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: ${{ steps.request.outputs.ref }}
          path: fichario-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Resolve source commit
        id: source
        shell: bash
        run: echo "sha=$(git -C fichario-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}
          cache: false

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_VERSION }}

      - name: Install archive tooling
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends zstd

      - name: Validate bundle builder syntax
        run: bash -n scripts/build-fichario-offline.sh

      - name: Build and verify portable workspace
        id: bundle
        env:
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          TOOLCHAIN_SHA: ${{ github.sha }}
          SOURCE_DIR: fichario-source
        shell: bash
        run: |
          set -o pipefail
          bash -x scripts/build-fichario-offline.sh 2>&1 \
            | tee "$RUNNER_TEMP/fichario-offline-build.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-build-diagnostics
          path: ${{ runner.temp }}/fichario-offline-build.log
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Prepare Prettier repair snapshot
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate
          cd fichario-source
          pnpm install --frozen-lockfile
          git restore --source=HEAD -- package.json pnpm-lock.yaml
          pnpm exec prettier --write .
          git restore --source=HEAD -- package.json pnpm-lock.yaml
          repair="$RUNNER_TEMP/fichario-prettier-repair"
          rm -rf "$repair"
          mkdir -p "$repair"
          while IFS= read -r -d '' path; do
            mkdir -p "$repair/$(dirname "$path")"
            cp "$path" "$repair/$path"
          done < <(git diff --name-only --diff-filter=ACMRT -z)
          git diff --name-only > "$repair/FILES.txt"
          test -s "$repair/FILES.txt"

      - name: Upload Prettier repair snapshot
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fichario-prettier-repair
          path: ${{ runner.temp }}/fichario-prettier-repair
          if-no-files-found: warn
          compression-level: 6
          retention-days: 1

      - name: Upload manifest
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-manifest
          path: |
            ${{ steps.bundle.outputs.parts }}/PARTS.txt
            ${{ steps.bundle.outputs.parts }}/SHA256SUMS.parts
            ${{ steps.bundle.outputs.archive_sha }}
            ${{ steps.bundle.outputs.root }}/MANIFEST.txt
            ${{ steps.bundle.outputs.root }}/workspace/package.json
            ${{ steps.bundle.outputs.root }}/workspace/pnpm-lock.yaml
          compression-level: 0
          retention-days: 1

      - name: Upload part 00
        if: steps.bundle.outputs.part_00 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-00
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-00
          compression-level: 0
          retention-days: 1

      - name: Upload part 01
        if: steps.bundle.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-01
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-01
          compression-level: 0
          retention-days: 1

      - name: Upload part 02
        if: steps.bundle.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-02
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-02
          compression-level: 0
          retention-days: 1

      - name: Upload part 03
        if: steps.bundle.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-03
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-03
          compression-level: 0
          retention-days: 1

      - name: Upload part 04
        if: steps.bundle.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-04
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-04
          compression-level: 0
          retention-days: 1

      - name: Upload part 05
        if: steps.bundle.outputs.part_05 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fichario-offline-linux-x64-part-05
          path: ${{ steps.bundle.outputs.parts }}/fichario-offline-linux-x64.part-05
          compression-level: 0
          retention-days: 1
