name: Hydra source discovery live smoke

on:
  push:
    branches:
      - build/hydra-source-smoke
    paths:
      - .github/workflows/hydra-source-discovery-live-smoke.yml

permissions:
  contents: read

concurrency:
  group: hydra-source-discovery-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: feat/universal-source-discovery
    steps:
      - name: Require private repository token
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout private Hydra source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Record immutable source revision
        id: source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -f python_rpc/requirements-scrapling.txt
          test -f python_rpc/source_discovery.py
          test -f python_rpc/source_discovery_batch.py

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-source/python_rpc/requirements-scrapling.txt

      - name: Configure isolated browser path
        shell: bash
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/hydra-scrapling-browser" >> "$GITHUB_ENV"

      - name: Install pinned discovery runtime
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement python_rpc/requirements-scrapling.txt
          python -m playwright install --with-deps chromium
          python -m patchright install chromium
          python - <<'PY'
          import importlib.metadata
          expected = {
              'scrapling': '0.4.14',
              'playwright': '1.61.0',
              'patchright': '1.61.2',
          }
          for package, wanted in expected.items():
              actual = importlib.metadata.version(package)
              if actual != wanted:
                  raise SystemExit(f'expected {package} {wanted}, got {actual}')
              print(f'{package} {actual} ready')
          PY

      - name: Run discovery unit tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_rpc python -m unittest \
            python_rpc/test_source_discovery.py \
            python_rpc/test_source_discovery_batch.py

      - name: Probe public reference sites without downloads
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_rpc python - <<'PY'
          import contextlib
          import io
          import json
          import urllib.parse
          from source_discovery import SourceDiscoveryError, discover_source

          targets = [
              'https://ecologica2verde.online/',
              'https://ankergames.net/',
              'https://gamebounty.world/pt',
          ]
          blocked = [
              'doubleclick.net',
              'googlesyndication.com',
              'googleadservices.com',
              'adservice.google.com',
              'popads.net',
              'popcash.net',
              'propellerads.com',
              'adsterra.com',
              'monetag.com',
              'onclicka.com',
              'exoclick.com',
              'trafficstars.com',
          ]

          failures = 0
          for target in targets:
              site = urllib.parse.urlsplit(target).hostname or 'unknown'
              sink = io.StringIO()
              try:
                  with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                      result = discover_source({
                          'url': target,
                          'timeout_ms': 60_000,
                          'max_html_bytes': 1024 * 1024,
                          'max_xhr_bytes': 128 * 1024,
                          'max_xhr_responses': 12,
                          'allow_stealth': True,
                          'blocked_domains': blocked,
                      })
                  final_host = urllib.parse.urlsplit(result['finalUrl']).hostname or 'unknown'
                  print(json.dumps({
                      'site': site,
                      'ok': True,
                      'mode': result['mode'],
                      'status': result['status'],
                      'htmlBytes': len(result['html'].encode('utf-8')),
                      'xhrResponses': len(result['capturedResponses']),
                      'truncated': bool(result['truncated']),
                      'finalHost': final_host,
                  }, sort_keys=True))
              except SourceDiscoveryError as error:
                  failures += 1
                  print(json.dumps({
                      'site': site,
                      'ok': False,
                      'errorCode': error.code,
                  }, sort_keys=True))
              except Exception as error:
                  failures += 1
                  print(json.dumps({
                      'site': site,
                      'ok': False,
                      'errorType': type(error).__name__,
                  }, sort_keys=True))

          if failures:
              raise SystemExit(f'{failures} reference-site probes failed')
          PY

      - name: Summarize sanitized result
        if: always()
        shell: bash
        run: |
          {
            echo '### Hydra universal source discovery smoke'
            echo '- Source revision: `${{ steps.source.outputs.sha }}`'
            echo '- Unit tests exercise no external downloads.'
            echo '- Live probes print only host/status/mode/byte-count/XHR-count metadata.'
            echo '- HTML, captured response bodies, cookies, tokens and discovered download URLs are never printed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source
