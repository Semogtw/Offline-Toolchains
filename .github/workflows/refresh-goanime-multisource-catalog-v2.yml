name: Refresh GoAnime multi-provider catalog v2

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-multisource-catalog-v2/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-multisource-catalog-refresh-v2
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      CACHE_BUILDER_MAX_RUNTIME_MINUTES: '120'

    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-multisource-catalog-v2/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = main
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Require read-only private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source and capture baseline
        id: baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.request.outputs.sha }}'
          work="$RUNNER_TEMP/goanime-multisource-v2"
          rm -rf "$work"
          mkdir -p "$work/baseline"
          cp assets/data/available_animes.json "$work/baseline/available_animes.json"
          cp assets/data/available_anime_modes.json "$work/baseline/available_anime_modes.json"
          cp assets/data/mal_availability_map.json "$work/baseline/mal_availability_map.json"
          cp assets/data/mal_availability_unmatched.json "$work/baseline/mal_availability_unmatched.json"
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Crawl production providers independently
        id: provider
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/provider_catalog_cache.dart
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p=json.loads(Path('assets/data/anime_provider_catalog_manifest.json').read_text(encoding='utf-8'))
          providers=p.get('providers') or {}
          required=('animefire','animesonline','goyabu','anitube')
          missing=[x for x in required if x not in providers]
          if missing:
              raise SystemExit(f'missing provider manifest entries: {missing}')
          for provider in required:
              info=providers[provider]
              print(f'{provider}_status={info.get("status","missing")}')
              print(f'{provider}_count={int(info.get("count") or 0)}')
          print('status=' + ('full-multi-provider-audit' if p.get('allProvidersComplete') else 'partial-multi-provider-audit-with-preserved-baseline'))
          print(f'available_count={int(p.get("availableTitleCount") or 0)}')
          PY

      - name: Isolate newly discovered titles
        id: newtitles
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          before=set(json.loads((work/'baseline/available_animes.json').read_text(encoding='utf-8')))
          after=set(json.loads(Path('assets/data/available_animes.json').read_text(encoding='utf-8')))
          new=sorted(after-before)
          modes=json.loads(Path('assets/data/available_anime_modes.json').read_text(encoding='utf-8'))
          (work/'new_titles.json').write_text(json.dumps(new,ensure_ascii=False),encoding='utf-8')
          (work/'new_modes.json').write_text(json.dumps({k:modes[k] for k in new if k in modes},ensure_ascii=False),encoding='utf-8')
          print(f'new provider-confirmed titles: {len(new)}')
          PY
          count="$(python3 -c 'import json,os; print(len(json.load(open(os.environ["WORK"]+"/new_titles.json"))))')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Map provider delta to Jikan and MAL with checkpoints
        id: malmap
        if: steps.newtitles.outputs.count != '0'
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          dart run tools/build_mal_availability_cache_checkpointed.dart \
            --available-animes="$WORK/new_titles.json" \
            --available-modes="$WORK/new_modes.json" \
            --map="$WORK/new_mal_map.json" \
            --unmatched="$WORK/new_mal_unmatched.json" \
            --checkpoint="$WORK/mal_mapping_checkpoint.json" \
            --batch-size=40
          test -s "$WORK/new_mal_map.json"
          test -s "$WORK/new_mal_unmatched.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import collections,json,os
          from pathlib import Path
          work=Path(os.environ['WORK'])
          matched=json.loads((work/'new_mal_map.json').read_text(encoding='utf-8')).get('entries') or []
          unmatched=json.loads((work/'new_mal_unmatched.json').read_text(encoding='utf-8')).get('entries') or []
          reasons=collections.Counter(str(e.get('reason') or 'unknown') for e in unmatched if isinstance(e,dict))
          print(f'matched={len(matched)}')
          print(f'unmatched={len(unmatched)}')
          print('reasons=' + (','.join(f'{k}:{reasons[k]}' for k in sorted(reasons)) if reasons else 'none'))
          PY

      - name: Prepare empty MAL delta
        if: steps.newtitles.outputs.count == '0'
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          printf '{"schemaVersion":1,"generatedAt":"","entries":[]}' > "$WORK/new_mal_map.json"
          printf '{"schemaVersion":1,"generatedAt":"","entries":[]}' > "$WORK/new_mal_unmatched.json"

      - name: Merge MAL delta into validated baseline
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          cp "$WORK/baseline/mal_availability_map.json" assets/data/mal_availability_map.json
          cp "$WORK/baseline/mal_availability_unmatched.json" assets/data/mal_availability_unmatched.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          work=Path(os.environ['WORK'])
          old=json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          fresh=json.loads((work/'new_mal_map.json').read_text(encoding='utf-8'))
          modes=json.loads(Path('assets/data/available_anime_modes.json').read_text(encoding='utf-8'))
          by_id={int(e['malId']):e for e in old.get('entries',[]) if isinstance(e,dict) and isinstance(e.get('malId'),int)}
          old_ids=set(by_id)
          for entry in fresh.get('entries',[]):
              if not isinstance(entry,dict) or not isinstance(entry.get('malId'),int):
                  continue
              mid=int(entry['malId'])
              if mid not in by_id:
                  by_id[mid]=entry
                  continue
              cur=by_id[mid]
              cur['matchedAvailableTitles']=sorted(set(cur.get('matchedAvailableTitles') or []) | set(entry.get('matchedAvailableTitles') or []))
              if float(entry.get('matchConfidence') or 0) > float(cur.get('matchConfidence') or 0):
                  for key in ('canonicalTitle','titleEnglish','titleJapanese','year','season','type','episodes','matchConfidence','matchType'):
                      if key in entry:
                          cur[key]=entry[key]
          for entry in by_id.values():
              matched=[t for t in entry.get('matchedAvailableTitles') or [] if t in modes]
              if matched:
                  entry['modes']={
                      'sub': any(bool(modes[t].get('sub')) for t in matched),
                      'dub': any(bool(modes[t].get('dub')) for t in matched),
                  }
          old['generatedAt']=datetime.now(timezone.utc).isoformat()
          old['entries']=sorted(by_id.values(),key=lambda e:int(e.get('malId') or 0))
          Path('assets/data/mal_availability_map.json').write_text(json.dumps(old,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          old_u=json.loads(Path('assets/data/mal_availability_unmatched.json').read_text(encoding='utf-8'))
          fresh_u=json.loads((work/'new_mal_unmatched.json').read_text(encoding='utf-8'))
          merged={}
          for e in list(old_u.get('entries') or []) + list(fresh_u.get('entries') or []):
              if isinstance(e,dict):
                  merged[(str(e.get('normalizedTitle') or ''),str(e.get('availableTitle') or ''))]=e
          old_u['generatedAt']=datetime.now(timezone.utc).isoformat()
          old_u['entries']=sorted(merged.values(),key=lambda e:(str(e.get('normalizedTitle') or ''),str(e.get('availableTitle') or '')))
          Path('assets/data/mal_availability_unmatched.json').write_text(json.dumps(old_u,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          new_ids=sorted(set(by_id)-old_ids)
          (work/'new_mal_ids.txt').write_text('\n'.join(map(str,new_ids)),encoding='utf-8')
          print(f'MAL entries={len(by_id)} new MAL IDs={len(new_ids)}')
          PY

      - name: Build provider-aware MAL provenance
        working-directory: private-source
        shell: bash
        run: dart run tools/build_mal_provider_availability_cache.dart

      - name: Rebuild derived availability databases
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          dart run tools/build_title_availability_database.dart
          if [ -s "$WORK/new_mal_ids.txt" ]; then
            args=()
            while IFS= read -r id; do [ -n "$id" ] && args+=("--mal-id=$id"); done < "$WORK/new_mal_ids.txt"
            dart run tools/build_franchise_availability_cache.dart "${args[@]}"
          else
            echo 'No new MAL IDs; preserving franchise graph cache.'
          fi
          dart run tools/build_franchise_runtime_artifacts.dart

      - name: Validate provider cache composition
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sqlite3
          from pathlib import Path
          work=Path(os.environ['WORK'])
          before=set(json.loads((work/'baseline/available_animes.json').read_text(encoding='utf-8')))
          after=set(json.loads(Path('assets/data/available_animes.json').read_text(encoding='utf-8')))
          if not before <= after:
              raise SystemExit(f'provider union lost {len(before-after)} baseline titles')
          manifest=json.loads(Path('assets/data/anime_provider_catalog_manifest.json').read_text(encoding='utf-8'))
          required={'animefire','animesonline','goyabu','anitube'}
          if set((manifest.get('providers') or {}).keys()) != required:
              raise SystemExit('provider manifest does not describe exactly the production provider set')
          mal_provider=json.loads(Path('assets/data/mal_provider_availability_map.json').read_text(encoding='utf-8'))
          if mal_provider.get('schemaVersion') != 1:
              raise SystemExit('invalid MAL provider cache schema')
          db=sqlite3.connect('assets/data/title_availability.db')
          try:
              db_titles=db.execute('select count(*) from title_availability').fetchone()[0]
          finally:
              db.close()
          if db_titles < len(before):
              raise SystemExit(f'title availability DB regressed: {db_titles} < {len(before)}')
          print('validated provider union',len(after),'titles; MAL provider entries',len(mal_provider.get('entries') or []),'title DB',db_titles)
          PY

      - name: Run focused cache tooling gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart analyze tools/provider_catalog_cache.dart
          dart analyze tools/build_mal_availability_cache_checkpointed.dart
          dart analyze tools/build_mal_provider_availability_cache.dart
          flutter test --no-pub \
            test/tools/provider_catalog_cache_test.dart \
            test/tools/build_mal_provider_availability_cache_test.dart \
            test/tools/build_mal_availability_cache_checkpointed_test.dart

      - name: Run project gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages tools
          flutter analyze --no-pub lib test packages/goanime_core/lib
          flutter test --no-pub --concurrency=2
          (cd packages/goanime_core && dart test)

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android debug APK
        working-directory: private-source
        shell: bash
        run: flutter build apk --debug --no-pub

      - name: Encrypt refreshed cache handoff
        id: package
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
          PROVIDER_AUDIT_STATUS: ${{ steps.provider.outputs.status }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-multisource-v2-handoff"
          gpg_home="$work/gpg"
          transfer="$work/transfer"
          rm -rf "$work"
          mkdir -p "$gpg_home" "$transfer"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          archive="$work/goanime-multisource-catalog-v2.tar.gz"
          tar -C "$GITHUB_WORKSPACE/private-source" -czf "$archive" \
            assets/data/anime_provider_catalogs.json \
            assets/data/anime_provider_catalog_manifest.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_availability_map.json \
            assets/data/mal_availability_unmatched.json \
            assets/data/mal_provider_availability_map.json \
            assets/data/title_availability.db \
            assets/data/franchise_availability_map.json \
            assets/data/franchise_index.json \
            assets/data/franchise_availability.db
          tar -tzf "$archive" >/dev/null
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          test -z "$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1=="sec"{print $1}')"
          encrypted="$transfer/GoAnime-multisource-catalog-v2.tar.gz.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted" --encrypt "$archive"
          test -s "$encrypted"
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          python3 - "$transfer/manifest.json" "$sha" "$GITHUB_RUN_ID" <<'PY'
          import datetime,json,os,sys
          path,sha,run_id=sys.argv[1:]
          data={
              'schema_version':2,
              'project':'goanime',
              'refresh_mode':os.environ.get('PROVIDER_AUDIT_STATUS') or 'unknown',
              'catalog_archive_sha256':sha,
              'encryption':'OpenPGP',
              'recipient_fingerprint':'2DE29DC31427CF0A911AB96175679291435059B0',
              'workflow_run_id':run_id,
              'retention_days':1,
              'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          open(path,'w',encoding='utf-8').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf "$gpg_home" "$archive"
          echo "transfer_dir=$transfer" >> "$GITHUB_OUTPUT"
          echo "catalog_sha256=$sha" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted recoverable handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-multisource-catalog-v2-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        shell: bash
        run: |
          echo '## GoAnime multi-provider catalog refresh v2' >> "$GITHUB_STEP_SUMMARY"
          echo "- Overall status: \`${{ steps.provider.outputs.status }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- AnimeFire: \`${{ steps.provider.outputs.animefire_status }}\` / ${{ steps.provider.outputs.animefire_count }} titles" >> "$GITHUB_STEP_SUMMARY"
          echo "- AnimesOnline: \`${{ steps.provider.outputs.animesonline_status }}\` / ${{ steps.provider.outputs.animesonline_count }} titles" >> "$GITHUB_STEP_SUMMARY"
          echo "- Goyabu: \`${{ steps.provider.outputs.goyabu_status }}\` / ${{ steps.provider.outputs.goyabu_count }} titles" >> "$GITHUB_STEP_SUMMARY"
          echo "- AniTube: \`${{ steps.provider.outputs.anitube_status }}\` / ${{ steps.provider.outputs.anitube_count }} titles" >> "$GITHUB_STEP_SUMMARY"
          echo "- Union: ${{ steps.provider.outputs.available_count }} titles" >> "$GITHUB_STEP_SUMMARY"
          echo "- New provider titles: ${{ steps.newtitles.outputs.count }}" >> "$GITHUB_STEP_SUMMARY"
          if [ '${{ steps.newtitles.outputs.count }}' != '0' ]; then
            echo "- MAL delta matches: ${{ steps.malmap.outputs.matched }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- MAL delta unmatched: ${{ steps.malmap.outputs.unmatched }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- MAL unmatched reasons: \`${{ steps.malmap.outputs.reasons }}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Encrypted cache SHA-256: \`${{ steps.package.outputs.catalog_sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private and transient data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
          rm -rf "$RUNNER_TEMP/goanime-multisource-v2" "$RUNNER_TEMP/goanime-multisource-v2-handoff"
