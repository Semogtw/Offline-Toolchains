name: Diagnose GoAnime history undo

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-history-undo-diagnostic/*.request'

permissions:
  contents: write
  actions: write

concurrency:
  group: goanime-history-undo-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Export encrypted prepared-tree history diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout trusted toolchains
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Read exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-history-undo-diagnostic/*.request' | head -n1)"
          test -n "$request_file"
          revision="$(tr -d '[:space:]' < "$request_file")"
          [[ "$revision" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Assemble reviewed runtime bundle
        shell: bash
        env:
          BUNDLE_SOURCE_SHA: 1e2adb9cd95ee70adc25702d901c8b95ce5534f6
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BUNDLE_SOURCE_SHA"
          git show "$BUNDLE_SOURCE_SHA:payloads/goanime-perf-runtime-final.bundle.b64.part1" > "$RUNNER_TEMP/perf.part1"
          git show "$BUNDLE_SOURCE_SHA:payloads/goanime-perf-runtime-final.bundle.b64.part2" > "$RUNNER_TEMP/perf.part2"
          cat "$RUNNER_TEMP/perf.part1" "$RUNNER_TEMP/perf.part2" | base64 -d > "$RUNNER_TEMP/goanime-perf-runtime.bundle"
          echo '4b9caec5e2555e2204e620e1051cd2f8735d79f850c5462a77687044f365262a  '"$RUNNER_TEMP/goanime-perf-runtime.bundle" | sha256sum -c -

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: ${{ steps.request.outputs.revision }}
          path: goanime
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Reconstruct exact runtime prepared tree
        working-directory: goanime
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          git bundle verify "$RUNNER_TEMP/goanime-perf-runtime.bundle"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch "$RUNNER_TEMP/goanime-perf-runtime.bundle" HEAD:refs/remotes/reviewed/perf-runtime
          git cherry-pick \
            519c4cf19553376950e0f8ae8f7d83ea6f0e1933 \
            4fa461a113ab9d552e7c44fd7760ab6634f2d82a \
            63b69c8f9b6d4d9625d5780c15bd529c8ddea989 \
            0e1bc3537c712c642c0d7acd2206ad9de7888a32 \
            12f2fca0c7d41ef8e388bfb032365db62b5c7766 \
            951e3533fd0aaa65dc41cd5d4da6cc83720a5a86
          git am "$GITHUB_WORKSPACE/payloads/goanime-runtime-guard-format-fix.patch"
          git am "$GITHUB_WORKSPACE/payloads/goanime-history-nullability-fix.patch"
          git am "$GITHUB_WORKSPACE/payloads/goanime-lazy-nav-test-fix.patch"
          test -z "$(git status --porcelain)"

          echo 'Prepared-tree ownership metadata:'
          git ls-files --stage test/widgets/history_delete_undo_test.dart || true
          git log --oneline --all -- test/widgets/history_delete_undo_test.dart | head -n 12 || true
          test -f test/widgets/history_delete_undo_test.dart

      - name: Package encrypted minimal prepared-tree source
        id: package
        shell: bash
        env:
          EXPECTED_REVISION: ${{ steps.request.outputs.revision }}
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          diagnostic_dir="$RUNNER_TEMP/goanime-history-undo-diagnostic"
          package_dir="$diagnostic_dir/package"
          archive="$diagnostic_dir/history-undo.tar.zst"
          encrypted="$diagnostic_dir/history-undo.gpg"
          gpg_home="$diagnostic_dir/gnupg"
          mkdir -p "$package_dir/test/widgets" "$package_dir/lib/screens" "$package_dir/lib/services" "$gpg_home"
          chmod 700 "$gpg_home"

          cp goanime/test/widgets/history_delete_undo_test.dart "$package_dir/test/widgets/"
          cp goanime/lib/screens/history_screen.dart "$package_dir/lib/screens/"
          cp goanime/lib/services/watch_history_service.dart "$package_dir/lib/services/"
          printf '%s\n' "$EXPECTED_REVISION" > "$package_dir/BASE_REVISION.txt"
          git -C goanime rev-parse HEAD > "$package_dir/PREPARED_REVISION.txt"
          git -C goanime log --format='%H %P %s' --all -- test/widgets/history_delete_undo_test.dart > "$package_dir/HISTORY_TEST_COMMITS.txt"
          tar -C "$package_dir" -I 'zstd -T0 -6' -cf "$archive" .

          export GNUPGHOME="$gpg_home"
          gpg --batch --import keys/source-bundles-public.asc
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted" --encrypt "$archive"
          test -s "$encrypted"

          rm -rf "$package_dir" "$archive" "$gpg_home" goanime
          echo "encrypted=$encrypted" >> "$GITHUB_OUTPUT"

      - name: Upload ciphertext-only diagnostic
        uses: actions/upload-artifact@v7
        with:
          name: goanime-history-undo-diagnostic-${{ github.run_id }}
          path: ${{ steps.package.outputs.encrypted }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Publish artifact receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ steps.request.outputs.revision }}
        run: |
          set -euo pipefail
          artifacts_json="$RUNNER_TEMP/artifacts.json"
          for attempt in 1 2 3 4 5; do
            gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
            if jq -e --arg artifact_name "goanime-history-undo-diagnostic-$GITHUB_RUN_ID" '.artifacts[]? | select(.name == $artifact_name)' "$artifacts_json" >/dev/null; then
              break
            fi
            sleep 2
          done
          artifact_name="goanime-history-undo-diagnostic-$GITHUB_RUN_ID"
          artifact_id="$(jq -er --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .id' "$artifacts_json" | head -n1)"
          artifact_size="$(jq -er --arg name "$artifact_name" '.artifacts[] | select(.name == $name) | .size_in_bytes' "$artifacts_json" | head -n1)"
          report_path="reports/goanime-history-undo-diagnostic/$GITHUB_RUN_ID.json"
          report_file="$RUNNER_TEMP/report.json"
          python3 - "$report_file" "$GITHUB_RUN_ID" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$REVISION" "$artifact_id" "$artifact_name" "$artifact_size" <<'PY'
          import json
          import sys
          from pathlib import Path
          path, run_id, run_url, revision, artifact_id, artifact_name, artifact_size = sys.argv[1:]
          Path(path).write_text(json.dumps({
              "schema_version": 1,
              "run_id": int(run_id),
              "run_url": run_url,
              "goanime_revision": revision,
              "artifact_id": int(artifact_id),
              "artifact_name": artifact_name,
              "artifact_size_bytes": int(artifact_size),
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          encoded="$(base64 -w0 "$report_file")"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$report_path" \
            -f message="ci(goanime): report history undo diagnostic run $GITHUB_RUN_ID" \
            -f content="$encoded" \
            -f branch=main >/dev/null

      - name: Remove transient private data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/goanime"
          rm -rf "$RUNNER_TEMP/goanime-history-undo-diagnostic"
          rm -f "$RUNNER_TEMP/goanime-perf-runtime.bundle" "$RUNNER_TEMP/perf.part1" "$RUNNER_TEMP/perf.part2"
