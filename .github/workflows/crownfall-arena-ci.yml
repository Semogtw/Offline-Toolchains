name: Crownfall Arena Godot CI

on:
  push:
    branches:
      - build/crownfall-arena
    paths:
      - 'ci/crownfall/**'
      - '.github/workflows/crownfall-arena-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crownfall-arena-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: '4.7.2'
  GODOT_TAG: '4.7.2-stable'
  PROJECT_DIR: 'ci/crownfall'

jobs:
  test:
    name: Godot headless tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o "$RUNNER_TEMP/godot.zip" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          GODOT_BIN="$(find "$RUNNER_TEMP/godot" -maxdepth 1 -type f -name 'Godot*' | head -n1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Run Crownfall tests
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM --kill-after=5s 30s \
            "$GODOT_BIN" --headless --path "$PROJECT_DIR" -s tests/run_tests.gd \
            2>&1 | tee "$RUNNER_TEMP/crownfall-test.log"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crownfall-test-log
          path: ${{ runner.temp }}/crownfall-test.log
          if-no-files-found: warn
          retention-days: 3
