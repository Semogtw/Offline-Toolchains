name: Observe GoAnime Manga stabilization fixes

on:
  workflow_run:
    workflows:
      - 'Apply GoAnime Manga category filter normalization'
      - 'Apply GoAnime Manga search terminal error fix'
    types: [completed]

permissions:
  contents: write

jobs:
  report:
    if: github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Publish sanitized result
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail
          case "$RUN_NAME" in
            'Apply GoAnime Manga category filter normalization') slug='category-filter' ;;
            'Apply GoAnime Manga search terminal error fix') slug='search-terminal-error' ;;
            *) exit 0 ;;
          esac
          path="reports/goanime-manga-stabilization-20260822/${slug}-${RUN_ID}.json"
          payload="$(jq -nc --argjson runId "$RUN_ID" --arg name "$RUN_NAME" --arg conclusion "$CONCLUSION" --arg headSha "$HEAD_SHA" --arg event "$EVENT" '{schemaVersion:1,runId:$runId,name:$name,conclusion:$conclusion,headSha:$headSha,event:$event}')"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="ci(goanime): report Manga stabilization ${slug} ${RUN_ID}" -f content="$encoded" >/dev/null
