name: Capture Fichário coverage UI

on:
  push:
    branches:
      - tooling/capture-fichario-coverage-ui-20260810
    paths:
      - .github/workflows/capture-fichario-coverage-ui.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout toolchains
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout Fichário feature branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: feature/unit-topic-coverage
          path: fichario-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: fichario-source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: fichario-source
        run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        working-directory: fichario-source
        run: pnpm exec playwright install --with-deps chromium

      - name: Build feature branch
        working-directory: fichario-source
        env:
          PUBLIC_SUPABASE_URL: https://playwright-fichario.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_playwright_capture_1234567890
        run: pnpm build

      - name: Serve built app
        working-directory: fichario-source
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 4173 --bind 127.0.0.1 --directory build > "$RUNNER_TEMP/fichario-http.log" 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/login/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/fichario-http.log" >&2
          exit 1

      - name: Capture rendered coverage screen with Playwright
        working-directory: fichario-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fichario-coverage"
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1100 } });
          const userId = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
          const now = Math.floor(Date.now() / 1000);
          const encode = (value) => Buffer.from(JSON.stringify(value)).toString('base64url');
          const accessToken = `${encode({ alg: 'HS256', typ: 'JWT' })}.${encode({ sub: userId, aud: 'authenticated', role: 'authenticated', email: 'capture@example.test', exp: now + 3600, iat: now })}.capture-signature`;
          const session = {
            access_token: accessToken,
            token_type: 'bearer',
            expires_in: 3600,
            expires_at: now + 3600,
            refresh_token: 'capture-refresh-token',
            user: {
              id: userId,
              aud: 'authenticated',
              role: 'authenticated',
              email: 'capture@example.test',
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: {},
              identities: [],
              created_at: '2026-08-10T00:00:00.000Z',
              updated_at: '2026-08-10T00:00:00.000Z'
            }
          };

          await page.route('https://playwright-fichario.supabase.co/**', async (route) => {
            const url = route.request().url();
            if (url.includes('/auth/v1/token')) {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(session) });
              return;
            }
            if (url.includes('/rest/v1/app_users')) {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify({ is_active: true }) });
              return;
            }
            if (url.includes('/rest/v1/rpc/list_notebooks')) {
              await route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
              return;
            }
            if (url.includes('/rest/v1/rpc/search_pages')) {
              const body = route.request().postDataJSON?.() ?? {};
              const query = String(body.search_query ?? '').toLocaleLowerCase('pt-BR');
              const base = { notebook_id: null, notebook_name: null };
              let rows = [];
              if (query.includes('temperatura')) rows = [{ ...base, page_id: '11111111-1111-4111-8111-111111111111', document_id: '21111111-1111-4111-8111-111111111111', document_title: 'Termodinâmica — Aula 2', page_number: 4, excerpt: 'Temperatura mede o estado térmico do sistema e se relaciona ao equilíbrio térmico entre corpos.', rank: 0.96 }];
              else if (query.includes('calor específico') || query.includes('calor especifico')) rows = [{ ...base, page_id: '12222222-2222-4222-8222-222222222222', document_id: '22222222-2222-4222-8222-222222222222', document_title: 'Resumo de Calorimetria', page_number: 2, excerpt: 'A capacidade térmica depende da massa e do calor específico do material utilizado.', rank: 0.66 }];
              else if (query.includes('primeira lei')) rows = [{ ...base, page_id: '13333333-3333-4333-8333-333333333333', document_id: '23333333-3333-4333-8333-333333333333', document_title: 'Primeira Lei da Termodinâmica', page_number: 6, excerpt: 'Pela primeira lei da termodinâmica, a variação da energia interna é determinada pelo calor e pelo trabalho.', rank: 0.93 }];
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(rows) });
              return;
            }
            await route.fulfill({ status: 200, contentType: 'application/json', body: '[]' });
          });

          await page.goto('http://127.0.0.1:4173/login/', { waitUntil: 'networkidle' });
          console.log('Login URL:', page.url());
          await page.getByLabel('E-mail').fill('capture@example.test');
          await page.getByLabel('Senha').fill('capture-only');
          await page.getByRole('button', { name: 'Entrar' }).click();
          await page.waitForURL('http://127.0.0.1:4173/');

          await page.goto('http://127.0.0.1:4173/coverage/', { waitUntil: 'networkidle' });
          console.log('Coverage URL:', page.url());
          console.log('Coverage title:', await page.title());
          await page.screenshot({ path: process.env.RUNNER_TEMP + '/fichario-coverage/coverage-before-fill.png', fullPage: true });

          const unitInput = page.getByPlaceholder('Ex.: Unidade III — Termodinâmica');
          await unitInput.waitFor({ state: 'visible' });
          await unitInput.fill('Unidade III — Termodinâmica');
          await page.locator('textarea').fill('3.1 Temperatura\n3.2 Calor específico\n3.3 Mudanças de fase\n3.4 Primeira lei da termodinâmica');
          await page.getByRole('button', { name: 'Transformar em campos' }).click();
          await page.screenshot({ path: process.env.RUNNER_TEMP + '/fichario-coverage/coverage-editor.png', fullPage: true });

          await page.getByRole('button', { name: 'Verificar cobertura' }).click();
          await page.locator('.coverage').waitFor({ state: 'visible' });
          await page.locator('.coverage').screenshot({ path: process.env.RUNNER_TEMP + '/fichario-coverage/coverage-results.png' });
          await page.screenshot({ path: process.env.RUNNER_TEMP + '/fichario-coverage/coverage-full.png', fullPage: true });

          const statuses = await page.locator('.topic-card .status').allTextContents();
          console.log('Rendered statuses:', statuses);
          if (!statuses.includes('Coberto') || !statuses.includes('Parcial') || !statuses.includes('Não encontrado')) {
            throw new Error(`Coverage states not rendered as expected: ${statuses.join(', ')}`);
          }
          await browser.close();
          NODE

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fichario-coverage-playwright
          path: ${{ runner.temp }}/fichario-coverage/*.png
          if-no-files-found: warn
          retention-days: 1
