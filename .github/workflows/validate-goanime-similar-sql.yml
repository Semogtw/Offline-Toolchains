name: Validate GoAnime offline Similar Works SQL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-goanime-similar-sql.yml'
      - 'triggers/goanime-similar-sql/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-similar-sql-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout trusted runner workflow
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Resolve exact requested private commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t paths < <(git diff-tree --no-commit-id --name-only -r HEAD^ HEAD -- 'triggers/goanime-similar-sql/*.request')
          test "${#paths[@]}" -eq 1
          ref="$(tr -d '\r\n' < "${paths[0]}")"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime code
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Install locked dependencies
        working-directory: private-source
        run: |
          flutter pub get --enforce-lockfile
          (cd packages/goanime_core && dart pub get --enforce-lockfile)

      - name: Validate bounded similar-work lookup
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 test/services/manga/manga_similar_bounded_lookup_test.dart

      - name: Validate Because You Read bounded neighbor lookup
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 test/services/manga/manhastro_recommendations_adapter_test.dart --plain-name 'Because You Read uses bounded offline neighbor hydration'

      - name: Validate SQL source version and ranked reads
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 test/services/manga/storage/manga_bundled_similar_sql_index_test.dart

      - name: Validate retained JSON index compatibility
        working-directory: private-source
        run: flutter test --no-pub --concurrency=1 test/services/manga/storage/manga_bundled_recommendation_index_test.dart

      - name: Validate offline SQL importer tests
        working-directory: private-source
        run: python3 -m unittest -v tools.tests.test_build_manga_similar_works_sql

      - name: Build and validate actual index from production artifacts
        working-directory: private-source
        run: |
          python3 tools/manga/build_manga_similar_works_sql.py \
            --catalog assets/data/manga_availability.db \
            --recommendations assets/data/manga_recommendation_index.json \
            --redirects assets/data/manga_work_redirects.json \
            --catalog-version assets/data/manga_availability.db.version \
            --output "$RUNNER_TEMP/manga_similar_works.db"

      - name: Validate shipped SQLite asset against reproducible output
        working-directory: private-source
        run: |
          set -euo pipefail
          if test -f assets/data/manga_similar_works.db; then
            cmp assets/data/manga_similar_works.db "$RUNNER_TEMP/manga_similar_works.db"
            echo "Shipped SQL sidecar matches reproducible offline build."
          fi

      - name: Validate asset is packaged into a Flutter APK
        working-directory: private-source
        run: |
          set -euo pipefail
          flutter build apk --debug --no-pub --target-platform android-arm64
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import zipfile

          apk = Path('build/app/outputs/flutter-apk/app-debug.apk')
          assert apk.is_file(), 'Flutter APK missing'
          bundled = Path('assets/data/manga_similar_works.db')
          assert bundled.is_file(), 'Committed SQL sidecar missing'
          with zipfile.ZipFile(apk) as archive:
              names = [name for name in archive.namelist()
                       if name.endswith('assets/data/manga_similar_works.db')]
              assert len(names) == 1, f'Expected one SQL asset, found {names}'
              actual = hashlib.sha256(archive.read(names[0])).hexdigest()
          expected = hashlib.sha256(bundled.read_bytes()).hexdigest()
          assert actual == expected, f'APK SQL hash mismatch: {actual} != {expected}'
          print(f'Flutter APK contains matching SQL index: {actual}')
          PY

      - name: Publish verified binary into private GoAnime artifact branch
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"
          if test -f assets/data/manga_similar_works.db; then
            cmp assets/data/manga_similar_works.db "$RUNNER_TEMP/manga_similar_works.db"
            echo "Verified committed SQLite matches reproducible builder output."
            exit 0
          fi
          install -m 0644 "$RUNNER_TEMP/manga_similar_works.db" assets/data/manga_similar_works.db
          sha256sum assets/data/manga_similar_works.db
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/manga_similar_works.db
          git commit -m 'build(manga): validated Octen SQL neighbor index'
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin \
            HEAD:refs/heads/generated/manga-similar-sql-20261020
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Sanitize private checkout
        if: always()
        run: rm -rf private-source
