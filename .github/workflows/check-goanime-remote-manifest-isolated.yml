name: Check GoAnime remote manifest policy isolated

on:
  push:
    branches: [main]
    paths:
      - 'triggers/check-goanime-remote-manifest-isolated/*.request'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/check-goanime-remote-manifest-isolated/*.request' | head -n1)"
          read -r project sha < "control/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.req.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: false
      - name: Run isolated file
        working-directory: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          flutter pub get >/dev/null
          set +e
          timeout 120s flutter test --no-pub --concurrency=1 test/services/remote_manifest_url_policy_test.dart > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          set -e
          tail -n 160 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/tail.log"
          python3 - "$RUNNER_TEMP/tail.log" "$RUNNER_TEMP/report.json" "$rc" <<'PY'
          import json,sys
          text=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          open(sys.argv[2],'w',encoding='utf-8').write(json.dumps({'schemaVersion':1,'exitCode':int(sys.argv[3]),'tail':text},ensure_ascii=False,indent=2)+'\n')
          PY
          encoded="$(base64 -w0 < "$RUNNER_TEMP/report.json")"
          path="results/check-goanime-remote-manifest-isolated/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(goanime): record isolated remote manifest check $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
