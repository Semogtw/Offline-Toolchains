name: Deprecated Hydra test-group diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Use sanitized Hydra repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
