name: Request Receitas CI

on:
  push:
    branches:
      - build/receitas-ci
    paths:
      - triggers/receitas-ci.json

permissions:
  contents: read

concurrency:
  group: receitas-ci-request-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Receitas CI request
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require an owner-authored push
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$EVENT_NAME" = "push"
          test "$ACTOR" = "$OWNER"

      - name: Checkout request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/receitas-ci.json
          sparse-checkout-cone-mode: false

      - name: Validate fixed Receitas request contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('request-source/triggers/receitas-ci.json')
          request = json.loads(path.read_text(encoding='utf-8'))
          if set(request) != {'ref'}:
              raise SystemExit('request must contain exactly the ref field')

          ref = request['ref']
          if not isinstance(ref, str) or not ref:
              raise SystemExit('ref must be a non-empty string')
          if len(ref) > 200 or ref.startswith('-') or '..' in ref or '@{' in ref:
              raise SystemExit('unsafe git ref')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', ref):
              raise SystemExit('ref contains unsupported characters')

          print('Receitas CI request contract: PASS')
          PY
