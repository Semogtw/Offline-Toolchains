name: Fix GoAnime Manhastro live pagination

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manhastro-live-pagination-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manhastro-live-pagination-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Follow Manhastro live catalog pagination
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply exact-SHA Manhastro live-pagination fix
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: bash scripts/fix-goanime-manhastro-live-pagination.sh
