name: Validate GoAnime Flutter 3.47 candidate

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-sdk-347/*.request'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve exact GoAnime commit
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-sdk-347/*.request' | head -n 1)"
          test -n "$request"
          sha="$(cat "trusted-source/$request")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          show-progress: false
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve locked app and core dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          (cd packages/goanime_core && dart pub get --enforce-lockfile)
          bash tools/validate_ci_lockfiles.sh
      - name: Analyze entire Flutter app
        working-directory: private-source
        run: flutter analyze --no-pub
      - name: Focused Manga cover, memory and Home tests
        working-directory: private-source
        run: |
          flutter test --no-pub test/services/manga/manga_cover_network_image_test.dart test/services/manga/manga_reader_memory_policy_test.dart test/widgets/manga_manhastro/home_state_source_contract_test.dart
      - name: Core domain tests
        working-directory: private-source/packages/goanime_core
        run: dart test
      - name: Build Android arm64 debug APK
        working-directory: private-source
        run: flutter build apk --debug --no-pub --target-platform=android-arm64
      - name: Remove checkout
        if: always()
        run: rm -rf private-source trusted-source
