name: Deprecated GoAnime public diagnostic log

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Do not publish private-source logs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain replacement
        shell: bash
        run: |
          echo 'This diagnostic workflow is retired because public full logs can expose private-source details.'
          echo 'Run focused diagnostics without artifacting raw private-source logs.'
