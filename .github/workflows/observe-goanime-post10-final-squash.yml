name: Observe GoAnime post-10 protected delivery

on:
  push:
    branches: [main]
    paths:
      - 'triggers/observe-goanime-post10-final-squash/*.request'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture sanitized protected-delivery state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(gh api "repos/$REPO/actions/workflows/deliver-goanime-post10-protected-pr.yml/runs?per_page=5")"
          report="$(jq -c '{schemaVersion:1,runs:[.workflow_runs[] | {id,status,conclusion,event,head_sha,created_at,updated_at}]}' <<<"$response")"
          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          path="results/observe-goanime-post10-final-squash/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(observe): record GoAnime post-10 protected-delivery state $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
