name: One-shot Hydra V2 path docs

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-doc-paths.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Update portable path documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docs/DRIVE_CLOUD_SAVES_V2.md")
          text = path.read_text()
          old = 'O snapshot converte raízes conhecidas para tokens como `%HOME%`, `%WINEPREFIX%`, `%DRIVE_C%` e `%ROOT%`.'
          new = 'O snapshot converte raízes conhecidas para tokens portáteis como `%HOME%`, `%DOCUMENTS%`, `%APPDATA%`, `%LOCALAPPDATA%`, `%USERPROFILE%`, `%PROGRAMDATA%`, `%WINEPREFIX%`, `%DRIVE_C%` e `%ROOT%`. Caminhos sob `drive_c/users/<nome>` são normalizados para o mesmo namespace lógico usado no Windows, removendo o nome local do perfil da identidade do save.'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit("portable path documentation sentence was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push race-safely
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add docs/DRIVE_CLOUD_SAVES_V2.md
          git commit -m "docs(cloud-save): document portable V2 profile tokens"
          git pull --rebase origin feat/drive-cloud-saves-v2
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-doc-paths.yml" "triggers/one-shot-hydra-v2-doc-paths.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed V2 docs patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" -d "$body" >/dev/null || true
          done
