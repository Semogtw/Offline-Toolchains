name: Apply GoAnime phase 2 scheduler migration

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-phase2-scheduler/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-phase2-scheduler
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate and validate shared scheduler adoption
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-phase2-scheduler/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply deterministic phase 2 migration
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              return text.replace(old, new, 1)

          aggregator_path = Path('lib/services/source/episode_aggregator.dart')
          aggregator = aggregator_path.read_text()
          aggregator = replace_once(
              aggregator,
              "import '../providers/default_anime_source_providers.dart';\n",
              "import '../media/provider_request_scheduler.dart';\nimport '../providers/default_anime_source_providers.dart';\n",
              'aggregator import',
          )
          aggregator = replace_once(
              aggregator,
              """  EpisodeAggregator({
    this.episodeSourceTimeout = const Duration(seconds: 14),
    this.onHealthSample,
    this.maxConcurrentEpisodeLoads = defaultMaxConcurrentEpisodeLoads,
  });

  final Duration episodeSourceTimeout;
  final ProviderHealthSampleReporter? onHealthSample;
""",
              """  EpisodeAggregator({
    this.episodeSourceTimeout = const Duration(seconds: 14),
    this.onHealthSample,
    this.maxConcurrentEpisodeLoads = defaultMaxConcurrentEpisodeLoads,
    ProviderRequestScheduler? requestScheduler,
  }) : _requestScheduler = requestScheduler;

  final Duration episodeSourceTimeout;
  final ProviderHealthSampleReporter? onHealthSample;
  final ProviderRequestScheduler? _requestScheduler;
""",
              'aggregator constructor',
          )
          old_runner = """    Future<void> runWithConcurrency(
      List<({ProviderAnimeMatches match, Anime anime})> jobs,
      int concurrency,
    ) async {
      if (jobs.isEmpty) return;
      var next = 0;
      Future<void> worker() async {
        while (true) {
          final index = next;
          next += 1;
          if (index >= jobs.length) return;
          await loadProviderEpisodes(jobs[index].match, jobs[index].anime);
          tryEmitPartial();
        }
      }

      final workerCount = concurrency < 1
          ? 1
          : (concurrency > jobs.length ? jobs.length : concurrency);
      await Future.wait([
        for (var slot = 0; slot < workerCount; slot++) worker(),
      ]);
    }

    await runWithConcurrency(confirmedJobs, maxConcurrentEpisodeLoads);
"""
          new_runner = """    final normalizedConcurrency = maxConcurrentEpisodeLoads < 1
        ? 1
        : maxConcurrentEpisodeLoads;
    final ownsScheduler = _requestScheduler == null;
    final scheduler =
        _requestScheduler ??
        ProviderRequestScheduler(
          globalLimit: normalizedConcurrency,
          policies: {
            for (final match in providerMatches)
              match.provider.providerKey: ProviderPolicy(
                providerKey: match.provider.providerKey,
                maxConcurrent: normalizedConcurrency,
                requestTimeout: episodeSourceTimeout,
              ),
          },
        );

    Future<void> scheduleJobs(
      List<({ProviderAnimeMatches match, Anime anime})> jobs,
    ) async {
      await Future.wait([
        for (final job in jobs)
          scheduler.schedule<void>(
            providerKey: job.match.provider.providerKey,
            priority: RequestPriority.userInitiated,
            operation: () async {
              await loadProviderEpisodes(job.match, job.anime);
              tryEmitPartial();
            },
          ),
      ]);
    }

    try {
      await scheduleJobs(confirmedJobs);
"""
          aggregator = replace_once(aggregator, old_runner, new_runner, 'aggregator concurrency runner')
          aggregator = replace_once(
              aggregator,
              """    await runWithConcurrency(gapJobs, maxConcurrentEpisodeLoads);

    final unifiedList = aggregated.values.toList()
""",
              """      await scheduleJobs(gapJobs);
    } finally {
      if (ownsScheduler) scheduler.dispose();
    }

    final unifiedList = aggregated.values.toList()
""",
              'aggregator gap scheduling',
          )
          aggregator_path.write_text(aggregator)

          unified_path = Path('lib/services/unified_source_service.dart')
          unified = unified_path.read_text()
          unified = replace_once(
              unified,
              "import 'episode_tree_cache_service.dart';\n",
              "import 'episode_tree_cache_service.dart';\nimport 'media/provider_request_scheduler.dart';\n",
              'unified scheduler import',
          )
          unified = replace_once(
              unified,
              """    final episodePhasePermits = _AsyncPermitPool(
      EpisodeAggregator.defaultMaxConcurrentEpisodeLoads,
    );
""",
              """    final episodeScheduler = ProviderRequestScheduler(
      globalLimit: EpisodeAggregator.defaultMaxConcurrentEpisodeLoads,
      policies: {
        for (final provider in _sourceProviders)
          provider.providerKey: ProviderPolicy(
            providerKey: provider.providerKey,
            maxConcurrent: 1,
            requestTimeout: _episodeSourceTimeout,
          ),
      },
    );
""",
              'unified scheduler construction',
          )
          unified = replace_once(
              unified,
              """      final resolved = await episodePhasePermits.run(() async {
        final providerAggregator = EpisodeAggregator(
          episodeSourceTimeout: _episodeSourceTimeout,
          maxConcurrentEpisodeLoads: 1,
        );
        return providerAggregator.aggregate(
          providerMatches: [match],
          preliminary: const [],
          onPartialResult: (snapshot) {
            publishProviderSnapshot(index, snapshot);
          },
        );
      });
""",
              """      final providerAggregator = EpisodeAggregator(
        episodeSourceTimeout: _episodeSourceTimeout,
        maxConcurrentEpisodeLoads: 1,
        requestScheduler: episodeScheduler,
      );
      final resolved = await providerAggregator.aggregate(
        providerMatches: [match],
        preliminary: const [],
        onPartialResult: (snapshot) {
          publishProviderSnapshot(index, snapshot);
        },
      );
""",
              'unified provider episode phase',
          )
          unified = replace_once(
              unified,
              """    await Future.wait([
      for (var index = 0; index < _sourceProviders.length; index++)
        loadProvider(index, _sourceProviders[index]),
    ]);

    final resolved = _combineResolvedSnapshots(
""",
              """    try {
      await Future.wait([
        for (var index = 0; index < _sourceProviders.length; index++)
          loadProvider(index, _sourceProviders[index]),
      ]);
    } finally {
      episodeScheduler.dispose();
    }

    final resolved = _combineResolvedSnapshots(
""",
              'unified scheduler disposal',
          )
          pool_start = unified.find('\nclass _AsyncPermitPool {')
          if pool_start < 0:
              raise SystemExit('unified permit pool: class not found')
          unified = unified[:pool_start].rstrip() + '\n'
          unified_path.write_text(unified)
          PY

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies privately
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Format migrated files
        working-directory: private-source
        run: dart format lib/services/media/provider_request_scheduler.dart lib/services/source/episode_aggregator.dart lib/services/unified_source_service.dart test/services/media/provider_request_scheduler_validation_test.dart test/architecture/shared_provider_scheduler_adoption_guard_test.dart

      - name: Analyze phase 2 slice
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            lib/services/media/provider_request_scheduler.dart \
            lib/services/source/episode_aggregator.dart \
            lib/services/unified_source_service.dart \
            lib/services/manga/manga_request_scheduler.dart \
            test/services/media/provider_request_scheduler_test.dart \
            test/services/media/provider_request_scheduler_validation_test.dart \
            test/services/source/episode_aggregator_staged_pipeline_test.dart \
            test/architecture/shared_provider_scheduler_adoption_guard_test.dart

      - name: Test phase 2 slice
        working-directory: private-source
        run: |
          flutter test --no-pub test/services/media/provider_request_scheduler_test.dart
          flutter test --no-pub test/services/media/provider_request_scheduler_validation_test.dart
          flutter test --no-pub test/services/source/episode_aggregator_staged_pipeline_test.dart
          flutter test --no-pub test/architecture/shared_provider_scheduler_adoption_guard_test.dart

      - name: Commit and push exact migration
        id: commit
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          current="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$current" = "$EXPECTED_SHA"
          git config user.name 'goanime-toolchains'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/services/media/provider_request_scheduler.dart lib/services/source/episode_aggregator.dart lib/services/unified_source_service.dart
          git commit -m 'refactor(media): unify anime provider scheduling'
          source_sha="$(git rev-parse HEAD)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

  report:
    name: Publish sanitized phase 2 result
    if: always()
    needs: [migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish sanitized result
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATE_RESULT: ${{ needs.migrate.result }}
          SOURCE_SHA: ${{ needs.migrate.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'runId': int(os.environ['RUN_ID']),
            'migrateResult': os.environ['MIGRATE_RESULT'],
            'sourceSha': os.environ.get('SOURCE_SHA') or None,
          }, indent=2, sort_keys=True))
          PY
          )"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"
          path="reports/goanime-phase2-scheduler/${RUN_ID}.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report phase2 scheduler run ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null
