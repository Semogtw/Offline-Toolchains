name: Apply GoAnime direct download identity transfer

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-direct-download-identity/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-direct-download-identity
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-direct-download-identity/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          case "$branch" in
            main|fix/post-10-of-10-hardening-20260823) ;;
            *) echo "unsupported target branch" >&2; exit 1 ;;
          esac
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify target head
        working-directory: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Apply byte-stable representation hardening
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one reviewed anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          http_file = 'lib/services/download/download_queue_manager_http.dart'
          replace_once(
              http_file,
              "      final request = http.Request('GET', Uri.parse(resolvedSource.url));\n      request.headers.addAll(resolvedSource.headers);\n",
              "      final request = http.Request('GET', Uri.parse(resolvedSource.url));\n      request.headers.addAll(resolvedSource.headers);\n      // Byte offsets, Content-Length and resume validators describe the wire\n      // representation. Dart's HttpClient otherwise requests gzip and may\n      // transparently decompress the body while retaining the compressed\n      // Content-Length header, which breaks byte-accurate completion checks.\n      request.headers[HttpHeaders.acceptEncodingHeader] = 'identity';\n",
          )
          replace_once(
              http_file,
              "      if (resumeOffset > 0 &&\n          resumeValidator != null &&\n          response.statusCode != HttpStatus.ok) {\n",
              "      final contentEncoding = response.headers[HttpHeaders.contentEncodingHeader]\n          ?.trim();\n      if (contentEncoding != null &&\n          contentEncoding.isNotEmpty &&\n          contentEncoding.toLowerCase() != 'identity') {\n        throw const InvalidDownloadRangeFailure(\n          'Direct download response used content encoding incompatible with byte-accurate storage.',\n        );\n      }\n\n      if (resumeOffset > 0 &&\n          resumeValidator != null &&\n          response.statusCode != HttpStatus.ok) {\n",
          )

          test_file = 'test/services/download/download_local_http_server_contract_test.dart'
          replace_once(
              test_file,
              "    server.listen((request) async {\n      expect(request.headers.value(HttpHeaders.rangeHeader), isNull);\n      final response = request.response;\n",
              "    server.listen((request) async {\n      expect(request.headers.value(HttpHeaders.rangeHeader), isNull);\n      expect(\n        request.headers.value(HttpHeaders.acceptEncodingHeader),\n        'identity',\n      );\n      final response = request.response;\n",
          )
          anchor = "  test('resumes a partial file with a real HTTP 206 response', () async {\n"
          addition = (
              "  test('rejects non-identity direct responses before writing bytes', () async {\n"
              "    final body = payload.codeUnits;\n"
              "    server.listen((request) async {\n"
              "      expect(\n"
              "        request.headers.value(HttpHeaders.acceptEncodingHeader),\n"
              "        'identity',\n"
              "      );\n"
              "      final response = request.response;\n"
              "      response.headers.set(HttpHeaders.contentEncodingHeader, 'gzip');\n"
              "      response.headers.contentLength = body.length;\n"
              "      response.add(body);\n"
              "      await response.close();\n"
              "    });\n\n"
              "    final item = await _download(\n"
              "      server: server,\n"
              "      storage: storage,\n"
              "      root: tempDir,\n"
              "      payload: body,\n"
              "      expectedStatus: DownloadStatus.failed,\n"
              "    );\n\n"
              "    expect(item.error, contains('content encoding'));\n"
              "  });\n\n"
          )
          replace_once(test_file, anchor, addition + anchor)

          checkpoint = 'docs/checkpoint_69_post_merge_hardening_2026-08-23.md'
          replace_once(
              checkpoint,
              "Regressões adicionadas cobrem explicitamente `50/100`, `98/100`, `99/100`, `100/100`, estado inválido e o modo estrito usado por resume validado.\n",
              "Regressões adicionadas cobrem explicitamente `50/100`, `98/100`, `99/100`, `100/100`, estado inválido e o modo estrito usado por resume validado. Downloads diretos também forçam `Accept-Encoding: identity` e rejeitam respostas com representação codificada, porque `Content-Length`, `Range` e os bytes persistidos precisam descrever a mesma representação.\n",
          )
          PY
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Format and validate focused hardening
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/services/download/download_queue_manager_http.dart \
            test/services/download/download_local_http_server_contract_test.dart >/dev/null
          git diff --check
          bash ./tools/validate_project_health.sh
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/validate_repository_guards.py
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 \
            test/services/download/download_completion_policy_test.dart \
            test/services/download/download_local_http_server_contract_test.dart \
            test/services/download_service_test.dart

      - name: Commit and publish guarded fix
        id: publish
        working-directory: source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git config user.name "goanime-toolchains[bot]"
          git config user.email "goanime-toolchains[bot]@users.noreply.github.com"
          git add \
            lib/services/download/download_queue_manager_http.dart \
            test/services/download/download_local_http_server_contract_test.dart \
            docs/checkpoint_69_post_merge_hardening_2026-08-23.md
          git commit -m "fix(download): require byte-stable direct transfers"
          pushed_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'pushed_sha=%s\n' "$pushed_sha" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          SOURCE_SHA: ${{ steps.request.outputs.sha }}
          PUSHED_SHA: ${{ steps.publish.outputs.pushed_sha }}
          STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(jq -cn \
            --arg branch "$TARGET_BRANCH" \
            --arg sourceSha "$SOURCE_SHA" \
            --arg pushedSha "$PUSHED_SHA" \
            --arg state "$STATE" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,branch:$branch,sourceSha:$sourceSha,pushedSha:$pushedSha,state:$state,runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-direct-download-identity/$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record GoAnime direct identity $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/trusted-source"
