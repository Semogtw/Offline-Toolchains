name: One-shot Hydra V1 fallback anchor invalidation

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-fallback-anchor.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Clear stale V2 anchor on true V1 fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts")
          text = path.read_text()
          needle = '''  }): Promise<{\n    syncResult: GoogleDriveSyncResult;\n    preserveLocalArchive: boolean;\n  }> {\n    const decision = decideGoogleDriveSync({\n      localHash: archive.contentHash,\n'''
          replacement = '''  }): Promise<{\n    syncResult: GoogleDriveSyncResult;\n    preserveLocalArchive: boolean;\n  }> {\n    if (!remote?.v2ManifestPresent) {\n      await googleDriveSyncAnchorSublevel.del(\n        levelKeys.game(game.shop, game.objectId)\n      );\n    }\n\n    const decision = decideGoogleDriveSync({\n      localHash: archive.contentHash,\n'''
          if needle not in text:
              if "if (!remote?.v2ManifestPresent)" in text:
                  print("Fallback anchor invalidation already present")
                  raise SystemExit(0)
              raise SystemExit("V1 fallback entry point not found")
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit and push race-safely
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts
          git commit -m "fix(cloud-save): clear V2 anchor on legacy fallback"
          git pull --rebase origin feat/drive-cloud-saves-v2
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-fallback-anchor.yml" "triggers/one-shot-hydra-v2-fallback-anchor.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed V1 fallback anchor patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null || true
          done
