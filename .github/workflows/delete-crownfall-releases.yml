name: Delete Crownfall Arena releases

on:
  push:
    branches:
      - build/crownfall-arena
    paths:
      - '.github/workflows/delete-crownfall-releases.yml'

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-24.04
    steps:
      - name: Delete Crownfall Arena releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 382814828 382836681 382868857; do
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/releases/${id}"
            echo "Deleted release id ${id}"
          done

          for tag in crownfall-v0.1.0 crownfall-v0.2.0 crownfall-v0.3.0; do
            if gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
              echo "Release ${tag} still exists" >&2
              exit 1
            fi
            echo "Verified release ${tag} is gone"
          done
