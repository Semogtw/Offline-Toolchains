name: Repair GoAnime manga provider stabilization privately

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-provider-stabilize/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-provider-stabilize-private-ci
  cancel-in-progress: false

jobs:
  repair:
    name: Repair current manga provider analyzer failures
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-provider-stabilize/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply narrow provider repairs
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              'lib/services/manga/providers/greenshit_manga_provider.dart',
              '      if (genre != null) genre,\n',
              '      ?genre,\n',
          )
          replace(
              'lib/services/manga/providers/greenshit_manga_provider.dart',
              'html_parser.parseFragment(descriptionHtml).text.trim(),',
              'html_parser.parseFragment(descriptionHtml).text?.trim(),',
          )
          replace(
              'lib/services/manga/providers/kivaratoons_manga_provider.dart',
              '.whereType<Map>()',
              '.whereType<Map<String, dynamic>>()',
          )
          replace(
              'lib/services/manga/providers/leitor_de_mangas_manga_provider.dart',
              '  LeitorDeMangasMangaProvider({required MangaHttpClient httpClient})\n    : _readerHttpClient = httpClient,\n      super(\n        sourceId: sourceIdValue,\n        name: \'Leitor de Mangas\',\n        httpClient: httpClient,\n',
              '  LeitorDeMangasMangaProvider({required super.httpClient})\n    : _readerHttpClient = httpClient,\n      super(\n        sourceId: sourceIdValue,\n        name: \'Leitor de Mangas\',\n',
          )
          replace(
              'lib/services/manga/providers/little_tyrant_manga_provider.dart',
              '        coverUrl: _imageUrl(cover) ?? occurrence.coverUrl,',
              '        coverUrl: _imageUrl(_baseUri, cover) ?? occurrence.coverUrl,',
          )
          replace(
              'lib/services/manga/providers/little_tyrant_manga_provider.dart',
              'String? _imageUrl(Element? image) {',
              'String? _imageUrl(Uri baseUri, Element? image) {',
          )
          replace(
              'lib/services/manga/providers/little_tyrant_manga_provider.dart',
              '      return _baseUri.resolve(value).toString();',
              '      return baseUri.resolve(value).toString();',
          )
          replace(
              'lib/services/manga/providers/mangalivre_org_manga_provider.dart',
              '      return MangaFormat.novel;',
              '      return MangaFormat.other;',
          )

          p = Path('lib/services/manga/providers/ler999_manga_provider.dart')
          text = p.read_text()
          if "import 'package:html/dom.dart';" not in text:
              text = text.replace(
                  "import 'package:goanime_core/goanime_core.dart';\n",
                  "import 'package:goanime_core/goanime_core.dart';\nimport 'package:html/dom.dart';\n",
                  1,
              )
          replacements = {
              '(value as Map).cast<String, dynamic>()': '(value as Map<Object?, Object?>).cast<String, dynamic>()',
              '.whereType<Map>()': '.whereType<Map<Object?, Object?>>()',
              'if (total is! Map) return null;': 'if (total is! Map<Object?, Object?>) return null;',
              'return value is Map ? _string(value[\'\\$t\']) : null;': 'return value is Map<Object?, Object?> ? _string(value[\'\\$t\']) : null;',
              'if (media is Map) return _string(media[\'url\']);': 'if (media is Map<Object?, Object?>) return _string(media[\'url\']);',
              'if (content is! Map) return null;': 'if (content is! Map<Object?, Object?>) return null;',
              'String? _nodeText(dynamic node)': 'String? _nodeText(Element? node)',
              "if (profile == null) throw const FormatException('Ler 999 details profile is missing.');": "if (profile == null) {\n      throw const FormatException('Ler 999 details profile is missing.');\n    }",
              "if (label == null || label.isEmpty) throw const FormatException('Ler 999 chapter feed is missing.');": "if (label == null || label.isEmpty) {\n      throw const FormatException('Ler 999 chapter feed is missing.');\n    }",
              "if (pages.isEmpty) throw const FormatException('Ler 999 chapter has no readable image pages.');": "if (pages.isEmpty) {\n      throw const FormatException('Ler 999 chapter has no readable image pages.');\n    }",
              "if (value == null || value < 1) throw ArgumentError.value(token, 'pageToken');": "if (value == null || value < 1) {\n    throw ArgumentError.value(token, 'pageToken');\n  }",
              'if (raw == null) return const [];': 'if (raw == null) {\n    return const [];\n  }',
              'final text = node?.text?.toString().trim();': 'final text = node?.text.trim();',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"ler999: expected replacement target not found: {old!r}")
              text = text.replace(old, new)
          p.write_text(text)
          PY

          dart format \
            lib/services/manga/providers/greenshit_manga_provider.dart \
            lib/services/manga/providers/kivaratoons_manga_provider.dart \
            lib/services/manga/providers/leitor_de_mangas_manga_provider.dart \
            lib/services/manga/providers/ler999_manga_provider.dart \
            lib/services/manga/providers/little_tyrant_manga_provider.dart \
            lib/services/manga/providers/mangalivre_org_manga_provider.dart >/dev/null
          git diff --check

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze repaired provider scope
        working-directory: private-source
        run: flutter analyze --no-pub lib/services/manga/providers lib/services/manga/manga_provider_definitions.dart test/services/manga/providers

      - name: Run all provider tests
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/providers

      - name: Commit and fast-forward push repairs
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          remote_url="https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/goanime-mobile.git"
          current_remote="$(git ls-remote "$remote_url" refs/heads/feature/manga-platform | cut -f1)"
          test "$current_remote" = "$EXPECTED_SHA"
          git add lib/services/manga/providers
          git config user.name "GoAnime Toolchains"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "fix(manga): stabilize current provider adapters" >/dev/null
          latest_remote="$(git ls-remote "$remote_url" refs/heads/feature/manga-platform | cut -f1)"
          test "$latest_remote" = "$EXPECTED_SHA"
          git push "$remote_url" HEAD:refs/heads/feature/manga-platform >/dev/null
          echo "pushed_sha=$(git rev-parse HEAD)"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
