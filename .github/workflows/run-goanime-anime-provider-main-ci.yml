name: Run pinned GoAnime main anime provider CI

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-anime-provider-main/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-anime-provider-main-ci
  cancel-in-progress: true

jobs:
  verify:
    name: Pin and verify GoAnime main
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime main once
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Pin resolved revision
        id: pin
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinned GoAnime main: $sha"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Precache Linux test engine
        shell: bash
        run: |
          set -euo pipefail
          flutter precache --linux
          flutter_bin="$(readlink -f "$(command -v flutter)")"
          flutter_root="$(cd "$(dirname "$flutter_bin")/.." && pwd)"
          flutter_tester="$flutter_root/bin/cache/artifacts/engine/linux-x64/flutter_tester"
          test -x "$flutter_tester"
          "$flutter_tester" --help >/dev/null

      - name: Resolve root dependencies
        working-directory: private-source
        shell: bash
        run: flutter pub get

      - name: Resolve goanime_core development dependencies
        working-directory: private-source/packages/goanime_core
        shell: bash
        run: dart pub get

      - name: Verify formatting
        id: formatting
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Analyze application and core library
        id: analyze_app
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: flutter analyze --no-pub lib test packages/goanime_core/lib

      - name: Analyze goanime_core tests
        id: analyze_core
        continue-on-error: true
        working-directory: private-source/packages/goanime_core
        shell: bash
        run: dart analyze lib test

      - name: Run Flutter tests
        id: flutter_tests
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ci-logs"
          flutter test --no-pub --concurrency=1 > "$GITHUB_WORKSPACE/ci-logs/flutter-test.log" 2>&1

      - name: Upload Flutter test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-test-${{ steps.pin.outputs.sha }}
          path: ci-logs/flutter-test.log
          if-no-files-found: ignore
          retention-days: 1

      - name: Run goanime_core tests
        id: core_tests
        continue-on-error: true
        working-directory: private-source/packages/goanime_core
        shell: bash
        run: dart test

      - name: Build Android debug APK
        id: android_build
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: flutter build apk --debug --no-pub

      - name: Report pinned revision
        if: always()
        shell: bash
        run: echo "GoAnime ref=${{ steps.pin.outputs.sha }}"

      - name: Enforce verification results
        if: always()
        shell: bash
        env:
          FORMATTING: ${{ steps.formatting.outcome }}
          ANALYZE_APP: ${{ steps.analyze_app.outcome }}
          ANALYZE_CORE: ${{ steps.analyze_core.outcome }}
          FLUTTER_TESTS: ${{ steps.flutter_tests.outcome }}
          CORE_TESTS: ${{ steps.core_tests.outcome }}
          ANDROID_BUILD: ${{ steps.android_build.outcome }}
        run: |
          set -euo pipefail
          failed=0
          check() {
            local name="$1"
            local outcome="$2"
            echo "$name=$outcome"
            if [[ "$outcome" != "success" ]]; then
              failed=1
            fi
          }
          check formatting "$FORMATTING"
          check analyze_app "$ANALYZE_APP"
          check analyze_core "$ANALYZE_CORE"
          check flutter_tests "$FLUTTER_TESTS"
          check core_tests "$CORE_TESTS"
          check android_build "$ANDROID_BUILD"
          exit "$failed"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/ci-logs"
