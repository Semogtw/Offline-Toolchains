name: GoAnime PR269 merge-on-main probe

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-pr269-rebase-probe/*.request'

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
      - id: request
        shell: bash
        run: |
          set -euo pipefail
          path="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-pr269-rebase-probe/*.request' | head -n1)"
          test -n "$path"
          read -r marker sha < "control/$path"
          test "$marker" = goanime-pr269
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Merge current main in working tree (no push)
        working-directory: source
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin main
          unset auth PRIVATE_TOKEN
          git -c user.name=ci-probe -c user.email=ci-probe@example.com merge -X theirs --no-commit --no-ff FETCH_HEAD
          test -z "$(git ls-files -u)"
          echo "Merge strategy: preserve branch changes unless exact conflict, where currently merged main wins"
          echo "Changed files from merged main:"
          git diff --cached --name-only
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Resolve dependencies
        working-directory: source
        run: |
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
      - name: Dart formatting check for integrated tree
        working-directory: source
        run: dart format --output=none --set-exit-if-changed lib test packages tools
      - name: Analyze integrated app
        working-directory: source
        run: flutter analyze --no-pub
      - name: Focused integrated search, browse and navigation tests
        working-directory: source
        run: |
          flutter test --no-pub --concurrency=1 \
            test/widgets/manga_manhastro/search_interaction_test.dart \
            test/widgets/manga_manhastro/shell_interaction_test.dart \
            test/widgets/manga_manhastro/favorites_features_test.dart \
            test/widgets/media_mode_navigation_test.dart \
            test/architecture/manhastro_search_chrome_source_contract_test.dart
