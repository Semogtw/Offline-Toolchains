name: Diagnose GoAnime manga audit privately

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-audit-diagnostic/*.request'

permissions:
  contents: read
jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Require token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - name: Checkout control
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - name: Resolve revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-audit-diagnostic/*.request' | head -n 1)"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1
      - name: Capture sanitized analyzer diagnostics
        id: analyze
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart analyze --format machine tools/manga/audit_planned_provider_stage.dart > /tmp/analyzer 2>/dev/null || true
          python3 - <<'PY' >/tmp/diagnostics.json
          import json
          from pathlib import Path
          rows=[]
          for line in Path('/tmp/analyzer').read_text().splitlines():
              parts=line.split('|')
              if len(parts) < 7: continue
              rows.append({
                  'severity': parts[0],
                  'type': parts[1],
                  'code': parts[2],
                  'line': int(parts[4]),
                  'column': int(parts[5]),
                  'length': int(parts[6]),
              })
          print(json.dumps(rows,separators=(',',':')))
          PY
          echo "diagnostics=$(cat /tmp/diagnostics.json)" >> "$GITHUB_OUTPUT"
      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" /tmp/analyzer /tmp/diagnostics.json
      - name: Publish sanitized diagnostics
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          DIAGNOSTICS: ${{ steps.analyze.outputs.diagnostics }}
        run: |
          set -euo pipefail
          diagnostics="${DIAGNOSTICS:-[]}"
          result="$(jq -cn --arg controlSha "$CONTROL_SHA" --arg reviewedSha "$REVIEWED_SHA" --argjson diagnostics "$diagnostics" '{schemaVersion:1,controlSha:$controlSha,reviewedSha:$reviewedSha,diagnostics:$diagnostics}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-audit-diagnostic/$CONTROL_SHA.json" -f message="ci(result): diagnose manga audit $CONTROL_SHA" -f content="$encoded"
