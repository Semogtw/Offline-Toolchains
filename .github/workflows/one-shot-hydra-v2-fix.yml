name: One-shot Hydra Drive V2 contract fix

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-fix.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hydra implementation branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact overview contract fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/services/cloud-save/google-drive/google-drive-v2-overview.ts")
          text = path.read_text()
          needle = """    available: connected,\n    gameRunning,\n    state,\n"""
          replacement = """    available: connected,\n    gameRunning,\n    environmentId:\n      localManifest?.environment.environmentId ??\n      anchor?.manifest.environment.environmentId ??\n      null,\n    state,\n"""
          if text.count(needle) != 1:
              raise SystemExit("expected overview return shape was not found exactly once")
          path.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Commit and push Hydra fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add src/main/services/cloud-save/google-drive/google-drive-v2-overview.ts
          if git diff --cached --quiet; then
            echo "No patch required"
            exit 0
          fi
          git commit -m "fix(cloud-save): include V2 environment in overview"
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot Toolchains files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-fix.yml" "triggers/one-shot-hydra-v2-fix.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            sha="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main" | jq -r '.sha')"
            body="$(jq -cn --arg message "ci: remove completed Hydra V2 one-shot patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null
          done
