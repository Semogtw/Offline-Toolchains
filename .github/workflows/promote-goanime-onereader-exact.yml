name: Promote GoAnime OneReader exact

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-onereader-promotion-exact/*.request'

permissions:
  actions: read
  contents: read

concurrency:
  group: goanime-onereader-promotion-exact
  cancel-in-progress: false

jobs:
  promote:
    name: Promote byte-certified OneReader exact SHA
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      REVIEWED_SHA: d5c4a47443653cac02e2e082ab686d388520669c
      BASE_SHA: e84e231ac7b5b8777a70732045e07cff8591713d
      TARGET_BRANCH: feat/manga-sources-yomu-flower-onereader-20260909
      FULL_GATE_RUN: '34434420131'
      CLASSIFICATION_RUN: '34436804275'
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted control state
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Require exact request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-onereader-promotion-exact/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = "$TARGET_BRANCH"
          test "$sha" = "$REVIEWED_SHA"

      - name: Require exact live and full-gate receipts
        shell: bash
        run: |
          set -euo pipefail
          live="control/results/goanime-manga-next-source-wave/$REVIEWED_SHA.json"
          full="control/results/goanime-manga-full-flutter-exact/$REVIEWED_SHA.json"
          test -f "$live"
          test -f "$full"
          jq -e '.goanimeSha == env.REVIEWED_SHA' "$live" >/dev/null
          jq -e '.oneReader | contains("search_1_results=24") and contains("details=success") and contains("chapters=success") and contains("chapter_count=14") and contains("content_1_hosts=b2.onereader.net") and contains("transport_1=success") and contains("verifier=success") and contains("terminal=readable")' "$live" >/dev/null
          jq -e '.yomu | contains("status=502") and contains("terminal=no_search_result")' "$live" >/dev/null
          jq -e '.flowerManga | contains("status=403") and contains("terminal=no_search_result")' "$live" >/dev/null
          jq -e '.goanimeSha == env.REVIEWED_SHA and .flutterAnalyze == "success" and .flutterTests == "failure" and .coreTests == "skipped"' "$full" >/dev/null

      - name: Require classified base-failure and independent core evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/feature evidence/base evidence/core
          artifacts="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CLASSIFICATION_RUN/artifacts")"
          feature_id="$(jq -r '.artifacts[] | select(.name == "focused-feature-d5c4a47") | .id' <<<"$artifacts")"
          base_id="$(jq -r '.artifacts[] | select(.name == "focused-base-e84e231") | .id' <<<"$artifacts")"
          core_id="$(jq -r '.artifacts[] | select(.name == "goanime-core-d5c4a47") | .id' <<<"$artifacts")"
          test -n "$feature_id" && test "$feature_id" != null
          test -n "$base_id" && test "$base_id" != null
          test -n "$core_id" && test "$core_id" != null
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$feature_id/zip" > evidence/feature.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$base_id/zip" > evidence/base.zip
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$core_id/zip" > evidence/core.zip
          unzip -q evidence/feature.zip -d evidence/feature
          unzip -q evidence/base.zip -d evidence/base
          unzip -q evidence/core.zip -d evidence/core
          feature="$(cat evidence/feature/focused-feature-d5c4a47.txt)"
          base="$(cat evidence/base/focused-base-e84e231.txt)"
          core="$(cat evidence/core/core-d5c4a47.txt)"
          grep -F "sha=$REVIEWED_SHA" <<<"$feature"
          grep -F 'exit_code=1' <<<"$feature"
          grep -F 'Expected: <9139>' <<<"$feature"
          grep -F 'Actual: <6508>' <<<"$feature"
          grep -F "sha=$BASE_SHA" <<<"$base"
          grep -F 'exit_code=1' <<<"$base"
          grep -F 'Expected: <9139>' <<<"$base"
          grep -F 'Actual: <6508>' <<<"$base"
          grep -F "sha=$REVIEWED_SHA" <<<"$core"
          grep -F 'exit_code=0' <<<"$core"
          grep -F 'All tests passed!' <<<"$core"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.REVIEWED_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify branch still points to reviewed SHA
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$REVIEWED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$REVIEWED_SHA"

      - name: Apply reviewed rollout state
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          reviewed_sha = os.environ['REVIEWED_SHA']
          base_sha = os.environ['BASE_SHA']
          full_run = os.environ['FULL_GATE_RUN']
          classification_run = os.environ['CLASSIFICATION_RUN']
          verified_at = datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00', 'Z')

          manifest_path = Path('docs/manga_sources_ptbr.json')
          manifest = json.loads(manifest_path.read_text())
          records = manifest.get('providerRecords')
          if not isinstance(records, list):
              raise SystemExit('providerRecords is not a list')
          by_id = {r.get('goanimeSourceId'): r for r in records if isinstance(r, dict) and isinstance(r.get('goanimeSourceId'), str)}

          candidates = [
              {
                  'sourceName': 'Yomu Mangás', 'goanimeSourceId': 'ptbr.yomu',
                  'policyState': 'allowed', 'implementationState': 'planned',
                  'requiresAuth': False, 'requiresBrowser': False,
                  'supportedContentKinds': ['imageSequence'], 'engine': 'headless_json_api',
                  'sourceSafetyAudit': {'state': 'reviewed', 'reviewedAt': '2026-09-09', 'primaryPurposeExplicitAdult': False, 'upstreamContentWarning': 'MIXED', 'evidence': ['Current upstream exposes a headless JSON API without browser session or request signing.', 'MIXED catalog remains policy-allowed but runtime authorization still requires live readability.']},
                  'rolloutNotes': ['Adapter and deterministic contracts exist.', 'Exact live validation on 2026-09-10 returned HTTP 502 from yomu.tauruus.com before any catalog result.', 'Keep planned and outside defaultEnabledMangaSourceIds until a fresh exact-SHA search-to-bytes proof succeeds.'],
              },
              {
                  'sourceName': 'FlowerManga.net', 'goanimeSourceId': 'ptbr.flowermanga',
                  'policyState': 'allowed', 'implementationState': 'planned',
                  'requiresAuth': False, 'requiresBrowser': False,
                  'supportedContentKinds': ['imageSequence'], 'engine': 'madara_html',
                  'sourceSafetyAudit': {'state': 'reviewed', 'reviewedAt': '2026-09-09', 'primaryPurposeExplicitAdult': False, 'upstreamContentWarning': 'MIXED', 'evidence': ['Current upstream follows Madara and the adapter reuses the shared headless parser.', 'MIXED catalog remains policy-allowed but runtime authorization still requires live readability.']},
                  'rolloutNotes': ['Adapter and deterministic contracts exist.', 'Exact live validation on 2026-09-10 returned HTTP 403 from flowermangas.net in the normal GoAnime HTTP client.', 'Keep planned and outside defaultEnabledMangaSourceIds; do not add an anti-bot bypass merely to satisfy CI.'],
              },
              {
                  'sourceName': 'OneReader', 'goanimeSourceId': 'ptbr.onereader',
                  'policyState': 'allowed', 'implementationState': 'enabled',
                  'rolloutGates': {'fixtureContractPassed': True, 'liveReadabilityPassed': True, 'byteProbePassed': True, 'verifiedAt': verified_at, 'providerSetVersion': reviewed_sha},
                  'requiresAuth': False, 'requiresBrowser': False,
                  'supportedContentKinds': ['imageSequence'], 'engine': 'headless_json_api',
                  'sourceSafetyAudit': {'state': 'reviewed', 'reviewedAt': '2026-09-09', 'primaryPurposeExplicitAdult': False, 'upstreamContentWarning': 'MIXED', 'evidence': ['Search uses role=standard and the API exposes search, metadata, chapters and pages without WebView or signing.', 'Exact live validation reached a real imageSequence on b2.onereader.net and verified downloaded bytes.']},
                  'rolloutNotes': ['Exact live validation: 24 search results -> details -> 14 chapters -> imageSequence -> transport success -> verifier success -> terminal=readable.', f'Full exact run {full_run}: flutter analyze passed; the root Flutter suite stopped at a title-availability SQLite mismatch (9139 expected vs 6508 actual).', f'Classification run {classification_run} reproduced that same mismatch on reviewed SHA {reviewed_sha} and base {base_sha}; it is preexisting base debt, not a provider-wave regression or flake. Independent goanime_core suite passed 181 tests on the reviewed SHA.'],
              },
          ]
          for candidate in candidates:
              existing = by_id.get(candidate['goanimeSourceId'])
              if existing is None:
                  records.append(candidate)
              else:
                  existing.clear(); existing.update(candidate)
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n')

          defaults_path = Path('lib/services/manga/default_manga_source_providers.dart')
          defaults = defaults_path.read_text()
          line = "  'ptbr.onereader',\n"
          if line in defaults:
              raise SystemExit('OneReader already default-enabled')
          anchor = "  'ptbr.ninjascan',\n};\n"
          if anchor not in defaults:
              raise SystemExit('default provider anchor changed')
          defaults_path.write_text(defaults.replace(anchor, "  'ptbr.ninjascan',\n" + line + "};\n", 1))

          test_path = Path('test/architecture/manga_next_source_wave_registry_test.dart')
          test_text = test_path.read_text()
          old = """  test('next source wave is registered but not default-enabled', () {\n    final definitionIds = releaseCandidateMangaProviderDefinitions\n        .map((definition) => definition.sourceId)\n        .toSet();\n\n    expect(definitionIds, containsAll(candidateIds));\n    expect(defaultEnabledMangaSourceIds.intersection(candidateIds), isEmpty);\n  });\n"""
          new = """  test('next source wave only authorizes byte-certified OneReader', () {\n    final definitionIds = releaseCandidateMangaProviderDefinitions\n        .map((definition) => definition.sourceId)\n        .toSet();\n\n    expect(definitionIds, containsAll(candidateIds));\n    expect(defaultEnabledMangaSourceIds, contains(OneReaderMangaProvider.sourceIdValue));\n    expect(\n      defaultEnabledMangaSourceIds.intersection(<String>{\n        YomuMangaProvider.sourceIdValue,\n        FlowerMangaMangaProvider.sourceIdValue,\n      }),\n      isEmpty,\n    );\n  });\n"""
          if old not in test_text:
              raise SystemExit('next-source-wave rollout test baseline changed')
          test_path.write_text(test_text.replace(old, new, 1))

          audit_path = Path('docs/manga_provider_expansion_audit_2026-09-09.md')
          audit = audit_path.read_text()
          marker = '## Validation checkpoint — 2026-09-10'
          if marker in audit:
              raise SystemExit('validation checkpoint already present')
          audit += f'''\n\n{marker}\n\n- Reviewed SHA: `{reviewed_sha}`; protected historical source SHA `f71a6d91ceccfa09addb84ed264a3bbee4c7f796` remains unchanged.\n- OneReader completed search (24) -> details -> chapters (14) -> imageSequence (`b2.onereader.net`) -> real byte transport -> verifier -> `terminal=readable`.\n- Yomu remains `planned`: HTTP 502 before search results. FlowerManga remains `planned`: HTTP 403 before search results. Nox remains deferred behind HTTP 403 before signer/session establishment. SlimeRead remains deferred after transport failure.\n- Full exact run `{full_run}` passed `flutter analyze` but the root Flutter suite failed at `title_availability_database_service_test.dart`: 9139 expected vs 6508 bundled SQLite rows; core was skipped by fail-fast.\n- Classification run `{classification_run}` reproduced the exact 9139/6508 mismatch on both `{reviewed_sha}` and base `{base_sha}`, proving preexisting base debt rather than a branch regression or flake. The independent `packages/goanime_core` suite passed 181 tests on `{reviewed_sha}`.\n\nFormal rollout decision: **promote only `ptbr.onereader`**. The unrelated base suite debt is recorded rather than weakened or fixed in this provider branch.\n'''
          audit_path.write_text(audit)

          rollout_path = Path('docs/manga_provider_rollout_status.md')
          rollout = rollout_path.read_text()
          heading = '# Manga provider rollout status\n'
          if not rollout.startswith(heading) or '<!-- current-2026-09-10:start -->' in rollout:
              raise SystemExit('rollout status baseline changed')
          checkpoint = f'''\n<!-- current-2026-09-10:start -->\n## Checkpoint mais recente — 2026-09-10\n\n- Branch: `feat/manga-sources-yomu-flower-onereader-20260909`; reviewed pre-promotion SHA `{reviewed_sha}`.\n- Runtime autorizado neste checkpoint: **19 providers**, adicionando somente `ptbr.onereader`.\n- OneReader: 24 search results -> details -> 14 chapters -> imageSequence on `b2.onereader.net` -> byte transport/verifier success -> `terminal=readable`.\n- Yomu `planned` (HTTP 502 before search); FlowerManga `planned` (HTTP 403 before search); Nox deferred (403 before signer/session); SlimeRead deferred (transport failure).\n- Full run `{full_run}`: analyzer success; root Flutter suite blocked by preexisting title-availability SQLite mismatch. Classification run `{classification_run}` reproduced it identically on feature/base; independent core: 181 passed.\n\nThis block supersedes older operational provider counts below; historical receipts remain preserved.\n<!-- current-2026-09-10:end -->\n'''
          rollout_path.write_text(heading + checkpoint + rollout[len(heading):])

          receipt_path = Path('docs/manga_provider_expansion_receipt_2026-09-10.md')
          if receipt_path.exists():
              raise SystemExit('expansion receipt already exists')
          receipt_path.write_text(f'''# Manga provider expansion receipt — 2026-09-10\n\n- Branch: `feat/manga-sources-yomu-flower-onereader-20260909`\n- Reviewed pre-promotion SHA: `{reviewed_sha}`\n- Base used for regression classification: `{base_sha}`\n- Protected historical source SHA: `f71a6d91ceccfa09addb84ed264a3bbee4c7f796` (unchanged)\n- Live receipt: `Semogtw/Offline-Toolchains/results/goanime-manga-next-source-wave/{reviewed_sha}.json`\n- Full exact run: `{full_run}` — analyze success; Flutter suite failure; core skipped\n- Classification/core run: `{classification_run}` — same 9139/6508 title-cache mismatch on feature and base; independent core 181 passed\n\n## Decision\n\n| Source | Real readability evidence | Runtime decision |\n| --- | --- | --- |\n| OneReader (`ptbr.onereader`) | search -> metadata -> 14 chapters -> page manifest -> real bytes -> verifier success | **enabled** |\n| Yomu (`ptbr.yomu`) | HTTP 502 before catalog | planned / blocked |\n| FlowerManga (`ptbr.flowermanga`) | HTTP 403 before catalog | planned / blocked |\n| NoxManga | HTTP 403 before signer/session | deferred / blocked |\n| SlimeRead | transport failure before catalog | deferred / blocked |\n\nThe root Flutter-suite failure is not waived: it is documented as preexisting base debt after exact feature/base reproduction. No branch-specific regression was identified.\n''')
          PY
          python3 -m json.tool docs/manga_sources_ptbr.json >/dev/null
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: |
          flutter pub get >/dev/null 2>&1
          (cd packages/goanime_core && dart pub get >/dev/null 2>&1)

      - name: Validate promoted state
        working-directory: private-source
        run: |
          dart format --output=none --set-exit-if-changed lib/services/manga/default_manga_source_providers.dart test/architecture/manga_next_source_wave_registry_test.dart
          flutter analyze --no-pub
          flutter test --no-pub -r compact \
            test/services/manga/providers/manga_next_source_wave_test.dart \
            test/architecture/manga_next_source_wave_registry_test.dart \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_production_catalog_fail_closed_test.dart \
            test/services/manga/manga_runtime_availability_source_test.dart

      - name: Commit and push exact fast-forward
        id: push
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git config user.name 'GoAnime Offline Toolchains'
          git config user.email 'goanime-offline-toolchains@users.noreply.github.com'
          git add \
            lib/services/manga/default_manga_source_providers.dart \
            test/architecture/manga_next_source_wave_registry_test.dart \
            docs/manga_sources_ptbr.json \
            docs/manga_provider_expansion_audit_2026-09-09.md \
            docs/manga_provider_rollout_status.md \
            docs/manga_provider_expansion_receipt_2026-09-10.md
          git diff --cached --check
          git commit -m 'feat(manga): promote byte-certified OneReader'
          new_sha="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$REVIEWED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          before="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$before" = "$REVIEWED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          after="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$after" = "$new_sha"
          printf 'new_sha=%s\n' "$new_sha" >> "$GITHUB_OUTPUT"
          printf '{"reviewedSha":"%s","newSha":"%s","branch":"%s","oneReader":"enabled","yomu":"planned-502","flower":"planned-403","nox":"deferred-403","slimeRead":"deferred-transport","fullGateRun":"%s","classificationRun":"%s"}\n' "$REVIEWED_SHA" "$new_sha" "$TARGET_BRANCH" "$FULL_GATE_RUN" "$CLASSIFICATION_RUN" > ../promotion-result.json

      - name: Upload promotion receipt
        uses: actions/upload-artifact@v4
        with:
          name: goanime-onereader-promotion-${{ steps.push.outputs.new_sha }}
          path: promotion-result.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
