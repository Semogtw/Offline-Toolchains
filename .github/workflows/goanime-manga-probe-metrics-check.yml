name: GoAnime Manga Probe Metrics Fixture Fix

on:
  push:
    paths:
      - '.github/workflows/goanime-manga-probe-metrics-check.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require GoAnime write token
        shell: bash
        env:
          GOANIME_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$GOANIME_WRITE_TOKEN"

      - name: Checkout isolated GoAnime branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: agent/manga-provider-probe-metrics-20260908
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Repair legacy readability fixture
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/tools/build_global_manga_availability_test.dart')
          text = path.read_text(encoding='utf-8')
          old = "      'providers': <Object?>[],\n"
          new = """      'providers': <Object?>[
            <String, Object?>{
              'sourceId': 'ptbr.astratoons',
              'attempted': 2,
              'promoted': 1,
              'skipped': 3,
              'inconclusive': 1,
              'failed': 0,
              'expired': 1,
            },
          ],
          """
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one legacy providers fixture, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          dart format test/tools/build_global_manga_availability_test.dart
          git diff --check

      - name: Publish fixture correction
        working-directory: private-source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          path='test/tools/build_global_manga_availability_test.dart'
          current_sha="$(gh api "repos/Semogtw/goanime-mobile/contents/$path?ref=agent/manga-provider-probe-metrics-20260908" --jq .sha)"
          encoded="$(base64 -w0 "$path")"
          gh api --method PUT "repos/Semogtw/goanime-mobile/contents/$path" \
            -f message='test(manga): align builder fixture with provider probe metrics' \
            -f content="$encoded" \
            -f sha="$current_sha" \
            -f branch='agent/manga-provider-probe-metrics-20260908' >/dev/null
