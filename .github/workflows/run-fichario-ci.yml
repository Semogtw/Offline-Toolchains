name: Run Fichario CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact branch, tag, or commit; empty uses main
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Request private project CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: fichario-ci-${{ github.event_name }}-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  normalize:
    name: Normalize trusted Fichario request
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'build/private-ci' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.actor.login == github.repository_owner &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      project: ${{ steps.request.outputs.project }}
      ref: ${{ steps.request.outputs.ref }}

    steps:
      - name: Require owner for direct dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$ACTOR" = "$OWNER"

      - name: Checkout trusted request validator
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false
          sparse-checkout: scripts/private_ci_request.py
          sparse-checkout-cone-mode: false

      - name: Checkout connector request revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/private-ci.json
          sparse-checkout-cone-mode: false

      - name: Normalize request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            request_file="request-source/triggers/private-ci.json"
          else
            request_file="$RUNNER_TEMP/fichario-ci-request.json"
            python3 - "$request_file" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump({"project": "fichario", "ref": os.environ.get("INPUT_REF", "")}, stream)
          PY
          fi

          normalized="$(python3 trusted-source/scripts/private_ci_request.py "$request_file")"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          request = json.loads(sys.argv[1])
          output_path = sys.argv[2]
          if request["repository"] != "Semogtw/FicharioVirtual":
              raise SystemExit("unexpected repository mapping")
          with open(output_path, "a", encoding="utf-8") as stream:
              for key in ("project", "ref"):
                  value = request[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe newline in normalized {key}")
                  stream.write(f"{key}={value}\n")
          PY

  verify:
    name: Fichário Virtual complete verification
    needs: normalize
    if: needs.normalize.outputs.project == 'fichario'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout public Fichario source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: ${{ needs.normalize.outputs.ref }}
          path: public-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Record resolved commit
        id: source
        shell: bash
        run: echo "sha=$(git -C public-source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm 10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          check-latest: false

      - name: Install frozen dependencies
        working-directory: public-source
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with host dependencies
        working-directory: public-source
        run: pnpm exec playwright install --with-deps chromium

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Run complete verification
        working-directory: public-source
        run: pnpm verify:full

      - name: Print formatting patch after failure
        if: failure()
        working-directory: public-source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write . >/dev/null
          if git diff --quiet -- .; then
            echo "No Prettier formatting diff was produced."
          else
            echo "::group::Prettier formatting patch"
            git diff --no-ext-diff --no-color -- .
            echo "::endgroup::"
          fi

      - name: Remove public checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/public-source"

      - name: Summarize result
        if: always()
        shell: bash
        env:
          REQUESTED_REF: ${{ needs.normalize.outputs.ref }}
          RESOLVED_SHA: ${{ steps.source.outputs.sha }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Fichario Virtual public-runner CI"
            echo
            echo "- Requested ref: \`$REQUESTED_REF\`"
            echo "- Resolved commit: \`${RESOLVED_SHA:-unresolved}\`"
            echo "- Result: \`$RESULT\`"
            echo "- Build outputs were verified and discarded; no private artifact was uploaded."
          } >> "$GITHUB_STEP_SUMMARY"
