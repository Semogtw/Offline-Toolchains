name: Fix GoAnime manga materializer provider gate

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-materializer-provider-gate-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-materializer-provider-gate-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Diagnose branch-provider materializer RED
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Diagnose exact-SHA materializer provider RED
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: bash scripts/diagnose-goanime-manga-materializer-provider-gate-red.sh
