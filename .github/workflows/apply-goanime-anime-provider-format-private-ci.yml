name: Prepare GoAnime anime provider formatting privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-anime-provider-format/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-anime-provider-format-private-ci
  cancel-in-progress: false

jobs:
  format:
    name: GoAnime anime provider formatter
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-anime-provider-format/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = "goanime"
          test "$branch" = "main"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format exact private revision
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test packages tools >/dev/null
          git diff --check

          work="$RUNNER_TEMP/goanime-anime-provider-format"
          mkdir -p "$work"
          git diff --name-only -- lib test packages tools > "$work/files.txt"
          if test ! -s "$work/files.txt"; then
            printf '%s\n' 'none' > "$work/files.txt"
            mkdir -p "$work/empty"
            printf '%s\n' 'No formatting changes required.' > "$work/empty/README.txt"
            tar -czf "$work/formatted-files.tar.gz" -C "$work/empty" README.txt
          else
            tar -czf "$work/formatted-files.tar.gz" -T "$work/files.txt"
          fi
          printf '%s\n' '${{ steps.request.outputs.sha }}' > "$work/source-ref.txt"

      - name: Encrypt formatted bundle
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-anime-provider-format"
          export GNUPGHOME="$work/gpg"
          mkdir -p "$GNUPGHOME" "$work/out"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import "$GITHUB_WORKSPACE/toolchain-control/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$work/out/formatted-files.tar.gz.gpg" --encrypt "$work/formatted-files.tar.gz"
          cp "$work/files.txt" "$work/out/files.txt"
          cp "$work/source-ref.txt" "$work/out/source-ref.txt"
          sha256sum "$work/formatted-files.tar.gz" > "$work/out/formatted-files.tar.gz.sha256"

      - name: Upload encrypted formatting handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-anime-provider-format-encrypted
          path: ${{ runner.temp }}/goanime-anime-provider-format/out
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control" "$RUNNER_TEMP/goanime-anime-provider-format"
