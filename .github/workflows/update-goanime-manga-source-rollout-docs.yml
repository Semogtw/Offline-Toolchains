name: Update GoAnime manga source rollout docs

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-source-docs/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-source-docs
  cancel-in-progress: false

jobs:
  update:
    name: Update manga rollout documentation
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-source-docs/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify branch still points to reviewed SHA
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Update current-state documentation
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          sha = '39993790a0f4ab99c2937ffca6ecb62d87ff1925'
          upstream = '16df97717c304c3f1e309c81acdceaeab5b51314'

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1))

          # Provider rollout owner: update current metadata/cohort and preserve old receipts as historical evidence.
          path = Path('docs/manga_provider_rollout_status.md')
          text = path.read_text()
          old = """> **Status: Atual.** Este documento registra autorização runtime, evidence observada, blockers e a ordem de retomada do rollout. P0/P1 de produto estão fechados; a próxima ação é a auditoria incremental de providers, mantendo bloqueios externos e coleta fresca explícitos.\n\n**Atualizado em:** 2026-08-24  \n**Branch:** `codex/manga-parity-20260823`  \n**Checkpoint provider certificado:** `2e2ce59ad587af673ef4f7815f4a4e36e203fa14`\n**Checkpoint de produto atual:** `5ad900d9f09b0b2abdaff22583dd76f9cdd8152e`\n**Full-CI certificado:** `abcbb0fbf7590ec8243ec4119d32f4b84ae66940`, run `32798443840` attempt 1, job `97654476174`, publisher `97657379469`.\n"""
          new = f"""> **Status: Atual.** Este documento registra autorização runtime, evidência observada, blockers e a ordem de retomada do rollout. Receipts antigos permanecem abaixo como evidência histórica e não substituem o gate exato mais recente.\n\n**Atualizado em:** 2026-08-28  \n**Branch:** `feat/manga-sources-mangadex-taimu-manhastro-20260828`  \n**Checkpoint de promoção atual:** `{sha}`  \n**Keiyoushi auditado:** `{upstream}`\n**Full-CI branch-wide anterior:** `abcbb0fbf7590ec8243ec4119d32f4b84ae66940`, run `32798443840` attempt 1, job `97654476174`, publisher `97657379469`.\n"""
          if old not in text:
              raise SystemExit('rollout status header changed')
          text = text.replace(old, new, 1)

          old = """`defaultEnabledMangaSourceIds` autoriza atualmente **16** fontes e `buildDefaultMangaSourceRegistry` constrói os providers com HTTP clients vinculados à policy:\n\n- Arthur Scan — `ptbr.arthurscan`;\n- Astratoons — `ptbr.astratoons`;\n- Capitoons — `ptbr.capitoons`;\n- HQ Now! — `ptbr.hqnow`;\n- Hipertoon — `ptbr.hipertoon`;\n- Kami Sama Explorer — `ptbr.kamisamaexplorer`;\n- KivaraToons — `ptbr.kivaratoons`;\n- Leitura Mangá — `ptbr.leituramanga`;\n- Ler 999 — `ptbr.ler999`;\n- Little Tyrant — `ptbr.littletyrant`;\n- Maid Scan — `ptbr.maidscan`;\n- MangaDash — `ptbr.mangadash`;\n- MangaFlix — `ptbr.mangaflix`;\n- Manga Livre Blog — `ptbr.mangalivreblog`;\n- MangaLivre.org — `ptbr.mangalivreorg`;\n- Ninja Scan — `ptbr.ninjascan`.\n"""
          new = """`defaultEnabledMangaSourceIds` autoriza atualmente **18** fontes e `buildDefaultMangaSourceRegistry` constrói os providers com HTTP clients vinculados à policy:\n\n- Arthur Scan — `ptbr.arthurscan`;\n- Astratoons — `ptbr.astratoons`;\n- Capitoons — `ptbr.capitoons`;\n- HQ Now! — `ptbr.hqnow`;\n- Hipertoon — `ptbr.hipertoon`;\n- Kami Sama Explorer — `ptbr.kamisamaexplorer`;\n- KivaraToons — `ptbr.kivaratoons`;\n- Leitura Mangá — `ptbr.leituramanga`;\n- Ler 999 — `ptbr.ler999`;\n- Little Tyrant — `ptbr.littletyrant`;\n- Maid Scan — `ptbr.maidscan`;\n- MangaDash — `ptbr.mangadash`;\n- **MangaDex PT-BR — `ptbr.mangadex`;**\n- MangaFlix — `ptbr.mangaflix`;\n- Manga Livre Blog — `ptbr.mangalivreblog`;\n- MangaLivre.org — `ptbr.mangalivreorg`;\n- **Manhastro — `ptbr.manhastro`;**\n- Ninja Scan — `ptbr.ninjascan`.\n\n`ptbr.taimumangas` está implementada e com fixtures verdes, mas permanece `planned` e fora do runtime padrão porque o gate live de 2026-08-28 recebeu HTTP 522/523 de `apiv2.taimumangas.com` antes de obter resultados.\n\nO snapshot PT-BR do inventário continua **114 inventariadas / 98 permitidas / 16 excluídas**. MangaDex vive em `src/all/mangadex`, fora desse snapshot `src/pt`, e por isso é rastreada separadamente em `externalProviderSourceNames` sem adulterar o accounting histórico.\n"""
          if old not in text:
              raise SystemExit('rollout runtime block changed')
          text = text.replace(old, new, 1)

          marker = "## Checkpoint atual de comportamento upstream — 2026-08-24\n"
          replacement = f"""## Checkpoint atual de comportamento upstream — 2026-08-28\n\nO gate de promoção do exact-SHA `{sha}` auditou o cohort já proposto contra `keiyoushi/extensions-source@{upstream}`. O resultado foi:\n\n```text\nenabledProviders=18\nbehaviorPins=19\nclean=18\nreview-needed=0\ncritical=0\nuntracked=0\n```\n\nHá 19 pins porque Taimu permanece `planned`, mas já está pinada para que uma futura repetição do gate detecte drift antes de habilitá-la. Os 18 providers runtime ficaram `clean`; nenhum pin antigo foi renovado cegamente.\n\n### Promoção exact-SHA — MangaDex e Manhastro\n\nNo mesmo gate de promoção, os testes de accounting/registry passaram **14/14**, os adapters das três candidatas passaram **12/12** e `flutter analyze` reportou zero issues. Antes do commit e do fast-forward, os dois providers promovidos foram novamente verificados pelo caminho real `search → details → chapters → manifest → bytes`:\n\n```text\nMangaDex: search=24, chapters=36, content=imageSequence, transport=success, terminal=readable\nManhastro: search=29, chapters=136, content=imageSequence, transport=success, terminal=readable\n```\n\nA Manhastro também passou a auditoria de segurança do catálogo atual: 100 obras observadas, 2 ocorrências com marcadores explícitos (2,0%) e 0/12 detalhes da amostra com marcadores explícitos. Isso sustenta a classificação de fonte não-adult-primary exigida pela policy, apesar do warning upstream `NSFW // or MIXED`.\n\n## Checkpoint anterior de comportamento upstream — 2026-08-24\n"""
          if marker not in text:
              raise SystemExit('rollout drift marker changed')
          text = text.replace(marker, replacement, 1)
          text = text.replace('Os **16 providers habilitados possuem pin de comportamento explícito**', 'Naquele checkpoint, os **16 providers habilitados possuíam pin de comportamento explícito**', 1)
          text = text.replace('O monitor automático de drift roda a cada 6 horas e o gate manual exige `behaviorPins == enabledProviders`.', 'O monitor automático de drift roda a cada 6 horas. O gate atual exige cobertura completa dos habilitados; pins adicionais de candidates `planned` são permitidos para detectar drift antes da promoção.', 1)
          text = text.replace('## Static exact do cohort atual — verde', '## Static exact do cohort anterior — histórico verde', 1)
          path.write_text(text)

          # PT-BR audit owner.
          path = Path('docs/manga_ptbr_provider_audit.md')
          text = path.read_text()
          text = text.replace('**Atualizado em:** 2026-08-24\n**Branch:** `codex/manga-parity-20260823`\n**Checkpoint static exact:** `4df81135ab64acccd2042c3006cf77f20f470976`', f'**Atualizado em:** 2026-08-28\n**Branch:** `feat/manga-sources-mangadex-taimu-manhastro-20260828`\n**Checkpoint de promoção:** `{sha}`', 1)
          text = text.replace('O runtime padrão autoriza **16** providers:', 'O runtime padrão autoriza **18** providers:', 1)
          text = text.replace('| MangaDash | `ptbr.mangadash` |\n| MangaFlix | `ptbr.mangaflix` |', '| MangaDash | `ptbr.mangadash` |\n| **MangaDex PT-BR** | `ptbr.mangadex` |\n| MangaFlix | `ptbr.mangaflix` |', 1)
          text = text.replace('| MangaLivre.org | `ptbr.mangalivreorg` |\n| Ninja Scan | `ptbr.ninjascan` |', '| MangaLivre.org | `ptbr.mangalivreorg` |\n| **Manhastro** | `ptbr.manhastro` |\n| Ninja Scan | `ptbr.ninjascan` |', 1)
          anchor = 'Esses IDs estão em `lib/services/manga/default_manga_source_providers.dart` e são construídos por `buildDefaultMangaSourceRegistry` com HTTP clients ligados à policy.\n'
          add = anchor + '\n`ptbr.taimumangas` está `planned`: implementação/fixtures prontas, mas HTTP 522/523 no endpoint live impediu search e byte proof. MangaDex é provider externo ao snapshot `src/pt`; `externalProviderSourceNames` preserva o baseline 114/98/16 sem misturar accounting de inventário com autorização runtime.\n'
          if anchor not in text:
              raise SystemExit('ptbr audit cohort anchor changed')
          text = text.replace(anchor, add, 1)
          start = text.index('## Behavior drift contra Keiyoushi — 16/16 clean')
          end = text.index('## Static exact — verde', start)
          current = f"""## Behavior drift contra Keiyoushi — 18/18 clean\n\nO gate exact-SHA `{sha}` auditou `extensions-source@{upstream}` depois de aplicar o cohort proposto:\n\n```text\nenabledProviders=18\nbehaviorPins=19\nclean=18\nreview-needed=0\ncritical=0\nuntracked=0\n```\n\nO pin adicional é `ptbr.taimumangas`, ainda `planned`, para detectar alterações upstream antes de uma futura promoção. MangaDex e Manhastro foram re-probadas até bytes imediatamente antes do commit: ambas terminaram `terminal=readable`.\n\nA Manhastro foi auditada também quanto à policy: 2/100 ocorrências do catálogo atual bateram marcadores explícitos (2,0%), enquanto a amostra de 12 detalhes teve zero marcadores; portanto o catálogo observado não é adult-primary.\n\n"""
          text = text[:start] + current + text[end:]
          text = text.replace('## Static exact — verde', '## Static exact anterior — histórico verde', 1)
          text = text.replace('## Live byte matrix — 14/16 readable, 2 bloqueios externos', '## Live byte matrix do cohort anterior — 14/16 readable, 2 bloqueios externos', 1)
          path.write_text(text)

          # Architecture overview: only current-state sentence/date.
          replace_once('docs/manga_source_aggregation.md', '**Última atualização:** 2026-08-24', '**Última atualização:** 2026-08-28')
          replace_once('docs/manga_source_aggregation.md', 'Atualmente existem 16 sources habilitadas no manifest/registry. O último gate live completo observado ainda cobriu 9/9; status/planned/blocked ficam em `manga_provider_rollout_status.md`.', 'Atualmente existem **18 sources habilitadas** no manifest/registry. MangaDex PT-BR e Manhastro foram promovidas no exact-SHA `39993790a0f4ab99c2937ffca6ecb62d87ff1925` após fixtures, accounting/registry, drift e byte probes verdes; Taimu permanece `planned` por HTTP 522/523 upstream. Status/planned/blocked ficam em `manga_provider_rollout_status.md`.')

          # AI routing guide: avoid stale branch identity and stale cohort count.
          replace_once('README_AI.md', 'A linha de desenvolvimento ativa desta documentação é `codex/manga-parity-20260823`. Ela contém o runtime funcional de Mangá e a consolidação da infraestrutura compartilhada Anime ↔ Mangá. A `main` continua sendo um alvo de integração separado até merge explícito; um commit mais novo em outra branch nunca deve ser atribuído automaticamente ao checkout atual.', 'O estado documentado de Mangá inclui a promoção de providers no checkpoint `39993790a0f4ab99c2937ffca6ecb62d87ff1925` da branch `feat/manga-sources-mangadex-taimu-manhastro-20260828`. A branch efetivamente em checkout continua sendo a autoridade para qualquer tarefa; um commit mais novo em outra branch nunca deve ser atribuído automaticamente ao checkout atual.')
          replace_once('README_AI.md', 'O cohort runtime atual autoriza 16 providers de Mangá; o último gate live completo observado cobriu 9/9, sem transformar esse resultado histórico em certificação atual.', 'O cohort runtime documentado autoriza **18 providers de Mangá**. O checkpoint de promoção `39993790a0f4ab99c2937ffca6ecb62d87ff1925` revalidou MangaDex PT-BR e Manhastro até bytes reais; Taimu permanece `planned` por indisponibilidade HTTP 522/523 upstream. A fonte de verdade continua sendo `defaultEnabledMangaSourceIds`, não esta contagem textual.')
          replace_once('README_AI.md', 'Não há promoção automática de provider durante a rodada atual de paridade funcional.', 'Provider novo nunca é promovido apenas por existir no código: autorização exige manifest/policy, fixtures, drift e evidência live/readability conforme o gate de rollout.')
          PY

      - name: Verify docs diff sanity
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'autoriza atualmente \*\*18\*\* fontes' docs/manga_provider_rollout_status.md
          grep -q 'runtime padrão autoriza \*\*18\*\* providers' docs/manga_ptbr_provider_audit.md
          grep -q 'existem \*\*18 sources habilitadas\*\*' docs/manga_source_aggregation.md
          grep -q 'autoriza \*\*18 providers de Mangá\*\*' README_AI.md
          grep -q 'enabledProviders=18' docs/manga_provider_rollout_status.md
          grep -q 'behaviorPins=19' docs/manga_ptbr_provider_audit.md

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Run documentation and manifest guards
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/architecture/documentation_drift_test.dart \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart

      - name: Commit documentation checkpoint
        id: commit
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README_AI.md docs/manga_provider_rollout_status.md docs/manga_ptbr_provider_audit.md docs/manga_source_aggregation.md
          git diff --cached --check
          git commit -m 'docs(manga): record 18-provider rollout state'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Reverify branch and push fast-forward
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "docs_sha=${{ steps.commit.outputs.sha }}"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
