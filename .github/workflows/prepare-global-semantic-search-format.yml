name: Prepare semantic production formatting

on:
  push:
    branches: [tooling/validate-semantic-coverage-20260810]
    paths: [.github/workflows/prepare-global-semantic-search-format.yml]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact Fichario SHA
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: c0e42e94974c5649556928fd217f2b2345409043
          path: app
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.16.0

      - name: Install
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Format complete candidate
        working-directory: app
        run: pnpm exec prettier --write .

      - name: Stage exact formatted files and patch
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/exact"
          git diff --binary > "$RUNNER_TEMP/prettier.patch"
          git diff --name-only -z | while IFS= read -r -d '' path; do
            mkdir -p "$RUNNER_TEMP/exact/$(dirname "$path")"
            cp "$path" "$RUNNER_TEMP/exact/$path"
          done
          git diff --name-only | tee "$RUNNER_TEMP/formatted-files.txt"
          test -s "$RUNNER_TEMP/prettier.patch"

      - name: Upload exact formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-production-formatted-source
          path: ${{ runner.temp }}/exact
          if-no-files-found: error
          retention-days: 1

      - name: Upload formatting patch
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-production-prettier-patch
          path: |
            ${{ runner.temp }}/prettier.patch
            ${{ runner.temp }}/formatted-files.txt
          if-no-files-found: error
          retention-days: 1
