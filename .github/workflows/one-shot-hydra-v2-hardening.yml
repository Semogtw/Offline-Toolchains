name: One-shot Hydra Drive V2 hardening

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-hardening.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Apply exact correctness patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              target.write_text(text.replace(old, new, 1))

          # Cache identity follows host filesystem case semantics.
          replace_once(
              "src/main/services/cloud-save/google-drive/google-drive-v2-hash-cache.ts",
              '''const normalizeIdentity = (value: string) =>\n  value.replace(/\\\\/g, "/").trim().toLowerCase();\n\nexport const getDriveV2HashCacheKey = (\n  environmentId: string,\n  sourceIdentity: string\n) =>\n  crypto\n    .createHash("sha256")\n    .update(`${environmentId}\\0${normalizeIdentity(sourceIdentity)}`)\n    .digest("hex");\n''',
              '''const normalizeIdentity = (\n  value: string,\n  platform: NodeJS.Platform = process.platform\n) => {\n  const normalized = value.replace(/\\\\/g, "/").trim();\n  return platform === "win32" ? normalized.toLowerCase() : normalized;\n};\n\nexport const getDriveV2HashCacheKey = (\n  environmentId: string,\n  sourceIdentity: string,\n  platform: NodeJS.Platform = process.platform\n) =>\n  crypto\n    .createHash("sha256")\n    .update(`${environmentId}\\0${normalizeIdentity(sourceIdentity, platform)}`)\n    .digest("hex");\n''',
          )

          # Aggregate fingerprints must use deterministic code-unit ordering.
          core = "src/main/services/cloud-save/google-drive/google-drive-v2-core.ts"
          replace_once(
              core,
              '''const normalizePortable = (value: string) =>\n  path.posix.normalize(value.replace(/\\\\/g, "/"));\n''',
              '''const normalizePortable = (value: string) =>\n  path.posix.normalize(value.replace(/\\\\/g, "/"));\n\nexport const compareDriveV2CodeUnits = (left: string, right: string) =>\n  left < right ? -1 : left > right ? 1 : 0;\n''',
          )
          replace_once(
              core,
              '''  for (const variant of [...uniqueVariants.values()].sort((left, right) =>\n    left.variantId.localeCompare(right.variantId)\n  )) {\n''',
              '''  for (const variant of [...uniqueVariants.values()].sort((left, right) =>\n    compareDriveV2CodeUnits(left.variantId, right.variantId)\n  )) {\n''',
          )
          replace_once(
              core,
              '''  const orderedFiles = [...files].sort((left, right) =>\n    getDriveV2FileIdentityKey(left).localeCompare(\n      getDriveV2FileIdentityKey(right)\n    )\n  );\n''',
              '''  const orderedFiles = [...files].sort((left, right) =>\n    compareDriveV2CodeUnits(\n      getDriveV2FileIdentityKey(left),\n      getDriveV2FileIdentityKey(right)\n    )\n  );\n''',
          )
          replace_once(
              core,
              '''const fileMap = (manifest: GoogleDriveCloudSaveV2Manifest | null) =>\n  new Map(\n    (manifest?.files ?? []).map((file) => [getDriveV2FileIdentityKey(file), file])\n  );\n''',
              '''export const isDriveV2ManifestObservationComplete = (\n  manifest: GoogleDriveCloudSaveV2Manifest\n) =>\n  manifest.coverage.every(\n    (coverage) =>\n      coverage.enumeratedCompletely &&\n      (coverage.outcome === "scanned" ||\n        coverage.outcome === "confirmed-missing") &&\n      coverage.warningCodes.length === 0\n  );\n\nconst fileMap = (manifest: GoogleDriveCloudSaveV2Manifest | null) =>\n  new Map(\n    (manifest?.files ?? []).map((file) => [getDriveV2FileIdentityKey(file), file])\n  );\n''',
          )
          replace_once(
              core,
              '''  const localHash = local.manifest.aggregateHash;\n  const remoteHash = remote.manifest.aggregateHash;\n''',
              '''  if (!isDriveV2ManifestObservationComplete(remote.manifest)) {\n    return {\n      state: "partial",\n      action: "blocked",\n      reason: "remote-observation-incomplete",\n      parentAggregateHash: anchor?.aggregateHash ?? null,\n    };\n  }\n\n  const localHash = local.manifest.aggregateHash;\n  const remoteHash = remote.manifest.aggregateHash;\n''',
          )

          snapshot = "src/main/services/cloud-save/google-drive/google-drive-v2-snapshot.ts"
          replace_once(
              snapshot,
              '''import { hashDriveV2FileWithCache } from "./google-drive-v2-hash-cache";\nimport {\n  buildDriveV2AggregateHash,\n  inferDriveV2Variant,\n  normalizeDriveV2LogicalPath,\n} from "./google-drive-v2-core";\n''',
              '''import {\n  hashDriveV2FileWithCache,\n  pruneDriveV2HashCache,\n} from "./google-drive-v2-hash-cache";\nimport {\n  buildDriveV2AggregateHash,\n  compareDriveV2CodeUnits,\n  inferDriveV2Variant,\n  normalizeDriveV2LogicalPath,\n} from "./google-drive-v2-core";\n''',
          )
          replace_once(
              snapshot,
              '''    (left, right) => left.variantId.localeCompare(right.variantId)\n''',
              '''    (left, right) => compareDriveV2CodeUnits(left.variantId, right.variantId)\n''',
          )
          replace_once(
              snapshot,
              '''  const files = [...filesByIdentity.values()].sort((left, right) =>\n    `${left.variantId}\\0${left.rawPath}\\0${left.relativePath}`.localeCompare(\n      `${right.variantId}\\0${right.rawPath}\\0${right.relativePath}`\n    )\n  );\n''',
              '''  const files = [...filesByIdentity.values()].sort((left, right) =>\n    compareDriveV2CodeUnits(\n      `${left.variantId}\\0${left.rawPath}\\0${left.relativePath}`,\n      `${right.variantId}\\0${right.rawPath}\\0${right.relativePath}`\n    )\n  );\n''',
          )
          replace_once(
              snapshot,
              '''  return {\n    manifest,\n    complete,\n    warnings: [...new Set(warnings)],\n    cacheHits,\n    cacheMisses,\n  };\n};\n''',
              '''  await pruneDriveV2HashCache().catch(() => 0);\n\n  return {\n    manifest,\n    complete,\n    warnings: [...new Set(warnings)],\n    cacheHits,\n    cacheMisses,\n  };\n};\n''',
          )

          # A partial observation remains a clean V1 TAR; V2 metadata is only
          # embedded/advertised after a complete per-file observation.
          archive = "src/main/services/cloud-save/google-drive/google-drive-v2-archive.ts"
          replace_once(
              archive,
              '''    const snapshot = await buildDriveV2Snapshot({\n      backupRootPath: staging,\n      ludusaviGameName: archive.manifest.ludusaviGameName ?? objectId,\n      shop,\n      objectId,\n      gameKey,\n      deviceId: archive.manifest.deviceId,\n      createdAt: archive.manifest.createdAt,\n      homeDir: archive.manifest.homeDir,\n      winePrefixPath: archive.manifest.winePrefixPath,\n      ancestorAggregateHash,\n    });\n\n    await fs.promises.writeFile(\n''',
              '''    const snapshot = await buildDriveV2Snapshot({\n      backupRootPath: staging,\n      ludusaviGameName: archive.manifest.ludusaviGameName ?? objectId,\n      shop,\n      objectId,\n      gameKey,\n      deviceId: archive.manifest.deviceId,\n      createdAt: archive.manifest.createdAt,\n      homeDir: archive.manifest.homeDir,\n      winePrefixPath: archive.manifest.winePrefixPath,\n      ancestorAggregateHash,\n    });\n\n    if (!snapshot.complete) {\n      return {\n        ...archive,\n        v2Manifest: snapshot.manifest,\n        v2ObservationComplete: false,\n        v2Warnings: snapshot.warnings,\n      };\n    }\n\n    await fs.promises.writeFile(\n''',
          )
          PY

      - name: Commit and push Hydra hardening
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add \
            src/main/services/cloud-save/google-drive/google-drive-v2-hash-cache.ts \
            src/main/services/cloud-save/google-drive/google-drive-v2-core.ts \
            src/main/services/cloud-save/google-drive/google-drive-v2-snapshot.ts \
            src/main/services/cloud-save/google-drive/google-drive-v2-archive.ts
          git commit -m "fix(cloud-save): harden V2 cross-platform observations"
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot Toolchains files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-hardening.yml" "triggers/one-shot-hydra-v2-hardening.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed Hydra V2 hardening" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null || true
          done
