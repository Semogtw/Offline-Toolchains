name: GoAnime PR268 personalization one-shot CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/goanime-pr268-personalization-one-shot.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goanime-pr268-focused
  cancel-in-progress: true

jobs:
  focused:
    name: Flutter analysis, tests and deterministic ranking diagnostic
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require private repo access
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact experiment SHA
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 4abdeb0f2d77393fd3eacfb8a49cbb571e55c084
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          persist-credentials: true
          lfs: false
          submodules: false

      - name: Verify exact source
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "4abdeb0f2d77393fd3eacfb8a49cbb571e55c084"

      - name: Flutter stable 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Dependencies
        working-directory: source
        run: |
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Focused static analysis
        id: analysis
        continue-on-error: true
        working-directory: source
        run: |
          flutter analyze --no-pub \
            lib/services/manga/manga_multi_interest_profile.dart \
            lib/services/manga/manga_recommendation_diversifier.dart \
            lib/services/manga/manga_recommendation_candidate_pool.dart \
            lib/services/manga/manga_recommendation_creator_profile.dart \
            lib/services/manga/manga_recommendation_graph_discovery.dart \
            lib/services/manga/manga_recommendation_explorer.dart \
            lib/services/manga/manga_recommendation_service.dart \
            lib/manga_manhastro/adapters/manhastro_recommendations_adapter.dart

      - name: Focused service regression and 32-case benchmark
        id: service
        continue-on-error: true
        working-directory: source
        run: flutter test --no-pub test/services/manga/manga_recommendation_service_test.dart

      - name: Focused recommendations adapter regression
        id: adapter
        continue-on-error: true
        working-directory: source
        run: flutter test --no-pub test/services/manga/manhastro_recommendations_adapter_test.dart

      - name: Focused R3-R5 retrieval and graph regressions
        id: retrieval
        continue-on-error: true
        working-directory: source
        run: flutter test --no-pub test/services/manga/manga_recommendation_retrieval_experiment_test.dart

      - name: R7 deterministic exploration regressions
        id: exploration
        continue-on-error: true
        working-directory: source
        run: flutter test --no-pub test/services/manga/manga_recommendation_explorer_test.dart

      - name: R3 R6 R7 one-shot structural ablation with phase timings
        id: ablation
        continue-on-error: true
        working-directory: source
        run: flutter test --no-pub --reporter expanded test/services/manga/manga_recommendation_r7_ablation_test.dart

      - name: R6 R7 reference equivalence 264 frozen cases
        id: equivalence
        continue-on-error: true
        working-directory: source
        run: |
          flutter test --no-pub \
            test/services/manga/manga_recommendation_diversifier_equivalence_test.dart \
            test/services/manga/manga_recommendation_explorer_equivalence_test.dart

      - name: Real catalog two-taste blind packet generation
        id: blind_packet
        continue-on-error: true
        working-directory: source
        timeout-minutes: 12
        run: flutter test --no-pub --reporter expanded test/services/manga/manga_recommendation_blind_quality_packet_test.dart

      - name: Deterministic synthetic-personalization blind evaluator tests
        id: personalized_evaluator
        continue-on-error: true
        working-directory: source
        run: python3 -m unittest tools.tests.test_manga_personalized_blind -v

      - name: Normalize Dart formatting
        id: format
        continue-on-error: true
        working-directory: source
        run: |
          dart format \
            lib/services/manga/manga_multi_interest_profile.dart \
            lib/services/manga/manga_recommendation_diversifier.dart \
            lib/services/manga/manga_recommendation_candidate_pool.dart \
            lib/services/manga/manga_recommendation_creator_profile.dart \
            lib/services/manga/manga_recommendation_graph_discovery.dart \
            lib/services/manga/manga_recommendation_explorer.dart \
            lib/services/manga/manga_recommendation_service.dart \
            lib/manga_manhastro/adapters/manhastro_recommendations_adapter.dart \
            test/services/manga/manga_recommendation_service_test.dart \
            test/services/manga/manhastro_recommendations_adapter_test.dart \
            test/services/manga/manga_recommendation_retrieval_experiment_test.dart \
            test/services/manga/manga_recommendation_explorer_test.dart \
            test/services/manga/manga_recommendation_r7_ablation_test.dart \
            test/services/manga/manga_recommendation_diversifier_equivalence_test.dart \
            test/services/manga/manga_recommendation_explorer_equivalence_test.dart \
            test/services/manga/manga_recommendation_blind_quality_packet_test.dart
          git diff --check

      - name: Publish formatting-only correction to PR268
        id: publish_format
        if: always() && steps.format.outcome == 'success'
        continue-on-error: true
        working-directory: source
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/services/manga/manga_multi_interest_profile.dart \
            lib/services/manga/manga_recommendation_diversifier.dart \
            lib/services/manga/manga_recommendation_candidate_pool.dart \
            lib/services/manga/manga_recommendation_creator_profile.dart \
            lib/services/manga/manga_recommendation_graph_discovery.dart \
            lib/services/manga/manga_recommendation_explorer.dart \
            lib/services/manga/manga_recommendation_service.dart \
            lib/manga_manhastro/adapters/manhastro_recommendations_adapter.dart \
            test/services/manga/manga_recommendation_service_test.dart \
            test/services/manga/manhastro_recommendations_adapter_test.dart \
            test/services/manga/manga_recommendation_retrieval_experiment_test.dart \
            test/services/manga/manga_recommendation_explorer_test.dart \
            test/services/manga/manga_recommendation_r7_ablation_test.dart \
            test/services/manga/manga_recommendation_diversifier_equivalence_test.dart \
            test/services/manga/manga_recommendation_explorer_equivalence_test.dart \
            test/services/manga/manga_recommendation_blind_quality_packet_test.dart; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "GoAnime CI formatter"
          git config user.email "goanime-ci@users.noreply.github.com"
          git add lib/services/manga/manga_multi_interest_profile.dart \
            lib/services/manga/manga_recommendation_diversifier.dart \
            lib/services/manga/manga_recommendation_candidate_pool.dart \
            lib/services/manga/manga_recommendation_creator_profile.dart \
            lib/services/manga/manga_recommendation_graph_discovery.dart \
            lib/services/manga/manga_recommendation_explorer.dart \
            lib/services/manga/manga_recommendation_service.dart \
            lib/manga_manhastro/adapters/manhastro_recommendations_adapter.dart \
            test/services/manga/manga_recommendation_service_test.dart \
            test/services/manga/manhastro_recommendations_adapter_test.dart \
            test/services/manga/manga_recommendation_retrieval_experiment_test.dart \
            test/services/manga/manga_recommendation_explorer_test.dart \
            test/services/manga/manga_recommendation_r7_ablation_test.dart \
            test/services/manga/manga_recommendation_diversifier_equivalence_test.dart \
            test/services/manga/manga_recommendation_explorer_equivalence_test.dart \
            test/services/manga/manga_recommendation_blind_quality_packet_test.dart
          git commit -m "style(manga): format experimental recommendation code"
          # Fast-forward only. Never overwrite another agent's newer commit.
          git push origin HEAD:refs/heads/feat/manga-personalization-multi-interest-20261015

      - name: Machine-readable results
        if: always()
        env:
          A: ${{ steps.analysis.outcome }}
          S: ${{ steps.service.outcome }}
          R: ${{ steps.adapter.outcome }}
          E: ${{ steps.retrieval.outcome }}
          X: ${{ steps.exploration.outcome }}
          B: ${{ steps.ablation.outcome }}
          V: ${{ steps.equivalence.outcome }}
          Q: ${{ steps.blind_packet.outcome }}
          J: ${{ steps.personalized_evaluator.outcome }}
          F: ${{ steps.format.outcome }}
          P: ${{ steps.publish_format.outcome }}
        run: |
          printf 'ANALYSIS=%s\nSERVICE=%s\nADAPTER=%s\nRETRIEVAL=%s\nEXPLORER=%s\nABLATION=%s\nEQUIVALENCE=%s\nBLIND=%s\nEVALUATOR=%s\nFORMAT=%s\nPUBLISH=%s\n' "$A" "$S" "$R" "$E" "$X" "$B" "$V" "$Q" "$J" "$F" "$P"
          {
            echo '### PR268 exact-SHA independent automated checks'
            echo '- Commit: 4abdeb0f2d77393fd3eacfb8a49cbb571e55c084'
            echo "- Analyzer: $A"
            echo "- Unit + 32-case structural benchmark: $S"
            echo "- Adapter integration: $R"
            echo "- Multi-channel retrieval/graph: $E"
            echo "- Soft-interest exploration: $X"
            echo "- 32-profile structural ablation: $B"
            echo "- Frozen greedy equivalence: $V"
            echo "- Blind real-catalog metadata preflight: $Q"
            echo "- Deterministic grader tests: $J"
            echo "- Dart formatting: $F"
            echo "- Safe formatting commit: $P"
            echo '- No manual or longitudinal tests; structural metrics are not user satisfaction.'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$A" = success
          test "$S" = success
          test "$R" = success
          test "$E" = success
          test "$X" = success
          test "$B" = success
          test "$V" = success
          test "$Q" = success
          test "$J" = success
          test "$F" = success
          test "$P" = success

      - name: Publish verified CI receipt on PR268
        if: success()
        working-directory: source
        env:
          PINNED_SHA: 4abdeb0f2d77393fd3eacfb8a49cbb571e55c084
        run: |
          set -euo pipefail
          branch=feat/manga-personalization-multi-interest-20261015
          local_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$local_sha" = "$remote_sha"
          mkdir -p docs/verification
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('docs/verification/pr268_r7_one_shot_ci.json')
          report = {
              'schemaVersion': 1,
              'gate': 'PR268_R4_R7_ONE_SHOT',
              'status': 'passed',
              'testedSourceSha': os.environ['PINNED_SHA'],
              'postFormattingSourceSha': os.popen('git rev-parse HEAD').read().strip(),
              'workflowRunId': os.environ['GITHUB_RUN_ID'],
              'workflowRepository': os.environ['GITHUB_REPOSITORY'],
              'checks': [
                  'targeted_analysis',
                  'recommendation_service',
                  'adapter_integration',
                  'retrieval_graph',
                  'exploration',
                  'structural_ablation_32_profiles',
                  'greedy_equivalence_264_cases',
                  'real_catalog_blind_preflight',
                  'personalized_blind_evaluator',
                  'dart_format',
              ],
              'limitations': [
                  'CI pass proves only automated checks for the tested SHA.',
                  'Synthetic structural metrics do not measure user preference.',
                  'No independent blind AI judgments were generated.',
                  'Runner phase timings are not mobile FPS measurements.',
              ],
          }
          path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          git config user.name "GoAnime CI verifier"
          git config user.email "goanime-ci@users.noreply.github.com"
          git add docs/verification/pr268_r7_one_shot_ci.json
          git commit -m "ci(manga): record passed-only PR268 R4/R7 verification receipt"
          git push origin "HEAD:refs/heads/$branch"
