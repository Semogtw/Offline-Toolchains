name: Publish Crownfall Arena APK

on:
  push:
    branches:
      - build/crownfall-arena
    paths:
      - '.github/workflows/publish-crownfall-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified APK asset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '33894484608'
      ARTIFACT_NAME: 'crownfall-arena-android-arm64'
      RELEASE_TAG: 'crownfall-v0.3.0'
      APK_SHA256: '1591136aed013e726e43decf84367f544b232834c4ca36de0aef66c44800a667'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download already-verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crownfall-artifact"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/crownfall-artifact"
          APK="$(find "$RUNNER_TEMP/crownfall-artifact" -type f -name 'CrownfallArena.apk' -print -quit)"
          test -n "$APK"
          echo "$APK_SHA256  $APK" | sha256sum -c -
          cp "$APK" "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk"
          printf '%s  %s\n' "$APK_SHA256" 'CrownfallArena-v0.3.0-arm64.apk' > "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk.sha256"

      - name: Publish direct APK download
        shell: bash
        run: |
          set -euo pipefail
          NOTES='Crownfall Arena v0.3.0 is the textured art pass. The arena now uses real bitmap surface materials for grassy cobblestone, wood/stone pathways, masonry, metal and wood, sourced at build time from Poly Haven CC0 and stylized/downsampled for mobile. Water and parchment are raster assets generated specifically for Crownfall. The 24-card roster now uses a dedicated 1536x1024 raster card-art atlas and a 1024x1536 unit-sprite atlas with four visual states per card (idle, movement, attack and hit). A TextureBank and ArtOverlay integrate these textures into the arena, bridges, towers, hand, Collection, Decks and Home while preserving the existing gameplay and accessibility settings. No Supercell or Clash Royale art is included. Built with Godot 4.7.2 for Android arm64-v8a. Package: com.crownfallarena.game. Internal version: 0.3.0 (versionCode 3). Debug-signed APK. SHA-256: 1591136aed013e726e43decf84367f544b232834c4ca36de0aef66c44800a667'
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk" \
              "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk#Crownfall Arena v0.3.0 · Android arm64" \
              "$RUNNER_TEMP/CrownfallArena-v0.3.0-arm64.apk.sha256#SHA-256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Crownfall Arena v0.3.0 — Textured Art Pass' \
              --notes "$NOTES" \
              --prerelease
          fi

      - name: Verify published release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets | tee "$RUNNER_TEMP/release.json"
          grep -q 'CrownfallArena-v0.3.0-arm64.apk' "$RUNNER_TEMP/release.json"
