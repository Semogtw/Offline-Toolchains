name: Publish Crownfall Arena APK

on:
  push:
    branches:
      - build/crownfall-arena
    paths:
      - '.github/workflows/publish-crownfall-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish verified APK asset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN_ID: '33886740453'
      ARTIFACT_NAME: 'crownfall-arena-android-arm64'
      RELEASE_TAG: 'crownfall-v0.1.0'
      APK_SHA256: '9b427b1088758b4b05674252e3d6e86e40a2f7888345f99c45ed2cbe42027f3d'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download already-verified APK artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crownfall-artifact"
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir "$RUNNER_TEMP/crownfall-artifact"
          APK="$(find "$RUNNER_TEMP/crownfall-artifact" -type f -name 'CrownfallArena.apk' -print -quit)"
          test -n "$APK"
          echo "$APK_SHA256  $APK" | sha256sum -c -
          cp "$APK" "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk"
          printf '%s  %s\n' "$APK_SHA256" 'CrownfallArena-v0.1.0-arm64.apk' > "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk.sha256"

      - name: Publish direct APK download
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk" \
              "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk.sha256" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk#Crownfall Arena v0.1.0 · Android arm64" \
              "$RUNNER_TEMP/CrownfallArena-v0.1.0-arm64.apk.sha256#SHA-256" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title 'Crownfall Arena v0.1.0' \
              --notes 'Original offline arena battler prototype built with Godot 4.7.2. Android arm64-v8a debug-signed build. Package: com.crownfallarena.game. SHA-256: 9b427b1088758b4b05674252e3d6e86e40a2f7888345f99c45ed2cbe42027f3d' \
              --prerelease
          fi

      - name: Verify published release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json url,assets | tee "$RUNNER_TEMP/release.json"
          grep -q 'CrownfallArena-v0.1.0-arm64.apk' "$RUNNER_TEMP/release.json"
