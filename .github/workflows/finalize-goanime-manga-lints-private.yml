name: Finalize GoAnime manga lints privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-lint-finalize/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-lint-finalize
  cancel-in-progress: false

jobs:
  finalize:
    name: Fix and validate final manga lints privately
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-lint-finalize/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          test "$branch" = "feature/manga-platform"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "temp_branch=toolchain/manga-lint-fix-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply exact lint fixes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          manager = Path('lib/services/manga/download/manga_download_manager.dart')
          text = manager.read_text(encoding='utf-8')

          old = 'onError: (Object _, StackTrace __) {'
          if text.count(old) != 1:
              raise SystemExit('observer lint fix precondition failed')
          text = text.replace(old, 'onError: (Object _, StackTrace _) {')

          one_line_unknown = (
              "    if (parent == null) throw StateError('Unknown manga download: $downloadId.');"
          )
          if text.count(one_line_unknown) != 3:
              raise SystemExit('parent guard lint fix precondition failed')
          text = text.replace(
              one_line_unknown,
              "    if (parent == null) {\n"
              "      throw StateError('Unknown manga download: $downloadId.');\n"
              "    }",
          )

          remove_old = '    _activeRuns.remove(downloadId);'
          if text.count(remove_old) != 1:
              raise SystemExit('active future cleanup precondition failed')
          text = text.replace(
              remove_old,
              '    final removed = _activeRuns.remove(downloadId);\n'
              '    if (removed != null) {\n'
              '      unawaited(_consumeCompletion(removed));\n'
              '    }',
          )
          manager.write_text(text, encoding='utf-8')

          test_file = Path('test/services/manga/download/manga_download_manager_test.dart')
          text = test_file.read_text(encoding='utf-8')

          text, partial_count = re.subn(
              r"(controller\.addError\(StateError\('connection dropped'\)\);\n\s*)controller\.close\(\);",
              r"\1unawaited(controller.close());",
              text,
              count=1,
          )
          if partial_count != 1:
              raise SystemExit('partial-failure stream precondition failed')

          pause_pattern = re.compile(
              r"(onCancel: \(\) \{\n)(\s*)(if \(!firstStreamCancelled\.isCompleted\) firstStreamCancelled\.complete\(\);\n)(\s*)(\},)"
          )
          match = pause_pattern.search(text)
          if match is None:
              raise SystemExit('pause stream close precondition failed')
          replacement = (
              match.group(1)
              + match.group(2)
              + match.group(3)
              + match.group(2)
              + 'unawaited(controller.close());\n'
              + match.group(4)
              + match.group(5)
          )
          text = text[:match.start()] + replacement + text[match.end():]
          test_file.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format exact lint fixes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/services/manga/download/manga_download_manager.dart \
            test/services/manga/download/manga_download_manager_test.dart >/dev/null
          git diff --check

      - name: Resolve dependencies privately
        working-directory: private-source
        shell: bash
        run: flutter pub get >/dev/null 2>&1

      - name: Validate analyzer and manga suites
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub lib/services/manga lib/screens/manga test/services/manga test/widgets/manga test/architecture >/dev/null
          flutter test --no-pub test/services/manga/download >/dev/null
          flutter test --no-pub test/services/manga/offline >/dev/null
          flutter test --no-pub test/services/manga/archive >/dev/null
          flutter test --no-pub test/widgets/manga >/dev/null
          flutter test --no-pub test/architecture/manga_offline_persistence_boundary_test.dart >/dev/null

      - name: Encrypt validated files for connector publication
        id: encrypted
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/manga-lint-validated"
          payload="$work/payload"
          transfer="$work/transfer"
          archive="$work/validated.tar.zst"
          gpg_home="$work/gpg"
          rm -rf "$work"
          mkdir -p "$payload/lib/services/manga/download" "$payload/test/services/manga/download" "$transfer" "$gpg_home"
          chmod 700 "$gpg_home"
          cp "$GITHUB_WORKSPACE/private-source/lib/services/manga/download/manga_download_manager.dart" "$payload/lib/services/manga/download/"
          cp "$GITHUB_WORKSPACE/private-source/test/services/manga/download/manga_download_manager_test.dart" "$payload/test/services/manga/download/"
          printf '%s\n' '${{ steps.request.outputs.sha }}' > "$payload/BASE_SHA"
          printf 'analyze=0\ndownload=0\noffline=0\narchive=0\nwidgets=0\narchitecture=0\n' > "$payload/STATUS.txt"
          tar -C "$payload" -I 'zstd -T0 -6' -cf "$archive" .
          export GNUPGHOME="$gpg_home"
          gpg --batch --import "$GITHUB_WORKSPACE/control/keys/source-bundles-public.asc" >/dev/null 2>&1
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$transfer/validated.gpg" --encrypt "$archive"
          sha256sum "$transfer/validated.gpg" > "$transfer/SHA256SUMS"
          echo "transfer=$transfer" >> "$GITHUB_OUTPUT"
          rm -rf "$payload" "$archive" "$gpg_home"

      - name: Upload ciphertext-only validated files
        uses: actions/upload-artifact@v7
        with:
          name: goanime-manga-lint-validated-encrypted
          path: ${{ steps.encrypted.outputs.transfer }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Commit validated lint fixes
        id: commit
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            lib/services/manga/download/manga_download_manager.dart \
            test/services/manga/download/manga_download_manager_test.dart
          git commit -m "fix(manga): close remaining analyzer lifecycle lints" >/dev/null
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push validated commit to temporary private branch
        id: publish
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TEMP_BRANCH: ${{ steps.request.outputs.temp_branch }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/goanime-mobile.git"
          git push "$remote" "HEAD:refs/heads/$TEMP_BRANCH" >/dev/null 2>&1
          unset remote PRIVATE_REPOSITORIES_TOKEN
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Report validated commit safely
        shell: bash
        run: |
          echo "Validated private commit: ${{ steps.commit.outputs.sha }}"
          echo "Temporary private branch: ${{ steps.request.outputs.temp_branch }}"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/manga-lint-validated"
