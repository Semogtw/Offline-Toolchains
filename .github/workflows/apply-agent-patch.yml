name: Apply agent patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-agent-patch.yml
      - agent-patches/apply.txt

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'agent/artifact-platform-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/artifact-platform-v2
          fetch-depth: 0

      - name: Verify and apply segmented patch
        shell: bash
        run: |
          set -euo pipefail
          test -f agent-patches/manifest.json || exit 0
          series="$(tr -d '\r\n' < agent-patches/apply.txt)"
          python3 - "$series" "$RUNNER_TEMP/patch.gz.b64" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          series, output = sys.argv[1:]
          root = Path('agent-patches')
          manifest = json.loads((root / 'manifest.json').read_text())
          if manifest != {
              'series': series,
              'total': manifest.get('total'),
              'sha256': manifest.get('sha256'),
          }:
              raise SystemExit('patch manifest has unexpected fields')
          total = manifest['total']
          expected = manifest['sha256']
          if not isinstance(total, int) or total < 1:
              raise SystemExit('invalid patch chunk count')
          chunks = []
          for index in range(total):
              path = root / 'chunks' / f'{index:03d}.txt'
              if not path.is_file():
                  raise SystemExit(f'missing patch chunk {index}')
              chunks.append(path.read_bytes())
          data = b''.join(chunks)
          actual = hashlib.sha256(data).hexdigest()
          print(f'patch transport: chunks={total} bytes={len(data)} sha256={actual}')
          if actual != expected:
              raise SystemExit('patch transport checksum mismatch')
          Path(output).write_bytes(data)
          PY
          base64 --decode "$RUNNER_TEMP/patch.gz.b64" | gzip -dc > "$RUNNER_TEMP/agent.patch"
          git apply --check "$RUNNER_TEMP/agent.patch"
          git apply "$RUNNER_TEMP/agent.patch"
          rm -rf agent-patches
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: checkpoint artifact platform v2 $series"
          git push origin HEAD:agent/artifact-platform-v2
