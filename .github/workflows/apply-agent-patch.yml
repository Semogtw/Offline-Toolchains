name: Apply agent patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-agent-patch.yml
      - agent-patches/apply.txt

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.actor == github.repository_owner &&
      github.event.pull_request.number == 7 &&
      github.event.pull_request.head.ref == 'agent/artifact-platform-v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/artifact-platform-v2
          fetch-depth: 0

      - name: Reconstruct and apply verified non-workflow patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: '7'
        run: |
          set -euo pipefail
          series="core"
          gh api "/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
            > "$RUNNER_TEMP/comments.json"
          python3 - "$RUNNER_TEMP/comments.json" "$series" "$RUNNER_TEMP/patch.gz.b64" <<'PY'
          import hashlib
          import json
          import re
          import sys
          from pathlib import Path

          comments, series, output = sys.argv[1:]
          pattern = re.compile(
              rf'^<!-- agent-patch:{re.escape(series)}:(\d+)/(\d+) '
              rf'sha256=([0-9a-f]{{64}}) -->\n([A-Za-z0-9+/=]+)$'
          )
          chunks = {}
          total = None
          expected = None
          for comment in json.load(open(comments, encoding='utf-8')):
              match = pattern.fullmatch(comment.get('body', ''))
              if not match:
                  continue
              index, candidate_total, digest, chunk = match.groups()
              index = int(index)
              candidate_total = int(candidate_total)
              if total is None:
                  total, expected = candidate_total, digest
              if total != candidate_total or expected != digest:
                  raise SystemExit('patch metadata mismatch')
              chunks[index] = chunk
          if total is None or sorted(chunks) != list(range(total)):
              raise SystemExit(f'incomplete patch series: expected {total}, got {sorted(chunks)}')
          data = ''.join(chunks[index] for index in range(total)).encode()
          actual = hashlib.sha256(data).hexdigest()
          print(f'patch transport: chunks={total} bytes={len(data)} sha256={actual}')
          if actual != expected:
              raise SystemExit('patch transport checksum mismatch')
          Path(output).write_bytes(data)
          PY
          base64 --decode "$RUNNER_TEMP/patch.gz.b64" | gzip -dc > "$RUNNER_TEMP/agent.patch"
          git apply --check --exclude='.github/workflows/**' "$RUNNER_TEMP/agent.patch"
          git apply --exclude='.github/workflows/**' "$RUNNER_TEMP/agent.patch"
          rm -rf agent-patches
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat: checkpoint artifact platform v2 core code'
          git push origin HEAD:agent/artifact-platform-v2
