name: Deprecated Hydra events diagnostic capture

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    name: Use sanitized Hydra repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Explain retirement
        run: |
          echo 'Retired: this workflow committed private-project diagnostic output into the public repository.'
          echo 'Use Run private project CI with project=hydra or Validate Hydra checkout instead.'
