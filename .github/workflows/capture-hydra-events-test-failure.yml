name: Capture Hydra main test failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/capture-hydra-events-test-failure.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: capture-hydra-main-test-failure
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.1"
  GTK4_LAYER_SHELL_COMMIT: "1c963c51514581c41b9bdae08cdf69171265cdda"

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout Toolchains
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Hydra main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: main
          path: hydra
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false
          cache: yarn
          cache-dependency-path: hydra/yarn.lock

      - name: Install native prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ca-certificates git libgtk-4-dev meson \
            ninja-build pkg-config python3 wayland-protocols

      - name: Install pinned GTK4 Layer Shell
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/gtk4-layer-shell"
          git init "$source_dir"
          git -C "$source_dir" remote add origin \
            https://github.com/wmww/gtk4-layer-shell.git
          git -C "$source_dir" fetch --depth=1 origin \
            "$GTK4_LAYER_SHELL_COMMIT"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = \
            "$GTK4_LAYER_SHELL_COMMIT"
          meson setup "$source_dir/build" "$source_dir" \
            --prefix=/usr/local --libdir=lib \
            -Dexamples=false -Ddocs=false -Dtests=false \
            -Dsmoke-tests=false -Dintrospection=false -Dvapi=false
          meson compile -C "$source_dir/build"
          sudo meson install -C "$source_dir/build"
          sudo ldconfig

      - name: Install exact dependencies
        working-directory: hydra
        env:
          CI: "true"
        run: yarn install --frozen-lockfile --non-interactive

      - name: Capture bounded test output
        id: tests
        working-directory: hydra
        shell: bash
        run: |
          set -uo pipefail
          tests=()
          for root in \
            src/main/events \
            src/main/helpers \
            src/main/startup \
            src/main/migrations \
            src/main/level; do
            while IFS= read -r test_file; do
              tests+=("$test_file")
            done < <(find "$root" -type f -name '*.test.ts' -print | sort)
          done
          while IFS= read -r test_file; do
            tests+=("$test_file")
          done < <(find src/main -maxdepth 1 -type f -name '*.test.ts' -print | sort)
          mapfile -t tests < <(printf '%s\n' "${tests[@]}" | sort -u)

          set +e
          timeout --signal=TERM --kill-after=30s 20m \
            node --import ./scripts/register-ts-node.mjs \
            --test --test-reporter=spec "${tests[@]}" \
            > "$RUNNER_TEMP/hydra-tests.log" 2>&1
          status=$?
          set -e

          mkdir -p "$GITHUB_WORKSPACE/diagnostics"
          {
            echo "hydra_ref=$(git rev-parse HEAD)"
            echo "exit_status=$status"
            echo "test_count=${#tests[@]}"
            echo
            echo "=== failure markers ==="
            grep -nE 'not ok|ERR_|AssertionError|Test failure|tests? failed|timeout|cancelled|Error:' \
              "$RUNNER_TEMP/hydra-tests.log" | tail -n 400 || true
            echo
            echo "=== final output ==="
            tail -n 800 "$RUNNER_TEMP/hydra-tests.log"
          } > "$GITHUB_WORKSPACE/diagnostics/hydra-main-events-runtime.txt"

          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Commit diagnostic output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hydra Toolchains"
          git config user.email "actions@users.noreply.github.com"
          git add diagnostics/hydra-main-events-runtime.txt
          git commit -m "diagnostics(hydra): capture main test failure" || true
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preserve test failure status
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
