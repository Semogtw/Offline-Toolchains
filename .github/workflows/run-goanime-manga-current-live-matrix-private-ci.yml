name: Run GoAnime current manga live matrix privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-current-live-matrix/*.request'

permissions:
  contents: write
  statuses: write

concurrency:
  group: goanime-manga-current-live-matrix-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-auditor:
    name: Validate manga live auditor
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-current-live-matrix/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = goanime
          test "$branch" = codex/manga-parity-20260823
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze byte-aware live auditor
        id: analyze
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            tools/manga/audit_planned_provider_stage.dart \
            test/tools/manga/audit_planned_provider_stage_test.dart \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            test/services/manga/manga_remote_content_probe_test.dart

      - name: Test byte-aware live auditor
        id: tests
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/tools/manga/audit_planned_provider_stage_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart

      - name: Check auditor formatting without blocking live probes
        id: format
        continue-on-error: true
        working-directory: private-source
        run: |
          dart format --output=none --set-exit-if-changed \
            tools/manga/audit_planned_provider_stage.dart \
            test/tools/manga/audit_planned_provider_stage_test.dart \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            test/services/manga/manga_remote_content_probe_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control"

      - name: Publish sanitized auditor validation status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$CONTROL_SHA" \
            -f state="$state" \
            -f context='goanime/manga-live-auditor-validation' \
            -f description="Manga live auditor: $JOB_STATUS; format=$FORMAT_OUTCOME"

  live-source:
    name: Live ${{ matrix.source }}
    needs: validate-auditor
    if: github.actor == github.repository_owner && needs.validate-auditor.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source:
          - ptbr.arthurscan
          - ptbr.astratoons
          - ptbr.capitoons
          - ptbr.hqnow
          - ptbr.hipertoon
          - ptbr.kamisamaexplorer
          - ptbr.kivaratoons
          - ptbr.leituramanga
          - ptbr.ler999
          - ptbr.littletyrant
          - ptbr.maidscan
          - ptbr.mangadash
          - ptbr.mangaflix
          - ptbr.mangalivreblog
          - ptbr.mangalivreorg
          - ptbr.ninjascan

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-current-live-matrix/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = goanime
          test "$branch" = codex/manga-parity-20260823
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Probe live provider
        id: probe
        working-directory: private-source
        shell: bash
        env:
          SOURCE_ID: ${{ matrix.source }}
        run: |
          set -euo pipefail
          log="/tmp/goanime-manga-live.log"
          set +e
          timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$SOURCE_ID" >"$log" 2>&1
          status=$?
          set -e
          grep -E '^(search_[0-9]+|search_[0-9]+_results|details|chapters|chapter_count|content_[0-9]+|content_[0-9]+_kind|transport_[0-9]+|verifier|terminal|[a-z0-9_]+_(type|kind|status|host))=' "$log" || true
          terminal="$(grep -E '^terminal=' "$log" | tail -n 1 | cut -d= -f2- || true)"
          problem="$(grep -E '^(search_[0-9]+|details|chapters|content_[0-9]+|transport_[0-9]+)=(failure|unreadable)$' "$log" | tail -n 1 || true)"
          problem="${problem/=/:}"
          echo "terminal=${terminal:-unknown}" >> "$GITHUB_OUTPUT"
          echo "problem=${problem:-none}" >> "$GITHUB_OUTPUT"
          if [ "$status" -eq 0 ] && grep -q '^terminal=readable$' "$log"; then
            echo 'live_result=readable'
            rm -f "$log"
            exit 0
          fi
          echo 'live_result=not_readable'
          echo "exit_status=$status"
          tail -n 30 "$log" | sed -E 's#https?://[^ ]+#<url>#g' || true
          rm -f "$log"
          exit 1

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control" /tmp/goanime-manga-live.log

      - name: Publish sanitized provider result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
          SOURCE_ID: ${{ matrix.source }}
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          TERMINAL: ${{ steps.probe.outputs.terminal }}
          PROBLEM: ${{ steps.probe.outputs.problem }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then state=success; fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$CONTROL_SHA" \
            -f state="$state" \
            -f context="goanime/manga-live/$SOURCE_ID" \
            -f description="Manga live provider gate: $JOB_STATUS"
          result="$(jq -cn --arg controlSha "$CONTROL_SHA" --arg reviewedSha "$REVIEWED_SHA" --arg sourceId "$SOURCE_ID" --arg state "$state" --arg terminal "${TERMINAL:-unknown}" --arg problem "${PROBLEM:-none}" '{schemaVersion:2,controlSha:$controlSha,reviewedSha:$reviewedSha,sourceId:$sourceId,state:$state,terminal:$terminal,problem:$problem}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-manga-live/$CONTROL_SHA/$SOURCE_ID.json"
          for attempt in 1 2 3 4 5; do
            existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record manga live $SOURCE_ID" -f content="$encoded")
            if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
            if gh api "${args[@]}" >/dev/null; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
