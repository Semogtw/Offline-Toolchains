name: Build GoAnime opening arm64 preview

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-opening-arm64/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-opening-arm64-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact preview request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-opening-arm64/*.request' | head -n 1)"
          test -n "$request"
          read -r project sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Build arm64 Android debug APK
        working-directory: private-source
        shell: bash
        run: flutter build apk --debug --no-pub --target-platform android-arm64

      - name: Verify arm64 APK
        id: apk
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          unzip -l "$apk" | grep -q 'lib/arm64-v8a/'
          if unzip -l "$apk" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/'; then
            echo 'Unexpected non-arm64 native libraries in preview APK' >&2
            exit 1
          fi
          sha="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"
          printf '%s  %s\n' "$sha" "$(basename "$apk")" > build/goanime-opening-arm64-apk.sha256
          printf 'sha256=%s\nsize=%s\n' "$sha" "$size" >> "$GITHUB_OUTPUT"

      - name: Upload arm64 preview APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: goanime-opening-arm64-${{ steps.request.outputs.sha }}
          path: |
            private-source/build/app/outputs/flutter-apk/app-debug.apk
            private-source/build/goanime-opening-arm64-apk.sha256
          retention-days: 7
          compression-level: 9
          if-no-files-found: error

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          STATE: ${{ job.status }}
          APK_SHA: ${{ steps.apk.outputs.sha256 }}
          APK_SIZE: ${{ steps.apk.outputs.size }}
        run: |
          set -euo pipefail
          body="$(jq -cn --arg sha "$TARGET_SHA" --arg state "$STATE" --arg apkSha "$APK_SHA" --arg apkSize "$APK_SIZE" --argjson runId "$GITHUB_RUN_ID" '{schemaVersion:1,sourceSha:$sha,state:$state,apkSha256:$apkSha,apkSizeBytes:($apkSize|tonumber? // 0),runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-opening-arm64/$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record GoAnime arm64 preview $GITHUB_RUN_ID" -f content="$encoded" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
