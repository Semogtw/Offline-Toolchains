name: Observe GoAnime manga product runs

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-product-observe/*.request'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Publish sanitized run state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          format="$(gh run list --workflow export-goanime-manga-product-format-encrypted.yml --limit 4 --json databaseId,status,conclusion,headSha,createdAt)"
          live="$(gh run list --workflow run-goanime-manga-product-live-smoke.yml --limit 4 --json databaseId,status,conclusion,headSha,createdAt)"
          live_v2="$(gh run list --workflow run-goanime-manga-product-live-smoke-v2.yml --limit 4 --json databaseId,status,conclusion,headSha,createdAt)"
          result="$(jq -cn --argjson format "$format" --argjson live "$live" --argjson liveV2 "$live_v2" '{schemaVersion:2,format:$format,live:$live,liveV2:$liveV2}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-product-observe/$GITHUB_SHA.json" -f message="ci(result): observe manga product runs" -f content="$encoded"
