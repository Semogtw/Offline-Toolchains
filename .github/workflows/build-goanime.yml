name: Build GoAnime toolchain

on:
  workflow_dispatch:
    inputs:
      profile:
        required: true
        default: goanime-analysis
        type: choice
        options: [goanime-analysis, goanime-android]
      force_rebuild:
        required: true
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/build-goanime.yml
      - fixtures/goanime/**
      - profiles/goanime-*.json
      - scripts/**
      - schemas/**
      - triggers/build.txt
  push:
    branches: [main]
    paths:
      - .github/workflows/build-goanime.yml
      - fixtures/goanime/**
      - profiles/goanime-*.json
      - scripts/**

permissions:
  contents: read
  actions: read

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Define profile and synthetic fingerprint
        id: meta
        shell: bash
        env:
          INPUT_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          profile="${INPUT_PROFILE:-goanime-analysis}"
          [[ "$profile" =~ ^goanime-(analysis|android)$ ]] || exit 2
          fingerprint="$({ find fixtures/goanime -type f -print0 | sort -z | xargs -0 sha256sum; echo "$profile"; } | sha256sum | cut -d' ' -f1)"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "lock_fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
          echo "trusted_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Reuse equivalent artifact set
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/find-reusable-set.sh --profile '${{ steps.meta.outputs.profile }}' --package '${{ steps.meta.outputs.profile }}' \
            --lock-mode synthetic --lock-fingerprint '${{ steps.meta.outputs.lock_fingerprint }}' \
            --workflow-commit '${{ steps.meta.outputs.trusted_commit }}' \
            --receipt-dir "$RUNNER_TEMP/receipt-${{ steps.meta.outputs.profile }}" --github-output "$GITHUB_OUTPUT" \
            --force-rebuild '${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}'
      - name: Install Java 17
        if: steps.reuse.outputs.reused != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        if: steps.reuse.outputs.reused != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false
      - name: Hydrate synthetic fixture and prove offline
        if: steps.reuse.outputs.reused != 'true'
        id: hydrate
        shell: bash
        env:
          PROFILE: ${{ steps.meta.outputs.profile }}
          PUB_CACHE: ${{ runner.temp }}/goanime-pub-cache
          GRADLE_USER_HOME: ${{ runner.temp }}/goanime-gradle-home
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/goanime-fixture"
          rm -rf "$project" "$PUB_CACHE" "$GRADLE_USER_HOME"
          flutter config --no-analytics
          flutter precache --linux --android
          flutter create --platforms=android --project-name=goanime_fixture --org=dev.offline "$project"
          cp fixtures/goanime/pubspec.yaml "$project/pubspec.yaml"
          cp fixtures/goanime/lib/main.dart "$project/lib/main.dart"
          rm -rf "$project/test"; cp -a fixtures/goanime/test "$project/test"
          (cd "$project" && flutter pub get && flutter pub get --offline)
          if [[ "$PROFILE" == goanime-analysis ]]; then
            (cd "$project" && flutter analyze --no-pub && flutter test --no-pub)
          else
            python3 - "$project" <<'PY'
          from pathlib import Path
          import re,sys
          root=Path(sys.argv[1]); settings=root/'android/settings.gradle.kts'; text=settings.read_text()
          text=re.sub(r'id\("com\.android\.application"\) version "[^"]+"','id("com.android.application") version "8.11.1"',text)
          text=re.sub(r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+"','id("org.jetbrains.kotlin.android") version "2.2.20"',text)
          settings.write_text(text)
          wrapper=root/'android/gradle/wrapper/gradle-wrapper.properties'
          wrapper.write_text(re.sub(r'distributionUrl=.*',r'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip',wrapper.read_text()))
          PY
            (cd "$project" && flutter build apk --debug --no-pub)
            (cd "$project/android" && ./gradlew --offline --no-daemon assembleDebug)
          fi
          python3 scripts/collect-lock-inputs.py --root "$project" --profile "$PROFILE" --project goanime --profiles profiles --out "$RUNNER_TEMP/resolved-lock" >/dev/null
          echo "software=$RUNNER_TEMP/resolved-lock/software.json" >> "$GITHUB_OUTPUT"
          echo "project=$project" >> "$GITHUB_OUTPUT"
      - name: Assemble portable profile
        if: steps.reuse.outputs.reused != 'true'
        id: root
        shell: bash
        env:
          PROFILE: ${{ steps.meta.outputs.profile }}
          PUB_CACHE: ${{ runner.temp }}/goanime-pub-cache
          GRADLE_USER_HOME: ${{ runner.temp }}/goanime-gradle-home
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/package-$PROFILE/$PROFILE"
          rm -rf "${root%/*}"; mkdir -p "$root"
          if [[ "$PROFILE" == goanime-analysis ]]; then
            cp -aL "$FLUTTER_ROOT" "$root/flutter"
            cp -a "$PUB_CACHE" "$root/pub-cache"
            project='${{ steps.hydrate.outputs.project }}'
            python3 scripts/native_asset_cache.py capture \
              --source "$project/.dart_tool/hooks_runner/shared" \
              --destination "$root/native-assets-cache/hooks_runner-shared" >/dev/null
            pwsh_root="$(dirname "$(readlink -f "$(command -v pwsh)")")"
            python3 scripts/copy_portable_tree.py "$pwsh_root" "$root/powershell"
            "$root/powershell/pwsh" -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' >/dev/null
            python3 scripts/relocate_flutter_sdk.py --flutter-root "$root/flutter" --pub-cache "$root/pub-cache" >/dev/null
            cat > "$root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export FLUTTER_ROOT="$root/flutter"
          export PUB_CACHE="$root/pub-cache"
          export PATH="$FLUTTER_ROOT/bin:$root/powershell:$PATH"
          export CI=true FLUTTER_SUPPRESS_ANALYTICS=true
          EOF
            portable_project="$RUNNER_TEMP/portable-goanime-fixture"
            rm -rf "$portable_project"; mkdir -p "$portable_project/lib" "$portable_project/test"
            cp fixtures/goanime/pubspec.yaml "$portable_project/pubspec.yaml"
            cp fixtures/goanime/lib/main.dart "$portable_project/lib/main.dart"
            cp -a fixtures/goanime/test/. "$portable_project/test/"
            (
              export FLUTTER_ROOT="$root/flutter" PUB_CACHE="$root/pub-cache"
              export PATH="$root/flutter/bin:$root/powershell:$PATH"
              export CI=true FLUTTER_SUPPRESS_ANALYTICS=true
              cd "$portable_project"
              "$root/flutter/bin/flutter" pub get --offline
              python3 "$GITHUB_WORKSPACE/scripts/native_asset_cache.py" prepare \
                --cache "$root/native-assets-cache/hooks_runner-shared" --project "$portable_project" >/dev/null
              "$root/flutter/bin/flutter" analyze --no-pub
              "$root/flutter/bin/flutter" test --no-pub
            )
          else
            rm -rf "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/workers"
            cp -a "$GRADLE_USER_HOME" "$root/gradle-home"
            cat > "$root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export GRADLE_USER_HOME="$root/gradle-home"
          export CI=true
          EOF
          fi
          chmod +x "$root/activate.sh"
          echo "package_root=$root" >> "$GITHUB_OUTPUT"
      - name: Package schema-v2 set
        if: steps.reuse.outputs.reused != 'true'
        id: pack
        shell: bash
        run: |
          profile='${{ steps.meta.outputs.profile }}'; out="$RUNNER_TEMP/artifact-$profile"
          python3 scripts/build_artifact_set.py --profile "$profile" --package "$profile" \
            --root '${{ steps.root.outputs.package_root }}' --out "$out" --profiles profiles \
            --lock-mode synthetic --lock-fingerprint '${{ steps.meta.outputs.lock_fingerprint }}' \
            --builder-fingerprint '${{ steps.reuse.outputs.builder_fingerprint }}' \
            --workflow .github/workflows/build-goanime.yml --workflow-commit '${{ steps.meta.outputs.trusted_commit }}' \
            --run-id "$GITHUB_RUN_ID" --software '${{ steps.hydrate.outputs.software }}' --archive-name "$profile.tar.zst" >/dev/null
          python3 - "$out/artifact-set.json" "$RUNNER_TEMP/receipt-$profile/receipt.json" "$GITHUB_OUTPUT" "$out" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1])); json.dump({'schema_version':1,'result':'built','manifest':m,'artifact_ids':[]},open(sys.argv[2],'w'),indent=2,sort_keys=True)
          if len(m['parts'])>16: raise SystemExit('too many parts')
          with open(sys.argv[3],'a') as o:o.write(f"artifact_set_id={m['artifact_set_id']}\npart_count={len(m['parts'])}\nout={sys.argv[4]}\n")
          PY
      - name: Upload toolchain receipt
        uses: actions/upload-artifact@v7
        with:
          name: toolchain-receipt-${{ steps.meta.outputs.profile }}-${{ github.run_id }}
          path: ${{ steps.reuse.outputs.receipt_dir }}/receipt.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload schema-v2 artifact set
        if: steps.reuse.outputs.reused != 'true'
        uses: ./.github/actions/upload-artifact-set
        with:
          artifact-set-id: ${{ steps.pack.outputs.artifact_set_id }}
          out: ${{ steps.pack.outputs.out }}
          archive-prefix: ${{ steps.meta.outputs.profile }}
          part-count: ${{ steps.pack.outputs.part_count }}

# artifact-set.json and SBOM.spdx.json are uploaded by the composite action.
