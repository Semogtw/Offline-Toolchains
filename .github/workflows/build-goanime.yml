          retention-days: 1

      - name: Upload GoAnime bundle part 11
        if: steps.bundle.outputs.part_11 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-11
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-11
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 12
        if: steps.bundle.outputs.part_12 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-12
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-12
          if-no-files-found: error
