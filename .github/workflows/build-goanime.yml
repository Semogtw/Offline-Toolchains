      - name: Upload GoAnime bundle part 08
        if: steps.bundle.outputs.part_08 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-08
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-08
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 09
        if: steps.bundle.outputs.part_09 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-09
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-09
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 10
        if: steps.bundle.outputs.part_10 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-10
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-10
          if-no-files-found: error
