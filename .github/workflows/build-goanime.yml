name: Build GoAnime offline cache

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/build-goanime.yml
      - fixtures/goanime/**
      - scripts/validate_goanime_hosted_packages.py
      - tests/test_validate_goanime_hosted_packages.py
      - triggers/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-goanime.yml
      - fixtures/goanime/**
      - scripts/validate_goanime_hosted_packages.py
      - tests/test_validate_goanime_hosted_packages.py

permissions:
  contents: read

concurrency:
  group: goanime-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1
  FLUTTER_CHANNEL: stable
  GOANIME_HOSTED_PACKAGE_MANIFEST: fixtures/goanime/hosted-packages.txt
  MEDIA_KIT_ANDROID_VIDEO_PACKAGE: media_kit_libs_android_video-1.3.8
  MEDIA_KIT_NATIVE_VERSION: v1.1.7

jobs:
  build:
    name: Flutter, Pub, Gradle and PowerShell
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Validate exact hosted package manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tests/test_validate_goanime_hosted_packages.py
          python3 scripts/validate_goanime_hosted_packages.py \
            "$GOANIME_HOSTED_PACKAGE_MANIFEST"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure portable caches
        shell: bash
        run: |
          echo "PUB_CACHE=$RUNNER_TEMP/goanime-pub-cache" >> "$GITHUB_ENV"
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/goanime-gradle-home" >> "$GITHUB_ENV"

      - name: Hydrate Flutter, Pub and Android Gradle dependencies
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/goanime-fixture"
          flutter config --no-analytics
          flutter precache --linux --android

          flutter create \
            --platforms=android \
            --project-name=goanime_fixture \
            --org=dev.offline \
            "$project"

          cp fixtures/goanime/pubspec.yaml "$project/pubspec.yaml"
          cp fixtures/goanime/lib/main.dart "$project/lib/main.dart"
          rm -rf "$project/test"
          cp -a fixtures/goanime/test "$project/test"

          cd "$project"
          flutter pub get

          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            package="${line%%=*}"
            version="${line#*=}"
            package_dir="$PUB_CACHE/hosted/pub.dev/${package}-${version}"
            if [[ ! -d "$package_dir" ]]; then
              dart pub cache add "$package" --version "$version"
            fi
            test -d "$package_dir"
          done < "$GITHUB_WORKSPACE/$GOANIME_HOSTED_PACKAGE_MANIFEST"

          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle.kts")
          text = settings.read_text()
          text = re.sub(
              r'id\("com\.android\.application"\) version "[^"]+"',
              'id("com.android.application") version "8.11.1"',
              text,
          )
          text = re.sub(
              r'id\("org\.jetbrains\.kotlin\.android"\) version "[^"]+"',
              'id("org.jetbrains.kotlin.android") version "2.2.20"',
              text,
          )
          marker = 'id("org.jetbrains.kotlin.android") version "2.2.20" apply false'
          additions = (
              marker
              + '\n    id("com.google.gms.google-services") version "4.4.2" apply false'
              + '\n    id("com.google.firebase.crashlytics") version "3.0.6" apply false'
          )
          text = text.replace(marker, additions)
          settings.write_text(text)

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")
          wrapper_text = wrapper.read_text()
          wrapper_text = re.sub(
              r"distributionUrl=.*",
              r"distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip",
              wrapper_text,
          )
          wrapper.write_text(wrapper_text)

          app = Path("android/app/build.gradle.kts")
          app_text = app.read_text()
          app_text += '''

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              implementation("com.google.android.play:core:1.10.3")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("com.google.firebase:firebase-messaging-ktx:24.1.2")
              implementation("com.google.firebase:firebase-crashlytics:19.4.4")
          }
          '''
          app_text = app_text.replace(
              "compileOptions {",
              "compileOptions {\n        isCoreLibraryDesugaringEnabled = true",
          )
          app.write_text(app_text)
          PY

          flutter build apk --debug

      - name: Preload media_kit native Android archives
        shell: bash
        run: |
          set -euo pipefail

          project="$RUNNER_TEMP/goanime-fixture"
          source_dir="$project/build/media_kit_libs_android_video/$MEDIA_KIT_NATIVE_VERSION"
          preload_dir="$GRADLE_USER_HOME/offline-media-kit/$MEDIA_KIT_NATIVE_VERSION"
          init_dir="$GRADLE_USER_HOME/init.d"

          test -d "$PUB_CACHE/hosted/pub.dev/$MEDIA_KIT_ANDROID_VIDEO_PACKAGE"
          mkdir -p "$preload_dir" "$init_dir"

          declare -A expected_md5=(
            [default-arm64-v8a.jar]=83df25b61193af8fa815e373143ac9af
            [default-armeabi-v7a.jar]=22e21526fefc0a2b8f17adbec9f57590
            [default-x86_64.jar]=6fa26bf0459b11f1c0b0dbc29e5b940d
            [default-x86.jar]=0d742b756dc9d1fcd84ea271d8b68f32
          )

          for name in "${!expected_md5[@]}"; do
            source_file="$source_dir/$name"
            test -f "$source_file"
            actual_md5="$(md5sum "$source_file" | awk '{print $1}')"
            test "$actual_md5" = "${expected_md5[$name]}"
            cp "$source_file" "$preload_dir/$name"
          done

          cat > "$init_dir/goanime-offline-media-kit.gradle" <<'GRADLE'
          import java.nio.file.Files
          import java.security.MessageDigest

          gradle.beforeProject { project ->
              if (project.name != 'media_kit_libs_android_video') {
                  return
              }

              def version = 'v1.1.7'
              def expected = [
                  'default-arm64-v8a.jar': '83df25b61193af8fa815e373143ac9af',
                  'default-armeabi-v7a.jar': '22e21526fefc0a2b8f17adbec9f57590',
                  'default-x86_64.jar': '6fa26bf0459b11f1c0b0dbc29e5b940d',
                  'default-x86.jar': '0d742b756dc9d1fcd84ea271d8b68f32',
              ]
              def sourceDir = new File(gradle.gradleUserHomeDir, "offline-media-kit/${version}")
              def destinationDir = new File(project.buildDir, version)
              destinationDir.mkdirs()

              expected.each { name, checksum ->
                  def source = new File(sourceDir, name)
                  if (!source.isFile()) {
                      throw new GradleException("Missing offline media_kit archive: ${source}")
                  }
                  def digest = MessageDigest.getInstance('MD5')
                      .digest(Files.readAllBytes(source.toPath()))
                      .encodeHex()
                      .toString()
                  if (digest != checksum) {
                      throw new GradleException("Invalid offline media_kit archive: ${source}")
                  }
                  def destination = new File(destinationDir, name)
                  if (!destination.isFile() || destination.length() != source.length()) {
                      destination.bytes = source.bytes
                  }
              }
          }
          GRADLE

      - name: Assemble portable GoAnime bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="$RUNNER_TEMP/goanime-toolchain"
          archive="$RUNNER_TEMP/goanime-flutter-cache-linux-x64.tar.zst"
          rm -rf "$bundle_root" "$archive" "$archive.sha256"
          mkdir -p "$bundle_root"

          rm -rf "$GRADLE_USER_HOME/daemon" "$GRADLE_USER_HOME/workers"
          rm -rf "$PUB_CACHE/_temp"

          cp -a "$FLUTTER_ROOT" "$bundle_root/flutter"
          cp -a "$PUB_CACHE" "$bundle_root/pub-cache"
          cp -a "$GRADLE_USER_HOME" "$bundle_root/gradle-home"

          flutter_tools_dir="$bundle_root/flutter/packages/flutter_tools"
          rm -f "$flutter_tools_dir/.dart_tool/package_config.json"
          rm -f "$flutter_tools_dir/.dart_tool/package_config_subset"
          rm -f "$flutter_tools_dir/.dart_tool/.goanime-portable-root"

          pwsh_root="$(dirname "$(readlink -f "$(command -v pwsh)")")"
          cp -a "$pwsh_root" "$bundle_root/powershell"

          cat > "$bundle_root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          bundle_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export FLUTTER_ROOT="$bundle_root/flutter"
          export PUB_CACHE="$bundle_root/pub-cache"
          export GRADLE_USER_HOME="$bundle_root/gradle-home"
          export PATH="$FLUTTER_ROOT/bin:$bundle_root/powershell:$PATH"
          git_config_index="${GIT_CONFIG_COUNT:-0}"
          export GIT_CONFIG_COUNT="$((git_config_index + 1))"
          export "GIT_CONFIG_KEY_${git_config_index}=safe.directory"
          export "GIT_CONFIG_VALUE_${git_config_index}=$FLUTTER_ROOT"
          export FLUTTER_SUPPRESS_ANALYTICS=true
          export CI=true

          flutter_tools_dir="$FLUTTER_ROOT/packages/flutter_tools"
          portable_stamp="$flutter_tools_dir/.dart_tool/.goanime-portable-root"
          if [[ ! -f "$portable_stamp" ]] || \
             [[ "$(cat "$portable_stamp" 2>/dev/null || true)" != "$bundle_root" ]]; then
            rm -f "$flutter_tools_dir/.dart_tool/package_config.json"
            rm -f "$flutter_tools_dir/.dart_tool/package_config_subset"
            (
              cd "$flutter_tools_dir"
              "$FLUTTER_ROOT/bin/cache/dart-sdk/bin/dart" \
                pub get --offline --example >/dev/null
            ) || {
              echo "Failed to regenerate the portable flutter_tools package config." >&2
              return 1 2>/dev/null || exit 1
            }
            printf '%s\n' "$bundle_root" > "$portable_stamp"
          fi
          EOF
          chmod +x "$bundle_root/activate.sh"

          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "commit=$GITHUB_SHA"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "flutter=$FLUTTER_VERSION"
            echo "hosted_package_count=$(grep -Ev '^(#|$)' "$GOANIME_HOSTED_PACKAGE_MANIFEST" | wc -l | tr -d ' ')"
            echo "media_kit_native=$MEDIA_KIT_NATIVE_VERSION"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            flutter --version
            echo
            sha256sum fixtures/goanime/pubspec.yaml
            sha256sum "$GOANIME_HOSTED_PACKAGE_MANIFEST"
          } > "$bundle_root/MANIFEST.txt"

          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -8' -cf "$archive" goanime-toolchain
          sha256sum "$archive" > "$archive.sha256"

          parts_dir="$RUNNER_TEMP/goanime-flutter-cache-linux-x64-parts"
          rm -rf "$parts_dir"
          mkdir -p "$parts_dir"
          split -b 400M -d -a 2 "$archive" "$parts_dir/goanime-flutter-cache-linux-x64.part-"
          (
            cd "$parts_dir"
            sha256sum goanime-flutter-cache-linux-x64.part-* > SHA256SUMS.parts
          )

          {
            echo "archive=$(basename "$archive")"
            echo "archive_sha256=$(cut -d' ' -f1 "$archive.sha256")"
            echo "part_size=400M"
            echo "reassemble=cat goanime-flutter-cache-linux-x64.part-* > $(basename "$archive")"
            echo
            ls -lh "$parts_dir"/goanime-flutter-cache-linux-x64.part-*
          } > "$parts_dir/PARTS.txt"

          echo "parts_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          echo "manifest_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          for index in $(seq -w 0 15); do
            if [[ -f "$parts_dir/goanime-flutter-cache-linux-x64.part-$index" ]]; then
              echo "part_$index=true" >> "$GITHUB_OUTPUT"
            fi
          done

          ls -lh "$archive" "$archive.sha256" "$parts_dir"/*

      - name: Validate copied bundle offline
        shell: bash
        run: |
          set -euo pipefail

          source "$RUNNER_TEMP/goanime-toolchain/activate.sh"
          project="$RUNNER_TEMP/goanime-fixture"
          cd "$project"

          rm -rf .dart_tool build/media_kit_libs_android_video
          flutter pub get --offline
          flutter analyze --no-pub
          flutter test --no-pub
          pwsh -NoLogo -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

          while IFS= read -r line; do
            [[ -z "$line" || "$line" == \#* ]] && continue
            package="${line%%=*}"
            version="${line#*=}"
            test -d "$PUB_CACHE/hosted/pub.dev/${package}-${version}"
          done < "$GITHUB_WORKSPACE/$GOANIME_HOSTED_PACKAGE_MANIFEST"

          test "$(cat "$FLUTTER_ROOT/packages/flutter_tools/.dart_tool/.goanime-portable-root")" = \
            "$RUNNER_TEMP/goanime-toolchain"

          build_log="$RUNNER_TEMP/goanime-offline-apk.log"
          GRADLE_OPTS="${GRADLE_OPTS:-} -Dorg.gradle.offline=true" \
            flutter build apk --debug --no-pub 2>&1 | tee "$build_log"
          if grep -Fq 'Downloading file from:' "$build_log"; then
            echo 'Offline validation attempted an external media_kit download.' >&2
            exit 1
          fi
          test -f build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload GoAnime bundle manifest
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-manifest
          path: |
            ${{ steps.bundle.outputs.manifest_dir }}/PARTS.txt
            ${{ steps.bundle.outputs.manifest_dir }}/SHA256SUMS.parts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 00
        if: steps.bundle.outputs.part_00 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-00
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 01
        if: steps.bundle.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-01
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 02
        if: steps.bundle.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-02
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 03
        if: steps.bundle.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-03
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 04
        if: steps.bundle.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-04
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 05
        if: steps.bundle.outputs.part_05 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-05
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 06
        if: steps.bundle.outputs.part_06 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-06
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload GoAnime bundle part 07
        if: steps.bundle.outputs.part_07 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-flutter-cache-linux-x64-part-07
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-07
          if-no-files-found: error
