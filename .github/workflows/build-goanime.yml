        with:
          name: goanime-flutter-cache-linux-x64-part-15
          path: ${{ steps.bundle.outputs.parts_dir }}/goanime-flutter-cache-linux-x64.part-15
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
