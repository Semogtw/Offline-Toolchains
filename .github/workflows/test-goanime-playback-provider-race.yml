name: GoAnime playback provider race TDD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-goanime-playback-provider-race.yml'

permissions:
  contents: read

concurrency:
  group: goanime-playback-provider-race
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout GoAnime playback race branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: fix/playback-provider-race-20260825
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify expected source
        working-directory: private-source
        shell: bash
        run: test "$(git rev-parse HEAD)" = '801a8542b18ed007c46d2b8cd0cbf03180ace4fe'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Check formatting
        working-directory: private-source
        shell: bash
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/video_playback_resolver.dart
          lib/services/playback_provider_enrichment_service.dart
          lib/platform/mobile/screens/mobile_media_kit_video_player_screen.dart
          lib/platform/mobile/screens/mobile_media_kit_video_player_screen_methods_1.dart
          lib/platform/mobile/screens/mobile_media_kit_video_player_screen_methods_3.dart
          lib/platform/desktop/screens/desktop_video_player_screen.dart
          lib/platform/desktop/screens/desktop_video_player_screen_methods_2.dart
          lib/platform/desktop/screens/desktop_video_player_screen_methods_4.dart
          test/services/video_playback_resolver_late_provider_test.dart
          test/services/playback_provider_enrichment_service_test.dart

      - name: Analyze changed libraries
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart analyze lib/services/video_playback_resolver.dart
          dart analyze lib/services/playback_provider_enrichment_service.dart
          dart analyze lib/platform/mobile/screens/mobile_media_kit_video_player_screen.dart
          dart analyze lib/platform/desktop/screens/desktop_video_player_screen.dart

      - name: Run playback provider race regression tests
        working-directory: private-source
        shell: bash
        run: >-
          flutter test --no-pub
          test/services/video_playback_resolver_test.dart
          test/services/video_playback_resolver_late_provider_test.dart
          test/services/playback_provider_enrichment_service_test.dart
          test/screens/mobile_player_resolution_cancellation_contract_test.dart
          test/screens/desktop_player_resolution_cancellation_contract_test.dart
