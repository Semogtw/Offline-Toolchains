name: Verify GoAnime R2 retention
on:
  workflow_dispatch:
  push:
    paths:
      - 'triggers/goanime-r2-cleanup/*.request'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --user boto3
      - run: python3 -m py_compile scripts/goanime-release/prune_r2.py
