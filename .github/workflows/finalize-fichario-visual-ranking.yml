name: Finalize Fichario visual ranking safely

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-fichario-visual-ranking.yml

permissions:
  contents: read

concurrency:
  group: finalize-fichario-visual-ranking
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted toolchains
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Require repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Fichario calibration branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: fix/visual-rrf-calibration
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: fichario
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: fichario/pnpm-lock.yaml

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.8.1

      - name: Install frozen dependencies
        working-directory: fichario
        run: pnpm install --frozen-lockfile

      - name: Apply final ranking and benchmark corrections
        working-directory: fichario
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          ranking = root / 'supabase/functions/_shared/semantic-ranking.ts'
          ranking.write_text("""import {
          \tSEMANTIC_RRF_BOTH_BONUS,
          \tSEMANTIC_RRF_EXACT_LEXICAL_GUARD_BONUS,
          \tSEMANTIC_RRF_K,
          \tSEMANTIC_RRF_LEXICAL_WEIGHT,
          \tSEMANTIC_RRF_VECTOR_WEIGHT,
          \tSEMANTIC_RRF_VISUAL_BONUS,
          \tSEMANTIC_RRF_VISUAL_CONFIDENCE_MARGIN_CAP,
          \tSEMANTIC_RRF_VISUAL_CONFIDENCE_WEIGHT,
          \tSEMANTIC_RRF_VISUAL_WEIGHT,
          \tSEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY
          } from './semantic-config.ts';

          export type HybridRankingSignal = Readonly<{
          \tlexicalRank: number | null;
          \tsemanticRank: number | null;
          \tsemanticSimilarity?: number | null;
          }>;

          export type MultimodalRankingSignal = HybridRankingSignal &
          \tReadonly<{
          \t\tvisualRank: number | null;
          \t\tvisualSimilarity?: number | null;
          \t}>;

          export type MultimodalRankingOptions = Readonly<{
          \tvisualChannelActive?: boolean;
          }>;

          type StableHybridRankingSignal = HybridRankingSignal & { stableKey: string };
          type StableMultimodalRankingSignal = MultimodalRankingSignal & { stableKey: string };

          function reciprocalRank(rank: number | null, weight: number) {
          \tif (rank === null || !Number.isFinite(rank) || rank < 1) return 0;
          \treturn weight / (SEMANTIC_RRF_K + rank);
          }

          function boundedSimilarity(value: number | null | undefined) {
          \treturn Math.max(0, Math.min(1, value ?? 0));
          }

          export function hybridReciprocalRankScore(signal: HybridRankingSignal) {
          \tconst lexical = reciprocalRank(signal.lexicalRank, SEMANTIC_RRF_LEXICAL_WEIGHT);
          \tconst semantic = reciprocalRank(signal.semanticRank, SEMANTIC_RRF_VECTOR_WEIGHT);
          \tconst both =
          \t\tsignal.lexicalRank !== null && signal.semanticRank !== null ? SEMANTIC_RRF_BOTH_BONUS : 0;
          \tconst similarityTieBreak = boundedSimilarity(signal.semanticSimilarity) * 0.0001;
          \treturn lexical + semantic + both + similarityTieBreak;
          }

          /**
           * Visual evidence complements the textual RRF without adding correlated OCR
           * and image scores twice. A text+visual candidate receives the stronger channel
           * plus a small corroboration bonus. Pure visual candidates retain their visual
           * score. Confidence is bounded to the measured staging calibration window.
           * Exact lexical rank one is guarded only while visual ranking is active, which
           * leaves the legacy two-channel score byte-for-byte equivalent in off/shadow.
           */
          export function multimodalReciprocalRankScore(
          \tsignal: MultimodalRankingSignal,
          \toptions: MultimodalRankingOptions = {}
          ) {
          \tconst base = hybridReciprocalRankScore(signal);
          \tconst lexicalGuard =
          \t\toptions.visualChannelActive === true && signal.lexicalRank === 1
          \t\t\t? SEMANTIC_RRF_EXACT_LEXICAL_GUARD_BONUS
          \t\t\t: 0;
          \tif (signal.visualRank === null) return base + lexicalGuard;

          \tconst similarity = boundedSimilarity(signal.visualSimilarity);
          \tconst confidenceMargin = Math.min(
          \t\tSEMANTIC_RRF_VISUAL_CONFIDENCE_MARGIN_CAP,
          \t\tMath.max(0, similarity - SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY)
          \t);
          \tconst confidence = confidenceMargin * SEMANTIC_RRF_VISUAL_CONFIDENCE_WEIGHT;
          \tconst visual =
          \t\treciprocalRank(signal.visualRank, SEMANTIC_RRF_VISUAL_WEIGHT) +
          \t\tconfidence +
          \t\tsimilarity * 0.00002;
          \tconst hasTextSignal = signal.lexicalRank !== null || signal.semanticRank !== null;
          \tif (!hasTextSignal) return visual;
          \treturn Math.max(base + lexicalGuard, visual) + SEMANTIC_RRF_VISUAL_BONUS;
          }

          export function compareHybridRanked(a: StableHybridRankingSignal, b: StableHybridRankingSignal) {
          \tconst scoreDelta = hybridReciprocalRankScore(b) - hybridReciprocalRankScore(a);
          \tif (Math.abs(scoreDelta) > Number.EPSILON) return scoreDelta;
          \treturn a.stableKey.localeCompare(b.stableKey);
          }

          export function compareMultimodalRanked(
          \ta: StableMultimodalRankingSignal,
          \tb: StableMultimodalRankingSignal,
          \toptions: MultimodalRankingOptions = {}
          ) {
          \tconst scoreDelta =
          \t\tmultimodalReciprocalRankScore(b, options) - multimodalReciprocalRankScore(a, options);
          \tif (Math.abs(scoreDelta) > Number.EPSILON) return scoreDelta;
          \treturn a.stableKey.localeCompare(b.stableKey);
          }
          """, encoding='utf-8')

          search = root / 'supabase/functions/semantic-search/index.ts'
          text = search.read_text(encoding='utf-8')
          old = """function scoreCandidate(candidate: SearchCandidate) {
          \tcandidate.matchMode = matchMode(candidate);
          \tcandidate.score = multimodalReciprocalRankScore({
          \t\tlexicalRank: candidate.lexicalPosition,
          \t\tsemanticRank: candidate.semanticPosition,
          \t\tsemanticSimilarity: candidate.semanticSimilarity,
          \t\tvisualRank: candidate.visualPosition,
          \t\tvisualSimilarity: candidate.visualSimilarity
          \t});
          }
          """
          new = """function scoreCandidate(candidate: SearchCandidate, visualChannelActive = false) {
          \tcandidate.matchMode = matchMode(candidate);
          \tcandidate.score = multimodalReciprocalRankScore(
          \t\t{
          \t\t\tlexicalRank: candidate.lexicalPosition,
          \t\t\tsemanticRank: candidate.semanticPosition,
          \t\t\tsemanticSimilarity: candidate.semanticSimilarity,
          \t\t\tvisualRank: candidate.visualPosition,
          \t\t\tvisualSimilarity: candidate.visualSimilarity
          \t\t},
          \t\t{ visualChannelActive }
          \t);
          }
          """
          if old not in text:
              raise SystemExit('scoreCandidate context did not match')
          text = text.replace(old, new, 1)

          old = """\tvisual.forEach((row, index) => {
          \t\tif (row.visual_similarity < SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY) return;
          """
          new = """\tconst visualChannelActive = visual.some(
          \t\t(row) => row.visual_similarity >= SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY
          \t);

          \tvisual.forEach((row, index) => {
          \t\tif (row.visual_similarity < SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY) return;
          """
          if old not in text:
              raise SystemExit('visual loop context did not match')
          text = text.replace(old, new, 1)

          old = """\treturn [...merged.values()].sort((left, right) =>
          \t\tcompareMultimodalRanked(
          """
          new = """\tfor (const candidate of merged.values()) scoreCandidate(candidate, visualChannelActive);

          \treturn [...merged.values()].sort((left, right) =>
          \t\tcompareMultimodalRanked(
          """
          if old not in text:
              raise SystemExit('final rescore context did not match')
          text = text.replace(old, new, 1)

          old = """\t\t\t{
          \t\t\t\tlexicalRank: right.lexicalPosition,
          \t\t\t\tsemanticRank: right.semanticPosition,
          \t\t\t\tsemanticSimilarity: right.semanticSimilarity,
          \t\t\t\tvisualRank: right.visualPosition,
          \t\t\t\tvisualSimilarity: right.visualSimilarity,
          \t\t\t\tstableKey: right.stableKey
          \t\t\t}
          \t\t)
          \t);
          }
          """
          new = """\t\t\t{
          \t\t\t\tlexicalRank: right.lexicalPosition,
          \t\t\t\tsemanticRank: right.semanticPosition,
          \t\t\t\tsemanticSimilarity: right.semanticSimilarity,
          \t\t\t\tvisualRank: right.visualPosition,
          \t\t\t\tvisualSimilarity: right.visualSimilarity,
          \t\t\t\tstableKey: right.stableKey
          \t\t\t},
          \t\t\t{ visualChannelActive }
          \t\t)
          \t);
          }
          """
          if old not in text:
              raise SystemExit('compare context did not match')
          search.write_text(text.replace(old, new, 1), encoding='utf-8')

          benchmark_test = root / 'tests/unit/search/visual-semantic-benchmark.test.ts'
          text = benchmark_test.read_text(encoding='utf-8')
          old = """import {
          \thybridReciprocalRankScore,
          \tmultimodalReciprocalRankScore
          } from '../../../supabase/functions/_shared/semantic-ranking';"""
          new = """import {
          \tcompareMultimodalRanked,
          \thybridReciprocalRankScore
          } from '../../../supabase/functions/_shared/semantic-ranking';"""
          if old not in text:
              raise SystemExit('benchmark import context did not match')
          text = text.replace(old, new, 1)
          old = """function top(candidates: readonly Candidate[], visual: boolean) {
          \treturn [...candidates]
          \t\t.sort((left, right) => {
          \t\t\tconst leftScore = visual
          \t\t\t\t? multimodalReciprocalRankScore(left)
          \t\t\t\t: hybridReciprocalRankScore(left);
          \t\t\tconst rightScore = visual
          \t\t\t\t? multimodalReciprocalRankScore(right)
          \t\t\t\t: hybridReciprocalRankScore(right);
          \t\t\tconst delta = rightScore - leftScore;
          \t\t\treturn Math.abs(delta) > Number.EPSILON ? delta : left.id.localeCompare(right.id);
          \t\t})
          \t\t.at(0)?.id;
          }
          """
          new = """function top(candidates: readonly Candidate[], visual: boolean) {
          \treturn [...candidates]
          \t\t.sort((left, right) => {
          \t\t\tif (visual) {
          \t\t\t\treturn compareMultimodalRanked(
          \t\t\t\t\t{ ...left, stableKey: left.id },
          \t\t\t\t\t{ ...right, stableKey: right.id },
          \t\t\t\t\t{ visualChannelActive: true }
          \t\t\t\t);
          \t\t\t}
          \t\t\tconst delta = hybridReciprocalRankScore(right) - hybridReciprocalRankScore(left);
          \t\t\treturn Math.abs(delta) > Number.EPSILON ? delta : left.id.localeCompare(right.id);
          \t\t})
          \t\t.at(0)?.id;
          }
          """
          if old not in text:
              raise SystemExit('benchmark top context did not match')
          benchmark_test.write_text(text.replace(old, new, 1), encoding='utf-8')

          benchmark = root / 'tools/checks/check-visual-semantic-staging.mjs'
          text = benchmark.read_text(encoding='utf-8')
          old = "const PNG_SIG = Uint8Array.from([137, 80, 78, 71, 13, 10, 26, 10]);\n\nfunction env(name) {"
          new = """const PNG_SIG = Uint8Array.from([137, 80, 78, 71, 13, 10, 26, 10]);
          const SEMANTIC_CONFIG_SOURCE = await readFile(
          \tnew URL('../../supabase/functions/_shared/semantic-config.ts', import.meta.url),
          \t'utf8'
          );
          const VISUAL_THRESHOLD_MATCH = SEMANTIC_CONFIG_SOURCE.match(
          \t/SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY\\s*=\\s*([0-9.]+)/u
          );
          if (!VISUAL_THRESHOLD_MATCH) throw new Error('Could not resolve visual similarity threshold');
          const VISUAL_THRESHOLD = Number(VISUAL_THRESHOLD_MATCH[1]);
          if (!Number.isFinite(VISUAL_THRESHOLD)) throw new Error('Invalid visual similarity threshold');

          function env(name) {"""
          if old not in text:
              raise SystemExit('benchmark threshold context did not match')
          text = text.replace(old, new, 1)
          text = text.replace('function patternPng(kind) {', 'function patternPng(kind, runNonce) {', 1)

          old = """\treturn Uint8Array.from(
          \t\tBuffer.concat([
          \t\t\tBuffer.from(PNG_SIG),
          \t\t\tchunk('IHDR', ihdr),
          \t\t\tchunk('IDAT', deflateSync(scan)),
          \t\t\tchunk('IEND', Buffer.alloc(0))
          \t\t])
          \t);
          }"""
          new = """\tconst benchmarkMetadata = Buffer.from(`benchmark-run\\0${runNonce}`, 'utf8');
          \treturn Uint8Array.from(
          \t\tBuffer.concat([
          \t\t\tBuffer.from(PNG_SIG),
          \t\t\tchunk('IHDR', ihdr),
          \t\t\tchunk('tEXt', benchmarkMetadata),
          \t\t\tchunk('IDAT', deflateSync(scan)),
          \t\t\tchunk('IEND', Buffer.alloc(0))
          \t\t])
          \t);
          }"""
          if old not in text:
              raise SystemExit('PNG serialization context did not match')
          text = text.replace(old, new, 1)

          old = """\t\trawVisualExpectedAboveCurrentThreshold: visual.filter(
          \t\t\t(r) =>
          \t\t\t\ttypeof r.rawVisualExpectedSimilarity === 'number' && r.rawVisualExpectedSimilarity >= 0.5
          \t\t).length,
          \t\trawVisualRpcErrors: rows.filter((r) => r.rawVisualError).length,"""
          new = """\t\tvisualSimilarityThreshold: VISUAL_THRESHOLD,
          \t\trawVisualExpectedAboveCurrentThreshold: visual.filter(
          \t\t\t(r) =>
          \t\t\t\ttypeof r.rawVisualExpectedSimilarity === 'number' &&
          \t\t\t\tr.rawVisualExpectedSimilarity >= VISUAL_THRESHOLD
          \t\t).length,
          \t\trawVisualNegativeAboveThresholdCount: negatives.reduce(
          \t\t\t(sum, row) =>
          \t\t\t\tsum +
          \t\t\t\trow.rawVisualCandidates.filter(
          \t\t\t\t\t(candidate) =>
          \t\t\t\t\t\ttypeof candidate.similarity === 'number' && candidate.similarity >= VISUAL_THRESHOLD
          \t\t\t\t).length,
          \t\t\t0
          \t\t),
          \t\trawVisualRpcErrors: rows.filter((r) => r.rawVisualError).length,"""
          if old not in text:
              raise SystemExit('benchmark metric context did not match')
          text = text.replace(old, new, 1)

          old = """\tconst state = { notebookId, probes: [], jpegSmoke: null };
          \tawait writeFile(statePath, JSON.stringify(state));
          \tfor (const [id, bytes] of [
          \t\t['lexical', createOcrProbePng(`visual-${randomUUID()}`)],
          \t\t['table', patternPng('table')],
          \t\t['flow', patternPng('flow')],
          \t\t['bar', patternPng('bar')],
          \t\t['line', patternPng('line')],
          \t\t['pie', patternPng('pie')],
          \t\t['checklist', patternPng('checklist')],
          \t\t['calendar', patternPng('calendar')],
          \t\t['form', patternPng('form')],
          \t\t['mindmap', patternPng('mindmap')],
          \t\t['timeline', patternPng('timeline')],
          \t\t['venn', patternPng('venn')],
          \t\t['hierarchy', patternPng('hierarchy')],
          \t\t['kanban', patternPng('kanban')],
          \t\t['route', patternPng('route')]
          \t]) {"""
          new = """\tconst runNonce = randomUUID();
          \tconst state = { notebookId, runNonce, probes: [], jpegSmoke: null };
          \tawait writeFile(statePath, JSON.stringify(state));
          \tfor (const [id, bytes] of [
          \t\t['lexical', createOcrProbePng(`visual-${runNonce}-${randomUUID()}`)],
          \t\t['table', patternPng('table', runNonce)],
          \t\t['flow', patternPng('flow', runNonce)],
          \t\t['bar', patternPng('bar', runNonce)],
          \t\t['line', patternPng('line', runNonce)],
          \t\t['pie', patternPng('pie', runNonce)],
          \t\t['checklist', patternPng('checklist', runNonce)],
          \t\t['calendar', patternPng('calendar', runNonce)],
          \t\t['form', patternPng('form', runNonce)],
          \t\t['mindmap', patternPng('mindmap', runNonce)],
          \t\t['timeline', patternPng('timeline', runNonce)],
          \t\t['venn', patternPng('venn', runNonce)],
          \t\t['hierarchy', patternPng('hierarchy', runNonce)],
          \t\t['kanban', patternPng('kanban', runNonce)],
          \t\t['route', patternPng('route', runNonce)]
          \t]) {"""
          if old not in text:
              raise SystemExit('benchmark corpus context did not match')
          text = text.replace(old, new, 1)

          old = """\t\tmetrics: metric(observations),
          \t\tquotaSignalObserved: observations.some((r) => r.reason === 'semantic_quota_or_rate_limit'),
          \t\tpricing:"""
          new = """\t\tmetrics: metric(observations),
          \t\tvisualSimilarityThreshold: VISUAL_THRESHOLD,
          \t\tquotaSignalObserved: observations.some((r) => r.reason === 'semantic_quota_or_rate_limit'),
          \t\tpricing:"""
          if old not in text:
              raise SystemExit('shadow report context did not match')
          text = text.replace(old, new, 1)

          old = """\t\tobservations,
          \t\tmetrics: metric(observations),
          \t\tquotaSignalObserved: observations.some((r) => r.reason === 'semantic_quota_or_rate_limit')
          \t};"""
          new = """\t\tobservations,
          \t\tmetrics: metric(observations),
          \t\tvisualSimilarityThreshold: VISUAL_THRESHOLD,
          \t\tquotaSignalObserved: observations.some((r) => r.reason === 'semantic_quota_or_rate_limit')
          \t};"""
          if old not in text:
              raise SystemExit('active report context did not match')
          text = text.replace(old, new, 1)

          old = """\tconst gates = {
          \t\tnoQuotaSignal: !shadow.quotaSignalObserved && !active.quotaSignalObserved,
          \t\tnoSearchRetries: shadow.metrics.searchRetries === 0 && active.metrics.searchRetries === 0,
          \t\tnoRecallRegression: active.metrics.recallAt3 >= shadow.metrics.recallAt3,
          \t\tvisualImproved: active.metrics.visualMrr >= shadow.metrics.visualMrr + 0.05,
          \t\tlexicalPreserved: active.metrics.lexicalTop,
          \t\tnegativeNotWorse: active.metrics.negativeCount <= shadow.metrics.negativeCount,
          \t\tlatencyAcceptable:"""
          new = """\tconst gates = {
          \t\tnoQuotaSignal: !shadow.quotaSignalObserved && !active.quotaSignalObserved,
          \t\tnoSearchRetries: shadow.metrics.searchRetries === 0 && active.metrics.searchRetries === 0,
          \t\tnoVisualRpcErrors:
          \t\t\tshadow.metrics.rawVisualRpcErrors === 0 && active.metrics.rawVisualRpcErrors === 0,
          \t\tnoRecallRegression: active.metrics.recallAt3 >= shadow.metrics.recallAt3,
          \t\tvisualImproved: active.metrics.visualMrr >= shadow.metrics.visualMrr + 0.05,
          \t\tvisualTop1Quality: active.metrics.visualRecallAt1 >= 0.8,
          \t\tvisualMrrQuality: active.metrics.visualMrr >= 0.8,
          \t\tlexicalPreserved: active.metrics.lexicalTop,
          \t\tnoNegativeVisualThresholdHits: active.metrics.rawVisualNegativeAboveThresholdCount === 0,
          \t\tnegativeNotWorse: active.metrics.negativeCount <= shadow.metrics.negativeCount,
          \t\tlatencyAcceptable:"""
          if old not in text:
              raise SystemExit('comparison gate context did not match')
          benchmark.write_text(text.replace(old, new, 1), encoding='utf-8')

          for obsolete in (
              '.github/workflows/run-visual-staging-now.yml',
              '.github/workflows/diagnose-visual15-shadow-now.yml',
              '.github/workflows/cleanup-visual15-residue-now.yml',
              '.github/workflows/check-visual-rrf-calibration.yml',
          ):
              (root / obsolete).unlink(missing_ok=True)

          contract = root / 'tests/unit/tooling/visual-staging-benchmark-contract.test.ts'
          contract.write_text("""import { existsSync, readFileSync } from 'node:fs';
          import { describe, expect, it } from 'vitest';

          const script = readFileSync('tools/checks/check-visual-semantic-staging.mjs', 'utf8');
          const workflow = readFileSync('.github/workflows/verify-adaptive-visual-staging.yml', 'utf8');

          describe('visual staging benchmark contract', () => {
          \tit('keeps one canonical post-deploy visual benchmark workflow', () => {
          \t\texpect(workflow).toContain('workflows: [Deploy Supabase staging]');
          \t\texpect(workflow).toContain('check-visual-semantic-staging.mjs');
          \t\texpect(workflow).toContain('SEMANTIC_VISUAL_MODE=shadow');
          \t\tfor (const obsolete of [
          \t\t\t'.github/workflows/run-visual-staging-now.yml',
          \t\t\t'.github/workflows/diagnose-visual15-shadow-now.yml',
          \t\t\t'.github/workflows/cleanup-visual15-residue-now.yml',
          \t\t\t'.github/workflows/check-visual-rrf-calibration.yml'
          \t\t]) expect(existsSync(obsolete), obsolete).toBe(false);
          \t});

          \tit('makes synthetic PNG identities unique without changing their visual geometry', () => {
          \t\texpect(script).toContain('function patternPng(kind, runNonce)');
          \t\texpect(script).toContain("chunk('tEXt', benchmarkMetadata)");
          \t\texpect(script).toContain('const runNonce = randomUUID()');
          \t});

          \tit('uses the production threshold and enforces top-one and negative safety', () => {
          \t\texpect(script).toContain('SEMANTIC_VISUAL_SEARCH_MIN_SIMILARITY');
          \t\texpect(script).toContain('r.rawVisualExpectedSimilarity >= VISUAL_THRESHOLD');
          \t\texpect(script).toContain('visualTop1Quality: active.metrics.visualRecallAt1 >= 0.8');
          \t\texpect(script).toContain('visualMrrQuality: active.metrics.visualMrr >= 0.8');
          \t\texpect(script).toContain('noNegativeVisualThresholdHits');
          \t});
          });
          """, encoding='utf-8')

          config = (root / 'supabase/functions/_shared/semantic-config.ts').read_text(encoding='utf-8')
          for required in (
              'SEMANTIC_RRF_VISUAL_WEIGHT = 0.475',
              'SEMANTIC_RRF_VISUAL_CONFIDENCE_WEIGHT = 0.04',
              'SEMANTIC_RRF_VISUAL_CONFIDENCE_MARGIN_CAP = 0.1',
              'SEMANTIC_RRF_EXACT_LEXICAL_GUARD_BONUS = 0.0045',
          ):
              if required not in config:
                  raise SystemExit(f'missing calibrated config: {required}')
          PY

      - name: Format changed files
        working-directory: fichario
        run: |
          pnpm exec prettier --write \
            supabase/functions/_shared/semantic-ranking.ts \
            supabase/functions/semantic-search/index.ts \
            tests/unit/search/visual-semantic-benchmark.test.ts \
            tests/unit/tooling/visual-staging-benchmark-contract.test.ts \
            tools/checks/check-visual-semantic-staging.mjs

      - name: Run focused visual tests
        working-directory: fichario
