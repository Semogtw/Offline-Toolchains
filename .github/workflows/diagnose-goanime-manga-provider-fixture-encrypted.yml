name: Diagnose GoAnime manga provider fixture encrypted

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-provider-fixture-diagnostic/*.request'

permissions:
  contents: read

jobs:
  diagnose:
    name: GoAnime manga provider fixture encrypted diagnostic
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-provider-fixture-diagnostic/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = "goanime"
          test "$branch" = "feature/manga-platform"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies privately
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Capture provider fixture diagnostic
        id: encrypt
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/goanime-provider-fixture-diagnostic"
          plain="$root/plain"
          transfer="$root/transfer"
          archive="$root/diagnostic.tar.zst"
          gpg_home="$root/gpg"
          rm -rf "$root"
          mkdir -p "$plain" "$transfer" "$gpg_home"
          chmod 700 "$gpg_home"

          set +e
          flutter test --no-pub test/services/manga/providers/astratoons_manga_provider_test.dart >"$plain/astratoons.log" 2>&1
          test_status=$?
          dart format --output=none --set-exit-if-changed lib/services/manga/providers/astratoons_manga_provider.dart test/services/manga/providers/astratoons_manga_provider_test.dart >"$plain/format.log" 2>&1
          format_status=$?
          set -e
          printf 'astratoons=%s\nformat=%s\n' "$test_status" "$format_status" > "$plain/STATUS.txt"
          tar -C "$plain" -I 'zstd -T0 -6' -cf "$archive" .

          export GNUPGHOME="$gpg_home"
          gpg --batch --import "$GITHUB_WORKSPACE/toolchain-control/keys/source-bundles-public.asc" >/dev/null 2>&1
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$transfer/astratoons-fixture.gpg" --encrypt "$archive"
          sha256sum "$transfer/astratoons-fixture.gpg" > "$transfer/SHA256SUMS"

          rm -rf "$plain" "$archive" "$gpg_home" "$GITHUB_WORKSPACE/private-source"
          echo "transfer=$transfer" >> "$GITHUB_OUTPUT"
          echo "encrypted_diagnostic=success"

      - name: Upload ciphertext only
        uses: actions/upload-artifact@v7
        with:
          name: goanime-manga-provider-fixture-diagnostic
          path: ${{ steps.encrypt.outputs.transfer }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Remove transient data
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control" "$RUNNER_TEMP/goanime-provider-fixture-diagnostic"
