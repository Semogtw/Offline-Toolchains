name: Build Codex offline toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - triggers/codex-toolchain.json

permissions:
  contents: read

concurrency:
  group: codex-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Rust 1.95, Cargo cache, Ruff and native headers
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Checkout toolchain definitions
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Test and resolve requested Codex source
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest scripts.tests.test_resolve_codex_toolchain_trigger
          python3 scripts/resolve_codex_toolchain_trigger.py \
            triggers/codex-toolchain.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Checkout requested Codex fork ref
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.target.outputs.repository }}
          ref: ${{ steps.target.outputs.ref }}
          path: codex-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record exact checked source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          commit="$(git -C codex-source rev-parse HEAD)"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'requested_ref=%s\n' '${{ steps.target.outputs.ref }}' >> "$GITHUB_OUTPUT"
          if [[ '${{ steps.target.outputs.ref }}' =~ ^[0-9a-fA-F]{40}$ ]]; then
            test "${commit,,}" = "${{ steps.target.outputs.ref }}"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.3"
          enable-cache: false

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang cmake libcap-dev libseccomp-dev \
            libsqlite3-dev libssl-dev pkg-config protobuf-compiler zstd

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.95.0 --profile minimal \
            --component clippy --component rustfmt --component rust-src
          rustup default 1.95.0
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version

      - name: Install pinned just
        uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532
        with:
          tool: just@1.51.0
          checksum: true

      - name: Hydrate public Codex dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --project codex-source/scripts
          codex-source/scripts/.venv/bin/ruff --version
          (
            cd codex-source/codex-rs
            cargo fetch --locked
          )

      - name: Build portable bundle
        id: bundle
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="$RUNNER_TEMP/codex-toolchain"
          archive="$RUNNER_TEMP/codex-toolchain-linux-x64.tar.zst"
          parts_dir="$RUNNER_TEMP/codex-toolchain-linux-x64-parts"
          native_root="$bundle_root/native"
          native_include="$native_root/usr/include"
          native_arch_include="$native_include/x86_64-linux-gnu"
          native_lib="$native_root/usr/lib/x86_64-linux-gnu"
          codex_commit="$(git -C codex-source rev-parse HEAD)"
          codex_ref='${{ steps.target.outputs.ref }}'
          codex_repository='${{ steps.target.outputs.repository }}'

          rm -rf "$bundle_root" "$archive" "$archive.sha256" "$parts_dir"
          mkdir -p \
            "$bundle_root/tools/bin" \
            "$native_root/usr/bin" \
            "$native_include" \
            "$native_arch_include" \
            "$native_lib/pkgconfig" \
            "$parts_dir"

          cp -a "$HOME/.rustup" "$bundle_root/rustup"
          cp -a "$HOME/.cargo" "$bundle_root/cargo"
          install -m 0755 "$(command -v uv)" "$bundle_root/tools/bin/uv"
          install -m 0755 "$(command -v just)" "$bundle_root/tools/bin/just"
          install -m 0755 codex-source/scripts/.venv/bin/ruff "$bundle_root/tools/bin/ruff"
          install -m 0755 "$(command -v protoc)" "$native_root/usr/bin/protoc"

          for header in \
            /usr/include/seccomp.h \
            /usr/include/sqlite3.h \
            /usr/include/sqlite3ext.h \
            /usr/include/sys/capability.h; do
            if [[ -f "$header" ]]; then
              install -D -m 0644 "$header" "$native_root$header"
            fi
          done
          if [[ -d /usr/include/openssl ]]; then
            cp -a /usr/include/openssl "$native_include/openssl"
          fi
          if [[ -d /usr/include/x86_64-linux-gnu/openssl ]]; then
            cp -a /usr/include/x86_64-linux-gnu/openssl "$native_arch_include/openssl"
          fi

          shopt -s nullglob
          for library in \
            /usr/lib/x86_64-linux-gnu/libcap.so* \
            /usr/lib/x86_64-linux-gnu/libseccomp.so* \
            /usr/lib/x86_64-linux-gnu/libsqlite3.so* \
            /usr/lib/x86_64-linux-gnu/libssl.so* \
            /usr/lib/x86_64-linux-gnu/libcrypto.so* \
            /usr/lib/x86_64-linux-gnu/libprotobuf.so* \
            /usr/lib/x86_64-linux-gnu/libprotoc.so*; do
            cp -a "$library" "$native_lib/"
          done
          for metadata in \
            /usr/lib/x86_64-linux-gnu/pkgconfig/libcap.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/libseccomp.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/sqlite3.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/openssl.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/libssl.pc \
            /usr/lib/x86_64-linux-gnu/pkgconfig/libcrypto.pc; do
            if [[ -f "$metadata" ]]; then
              cp -a "$metadata" "$native_lib/pkgconfig/"
            fi
          done
          while read -r dependency; do
            case "$dependency" in
              /lib/x86_64-linux-gnu/libc.so.*|/lib64/ld-linux-x86-64.so.*)
                ;;
              /lib/*|/usr/lib/*)
                cp -aL "$dependency" "$native_lib/"
                ;;
            esac
          done < <(ldd "$(command -v protoc)" | awk '/=> \// {print $3}')

          cat > "$bundle_root/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          bundle_root="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          native_root="$bundle_root/native"
          native_include="$native_root/usr/include"
          native_arch_include="$native_include/x86_64-linux-gnu"
          native_lib="$native_root/usr/lib/x86_64-linux-gnu"
          export RUSTUP_HOME="$bundle_root/rustup"
          export CARGO_HOME="$bundle_root/cargo"
          export PATH="$bundle_root/tools/bin:$native_root/usr/bin:$CARGO_HOME/bin:$PATH"
          export CPATH="$native_arch_include:$native_include${CPATH:+:$CPATH}"
          export LIBRARY_PATH="$native_lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LD_LIBRARY_PATH="$native_lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PKG_CONFIG_PATH="$native_lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export CARGO_NET_OFFLINE=true
          export CARGO_NET_GIT_FETCH_WITH_CLI=true
          export RUST_BACKTRACE=1
          export PYTHONUTF8=1
          EOF
          chmod +x "$bundle_root/activate.sh"

          source "$bundle_root/activate.sh"
          rustup default 1.95.0

          cat > "$RUNNER_TEMP/openssl-smoke.c" <<'EOF'
          #include <openssl/opensslv.h>
          #include <openssl/ssl.h>
          int main(void) {
              return OPENSSL_VERSION_MAJOR < 3 || TLS_method() == 0;
          }
          EOF
          cc "$RUNNER_TEMP/openssl-smoke.c" -o "$RUNNER_TEMP/openssl-smoke" \
            $(pkg-config --cflags --libs openssl)
          "$RUNNER_TEMP/openssl-smoke"

          {
            echo "schema_version=2"
            echo "repository=$GITHUB_REPOSITORY"
            echo "workflow_commit=$GITHUB_SHA"
            echo "codex_repository=$codex_repository"
            echo "codex_ref=$codex_ref"
            echo "codex_commit=$codex_commit"
            echo "runner=$RUNNER_OS-$RUNNER_ARCH"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            rustc --version
            cargo --version
            cargo clippy --version
            cargo fmt --version
            ruff --version
            uv --version
            just --version
            protoc --version
            pkg-config --modversion openssl
          } > "$bundle_root/MANIFEST.txt"

          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
          ruff --version
          uv --version
          just --version
          protoc --version
          (
            cd codex-source/codex-rs
            cargo fetch --locked --offline
            cargo metadata --locked --offline --no-deps >/dev/null
          )

          tar -C "$RUNNER_TEMP" -I 'zstd -T0 -8' -cf "$archive" codex-toolchain
          sha256sum "$archive" > "$archive.sha256"
          split -b 400M -d -a 2 "$archive" "$parts_dir/codex-toolchain-linux-x64.part-"
          (
            cd "$parts_dir"
            sha256sum codex-toolchain-linux-x64.part-* > SHA256SUMS.parts
          )
          part_count="$(find "$parts_dir" -maxdepth 1 -type f -name 'codex-toolchain-linux-x64.part-*' | wc -l)"
          test "$part_count" -ge 1
          test "$part_count" -le 8

          {
            echo "archive=$(basename "$archive")"
            echo "archive_sha256=$(cut -d' ' -f1 "$archive.sha256")"
            echo "codex_repository=$codex_repository"
            echo "codex_ref=$codex_ref"
            echo "codex_commit=$codex_commit"
            echo "part_count=$part_count"
            echo "part_size=400M"
            echo "reassemble=cat codex-toolchain-linux-x64.part-* > $(basename "$archive")"
            echo
            ls -lh "$parts_dir"/codex-toolchain-linux-x64.part-*
          } > "$parts_dir/PARTS.txt"

          echo "parts_dir=$parts_dir" >> "$GITHUB_OUTPUT"
          for index in $(seq -f '%02g' 0 7); do
            if [[ -f "$parts_dir/codex-toolchain-linux-x64.part-$index" ]]; then
              echo "part_$index=true" >> "$GITHUB_OUTPUT"
            fi
          done

          ls -lh "$archive" "$archive.sha256" "$parts_dir"/*

      - name: Upload Codex toolchain manifest
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-manifest
          path: |
            ${{ steps.bundle.outputs.parts_dir }}/PARTS.txt
            ${{ steps.bundle.outputs.parts_dir }}/SHA256SUMS.parts
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 00
        if: steps.bundle.outputs.part_00 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-00
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 01
        if: steps.bundle.outputs.part_01 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-01
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 02
        if: steps.bundle.outputs.part_02 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-02
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 03
        if: steps.bundle.outputs.part_03 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-03
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 04
        if: steps.bundle.outputs.part_04 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-04
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 05
        if: steps.bundle.outputs.part_05 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-05
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 06
        if: steps.bundle.outputs.part_06 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-06
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Codex toolchain part 07
        if: steps.bundle.outputs.part_07 == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: codex-toolchain-linux-x64-part-07
          path: ${{ steps.bundle.outputs.parts_dir }}/codex-toolchain-linux-x64.part-07
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
