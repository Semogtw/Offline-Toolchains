name: Run private GoAnime full CI

# The private repository keeps only manual compatibility markers for migrated CI.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/run-private-goanime-ci.yml
      - scripts/private_ci_request.py
      - triggers/goanime-full-ci/*.request
  workflow_dispatch:
    inputs:
      ref:
        description: Exact GoAnime branch, tag, or commit; empty uses main
        required: false
        default: main
        type: string
  schedule:
    - cron: '30 8 * * *'

permissions:
  contents: read

concurrency:
  # Push-based requests are source-bound to their trigger commit. Include that
  # SHA plus the manual ref so unrelated GoAnime validations cannot cancel one
  # another while duplicate dispatches for the same source still collapse.
  group: private-goanime-full-ci-${{ github.sha }}-${{ inputs.ref || 'main' }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1

jobs:
  normalize:
    name: Normalize fixed GoAnime CI request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.request.outputs.ref }}

    steps:
      - name: Checkout trusted request validator
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: trusted-source
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            scripts/private_ci_request.py
            triggers/goanime-full-ci
          sparse-checkout-cone-mode: false

      - name: Normalize fixed repository and ref
        id: request
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          request="$RUNNER_TEMP/goanime-ci-request.json"
          python3 - "$request" "$INPUT_REF" "$EVENT_NAME" "$GITHUB_EVENT_PATH" <<'PY'
          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          request_path = Path(sys.argv[1])
          input_ref = sys.argv[2].strip()
          event_name = sys.argv[3]
          event_path = Path(sys.argv[4])
          requested_ref = input_ref or "main"

          if event_name == "push":
              event = json.loads(event_path.read_text(encoding="utf-8"))
              commits = event.get("commits") or []
              if not commits and event.get("head_commit"):
                  commits = [event["head_commit"]]
              changed = []
              for commit in commits:
                  changed.extend(commit.get("added", []))
                  changed.extend(commit.get("modified", []))

              # Pushes created through the Contents API can omit per-file lists
              # from the webhook payload even though path filtering still fires.
              # Derive the authoritative change list from the checked-out commit
              # as a fallback so an exact-SHA request can never silently become
              # a validation of `main`.
              try:
                  changed.extend(
                      subprocess.check_output(
                          [
                              "git",
                              "-C",
                              "trusted-source",
                              "diff-tree",
                              "--no-commit-id",
                              "--name-only",
                              "-r",
                              "HEAD^",
                              "HEAD",
                          ],
                          text=True,
                      ).splitlines()
                  )
              except subprocess.CalledProcessError:
                  pass

              pattern = re.compile(
                  r"^triggers/goanime-full-ci/[A-Za-z0-9._-]+\.request$"
              )
              trigger_paths = sorted(
                  {
                      path
                      for path in changed
                      if pattern.fullmatch(path)
                      and (Path("trusted-source") / path).is_file()
                  }
              )
              if len(trigger_paths) > 1:
                  raise SystemExit(
                      "push must modify at most one GoAnime full-CI request file"
                  )
              if trigger_paths:
                  trigger = Path("trusted-source") / trigger_paths[0]
                  requested_ref = trigger.read_text(encoding="utf-8").strip()
                  if not requested_ref:
                      raise SystemExit("GoAnime full-CI request ref is empty")

          with request_path.open("w", encoding="utf-8") as stream:
              json.dump({"project": "goanime", "ref": requested_ref}, stream)
          PY
          normalized="$(python3 trusted-source/scripts/private_ci_request.py "$request")"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          request = json.loads(sys.argv[1])
          if request["repository"] != "Semogtw/goanime-mobile":
              raise SystemExit("unexpected GoAnime repository mapping")
          ref = request["ref"]
          if "\n" in ref or "\r" in ref:
              raise SystemExit("unsafe newline in normalized ref")
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              stream.write(f"ref={ref}\n")
          PY

  verify:
    name: GoAnime complete public-runner CI
    needs: normalize
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.normalize.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          # Project health scans 20 recent commits and needs the parent of the
          # oldest scanned commit so a shallow boundary is never treated as a
          # root commit. Keep this at scan window + 1.
          fetch-depth: 21
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up pinned Flutter without persistent cache
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Resolve app and core dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Validate project health
        working-directory: private-source
        run: bash ./tools/validate_project_health.sh

      - name: Test Python tooling
        working-directory: private-source
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py'

      - name: Validate repository guards
        working-directory: private-source
        run: python3 tools/validate_repository_guards.py

      - name: Check formatting
        working-directory: private-source
        run: dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Analyze Flutter project
        working-directory: private-source
        run: flutter analyze --no-pub

      - name: Run Flutter test suite
        working-directory: private-source
        run: flutter test --no-pub

      - name: Run core package tests
        working-directory: private-source/packages/goanime_core
        run: dart test

      - name: Validate release workflow invariants
        working-directory: private-source
        shell: bash
        run: bash ./tools/validate_release_workflows.sh

      - name: Build Android debug APK
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source

  publish-result:
    name: Publish sanitized full-CI result
    if: always()
    needs:
      - normalize
      - verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted report target
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Write sanitized result
        shell: bash
        env:
          NORMALIZE_RESULT: ${{ needs.normalize.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          mkdir -p reports/goanime-full-ci
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          payload = {
              "schemaVersion": 1,
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "runAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "event": os.environ["GITHUB_EVENT_NAME"],
              "toolchainsTriggerSha": os.environ["GITHUB_SHA"],
              "normalizeResult": os.environ["NORMALIZE_RESULT"],
              "verifyResult": os.environ["VERIFY_RESULT"],
              "finishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          path = Path("reports/goanime-full-ci") / f"{os.environ['GITHUB_RUN_ID']}.json"
          path.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Commit sanitized result
        env:
          REPORT_PUSH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/goanime-full-ci
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(goanime): report full CI run $GITHUB_RUN_ID"
          test -n "$REPORT_PUSH_TOKEN"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $REPORT_PUSH_TOKEN" fetch origin main
          git rebase origin/main
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: bearer $REPORT_PUSH_TOKEN" push origin HEAD:main
