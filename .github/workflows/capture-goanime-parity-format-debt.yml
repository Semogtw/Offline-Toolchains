name: Capture GoAnime parity formatting debt

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-parity-format-debt/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-parity-format-debt
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-parity-format-debt/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'codex/manga-parity-20260823'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify current remote head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Produce canonical formatter-only tree
        id: format
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
          # pub get may regenerate tracked desktop plugin files. They are not
          # part of the branch-wide Dart formatter gate, so restore all tracked
          # files before measuring formatter-only changes. Generated package
          # metadata remains available in ignored .dart_tool directories.
          git restore --source=HEAD --staged --worktree -- .
          test -z "$(git status --porcelain --untracked-files=no)"
          dart format lib test packages tools >/dev/null
          git -c core.whitespace=cr-at-eol diff --check
          dart format --output=none --set-exit-if-changed lib test packages tools
          git diff --name-only --diff-filter=M -- lib test packages tools | sort > "$RUNNER_TEMP/changed-files.txt"
          count="$(wc -l < "$RUNNER_TEMP/changed-files.txt" | tr -d ' ')"
          test "$count" -gt 0
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Publish formatted chunks
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="generated/goanime-parity-format-debt/$TARGET_SHA"
          mkdir -p "$RUNNER_TEMP/chunks"
          python3 - "$RUNNER_TEMP/changed-files.txt" "$RUNNER_TEMP/chunks" "$GITHUB_WORKSPACE/private-source" "$TARGET_SHA" <<'PY'
          import json, sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          out = Path(sys.argv[2])
          root = Path(sys.argv[3])
          target_sha = sys.argv[4]
          files = [line.strip() for line in manifest.read_text().splitlines() if line.strip()]
          for idx in range(0, len(files), 8):
              payload = []
              for rel in files[idx:idx + 8]:
                  payload.append({"path": rel, "content": (root / rel).read_text(encoding="utf-8")})
              (out / f"chunk-{idx // 8 + 1:02d}.json").write_text(
                  json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          (out / "manifest.json").write_text(
              json.dumps({"targetSha": target_sha, "files": files, "chunks": (len(files) + 7) // 8}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          for source in "$RUNNER_TEMP/chunks"/*.json; do
            name="$(basename "$source")"
            output="$prefix/$name"
            encoded="$(base64 -w0 "$source")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$output?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$output" -f message="ci(goanime): publish parity format capture $name" -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            gh api "${args[@]}" >/dev/null
          done
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Record gate status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          OUTPUT_PREFIX: ${{ steps.publish.outputs.prefix }}
          CHANGED_COUNT: ${{ steps.format.outputs.count }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
              'status': os.environ['GATE_STATUS'],
              'targetSha': os.environ.get('TARGET_SHA') or None,
              'outputPrefix': os.environ.get('OUTPUT_PREFIX') or None,
              'changedCount': int(os.environ['CHANGED_COUNT']) if os.environ.get('CHANGED_COUNT') else None,
              'runId': int(os.environ['GITHUB_RUN_ID']),
          }, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="status/goanime-parity-format-debt.json"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message="ci(goanime): record parity format capture" -f content="$encoded" -f branch=main)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
