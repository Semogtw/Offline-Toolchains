name: Certify GoAnime enabled manga rollout gates v3 parallel

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-certify-rollout-v3/*.request'

permissions:
  contents: read
jobs:
  resolve:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.request.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - name: Resolve exact reviewed SHA
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-certify-rollout-v3/*.request' | head -n1)"
          read -r project branch sha < "$request"
          test "$project" = goanime && test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  fixtures:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: private-source
        run: flutter pub get >/dev/null
      - name: Provider and registry contracts
        working-directory: private-source
        run: |
          flutter test --no-pub --concurrency=2 test/services/manga/providers
          flutter test --no-pub --concurrency=1 \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart

  live:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        source:
          - ptbr.astratoons
          - ptbr.capitoons
          - ptbr.kivaratoons
          - ptbr.leituramanga
          - ptbr.maidscan
          - ptbr.mangadash
          - ptbr.mangaflix
          - ptbr.mangalivreblog
          - ptbr.ninjascan
    steps:
      - name: Require token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.resolve.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: private-source
        run: flutter pub get >/dev/null
      - name: Prove real reader bytes
        working-directory: private-source
        env:
          SOURCE_ID: ${{ matrix.source }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/live.log"
          set +e
          timeout 240s dart run tools/manga/audit_planned_provider_stage.dart "$SOURCE_ID" > "$log" 2>&1
          code=$?
          set -e
          terminal="$(grep -E '^terminal=' "$log" | tail -n1 | cut -d= -f2- || true)"
          rm -f "$log"
          test "$code" -eq 0
          test "$terminal" = readable
          echo "source=$SOURCE_ID live_byte_readable=true"

  certify:
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}'
    needs: [resolve, fixtures, live]
    if: needs.resolve.result == 'success' && needs.fixtures.result == 'success' && needs.live.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feature/manga-platform
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: private-source
        run: flutter pub get >/dev/null
      - name: Refuse branch race and write certified gates
        id: patch
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          python3 - <<'PY'
          import datetime,json
          from pathlib import Path
          expected={'ptbr.astratoons','ptbr.capitoons','ptbr.kivaratoons','ptbr.leituramanga','ptbr.maidscan','ptbr.mangadash','ptbr.mangaflix','ptbr.mangalivreblog','ptbr.ninjascan'}
          p=Path('docs/manga_sources_ptbr.json'); m=json.loads(p.read_text()); enabled=set()
          verified=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          for r in m['providerRecords']:
            if r.get('implementationState')=='enabled':
              sid=r['goanimeSourceId']; enabled.add(sid)
              r['rolloutGates']={'fixtureContractPassed':True,'liveReadabilityPassed':True,'verifiedAt':verified}
          assert enabled==expected
          p.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          dart run tools/manga/validate_manga_provider_manifest.dart docs/manga_sources_ptbr.json
          git diff --check
      - name: Commit certification
        id: commit
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ needs.resolve.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/manga-platform --quiet
          test "$(git rev-parse origin/feature/manga-platform)" = "$REVIEWED_SHA"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/manga_sources_ptbr.json
          git commit -m 'chore(manga): certify enabled rollout gates'
          new_sha="$(git rev-parse HEAD)"; git push origin HEAD:feature/manga-platform
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"
      - name: Publish success receipt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ needs.resolve.outputs.sha }}
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
        run: |
          result="$(jq -cn --arg controlSha "$CONTROL_SHA" --arg reviewedSha "$REVIEWED_SHA" --arg newSha "$NEW_SHA" '{schemaVersion:3,state:"success",controlSha:$controlSha,reviewedSha:$reviewedSha,newSha:$newSha,enabledProviders:9,fixtureContracts:true,liveByteEvidence:true,parallelLiveGate:true}')"
          encoded="$(printf '%s\n' "$result"|base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-certify-rollout-v3/$CONTROL_SHA.json" -f message="ci(result): record manga rollout v3 $CONTROL_SHA" -f content="$encoded"
