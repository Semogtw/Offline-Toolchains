name: Validate private Hydra branch

on:
  push:
    branches: [main]
    paths:
      - 'triggers/hydra-validation/*.request'

permissions:
  contents: write

concurrency:
  group: validate-private-hydra-branch
  cancel-in-progress: false

jobs:
  validate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact validation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/hydra-validation/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch expected_sha < "toolchain-control/$request"
          test "$project" = "hydra"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$expected_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "request_path=$request" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private Hydra revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ steps.request.outputs.expected_sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify requested branch still points to revision
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/HydraPersonalizado.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'

      - name: Activate Yarn 1
        shell: bash
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
          yarn --version

      - name: Install JavaScript dependencies without build side effects
        id: deps
        working-directory: private-source
        shell: bash
        run: yarn install --frozen-lockfile --ignore-scripts --non-interactive

      - name: Install Electron runtime only
        id: electron
        working-directory: private-source
        shell: bash
        run: node node_modules/electron/install.js

      - name: Compile Python helpers
        id: compile_python
        working-directory: private-source
        shell: bash
        run: python3 -m compileall -q python_rpc

      - name: Run Python source-discovery unit tests
        id: python_tests
        working-directory: private-source
        shell: bash
        run: python3 -m unittest discover -s python_rpc -p 'test_source_discovery*.py' -v

      - name: Run local-source tests
        id: local_tests
        working-directory: private-source
        shell: bash
        run: node --import ./scripts/register-ts-node.mjs --test "src/main/services/local-download-sources/*.test.ts"

      - name: Run shared downloader routing tests
        id: downloader_tests
        working-directory: private-source
        shell: bash
        run: node --import ./scripts/register-ts-node.mjs --test src/shared/downloaders.test.ts

      - name: Typecheck Node process
        id: typecheck
        if: ${{ always() && steps.deps.outcome == 'success' }}
        working-directory: private-source
        shell: bash
        run: yarn typecheck:node

      - name: Publish validation status
        if: ${{ always() && steps.request.outputs.expected_sha != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.expected_sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          REQUEST_PATH: ${{ steps.request.outputs.request_path }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          ELECTRON_OUTCOME: ${{ steps.electron.outcome }}
          COMPILE_PYTHON_OUTCOME: ${{ steps.compile_python.outcome }}
          PYTHON_TESTS_OUTCOME: ${{ steps.python_tests.outcome }}
          LOCAL_TESTS_OUTCOME: ${{ steps.local_tests.outcome }}
          DOWNLOADER_TESTS_OUTCOME: ${{ steps.downloader_tests.outcome }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
        run: |
          set -euo pipefail
          status=success
          for outcome in "$DEPS_OUTCOME" "$ELECTRON_OUTCOME" "$COMPILE_PYTHON_OUTCOME" "$PYTHON_TESTS_OUTCOME" "$LOCAL_TESTS_OUTCOME" "$DOWNLOADER_TESTS_OUTCOME" "$TYPECHECK_OUTCOME"; do
            if [ "$outcome" != "success" ]; then
              status=failure
            fi
          done
          result="$(jq -n \
            --arg status "$status" \
            --arg targetSha "$TARGET_SHA" \
            --arg targetBranch "$TARGET_BRANCH" \
            --arg requestPath "$REQUEST_PATH" \
            --arg runId "$GITHUB_RUN_ID" \
            --arg runAttempt "$GITHUB_RUN_ATTEMPT" \
            --arg deps "$DEPS_OUTCOME" \
            --arg electron "$ELECTRON_OUTCOME" \
            --arg compilePython "$COMPILE_PYTHON_OUTCOME" \
            --arg pythonTests "$PYTHON_TESTS_OUTCOME" \
            --arg localTests "$LOCAL_TESTS_OUTCOME" \
            --arg downloaderTests "$DOWNLOADER_TESTS_OUTCOME" \
            --arg typecheck "$TYPECHECK_OUTCOME" \
            '{status:$status,targetSha:$targetSha,targetBranch:$targetBranch,requestPath:$requestPath,runId:($runId|tonumber),runAttempt:($runAttempt|tonumber),steps:{deps:$deps,electron:$electron,compilePython:$compilePython,pythonTests:$pythonTests,localTests:$localTests,downloaderTests:$downloaderTests,typecheck:$typecheck}}')"
          path="hydra-validation-results/${TARGET_SHA}.json"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=hydra-validation-results" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f "message=ci(hydra): record validation ${TARGET_SHA}" -f "content=${encoded}" -f "branch=hydra-validation-results")
          if [ -n "$current_sha" ]; then
            args+=(-f "sha=${current_sha}")
          fi
          gh api "${args[@]}" >/dev/null
