name: Validate GoAnime manga reader performance privately

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-reader-performance/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-reader-performance-private-ci
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Manga reader performance slice
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-reader-performance/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          test "$branch" = "codex/manga-parity-20260823"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Check formatting
        working-directory: private-source
        run: dart format --output=none --set-exit-if-changed lib/services/manga/manga_reader_remote_transport.dart test/services/manga/manga_reader_remote_transport_test.dart

      - name: Analyze reader performance slice
        working-directory: private-source
        run: flutter analyze --no-pub lib/services/manga/manga_reader_remote_transport.dart test/services/manga/manga_reader_remote_transport_test.dart

      - name: Run reader transport tests
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_reader_remote_transport_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
