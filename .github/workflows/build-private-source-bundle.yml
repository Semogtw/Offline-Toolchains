name: Build encrypted private source bundle

on:
  workflow_dispatch:
    inputs:
      project:
        description: Private repository to export
        required: true
        type: choice
        options:
          - goanime
          - zapzap
          - semogsite
          - hydra
          - receitas
      mode:
        description: Export all refs, one exact ref, or a source snapshot
        required: true
        default: full
        type: choice
        options:
          - full
          - ref
          - snapshot
      ref:
        description: Exact branch, tag or commit; empty uses the default checkout
        required: false
        default: ""
        type: string
  workflow_run:
    workflows:
      - Request private source bundle
    types:
      - completed

permissions:
  contents: read
  actions: read

concurrency:
  group: private-source-${{ github.event_name == 'workflow_dispatch' && inputs.project || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Encrypt private Git export
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'build/source-bundles' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.actor.login == github.repository_owner &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Checkout connector request revision
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/private-source-bundle.json
          sparse-checkout-cone-mode: false

      - name: Normalize allowlisted request
        id: request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PROJECT: ${{ inputs.project }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            request_file="request-source/triggers/private-source-bundle.json"
          else
            request_file="$RUNNER_TEMP/manual-private-source-request.json"
            python3 - "$request_file" "$INPUT_PROJECT" "$INPUT_MODE" "$INPUT_REF" <<'PY'
          import json
          import sys
          output, project, mode, ref = sys.argv[1:]
          with open(output, "w", encoding="utf-8") as stream:
              json.dump({"project": project, "mode": mode, "ref": ref}, stream)
          PY
          fi

          normalized="$(python3 scripts/validate-source-bundle-request.py "$request_file")"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          request = json.loads(sys.argv[1])
          repositories = {
              "goanime": "Semogtw/goanime-mobile",
              "zapzap": "Semogtw/Zapzap",
              "semogsite": "Semogtw/SemogSite",
              "hydra": "Semogtw/HydraPersonalizado",
              "receitas": "Semogtw/Receitas",
          }
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              for key in ("project", "mode", "ref"):
                  value = request[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe newline in {key}")
                  stream.write(f"{key}={value}\n")
              stream.write(f"repository={repositories[request['project']]}\n")
          PY

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout selected private repository
        uses: actions/checkout@v6
        with:
          repository: ${{ steps.request.outputs.repository }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Build and encrypt export
        id: bundle
        shell: bash
        env:
          PROJECT: ${{ steps.request.outputs.project }}
          MODE: ${{ steps.request.outputs.mode }}
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
          PRIVATE_REPOSITORY: ${{ steps.request.outputs.repository }}
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          source_dir="$GITHUB_WORKSPACE/private-source"
          work_dir="$RUNNER_TEMP/private-source-bundle"
          package_dir="$work_dir/package"
          transfer_dir="$work_dir/transfer"
          plaintext_archive="$work_dir/private-source-package.tar.zst"
          encrypted_file="$work_dir/private-source.gpg"
          gpg_home="$work_dir/gpg"

          rm -rf "$work_dir"
          mkdir -p "$package_dir" "$transfer_dir" "$gpg_home"
          chmod 700 "$gpg_home"

          resolve_exact_ref() {
            local requested="$1"
            local candidate
            if [[ -z "$requested" ]]; then
              git -C "$source_dir" rev-parse HEAD
              return
            fi
            if [[ "$requested" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              git -C "$source_dir" rev-parse --verify "${requested}^{commit}"
              return
            fi
            for candidate in \
              "refs/heads/$requested" \
              "refs/remotes/origin/$requested" \
              "refs/tags/$requested"; do
              if git -C "$source_dir" show-ref --verify --quiet "$candidate"; then
                git -C "$source_dir" rev-parse "${candidate}^{commit}"
                return
              fi
            done
            echo "Exact branch, tag or commit was not found." >&2
            return 1
          }

          resolved_commit="$(resolve_exact_ref "$REQUESTED_REF")"
          export_format=bundle

          if [[ "$MODE" == "full" ]]; then
            while IFS=$'\t' read -r remote_ref object_id; do
              [[ "$remote_ref" == "refs/remotes/origin/HEAD" ]] && continue
              branch_name="${remote_ref#refs/remotes/origin/}"
              git -C "$source_dir" update-ref "refs/heads/$branch_name" "$object_id"
            done < <(git -C "$source_dir" for-each-ref --format='%(refname)%09%(objectname)' refs/remotes/origin)
            git -C "$source_dir" bundle create "$package_dir/repository.bundle" --all
            git -C "$source_dir" bundle verify "$package_dir/repository.bundle"
          elif [[ "$MODE" == "ref" ]]; then
            git -C "$source_dir" update-ref refs/heads/offline-export "$resolved_commit"
            git -C "$source_dir" bundle create "$package_dir/repository.bundle" refs/heads/offline-export
            git -C "$source_dir" bundle verify "$package_dir/repository.bundle"
          else
            export_format=snapshot
            git -C "$source_dir" archive --format=tar --prefix="$PROJECT/" "$resolved_commit" |
              zstd -T0 -6 -o "$package_dir/snapshot.tar.zst"
          fi

          git -C "$source_dir" for-each-ref --format='%(refname)%09%(objectname)' \
            refs/heads refs/tags > "$package_dir/REFS.txt"

          python3 - "$package_dir/PRIVATE-MANIFEST.json" "$PROJECT" "$PRIVATE_REPOSITORY" \
            "$MODE" "$REQUESTED_REF" "$resolved_commit" "$export_format" <<'PY'
          import datetime
          import json
          import sys
          path, project, repository, mode, requested_ref, commit, export_format = sys.argv[1:]
          manifest = {
              "schema_version": 1,
              "project": project,
              "repository": repository,
              "mode": mode,
              "requested_ref": requested_ref,
              "resolved_commit": commit,
              "format": export_format,
              "created_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "excludes": ["git-lfs objects", "submodule repositories", "untracked files", "stashes", "local-only commits"],
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(manifest, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          tar -C "$package_dir" -I 'zstd -T0 -6' -cf "$plaintext_archive" .

          export GNUPGHOME="$gpg_home"
          gpg --batch --import keys/source-bundles-public.asc
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          test -z "$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1 == "sec" { print $1 }')"

          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$encrypted_file" --encrypt "$plaintext_archive"
          test -s "$encrypted_file"

          rm -rf "$package_dir" "$plaintext_archive" "$source_dir" "$gpg_home"

          split --bytes=400M --numeric-suffixes=0 --suffix-length=3 \
            "$encrypted_file" "$transfer_dir/private-source.gpg.part-"
          rm -f "$encrypted_file"

          part_count="$(find "$transfer_dir" -maxdepth 1 -type f -name 'private-source.gpg.part-*' | wc -l | tr -d ' ')"
          if (( part_count < 1 || part_count > 16 )); then
            echo "Encrypted transfer requires $part_count parts; supported range is 1-16." >&2
            exit 1
          fi

          (cd "$transfer_dir" && sha256sum private-source.gpg.part-* > SHA256SUMS.parts)
          python3 - "$transfer_dir/TRANSFER.json" "$PROJECT" "$MODE" "$part_count" \
            "$EXPECTED_FINGERPRINT" "$GITHUB_RUN_ID" <<'PY'
          import datetime
          import json
          import sys
          path, project, mode, part_count, fingerprint, run_id = sys.argv[1:]
          transfer = {
              "schema_version": 1,
              "project": project,
              "mode": mode,
              "part_count": int(part_count),
              "split_size": "400M",
              "encryption": "OpenPGP",
              "recipient_fingerprint": fingerprint,
              "workflow_run_id": run_id,
              "created_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open(path, "w", encoding="utf-8") as stream:
              json.dump(transfer, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

          echo "transfer_dir=$transfer_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=private-source-$PROJECT-$MODE-encrypted" >> "$GITHUB_OUTPUT"

      - name: Upload ciphertext-only source transfer
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ steps.bundle.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove private and transient data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$GITHUB_WORKSPACE/request-source"
          rm -rf "$RUNNER_TEMP/private-source-bundle"
          rm -f "$RUNNER_TEMP/manual-private-source-request.json"
