name: Record GoAnime exact lock delta receipt

on:
  workflow_run:
    workflows:
      - Build GoAnime exact Pub cache delta
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: record-goanime-lock-delta-receipt
  cancel-in-progress: false

jobs:
  record:
    name: Record public GoAnime exact lock delta metadata
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted receipt publisher
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch and validate artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
        run: |
          set -euo pipefail
          mkdir -p receipts
          gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts.json"
          python3 - \
            "$RUNNER_TEMP/artifacts.json" \
            receipts/goanime-lock-delta-latest.json \
            "$SOURCE_RUN_ID" \
            "$SOURCE_RUN_URL" \
            "$SOURCE_HEAD_SHA" \
            "$SOURCE_EVENT" <<'PY'
          import datetime as dt
          import json
          import sys
          from pathlib import Path

          prefix = "goanime-lock-delta-linux-x64-"
          source = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          artifacts = []
          for artifact in source.get("artifacts", []):
              name = artifact.get("name", "")
              if not name.startswith(prefix):
                  continue
              artifacts.append(
                  {
                      "artifact_id": artifact["id"],
                      "name": name,
                      "size_bytes": artifact.get("size_in_bytes"),
                      "expired": bool(artifact.get("expired", False)),
                      "created_at": artifact.get("created_at"),
                      "expires_at": artifact.get("expires_at"),
                  }
              )

          if not artifacts:
              raise SystemExit("GoAnime exact lock delta run produced no expected artifacts")
          if not any(item["name"].endswith("-manifest") for item in artifacts):
              raise SystemExit("GoAnime exact lock delta manifest artifact is missing")
          if not any("-part-" in item["name"] for item in artifacts):
              raise SystemExit("GoAnime exact lock delta part artifacts are missing")

          artifacts.sort(key=lambda item: item["name"])
          receipt = {
              "schema_version": 1,
              "run_id": int(sys.argv[3]),
              "run_url": sys.argv[4],
              "workflow_head_sha": sys.argv[5],
              "workflow_event": sys.argv[6],
              "recorded_at_utc": dt.datetime.now(dt.timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z"),
              "artifacts": artifacts,
          }
          Path(sys.argv[2]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish receipt
        shell: bash
        run: |
          set -euo pipefail
          git add receipts/goanime-lock-delta-latest.json
          if git diff --cached --quiet -- receipts/goanime-lock-delta-latest.json; then
            echo "Receipt is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ci: record latest GoAnime exact lock delta artifacts"
          git push origin HEAD:main
