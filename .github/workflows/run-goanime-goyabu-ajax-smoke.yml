name: Run GoAnime Goyabu AJAX smoke

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-goyabu-ajax/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-goyabu-ajax-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Probe Goyabu AJAX decoder
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted probe
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/goyabu_ajax_smoke.py
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Run sanitized AJAX smoke
        shell: bash
        run: python3 scripts/goyabu_ajax_smoke.py
