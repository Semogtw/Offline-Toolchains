name: One-shot normal GoAnime publish retry

on:
  push:
    branches:
      - main
    paths:
      - triggers/goanime-normal-publish-retry/megaplay-1.26.2.request

permissions:
  contents: read

concurrency:
  group: goanime-normal-release-1.26.2
  cancel-in-progress: false

env:
  GOANIME_REPOSITORY: Semogtw/goanime-mobile
  SOURCE_REF: 99a823a79a83a46412181798a1326eb04f4ad581
  RELEASE_TAG: release-v1.26.2
  VERSION_NAME: 1.26.2
  BUILD_NUMBER: "33"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1

jobs:
  publish:
    name: Publish normal release and update channels retry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 99a823a79a83a46412181798a1326eb04f4ad581
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false
      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Recompute Windows DSA signature from uploaded installer
        working-directory: private-source
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          AUTO_UPDATER_DSA_PUBLIC_KEY: ${{ secrets.AUTO_UPDATER_DSA_PUBLIC_KEY }}
          AUTO_UPDATER_DSA_PRIVATE_KEY: ${{ secrets.AUTO_UPDATER_DSA_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$AUTO_UPDATER_DSA_PUBLIC_KEY" > windows/runner/dsa_pub.pem
          printf '%s\n' "$AUTO_UPDATER_DSA_PRIVATE_KEY" > dsa_priv.pem
          trap 'rm -f windows/runner/dsa_pub.pem dsa_priv.pem' EXIT
          asset_dir="$RUNNER_TEMP/goanime-release-assets"
          mkdir -p "$asset_dir" "$RUNNER_TEMP/dart-appdata"
          gh release download "$RELEASE_TAG" \
            --repo "$GOANIME_REPOSITORY" \
            --dir "$asset_dir" \
            --clobber \
            --pattern "GoAnime-windows-x64-setup-$VERSION_NAME.exe"
          installer="$asset_dir/GoAnime-windows-x64-setup-$VERSION_NAME.exe"
          test -s "$installer"
          export APPDATA="$RUNNER_TEMP/dart-appdata"
          signature="$(dart run auto_updater:sign_update "$installer" | sed -nE 's/.*sparkle:dsaSignature="([^"]+)".*/\1/p' | tail -n1)"
          test -n "$signature"
          echo "WINDOWS_DSA_SIGNATURE=$signature" >> "$GITHUB_ENV"
      - name: Publish signed metadata and update channels
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          UPDATE_ASSET_URL_TEMPLATE: ${{ secrets.UPDATE_ASSET_URL_TEMPLATE }}
          UPDATE_RELEASE_PAGE_URL: ${{ secrets.UPDATE_RELEASE_PAGE_URL }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GOANIME_RELEASE_PLATFORMS: android,windows,linux
          RELEASE_NOTES: Normal full Flutter release after Shorebird Android base-release incompatibility.
        shell: bash
        run: bash scripts/goanime-release/publish.sh private-source
