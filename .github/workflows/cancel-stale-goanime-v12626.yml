name: Cancel superseded GoAnime 1.26.26 release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-stale-goanime-v12626.yml'
permissions:
  contents: read
  actions: write
jobs:
  cancel-superseded-release:
    if: github.repository == 'Semogtw/Offline-Toolchains'
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel exact superseded release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST repos/Semogtw/Offline-Toolchains/actions/runs/40268497972/cancel
