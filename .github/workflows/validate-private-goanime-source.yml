name: Validate private GoAnime source

on:
  push:
    branches: [main]
    paths:
      - triggers/private-goanime-validate.json
      - .github/workflows/validate-private-goanime-source.yml

permissions:
  contents: read

concurrency:
  group: private-goanime-source-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout trusted toolchain source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-validate.json"
          sha="$(python3 - "$request" <<'PY'
          import json
          import re
          import sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          sha = str(payload.get('ref') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('ref must be an exact 40-character commit SHA')
          print(sha)
          PY
          )"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || {
            echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2
            exit 1
          }

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact private commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = '${{ steps.request.outputs.ref }}'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Disable Flutter analytics
        run: flutter config --no-analytics

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd private-source && flutter pub get)
          (cd private-source/packages/goanime_core && dart pub get)

      - name: Check formatting for maintained focused files
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          candidates=(
            lib/services/anime_metadata_cache_service.dart
            lib/services/anime_metadata_seed_service.dart
            lib/services/runtime_home_catalog_service.dart
            tools/anilist_metadata_bulk_loader.dart
            tools/build_anime_metadata_seed.dart
            test/services/anime_metadata_home_candidates_test.dart
            test/services/anime_metadata_seed_reimport_test.dart
            test/services/runtime_home_catalog_direct_seed_fallback_test.dart
            test/services/runtime_home_catalog_partial_cache_repair_test.dart
            test/tools/anilist_metadata_bulk_loader_test.dart
            test/tools/build_anime_metadata_seed_catalog_sources_test.dart
          )
          files=()
          for file in "${candidates[@]}"; do
            [[ -f "$file" ]] && files+=("$file")
          done
          if (( ${#files[@]} > 0 )); then
            dart format --output=none --set-exit-if-changed "${files[@]}"
          fi

      - name: Analyze
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          flutter analyze --no-pub

      - name: Run focused MegaPlay tests when present
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          if [[ ! -d test/services/megaplay ]]; then
            echo 'MegaPlay test directory is absent at this source revision; skipping.'
            exit 0
          fi

          mapfile -t tests < <(
            find test/services/megaplay -maxdepth 1 -type f -name '*_test.dart' -print | sort
          )
          for extra in \
            test/screens/mobile_megaplay_native_playback_contract_test.dart \
            test/screens/desktop_megaplay_native_playback_contract_test.dart \
            test/widgets/settings_megaplay_mode_test.dart \
            test/widgets/megaplay_episode_list_test.dart; do
            [[ -f "$extra" ]] && tests+=("$extra")
          done
          if (( ${#tests[@]} == 0 )); then
            echo 'MegaPlay test directory exists but contains no focused tests.' >&2
            exit 1
          fi

          printf 'Running %d MegaPlay focused test files in isolated processes\n' "${#tests[@]}"
          for test_file in "${tests[@]}"; do
            echo "::group::MegaPlay test: $test_file"
            timeout --signal=TERM --kill-after=10s 90s \
              flutter test --no-pub "$test_file"
            echo "::endgroup::"
          done

      - name: Run focused Home and metadata tests
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          candidates=(
            test/services/anime_metadata_home_candidates_test.dart
            test/services/anime_metadata_seed_bundled_test.dart
            test/services/anime_metadata_seed_reimport_test.dart
            test/services/runtime_home_catalog_seed_fallback_test.dart
            test/services/runtime_home_catalog_direct_seed_fallback_test.dart
            test/services/runtime_home_catalog_partial_cache_repair_test.dart
            test/services/runtime_home_catalog_resilience_test.dart
            test/tools/anilist_metadata_bulk_loader_test.dart
            test/tools/build_anime_metadata_seed_catalog_sources_test.dart
          )
          tests=()
          for file in "${candidates[@]}"; do
            [[ -f "$file" ]] && tests+=("$file")
          done
          if (( ${#tests[@]} > 0 )); then
            flutter test --no-pub "${tests[@]}"
          else
            echo 'No maintained Home/metadata focused tests exist at this source revision.'
          fi
