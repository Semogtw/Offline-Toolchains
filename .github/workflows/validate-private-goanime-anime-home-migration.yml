name: Validate GoAnime Anime Home migration privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-anime-home-migration/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-anime-home-migration
  cancel-in-progress: false

jobs:
  validate:
    name: Transform and validate Anime Home lifecycle
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-anime-home-migration/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/dev/null 2>&1
          (cd packages/goanime_core && dart pub get >/dev/null 2>&1)

      - name: Apply Anime Home lifecycle migration
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 ../control/scripts/goanime/migrate_anime_home_lifecycle.py
          dart format lib/screens/home_screen.dart lib/screens/home_screen_data.dart >/dev/null
          git diff --check

      - name: Analyze Home slice
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/controllers/media \
            lib/services/media/anime_home_snapshot_adapter.dart \
            lib/screens/home_screen.dart \
            lib/screens/home_screen_data.dart \
            lib/screens/home_screen_presentation.dart \
            lib/screens/manga/manga_home_screen.dart \
            test/controllers/media/home_snapshot_controller_test.dart \
            test/services/media/anime_home_snapshot_adapter_test.dart \
            test/architecture/shared_home_lifecycle_guard_test.dart \
            test/widgets/home_cache_race_test.dart \
            test/widgets/home_refresh_resilience_test.dart \
            test/widgets/manga/manga_home_screen_test.dart \
            test/widgets/manga/manga_home_refresh_resilience_test.dart \
            test/services/runtime_home_catalog_resilience_test.dart

      - name: Run Home regression suite
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test/controllers/media/home_snapshot_controller_test.dart
          flutter test --no-pub test/services/media/anime_home_snapshot_adapter_test.dart
          flutter test --no-pub test/architecture/shared_home_lifecycle_guard_test.dart
          flutter test --no-pub test/widgets/home_cache_race_test.dart
          flutter test --no-pub test/widgets/home_refresh_resilience_test.dart
          flutter test --no-pub test/widgets/manga/manga_home_screen_test.dart
          flutter test --no-pub test/widgets/manga/manga_home_refresh_resilience_test.dart
          flutter test --no-pub test/services/runtime_home_catalog_resilience_test.dart

      - name: Publish validated transformed source safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for item in \
            'lib/screens/home_screen.dart:home_screen.dart' \
            'lib/screens/home_screen_data.dart:home_screen_data.dart'
          do
            source_path="${item%%:*}"
            output_name="${item##*:}"
            encoded="$(base64 -w0 < "private-source/$source_path")"
            path="reports/goanime-anime-home-migration/${RUN_ID}/${output_name}"
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f "message=ci(goanime): capture Anime Home migration ${RUN_ID} ${output_name}" \
              -f "content=${encoded}" >/dev/null
          done

      - name: Publish success receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/result.json"
          printf '{"runId":%s,"sourceSha":"%s","validateResult":"success"}\n' "$RUN_ID" "$SOURCE_SHA" > "$report"
          encoded="$(base64 -w0 < "$report")"
          path="reports/goanime-anime-home-migration/${RUN_ID}/result.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report Anime Home migration ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
