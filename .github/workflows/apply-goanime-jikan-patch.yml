name: Apply GoAnime Jikan patch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-goanime-jikan-patch.yml

permissions:
  contents: read

concurrency:
  group: apply-goanime-jikan-contract-fixtures
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout patch request
        uses: actions/checkout@v6
        with:
          ref: build/source-bundles
          persist-credentials: false

      - name: Verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            e39ef4c98aa5e2ea421b3aebcb7e2da6d70ba368cfee9dda1c8c41e18a00df36 \
            triggers/goanime-jikan-contract-fixtures.patch.gz.b64 | sha256sum --check --strict
          base64 --decode triggers/goanime-jikan-contract-fixtures.patch.gz.b64 |
            gzip --decompress > "$RUNNER_TEMP/goanime-jikan.patch"
          grep -Fq 'Subject: [PATCH] test(jikan): resync deployment contract fixtures' \
            "$RUNNER_TEMP/goanime-jikan.patch"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime-Mobile Jikan branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: feat/self-hosted-metadata-api-2026-07-30
          path: private-source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified patch
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          expected_parent=6c2df60c45e5c4c6828961b5c95e8182c8417903
          test "$(git rev-parse HEAD)" = "$expected_parent"
          git am --3way "$RUNNER_TEMP/goanime-jikan.patch"
          git diff --check HEAD^

      - name: Run focused deployment gates
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          bash infra/jikan/tests/run.sh
          npm --prefix services/metadata-api run check
          npm --prefix services/metadata-api test

      - name: Push verified checkpoint
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          git push origin HEAD:feat/self-hosted-metadata-api-2026-07-30
