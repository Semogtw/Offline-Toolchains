name: Diagnose GoAnime manga next-wave live contracts

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-next-wave-live-diagnostic/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-next-wave-live-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose live HTTP contracts without private data
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify trigger
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-next-wave-live-diagnostic/*.request' | head -n 1)"
          test -n "$request"
          test "$(tr -d '\r\n' < "control/$request")" = 'yomu-flower-onereader'

      - name: Diagnose public contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/manga-next-wave-live.json"
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36'

          def fetch(url, headers=None):
              request = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.8', **(headers or {})})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      return response.status, dict(response.headers), response.read(2 * 1024 * 1024)
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers), exc.read(2 * 1024 * 1024)
              except Exception as exc:
                  return None, {'exception': type(exc).__name__}, b''

          result = {'schemaVersion': 1}

          # Yomu: only status/content-type, never body.
          status, headers, _ = fetch('https://yomu.tauruus.com/list?page=1')
          result['yomu'] = {
              'status': status,
              'contentType': headers.get('Content-Type', '').split(';', 1)[0].lower(),
              'server': headers.get('Server', '')[:60],
              'exception': headers.get('exception'),
          }

          # Flower: distinguish site/WAF behavior without attempting bypass.
          status, headers, _ = fetch('https://flowermangas.net/?s=manga&post_type=wp-manga', {'Accept': 'text/html,*/*;q=0.8', 'Referer': 'https://flowermangas.net/'})
          result['flower'] = {
              'status': status,
              'contentType': headers.get('Content-Type', '').split(';', 1)[0].lower(),
              'server': headers.get('Server', '')[:60],
              'hasCfRay': bool(headers.get('CF-RAY')),
              'exception': headers.get('exception'),
          }

          # OneReader: follow exactly the public standard-role API and expose only schema + resolved hosts.
          api = 'https://api.onereader.net/'
          search_query = urllib.parse.urlencode({
              'page': '1', 'limit': '24', 'order': 'az', 'role': 'standard',
              'search': '', 'genre': '', 'type': '', 'status': '',
          })
          status, headers, body = fetch(api + 'api/mangas/search?' + search_query, {'Accept': 'application/json', 'Referer': 'https://onereader.net/'})
          one = {'searchStatus': status, 'searchContentType': headers.get('Content-Type', '').split(';', 1)[0].lower()}
          try:
              search = json.loads(body.decode('utf-8', 'replace'))
          except Exception:
              search = None
          if isinstance(search, dict):
              one['searchKeys'] = sorted(str(key) for key in search.keys())
              data = search.get('data')
              one['searchCount'] = len(data) if isinstance(data, list) else None
              first = data[0] if isinstance(data, list) and data and isinstance(data[0], dict) else None
              manga_key = first.get('manga_key') if isinstance(first, dict) else None
              if isinstance(manga_key, str) and manga_key:
                  encoded_key = urllib.parse.quote(manga_key, safe='')
                  c_status, c_headers, c_body = fetch(api + 'api/chapters/' + encoded_key, {'Accept': 'application/json', 'Referer': 'https://onereader.net/'})
                  one['chaptersStatus'] = c_status
                  try:
                      chapters = json.loads(c_body.decode('utf-8', 'replace'))
                  except Exception:
                      chapters = None
                  if isinstance(chapters, dict):
                      one['chapterCount'] = len(chapters)
                      chapter_number = next(iter(chapters), None)
                      if chapter_number is not None:
                          chapter_path = str(chapter_number).replace('.', '_')
                          p_status, p_headers, p_body = fetch(api + 'api/chapters/' + encoded_key + '/' + urllib.parse.quote(chapter_path, safe=''), {'Accept': 'application/json', 'Referer': 'https://onereader.net/'})
                          one['pagesStatus'] = p_status
                          one['pagesContentType'] = p_headers.get('Content-Type', '').split(';', 1)[0].lower()
                          try:
                              pages_payload = json.loads(p_body.decode('utf-8', 'replace'))
                          except Exception:
                              pages_payload = None
                          one['pagesPayloadType'] = type(pages_payload).__name__ if pages_payload is not None else None
                          if isinstance(pages_payload, dict):
                              one['pagesKeys'] = sorted(str(key) for key in pages_payload.keys())
                              pages = pages_payload.get('pages')
                              one['pagesFieldType'] = type(pages).__name__ if pages is not None else None
                              one['pageCount'] = len(pages) if isinstance(pages, list) else None
                              hosts = set()
                              schemes = set()
                              item_types = set()
                              for raw in pages if isinstance(pages, list) else []:
                                  item_types.add(type(raw).__name__)
                                  if isinstance(raw, str):
                                      absolute = urllib.parse.urljoin(api, raw)
                                      parsed = urllib.parse.urlparse(absolute)
                                      if parsed.hostname:
                                          hosts.add(parsed.hostname.lower())
                                      if parsed.scheme:
                                          schemes.add(parsed.scheme.lower())
                              one['pageItemTypes'] = sorted(item_types)
                              one['pageHosts'] = sorted(hosts)
                              one['pageSchemes'] = sorted(schemes)
          result['oneReader'] = one
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          cat "$RUNNER_TEMP/manga-next-wave-live.json"

      - name: Publish sanitized receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/manga-next-wave-live.json"
          test -f "$file" || printf '%s\n' '{"schemaVersion":1,"probe":"not_run"}' > "$file"
          encoded="$(base64 -w0 "$file")"
          path="results/goanime-manga-next-wave-live/${{ github.run_id }}.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record manga next-wave live diagnostic" \
            -f content="$encoded" >/dev/null

      - name: Remove diagnostic state
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/manga-next-wave-live.json"
