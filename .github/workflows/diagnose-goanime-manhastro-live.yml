name: Diagnose GoAnime Manhastro live API

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manhastro-live-diagnostic/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manhastro-live-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Probe sanitized Manhastro API contract
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Probe current API shape
        run: python3 scripts/diagnose-goanime-manhastro-live.py
