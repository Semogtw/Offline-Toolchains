name: GoAnime Manga Metadata Refresh Coordinator Format Fix

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/goanime-manga-unify-metrics.yml

permissions:
  contents: read

concurrency:
  group: goanime-manga-metadata-refresh-coordinator-format-fix
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: agent/manga-metadata-catalog-parity-20260908
      GOANIME_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
    steps:
      - name: Require private repository token
        shell: bash
        run: test -n "$GOANIME_TOKEN"

      - name: Checkout metadata branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/goanime-mobile
          ref: agent/manga-metadata-catalog-parity-20260908
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          persist-credentials: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Format only metadata refresh coordinator
        shell: bash
        run: |
          set -euo pipefail
          dart format tools/manga/manga_metadata_refresh.dart
          git diff --check
          git diff -- tools/manga/manga_metadata_refresh.dart

      - name: Commit and push formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- tools/manga/manga_metadata_refresh.dart; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/manga/manga_metadata_refresh.dart
          git commit -m "style(manga): format metadata refresh coordinator"
          git push "https://x-access-token:${GOANIME_TOKEN}@github.com/Semogtw/goanime-mobile.git" "HEAD:refs/heads/${TARGET_BRANCH}"
