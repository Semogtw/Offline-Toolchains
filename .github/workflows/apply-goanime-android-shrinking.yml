name: Apply measured GoAnime Android shrinking

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-android-shrinking/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-android-shrinking
  cancel-in-progress: false

jobs:
  measure-and-apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-android-shrinking/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source and remote head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/GoAnime-Mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Set up Flutter and Java
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: flutter pub get

      - name: Build baseline release APK
        id: baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub
          apk='build/app/outputs/flutter-apk/goanime.apk'
          test -f "$apk"
          bytes="$(stat -c %s "$apk")"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "Baseline APK: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"

      - name: Enable R8 and resource shrinking
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text()
          assert text.count('isMinifyEnabled = false') == 1
          assert text.count('isShrinkResources = false') == 1
          text = text.replace('isMinifyEnabled = false', 'isMinifyEnabled = true')
          text = text.replace('isShrinkResources = false', 'isShrinkResources = true')
          path.write_text(text)
          PY
          git diff --check

      - name: Build optimized release APK
        id: optimized
        working-directory: private-source
        shell: bash
        env:
          BASELINE_BYTES: ${{ steps.baseline.outputs.bytes }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub
          apk='build/app/outputs/flutter-apk/goanime.apk'
          test -f "$apk"
          bytes="$(stat -c %s "$apk")"
          test "$bytes" -lt "$BASELINE_BYTES"
          saved=$((BASELINE_BYTES - bytes))
          pct="$(python3 - <<PY
          baseline=$BASELINE_BYTES
          optimized=$bytes
          print(f'{(baseline-optimized)*100/baseline:.2f}')
          PY
          )"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "saved=$saved" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Optimized APK: $bytes bytes; saved $saved bytes ($pct%)." >> "$GITHUB_STEP_SUMMARY"

      - name: Validate project after shrinking change
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/architecture/platform_boundaries_test.dart
          test "$(git diff --name-only)" = 'android/app/build.gradle.kts'

      - name: Commit and fast-forward private branch
        id: publish
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          BASELINE_BYTES: ${{ steps.baseline.outputs.bytes }}
          OPTIMIZED_BYTES: ${{ steps.optimized.outputs.bytes }}
          SAVED_PCT: ${{ steps.optimized.outputs.pct }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android/app/build.gradle.kts
          git commit -m "perf(android): enable release shrinking (${SAVED_PCT}% smaller)"
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/GoAnime-Mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/GoAnime-Mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          unset auth PRIVATE_REPOSITORIES_TOKEN
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: echo "Published GoAnime Android shrinking SHA ${{ steps.publish.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
