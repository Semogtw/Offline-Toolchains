name: Validate Fichario semantic coverage

on:
  push:
    branches:
      - tooling/validate-semantic-coverage-20260810
    paths:
      - .github/workflows/validate-fichario-semantic-coverage.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Fichario semantic coverage branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: feature/unit-topic-coverage
          path: public-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Record source commit
        run: git -C public-source rev-parse HEAD

      - name: Set up pnpm 10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          check-latest: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Install frozen dependencies
        working-directory: public-source
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with host dependencies
        working-directory: public-source
        run: pnpm exec playwright install --with-deps chromium

      - name: Run complete verification
        id: verify
        continue-on-error: true
        working-directory: public-source
        shell: bash
        run: |
          set -o pipefail
          pnpm verify:full 2>&1 | tee "$RUNNER_TEMP/semantic-coverage-verify.log"

      - name: Generate formatter diagnostics
        if: steps.verify.outcome == 'failure'
        working-directory: public-source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write . >/dev/null
          git diff --no-ext-diff --no-color -- . > "$RUNNER_TEMP/semantic-coverage-prettier.patch" || true

      - name: Upload failure diagnostics
        if: steps.verify.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-coverage-validation-failure
          path: |
            ${{ runner.temp }}/semantic-coverage-verify.log
            ${{ runner.temp }}/semantic-coverage-prettier.patch
          if-no-files-found: error
          retention-days: 1

      - name: Reject failed verification
        if: steps.verify.outcome == 'failure'
        run: exit 1
