name: Validate Fichario semantic coverage

on:
  push:
    branches:
      - tooling/validate-semantic-coverage-20260810
    paths:
      - .github/workflows/validate-fichario-semantic-coverage.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Fichario semantic coverage branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: feature/unit-topic-coverage
          path: public-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Record source commit
        run: git -C public-source rev-parse HEAD

      - name: Set up pnpm 10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          check-latest: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Install frozen dependencies
        working-directory: public-source
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with host dependencies
        working-directory: public-source
        run: pnpm exec playwright install --with-deps chromium

      - name: Format semantic coverage files in validation workspace
        working-directory: public-source
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec prettier --write \
            docs/README.md \
            docs/UNIT_TOPIC_COVERAGE.md \
            docs/SEMANTIC_COVERAGE.md \
            src/lib/coverage/semantic-coverage.ts \
            src/lib/services/semantic-coverage.ts \
            src/lib/services/topic-coverage.ts \
            src/routes/coverage/+page.svelte \
            supabase/functions/_shared/gemini-embedding-client.ts \
            supabase/functions/_shared/gemini-coverage-verifier.ts \
            supabase/functions/_shared/semantic-chunks.ts \
            supabase/functions/semantic-coverage/index.ts \
            tests/unit/coverage/semantic-coverage.test.ts \
            tests/unit/coverage/semantic-service.test.ts \
            tests/unit/coverage/semantic-chunks.test.ts \
            tests/unit/coverage/gemini-semantic-clients.test.ts

      - name: Upload formatted semantic source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-coverage-formatted-source
          path: |
            public-source/docs/README.md
            public-source/docs/UNIT_TOPIC_COVERAGE.md
            public-source/docs/SEMANTIC_COVERAGE.md
            public-source/src/lib/coverage/semantic-coverage.ts
            public-source/src/lib/services/semantic-coverage.ts
            public-source/src/lib/services/topic-coverage.ts
            public-source/src/routes/coverage/+page.svelte
            public-source/supabase/functions/_shared/gemini-embedding-client.ts
            public-source/supabase/functions/_shared/gemini-coverage-verifier.ts
            public-source/supabase/functions/_shared/semantic-chunks.ts
            public-source/supabase/functions/semantic-coverage/index.ts
            public-source/tests/unit/coverage/semantic-coverage.test.ts
            public-source/tests/unit/coverage/semantic-service.test.ts
            public-source/tests/unit/coverage/semantic-chunks.test.ts
            public-source/tests/unit/coverage/gemini-semantic-clients.test.ts
          if-no-files-found: error
          retention-days: 1

      - name: Run semantic coverage validation matrix
        id: verify
        continue-on-error: true
        working-directory: public-source
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/semantic-coverage-verify.log"
          : > "$log"
          failures=0
          run_gate() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            echo "===== $name exit=$status =====" | tee -a "$log"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_gate feature-format pnpm exec prettier --check \
            docs/README.md docs/UNIT_TOPIC_COVERAGE.md docs/SEMANTIC_COVERAGE.md \
            src/lib/coverage/semantic-coverage.ts src/lib/services/semantic-coverage.ts \
            src/lib/services/topic-coverage.ts src/routes/coverage/+page.svelte \
            supabase/functions/_shared/gemini-embedding-client.ts \
            supabase/functions/_shared/gemini-coverage-verifier.ts \
            supabase/functions/_shared/semantic-chunks.ts supabase/functions/semantic-coverage/index.ts \
            tests/unit/coverage/semantic-coverage.test.ts tests/unit/coverage/semantic-service.test.ts \
            tests/unit/coverage/semantic-chunks.test.ts tests/unit/coverage/gemini-semantic-clients.test.ts
          run_gate feature-eslint pnpm exec eslint \
            src/lib/coverage/semantic-coverage.ts src/lib/services/semantic-coverage.ts \
            src/lib/services/topic-coverage.ts src/routes/coverage/+page.svelte \
            tests/unit/coverage/semantic-coverage.test.ts tests/unit/coverage/semantic-service.test.ts \
            tests/unit/coverage/semantic-chunks.test.ts tests/unit/coverage/gemini-semantic-clients.test.ts
          run_gate typecheck pnpm check
          run_gate unit-tests pnpm test
          run_gate build pnpm build
          run_gate e2e pnpm test:e2e
          run_gate offline-source pnpm test:source:offline
          run_gate edge-functions pnpm test:functions:check
          run_gate local-db pnpm test:db:local
          exit "$failures"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-coverage-validation-log
          path: ${{ runner.temp }}/semantic-coverage-verify.log
          if-no-files-found: error
          retention-days: 1

      - name: Reject failed validation
        if: steps.verify.outcome == 'failure'
        run: exit 1
