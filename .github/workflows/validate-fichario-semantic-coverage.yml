name: Validate Fichario semantic coverage

on:
  push:
    branches:
      - tooling/validate-semantic-coverage-20260810
    paths:
      - .github/workflows/validate-fichario-semantic-coverage.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PUBLIC_SUPABASE_URL: https://playwright-fichario.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_playwright_capture_1234567890
    steps:
      - name: Checkout Fichario semantic coverage branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/FicharioVirtual
          ref: feature/unit-topic-coverage
          path: public-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Record source commit
        run: git -C public-source rev-parse HEAD

      - name: Set up pnpm 10
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Set up Node.js 22.16
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.16.0"
          check-latest: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Install frozen dependencies
        working-directory: public-source
        run: pnpm install --frozen-lockfile

      - name: Install Chromium with host dependencies
        working-directory: public-source
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply final semantic repairs in validation workspace
        working-directory: public-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          edge = Path('supabase/functions/semantic-coverage/index.ts')
          source = edge.read_text()
          before = source
          old = """\tfor (const page of pages) {
          \t\tfor (const chunk of chunkSemanticText(page.source_text)) {
          \t\t\tif (flattened.length >= MAX_INDEX_CHUNKS_PER_RUN) break;
          \t\t\tflattened.push({ page, chunkIndex: chunk.index, chunkText: chunk.text });
          \t\t}
          \t\tif (flattened.length >= MAX_INDEX_CHUNKS_PER_RUN) break;
          \t}
          """
          new = """\tfor (const page of pages) {
          \t\tconst chunks = chunkSemanticText(page.source_text);
          \t\tif (chunks.length === 0) continue;
          \t\tif (flattened.length + chunks.length > MAX_INDEX_CHUNKS_PER_RUN) break;
          \t\tfor (const chunk of chunks) {
          \t\t\tflattened.push({ page, chunkIndex: chunk.index, chunkText: chunk.text });
          \t\t}
          \t}
          """
          if old not in source:
              raise SystemExit('chunk-loop repair target not found')
          source = source.replace(old, new, 1)

          old = "index: await indexStats(supabase, embeddingModel, parsed.notebookId),"
          if old not in source:
              raise SystemExit('fallback index repair target not found')
          source = source.replace(
              "\t\t\tconst topics = await lexicalTopics(supabase, parsed);\n\t\t\treturn respond(200, {",
              "\t\t\tconst topics = await lexicalTopics(supabase, parsed);\n\t\t\tconst stats = await indexStats(supabase, embeddingModel, parsed.notebookId);\n\t\t\treturn respond(200, {",
              1,
          )
          source = source.replace(old, "index: stats ? { ...stats, indexedThisRun: 0 } : null,", 1)
          if source == before:
              raise SystemExit('semantic edge was not repaired')
          edge.write_text(source)

          verifier = Path('supabase/functions/_shared/gemini-coverage-verifier.ts')
          source = verifier.read_text()
          if 'maxOutputTokens:' not in source:
              target = "\t\t\t\t\ttemperature: 0,\n\t\t\t\t\tresponseMimeType: 'application/json',"
              replacement = "\t\t\t\t\ttemperature: 0,\n\t\t\t\t\tmaxOutputTokens: 2_048,\n\t\t\t\t\tresponseMimeType: 'application/json',"
              if target not in source:
                  raise SystemExit('verifier output-token target not found')
              source = source.replace(target, replacement, 1)
              verifier.write_text(source)
          PY
          pnpm exec prettier --write \
            supabase/functions/semantic-coverage/index.ts \
            supabase/functions/_shared/gemini-coverage-verifier.ts

      - name: Upload exact repaired semantic files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-coverage-final-repairs
          path: |
            public-source/supabase/functions/semantic-coverage/index.ts
            public-source/supabase/functions/_shared/gemini-coverage-verifier.ts
          if-no-files-found: error
          retention-days: 1

      - name: Run final validation matrix
        id: verify
        continue-on-error: true
        working-directory: public-source
        shell: bash
        run: |
          set +e
          set -uo pipefail
          log="$RUNNER_TEMP/semantic-coverage-final.log"
          : > "$log"
          failures=0
          run_gate() {
            name="$1"
            shift
            echo "===== $name =====" | tee -a "$log"
            "$@" 2>&1 | tee -a "$log"
            status=${PIPESTATUS[0]}
            echo "===== $name exit=$status =====" | tee -a "$log"
            if [ "$status" -ne 0 ]; then failures=$((failures + 1)); fi
          }
          run_gate semantic-format pnpm exec prettier --check \
            supabase/functions/semantic-coverage/index.ts \
            supabase/functions/_shared/gemini-coverage-verifier.ts
          run_gate typecheck pnpm check
          run_gate semantic-unit pnpm exec vitest run \
            tests/unit/coverage/semantic-coverage.test.ts \
            tests/unit/coverage/semantic-service.test.ts \
            tests/unit/coverage/semantic-chunks.test.ts \
            tests/unit/coverage/gemini-semantic-clients.test.ts \
            tests/unit/coverage/semantic-provider-telemetry.test.ts
          run_gate unit-tests pnpm test
          run_gate build pnpm build
          run_gate e2e pnpm test:e2e
          run_gate offline-source pnpm test:source:offline
          run_gate edge-functions pnpm test:functions:check
          run_gate local-db pnpm test:db:local
          exit "$failures"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: semantic-coverage-final-log
          path: ${{ runner.temp }}/semantic-coverage-final.log
          if-no-files-found: error
          retention-days: 1

      - name: Reject failed validation
        if: steps.verify.outcome == 'failure'
        run: exit 1
