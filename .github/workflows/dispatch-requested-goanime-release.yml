name: Dispatch requested GoAnime release

on:
  push:
    branches: [main]
    paths:
      - 'requests/goanime-release/*.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: goanime-release-request
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.repository == 'Semogtw/Offline-Toolchains'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate release request and dispatch canonical workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json, pathlib, re
          requests = list(pathlib.Path('requests/goanime-release').glob('v*.json'))
          if not requests:
              raise SystemExit('No release request file found')
          def version_of(request):
              text = request.stem.removeprefix('v')
              if not re.fullmatch(r'[0-9]+\\.[0-9]+\\.[0-9]+', text):
                  raise SystemExit('Invalid request filename')
              return tuple(int(part) for part in text.split('.'))
          latest = max(requests, key=version_of)
          payload = json.loads(latest.read_text(encoding='utf-8'))
          version = payload.get('version')
          if version != latest.stem.removeprefix('v'):
              raise SystemExit('Request filename and version disagree')
          if not isinstance(version, str) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Invalid version')
          print(version)
          PY
          )"
          gh workflow run release-goanime.yml \
            --ref main \
            -f source_ref=main \
            -f version="$version" \
            -f platforms=android,windows,linux \
            -f release_notes="GoAnime v$version: atualizações de desempenho, navegação, leitor e catálogo integradas à main."
