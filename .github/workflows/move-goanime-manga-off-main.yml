name: Move GoAnime manga implementation off main

on:
  workflow_run:
    workflows:
      - Request private project CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: goanime-manga-main-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Preserve manga branch and clean GoAnime main
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'build/private-ci' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted request implementation
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false
          sparse-checkout: |
            scripts/private_ci_request.py
            config/workflow-hub-projects.json
          sparse-checkout-cone-mode: false

      - name: Checkout connector request revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/private-ci.json
          sparse-checkout-cone-mode: false

      - name: Normalize trusted request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          normalized="$(python3 trusted-source/scripts/private_ci_request.py request-source/triggers/private-ci.json)"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          request = json.loads(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              for key in ("project", "repository", "ref"):
                  value = request[key]
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"unsafe newline in normalized {key}")
                  stream.write(f"{key}={value}\n")
          PY

      - name: Authorize this one-shot migration request
        id: guard
        shell: bash
        env:
          PROJECT: ${{ steps.request.outputs.project }}
          REPOSITORY: ${{ steps.request.outputs.repository }}
          REQUEST_REF: ${{ steps.request.outputs.ref }}
          EXPECTED_REF: aeebd928ed65c8af448058b0ec71f901039b4a19
        run: |
          set -euo pipefail
          if [[ "$PROJECT" == "goanime" && \
                "$REPOSITORY" == "Semogtw/goanime-mobile" && \
                "$REQUEST_REF" == "$EXPECTED_REF" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private GoAnime main
        if: steps.guard.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify protected feature branch and classify commits
        if: steps.guard.outputs.run == 'true'
        id: classify
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_HEAD: aeebd928ed65c8af448058b0ec71f901039b4a19
          BASELINE: 6ee78ca09f004e55718cd71dec0d6075bceb7a15
          FEATURE_BRANCH: feature/manga-platform
        run: |
          set -euo pipefail
          current="$(git rev-parse HEAD)"
          [[ "$current" == "$EXPECTED_HEAD" ]] || {
            echo "main moved: expected $EXPECTED_HEAD, got $current" >&2
            exit 1
          }

          feature="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | awk '{print $1}')"
          [[ "$feature" == "$EXPECTED_HEAD" ]] || {
            echo "feature branch is not protecting the original head" >&2
            exit 1
          }

          git merge-base --is-ancestor "$BASELINE" HEAD

          : > /tmp/manga-commits-oldest.txt
          : > /tmp/keep-commits-oldest.txt
          while read -r sha; do
            subject="$(git show -s --format=%s "$sha")"
            if [[ "$subject" =~ ^[a-zA-Z]+\(manga\):[[:space:]] ]]; then
              echo "$sha" >> /tmp/manga-commits-oldest.txt
            else
              echo "$sha" >> /tmp/keep-commits-oldest.txt
            fi
          done < <(git rev-list --reverse "$BASELINE..HEAD")

          manga_count="$(wc -l < /tmp/manga-commits-oldest.txt | tr -d ' ')"
          keep_count="$(wc -l < /tmp/keep-commits-oldest.txt | tr -d ' ')"
          (( manga_count >= 30 )) || {
            echo "refusing migration: unexpectedly few manga commits ($manga_count)" >&2
            exit 1
          }
          (( keep_count >= 1 )) || {
            echo "refusing migration: expected concurrent non-manga commits" >&2
            exit 1
          }

          echo "manga_count=$manga_count" >> "$GITHUB_OUTPUT"
          echo "keep_count=$keep_count" >> "$GITHUB_OUTPUT"
          echo "Manga commits selected: $manga_count"
          echo "Concurrent commits preserved: $keep_count"
          while read -r sha; do
            printf 'KEEP %s %s\n' "$sha" "$(git show -s --format=%s "$sha")"
          done < /tmp/keep-commits-oldest.txt

      - name: Build expected clean-main tree from baseline plus concurrent commits
        if: steps.guard.outputs.run == 'true'
        id: expected
        working-directory: private-source
        shell: bash
        env:
          BASELINE: 6ee78ca09f004e55718cd71dec0d6075bceb7a15
        run: |
          set -euo pipefail
          git config user.name "GoAnime Toolchains"
          git config user.email "actions@users.noreply.github.com"

          expected_dir="$RUNNER_TEMP/goanime-expected-main"
          git worktree add --detach "$expected_dir" "$BASELINE"
          while read -r sha; do
            [[ -n "$sha" ]] || continue
            git -C "$expected_dir" cherry-pick "$sha"
          done < /tmp/keep-commits-oldest.txt
          expected_tree="$(git -C "$expected_dir" rev-parse 'HEAD^{tree}')"
          echo "tree=$expected_tree" >> "$GITHUB_OUTPUT"
          git worktree remove --force "$expected_dir"

      - name: Revert only manga implementation commits on main
        if: steps.guard.outputs.run == 'true'
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_TREE: ${{ steps.expected.outputs.tree }}
        run: |
          set -euo pipefail
          git config user.name "GoAnime Toolchains"
          git config user.email "actions@users.noreply.github.com"

          tac /tmp/manga-commits-oldest.txt | while read -r sha; do
            [[ -n "$sha" ]] || continue
            echo "Reverting $sha $(git show -s --format=%s "$sha")"
            git revert --no-commit "$sha"
          done

          actual_tree="$(git write-tree)"
          [[ "$actual_tree" == "$EXPECTED_TREE" ]] || {
            echo "safety check failed: reverted tree does not equal baseline + concurrent commits" >&2
            echo "expected: $EXPECTED_TREE" >&2
            echo "actual:   $actual_tree" >&2
            exit 1
          }

          git commit -m "revert(manga): move implementation to feature branch"
          git push origin HEAD:main

      - name: Verify remote refs after migration
        if: steps.guard.outputs.run == 'true'
        working-directory: private-source
        shell: bash
        env:
          ORIGINAL_HEAD: aeebd928ed65c8af448058b0ec71f901039b4a19
          FEATURE_BRANCH: feature/manga-platform
        run: |
          set -euo pipefail
          feature="$(git ls-remote origin "refs/heads/$FEATURE_BRANCH" | awk '{print $1}')"
          main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          [[ "$feature" == "$ORIGINAL_HEAD" ]]
          [[ "$main" != "$ORIGINAL_HEAD" ]]
          echo "feature=$feature"
          echo "main=$main"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$RUNNER_TEMP/goanime-expected-main"
