name: Fix GoAnime Taimu empty-page continuation

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-taimu-empty-page-continuation-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-taimu-empty-page-continuation-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Reject contradictory empty Taimu chapter pages
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply exact-SHA Taimu empty-page continuation fix
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: bash scripts/fix-goanime-taimu-empty-page-continuation.sh
