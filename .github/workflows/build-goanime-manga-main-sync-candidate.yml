name: Build GoAnime manga-main sync candidate

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-sync-candidate/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-main-sync-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: Build and validate manga-main merge candidate
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require private tokens
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          GOANIME_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          test -n "$PRIVATE_REPOSITORIES_TOKEN"
          test -n "$GOANIME_WRITE_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact revisions
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-sync-candidate/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch branch_sha main_sha < "control/$request"
          test "$project" = goanime
          test "$branch" = codex/manga-parity-20260823
          [[ "$branch_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "branch_sha=$branch_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "temp_branch=toolchain/manga-main-sync-${branch_sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact manga branch revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.branch_sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Merge exact main with current-main conflict preference
        id: merge
        working-directory: private-source
        shell: bash
        env:
          GOANIME_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_BRANCH_SHA: ${{ steps.request.outputs.branch_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_BRANCH_SHA"
          auth="$(printf 'x-access-token:%s' "$GOANIME_WRITE_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin main "$TARGET_BRANCH"
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_BRANCH_SHA"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --no-ff -X theirs -m 'merge: sync latest main into manga parity' "$EXPECTED_MAIN_SHA"
          test -z "$(git diff --name-only --diff-filter=U)"
          test "$(git rev-parse HEAD^1)" = "$EXPECTED_BRANCH_SHA"
          test "$(git rev-parse HEAD^2)" = "$EXPECTED_MAIN_SHA"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          unset auth GOANIME_WRITE_TOKEN
          # Validate only the candidate delta against main. Comparing with the
          # branch parent validates all files introduced by main as well, which
          # includes pre-existing Markdown hard-break whitespace.
          git diff --check "$EXPECTED_MAIN_SHA"..HEAD -- \
            ':(exclude)*.md' \
            ':(exclude)**/*.md'

      - name: Repair merge-sensitive shared files
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_BRANCH_SHA: ${{ steps.request.outputs.branch_sha }}
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          # -X theirs resolves conflict hunks, but it can still splice
          # adjacent edits from both long-lived parents into invalid Dart.
          # Main owns the metadata/episode infrastructure; restore those files
          # as complete units before formatting and analysis.
          git checkout "$EXPECTED_MAIN_SHA" -- \
            lib/services/source/episode_aggregator.dart \
            lib/services/availability_service.dart \
            lib/services/jikan_http_client_registry.dart \
            lib/services/metadata_api_config.dart \
            lib/services/metadata_transport_bootstrap.dart \
            lib/services/metadata_routing_http_client.dart \
            lib/services/metadata_bearer_policy.dart \
            lib/services/metadata_endpoint_policy.dart \
            lib/services/metadata_public_egress_guard.dart \
            lib/services/metadata_stream_limits.dart \
            lib/services/unified_source_service.dart

          # The Manga branch has the coherent shared-media generation. Keep
          # these files together; selecting individual hunks creates hybrids
          # that compile neither the branch architecture nor current main.
          git checkout "$EXPECTED_BRANCH_SHA" -- \
            lib/app/app.dart \
            lib/app/bootstrap.dart \
            lib/screens/home_screen.dart \
            lib/screens/home_screen_data.dart \
            lib/screens/home_screen_presentation.dart \
            lib/screens/main_navigation_screen.dart \
            lib/screens/search_screen.dart \
            lib/screens/search_screen_data.dart \
            lib/screens/search_screen_presentation.dart \
            lib/screens/watchlist_screen.dart \
            lib/screens/manga/manga_details_screen.dart \
            lib/services/providers/anime_provider_search_service.dart \
            lib/services/providers/provider_health_ranker.dart \
            lib/services/providers/provider_health_service.dart \
            packages/goanime_core/lib/src/providers/anime_source_provider_registry.dart \
            packages/goanime_core/lib/goanime_core.dart

          # Keep the latest cancellation implementation from main while
          # retaining the branch's provider identity/display-name contract.
          git checkout "$EXPECTED_MAIN_SHA" -- \
            packages/goanime_core/lib/src/providers/anime_source_provider.dart

          git rm -f --ignore-unmatch -- \
            lib/services/image_source_resolver_service.dart \
            test/services/availability_service_feature_flag_test.dart \
            test/services/image_source_resolver_service_test.dart \
            lib/screens/manga/widgets/manga_volumes_list.dart

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label}: expected source anchor missing')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Union the two provider contracts instead of choosing either
          # incompatible parent wholesale.
          provider = Path('packages/goanime_core/lib/src/providers/anime_source_provider.dart')
          provider_text = provider.read_text(encoding='utf-8')
          if "import '../media/provider_key.dart';" not in provider_text:
              provider_text = provider_text.replace(
                  "import '../models/source_models.dart';",
                  "import '../media/provider_key.dart';\nimport '../models/source_models.dart';",
                  1,
              )
          if 'extension AnimeSourceProviderMediaExtension' not in provider_text:
              marker = '\n/// Optional capability for providers that can propagate cancellation into\n'
              extension = "\nextension AnimeSourceProviderMediaExtension on AnimeSourceProvider {\n  ProviderKey get providerKey => ProviderKey.anime(source.name);\n  String get displayName => name;\n}\n"
              if marker not in provider_text:
                  raise SystemExit('anime provider contract: capability marker missing')
              provider_text = provider_text.replace(marker, extension + marker, 1)
          provider.write_text(provider_text, encoding='utf-8')

          # Home tests from current main exercise an injectable history
          # service; carry that test seam into the branch's snapshot Home.
          home = Path('lib/screens/home_screen.dart')
          home_text = home.read_text(encoding='utf-8')
          if 'final WatchHistoryService? historyService;' not in home_text:
              replace_once(
                  str(home),
                  '  final JikanService? jikanService;\n\n  const HomeScreen(',
                  '  final JikanService? jikanService;\n  final WatchHistoryService? historyService;\n\n  static WatchHistoryService? _historyServiceOverrideForTesting;\n\n  const HomeScreen(',
                  'home history field',
              )
              replace_once(
                  str(home),
                  '    this.onSearchPressed,\n    this.jikanService,\n  });',
                  '    this.onSearchPressed,\n    this.jikanService,\n    this.historyService,\n  });\n\n  @visibleForTesting\n  static void debugSetHistoryServiceForTesting(WatchHistoryService? service) {\n    _historyServiceOverrideForTesting = service;\n  }',
                  'home history constructor',
              )
              replace_once(
                  str(home),
                  '  final WatchHistoryService _historyService = WatchHistoryService();',
                  '  late final WatchHistoryService _historyService;',
                  'home history storage',
              )
              replace_once(
                  str(home),
                  '    _jikanService = widget.jikanService ?? JikanService(propagateErrors: true);',
                  '    _jikanService = widget.jikanService ?? JikanService(propagateErrors: true);\n    _historyService =\n        widget.historyService ??\n        HomeScreen._historyServiceOverrideForTesting ??\n        WatchHistoryService();',
                  'home history initialization',
              )

          # The queue coordinator survived the merge, but one old loop from
          # main remained. Restore the coordinator-owned enqueue path.
          queue = Path('lib/services/download/download_queue_manager.dart')
          queue_text = queue.read_text(encoding='utf-8')
          old_queue = '''  void _processQueue() {
              final queuedDownloads =
                  _downloads.values
                      .where((d) => d.status == DownloadStatus.queued)
                      .toList()
                    ..sort((a, b) => a.createdAt.compareTo(b.createdAt));

              for (var download in queuedDownloads) {
                if (_activeDownloadCount >= _maxConcurrentDownloads) break;
                unawaited(_startDownload(download.id));
              }
            }
          '''
          new_queue = '''  void _processQueue() {
              final queuedDownloads =
                  _downloads.values
                      .where((d) => d.status == DownloadStatus.queued)
                      .toList()
                    ..sort((a, b) => a.createdAt.compareTo(b.createdAt));

              for (final download in queuedDownloads) {
                if (_queueCoordinator.isKnown(download.id)) continue;
                final future = _queueCoordinator.enqueue<void>(
                  key: download.id,
                  operation: (_) => _startDownload(download.id),
                );
                unawaited(
                  future.then<void>(
                    (_) {},
                    onError: (Object error, StackTrace stackTrace) {
                      if (error is MediaDownloadQueueCancelledException) return;
                      debugPrint(
                        '[Download] Queue execution failed for ${download.id}: $error',
                      );
                    },
                  ),
                );
              }
            }
          '''
          if old_queue in queue_text:
              queue_text = queue_text.replace(old_queue, new_queue, 1)
              queue.write_text(queue_text, encoding='utf-8')
          elif '_queueCoordinator.isKnown(download.id)' not in queue_text:
              raise SystemExit('download queue: coordinator enqueue path missing')

          # Keep bounded provider concurrency and cancellation in the branch
          # implementation while preserving its newer scheduler contract.
          search = Path('lib/services/providers/anime_provider_search_service.dart')
          search_text = search.read_text(encoding='utf-8')
          if not search_text.startswith("import 'dart:async';"):
              search_text = "import 'dart:async';\n\n" + search_text
          search_text = search_text.replace(
              '  Future<List<Anime>> searchAll(String title) async {',
              "  Future<List<Anime>> searchAll(\n    String title, {\n    CancellationSignal? cancellation,\n  }) async {",
              1,
          )
          search_text = search_text.replace(
              '    if (query.isEmpty || providers.isEmpty) return const <Anime>[];\n',
              '    if (query.isEmpty || providers.isEmpty) return const <Anime>[];\n    cancellation?.throwIfCancelled();\n',
              1,
          )
          search_text = search_text.replace(
              '_searchProvider(scheduler, provider, query),',
              '_searchProvider(scheduler, provider, query, cancellation),',
              1,
          )
          search_text = search_text.replace(
              '      return List.unmodifiable(results);\n',
              '      cancellation?.throwIfCancelled();\n      return List.unmodifiable(results);\n',
              1,
          )
          search_text = search_text.replace(
              '''  Future<List<Anime>> _searchProvider(
              ProviderRequestScheduler scheduler,
              AnimeSourceProvider provider,
              String query,
            ) async {
              try {
                return await scheduler.schedule<List<Anime>>(
                  providerKey: provider.providerKey,
                  priority: RequestPriority.prefetch,
                  operation: () => provider.searchAnime(query),
                );
              } catch (_) {
                return const <Anime>[];
              }
            }
          ''',
              '''  Future<List<Anime>> _searchProvider(
              ProviderRequestScheduler scheduler,
              AnimeSourceProvider provider,
              String query,
              CancellationSignal? cancellation,
            ) async {
              final operationController = CancellationController();
              final requestToken = MediaRequestCancellationToken();
              if (cancellation != null) {
                unawaited(
                  cancellation.whenCancelled.then((_) {
                    operationController.cancel();
                    requestToken.cancel();
                  }),
                );
              }
              unawaited(
                requestToken.whenCancelled.then((_) => operationController.cancel()),
              );
              try {
                return await scheduler.schedule<List<Anime>>(
                  providerKey: provider.providerKey,
                  priority: RequestPriority.prefetch,
                  cancellationToken: requestToken,
                  operation: () => provider.searchAnimeWithCancellation(
                    query,
                    operationController.signal,
                  ),
                );
              } on OperationCancelledException {
                if (cancellation?.isCancelled ?? false) rethrow;
                return const <Anime>[];
              } on MediaRequestCancelledException {
                if (cancellation?.isCancelled ?? false) {
                  throw const OperationCancelledException();
                }
                return const <Anime>[];
              } catch (_) {
                return const <Anime>[];
              }
            }
          ''',
              1,
          )
          required_search_anchors = (
              'CancellationSignal? cancellation',
              'cancellationToken: requestToken',
              'provider.searchAnimeWithCancellation',
          )
          if not all(anchor in search_text for anchor in required_search_anchors):
              raise SystemExit('anime provider search: union anchors missing')
          search.write_text(search_text, encoding='utf-8')

          # Repair the small analyzer drift introduced when the branch and
          # current main were merged. Keep the surrounding branch/main
          # behavior intact and make every transformation fail closed when
          # its expected source shape changes.
          history = Path('lib/screens/history_screen.dart')
          replace_once(
              str(history),
              '    unawaited(_loadHistory());',
              '''    _historyController = HistorySnapshotController<HistoryAnime>(
                dataSource: AnimeHistorySnapshotAdapter(_historyService),
              )..addListener(_onHistoryChanged);
              unawaited(_historyController.loadInitial());''',
              'history snapshot controller initialization',
          )

          weekly = Path('lib/services/weekly_schedule_service.dart')
          replace_once(
              str(weekly),
              "import 'jikan_http_client_registry.dart';\nimport 'broadcast_schedule_cache.dart';\nimport 'jikan_http_client_registry.dart';",
              "import 'jikan_http_client_registry.dart';\nimport 'broadcast_schedule_cache.dart';",
              'weekly schedule duplicate import',
          )

          sidebar = Path('lib/widgets/navigation/goanime_desktop_sidebar.dart')
          sidebar_text = sidebar.read_text(encoding='utf-8')
          if '    final mediaAction = mediaSwitchAction;\n\n' not in sidebar_text:
              raise SystemExit('desktop sidebar: stale media local missing')
          sidebar_text = sidebar_text.replace(
              '    final mediaAction = mediaSwitchAction;\n\n',
              '',
              1,
          )
          destination_start = sidebar_text.find(
              '    Widget destinationItem(GoAnimeNavigationDestination destination) {'
          )
          destination_end = sidebar_text.find('    return AnimatedContainer(', destination_start)
          if destination_start < 0 or destination_end < 0:
              raise SystemExit('desktop sidebar: stale destination helper missing')
          sidebar_text = sidebar_text[:destination_start] + sidebar_text[destination_end:]
          old_destination_loop = (
              'for (var index = 0; index < destinations.length; index++)'
          )
          if old_destination_loop not in sidebar_text:
              raise SystemExit('desktop sidebar: destination loop anchor missing')
          sidebar_text = sidebar_text.replace(
              old_destination_loop,
              'for (var index = 0; index < destinations.length - 1; index++)',
              1,
          )
          sidebar_insert = (
              '                if (mediaSwitchAction != null)\n'
              '                  Padding(\n'
              '                    padding: const EdgeInsets.only(bottom: 6),\n'
              '                    child: _DesktopSidebarItem(\n'
              '                      icon: mediaSwitchAction!.icon,\n'
              '                      label: mediaSwitchAction!.label,\n'
              '                      compact: compact,\n'
              '                      traversalOrder: NumericFocusOrder(\n'
              '                        (destinations.length - 1).toDouble(),\n'
              '                      ),\n'
              '                      onPressed: mediaSwitchAction!.onPressed,\n'
              '                    ),\n'
              '                  ),\n'
              '                Padding(\n'
              '                  padding: const EdgeInsets.only(bottom: 6),\n'
              '                  child: _DesktopSidebarItem(\n'
              '                    icon: currentIndex == destinations[destinations.length - 1].index\n'
              '                        ? destinations[destinations.length - 1].selectedIcon\n'
              '                        : destinations[destinations.length - 1].icon,\n'
              '                    label: destinations[destinations.length - 1].label,\n'
              '                    selected: currentIndex == destinations[destinations.length - 1].index,\n'
              '                    compact: compact,\n'
              '                    traversalOrder: NumericFocusOrder(\n'
              '                      destinations.length.toDouble(),\n'
              '                    ),\n'
              '                    onPressed: () =>\n'
              '                        onSelected(destinations[destinations.length - 1].index),\n'
              '                  ),\n'
              '                ),\n'
              '                const SizedBox(height: GoAnimeSpacing.sm),\n'
          )
          sidebar_anchor = '                const SizedBox(height: GoAnimeSpacing.sm),\n'
          if sidebar_anchor not in sidebar_text:
              raise SystemExit('desktop sidebar: media insertion anchor missing')
          sidebar_text = sidebar_text.replace(sidebar_anchor, sidebar_insert, 1)
          sidebar_text = sidebar_text.replace(
              '(destinations.length + index).toDouble(),',
              '(destinations.length + 1 + index).toDouble(),',
              1,
          )
          sidebar_text = sidebar_text.replace(
              '(destinations.length + secondaryActions.length).toDouble(),',
              '(destinations.length + 1 + secondaryActions.length).toDouble(),',
              1,
          )
          if 'mediaSwitchAction!.onPressed' not in sidebar_text:
              raise SystemExit('desktop sidebar: media action repair missing')
          sidebar.write_text(sidebar_text, encoding='utf-8')

          health_guard = Path('test/architecture/provider_health_summary_guard_test.dart')
          health_guard_old = (
              "    final coreHealth = File(\n"
              "      'packages/goanime_core/lib/src/media/media_provider_health.dart',\n"
              "    ).readAsStringSync();\n\n"
          )
          replace_once(
              str(health_guard),
              health_guard_old,
              '',
              'provider health unused compatibility read',
          )

          home_contract = Path('test/screens/home_bootstrap_single_flight_contract_test.dart')
          home_contract_old = (
              "      final adapter = File(\n"
              "        'lib/services/media/anime_home_snapshot_adapter.dart',\n"
              "      ).readAsStringSync();\n\n"
          )
          replace_once(
              str(home_contract),
              home_contract_old,
              '',
              'home contract unused adapter read',
          )

          episode_health = Path('test/services/source/episode_aggregator_health_routing_test.dart')
          episode_health_text = episode_health.read_text(encoding='utf-8')
          ranker_import = (
              "import 'package:goanime/services/providers/provider_health_ranker.dart';\n"
          )
          if episode_health_text.count(ranker_import) > 1:
              episode_health_text = episode_health_text.replace(ranker_import, '', 1)
          if episode_health_text.count(ranker_import) != 1:
              raise SystemExit('episode health: provider ranker import contract missing')
          episode_health.write_text(episode_health_text, encoding='utf-8')

          replace_once(
              'lib/services/playback_provider_enrichment_service.dart',
              'onError: (Object _, StackTrace __) => finish(),',
              'onError: (Object _, StackTrace _) => finish(),',
              'playback enrichment analyzer cleanup',
          )
          replace_once(
              'lib/services/video_playback_resolver.dart',
              'onError: (Object _, StackTrace __) => providers,',
              'onError: (Object _, StackTrace _) => providers,',
              'video resolver analyzer cleanup',
          )
          replace_once(
              'test/services/video_playback_resolver_late_provider_test.dart',
              'streamExtractor: (_, __) async => VideoStreamResult(',
              'streamExtractor: (_, _) async => VideoStreamResult(',
              'late provider analyzer cleanup',
          )

          # MangaLivre's private fixture and runtime policy require an Origin
          # header; the source commit is checked here so this never drifts into
          # a silent test-only workaround.
          provider_path = Path('lib/services/manga/providers/mangalivre_org_manga_provider.dart')
          if "'Origin': baseUri.origin" not in provider_path.read_text(encoding='utf-8'):
              raise SystemExit('MangaLivre.org provider is missing its API Origin header')

          # The branch barrel supplies Manga/media exports; add the current
          # main-only async/sync/signature exports as a small deterministic
          # union and fail closed if the anchor changes.
          barrel = Path('packages/goanime_core/lib/goanime_core.dart')
          barrel_text = barrel.read_text(encoding='utf-8')
          marker = "export 'src/update_manifest.dart';\n"
          main_exports = [
              "export 'src/async/cancellable_timeout.dart';",
              "export 'src/async/cancellation.dart';",
              "export 'src/sync/sync_scheduler_state.dart';",
              "export 'src/update_manifest_signature.dart';",
          ]
          missing_exports = [line for line in main_exports if line not in barrel_text]
          if missing_exports:
              if marker not in barrel_text:
                  raise SystemExit('goanime_core barrel: update manifest anchor missing')
              barrel_text = barrel_text.replace(
                  marker,
                  marker + '\n'.join(missing_exports) + '\n',
                  1,
              )
              barrel.write_text(barrel_text, encoding='utf-8')
          if not all(line in barrel_text for line in main_exports):
              raise SystemExit('goanime_core barrel: union exports incomplete')
          PY

      - name: Verify manga product survived shared-file resolution
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test -d lib/services/manga
          test -d lib/screens/manga
          test -d lib/widgets/manga
          test -f lib/services/manga/metadata/manga_jikan_metadata_service.dart
          test -f test/services/manga/metadata/manga_jikan_metadata_routing_test.dart
          grep -R -q "Manga" lib/screens/main_navigation_screen.dart lib/widgets/navigation/goanime_desktop_sidebar.dart
          grep -R -q "manga" lib/app lib/screens/home_screen.dart lib/screens/search_screen.dart lib/screens/history_screen.dart lib/screens/watchlist_screen.dart
          grep -q "assets/data/manga" pubspec.yaml

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Normalize merged Dart sources
        id: normalize
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ steps.request.outputs.main_sha }}
        run: |
          set -euo pipefail
          dart format lib test packages tools >/dev/null
          git diff --check -- lib test packages tools
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- lib test packages tools
          if ! git diff --cached --quiet; then
            git commit -m 'fix(manga): normalize merged Dart sources'
          fi
          dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Analyze merged project
        working-directory: private-source
        run: flutter analyze --no-pub

      - name: Validate manga and shared-media contracts
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test/services/manga
          flutter test --no-pub test/widgets/manga
          if [[ -d test/screens/manga ]]; then flutter test --no-pub test/screens/manga; fi
          flutter test --no-pub test/services/media
          flutter test --no-pub test/controllers/media
          flutter test --no-pub test/architecture/shared_media_infrastructure_guard_test.dart
          flutter test --no-pub test/architecture/shared_search_lifecycle_guard_test.dart
          flutter test --no-pub test/architecture/manga_offline_persistence_boundary_test.dart

      - name: Publish validated temporary candidate
        working-directory: private-source
        shell: bash
        env:
          GOANIME_WRITE_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_BRANCH_SHA: ${{ steps.request.outputs.branch_sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          TEMP_BRANCH: ${{ steps.request.outputs.temp_branch }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GOANIME_WRITE_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse origin/$TARGET_BRANCH)" = "$EXPECTED_BRANCH_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push --force-with-lease="refs/heads/$TEMP_BRANCH:" origin "HEAD:refs/heads/$TEMP_BRANCH"
          unset auth GOANIME_WRITE_TOKEN
          echo "Candidate SHA: $(git rev-parse HEAD)"
          echo "Candidate branch: $TEMP_BRANCH"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
