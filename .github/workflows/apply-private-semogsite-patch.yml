name: Apply private SemogSite patch

on:
  push:
    branches:
      - ops/semogsite-patch-requests
    paths:
      - triggers/semogsite-agent-patch.json
      - payloads/semogsite-agent-patch.diff.gz.b64

permissions:
  contents: read

concurrency:
  group: apply-private-semogsite-patch
  cancel-in-progress: false

jobs:
  apply:
    name: Apply verified SemogSite patch
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout trusted workflow implementation
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Checkout owner patch request
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: request
          persist-credentials: false
          sparse-checkout: |
            triggers/semogsite-agent-patch.json
            payloads/semogsite-agent-patch.diff.gz.b64
          sparse-checkout-cone-mode: false

      - name: Validate fixed patch request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          request = json.loads(Path("request/triggers/semogsite-agent-patch.json").read_text())
          required = {
              "repository": "Semogtw/SemogSite",
              "branch": "develop/editorial-workspace",
              "base_commit": "b24763bf783811b77522a3cf56038d93ff984fb4",
              "expected_head": "39154d210f04e44c07352da5ed88010c5960fb36",
              "expected_patch_sha256": "5349156abc8733263119d616eabcad98913a2e004eb577d400222b743cdbacfc",
              "expected_tree": "6a1e7cc1fa0802bc0d834bbefa74cd6f7e04cc02",
              "commit_message": "feat(editorial): complete publication lifecycle controls",
          }
          if request != required:
              raise SystemExit("Patch request differs from the reviewed fixed contract")
          for key, value in request.items():
              print(f"{key}={value}")
          PY

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || {
            echo "Missing Actions secret PRIVATE_REPOSITORIES_TOKEN." >&2
            exit 1
          }

      - name: Checkout fixed SemogSite branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/SemogSite
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: develop/editorial-workspace
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false

      - name: Apply reviewed patch and replace transport history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ steps.request.outputs.expected_head }}
          BASE_COMMIT: ${{ steps.request.outputs.base_commit }}
          EXPECTED_PATCH_SHA256: ${{ steps.request.outputs.expected_patch_sha256 }}
          EXPECTED_TREE: ${{ steps.request.outputs.expected_tree }}
          COMMIT_MESSAGE: ${{ steps.request.outputs.commit_message }}
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$EXPECTED_HEAD"
          base64 --decode request/payloads/semogsite-agent-patch.diff.gz.b64 \
            | gzip --decompress > "$RUNNER_TEMP/semogsite-agent.patch"
          test "$(sha256sum "$RUNNER_TEMP/semogsite-agent.patch" | awk '{print $1}')" = "$EXPECTED_PATCH_SHA256"

          git -C private-source reset --hard "$BASE_COMMIT"
          git -C private-source apply --index "$RUNNER_TEMP/semogsite-agent.patch"
          git -C private-source diff --cached --check
          test "$(git -C private-source write-tree)" = "$EXPECTED_TREE"

          git -C private-source config user.name "Arthur Almeida"
          git -C private-source config user.email "arthurgva1602@gmail.com"
          git -C private-source commit -m "$COMMIT_MESSAGE"
          git -C private-source push \
            --force-with-lease="refs/heads/develop/editorial-workspace:${EXPECTED_HEAD}" \
            origin HEAD:refs/heads/develop/editorial-workspace
