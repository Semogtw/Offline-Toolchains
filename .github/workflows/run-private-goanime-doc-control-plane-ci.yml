name: Validate GoAnime documentation control plane privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-doc-control-plane-ci/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-doc-control-plane-ci
  cancel-in-progress: false

jobs:
  validate:
    name: Validate documentation drift guards
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-doc-control-plane-ci/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Check drift test formatting
        working-directory: private-source
        run: dart format --output=none --set-exit-if-changed test/architecture/documentation_drift_test.dart

      - name: Analyze documentation drift guard
        working-directory: private-source
        run: flutter analyze --no-pub test/architecture/documentation_drift_test.dart

      - name: Run documentation drift guard
        working-directory: private-source
        run: flutter test --no-pub test/architecture/documentation_drift_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

  report:
    name: Publish sanitized documentation result
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish sanitized result
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          RUN_ID: ${{ github.run_id }}
          TOOLCHAINS_TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'runId': int(os.environ['RUN_ID']),
            'toolchainsTriggerSha': os.environ['TOOLCHAINS_TRIGGER_SHA'],
            'validateResult': os.environ['VALIDATE_RESULT'],
          }, indent=2, sort_keys=True))
          PY
          )"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"
          path="reports/goanime-doc-control-plane-ci/${RUN_ID}.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report documentation run ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null
