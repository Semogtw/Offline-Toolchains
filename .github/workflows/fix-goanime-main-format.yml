name: Diagnose GoAnime main tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goanime-main-format.yml'

permissions:
  contents: read

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 80b4917de50ba182e3adb971c9c662c02e4f1db4
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve packages
        run: flutter pub get

      - name: Verify architecture tests
        run: flutter test test/architecture --reporter expanded --test-randomize-ordering-seed=random
