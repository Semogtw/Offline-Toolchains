name: Diagnose GoAnime main tests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goanime-main-format.yml'

permissions:
  contents: read

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: d893e093ac9dc7f79948716664171bbebd0e7122
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve packages
        run: flutter pub get

      - name: Run full tests with expanded diagnostics
        shell: bash
        run: |
          set -uo pipefail
          flutter test --reporter expanded --concurrency=1 --test-randomize-ordering-seed=random 2>&1 | tee /tmp/goanime-tests.log
          status=${PIPESTATUS[0]}
          echo '--- FAILURE SUMMARY START ---'
          grep -n -E -B 8 -A 20 'FAILED|Test failed|Some tests failed|Expected:|Actual:|Error:|Exception|Failure' /tmp/goanime-tests.log || true
          echo '--- FAILURE SUMMARY END ---'
          echo '--- LAST 250 LINES START ---'
          tail -n 250 /tmp/goanime-tests.log
          echo '--- LAST 250 LINES END ---'
          exit "$status"
