name: Repair GoAnime main formatting

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goanime-main-format.yml'

permissions:
  contents: read

jobs:
  format:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout private GoAnime main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Format and expose mechanical diff
        shell: bash
        run: |
          set -euo pipefail
          dart format tools/cache_builder.dart
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'tools/cache_builder.dart'
          echo '--- FORMATTER PATCH START ---'
          git diff -- tools/cache_builder.dart
          echo '--- FORMATTER PATCH END ---'
