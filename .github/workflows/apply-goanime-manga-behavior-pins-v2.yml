name: Apply GoAnime manga behavior pins v2

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-behavior-pins-v2/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-manga-control-results
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve branch
        id: target
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-behavior-pins-v2/*.request' | head -n1)"
          test -n "$request"
          read -r project branch < "control/$request"
          test "$project" = goanime
          test "$branch" = 'codex/manga-parity-20260823'
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.target.outputs.branch }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 0
          persist-credentials: true
      - name: Capture source head
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Prepare idempotent pin transform
        id: track
        continue-on-error: true
        working-directory: source
        shell: bash
        run: |
          set +e
          cat > "$RUNNER_TEMP/apply_manga_pins.py" <<'PY'
          import json
          from pathlib import Path

          HEAD='ddfe050009c20da11bd69c1fbbae3933a5089ef8'
          MADARA='66535bd04bec51a1063532cc72fb5e25de30effd'
          reviewed = {
            'ptbr.arthurscan': ('src/pt/arthurscan', HEAD),
            'ptbr.astratoons': ('src/pt/astratoons', '5083ff5d06b9cb7736216ae0fbd0be3828bcce2c'),
            'ptbr.capitoons': ('src/pt/apecomics', '5083ff5d06b9cb7736216ae0fbd0be3828bcce2c'),
            'ptbr.hqnow': ('src/pt/hqnow', 'd2aebed872070d18ba225002bcb9734545baaf41'),
            'ptbr.hipertoon': ('src/pt/hipertoon', HEAD),
            'ptbr.kamisamaexplorer': ('src/pt/kamisamaexplorer', MADARA),
            'ptbr.kivaratoons': ('src/pt/kivaratoons', HEAD),
            'ptbr.leituramanga': ('src/pt/leituramanga', HEAD),
            'ptbr.ler999': ('src/pt/ler999', HEAD),
            'ptbr.littletyrant': ('src/pt/littletyrant', HEAD),
            'ptbr.maidscan': ('src/pt/maidscan', HEAD),
            'ptbr.mangadash': ('src/pt/mangadash', 'd2aebed872070d18ba225002bcb9734545baaf41'),
            'ptbr.mangaflix': ('src/pt/mangaflix', HEAD),
            'ptbr.mangalivreblog': ('src/pt/mangalivreblog', HEAD),
            'ptbr.mangalivreorg': ('src/pt/mangalivreorg', HEAD),
            'ptbr.ninjascan': ('src/pt/ninjascan', MADARA),
          }
          p=Path('docs/manga_sources_ptbr.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          records={r['goanimeSourceId']:r for r in data['providerRecords'] if r.get('implementationState')=='enabled'}
          if set(records) != set(reviewed):
            raise SystemExit(f'enabled/reviewed mismatch enabled={sorted(records)} reviewed={sorted(reviewed)}')
          for sid,(source_path,behavior) in reviewed.items():
            rec=records[sid]
            ref=rec.get('referenceImplementation')
            if not isinstance(ref,dict):
              ref={'repository':'keiyoushi/extensions-source','revision':behavior,'path':source_path}
              rec['referenceImplementation']=ref
            if ref.get('repository') != 'keiyoushi/extensions-source':
              raise SystemExit(f'{sid}: unexpected repository {ref.get("repository")}')
            if ref.get('path') not in (None,source_path):
              raise SystemExit(f'{sid}: unexpected path {ref.get("path")}')
            ref['path']=source_path
            ref['behaviorRevision']=behavior
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          {
            set -euo pipefail
            python3 "$RUNNER_TEMP/apply_manga_pins.py"
            python3 -m json.tool docs/manga_sources_ptbr.json >/dev/null
            git diff --check
          } > "$RUNNER_TEMP/pins.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/pins.log"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Commit against fresh remote head and push
        id: publish
        if: steps.track.outcome == 'success'
        working-directory: source
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          : > "$RUNNER_TEMP/publish.log"
          exec > >(tee -a "$RUNNER_TEMP/publish.log") 2>&1
          for attempt in 1 2 3 4 5; do
            echo "attempt=$attempt"
            git fetch origin "$BRANCH" --quiet
            git reset --hard "origin/$BRANCH"
            python3 "$RUNNER_TEMP/apply_manga_pins.py"
            python3 -m json.tool docs/manga_sources_ptbr.json >/dev/null
            git diff --check
            git add docs/manga_sources_ptbr.json
            if git diff --cached --quiet; then
              echo "already-current"
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m 'docs(manga): track all enabled provider behavior revisions'
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Publish diagnostic receipt
        if: always() && steps.target.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
          TRACK_OUTCOME: ${{ steps.track.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          sha="${PUBLISHED_SHA:-$SOURCE_SHA}"
          state=failure
          if [[ "$TRACK_OUTCOME" == success && "$PUBLISH_OUTCOME" == success ]]; then state=success; fi
          track_tail="$(tail -n 60 "$RUNNER_TEMP/pins.log" 2>/dev/null || true)"
          publish_tail="$(tail -n 100 "$RUNNER_TEMP/publish.log" 2>/dev/null || true)"
          result="$(jq -cn --arg state "$state" --arg sha "$sha" --arg track "$TRACK_OUTCOME" --arg publish "$PUBLISH_OUTCOME" --arg trackTail "$track_tail" --arg publishTail "$publish_tail" '{schemaVersion:5,state:$state,goanimeSha:$sha,trackedEnabledProviders:16,trackOutcome:$track,publishOutcome:$publish,trackDiagnostic:$trackTail,publishDiagnostic:$publishTail}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-manga-behavior-pins-v2/${sha}.json"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record manga behavior pins v2 ${sha:0:8}" -f content="$encoded")
          if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce apply
        if: always() && (steps.track.outcome != 'success' || steps.publish.outcome != 'success')
        run: exit 1
