name: Probe GoAnime production secret availability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-goanime-production-secrets.yml'

permissions:
  contents: read
jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
      GOANIME_CATALOG_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
      UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
      ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
      RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      RUNTIME_DATABASE_PUBLIC_BASE_URL: ${{ secrets.RUNTIME_DATABASE_PUBLIC_BASE_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
      GIT_CONFIG_VALUE_0: 'AUTHORIZATION: bearer ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Record presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(
            PRIVATE_REPOSITORIES_TOKEN GOANIME_CATALOG_WRITE_TOKEN
            FIREBASE_PROJECT_ID FIREBASE_WEB_API_KEY GOOGLE_SERVICES_JSON_BASE64 GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            UPDATE_MANIFEST_URL UPDATE_APPCAST_URL ANIME_METADATA_SEED_MANIFEST_URL RUNTIME_DATABASE_MANIFEST_URL
            CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET RUNTIME_DATABASE_PUBLIC_BASE_URL
            TMDB_API_KEY SHOREBIRD_TOKEN
          )
          mkdir -p reports/goanime-production-secrets
          python3 - "${names[@]}" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          names = sys.argv[1:]
          payload = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "presence": {name: bool(os.environ.get(name, "")) for name in names},
          }
          Path("reports/goanime-production-secrets/latest.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          for name in names:
              print(f"{name}={'present' if payload['presence'][name] else 'missing'}")
          PY

      - name: Commit sanitized presence report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/goanime-production-secrets/latest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci(goanime): record production secret presence $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
