name: Probe GoAnime production secret availability

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-goanime-production-secrets.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
      UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
      ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
      RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          names=(
            PRIVATE_REPOSITORIES_TOKEN
            FIREBASE_PROJECT_ID FIREBASE_WEB_API_KEY GOOGLE_SERVICES_JSON_BASE64
            ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
            UPDATE_MANIFEST_URL UPDATE_APPCAST_URL ANIME_METADATA_SEED_MANIFEST_URL RUNTIME_DATABASE_MANIFEST_URL
            TMDB_API_KEY SHOREBIRD_TOKEN
          )
          for name in "${names[@]}"; do
            if [[ -n "${!name:-}" ]]; then
              printf '%s=present\n' "$name"
            else
              printf '%s=missing\n' "$name"
            fi
          done
