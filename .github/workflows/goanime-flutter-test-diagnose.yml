name: GoAnime Flutter test diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-flutter-test-diagnose/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-flutter-test-diagnose-${{ github.sha }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          # Pin the triggering request commit: simultaneous PR/toolchain pushes
          # must not move HEAD away from the requested immutable source.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve exact GoAnime request
        id: request
        shell: bash
        run: >-
          python scripts/goanime_resolve_request.py
          --request-dir triggers/goanime-flutter-test-diagnose
          --workspace .

      - name: Select source-aware catalog focus
        id: focus
        shell: bash
        run: |
          set -euo pipefail
          request_file="$(git diff --name-only HEAD^ HEAD -- 'triggers/goanime-flutter-test-diagnose/*.request')"
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=pr301-chapter-pagination' "$request_file"; then
            echo 'pagination_pr301=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pagination_pr301=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=source-aware-task1' "$request_file"; then
            echo 'source_aware_task1=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_aware_task1=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=source-aware-task2' "$request_file"; then
            echo 'source_aware_task2=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_aware_task2=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=source-aware-task3' "$request_file"; then
            echo 'source_aware_task3=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_aware_task3=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=source-aware-task4' "$request_file"; then
            echo 'source_aware_task4=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_aware_task4=false' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=source-aware-task6' "$request_file"; then
            echo 'source_aware_task6=true' >> "$GITHUB_OUTPUT"
          else
            echo 'source_aware_task6=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "$request_file" ]] && grep -Fxq 'reason=manga-six-front-focused' "$request_file"; then
            echo 'manga_stabilization=true' >> "$GITHUB_OUTPUT"
          else
            echo 'manga_stabilization=false' >> "$GITHUB_OUTPUT"
          fi

          if [[ -f "$request_file" ]] && grep -Fxq 'reason=manga-reader-only' "$request_file"; then
            echo 'manga_reader_only=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ -f "$request_file" ]] && grep -Fxq 'reason=manga-other-only' "$request_file"; then
            echo 'manga_other_only=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify immutable source
        working-directory: private-source
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_hint }}
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Analyze integrated Flutter source
        if: steps.focus.outputs.manga_stabilization == 'true'
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: flutter analyze --no-pub

      - name: Run Flutter tests with machine reporter
        id: tests
        working-directory: private-source
        shell: bash
        run: |
          set +e
          if [[ '${{ steps.focus.outputs.manga_reader_only }}' == 'true' ]]; then
            timeout 240s flutter test --no-pub --reporter=json test/widgets/manga/manga_reader_screen_test.dart > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.manga_other_only }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/services/manga/storage/manga_catalog_repository_test.dart \
              test/services/manga/manga_chapter_hydrator_test.dart \
              test/services/manga/sync/manga_sync_local_store_test.dart \
              test/services/manga/manga_availability_service_test.dart \
              test/services/manga/manhastro_recommendations_adapter_test.dart \
              test/widgets/manga_manhastro/search_interaction_test.dart \
              test/widgets/manga_manhastro/search_chapter_range_adapter_test.dart \
              test/widgets/manga_manhastro/home_interaction_test.dart \
              test/widgets/manga_manhastro/favorites_features_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.manga_stabilization }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/services/manga/storage/manga_catalog_repository_test.dart \
              test/services/manga/manga_chapter_hydrator_test.dart \
              test/services/manga/sync/manga_sync_local_store_test.dart \
              test/services/manga/manga_availability_service_test.dart \
              test/services/manga/manhastro_recommendations_adapter_test.dart \
              test/widgets/manga/manga_reader_screen_test.dart \
              test/widgets/manga_manhastro/search_interaction_test.dart \
              test/widgets/manga_manhastro/search_chapter_range_adapter_test.dart \
              test/widgets/manga_manhastro/home_interaction_test.dart \
              test/widgets/manga_manhastro/favorites_features_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.pagination_pr301 }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/widgets/manga_manhastro/chapter_number_order_test.dart \
              test/widgets/manga_manhastro/details_interaction_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.source_aware_task1 }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/tools/manga_availability_v3_builder_test.dart \
              test/tools/build_global_manga_availability_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.source_aware_task2 }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/services/manga/manga_source_content_decision_test.dart \
              test/services/manga/manga_content_policy_sql_test.dart \
              test/tools/manga_content_safety_evidence_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.source_aware_task3 }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/tools/manga_source_aware_flags_materialization_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.source_aware_task4 }}' == 'true' ]]; then
            flutter test --no-pub --reporter=json \
              test/services/manga/manga_home_visibility_paging_test.dart \
              test/services/manga/manga_availability_service_test.dart \
              test/services/manga/manga_repository_browse_data_source_test.dart \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          elif [[ '${{ steps.focus.outputs.source_aware_task6 }}' == 'true' ]]; then
            python3 -m py_compile \
              tools/manga/build_manga_safe_distribution.py \
              tools/manga/check_manga_safe_release_bundle.py
            python3 -m unittest \
              tools.tests.test_manga_safe_distribution \
              tools.tests.test_manga_safe_release_bundle -v \
              > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          else
            flutter test --no-pub --reporter=json > "$RUNNER_TEMP/flutter-tests.jsonl" 2> "$RUNNER_TEMP/flutter-tests.stderr"
          fi
          status=$?
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized failure report
        env:
          SOURCE_SHA: ${{ steps.request.outputs.source_hint }}
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/goanime-flutter-test-diagnostics
          python3 - "$RUNNER_TEMP/flutter-tests.jsonl" "$RUNNER_TEMP/flutter-tests.stderr" "reports/goanime-flutter-test-diagnostics/${SOURCE_SHA}-${GITHUB_RUN_ID}.json" <<'PY'
          import json
          import os
          import pathlib
          import sys

          events_path = pathlib.Path(sys.argv[1])
          stderr_path = pathlib.Path(sys.argv[2])
          out_path = pathlib.Path(sys.argv[3])

          tests = {}
          groups = {}
          errors = {}
          print_messages = {}
          failed_ids = set()
          suite_paths = {}

          if events_path.exists():
              for raw in events_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  try:
                      event = json.loads(raw)
                  except json.JSONDecodeError:
                      continue
                  etype = event.get('type')
                  if etype == 'suite':
                      suite = event.get('suite') or {}
                      suite_paths[suite.get('id')] = suite.get('path')
                  elif etype == 'group':
                      group = event.get('group') or {}
                      groups[group.get('id')] = group
                  elif etype == 'testStart':
                      test = event.get('test') or {}
                      tests[test.get('id')] = test
                  elif etype == 'print':
                      tid = event.get('testID')
                      if tid is not None:
                          print_messages.setdefault(tid, []).append(str(event.get('message') or '')[:6000])
                  elif etype == 'error':
                      tid = event.get('testID')
                      if tid is not None:
                          errors.setdefault(tid, []).append({
                              'error': str(event.get('error') or '')[:4000],
                              'stackTrace': str(event.get('stackTrace') or '')[:6000],
                          })
                  elif etype == 'testDone' and event.get('result') not in (None, 'success', 'skipped'):
                      failed_ids.add(event.get('testID'))

          failures = []
          for tid in sorted(failed_ids, key=lambda value: str(value)):
              test = tests.get(tid) or {}
              group_ids = test.get('groupIDs') or []
              group_names = [groups.get(gid, {}).get('name') for gid in group_ids]
              suite_id = test.get('suiteID')
              failures.append({
                  'testId': tid,
                  'name': test.get('name'),
                  'suitePath': suite_paths.get(suite_id),
                  'groups': [name for name in group_names if name],
                  'errors': errors.get(tid, []),
                  'diagnosticPrints': print_messages.get(tid, [])[-15:],
              })

          stderr = stderr_path.read_text(encoding='utf-8', errors='replace') if stderr_path.exists() else ''
          payload = {
              'schemaVersion': 1,
              'sourceSha': os.environ['SOURCE_SHA'],
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'exitCode': int(os.environ.get('TEST_EXIT_CODE') or 0),
              'failureCount': len(failures),
              'failures': failures,
              'stderrTail': stderr[-6000:],
          }
          out_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'exitCode': payload['exitCode'], 'failureCount': payload['failureCount']}))
          PY

      - name: Preserve sanitized diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: goanime-flutter-diagnostics-${{ github.run_id }}
          path: reports/goanime-flutter-test-diagnostics/${{ steps.request.outputs.source_hint }}-${{ github.run_id }}.json
          retention-days: 3
          if-no-files-found: error

      - name: Report Flutter test result
        shell: bash
        env:
          TEST_EXIT_CODE: ${{ steps.tests.outputs.exit_code }}
          SOURCE_SHA: ${{ steps.request.outputs.source_hint }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt_path = Path(
              'reports/goanime-flutter-test-diagnostics/'
              + os.environ['SOURCE_SHA']
              + '-'
              + os.environ['GITHUB_RUN_ID']
              + '.json'
          )
          data = json.loads(receipt_path.read_text(encoding='utf-8'))
          print(json.dumps({
              'sourceSha': data['sourceSha'],
              'exitCode': data['exitCode'],
              'failureCount': data['failureCount'],
              'failedTests': [
                  {'name': case.get('name'), 'error': (case.get('errors') or [{}])[0].get('error', '')[:1200], 'stack': (case.get('errors') or [{}])[0].get('stackTrace', '')[:1700], 'prints': case.get('diagnosticPrints', [])[-3:]}
                  for case in data.get('failures', [])
              ],
          }, ensure_ascii=False))
          PY
          test "$TEST_EXIT_CODE" = '0'
