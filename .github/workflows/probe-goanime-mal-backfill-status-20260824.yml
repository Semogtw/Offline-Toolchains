name: Probe GoAnime MAL backfill status

on:
  push:
    branches: [main]
    paths:
      - 'triggers/private-goanime-mal-backfill-probe.json'

permissions:
  actions: read
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Snapshot MAL backfill workflow runs
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'backfill-private-goanime-mal-catalog.yml',
              per_page: 20
            });
            const runs = response.data.workflow_runs.map(run => ({
              id: run.id,
              name: run.name,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              run_started_at: run.run_started_at,
              html_url: run.html_url
            }));
            const report = {
              schema_version: 1,
              probed_at: new Date().toISOString(),
              runs
            };
            const path = 'reports/goanime-mal-backfill/runs.json';
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(old.data)) sha = old.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: 'ci(goanime): snapshot MAL backfill runs [skip ci]',
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
              branch: 'main',
              sha
            });
