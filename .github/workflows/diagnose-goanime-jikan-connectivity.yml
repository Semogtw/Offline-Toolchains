name: Diagnose GoAnime Jikan connectivity

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-jikan-connectivity/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-jikan-connectivity
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Compare Jikan and AniList public API connectivity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.error, urllib.parse, urllib.request

          queries = ['one piece', 'naruto', 'frieren', 'tokyo ghoul', 'bleach']
          jikan_failures = []
          for index, query in enumerate(queries):
              if index:
                  time.sleep(1.2)
              url = 'https://api.jikan.moe/v4/anime?' + urllib.parse.urlencode({'q': query, 'limit': 1})
              request = urllib.request.Request(url, headers={'User-Agent': 'GoAnime-cache-diagnostic/1.0', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                      count = len(payload.get('data') or []) if isinstance(payload, dict) else -1
                      print(f'jikan probe={index + 1} status={response.status} results={count} retry_after={response.headers.get("Retry-After", "none")}')
              except urllib.error.HTTPError as error:
                  retry_after = error.headers.get('Retry-After', 'none') if error.headers else 'none'
                  print(f'jikan probe={index + 1} status={error.code} results=0 retry_after={retry_after}')
                  jikan_failures.append(f'http_{error.code}')
              except Exception as error:
                  print(f'jikan probe={index + 1} error={type(error).__name__}: {error}')
                  jikan_failures.append(type(error).__name__)

          graphql = 'query ($search: String) { Media(search: $search, type: ANIME) { id idMal title { romaji english native } } }'
          anilist_failures = []
          for index, query in enumerate(queries):
              body = json.dumps({'query': graphql, 'variables': {'search': query}}).encode('utf-8')
              request = urllib.request.Request(
                  'https://graphql.anilist.co', data=body, method='POST',
                  headers={'User-Agent': 'GoAnime-cache-diagnostic/1.0', 'Accept': 'application/json', 'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                      media = ((payload.get('data') or {}).get('Media') or {}) if isinstance(payload, dict) else {}
                      print(f'anilist probe={index + 1} status={response.status} id={media.get("id")} idMal={media.get("idMal")}')
                      if not media.get('id'):
                          anilist_failures.append('empty_media')
              except urllib.error.HTTPError as error:
                  print(f'anilist probe={index + 1} status={error.code}')
                  anilist_failures.append(f'http_{error.code}')
              except Exception as error:
                  print(f'anilist probe={index + 1} error={type(error).__name__}: {error}')
                  anilist_failures.append(type(error).__name__)

          print('summary jikan_failures=' + (','.join(jikan_failures) if jikan_failures else 'none'))
          print('summary anilist_failures=' + (','.join(anilist_failures) if anilist_failures else 'none'))
          if anilist_failures:
              raise SystemExit('AniList fallback connectivity failures: ' + ','.join(anilist_failures))
          PY
