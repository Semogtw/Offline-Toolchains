name: Diagnose GoAnime Jikan connectivity

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-jikan-connectivity/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-jikan-connectivity
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe Jikan search endpoint conservatively
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.error, urllib.parse, urllib.request

          queries = ['one piece', 'naruto', 'frieren', 'tokyo ghoul', 'bleach']
          failures = []
          for index, query in enumerate(queries):
              if index:
                  time.sleep(1.2)
              url = 'https://api.jikan.moe/v4/anime?' + urllib.parse.urlencode({'q': query, 'limit': 1})
              request = urllib.request.Request(url, headers={'User-Agent': 'GoAnime-cache-diagnostic/1.0', 'Accept': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      body = response.read().decode('utf-8')
                      payload = json.loads(body)
                      count = len(payload.get('data') or []) if isinstance(payload, dict) else -1
                      print(f'probe={index + 1} status={response.status} results={count} retry_after={response.headers.get("Retry-After", "none")}')
              except urllib.error.HTTPError as error:
                  retry_after = error.headers.get('Retry-After', 'none') if error.headers else 'none'
                  print(f'probe={index + 1} status={error.code} results=0 retry_after={retry_after}')
                  failures.append(f'http_{error.code}')
              except Exception as error:
                  print(f'probe={index + 1} error={type(error).__name__}: {error}')
                  failures.append(type(error).__name__)

          if failures:
              raise SystemExit('Jikan connectivity failures: ' + ','.join(failures))
          PY
