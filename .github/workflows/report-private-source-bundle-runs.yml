name: Report private source bundle runs

on:
  workflow_run:
    workflows:
      - Request private source bundle
      - Build encrypted private source bundle
    types:
      - completed

permissions:
  actions: read
  issues: write

jobs:
  report:
    name: Publish run receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Comment run result and artifacts
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const marker = `<!-- private-source-run:${run.id} -->`;
            let artifacts = [];

            if (run.name === 'Build encrypted private source bundle') {
              const response = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              artifacts = response.data.artifacts;
            }

            const artifactLines = artifacts.length === 0
              ? ['- Artifacts: none']
              : [
                  '- Artifacts:',
                  ...artifacts.map((artifact) => {
                    const sizeMiB = (artifact.size_in_bytes / 1024 / 1024).toFixed(1);
                    return `  - \`${artifact.name}\` — ID \`${artifact.id}\` — ${sizeMiB} MiB — expires ${artifact.expires_at}`;
                  }),
                ];

            const body = [
              marker,
              `### ${run.name}`,
              '',
              `- Run: [${run.id}](${run.html_url})`,
              `- Conclusion: \`${run.conclusion}\``,
              `- Event: \`${run.event}\``,
              `- Branch: \`${run.head_branch ?? 'n/a'}\``,
              `- Actor: \`${run.actor?.login ?? 'unknown'}\``,
              ...artifactLines,
            ].join('\n');

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 4,
                per_page: 100,
              },
            );
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: 4,
                body,
              });
            }
