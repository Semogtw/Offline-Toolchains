name: Patch Hydra Drive V2 audit findings

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/hydra-drive-v2-audit/*.request'

permissions:
  contents: read

concurrency:
  group: hydra-drive-v2-audit-patch
  cancel-in-progress: false

jobs:
  patch:
    name: Apply exact Drive V2 audit patch
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/hydra-drive-v2-audit/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = "hydra"
          test "$branch" = "feat/drive-cloud-saves-v2"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact Hydra revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply verified runtime patch
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          target = Path('src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts')
          text = target.read_text()
          old_lines = [
              '          if (plan.action === "none") {',
              '            if (remote) {',
              '              await writeDriveV2SyncedState({',
              '                game,',
              '                backup: remote,',
              '                manifest: archive.v2Manifest,',
              '              });',
              '            }',
              '            return { status: "noop" };',
              '          }',
          ]
          new_lines = [
              '          if (plan.action === "none") {',
              '            if (plan.state === "remote-ahead" && remote) {',
              '              await this.notifyRemoteNewer(game).catch(() => undefined);',
              '              return { status: "remote-newer", fileId: remote.id };',
              '            }',
              '            if (remote) {',
              '              await writeDriveV2SyncedState({',
              '                game,',
              '                backup: remote,',
              '                manifest: archive.v2Manifest,',
              '              });',
              '            }',
              '            return { status: "noop" };',
              '          }',
          ]
          old = '\n'.join(old_lines) + '\n'
          new = '\n'.join(new_lines) + '\n'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one remote-ahead patch match, found {count}')
          target.write_text(text.replace(old, new, 1))

          contract = Path('src/main/services/cloud-save/google-drive/google-drive-v2-remote-ahead-runtime-contract.test.ts')
          contract.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst source = fs.readFileSync(\n  new URL("./google-drive-cloud-save-provider-v2-runtime.ts", import.meta.url),\n  "utf8"\n);\n\ntest("remote-ahead no-op does not advance the Drive V2 synced anchor", () => {\n  const noAction = source.indexOf('if (plan.action === "none")');\n  const remoteAhead = source.indexOf(\n    'if (plan.state === "remote-ahead" && remote)',\n    noAction\n  );\n  const syncedWrite = source.indexOf("await writeDriveV2SyncedState", noAction);\n\n  assert.ok(noAction >= 0);\n  assert.ok(remoteAhead > noAction);\n  assert.ok(syncedWrite > remoteAhead);\n\n  const remoteAheadBranch = source.slice(remoteAhead, syncedWrite);\n  assert.match(remoteAheadBranch, /notifyRemoteNewer/);\n  assert.match(\n    remoteAheadBranch,\n    /return \\{ status: "remote-newer", fileId: remote\\.id \\};/\n  );\n});\n''')
          PY
          git diff --check
          git diff -- \
            src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts \
            src/main/services/cloud-save/google-drive/google-drive-v2-remote-ahead-runtime-contract.test.ts

      - name: Verify branch still points to requested SHA
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          remote_sha="$(git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)" ls-remote https://github.com/Semogtw/HydraPersonalizado.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_SHA"

      - name: Commit and push exact patch
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "Arthur Almeida"
          git config user.email "arthurgva1602@gmail.com"
          git add \
            src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts \
            src/main/services/cloud-save/google-drive/google-drive-v2-remote-ahead-runtime-contract.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "fix(cloud-save): preserve anchor when Drive V2 remote is ahead"
          git remote set-url origin "https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/HydraPersonalizado.git"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control"
