name: Validate GoAnime opening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-opening/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-opening-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact opening request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-opening/*.request' | head -n 1)"
          test -n "$request"
          read -r project sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Check opening formatting and whitespace
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed \
            lib/widgets/goanime_opening.dart \
            lib/app/app.dart \
            test/widgets/goanime_opening_test.dart \
            test/widgets/frontend_foundation_test.dart
          git diff --check

      - name: Analyze opening integration
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            lib/widgets/goanime_opening.dart \
            lib/app/app.dart \
            test/widgets/goanime_opening_test.dart \
            test/widgets/frontend_foundation_test.dart; do
            dart analyze "$target"
          done

      - name: Validate opening asset publication
        working-directory: private-source
        run: python3 tools/tests/test_flutter_asset_boundaries.py

      - name: Run opening widget tests
        working-directory: private-source
        run: flutter test --no-pub test/widgets/goanime_opening_test.dart

      - name: Run app regression widget tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test/widget_test.dart
          flutter test --no-pub test/widgets/frontend_foundation_test.dart

      - name: Build Android debug APK
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Verify installable APK output
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/goanime-opening-apk.sha256

      - name: Upload opening validation APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: goanime-opening-${{ steps.request.outputs.sha }}
          path: |
            private-source/build/app/outputs/flutter-apk/app-debug.apk
            private-source/build/goanime-opening-apk.sha256
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          body="$(jq -cn \
            --arg sha "$TARGET_SHA" \
            --arg state "$STATE" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,sourceSha:$sha,state:$state,runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-opening/$GITHUB_RUN_ID.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record GoAnime opening validation $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
