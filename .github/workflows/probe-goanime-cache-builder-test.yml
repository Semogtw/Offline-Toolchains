name: Probe GoAnime cache-builder test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-goanime-cache-builder-test.yml'

permissions:
  contents: read

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 86fee374c43377978cb8845195ac799461201b74
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run focused RED test
        run: flutter test test/tools/cache_builder_pagination_test.dart
