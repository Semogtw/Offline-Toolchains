name: Refresh GoAnime catalog with Scrapling

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-catalog/*.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goanime-scrapling-catalog
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime source
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ github.event_name }}' = 'push' ]; then
            request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-scrapling-catalog/*.request' | head -n 1)"
            test -n "$request"
            read -r project sha mode < "trusted-source/$request"
            test "$project" = goanime
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            case "$mode" in
              dry-run|publish) ;;
              *) echo "Unsupported mode: $mode" >&2; exit 1 ;;
            esac
          else
            sha=main
            mode=dry-run
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Require read-only private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify requested revision
        id: source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          requested='${{ steps.request.outputs.ref }}'
          if [[ "$requested" =~ ^[0-9a-f]{40}$ ]]; then
            test "$sha" = "$requested"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: private-source/tools/scrapling_provider_pipeline/requirements.txt

      - name: Install pinned Scrapling toolchain
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r tools/scrapling_provider_pipeline/requirements.txt
          scrapling install

      - name: Run deterministic pipeline tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/scrapling_provider_pipeline/*.py
          python -m unittest discover -s tools/scrapling_provider_pipeline/tests -v

      - name: Crawl providers and build caches
        id: crawl
        working-directory: private-source
        shell: bash
        env:
          MODE: ${{ steps.request.outputs.mode }}
        run: |
          set -euo pipefail
          set +e
          if [ "$MODE" = dry-run ]; then
            python tools/scrapling_provider_pipeline/build_provider_cache.py --repo-root . --dry-run
            rc=$?
            data_dir=build/provider-scrape
          else
            python tools/scrapling_provider_pipeline/build_provider_cache.py --repo-root .
            rc=$?
            data_dir=assets/data
          fi
          set -e
          case "$rc" in
            0|2) ;;
            *) echo "Unexpected provider builder exit code: $rc" >&2; exit "$rc" ;;
          esac
          validator=(
            python tools/scrapling_provider_pipeline/validate_provider_cache.py
            --repo-root .
            --data-dir "$data_dir"
            --allow-preserved
          )
          "${validator[@]}"
          echo "builder_rc=$rc" >> "$GITHUB_OUTPUT"
          echo "data_dir=$data_dir" >> "$GITHUB_OUTPUT"
          python - "$data_dir/anime_provider_catalog_manifest.json" <<'PY' >> "$GITHUB_OUTPUT"
          import json,sys
          manifest=json.load(open(sys.argv[1],encoding='utf-8'))
          providers=manifest.get('providers') or {}
          for provider in ('animefire','animesonline','goyabu','anitube'):
              info=providers.get(provider) or {}
              print(f'{provider}_status={info.get("status","missing")}')
              print(f'{provider}_count={int(info.get("count") or 0)}')
          print(f'available_count={int(manifest.get("availableTitleCount") or 0)}')
          print('complete=' + ('true' if manifest.get('allProvidersComplete') else 'false'))
          PY

      - name: Require dedicated catalog write token
        if: steps.request.outputs.mode == 'publish'
        shell: bash
        env:
          GOANIME_CATALOG_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GOANIME_CATALOG_WRITE_TOKEN"

      - name: Publish validated caches to GoAnime main
        if: steps.request.outputs.mode == 'publish'
        working-directory: private-source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          extraheader="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$extraheader" fetch origin main
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || {
            echo 'GoAnime main moved after this refresh started; refusing stale cache publication.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/anime_provider_catalogs.json \
            assets/data/anime_provider_catalog_manifest.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_provider_availability_map.json \
            assets/data/provider_scrape_evidence.json \
            tools/scrapling_provider_pipeline/provider_source_hints.json
          if git diff --cached --quiet; then
            echo 'No provider cache changes to publish.'
          else
            git commit -m 'chore(catalog): refresh provider cache with Scrapling'
            git -c http.https://github.com/.extraheader="$extraheader" push origin HEAD:main
          fi
          unset auth extraheader WRITE_TOKEN

      - name: Encrypt dry-run evidence
        id: package
        if: steps.request.outputs.mode == 'dry-run'
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-scrapling-handoff"
          gpg_home="$work/gpg"
          transfer="$work/transfer"
          rm -rf "$work"
          mkdir -p "$gpg_home" "$transfer"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          archive="$work/goanime-scrapling-provider-cache.tar.gz"
          tar -C "$GITHUB_WORKSPACE/private-source" -czf "$archive" \
            build/provider-scrape
          tar -tzf "$archive" >/dev/null
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          test -z "$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1=="sec"{print $1}')"
          encrypted="$transfer/GoAnime-scrapling-provider-cache.tar.gz.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$encrypted" --encrypt "$archive"
          test -s "$encrypted"
          sha="$(sha256sum "$archive" | awk '{print $1}')"
          printf '{"schema_version":1,"project":"goanime","kind":"scrapling_provider_cache","archive_sha256":"%s","encryption":"OpenPGP","recipient_fingerprint":"%s","workflow_run_id":"%s","retention_days":1}\n' \
            "$sha" "$EXPECTED_FINGERPRINT" "$GITHUB_RUN_ID" > "$transfer/manifest.json"
          rm -rf "$gpg_home" "$archive"
          echo "transfer_dir=$transfer" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted dry-run evidence
        if: steps.request.outputs.mode == 'dry-run'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-scrapling-provider-cache-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        if: always() && steps.crawl.outcome != 'skipped'
        shell: bash
        run: |
          echo '## GoAnime Scrapling provider refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ steps.request.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Builder exit: \`${{ steps.crawl.outputs.builder_rc }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- All providers complete: \`${{ steps.crawl.outputs.complete }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- AnimeFire: \`${{ steps.crawl.outputs.animefire_status }}\` / ${{ steps.crawl.outputs.animefire_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- AnimesOnline: \`${{ steps.crawl.outputs.animesonline_status }}\` / ${{ steps.crawl.outputs.animesonline_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Goyabu: \`${{ steps.crawl.outputs.goyabu_status }}\` / ${{ steps.crawl.outputs.goyabu_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- AniTube: \`${{ steps.crawl.outputs.anitube_status }}\` / ${{ steps.crawl.outputs.anitube_count }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Union titles: ${{ steps.crawl.outputs.available_count }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private and transient data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
          rm -rf "$RUNNER_TEMP/goanime-scrapling-handoff"
