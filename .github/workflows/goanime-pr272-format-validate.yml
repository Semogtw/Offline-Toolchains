name: Format and validate GoAnime PR272 exact source
on:
  push:
    branches: [main]
    paths: ['triggers/goanime-pr272-format/*.request']
permissions:
  contents: read
jobs:
  format-and-test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Validate exact target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-pr272-format/*.request' | head -n1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = fix/manga-browse-navigation-filters-20261015
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact private revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.target.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Get dependencies
        working-directory: source
        run: |
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
      - name: Format exact PR272 files
        working-directory: source
        run: |
          set -euo pipefail
          dart format \
            lib/manga_manhastro/adapters/manhastro_manga_presentation_adapter.dart \
            lib/manga_manhastro/controllers/manhastro_search_controller.dart \
            lib/manga_manhastro/models/manhastro_search_query.dart \
            lib/manga_manhastro/screens/manhastro_favorites_screen.dart \
            lib/manga_manhastro/screens/manhastro_home_source_screen.dart \
            lib/manga_manhastro/screens/manhastro_search_source_screen.dart \
            lib/manga_manhastro/widgets/manhastro_manga_bottom_nav.dart \
            lib/screens/main_navigation_screen.dart \
            lib/services/manga/manga_availability_service.dart \
            lib/services/manga/manga_bundled_catalog_source.dart \
            lib/services/manga/manga_runtime_availability_source.dart \
            lib/widgets/navigation/goanime_desktop_sidebar.dart \
            lib/widgets/navigation/manhastro_bottom_navigation.dart \
            test/widgets/manga_manhastro/favorites_features_test.dart \
            test/widgets/manga_manhastro/home_interaction_test.dart \
            test/widgets/manga_manhastro/search_interaction_test.dart \
            test/widgets/manga_manhastro/shell_interaction_test.dart \
            test/widgets/media_mode_navigation_test.dart
          git diff --check
      - name: Full static analysis
        working-directory: source
        run: flutter analyze --no-pub
      - name: Focused Flutter regression tests
        working-directory: source
        run: |
          flutter test --no-pub --concurrency=1 \
            test/widgets/manga_manhastro/favorites_features_test.dart \
            test/widgets/manga_manhastro/home_interaction_test.dart \
            test/widgets/manga_manhastro/search_interaction_test.dart \
            test/widgets/manga_manhastro/shell_interaction_test.dart \
            test/widgets/media_mode_navigation_test.dart \
            test/services/manga/manga_availability_service_test.dart \
            test/services/manga/manga_bundled_catalog_source_test.dart \
            test/services/manga/manga_runtime_availability_source_test.dart \
            test/widgets/manga_manhastro/presentation_adapter_test.dart
      - name: Commit and publish only formatting delta with CAS
        working-directory: source
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          remote="https://github.com/Semogtw/goanime-mobile.git"
          current="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote "$remote" "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$current" = "$EXPECTED_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/manga_manhastro lib/screens/main_navigation_screen.dart lib/services/manga lib/widgets/navigation test/widgets/manga_manhastro test/widgets/media_mode_navigation_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(manga): apply Dart formatting for PR272"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push "$remote" "HEAD:refs/heads/$TARGET_BRANCH"
          unset auth PRIVATE_TOKEN
      - name: Remove private source
        if: always()
        run: rm -rf source
