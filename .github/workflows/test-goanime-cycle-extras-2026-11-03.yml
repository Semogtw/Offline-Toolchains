name: Test GoAnime cycle extras 2026-11-03

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/goanime-tests/cycle-extras-2026-11-03.json'

permissions:
  contents: read

concurrency:
  group: goanime-tests-cycle-extras-2026-11-03
  cancel-in-progress: false

env:
  SOURCE_SHA: 13a9446fe23b71866e626bce8e24a7d5928abd0c
  FLUTTER_VERSION: 3.47.7
  GOANIME_REPOSITORY: Semogtw/goanime-mobile

jobs:
  test:
    name: Run GoAnime tests of the other cycle features
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted test request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify exact one-shot test request
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          item = json.loads(Path('requests/goanime-tests/cycle-extras-2026-11-03.json').read_text())
          expected = {
            'source_sha': '13a9446fe23b71866e626bce8e24a7d5928abd0c'
          }
          assert item == expected, f"Unexpected test request: {item}"
          PY

      - name: Checkout immutable GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Materialize verified catalog and resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/manga/materialize_manga_availability_asset.py
          flutter pub get --enforce-lockfile

      - name: Run goanime_core smart folder criteria tests
        working-directory: private-source/packages/goanime_core
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test --reporter expanded \
            test/manga/manga_smart_folder_criteria_test.dart

      - name: Run the other cycle feature test files
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded \
            test/services/manga/storage/manga_smart_folder_test.dart \
            test/services/manga/storage/manga_favorite_folder_repository_test.dart \
            test/widgets/manga_manhastro/favorites_features_test.dart \
            test/services/manga/manga_external_identity_precomputation_service_test.dart \
            test/services/manga/manga_external_identity_association_service_test.dart \
            test/services/manga/manga_external_identity_title_resolver_test.dart \
            test/services/update_auto_check_test.dart \
            test/services/update_patch_restart_required_test.dart \
            test/services/update_service_test.dart \
            test/services/manga/manhastro_recommendations_adapter_test.dart \
            test/services/manga/manhastro_similar_works_adapter_test.dart \
            test/widgets/manga_manhastro/similar_works_section_test.dart
