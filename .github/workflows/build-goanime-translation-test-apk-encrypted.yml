name: Build GoAnime Translation Test APK (Encrypted)

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: GoAnime source branch or 40-char commit SHA
        required: true
        default: main
      manga_only:
        description: Build Manga-only edition
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: goanime-translation-test-apk-encrypted
  cancel-in-progress: true

jobs:
  build-apk:
    name: Validate translation flow, build Android debug APK, and encrypt artifact
    if: github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      FLUTTER_VERSION: 3.47.7
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      MANGA_TRANSLATION_BROKER_URL: ${{ secrets.MANGA_TRANSLATION_BROKER_URL }}
      MANGA_TRANSLATION_CLIENT_KEY: ${{ secrets.CLIENT_APP_KEY }}
      EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
    steps:
      - name: Validate target ref input
        shell: bash
        env:
          TARGET_REF: ${{ github.event.inputs.target_ref || 'main' }}
        run: |
          set -euo pipefail
          [[ "$TARGET_REF" =~ ^[A-Za-z0-9._/-]+$ ]]

      - name: Checkout public OpenPGP transfer key
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          path: trusted-source
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: keys/source-bundles-public.asc
          sparse-checkout-cone-mode: false

      - name: Checkout private GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ github.event.inputs.target_ref || 'main' }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Resolve source revision and validate secrets
        id: source
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -n "${FIREBASE_PROJECT_ID:-}" || { echo "::error::Missing FIREBASE_PROJECT_ID secret"; exit 1; }
          test -n "${FIREBASE_WEB_API_KEY:-}" || { echo "::error::Missing FIREBASE_WEB_API_KEY secret"; exit 1; }
          test -n "${MANGA_TRANSLATION_BROKER_URL:-}" || { echo "::error::Missing MANGA_TRANSLATION_BROKER_URL secret"; exit 1; }
          test -n "${MANGA_TRANSLATION_CLIENT_KEY:-}" || { echo "::error::Missing CLIENT_APP_KEY secret"; exit 1; }

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Materialize Manga catalog and resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          python3 tools/manga/materialize_manga_availability_asset.py
          flutter pub get --enforce-lockfile

      - name: Run focused translation, notification, and share tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded \
            test/services/manga/translation/ \
            test/widgets/manga_manhastro/manhastro_gap_chapter_sheet_test.dart \
            test/services/notification_service_manga_test.dart \
            test/platform/android/manga_release_background_scheduler_test.dart \
            test/services/manga/manga_share_card_data_test.dart

      - name: Build Android debug APK
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          encode_endpoint() { printf '%s' "$1" | od -An -tx1 | tr -d ' \n'; }
          broker_define="hex:$(encode_endpoint "$MANGA_TRANSLATION_BROKER_URL")"
          key_define="hex:$(encode_endpoint "$MANGA_TRANSLATION_CLIENT_KEY")"

          defines=(
            "--dart-define=FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}"
            "--dart-define=FIREBASE_WEB_API_KEY=${FIREBASE_WEB_API_KEY}"
            "--dart-define=MANGA_TRANSLATION_BROKER_URL=${broker_define}"
            "--dart-define=MANGA_TRANSLATION_CLIENT_KEY=${key_define}"
          )
          extra_args=()
          if [ "${{ inputs.manga_only }}" = "true" ]; then
            defines+=("--dart-define=GOANIME_MANGA_ONLY=true")
            if [ -f "lib/main_manga_only.dart" ]; then
              extra_args+=("--target=lib/main_manga_only.dart")
            fi
          fi

          flutter build apk --debug --no-pub --target-platform android-arm64 "${extra_args[@]}" "${defines[@]}"

      - name: Validate and OpenPGP-encrypt debug APK
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/private-source/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null

          work="$RUNNER_TEMP/goanime-translation-apk"
          gpg_home="$work/gpg"
          mkdir -p "$gpg_home" "$work/transfer"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"

          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" {print $10; exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"

          encrypted="$work/transfer/GoAnime-${SOURCE_SHA:0:12}-translation-test-debug.apk.gpg"
          gpg --batch --yes --trust-model always \
            --recipient "$EXPECTED_FINGERPRINT" \
            --output "$encrypted" \
            --encrypt "$apk"
          test -s "$encrypted"

          python3 - "$work/transfer/manifest.json" "$SOURCE_SHA" "$sha256" "$size" <<'PY'
          import datetime, json, sys
          path, source_sha, sha256, size = sys.argv[1:]
          data = {
              'schema_version': 1,
              'source_sha': source_sha,
              'build_type': 'translation-test-debug',
              'apk_sha256': sha256,
              'apk_size_bytes': int(size),
              'encryption': 'OpenPGP',
              'recipient_fingerprint': '2DE29DC31427CF0A911AB96175679291435059B0',
              'created_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          with open(path, 'w', encoding='utf-8') as stream:
              json.dump(data, stream, indent=2, sort_keys=True)
              stream.write('\n')
          PY

          rm -rf "$GITHUB_WORKSPACE/private-source" "$gpg_home"
          echo "transfer_dir=$work/transfer" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted APK transfer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: goanime-translation-test-debug-apk-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Clean private workspace
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"

      - name: Summary
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APK_SHA256: ${{ steps.package.outputs.apk_sha256 }}
          APK_SIZE: ${{ steps.package.outputs.apk_size }}
        run: |
          {
            echo '## GoAnime translation test debug APK'
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo "- APK SHA-256: \`$APK_SHA256\`"
            echo "- APK bytes: \`$APK_SIZE\`"
            echo '- Focused translation/notification/share tests passed.'
            echo '- Only OpenPGP ciphertext was uploaded from the public repository.'
          } >> "$GITHUB_STEP_SUMMARY"
