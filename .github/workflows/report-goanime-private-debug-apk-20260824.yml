name: Report encrypted GoAnime legacy APK

on:
  workflow_run:
    workflows: ['Build encrypted private GoAnime APK']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,{owner,repo,run_id:run.id,per_page:100});
            const artifact = artifacts.find(a => a.name === 'goanime-private-debug-apk-encrypted');
            const report = {workflow_run_id:run.id,conclusion:run.conclusion,artifact_id:artifact?.id ?? null,completed_at:run.updated_at};
            const path='reports/goanime-private-debug-apk/latest.json';
            let sha;
            try { const old=await github.rest.repos.getContent({owner,repo,path,ref:'main'}); if(!Array.isArray(old.data)) sha=old.data.sha; } catch(e){ if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:`ci(goanime): observe legacy APK run ${run.id} [skip ci]`,content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64'),branch:'main',sha});
