name: Validate global semantic search

on:
  push:
    branches: [tooling/validate-semantic-coverage-20260810]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PUBLIC_SUPABASE_URL: https://playwright-fichario.supabase.co
      PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_playwright_capture_1234567890
    steps:
      - name: Checkout Fichario feature
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: Semogtw/FicharioVirtual
          ref: feature/unit-topic-coverage
          path: public-source
          persist-credentials: false
          fetch-depth: 1

      - name: Source SHA
        working-directory: public-source
        run: git rev-parse HEAD

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.16.0
          cache: pnpm
          cache-dependency-path: public-source/pnpm-lock.yaml

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: 2.8.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Install dependencies
        working-directory: public-source
        run: pnpm install --frozen-lockfile

      - name: Run semantic search validation matrix
        id: matrix
        continue-on-error: true
        working-directory: public-source
        shell: bash
        run: |
          set +e
          failed=0
          run_gate() {
            name="$1"
            shift
            echo "::group::$name"
            "$@"
            status=$?
            echo "::endgroup::"
            echo "$name=$status"
            if [ "$status" -ne 0 ]; then failed=1; fi
          }
          run_gate prettier pnpm exec prettier --check \
            src/lib/services/semantic-search.ts \
            src/routes/search/+page.svelte \
            supabase/functions/semantic-search/index.ts \
            tests/unit/services/semantic-search.test.ts \
            tests/unit/search/semantic-search-edge-contract.test.ts \
            tests/unit/tooling/deployment-edge-functions.test.ts \
            docs/SEARCH_OCR_MATCHING.md \
            docs/README.md
          run_gate eslint pnpm exec eslint \
            src/lib/services/semantic-search.ts \
            src/routes/search/+page.svelte \
            tests/unit/services/semantic-search.test.ts \
            tests/unit/search/semantic-search-edge-contract.test.ts
          run_gate check pnpm check
          run_gate targeted pnpm test -- \
            tests/unit/services/semantic-search.test.ts \
            tests/unit/search/semantic-search-edge-contract.test.ts \
            tests/unit/tooling/deployment-edge-functions.test.ts \
            tests/unit/services/search.test.ts
          run_gate unit pnpm test
          run_gate build pnpm build
          run_gate source pnpm test:source:offline
          run_gate edge pnpm test:functions:check
          exit "$failed"

      - name: Run database gates
        id: database
        if: always()
        continue-on-error: true
        working-directory: public-source
        run: pnpm test:db:local

      - name: Reject failed gates
        if: always()
        env:
          MATRIX: ${{ steps.matrix.outcome }}
          DATABASE: ${{ steps.database.outcome }}
        run: |
          echo "matrix=$MATRIX database=$DATABASE"
          [ "$MATRIX" = success ] && [ "$DATABASE" = success ]
