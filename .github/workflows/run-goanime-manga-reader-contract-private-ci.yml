name: Run GoAnime manga reader contract privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-reader-contract/*.request'

permissions:
  contents: write
  statuses: write

concurrency:
  group: goanime-manga-reader-contract-private-ci
  cancel-in-progress: false

jobs:
  contract:
    name: Manga reader contract
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-reader-contract/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze reader contract surface
        id: analyze
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            lib/services/manga/manga_http_client.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_content_resolver.dart \
            lib/services/manga/manga_readability_verifier.dart \
            lib/services/manga/manga_source_discovery_service.dart \
            lib/services/manga/manga_search_coordinator.dart \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            tools/manga/audit_planned_provider_stage.dart \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_content_resolver_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/tools/manga/audit_planned_provider_stage_test.dart

      - name: Run reader contract tests
        id: tests
        if: always()
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_content_resolver_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/tools/manga/audit_planned_provider_stage_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart

      - name: Reject formatting drift in reader contract surface
        id: format
        if: always()
        working-directory: private-source
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/manga/manga_remote_content_probe.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_content_resolver.dart \
            lib/services/manga/manga_readability_verifier.dart \
            lib/services/manga/manga_source_discovery_service.dart \
            lib/services/manga/manga_search_coordinator.dart \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            tools/manga/audit_planned_provider_stage.dart \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_content_resolver_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/tools/manga/audit_planned_provider_stage_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

      - name: Publish sanitized contract result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
        run: |
          set -euo pipefail
          state=failure
          if [ "$JOB_STATUS" = success ]; then
            state=success
          fi
          failed_stage=none
          if [ "$ANALYZE_OUTCOME" != success ]; then
            failed_stage=analyze
          elif [ "$TESTS_OUTCOME" != success ]; then
            failed_stage=tests
          elif [ "$FORMAT_OUTCOME" != success ]; then
            failed_stage=format
          fi
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/statuses/$CONTROL_SHA" \
            -f state="$state" \
            -f context='goanime/manga-reader-contract' \
            -f description="Manga reader contract gate: $JOB_STATUS"

          result="$(jq -cn \
            --arg controlSha "$CONTROL_SHA" \
            --arg reviewedSha "$REVIEWED_SHA" \
            --arg state "$state" \
            --arg failedStage "$failed_stage" \
            --arg analyze "$ANALYZE_OUTCOME" \
            --arg tests "$TESTS_OUTCOME" \
            --arg format "$FORMAT_OUTCOME" \
            '{schemaVersion:2,controlSha:$controlSha,reviewedSha:$reviewedSha,state:$state,failedStage:$failedStage,stages:{analyze:$analyze,tests:$tests,format:$format}}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT \
            "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-reader-contract/$CONTROL_SHA.json" \
            -f message="ci(result): record manga reader contract $CONTROL_SHA" \
            -f content="$encoded"
