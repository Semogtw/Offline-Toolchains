name: GoAnime global cache validation

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-global-cache-validation/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-global-cache-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Global cache architecture validation
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Test Toolchains request resolver
        run: python -m unittest tests/test_goanime_resolve_request.py -v

      - name: Resolve exact private revision
        id: request
        env:
          GITHUB_EVENT_NAME: push
        run: |
          set -euo pipefail
          python scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-global-cache-validation \
            --workspace .

      - name: Require private repository read token
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN" || { echo '::error::PRIVATE_REPOSITORIES_TOKEN is required.'; exit 1; }

      - name: Checkout exact GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify immutable source revision
        working-directory: private-source
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.source_hint }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve app and core dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile
          (cd packages/goanime_core && dart pub get)

      - name: Check Dart formatting
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            lib/app/bootstrap.dart
            lib/services/catalog_discovery_reporting_service.dart
            lib/services/mal_provider_availability_service.dart
            lib/services/discovery_evidence_service.dart
            lib/services/global_discovery_overlay_service.dart
            lib/services/new_release_scanner.dart
            lib/services/remote_catalog_endpoints.dart
            test/architecture/service_singleton_inventory_guard_test.dart
            test/screens/home_bootstrap_single_flight_contract_test.dart
            test/services/catalog_discovery_reporting_service_test.dart
            test/services/discovery_evidence_service_test.dart
            test/services/global_discovery_overlay_service_test.dart
            test/services/mal_provider_availability_service_test.dart
            test/services/remote_catalog_endpoints_test.dart
          )
          files=()
          for candidate in "${candidates[@]}"; do
            if [[ -f "$candidate" ]]; then
              files+=("$candidate")
            fi
          done
          if (( ${#files[@]} == 0 )); then
            echo '::error::No catalog architecture Dart files were found to format.'
            exit 1
          fi
          printf 'Formatting %s\n' "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze project
        working-directory: private-source
        run: flutter analyze --no-pub

      - name: Run focused catalog tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            test/services/catalog_discovery_reporting_service_test.dart
            test/services/mal_provider_availability_service_test.dart
            test/architecture/service_singleton_inventory_guard_test.dart
            test/screens/home_bootstrap_single_flight_contract_test.dart
            test/services/remote_catalog_endpoints_test.dart
            test/services/discovery_evidence_service_test.dart
            test/services/global_discovery_overlay_service_test.dart
            test/services/new_release_scanner_test.dart
            test/services/new_release_scanner_batch_registration_test.dart
            test/services/runtime_database_update_service_test.dart
          )
          tests=()
          for candidate in "${candidates[@]}"; do
            if [[ -f "$candidate" ]]; then
              tests+=("$candidate")
            fi
          done
          if (( ${#tests[@]} == 0 )); then
            echo '::error::No focused catalog tests were found.'
            exit 1
          fi
          printf 'Running %s\n' "${tests[@]}"
          flutter test --no-pub --concurrency=1 "${tests[@]}"

      - name: Test catalog discovery consensus promotion
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f tools/tests/test_apply_catalog_discovery_consensus.py ]]; then
            python tools/tests/test_apply_catalog_discovery_consensus.py -v
          else
            echo 'Consensus promotion test is not present on this source revision; skipping legacy revision.'
          fi

      - name: Validate provider cache contract
        working-directory: private-source
        run: |
          python tools/scrapling_provider_pipeline/validate_provider_cache.py \
            --repo-root . \
            --allow-preserved

      - name: Syntax-check Cloudflare Worker
        working-directory: private-source
        run: node --check cloudflare/updates-worker/src/index.js

      - name: Best-effort private required-check status
        if: always() && steps.request.outputs.source_hint != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          SHA: ${{ steps.request.outputs.source_hint }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'GOANIME_CATALOG_WRITE_TOKEN is not configured; skipping private commit status.'
            exit 0
          fi
          python - <<'PY'
          import json, os, urllib.request
          result = os.environ.get('RESULT', 'failure')
          state = 'success' if result == 'success' else 'failure'
          description = (
              'Offline-Toolchains global cache validation passed'
              if state == 'success'
              else 'Offline-Toolchains global cache validation failed'
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/Semogtw/goanime-mobile/statuses/{os.environ['SHA']}",
              data=json.dumps({
                  'state': state,
                  'context': 'Project health, analysis and principal tests',
                  'description': description,
                  'target_url': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              }).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status in (200, 201)
          PY

      - name: Persist public validation report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source_hint }}
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA:-unknown-${GITHUB_RUN_ID}}"
          report_path="reports/goanime-global-cache/${source_sha}.json"
          report_file="$RUNNER_TEMP/goanime-global-cache-report.json"
          python - <<'PY' > "$report_file"
          import json, os
          print(json.dumps({
              'schemaVersion': 1,
              'sourceSha': os.environ.get('SOURCE_SHA') or None,
              'result': os.environ.get('RESULT', 'failure'),
              'runId': os.environ['GITHUB_RUN_ID'],
              'runUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2))
          PY
          encoded="$(base64 -w0 < "$report_file")"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$report_path" --jq .sha 2>/dev/null || true)"
          args=(
            --method PUT
            "repos/$GITHUB_REPOSITORY/contents/$report_path"
            -f "message=ci(goanime): record global cache validation ${source_sha}"
            -f "content=$encoded"
            -f "branch=main"
          )
          if [ -n "$existing" ]; then
            args+=( -f "sha=$existing" )
          fi
          gh api "${args[@]}" >/dev/null