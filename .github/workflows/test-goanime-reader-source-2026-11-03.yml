name: Test GoAnime reader source switch 2026-11-03

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'requests/goanime-tests/reader-source-2026-11-03.json'

permissions:
  contents: read

concurrency:
  group: goanime-tests-cadence2-2026-11-03
  cancel-in-progress: false

env:
  SOURCE_SHA: cde613b18412d8c7626eafc5229fc0be672a8dbc
  FLUTTER_VERSION: 3.47.7
  GOANIME_REPOSITORY: Semogtw/goanime-mobile

jobs:
  test:
    name: Run GoAnime tests written in the 2026-11-01..03 cycle
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout trusted test request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify exact one-shot test request
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          item = json.loads(Path('requests/goanime-tests/reader-source-2026-11-03.json').read_text())
          expected = {
            'source_sha': 'cde613b18412d8c7626eafc5229fc0be672a8dbc'
          }
          assert item == expected, f"Unexpected test request: {item}"
          PY

      - name: Checkout immutable GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Materialize verified catalog and resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 tools/manga/materialize_manga_availability_asset.py
          flutter pub get --enforce-lockfile

      - name: Run the cadence test file
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --reporter expanded \
            test/widgets/manga/manga_reader_screen_test.dart \
            test/widgets/manga_manhastro/reader_production_integration_test.dart
