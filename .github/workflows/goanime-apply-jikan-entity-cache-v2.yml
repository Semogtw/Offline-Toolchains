name: Apply GoAnime Jikan entity cache v2

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-apply-jikan-entity-cache-v2/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-apply-jikan-entity-cache-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-apply-jikan-entity-cache-v2/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Validate patcher
        working-directory: trusted-source
        run: python3 -m py_compile scripts/prepare-goanime-jikan-entity-cache.py

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact remote head
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Apply Jikan cache patch
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-source/scripts/prepare-goanime-jikan-entity-cache.py --root private-source
          python3 - <<'PY'
          from pathlib import Path
          path = Path('private-source/lib/services/jikan_service.dart')
          text = path.read_text()
          replacements = {
            '        _animeByIdInFlight.remove(malId);\n': '        final removed = _animeByIdInFlight.remove(malId);\n        if (removed != null && !identical(removed, load)) {\n          _animeByIdInFlight[malId] = removed;\n        }\n',
            '        _animeRelationsInFlight.remove(malId);\n': '        final removed = _animeRelationsInFlight.remove(malId);\n        if (removed != null && !identical(removed, load)) {\n          _animeRelationsInFlight[malId] = removed;\n        }\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one in-flight removal target, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve, format and validate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          dart format lib/services/jikan_service.dart test/services/jikan_entity_cache_test.dart
          git -c core.whitespace=cr-at-eol diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/services/jikan_entity_cache_test.dart test/services/jikan_rate_limit_queue_test.dart
          printf '%s\n' lib/services/jikan_service.dart test/services/jikan_entity_cache_test.dart | sort > "$RUNNER_TEMP/expected.txt"
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Commit and push validated cache
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GoAnime Toolchains'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/services/jikan_service.dart test/services/jikan_entity_cache_test.dart
          git commit -m 'perf(jikan): bound and deduplicate entity requests'
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
