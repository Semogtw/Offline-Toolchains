name: Run GoAnime manga recovery private CI

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-recovery/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-recovery-private-ci
  cancel-in-progress: false

jobs:
  recovery:
    name: GoAnime manga recovered stack
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 50

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain control files
        uses: actions/checkout@v6
        with:
          path: toolchain-control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision from immutable request
        id: request
        shell: bash
        run: |
          request="$(git -C toolchain-control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-recovery/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "toolchain-control/$request"
          test "$project" = "goanime"
          test "$branch" = "feature/manga-platform"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private manga revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get >/dev/null

      - name: Run recovered stack gates safely
        working-directory: private-source
        shell: bash
        run: |
          failures=()
          run_gate() {
            local label="$1"
            shift
            if "$@" >"/tmp/manga-${label}.log" 2>&1; then
              echo "${label}=success"
            else
              echo "${label}=failure"
              failures+=("$label")
            fi
          }

          run_gate availability_db flutter test --no-pub test/services/manga/manga_availability_database_service_test.dart
          run_gate bundled flutter test --no-pub test/services/manga/manga_bundled_catalog_source_test.dart
          run_gate metadata flutter test --no-pub test/services/manga/manga_bundled_metadata_resolver_test.dart
          run_gate readiness flutter test --no-pub test/services/manga/manga_catalog_readiness_controller_test.dart
          run_gate platform flutter test --no-pub test/services/manga/manga_platform_runtime_test.dart
          run_gate runtime_service flutter test --no-pub test/services/manga/manga_platform_runtime_service_test.dart
          run_gate registry flutter test --no-pub test/services/manga/manga_source_registry_test.dart
          run_gate scheduler flutter test --no-pub test/services/manga/manga_request_scheduler_test.dart
          run_gate http flutter test --no-pub test/services/manga/manga_http_client_test.dart
          run_gate readability flutter test --no-pub test/services/manga/manga_readability_verifier_test.dart
          run_gate discovery flutter test --no-pub test/services/manga/manga_source_discovery_service_test.dart
          run_gate search_coordinator flutter test --no-pub test/services/manga/manga_search_coordinator_test.dart
          run_gate persisted_identity flutter test --no-pub test/services/manga/manga_search_persisted_identity_test.dart
          run_gate matcher flutter test --no-pub test/services/manga/manga_work_matcher_service_test.dart
          run_gate chapter_merge flutter test --no-pub test/services/manga/manga_chapter_merge_service_test.dart
          run_gate source_routing flutter test --no-pub test/integration/manga_source_routing_test.dart
          run_gate reading_route flutter test --no-pub test/services/manga/manga_reading_route_service_test.dart
          run_gate browse_owner flutter test --no-pub test/services/manga/manga_repository_browse_data_source_test.dart
          run_gate details_source flutter test --no-pub test/services/manga/manga_details_data_source_test.dart
          run_gate browse_views flutter test --no-pub test/widgets/manga/manga_browse_views_test.dart
          run_gate categories_sort flutter test --no-pub test/widgets/manga/manga_browse_categories_sort_test.dart
          run_gate search_view flutter test --no-pub test/widgets/manga/manga_readable_search_view_test.dart
          run_gate details_view flutter test --no-pub test/widgets/manga/manga_canonical_details_view_test.dart
          run_gate screens flutter test --no-pub test/widgets/manga/manga_catalog_screen_integration_test.dart
          run_gate runtime_screens flutter test --no-pub test/widgets/manga/manga_runtime_catalog_screen_test.dart
          run_gate runtime_provider flutter test --no-pub test/widgets/manga/manga_platform_runtime_provider_test.dart
          run_gate default_nav flutter test --no-pub test/widgets/manga/manga_default_details_navigation_test.dart
          run_gate bootstrap_wiring flutter test --no-pub test/architecture/manga_bootstrap_runtime_wiring_test.dart

          if dart format --output=none --set-exit-if-changed \
            lib/app/bootstrap.dart \
            lib/services/manga \
            lib/screens/manga \
            lib/widgets/manga \
            test/services/manga \
            test/widgets/manga \
            test/architecture/manga_bootstrap_runtime_wiring_test.dart >/dev/null 2>&1; then
            echo "format=success"
          else
            echo "format=failure"
          fi

          rm -f /tmp/manga-*.log
          if ((${#failures[@]} > 0)); then
            printf 'functional_failures=%s\n' "${failures[*]}"
            exit 1
          fi

      - name: Remove private checkout and transient logs
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/toolchain-control" /tmp/manga-*.log
