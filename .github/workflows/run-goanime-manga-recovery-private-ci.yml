name: Run GoAnime manga recovery private CI

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-recovery/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-recovery-private-ci
  cancel-in-progress: false

jobs:
  recovery:
    name: GoAnime manga recovered stack
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private manga branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feature/manga-platform
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get >/dev/null

      - name: Test bundled readable catalog
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_bundled_catalog_source_test.dart

      - name: Test readiness gate
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_catalog_readiness_controller_test.dart

      - name: Test platform runtime composition
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_platform_runtime_test.dart

      - name: Test repository-backed browse owner
        working-directory: private-source
        run: flutter test --no-pub test/services/manga/manga_repository_browse_data_source_test.dart

      - name: Test browse views
        working-directory: private-source
        run: flutter test --no-pub test/widgets/manga/manga_browse_views_test.dart

      - name: Test readable search view
        working-directory: private-source
        run: flutter test --no-pub test/widgets/manga/manga_readable_search_view_test.dart

      - name: Test canonical details view
        working-directory: private-source
        run: flutter test --no-pub test/widgets/manga/manga_canonical_details_view_test.dart

      - name: Check recovery formatting safely
        id: format
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/manga \
            lib/widgets/manga \
            test/services/manga \
            test/widgets/manga >/dev/null 2>&1

      - name: Report formatting drift safely
        if: steps.format.outcome == 'failure'
        run: |
          echo "Recovered manga stack has formatter drift."
          echo "Private source paths and diffs are intentionally omitted."

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
