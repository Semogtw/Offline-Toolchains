name: GoAnime Global Catalog Finalize

on:
  workflow_run:
    workflows: ["GoAnime Scrapling provider cache"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-global-catalog-finalize/*.request'
  workflow_dispatch:
    inputs:
      target_ref:
        description: GoAnime ref to validate; publication is restricted to main
        required: true
        default: main
      source_hint:
        description: Optional exact 40-character GoAnime source SHA
        required: false
        default: ''
      publish_runtime:
        description: Publish runtime SQLite/manifest to R2 when configured
        required: true
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: goanime-global-catalog-finalize-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    # Incremental Jikan mapping is deliberately rate-limited. The current
    # catalog can contain thousands of unprocessed titles, so the job must
    # outlive a single 45-minute runner window before publishing anything.
    timeout-minutes: 360
    env:
      FLUTTER_CHANNEL: stable
      FLUTTER_VERSION: 3.44.1
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Run trusted consensus unit tests
        working-directory: trusted-source
        run: python -m unittest tests/test_goanime_catalog_discovery_consensus.py -v

      - name: Resolve trusted GoAnime target
        id: request
        working-directory: trusted-source
        shell: bash
        env:
          DISPATCH_TARGET: ${{ github.event.inputs.target_ref || '' }}
          DISPATCH_SOURCE_HINT: ${{ github.event.inputs.source_hint || '' }}
        run: |
          set -euo pipefail
          python scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-global-catalog-finalize \
            --workspace . \
            --default-branch main \
            --dispatch-target "$DISPATCH_TARGET" \
            --dispatch-source-hint "$DISPATCH_SOURCE_HINT"

      - name: Resolve publication policy
        id: policy
        shell: bash
        env:
          TARGET_REF: ${{ steps.request.outputs.target_branch }}
          DISPATCH_PUBLISH_RUNTIME: ${{ github.event.inputs.publish_runtime || 'false' }}
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          RUNTIME_BASE_URL: ${{ secrets.RUNTIME_DATABASE_PUBLIC_BASE_URL }}
          UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN" || { echo '::error::PRIVATE_REPOSITORIES_TOKEN is required.'; exit 1; }
          git check-ref-format --branch "$TARGET_REF" >/dev/null
          echo "target=$TARGET_REF" >> "$GITHUB_OUTPUT"

          publish_runtime=false
          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ] || { [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$DISPATCH_PUBLISH_RUNTIME" = 'true' ]; }; then
            publish_runtime=true
          fi
          echo "publish_runtime=$publish_runtime" >> "$GITHUB_OUTPUT"

          # Community consensus is a runtime overlay, not crawler truth.
          # The provider-cache workflow alone owns canonical git artifacts.
          echo 'commit=false' >> "$GITHUB_OUTPUT"

          base_url="${RUNTIME_BASE_URL%/}"
          if [ -z "$base_url" ] && [ -n "$UPDATE_MANIFEST_URL" ]; then
            case "$UPDATE_MANIFEST_URL" in
              */latest/update.json) base_url="${UPDATE_MANIFEST_URL%/update.json}" ;;
            esac
          fi
          echo "runtime_base_url=$base_url" >> "$GITHUB_OUTPUT"

          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] && [ -n "$base_url" ]; then
            echo 'r2_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'r2_configured=false' >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo 'firestore_configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'firestore_configured=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint || steps.request.outputs.target_branch }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Record immutable GoAnime revision
        id: source
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SOURCE_HINT: ${{ steps.request.outputs.source_hint }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SOURCE_HINT" ] && [ "$sha" != "$EXPECTED_SOURCE_HINT" ]; then
            echo '::error::Checked-out GoAnime revision does not match source_hint.'
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -f tools/apply_catalog_discovery_consensus.py
          test -f tools/build_title_availability_database.dart
          test -f tools/build_mal_availability_cache_checkpointed.dart
          test -f tools/build_franchise_availability_cache.dart
          test -f tools/postprocess_franchise_availability_cache.dart
          test -f tools/build_franchise_runtime_artifacts.dart
          test -f tools/build_runtime_database_manifest.dart

      - name: Capture anime availability baseline
        id: anime_baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/goanime-global-catalog-baseline"
          mkdir -p "$baseline"
          cp assets/data/mal_availability_map.json "$baseline/mal_availability_map.json"
          echo "path=$baseline/mal_availability_map.json" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Firestore collector dependency
        if: steps.policy.outputs.firestore_configured == 'true'
        run: python -m pip install --disable-pip-version-check 'google-auth==2.40.3' 'requests==2.32.4'

      - name: Collect playback-verified discovery consensus
        working-directory: trusted-source
        env:
          GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOANIME_FIREBASE_SERVICE_ACCOUNT_JSON_B64 }}
        run: >-
          python scripts/goanime_catalog_discovery_consensus.py
          --output ../private-source/build/catalog_discovery_consensus.json
          --min-reporters 2
          --max-age-days 14

      - name: Validate provider base before community overlay
        working-directory: private-source
        run: >-
          python tools/scrapling_provider_pipeline/validate_provider_cache.py
          --repo-root .
          --allow-preserved

      - name: Apply safe discovery consensus overlay
        working-directory: private-source
        run: >-
          python tools/apply_catalog_discovery_consensus.py
          --repo-root .
          --consensus build/catalog_discovery_consensus.json

      - name: Run promotion unit tests
        working-directory: private-source
        run: python -m unittest tools/tests/test_apply_catalog_discovery_consensus.py -v

      - name: Validate promoted JSON shapes
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool assets/data/available_animes.json >/dev/null
          python -m json.tool assets/data/available_anime_modes.json >/dev/null
          python -m json.tool assets/data/mal_provider_availability_map.json >/dev/null
          python -m json.tool build/catalog_discovery_consensus.json >/dev/null
          python -m json.tool build/catalog_discovery_promotion_summary.json >/dev/null

      - name: Validate optional private Jikan origin override
        env:
          GOANIME_JIKAN_BASE_URL: ${{ secrets.GOANIME_JIKAN_BASE_URL }}
          GOANIME_METADATA_API_TOKEN: ${{ secrets.GOANIME_METADATA_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GOANIME_JIKAN_BASE_URL" ] || [ -n "$GOANIME_METADATA_API_TOKEN" ]; then
            test -n "$GOANIME_JIKAN_BASE_URL" || {
              echo '::error::GOANIME_JIKAN_BASE_URL is required when the private Jikan token is configured.'
              exit 1
            }
            test -n "$GOANIME_METADATA_API_TOKEN" || {
              echo '::error::GOANIME_METADATA_API_TOKEN is required when a private Jikan URL is configured.'
              exit 1
            }
            echo 'Private Jikan origin override: configured.'
          else
            echo 'Private Jikan origin override: not configured; using the default private gateway.'
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install GoAnime dependencies
        working-directory: private-source
        run: flutter pub get --enforce-lockfile

      - name: Validate client discovery reporter
        working-directory: private-source
        run: flutter test --no-pub test/services/catalog_discovery_reporting_service_test.dart

      - name: Map promoted anime titles to MAL incrementally
        working-directory: private-source
        env:
          GOANIME_JIKAN_BASE_URL: ${{ secrets.GOANIME_JIKAN_BASE_URL }}
          GOANIME_METADATA_API_TOKEN: ${{ secrets.GOANIME_METADATA_API_TOKEN }}
          GOANIME_REQUIRE_PRIVATE_METADATA: 'true'
        run: dart run tools/build_mal_availability_cache_checkpointed.dart --incremental

      - name: Capture MAL IDs requiring franchise refresh
        id: franchise_refresh
        working-directory: private-source
        env:
          BASELINE_MAL_MAP: ${{ steps.anime_baseline.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/goanime-global-catalog-baseline/franchise_mal_ids.txt"
          python3 - "$BASELINE_MAL_MAP" "$output" <<'PY'
          import json, sys
          from pathlib import Path

          baseline = json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          current = json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          franchise = json.loads(Path('assets/data/franchise_availability_map.json').read_text(encoding='utf-8'))

          def ids(document):
              return {
                  int(entry['malId'])
                  for entry in document.get('entries') or []
                  if isinstance(entry, dict) and isinstance(entry.get('malId'), int) and entry['malId'] > 0
              }

          current_ids = ids(current)
          baseline_ids = ids(baseline)
          indexed_ids = {
              int(entry['malId'])
              for entry in franchise.get('index') or []
              if isinstance(entry, dict) and isinstance(entry.get('malId'), int) and entry['malId'] > 0
          }
          affected = sorted((current_ids - baseline_ids) | (current_ids - indexed_ids))
          Path(sys.argv[2]).write_text('\n'.join(map(str, affected)), encoding='utf-8')
          print(f'MAL IDs requiring franchise refresh: {len(affected)}')
          if affected:
              print('affected MAL IDs:', ','.join(map(str, affected)))
          PY
          echo "path=$output" >> "$GITHUB_OUTPUT"

      - name: Rebuild franchise runtime artifacts for promoted anime
        working-directory: private-source
        env:
          MAL_IDS_FILE: ${{ steps.franchise_refresh.outputs.path }}
          GOANIME_JIKAN_BASE_URL: ${{ secrets.GOANIME_JIKAN_BASE_URL }}
          GOANIME_METADATA_API_TOKEN: ${{ secrets.GOANIME_METADATA_API_TOKEN }}
          GOANIME_REQUIRE_PRIVATE_METADATA: 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -s "$MAL_IDS_FILE" ]; then
            args=()
            while IFS= read -r id; do
              [ -n "$id" ] && args+=("--mal-id=$id")
            done < "$MAL_IDS_FILE"
            dart run tools/build_franchise_availability_cache.dart "${args[@]}"
            dart run tools/postprocess_franchise_availability_cache.dart --write
          else
            echo 'No new or unindexed MAL IDs; preserving franchise graph cache.'
          fi
          dart run tools/build_franchise_runtime_artifacts.dart

      - name: Build title availability SQLite
        working-directory: private-source
        run: dart run tools/build_title_availability_database.dart

      - name: Build runtime database manifest
        working-directory: private-source
        env:
          RUNTIME_DATABASE_PUBLIC_BASE_URL: ${{ steps.policy.outputs.runtime_base_url }}
        run: dart run tools/build_runtime_database_manifest.dart

      - name: Validate runtime publication outputs
        id: runtime_assets
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          manifest=dist/runtime_database_cache/runtime_database_manifest.json
          test -s assets/data/title_availability.db
          test -s assets/data/title_availability.db.sha256
          test -s "$manifest"
          test -s dist/runtime_database_cache/title_availability.db
          test -s dist/runtime_database_cache/franchise_availability.db
          python -m json.tool "$manifest" >/dev/null

          expected="$(tr -d '[:space:]' < assets/data/title_availability.db.sha256)"
          actual="$(sha256sum assets/data/title_availability.db | awk '{print $1}')"
          test "$expected" = "$actual"

          franchise_expected="$(tr -d '[:space:]' < assets/data/franchise_availability.db.sha256)"
          franchise_actual="$(sha256sum assets/data/franchise_availability.db | awk '{print $1}')"
          test "$franchise_expected" = "$franchise_actual"
          test "$(jq -r '.assets[] | select(.databaseId == "franchise_availability") | .sha256' "$manifest")" = "$franchise_actual"
          test "$(sha256sum dist/runtime_database_cache/franchise_availability.db | awk '{print $1}')" = "$franchise_actual"
          test "$(jq -r '.assets[] | select(.databaseId == "title_availability") | .sha256' "$manifest")" = "$actual"
          test "$(sha256sum dist/runtime_database_cache/title_availability.db | awk '{print $1}')" = "$actual"

          # Backward-compatible rollout: main currently emits the two anime
          # databases. Once GoAnime main contains manga runtime support, the
          # same generator emits the third payload and it becomes mandatory for
          # that manifest generation. This lets Toolchains land first safely.
          asset_count="$(jq '.assets | length' "$manifest")"
          case "$asset_count" in
            2|3) ;;
            *) echo "::error::Unexpected runtime database asset count: $asset_count"; exit 1 ;;
          esac

          manga_count="$(jq '[.assets[] | select(.databaseId == "manga_availability")] | length' "$manifest")"
          if [ "$manga_count" = '1' ]; then
            test "$asset_count" = '3'
            test -s dist/runtime_database_cache/manga_availability.db
            test "$(jq -r '.assets[] | select(.databaseId == "manga_availability") | .schemaVersion' "$manifest")" = '3'
            echo 'manga_runtime=true' >> "$GITHUB_OUTPUT"
          elif [ "$manga_count" = '0' ]; then
            test "$asset_count" = '2'
            echo 'manga_runtime=false' >> "$GITHUB_OUTPUT"
          else
            echo '::error::Duplicate manga runtime database entries in manifest.'
            exit 1
          fi
          echo "asset_count=$asset_count" >> "$GITHUB_OUTPUT"

      - name: Verify generated repository diff scope
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(assets/data/(available_animes\.json|available_anime_modes\.json|mal_provider_availability_map\.json|mal_availability_map\.json|mal_availability_unmatched\.json|franchise_availability_map\.json|franchise_index\.json|franchise_availability\.db|franchise_availability\.db\.sha256|title_availability\.db|title_availability\.db\.sha256|manga_availability\.db\.sha256))$'
          changed="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev '^(build|dist)/' || true)"
          unexpected="$(printf '%s\n' "$changed" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo '::error::Unexpected generated repository files:'
            printf '%s\n' "$unexpected"
            exit 1
          fi

      - name: Commit validated global catalog artifacts
        if: steps.policy.outputs.commit == 'true'
        working-directory: private-source
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          TARGET_REF: ${{ steps.policy.outputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_provider_availability_map.json \
            assets/data/title_availability.db \
            assets/data/title_availability.db.sha256 \
            assets/data/franchise_availability.db.sha256
          if [ -f assets/data/manga_availability.db.sha256 ]; then
            git add assets/data/manga_availability.db.sha256
          fi
          if git diff --cached --quiet; then
            echo 'No global catalog artifact changes to commit.'
          else
            git diff --cached --check
            git commit -m 'chore(cache): publish global runtime catalog'
            auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
            extraheader="AUTHORIZATION: basic $auth"
            git -c http.https://github.com/.extraheader="$extraheader" fetch origin "$TARGET_REF"
            test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA" || {
              echo '::error::GoAnime target advanced during finalization; refusing stale push.'
              exit 1
            }
            git -c http.https://github.com/.extraheader="$extraheader" push origin "HEAD:$TARGET_REF"
            unset auth extraheader WRITE_TOKEN
          fi

      - name: Publish runtime databases to R2
        if: steps.policy.outputs.publish_runtime == 'true' && steps.policy.outputs.r2_configured == 'true'
        working-directory: private-source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_EC2_METADATA_DISABLED: 'true'
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          manifest=dist/runtime_database_cache/runtime_database_manifest.json
          # Publish payloads first and the manifest last. Clients only observe a
          # new generation after every referenced database has reached R2.
          aws s3 cp dist/runtime_database_cache/franchise_availability.db "s3://${R2_BUCKET}/latest/franchise_availability.db" --endpoint-url "$endpoint"
          aws s3 cp dist/runtime_database_cache/title_availability.db "s3://${R2_BUCKET}/latest/title_availability.db" --endpoint-url "$endpoint"
          if jq -e '.assets[] | select(.databaseId == "manga_availability")' "$manifest" >/dev/null; then
            test -s dist/runtime_database_cache/manga_availability.db
            aws s3 cp dist/runtime_database_cache/manga_availability.db "s3://${R2_BUCKET}/latest/manga_availability.db" --endpoint-url "$endpoint"
          fi
          aws s3 cp assets/data/mal_provider_availability_map.json "s3://${R2_BUCKET}/latest/mal_provider_availability_map.json" --endpoint-url "$endpoint"
          aws s3 cp "$manifest" "s3://${R2_BUCKET}/latest/runtime_database_manifest.json" --endpoint-url "$endpoint"

      - name: Warn when runtime publication is requested but unavailable
        if: steps.policy.outputs.publish_runtime == 'true' && steps.policy.outputs.r2_configured != 'true'
        run: echo '::warning::Runtime publication requested, but R2 credentials/public base URL are incomplete in Offline-Toolchains.'

      - name: Publish sanitized validation receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          REQUEST_SOURCE_SHA: ${{ steps.request.outputs.source_hint }}
          TARGET_REF: ${{ steps.request.outputs.target_branch }}
          FIRESTORE_CONFIGURED: ${{ steps.policy.outputs.firestore_configured }}
          R2_CONFIGURED: ${{ steps.policy.outputs.r2_configured }}
          PUBLISH_RUNTIME: ${{ steps.policy.outputs.publish_runtime }}
          RUNTIME_ASSET_COUNT: ${{ steps.runtime_assets.outputs.asset_count }}
          MANGA_RUNTIME: ${{ steps.runtime_assets.outputs.manga_runtime }}
          STATE: ${{ job.status }}
        shell: bash
        run: |
          set -euo pipefail
          source_sha="${SOURCE_SHA:-${REQUEST_SOURCE_SHA:-unknown}}"
          target_ref="${TARGET_REF:-unknown}"
          body="$(jq -cn \
            --arg sourceSha "$source_sha" \
            --arg targetRef "$target_ref" \
            --arg state "$STATE" \
            --arg firestoreConfigured "${FIRESTORE_CONFIGURED:-unknown}" \
            --arg r2Configured "${R2_CONFIGURED:-unknown}" \
            --arg publishRuntime "${PUBLISH_RUNTIME:-false}" \
            --arg runtimeAssetCount "${RUNTIME_ASSET_COUNT:-unknown}" \
            --arg mangaRuntime "${MANGA_RUNTIME:-unknown}" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,sourceSha:$sourceSha,targetRef:$targetRef,state:$state,firestoreConfigured:$firestoreConfigured,r2Configured:$r2Configured,publishRuntime:$publishRuntime,runtimeAssetCount:$runtimeAssetCount,mangaRuntime:$mangaRuntime,runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path="results/goanime-global-catalog-finalize/${source_sha}-${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record global catalog finalizer $GITHUB_RUN_ID" \
            -f content="$encoded" >/dev/null

      - name: Write workflow summary
        if: always()
        working-directory: private-source
        shell: bash
        env:
          TARGET_REF: ${{ steps.policy.outputs.target }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          FIRESTORE_CONFIGURED: ${{ steps.policy.outputs.firestore_configured }}
          R2_CONFIGURED: ${{ steps.policy.outputs.r2_configured }}
          PUBLISH_RUNTIME: ${{ steps.policy.outputs.publish_runtime }}
          RUNTIME_ASSET_COUNT: ${{ steps.runtime_assets.outputs.asset_count }}
          MANGA_RUNTIME: ${{ steps.runtime_assets.outputs.manga_runtime }}
        run: |
          {
            echo '## GoAnime global catalog finalization'
            echo
            echo "- target: \`$TARGET_REF\`"
            echo "- source SHA: \`$SOURCE_SHA\`"
            echo "- Firestore consensus configured: \`$FIRESTORE_CONFIGURED\`"
            echo "- runtime publication requested: \`$PUBLISH_RUNTIME\`"
            echo "- R2 configured: \`$R2_CONFIGURED\`"
            echo "- runtime DB assets: \`${RUNTIME_ASSET_COUNT:-unknown}\`"
            echo "- manga runtime DB present: \`${MANGA_RUNTIME:-unknown}\`"
            if [ -f build/catalog_discovery_promotion_summary.json ]; then
              echo '- promotion summary:'
              echo '```json'
              cat build/catalog_discovery_promotion_summary.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
