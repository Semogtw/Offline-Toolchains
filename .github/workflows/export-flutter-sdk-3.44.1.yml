name: Export pinned PDFium test asset

on:
  push:
    branches:
      - toolchain/export-flutter-sdk-3.44.1-20260826
    paths:
      - .github/workflows/export-flutter-sdk-3.44.1.yml

permissions:
  contents: read

jobs:
  export:
    name: Download pinned PDFium Linux x64 asset
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download exact PDFium release used by pdfium_dart 0.2.5
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/pdfium-linux-x64.tgz" \
            'https://github.com/bblanchon/pdfium-binaries/releases/download/chromium%2F7811/pdfium-linux-x64.tgz'
          tar -tzf "$RUNNER_TEMP/pdfium-linux-x64.tgz" | grep -Fx 'lib/libpdfium.so'
          sha256sum "$RUNNER_TEMP/pdfium-linux-x64.tgz" > "$RUNNER_TEMP/SHA256SUMS"

      - name: Upload PDFium test asset
        uses: actions/upload-artifact@v7
        with:
          name: pdfium-chromium-7811-linux-x64
          path: |
            ${{ runner.temp }}/pdfium-linux-x64.tgz
            ${{ runner.temp }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
