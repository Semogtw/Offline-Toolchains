name: Diagnose GoAnime MangaDex robust inventory

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangadex-inventory-robust/*.request'

permissions:
  contents: read

jobs:
  diagnose:
    name: Prove MangaDex large pages fresh connections retry
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangadex-inventory-robust/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply diagnostic inventory strategy
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          provider = Path('lib/services/manga/providers/mangadex_manga_provider.dart')
          text = provider.read_text()
          old = 'static const int _searchPageSize = 24;'
          if old not in text:
              raise SystemExit('MangaDex page size declaration changed')
          provider.write_text(text.replace(old, 'static const int _searchPageSize = 100;', 1))

          http_client = Path('lib/services/manga/manga_http_client.dart')
          text = http_client.read_text()
          old = """      final request = http.Request(currentMethod, currentUri)\n        ..followRedirects = false\n        ..headers.addAll(currentHeaders);\n"""
          new = """      final request = http.Request(currentMethod, currentUri)\n        ..followRedirects = false\n        ..persistentConnection = policy.sourceId != 'ptbr.mangadex'\n        ..headers.addAll(currentHeaders);\n"""
          if old not in text:
              raise SystemExit('MangaHttpClient request block changed')
          http_client.write_text(text.replace(old, new, 1))

          inventory = Path('tools/manga/inventory_manga_catalog.dart')
          text = inventory.read_text()
          old = """      page = await provider.search(\n        MangaSearchRequest(query: '', pageToken: pageToken),\n      );\n"""
          new = """      MangaSearchPage? resolvedPage;\n      MangaProviderFailure? lastFailure;\n      for (var attempt = 1; attempt <= 5; attempt++) {\n        try {\n          resolvedPage = await provider.search(\n            MangaSearchRequest(query: '', pageToken: pageToken),\n          );\n          lastFailure = null;\n          break;\n        } on MangaProviderFailure catch (error) {\n          final retryable =\n              provider.sourceId == 'ptbr.mangadex' &&\n              error.kind == MangaProviderFailureKind.httpStatus &&\n              error.statusCode == 400;\n          if (!retryable || attempt >= 5) rethrow;\n          lastFailure = error;\n          await Future<void>.delayed(const Duration(milliseconds: 100));\n        }\n      }\n      if (lastFailure != null) throw lastFailure;\n      page = resolvedPage!;\n"""
          if old not in text:
              raise SystemExit('inventory search block changed')
          inventory.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies and format diagnostic patch
        working-directory: private-source
        run: |
          flutter pub get --enforce-lockfile >/dev/null
          dart format lib/services/manga/manga_http_client.dart lib/services/manga/providers/mangadex_manga_provider.dart tools/manga/inventory_manga_catalog.dart >/dev/null

      - name: Exhaustively enumerate MangaDex
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/mangadex-robust"
          rm -rf "$out" && mkdir -p "$out"
          timeout 900s dart run tools/manga/inventory_manga_catalog.dart \
            --only-sources ptbr.mangadex \
            --output-dir "$out" \
            --max-pages 150 \
            --timeout-minutes 14 \
            --max-readability-probes 1 \
            --max-readability-probes-per-provider 1 \
            --readability-concurrent-providers 1 \
            --readability-stale-days 30 \
            --readability-probe-timeout-seconds 10
          python3 - "$out/manga_catalog_inventory.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding='utf-8'))
          row = next(p for p in data['providers'] if p['sourceId'] == 'ptbr.mangadex')
          safe = {k: row.get(k) for k in ('status','stopReason','pagesScanned','rawItems','uniqueOccurrences','duplicateOccurrences','failure')}
          print(json.dumps(safe, sort_keys=True))
          assert row['status'] == 'exhausted', row
          assert row['stopReason'] == 'next_page_token_null', row
          assert row['uniqueOccurrences'] > 10000, row
          PY

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
