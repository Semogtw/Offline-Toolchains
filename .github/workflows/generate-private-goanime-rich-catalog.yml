name: Generate private GoAnime rich catalog

on:
  push:
    branches: [main]
    paths:
      - triggers/private-goanime-rich-catalog.json

permissions:
  contents: read

concurrency:
  group: private-goanime-rich-catalog
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read exact private source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-rich-catalog.json"
          python3 - "$request" "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          payload=json.load(open(sys.argv[1],encoding='utf-8'))
          sha=str(payload.get('ref') or '').strip().lower()
          branch=str(payload.get('branch') or '').strip()
          if not re.fullmatch(r'[0-9a-f]{40}',sha): raise SystemExit('ref must be an exact SHA')
          if not re.fullmatch(r'[A-Za-z0-9._/-]{1,200}',branch) or branch.startswith('/') or branch.endswith('/') or '..' in branch:
              raise SystemExit('branch must be a safe existing branch name')
          with open(sys.argv[2],'a',encoding='utf-8') as out:
              out.write(f'ref={sha}\nbranch={branch}\n')
          PY

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source
        shell: bash
        run: test "$(git -C private-source rev-parse HEAD)" = '${{ steps.request.outputs.ref }}'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get

      - name: Bulk-enrich strict MAL identities first
        working-directory: private-source
        shell: bash
        env:
          EMPTY_TARGETS_PATH: ${{ runner.temp }}/goanime-rich-empty-targets.json
          BULK_BASELINE_PATH: ${{ runner.temp }}/goanime-rich-bulk-baseline.json
        run: |
          set -euo pipefail
          printf '{"queries":[],"targets":[]}\n' > "$EMPTY_TARGETS_PATH"
          dart run tools/build_anime_metadata_seed.dart --targets="$EMPTY_TARGETS_PATH"
          cp dist/anime_metadata_cache/anime_metadata_seed.json "$BULK_BASELINE_PATH"

      - name: Build current-season refresh request
        working-directory: private-source
        shell: bash
        env:
          TARGETS_PATH: ${{ runner.temp }}/goanime-rich-targets.json
          BULK_BASELINE_PATH: ${{ runner.temp }}/goanime-rich-bulk-baseline.json
        run: |
          set -euo pipefail
          python3 - "$TARGETS_PATH" "$BULK_BASELINE_PATH" <<'PY'
          import json,sys
          from pathlib import Path
          baseline=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          refresh={}
          for raw in baseline.get('entries') or []:
              if not isinstance(raw,dict): continue
              mid=raw.get('malId'); status=str(raw.get('status') or '').lower()
              if not isinstance(mid,int) or mid<=0: continue
              if any(token in status for token in ('currently airing','releasing','not yet','upcoming')):
                  refresh[mid]={'malId':mid,'title':str(raw.get('title') or f'MAL {mid}').strip()}
          payload={'queries':[{'path':'/seasons/now','pages':3}],'targets':list(refresh.values())[:80]}
          Path(sys.argv[1]).write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Refresh season and broadcast
        working-directory: private-source
        shell: bash
        env:
          TARGETS_PATH: ${{ runner.temp }}/goanime-rich-targets.json
          BULK_BASELINE_PATH: ${{ runner.temp }}/goanime-rich-bulk-baseline.json
        run: |
          set -euo pipefail
          dart run tools/build_anime_metadata_seed.dart --targets="$TARGETS_PATH" --baseline="$BULK_BASELINE_PATH"

      - name: Validate generated rich catalog
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          seed=json.loads(Path('dist/anime_metadata_cache/anime_metadata_seed.json').read_text(encoding='utf-8'))
          mal=json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          broadcasts=json.loads(Path('dist/anime_metadata_cache/broadcast_schedule.json').read_text(encoding='utf-8')).get('entries') or {}
          entries=seed.get('entries') or []
          rich={e.get('malId') for e in entries if isinstance(e,dict) and isinstance(e.get('malId'),int) and str(e.get('imageUrl') or '').strip()}
          strict={e.get('malId') for e in mal.get('entries') or [] if isinstance(e,dict) and isinstance(e.get('malId'),int) and ((e.get('modes') or {}).get('sub') or (e.get('modes') or {}).get('dub'))}
          covered=len(rich & strict); ratio=covered/len(strict) if strict else 1.0
          now=datetime.now(timezone.utc); season='winter' if now.month<=3 else 'spring' if now.month<=6 else 'summer' if now.month<=9 else 'fall'
          current=[e for e in entries if isinstance(e,dict) and e.get('year')==now.year and str(e.get('season') or '').lower()==season and str(e.get('imageUrl') or '').strip()]
          if ratio<0.90: raise SystemExit(f'strict rich coverage too small: {covered}/{len(strict)} ({ratio:.1%})')
          if len(current)<10: raise SystemExit(f'current season metadata too small: {len(current)}')
          if len(broadcasts)<5: raise SystemExit(f'broadcast snapshot too small: {len(broadcasts)}')
          print(f'rich={len(entries)} strict={len(strict)} covered={covered} ratio={ratio:.1%} current={len(current)} broadcasts={len(broadcasts)}')
          PY

      - name: Publish validated assets to source branch
        id: publish
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_REF: ${{ steps.request.outputs.ref }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_REF" || {
            echo 'Source branch moved during generation; refusing to overwrite it.' >&2
            exit 1
          }
          cp dist/anime_metadata_cache/anime_metadata_seed.json assets/data/anime_metadata_seed.json
          cp dist/anime_metadata_cache/broadcast_schedule.json assets/data/broadcast_schedule.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/anime_metadata_seed.json assets/data/broadcast_schedule.json
          if git diff --cached --quiet; then
            echo "published_sha=$EXPECTED_REF" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(catalog): promote unified rich anime metadata'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        shell: bash
        run: echo "Published catalog SHA ${{ steps.publish.outputs.published_sha }}"

      - name: Cleanup
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source" "$RUNNER_TEMP/goanime-rich-targets.json" "$RUNNER_TEMP/goanime-rich-empty-targets.json" "$RUNNER_TEMP/goanime-rich-bulk-baseline.json"
