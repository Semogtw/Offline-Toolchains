name: Run Receitas CI

on:
  workflow_run:
    workflows:
      - Request Receitas CI
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: receitas-ci-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify:
    name: Receitas executable repository gates
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'build/receitas-ci' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.actor.login == github.repository_owner &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CI: 'true'
      DENO_NO_UPDATE_CHECK: '1'
      SUPABASE_TELEMETRY_DISABLED: '1'
      VITE_SUPABASE_URL: https://receitas-ci.invalid
      VITE_SUPABASE_ANON_KEY: ci-public-placeholder-not-a-secret
      VITE_POWERSYNC_URL: https://powersync.receitas-ci.invalid
      RELEASE_ENV: preview

    steps:
      - name: Checkout request revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: request-source
          persist-credentials: false
          sparse-checkout: triggers/receitas-ci.json
          sparse-checkout-cone-mode: false

      - name: Normalize fixed Receitas request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          request = json.loads(Path('request-source/triggers/receitas-ci.json').read_text(encoding='utf-8'))
          if set(request) != {'ref'}:
              raise SystemExit('request must contain exactly the ref field')
          ref = request['ref']
          if not isinstance(ref, str) or not ref:
              raise SystemExit('ref must be a non-empty string')
          if len(ref) > 200 or ref.startswith('-') or '..' in ref or '@{' in ref:
              raise SystemExit('unsafe git ref')
          if not re.fullmatch(r'[A-Za-z0-9._/-]+', ref):
              raise SystemExit('ref contains unsupported characters')
          with open(sys.argv[1], 'a', encoding='utf-8') as stream:
              stream.write(f'ref={ref}\n')
          PY

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private Receitas source read-only
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/Receitas
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Attest checked-out revision and Edge test manifest
        id: source_attestation
        working-directory: private-source
        shell: bash
        env:
          REQUESTED_REF: ${{ steps.request.outputs.ref }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$REQUESTED_REF" =~ ^[0-9A-Fa-f]{40}$ ]] && [[ "${actual_sha,,}" != "${REQUESTED_REF,,}" ]]; then
            echo "Receitas checkout mismatch: requested $REQUESTED_REF, resolved $actual_sha" >&2
            exit 1
          fi

          manifest_file="$(mktemp)"
          find supabase/functions -type f \( \
            -name '*.test.ts' -o -name '*_test.ts' -o \
            -name '*.test.tsx' -o -name '*_test.tsx' \
          \) -print | LC_ALL=C sort > "$manifest_file"
          edge_test_count="$(wc -l < "$manifest_file" | tr -d '[:space:]')"
          if [[ ! "$edge_test_count" =~ ^[1-9][0-9]*$ ]]; then
            echo 'No Edge Function Deno test modules were discovered in the checked-out source.' >&2
            exit 1
          fi
          edge_manifest_sha="$(sha256sum "$manifest_file" | cut -d' ' -f1)"
          rm -f "$manifest_file"

          echo "revision=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "edge_test_count=$edge_test_count" >> "$GITHUB_OUTPUT"
          echo "edge_manifest_sha=$edge_manifest_sha" >> "$GITHUB_OUTPUT"
          echo "Receitas revision: ${actual_sha:0:12}"
          echo "Edge test modules discovered: $edge_test_count"
          echo "Edge test manifest sha256: $edge_manifest_sha"

      - name: Set up pinned Node.js without persistent dependency cache
        uses: actions/setup-node@v6
        with:
          node-version: '24.18.0'
          check-latest: false

      - name: Activate repository-pinned pnpm
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          package_manager="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json','utf8')).packageManager")"
          case "$package_manager" in
            pnpm@*) ;;
            *) echo "package.json must pin pnpm via packageManager" >&2; exit 1 ;;
          esac
          corepack enable
          corepack prepare "$package_manager" --activate
          node --version
          pnpm --version

      - name: Set up pinned Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: 2.8.1

      - name: Install dependencies without persistent cache
        id: install
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f pnpm-lock.yaml ]]; then
            echo 'lockfile=present' >> "$GITHUB_OUTPUT"
            pnpm install --frozen-lockfile
          else
            echo 'lockfile=missing' >> "$GITHUB_OUTPUT"
            echo 'pnpm-lock.yaml is missing; using an ephemeral resolution only to discover additional gate failures.' >&2
            pnpm install --no-frozen-lockfile
          fi

      - name: Release script tests
        id: release_scripts
        continue-on-error: true
        working-directory: private-source
        run: pnpm test:release-scripts

      - name: Source security audits
        id: source_audits
        continue-on-error: true
        working-directory: private-source
        run: pnpm verify:source

      - name: ESLint
        id: lint
        continue-on-error: true
        working-directory: private-source
        run: pnpm lint

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        working-directory: private-source
        run: pnpm typecheck

      - name: Unit tests
        id: unit
        continue-on-error: true
        working-directory: private-source
        run: pnpm test:run

      - name: Deno Edge Function tests
        id: deno_tests
        continue-on-error: true
        working-directory: private-source
        run: pnpm test:edge

      - name: Deno Edge Function typecheck
        id: deno_check
        continue-on-error: true
        working-directory: private-source
        run: pnpm check:edge

      - name: Local Supabase migrations and SQL contracts
        id: supabase_local
        continue-on-error: true
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          pnpm exec supabase start
          pnpm exec supabase db reset --local --no-seed

          # Prove the stack is healthy without printing status env, which also
          # contains local JWT keys that need not appear in a public log.
          pnpm exec supabase status >/dev/null
          db_url='postgresql://postgres:postgres@127.0.0.1:54322/postgres'

          shopt -s nullglob
          sql_tests=(supabase/tests/*.sql)
          if (( ${#sql_tests[@]} == 0 )); then
            echo 'No Supabase SQL tests found.' >&2
            exit 1
          fi

          pgtap_tests=()
          contract_tests=()
          for test_file in "${sql_tests[@]}"; do
            if grep -Eiq 'select[[:space:]]+plan[[:space:]]*\(' "$test_file"; then
              pgtap_tests+=("$test_file")
            else
              contract_tests+=("$test_file")
            fi
          done

          if (( ${#pgtap_tests[@]} > 0 )); then
            echo "Running ${#pgtap_tests[@]} pgTAP test file(s) through Supabase pg_prove."
            pnpm exec supabase test db "${pgtap_tests[@]}" --local
          fi

          for test_file in "${contract_tests[@]}"; do
            echo "Running SQL invariant contract: $(basename "$test_file")"
            psql "$db_url" -X -v ON_ERROR_STOP=1 -f "$test_file" >/dev/null
          done

      - name: Stop local Supabase and delete volumes
        if: always()
        working-directory: private-source
        shell: bash
        run: pnpm exec supabase stop --no-backup || true

      - name: Static Pages build and artifact audits
        id: build_pages
        continue-on-error: true
        working-directory: private-source
        run: pnpm build:pages

      - name: Install Playwright release browsers
        id: playwright_install
        if: always()
        continue-on-error: true
        working-directory: private-source
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Credential-free PWA browser smoke
        id: browser_smoke
        if: always()
        continue-on-error: true
        working-directory: private-source
        run: pnpm test:e2e:smoke

      - name: Aggregate Receitas gate results
        if: always()
        shell: bash
        env:
          LOCKFILE_STATE: ${{ steps.install.outputs.lockfile }}
          RELEASE_SCRIPTS: ${{ steps.release_scripts.outcome }}
          SOURCE_AUDITS: ${{ steps.source_audits.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          UNIT: ${{ steps.unit.outcome }}
          DENO_TESTS: ${{ steps.deno_tests.outcome }}
          DENO_CHECK: ${{ steps.deno_check.outcome }}
          SUPABASE_LOCAL: ${{ steps.supabase_local.outcome }}
          BUILD_PAGES: ${{ steps.build_pages.outcome }}
          PLAYWRIGHT_INSTALL: ${{ steps.playwright_install.outcome }}
          BROWSER_SMOKE: ${{ steps.browser_smoke.outcome }}
        run: |
          set -euo pipefail
          failures=()
          [[ "$RELEASE_SCRIPTS" == 'success' ]] || failures+=('release script tests')
          [[ "$SOURCE_AUDITS" == 'success' ]] || failures+=('source security audits')
          [[ "$LINT" == 'success' ]] || failures+=('eslint')
          [[ "$TYPECHECK" == 'success' ]] || failures+=('typescript')
          [[ "$UNIT" == 'success' ]] || failures+=('unit tests')
          [[ "$DENO_TESTS" == 'success' ]] || failures+=('Deno Edge Function tests')
          [[ "$DENO_CHECK" == 'success' ]] || failures+=('Deno Edge Function typecheck')
          [[ "$SUPABASE_LOCAL" == 'success' ]] || failures+=('local Supabase migrations and SQL contracts')
          [[ "$BUILD_PAGES" == 'success' ]] || failures+=('static Pages build and artifact audits')
          [[ "$PLAYWRIGHT_INSTALL" == 'success' ]] || failures+=('Playwright browser installation')
          [[ "$BROWSER_SMOKE" == 'success' ]] || failures+=('credential-free PWA browser smoke')
          [[ "$LOCKFILE_STATE" == 'present' ]] || failures+=('reproducible lockfile')
          if (( ${#failures[@]} > 0 )); then
            printf 'Receitas CI failed gates:' >&2
            printf ' %s;' "${failures[@]}" >&2
            printf '\n' >&2
            exit 1
          fi
          echo 'All credential-free Receitas repository gates passed.'

      - name: Remove private checkout and request copy
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$GITHUB_WORKSPACE/request-source"

      - name: Summarize sanitized result
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
          LOCKFILE_STATE: ${{ steps.install.outputs.lockfile }}
          RECEITAS_REVISION: ${{ steps.source_attestation.outputs.revision }}
          EDGE_TEST_COUNT: ${{ steps.source_attestation.outputs.edge_test_count }}
          EDGE_MANIFEST_SHA: ${{ steps.source_attestation.outputs.edge_manifest_sha }}
        run: |
          {
            echo '## Receitas public-runner CI'
            echo
            echo "- Result: \`$RESULT\`"
            echo "- Receitas revision: \`${RECEITAS_REVISION:-unknown}\`"
            echo "- Edge test modules discovered: \`${EDGE_TEST_COUNT:-unknown}\`"
            echo "- Edge test manifest SHA-256: \`${EDGE_MANIFEST_SHA:-unknown}\`"
            echo "- Reproducible lockfile at checkout: \`${LOCKFILE_STATE:-unknown}\`"
            echo '- Lint, typecheck, unit tests, Edge Function Deno tests/typecheck, local Supabase migration/pgTAP/contracts, release-script/source audits, static Pages build and credential-free Playwright PWA smoke were attempted as independent steps.'
            echo '- No remote Supabase/PowerSync/authenticated-E2E/deploy credentials were provided to this public runner.'
            echo '- Build outputs, local database volumes, browser traces and private source were discarded; no artifact was uploaded.'
          } >> "$GITHUB_STEP_SUMMARY"
