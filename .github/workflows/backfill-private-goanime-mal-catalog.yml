name: Backfill private GoAnime MAL catalog

on:
  push:
    branches: [main]
    paths:
      - 'triggers/private-goanime-mal-backfill.json'

permissions:
  contents: read

concurrency:
  group: private-goanime-mal-backfill
  cancel-in-progress: false

jobs:
  backfill:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read exact private source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-mal-backfill.json"
          sha="$(python3 - "$request" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          sha = str(payload.get('ref') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('ref must be an exact 40-character commit SHA')
          print(sha)
          PY
          )"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Require read-only private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || { echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2; exit 1; }

      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify source and capture baseline
        id: baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          test "$resolved" = '${{ steps.request.outputs.ref }}'
          work="$RUNNER_TEMP/goanime-mal-backfill"
          mkdir -p "$work/baseline"
          cp assets/data/mal_availability_map.json "$work/baseline/mal_availability_map.json"
          cp assets/data/mal_availability_unmatched.json "$work/baseline/mal_availability_unmatched.json"
          cp assets/data/anime_metadata_seed.json "$work/baseline/anime_metadata_seed.json"
          cp assets/data/franchise_availability_map.json "$work/baseline/franchise_availability_map.json"
          python3 - "$work/baseline/stats.json" <<'PY'
          import json, sys
          from pathlib import Path
          def read(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          available = read('assets/data/available_animes.json')
          mal = read('assets/data/mal_availability_map.json')
          unmatched = read('assets/data/mal_availability_unmatched.json')
          metadata = read('assets/data/anime_metadata_seed.json')
          franchises = read('assets/data/franchise_availability_map.json')
          matched = {title for entry in mal.get('entries') or [] for title in (entry.get('matchedAvailableTitles') or []) if isinstance(title, str)}
          terminal_unmatched = {entry.get('normalizedTitle') for entry in unmatched.get('entries') or [] if isinstance(entry, dict) and entry.get('reason') != 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          stats = {
              'available_titles': len(available),
              'mal_entries': len(mal.get('entries') or []),
              'matched_titles': len(matched),
              'terminal_unmatched_titles': len(terminal_unmatched),
              'rich_metadata_entries': len(metadata.get('entries') or []),
              'franchise_index_entries': len(franchises.get('index') or []),
              'mal_generated_at': mal.get('generatedAt'),
          }
          Path(sys.argv[1]).write_text(json.dumps(stats, indent=2, sort_keys=True)+'\n', encoding='utf-8')
          print('baseline', stats)
          PY
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Report pending MAL backlog
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          available = set(json.loads(Path('assets/data/available_animes.json').read_text(encoding='utf-8')))
          mal = json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          unmatched = json.loads(Path('assets/data/mal_availability_unmatched.json').read_text(encoding='utf-8'))
          matched = {title for entry in mal.get('entries') or [] for title in (entry.get('matchedAvailableTitles') or []) if isinstance(title, str)}
          terminal = {entry.get('normalizedTitle') for entry in unmatched.get('entries') or [] if isinstance(entry, dict) and entry.get('reason') != 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          processed = (matched | terminal) & available
          print(f'available={len(available)} matched_titles={len(matched & available)} terminal_unmatched={len(terminal & available)} pending={len(available - processed)}')
          PY

      - name: Backfill every unprocessed provider title into strict MAL identities
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/build_mal_availability_cache_checkpointed.dart --incremental

      - name: Rebuild rich metadata from the updated strict MAL map
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/build_anime_metadata_seed.dart
          cp dist/anime_metadata_cache/anime_metadata_seed.json assets/data/anime_metadata_seed.json
          cp dist/anime_metadata_cache/broadcast_schedule.json assets/data/broadcast_schedule.json
          sha256sum assets/data/anime_metadata_seed.json | awk '{print $1}' > assets/data/anime_metadata_seed.json.sha256

      - name: Capture MAL IDs missing from the franchise cache
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['WORK'])
          mal = json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          franchises = json.loads(Path('assets/data/franchise_availability_map.json').read_text(encoding='utf-8'))
          mal_ids = {entry.get('malId') for entry in mal.get('entries') or [] if isinstance(entry, dict) and isinstance(entry.get('malId'), int)}
          indexed_ids = {entry.get('malId') for entry in franchises.get('index') or [] if isinstance(entry, dict) and isinstance(entry.get('malId'), int)}
          missing = sorted(mal_ids - indexed_ids)
          (work / 'missing_franchise_ids.txt').write_text(
              ''.join(f'{mal_id}\n' for mal_id in missing),
              encoding='utf-8',
          )
          print(f'MAL IDs={len(mal_ids)} franchise-indexed={len(indexed_ids)} missing={len(missing)}')
          PY

      - name: Rebuild title availability database
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          dart run tools/build_title_availability_database.dart
          if [ -s "$WORK/missing_franchise_ids.txt" ]; then
            args=()
            while IFS= read -r id; do
              [ -n "$id" ] && args+=("--mal-id=$id")
            done < "$WORK/missing_franchise_ids.txt"
            dart run tools/build_franchise_availability_cache.dart "${args[@]}"
          else
            echo 'No MAL IDs missing from the franchise cache.'
          fi
          dart run tools/build_franchise_runtime_artifacts.dart

      - name: Validate backfill and metadata coverage
        id: validate
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sqlite3
          from pathlib import Path
          work = Path(os.environ['WORK'])
          baseline = json.loads((work/'baseline/stats.json').read_text(encoding='utf-8'))
          def read(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          available = read('assets/data/available_animes.json')
          modes = read('assets/data/available_anime_modes.json')
          mal_doc = read('assets/data/mal_availability_map.json')
          unmatched_doc = read('assets/data/mal_availability_unmatched.json')
          metadata_doc = read('assets/data/anime_metadata_seed.json')
          franchise_doc = read('assets/data/franchise_availability_map.json')
          mal = mal_doc.get('entries') or []
          unmatched = unmatched_doc.get('entries') or []
          metadata = metadata_doc.get('entries') or []
          franchise_index = franchise_doc.get('index') or []
          source = set(available)
          matched = {title for entry in mal for title in (entry.get('matchedAvailableTitles') or []) if isinstance(title, str)}
          terminal = {entry.get('normalizedTitle') for entry in unmatched if isinstance(entry, dict) and entry.get('reason') != 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          retryable = {entry.get('normalizedTitle') for entry in unmatched if isinstance(entry, dict) and entry.get('reason') == 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          pending = source - matched - terminal
          if retryable & source:
              raise SystemExit(f'{len(retryable & source)} transient Jikan errors remain')
          if pending:
              raise SystemExit(f'{len(pending)} provider titles still lack a terminal MAL mapping decision')
          if len(mal) < baseline['mal_entries']:
              raise SystemExit(f'MAL entries regressed: {len(mal)} < {baseline["mal_entries"]}')
          if len(metadata) < baseline['rich_metadata_entries']:
              raise SystemExit(f'Rich metadata regressed: {len(metadata)} < {baseline["rich_metadata_entries"]}')
          if len(franchise_index) < baseline['franchise_index_entries']:
              raise SystemExit(f'Franchise index regressed: {len(franchise_index)} < {baseline["franchise_index_entries"]}')
          mal_ids = {int(entry['malId']) for entry in mal if isinstance(entry, dict) and isinstance(entry.get('malId'), int)}
          metadata_ids = {int(entry['malId']) for entry in metadata if isinstance(entry, dict) and isinstance(entry.get('malId'), int)}
          rich_coverage = len(mal_ids & metadata_ids) / len(mal_ids) if mal_ids else 0.0
          if rich_coverage < 0.90:
              raise SystemExit(f'Rich metadata coverage below 90%: {rich_coverage:.3%}')
          digest = hashlib.sha256(Path('assets/data/anime_metadata_seed.json').read_bytes()).hexdigest()
          expected = Path('assets/data/anime_metadata_seed.json.sha256').read_text(encoding='utf-8').strip().lower()
          if digest != expected:
              raise SystemExit('Bundled metadata SHA-256 does not match rebuilt seed')
          db = sqlite3.connect('assets/data/title_availability.db')
          try:
              db_titles = db.execute('select count(*) from title_availability').fetchone()[0]
          finally:
              db.close()
          if db_titles < len(source):
              raise SystemExit(f'Title availability DB incomplete: {db_titles} < {len(source)}')
          stats = {
              'available_titles': len(source),
              'mal_entries': len(mal),
              'matched_provider_titles': len(matched & source),
              'terminal_unmatched_titles': len(terminal & source),
              'rich_metadata_entries': len(metadata),
              'rich_mal_coverage': round(rich_coverage, 6),
              'title_db_rows': db_titles,
              'franchise_index_entries': len(franchise_index),
              'mal_generated_at': mal_doc.get('generatedAt'),
              'metadata_generated_at': metadata_doc.get('generatedAt'),
          }
          Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8').write(
              'stats=' + json.dumps(stats, separators=(',', ':')) + '\n'
          )
          print('validated', json.dumps(stats, indent=2, sort_keys=True))
          PY

      - name: Run focused regression gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed tools/build_mal_availability_cache_checkpointed.dart tools/build_anime_metadata_seed.dart
          flutter analyze --no-pub
          flutter test --no-pub \
            test/tools/build_mal_availability_cache_checkpointed_test.dart \
            test/tools/build_anime_metadata_seed_catalog_sources_test.dart \
            test/tools/build_franchise_availability_cache_test.dart \
            test/tools/build_franchise_runtime_artifacts_test.dart

      - name: Commit refreshed bridge and metadata back to private main
        working-directory: private-source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WRITE_TOKEN" || { echo 'GOANIME_CATALOG_WRITE_TOKEN is required for the backfill.' >&2; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/mal_availability_map.json \
            assets/data/mal_availability_unmatched.json \
            assets/data/anime_metadata_seed.json \
            assets/data/anime_metadata_seed.json.sha256 \
            assets/data/broadcast_schedule.json \
            assets/data/title_availability.db \
            assets/data/franchise_availability_map.json \
            assets/data/franchise_index.json \
            assets/data/franchise_availability.db \
            assets/data/franchise_availability.db.sha256
          if git diff --cached --quiet; then
            echo 'No catalog bridge changes to commit.'
            exit 0
          fi
          git commit -m 'chore(catalog): backfill provider titles into MAL metadata'
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          extraheader="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$extraheader" fetch origin main
          if [ "$(git rev-parse origin/main)" != '${{ steps.request.outputs.ref }}' ]; then
            git rebase origin/main
          fi
          git -c http.https://github.com/.extraheader="$extraheader" push origin HEAD:main
          unset auth extraheader WRITE_TOKEN

      - name: Summary
        if: always()
        shell: bash
        env:
          STATS: ${{ steps.validate.outputs.stats }}
        run: |
          echo '## GoAnime MAL catalog backfill' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ref: \`${{ steps.request.outputs.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$STATS" ]; then
            echo "- Validated stats: \`$STATS\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Matching thresholds were not relaxed; only previously unprocessed provider titles were evaluated.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private source and transient data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$GITHUB_WORKSPACE/trusted-source"
          rm -rf "$RUNNER_TEMP/goanime-mal-backfill"
