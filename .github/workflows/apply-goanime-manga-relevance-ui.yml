name: Apply GoAnime manga relevance UI

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-relevance-ui/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-manga-relevance-ui
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: true

      - name: Resolve exact revision
        id: request
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-relevance-ui/*.request' | head -n1)"
          test -n "$request"
          read -r project branch sha < "$request"
          test "$project" = goanime
          test "$branch" = codex/manga-parity-20260823
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Require requested SHA to still be branch head
        working-directory: private-source
        shell: bash
        env:
          BRANCH: ${{ steps.request.outputs.branch }}
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
          test "$(git rev-parse "origin/$BRANCH")" = "$REQUESTED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Apply relevance presentation and type hardening
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/screens/manga/manga_home_screen.dart')
          text = home.read_text(encoding='utf-8')

          replacements = [
              (
                  """    final rawBannerCandidates = snapshot.newChapters.length >= 2\n        ? snapshot.newChapters\n        : (snapshot.availableCatalog.length >= 3\n              ? snapshot.availableCatalog\n              : <MangaBrowseItem>[]);""",
                  """    final rawBannerCandidates = snapshot.featured.isNotEmpty\n        ? snapshot.featured\n        : (snapshot.newChapters.length >= 2\n              ? snapshot.newChapters\n              : (snapshot.availableCatalog.length >= 3\n                    ? snapshot.availableCatalog\n                    : <MangaBrowseItem>[]));""",
              ),
              (
                  """    final availableCatalog = snapshot.availableCatalog\n        .where(\n          (item) =>\n              MangaContentFilter.isSafeForGeneralAudience(item.metadata.genres),\n        )\n        .toList();""",
                  """    final availableCatalog = snapshot.availableCatalog\n        .where(\n          (item) =>\n              MangaContentFilter.isSafeForGeneralAudience(item.metadata.genres),\n        )\n        .toList();\n    List<MangaBrowseItem> safeRanking(List<MangaBrowseItem> items) => items\n        .where(\n          (item) =>\n              MangaContentFilter.isSafeForGeneralAudience(item.metadata.genres),\n        )\n        .toList(growable: false);\n    final popularItems = safeRanking(snapshot.popular);\n    final topRatedItems = safeRanking(snapshot.topRated);\n    final trendingMangaItems = safeRanking(snapshot.trendingManga);\n    final trendingManhwaItems = safeRanking(snapshot.trendingManhwa);\n    final trendingManhuaItems = safeRanking(snapshot.trendingManhua);\n    final isPortuguese = Localizations.localeOf(context).languageCode == 'pt';""",
              ),
              (
                  """              // 2. Novos Capítulos\n              if (newChapters.isNotEmpty)""",
                  """              // 2. Popularidade e relevância externa, sempre cruzadas\n              // com o catálogo realmente legível do GoAnime.\n              if (popularItems.isNotEmpty)\n                _buildModernSection(\n                  context,\n                  title: 'Popular',\n                  icon: LucideIcons.flame,\n                  gradient: const LinearGradient(\n                    colors: [Color(0xFFFF6B6B), Color(0xFFFFA500)],\n                  ),\n                  items: popularItems,\n                ),\n              if (trendingManhwaItems.isNotEmpty)\n                _buildModernSection(\n                  context,\n                  title: isPortuguese ? 'Manhwas em alta' : 'Trending manhwa',\n                  icon: Ionicons.trending_up_outline,\n                  gradient: const LinearGradient(\n                    colors: [Color(0xFF7F7FD5), Color(0xFF86A8E7)],\n                  ),\n                  items: trendingManhwaItems,\n                ),\n              if (trendingMangaItems.isNotEmpty)\n                _buildModernSection(\n                  context,\n                  title: isPortuguese ? 'Mangás em alta' : 'Trending manga',\n                  icon: Icons.auto_stories_rounded,\n                  gradient: const LinearGradient(\n                    colors: [Color(0xFF11998E), Color(0xFF38EF7D)],\n                  ),\n                  items: trendingMangaItems,\n                ),\n              if (trendingManhuaItems.isNotEmpty)\n                _buildModernSection(\n                  context,\n                  title: isPortuguese ? 'Manhuas em alta' : 'Trending manhua',\n                  icon: Icons.public_rounded,\n                  gradient: const LinearGradient(\n                    colors: [Color(0xFFFF9966), Color(0xFFFF5E62)],\n                  ),\n                  items: trendingManhuaItems,\n                ),\n              if (topRatedItems.isNotEmpty)\n                _buildModernSection(\n                  context,\n                  title: isPortuguese ? 'Mais bem avaliados' : 'Top rated',\n                  icon: Icons.star_rounded,\n                  gradient: const LinearGradient(\n                    colors: [Color(0xFFF7971E), Color(0xFFFFD200)],\n                  ),\n                  items: topRatedItems,\n                ),\n\n              // 3. Novos Capítulos\n              if (newChapters.isNotEmpty)""",
              ),
              (
                  "badge: isPortuguese ? 'Destaque Mangá' : 'Featured Manga',",
                  "badge: isPortuguese ? 'Em alta' : 'Trending',",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'home replacement expected once, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          home.write_text(text, encoding='utf-8')

          relevance = Path('lib/services/manga/metadata/manga_relevance_service.dart')
          text = relevance.read_text(encoding='utf-8')
          hardening = [
              (
                  """      final scoreSignal = ((match.entry.averageScore ?? 0) / 100).clamp(0.0, 1.0);""",
                  """      final scoreSignal = ((match.entry.averageScore ?? 0) / 100)\n          .clamp(0.0, 1.0)\n          .toDouble();""",
              ),
              (
                  """      final sourceSignal = (match.item.availability.sourceLinks.length / 4).clamp(0.0, 1.0);""",
                  """      final sourceSignal =\n          (match.item.availability.sourceLinks.length / 4)\n              .clamp(0.0, 1.0)\n              .toDouble();""",
              ),
          ]
          for old, new in hardening:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'relevance replacement expected once, got {count}')
              text = text.replace(old, new, 1)
          relevance.write_text(text, encoding='utf-8')
          PY

      - name: Format changed relevance surface
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/screens/manga/manga_home_screen.dart \
            lib/services/manga/manga_browse_data_source.dart \
            lib/services/manga/manga_repository_browse_data_source.dart \
            lib/services/manga/manga_platform_runtime.dart \
            lib/services/manga/metadata/manga_relevance_service.dart \
            test/services/manga/metadata/manga_relevance_service_test.dart \
            test/widgets/manga/manga_home_relevance_test.dart
          dart format --output=none --set-exit-if-changed \
            lib/screens/manga/manga_home_screen.dart \
            lib/services/manga/manga_browse_data_source.dart \
            lib/services/manga/manga_repository_browse_data_source.dart \
            lib/services/manga/manga_platform_runtime.dart \
            lib/services/manga/metadata/manga_relevance_service.dart \
            test/services/manga/metadata/manga_relevance_service_test.dart \
            test/widgets/manga/manga_home_relevance_test.dart
          git diff --check

      - name: Analyze relevance surface
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/screens/manga/manga_home_screen.dart \
            lib/services/manga/manga_browse_data_source.dart \
            lib/services/manga/manga_repository_browse_data_source.dart \
            lib/services/manga/manga_platform_runtime.dart \
            lib/services/manga/metadata/manga_relevance_service.dart \
            test/services/manga/metadata/manga_relevance_service_test.dart \
            test/widgets/manga/manga_home_relevance_test.dart

      - name: Run focused relevance tests
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub --concurrency=1 \
            test/services/manga/metadata/manga_relevance_service_test.dart \
            test/widgets/manga/manga_home_relevance_test.dart \
            test/widgets/manga/manga_home_screen_test.dart \
            test/widgets/manga/manga_home_refresh_resilience_test.dart

      - name: Publish validated private change
        id: publish
        working-directory: private-source
        shell: bash
        env:
          BRANCH: ${{ steps.request.outputs.branch }}
          REQUESTED_SHA: ${{ steps.request.outputs.sha }}
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH" --quiet
          test "$(git rev-parse "origin/$BRANCH")" = "$REQUESTED_SHA"
          test -n "$(git status --porcelain)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            lib/screens/manga/manga_home_screen.dart \
            lib/services/manga/manga_browse_data_source.dart \
            lib/services/manga/manga_repository_browse_data_source.dart \
            lib/services/manga/manga_platform_runtime.dart \
            lib/services/manga/metadata/manga_relevance_service.dart \
            test/services/manga/metadata/manga_relevance_service_test.dart \
            test/widgets/manga/manga_home_relevance_test.dart
          git commit -m 'feat(manga): surface relevance-ranked home'
          git push origin HEAD:"$BRANCH"
          echo "new_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record sanitized result
        if: always()
        working-directory: control
        shell: bash
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
          STATE: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p results/goanime-manga-relevance-ui
          jq -n \
            --arg reviewedSha "$REVIEWED_SHA" \
            --arg newSha "${NEW_SHA:-}" \
            --arg state "$STATE" \
            --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,reviewedSha:$reviewedSha,newSha:$newSha,state:$state,runId:$runId}' \
            > "results/goanime-manga-relevance-ui/$REVIEWED_SHA.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "results/goanime-manga-relevance-ui/$REVIEWED_SHA.json"
          git commit -m "ci(result): record manga relevance UI ${REVIEWED_SHA:0:8}" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
