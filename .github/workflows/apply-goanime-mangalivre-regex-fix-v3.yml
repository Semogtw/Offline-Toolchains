name: Apply GoAnime MangaLivre regex fix v3

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangalivre-regex-fix-v3/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-mangalivre-regex-fix-v3
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve current exact GoAnime branch head
        id: request
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangalivre-regex-fix-v3/*.request' | head -n1)"
          test -n "$request"
          read -r project branch < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'codex/manga-parity-20260823'
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          sha="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$branch" | awk '{print $1}')"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Correct only reviewed raw regex lines
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/manga/providers/mangalivre_org_manga_provider.dart')
          lines = path.read_text().splitlines()
          in_nonce_regex_block = False
          changed = 0
          for index, line in enumerate(lines):
              if 'static final RegExp _nonceVariableRegex' in line:
                  in_nonce_regex_block = True
                  continue
              if 'static final RegExp _nonceShapeRegex' in line:
                  break
              if in_nonce_regex_block and "r'''" in line:
                  replacement = line.replace(chr(92) * 2, chr(92))
                  replacement = replacement.replace(chr(92) + '"', '"')
                  if replacement != line:
                      lines[index] = replacement
                      changed += 1
          if changed == 0:
              raise SystemExit('reviewed regex block is already normalized')
          if changed != 4:
              raise SystemExit(f'expected exactly 4 reviewed raw regex lines, changed={changed}')
          path.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Format and validate repair
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/services/manga/providers/mangalivre_org_manga_provider.dart test/services/manga/providers/mangalivre_org_manga_provider_test.dart >/dev/null
          flutter test --no-pub --concurrency=1 \
            test/services/manga/providers/mangalivre_org_manga_provider_test.dart \
            test/services/manga/providers/little_tyrant_manga_provider_test.dart \
            test/services/manga/providers/kivaratoons_manga_provider_test.dart
          flutter test --no-pub --concurrency=1 \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_provider_manifest_validator_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart
          flutter analyze --no-pub
          git diff --check

      - name: Refuse final branch race, commit and push
        id: publish
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/manga/providers/mangalivre_org_manga_provider.dart test/services/manga/providers/mangalivre_org_manga_provider_test.dart
          git commit -m 'fix(manga): correct MangaLivre nonce parser escaping'
          new_sha="$(git rev-parse HEAD)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          printf 'old_sha=%s\nnew_sha=%s\n' "$EXPECTED_SHA" "$new_sha" >> "$GITHUB_OUTPUT"

      - name: Publish receipt
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          OLD_SHA: ${{ steps.publish.outputs.old_sha }}
          NEW_SHA: ${{ steps.publish.outputs.new_sha }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(jq -cn --arg oldSha "$OLD_SHA" --arg newSha "$NEW_SHA" --arg controlSha "$CONTROL_SHA" '{schemaVersion:1,state:"success",oldSha:$oldSha,newSha:$newSha,controlSha:$controlSha,providerGreen:true}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-mangalivre-regex-fix-v3/$OLD_SHA.json" \
            -f message="ci(result): record MangaLivre regex fix v3 $OLD_SHA" \
            -f content="$encoded" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
