name: Patch Fichário source gate v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-fichario-source-gate-v2.yml

permissions:
  contents: write
  issues: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Add offline source gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-fichario.yml')
          source = path.read_text()
          old = '''          pnpm --dir "$smoke" verify
          pnpm --dir "$smoke" test:e2e
          pnpm --dir "$smoke" test:functions:check
'''
          new = '''          pnpm --dir "$smoke" verify
          pnpm --dir "$smoke" test:source:offline
          pnpm --dir "$smoke" test:e2e
          pnpm --dir "$smoke" test:functions:check
'''
          if source.count(old) != 1:
              raise SystemExit('expected verification block exactly once')
          path.write_text(source.replace(old, new))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-fichario.yml
          git commit -m 'ci: verify Fichário source gates in offline bundle'
          git push origin HEAD:main
      - name: Publish receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title='[CI] Fichário source-gate patch'
          body="Status: success
          Run ID: $GITHUB_RUN_ID
          Commit: $(git rev-parse HEAD)"
          issue_number="$(gh issue list --state all --limit 100 --json number,title --jq '.[] | select(.title == "[CI] Fichário source-gate patch") | .number' | head -n 1)"
          if [ -z "$issue_number" ]; then
            gh issue create --title "$title" --body "$body"
          else
            gh issue edit "$issue_number" --body "$body"
          fi
