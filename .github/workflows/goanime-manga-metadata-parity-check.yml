name: GoAnime Manga Metadata Parity Check

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/goanime-manga-metadata-parity-check.yml

permissions:
  contents: read

concurrency:
  group: goanime-manga-metadata-parity-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        shell: bash
        env:
          GOANIME_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$GOANIME_TOKEN"

      - name: Checkout GoAnime metadata branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/goanime-mobile
          ref: agent/manga-metadata-catalog-parity-20260908
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          persist-credentials: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Check metadata formatting
        run: >-
          dart format --output=none --set-exit-if-changed
          tools/manga/manga_jikan_bulk_enricher.dart
          tools/manga/manga_anilist_bulk_enricher.dart
          tools/manga/manga_metadata_merger.dart
          tools/manga/manga_metadata_catalog_targets.dart
          tools/manga/manga_metadata_cache.dart
          tools/manga/manga_metadata_refresh.dart
          test/tools/manga_jikan_bulk_enricher_test.dart
          test/tools/manga_anilist_bulk_enricher_test.dart
          test/tools/manga_metadata_merger_test.dart
          test/tools/manga_metadata_catalog_targets_test.dart
          test/tools/manga_metadata_cache_test.dart
          test/tools/manga_metadata_refresh_test.dart

      - name: Analyze metadata scope
        run: >-
          flutter analyze
          tools/manga/manga_jikan_bulk_enricher.dart
          tools/manga/manga_anilist_bulk_enricher.dart
          tools/manga/manga_metadata_merger.dart
          tools/manga/manga_metadata_catalog_targets.dart
          tools/manga/manga_metadata_cache.dart
          tools/manga/manga_metadata_refresh.dart
          test/tools/manga_jikan_bulk_enricher_test.dart
          test/tools/manga_anilist_bulk_enricher_test.dart
          test/tools/manga_metadata_merger_test.dart
          test/tools/manga_metadata_catalog_targets_test.dart
          test/tools/manga_metadata_cache_test.dart
          test/tools/manga_metadata_refresh_test.dart

      - name: Run Jikan metadata GREEN tests
        run: flutter test test/tools/manga_jikan_bulk_enricher_test.dart

      - name: Run AniList metadata GREEN tests
        run: flutter test test/tools/manga_anilist_bulk_enricher_test.dart

      - name: Run metadata merger GREEN tests
        run: flutter test test/tools/manga_metadata_merger_test.dart

      - name: Run metadata target GREEN tests
        run: flutter test test/tools/manga_metadata_catalog_targets_test.dart

      - name: Run metadata cache GREEN tests
        run: flutter test test/tools/manga_metadata_cache_test.dart

      - name: Run metadata refresh GREEN tests
        run: flutter test test/tools/manga_metadata_refresh_test.dart
