name: GoAnime Manga Provider Report Format Fix

on:
  push:
    paths:
      - '.github/workflows/goanime-manga-provider-report-format-fix.yml'

permissions:
  contents: read

jobs:
  format-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private write credential
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$WRITE_TOKEN"

      - name: Checkout GoAnime provider-report branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/manga-catalog-canonicalization-v2-20260906
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply Dart formatting
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            tools/manga/build_global_manga_availability.dart \
            test/tools/manga_provider_availability_receipt_test.dart
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            tools/manga/build_global_manga_availability.dart \
            test/tools/manga_provider_availability_receipt_test.dart
          git commit -m 'style(manga): format provider readability report'
          git push origin HEAD:feat/manga-catalog-canonicalization-v2-20260906
