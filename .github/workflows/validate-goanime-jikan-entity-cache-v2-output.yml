name: Validate GoAnime Jikan entity cache v2 output

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-jikan-entity-cache-v2-output/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-jikan-entity-cache-v2-output
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-jikan-entity-cache-v2-output/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Validate patcher
        working-directory: trusted-source
        run: python3 -m py_compile scripts/prepare-goanime-jikan-entity-cache.py

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply Jikan cache patch
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-source/scripts/prepare-goanime-jikan-entity-cache.py --root private-source
          python3 - <<'PY'
          from pathlib import Path
          path = Path('private-source/lib/services/jikan_service.dart')
          text = path.read_text()
          replacements = {
            '        _animeByIdInFlight.remove(malId);\n': '        final removed = _animeByIdInFlight.remove(malId);\n        if (removed != null && !identical(removed, load)) {\n          _animeByIdInFlight[malId] = removed;\n        }\n',
            '        _animeRelationsInFlight.remove(malId);\n': '        final removed = _animeRelationsInFlight.remove(malId);\n        if (removed != null && !identical(removed, load)) {\n          _animeRelationsInFlight[malId] = removed;\n        }\n',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'expected one target, found {text.count(old)} for {old.strip()}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve, format and validate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          dart format lib/services/jikan_service.dart test/services/jikan_entity_cache_test.dart
          git -c core.whitespace=cr-at-eol diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 \
            test/services/jikan_entity_cache_test.dart \
            test/services/runtime_home_catalog_resilience_test.dart
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          lib/services/jikan_service.dart
          test/services/jikan_entity_cache_test.dart
          EOF
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Publish validated outputs
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="generated/goanime-jikan-entity-cache-v2-output/$TARGET_SHA"
          put_content() {
            local destination="$1" source="$2" current encoded
            encoded="$(base64 -w0 "$source")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$destination?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$destination" -f message='ci(goanime): publish validated Jikan entity cache v2 output' -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            gh api "${args[@]}" >/dev/null
          }
          put_content "$prefix/lib/services/jikan_service.dart" private-source/lib/services/jikan_service.dart
          put_content "$prefix/test/services/jikan_entity_cache_test.dart" private-source/test/services/jikan_entity_cache_test.dart
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Record status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          OUTPUT_PREFIX: ${{ steps.publish.outputs.prefix }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'status': os.environ['GATE_STATUS'], 'targetSha': os.environ.get('TARGET_SHA') or None, 'outputPrefix': os.environ.get('OUTPUT_PREFIX') or None, 'runId': os.environ.get('GITHUB_RUN_ID')}, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='status/goanime-jikan-entity-cache-v2-output.json'
          for attempt in 1 2 3 4 5; do
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='ci(goanime): record Jikan entity cache v2 output status' -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            if gh api "${args[@]}" >/dev/null 2>&1; then exit 0; fi
            sleep "$attempt"
          done
          exit 1

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
