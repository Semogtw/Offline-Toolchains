name: Report GoAnime Home formatter runs

on:
  workflow_run:
    workflows: ['Format private GoAnime Home tests']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Record completed formatter run
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const jobs = jobsResponse.data.jobs.map(j => ({
              id: j.id,
              name: j.name,
              status: j.status,
              conclusion: j.conclusion,
              steps: (j.steps || []).map(s => ({
                name: s.name,
                status: s.status,
                conclusion: s.conclusion,
                number: s.number
              }))
            }));
            const report = {
              schema_version: 1,
              run_id: run.id,
              status: run.status,
              conclusion: run.conclusion,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
              jobs
            };
            const path = 'reports/goanime-home-format/latest.json';
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(old.data)) sha = old.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `ci(goanime): report Home formatter ${run.id} [skip ci]`,
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
              branch: 'main',
              sha
            });
