name: Validate GoAnime Home privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-home-private/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-home-private
  cancel-in-progress: false

jobs:
  validate:
    name: Validate shared Home lifecycle
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-home-private/*.request' | head -n 1)"
          test -n "$request"
          request_line="$(cat "control/$request")"
          read -r project branch sha <<< "$request_line"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/dev/null 2>&1
          (cd packages/goanime_core && dart pub get >/dev/null 2>&1)

      - name: Analyze Home lifecycle slice
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/controllers/media \
            lib/screens/manga/manga_home_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/home_screen_data.dart \
            lib/screens/home_screen_presentation.dart \
            test/controllers/media/home_snapshot_controller_test.dart \
            test/widgets/manga/manga_home_screen_test.dart \
            test/widgets/home_cache_race_test.dart \
            test/services/runtime_home_catalog_resilience_test.dart

      - name: Run shared Home controller tests
        working-directory: private-source
        run: flutter test --no-pub test/controllers/media/home_snapshot_controller_test.dart

      - name: Run Manga Home tests
        working-directory: private-source
        run: flutter test --no-pub test/widgets/manga/manga_home_screen_test.dart

      - name: Run Anime Home cache-race tests
        working-directory: private-source
        run: flutter test --no-pub test/widgets/home_cache_race_test.dart

      - name: Run Anime Home resilience tests
        working-directory: private-source
        run: flutter test --no-pub test/services/runtime_home_catalog_resilience_test.dart

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

  report:
    name: Publish sanitized GoAnime Home result
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish sanitized GoAnime Home result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TOOLCHAINS_TRIGGER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/goanime-home-report.json"
          python3 - "$report" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          payload = {
              "schemaVersion": 1,
              "runId": int(os.environ["RUN_ID"]),
              "runAttempt": int(os.environ["RUN_ATTEMPT"]),
              "toolchainsTriggerSha": os.environ["TOOLCHAINS_TRIGGER_SHA"],
              "validateResult": os.environ["VALIDATE_RESULT"],
              "finishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          encoded="$(base64 -w0 < "$report")"
          path="reports/goanime-home-private/${RUN_ID}.json"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report Home run ${RUN_ID}" \
            -f "content=${encoded}" \
            >/dev/null
