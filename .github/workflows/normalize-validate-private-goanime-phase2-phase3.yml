name: Normalize and validate GoAnime phases 2-3

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-phase2-phase3/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-phase2-phase3
  cancel-in-progress: false

jobs:
  validate:
    name: Normalize and validate phases 2-3
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      source_sha: ${{ steps.commit.outputs.source_sha }}
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-phase2-phase3/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Normalize focused files
        working-directory: private-source
        run: |
          dart format \
            lib/services/media/provider_request_scheduler.dart \
            lib/services/media/request_single_flight.dart \
            lib/services/media/request_generation.dart \
            lib/services/media/provider_health_registry.dart \
            lib/services/source/episode_aggregator.dart \
            lib/services/source/episode_cache_repository.dart \
            lib/services/unified_source_service.dart \
            lib/services/manga/manga_request_scheduler.dart \
            lib/services/manga/manga_search_coordinator.dart \
            test/services/media/provider_request_scheduler_test.dart \
            test/services/media/provider_request_scheduler_validation_test.dart \
            test/services/media/request_single_flight_test.dart \
            test/services/media/request_generation_test.dart \
            test/services/media/provider_health_registry_test.dart \
            test/services/source/episode_aggregator_staged_pipeline_test.dart \
            test/services/source/episode_cache_repository_test.dart \
            test/services/source/episode_cache_policy_adoption_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/services/manga/manga_search_cache_policy_test.dart \
            test/architecture/shared_provider_scheduler_adoption_guard_test.dart \
            test/architecture/shared_request_primitives_adoption_guard_test.dart

      - name: Analyze phases 2-3
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            lib/services/media/provider_request_scheduler.dart \
            lib/services/media/request_single_flight.dart \
            lib/services/media/request_generation.dart \
            lib/services/media/provider_health_registry.dart \
            lib/services/source/episode_aggregator.dart \
            lib/services/source/episode_cache_repository.dart \
            lib/services/unified_source_service.dart \
            lib/services/manga/manga_request_scheduler.dart \
            lib/services/manga/manga_search_coordinator.dart \
            test/services/media/provider_request_scheduler_test.dart \
            test/services/media/provider_request_scheduler_validation_test.dart \
            test/services/media/request_single_flight_test.dart \
            test/services/media/request_generation_test.dart \
            test/services/media/provider_health_registry_test.dart \
            test/services/source/episode_aggregator_staged_pipeline_test.dart \
            test/services/source/episode_cache_repository_test.dart \
            test/services/source/episode_cache_policy_adoption_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/services/manga/manga_search_cache_policy_test.dart \
            test/architecture/shared_provider_scheduler_adoption_guard_test.dart \
            test/architecture/shared_request_primitives_adoption_guard_test.dart

      - name: Test phases 2-3
        working-directory: private-source
        run: |
          set -euo pipefail
          flutter test --no-pub test/services/media/provider_request_scheduler_test.dart
          flutter test --no-pub test/services/media/provider_request_scheduler_validation_test.dart
          flutter test --no-pub test/services/media/request_single_flight_test.dart
          flutter test --no-pub test/services/media/request_generation_test.dart
          flutter test --no-pub test/services/media/provider_health_registry_test.dart
          flutter test --no-pub test/services/source/episode_aggregator_staged_pipeline_test.dart
          flutter test --no-pub test/services/source/episode_cache_repository_test.dart
          flutter test --no-pub test/services/source/episode_cache_policy_adoption_test.dart
          flutter test --no-pub test/services/manga/manga_search_coordinator_test.dart
          flutter test --no-pub test/services/manga/manga_search_cache_policy_test.dart
          flutter test --no-pub test/architecture/shared_provider_scheduler_adoption_guard_test.dart
          flutter test --no-pub test/architecture/shared_request_primitives_adoption_guard_test.dart

      - name: Commit normalized files when needed
        id: commit
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          current="$(git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$current" = "$EXPECTED_SHA"
          if git diff --quiet; then
            echo "source_sha=$EXPECTED_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'goanime-toolchains'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            lib/services/media/provider_request_scheduler.dart \
            lib/services/media/request_single_flight.dart \
            lib/services/media/request_generation.dart \
            lib/services/media/provider_health_registry.dart \
            lib/services/source/episode_aggregator.dart \
            lib/services/source/episode_cache_repository.dart \
            lib/services/unified_source_service.dart \
            lib/services/manga/manga_request_scheduler.dart \
            lib/services/manga/manga_search_coordinator.dart \
            test/services/media/provider_request_scheduler_test.dart \
            test/services/media/provider_request_scheduler_validation_test.dart \
            test/services/media/request_single_flight_test.dart \
            test/services/media/request_generation_test.dart \
            test/services/media/provider_health_registry_test.dart \
            test/services/source/episode_aggregator_staged_pipeline_test.dart \
            test/services/source/episode_cache_repository_test.dart \
            test/services/source/episode_cache_policy_adoption_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/services/manga/manga_search_cache_policy_test.dart \
            test/architecture/shared_provider_scheduler_adoption_guard_test.dart \
            test/architecture/shared_request_primitives_adoption_guard_test.dart
          git commit -m 'style(media): normalize shared request infrastructure'
          source_sha="$(git rev-parse HEAD)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

  report:
    name: Publish sanitized phase 2-3 result
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish sanitized result
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          RUN_ID: ${{ github.run_id }}
          TOOLCHAINS_TRIGGER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'runId': int(os.environ['RUN_ID']),
            'toolchainsTriggerSha': os.environ['TOOLCHAINS_TRIGGER_SHA'],
            'validateResult': os.environ['VALIDATE_RESULT'],
            'sourceSha': os.environ.get('SOURCE_SHA') or None,
          }, indent=2, sort_keys=True))
          PY
          )"
          encoded="$(printf '%s\n' "$payload" | base64 -w0)"
          path="reports/goanime-phase2-phase3/${RUN_ID}.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report phase2-3 run ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null
