name: Apply remaining stable Ultra integration v3

on:
  push:
    branches:
      - agent/vendor-artcnn-goanime-20260830
    paths:
      - .github/workflows/apply-ultra-stable-integration-v3-20260830.yml

permissions:
  contents: read

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted patch source
        uses: actions/checkout@v6
        with:
          ref: agent/vendor-artcnn-goanime-20260830
          path: trusted
          persist-credentials: false
          sparse-checkout: |
            scripts/apply_ultra_stable_integration_20260830.py
          sparse-checkout-cone-mode: false

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime feature branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/ultra-video-enhancement-rx6600-20260830
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Apply stable Ultra integration
        shell: bash
        run: |
          set +e
          output="$(python3 trusted/scripts/apply_ultra_stable_integration_20260830.py goanime 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            expected="lib/platform/desktop/screens/desktop_video_player_screen_methods_3.dart: expected one match, found 0"
            if [ "$output" != "$expected" ]; then
              exit "$status"
            fi
            grep -Fq '_stopVideoEnhancementPerformanceMonitoring();' \
              goanime/lib/platform/desktop/screens/desktop_video_player_screen_methods_3.dart
          fi

      - name: Commit stable integration
        working-directory: goanime
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/platform/desktop/screens/desktop_video_player_screen.dart \
            lib/platform/desktop/screens/desktop_video_player_screen_methods_1.dart \
            lib/platform/desktop/screens/desktop_video_player_screen_methods_3.dart
          git diff --cached --quiet && { echo 'No stable integration diff.'; exit 0; }
          git commit -m "feat: integrate stable Ultra calibration and source treatment"
          git remote set-url origin "https://x-access-token:${PRIVATE_REPOSITORIES_TOKEN}@github.com/Semogtw/goanime-mobile.git"
          git push origin HEAD:feat/ultra-video-enhancement-rx6600-20260830
