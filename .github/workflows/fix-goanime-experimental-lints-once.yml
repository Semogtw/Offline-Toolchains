name: Fix GoAnime experimental lints once

on:
  push:
    paths:
      - '.github/workflows/fix-goanime-experimental-lints-once.yml'

permissions:
  contents: read

env:
  GOANIME_EXPECTED_SHA: 0613eeb887780f320ed0be02e285c671ba0322c3
  GOANIME_BRANCH: feat/experimental-ai-buffered-upscaling-20260830
  FLUTTER_VERSION: 3.44.1

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_EXPECTED_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Apply exact lint fixes and verify analyzer
        working-directory: goanime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOANIME_EXPECTED_SHA"
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('lib/platform/desktop/services/experimental_segment_transport.dart'): [(
                  "  StreamSubscription<HttpRequest>? _serverSubscription;\n",
                  "  // Ownership is released by close(); the lint cannot follow this nullable field lifecycle.\n  // ignore: cancel_subscriptions\n  StreamSubscription<HttpRequest>? _serverSubscription;\n",
              )],
              Path('lib/platform/desktop/services/real_cugan_segment_producer.dart'): [(
                  "  StreamSubscription<ExperimentalBackendWorkerEvent>? _backendSubscription;\n",
                  "  // Ownership is released by stop(); the lint cannot follow this nullable field lifecycle.\n  // ignore: cancel_subscriptions\n  StreamSubscription<ExperimentalBackendWorkerEvent>? _backendSubscription;\n",
              )],
              Path('lib/services/experimental_video_enhancement/experimental_enhancement_session.dart'): [(
                  "  StreamSubscription<ExperimentalProducerEvent>? _producerSubscription;\n",
                  "  // Ownership is released by _cleanupOwnedResources(); the lint cannot follow this nullable field lifecycle.\n  // ignore: cancel_subscriptions\n  StreamSubscription<ExperimentalProducerEvent>? _producerSubscription;\n",
              )],
              Path('lib/platform/desktop/services/real_cugan_vulkan_backend.dart'): [
                  (
                      "    final eventController = StreamController<ExperimentalBackendWorkerEvent>();\n",
                      "    // Ownership transfers to _ActiveRealCuganWorker and _disposeActiveWorker closes it.\n    // ignore: close_sinks\n    final eventController = StreamController<ExperimentalBackendWorkerEvent>();\n",
                  ),
                  (
                      "      if (paused != null) 'paused': paused,\n",
                      "      'paused': ?paused,\n",
                  ),
                  (
                      "  StreamSubscription<String>? eventSubscription;\n",
                      "  // Ownership is released by _disposeActiveWorker(); the lint cannot follow this field lifecycle.\n  // ignore: cancel_subscriptions\n  StreamSubscription<String>? eventSubscription;\n",
                  ),
              ],
              Path('test/platform/desktop/real_cugan_cli_precision_test.dart'): [(
                  """        final request = jsonDecode(runner.stdinJson!) as Map<String, dynamic>;\n        expect(request['profile']['precision'], 'backendDefault');\n""",
                  """        final request = jsonDecode(runner.stdinJson!) as Map<String, dynamic>;\n        final profile = request['profile'] as Map<String, dynamic>;\n        expect(profile['precision'], 'backendDefault');\n""",
              )],
              Path('test/platform/desktop/real_cugan_pro_model_mapping_test.dart'): [(
                  """      final request = jsonDecode(runner.stdinJson!) as Map<String, dynamic>;\n      expect(request['profile']['denoiseLevel'], 3);\n""",
                  """      final request = jsonDecode(runner.stdinJson!) as Map<String, dynamic>;\n      final profile = request['profile'] as Map<String, dynamic>;\n      expect(profile['denoiseLevel'], 3);\n""",
              )],
              Path('test/platform/desktop/real_cugan_vulkan_backend_test.dart'): [
                  (
                      """        final request = jsonDecode(call.stdinJson) as Map<String, dynamic>;\n        expect(request['operation'], 'benchmark');\n        expect(request['protocolVersion'], 1);\n        expect(request['source']['uri'], contains('media.example'));\n        expect(\n          request['source']['headers']['Authorization'],\n          'Bearer authorization-super-secret',\n        );\n        expect(request['benchmark']['sampleFrames'], 120);\n        expect(request['benchmark']['warmupFrames'], 24);\n        expect(request['profile']['precision'], 'fp16');\n        expect(request['profile']['scale'], 2);\n        expect(request['profile']['denoiseLevel'], -1);\n""",
                      """        final request = jsonDecode(call.stdinJson) as Map<String, dynamic>;\n        final sourcePayload = request['source'] as Map<String, dynamic>;\n        final headers = sourcePayload['headers'] as Map<String, dynamic>;\n        final benchmark = request['benchmark'] as Map<String, dynamic>;\n        final profile = request['profile'] as Map<String, dynamic>;\n        expect(request['operation'], 'benchmark');\n        expect(request['protocolVersion'], 1);\n        expect(sourcePayload['uri'], contains('media.example'));\n        expect(\n          headers['Authorization'],\n          'Bearer authorization-super-secret',\n        );\n        expect(benchmark['sampleFrames'], 120);\n        expect(benchmark['warmupFrames'], 24);\n        expect(profile['precision'], 'fp16');\n        expect(profile['scale'], 2);\n        expect(profile['denoiseLevel'], -1);\n""",
                  ),
                  (
                      """        final request = jsonDecode(call.stdinJson) as Map<String, dynamic>;\n        expect(request['output']['stagingRoot'], '/controlled/workdir/staging');\n        expect(request['output']['segmentDurationMs'], 4000);\n""",
                      """        final request = jsonDecode(call.stdinJson) as Map<String, dynamic>;\n        final output = request['output'] as Map<String, dynamic>;\n        expect(output['stagingRoot'], '/controlled/workdir/staging');\n        expect(output['segmentDurationMs'], 4000);\n""",
                  ),
              ],
              Path('tools/experimental_video/real_cugan_helper_worker.dart'): [
                  (
                      """    if (!await file.exists())\n      throw const _WorkerException('source_file_missing');\n""",
                      """    if (!await file.exists()) {\n      throw const _WorkerException('source_file_missing');\n    }\n""",
                  ),
                  (
                      """  if (configured != null && configured.trim().isNotEmpty)\n    return configured.trim();\n""",
                      """  if (configured != null && configured.trim().isNotEmpty) {\n    return configured.trim();\n  }\n""",
                  ),
              ],
          }

          worker = Path('tools/experimental_video/real_cugan_helper_worker.dart')
          text = worker.read_text()
          old = """  if (configured != null && configured.trim().isNotEmpty)\n    return configured.trim();\n"""
          new = """  if (configured != null && configured.trim().isNotEmpty) {\n    return configured.trim();\n  }\n"""
          if text.count(old) != 3:
              raise SystemExit(f'expected configured executable pattern 3 times, got {text.count(old)}')
          text = text.replace(old, new)
          worker.write_text(text)

          for file, edits in replacements.items():
              text = file.read_text()
              for old, new in edits:
                  if file == worker and old.startswith('  if (configured != null'):
                      continue
                  if text.count(old) != 1:
                      raise SystemExit(f'expected exact pattern once in {file}: {old[:60]!r}, got {text.count(old)}')
                  text = text.replace(old, new)
              file.write_text(text)
          PY

          dart format \
            lib/platform/desktop/services/experimental_segment_transport.dart \
            lib/platform/desktop/services/real_cugan_segment_producer.dart \
            lib/platform/desktop/services/real_cugan_vulkan_backend.dart \
            lib/services/experimental_video_enhancement/experimental_enhancement_session.dart \
            test/platform/desktop/real_cugan_cli_precision_test.dart \
            test/platform/desktop/real_cugan_pro_model_mapping_test.dart \
            test/platform/desktop/real_cugan_vulkan_backend_test.dart \
            tools/experimental_video/real_cugan_helper_worker.dart

          flutter analyze --no-pub

          mapfile -t changed < <(git status --porcelain | sed -E 's/^...//')
          test "${#changed[@]}" -eq 8
          allowed='^(lib/platform/desktop/services/experimental_segment_transport.dart|lib/platform/desktop/services/real_cugan_segment_producer.dart|lib/platform/desktop/services/real_cugan_vulkan_backend.dart|lib/services/experimental_video_enhancement/experimental_enhancement_session.dart|test/platform/desktop/real_cugan_cli_precision_test.dart|test/platform/desktop/real_cugan_pro_model_mapping_test.dart|test/platform/desktop/real_cugan_vulkan_backend_test.dart|tools/experimental_video/real_cugan_helper_worker.dart)$'
          for file in "${changed[@]}"; do
            [[ "$file" =~ $allowed ]] || { echo "unexpected changed path: $file" >&2; exit 1; }
          done

          git fetch --no-tags origin "refs/heads/${GOANIME_BRANCH}"
          test "$(git rev-parse FETCH_HEAD)" = "$GOANIME_EXPECTED_SHA"

          git config user.name 'GoAnime CI'
          git config user.email 'actions@users.noreply.github.com'
          git add "${changed[@]}"
          git commit -m 'chore: satisfy experimental analyzer lints'
          git push origin "HEAD:refs/heads/${GOANIME_BRANCH}"
