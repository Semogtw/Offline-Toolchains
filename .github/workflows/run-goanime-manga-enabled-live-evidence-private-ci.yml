name: Run GoAnime enabled manga live evidence privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-enabled-live-evidence/*.request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: goanime-manga-enabled-live-evidence-private-ci
  cancel-in-progress: false

jobs:
  evidence:
    name: Enabled manga live evidence
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-enabled-live-evidence/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          lfs: false
          submodules: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze enabled reader evidence surface
        id: analyze
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_http_client.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_readability_verifier.dart \
            lib/services/manga/manga_source_discovery_service.dart \
            lib/services/manga/manga_search_coordinator.dart \
            lib/services/manga/manga_content_resolver.dart \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/services/manga/manga_content_resolver_test.dart

      - name: Run enabled reader evidence tests
        id: tests
        if: always()
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/services/manga/manga_content_resolver_test.dart \
            test/services/manga/manga_search_coordinator_test.dart \
            test/architecture/manga_provider_registry_manifest_test.dart \
            test/architecture/manga_planned_provider_definitions_test.dart

      - name: Check formatting
        id: format
        if: always()
        working-directory: private-source
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/manga/manga_provider_policy.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            lib/services/manga/manga_remote_manifest_validator.dart \
            lib/services/manga/manga_readability_verifier.dart \
            lib/services/manga/manga_source_discovery_service.dart \
            lib/services/manga/manga_search_coordinator.dart \
            lib/services/manga/manga_content_resolver.dart \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart \
            test/services/manga/manga_http_stream_cancellation_test.dart \
            test/services/manga/manga_readability_verifier_test.dart \
            test/services/manga/manga_source_discovery_service_test.dart \
            test/services/manga/manga_content_resolver_test.dart

      - name: Collect enabled live evidence
        id: collect
        if: always() && steps.analyze.outcome == 'success' && steps.tests.outcome == 'success'
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/goanime-enabled-manga-evidence
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          dart run tools/manga/collect_enabled_manga_live_evidence.dart \
            "$EVIDENCE_DIR/evidence.json" \
            "$EVIDENCE_DIR/status.json" \
            "$REVIEWED_SHA"

      - name: Verify exact enabled cohort coverage
        id: coverage
        if: always() && steps.collect.outcome == 'success'
        shell: bash
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/goanime-enabled-manga-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          expected = {
              'ptbr.astratoons', 'ptbr.capitoons', 'ptbr.kivaratoons',
              'ptbr.leituramanga', 'ptbr.maidscan', 'ptbr.mangadash',
              'ptbr.mangaflix', 'ptbr.mangalivreblog', 'ptbr.ninjascan',
          }
          root = Path(os.environ['EVIDENCE_DIR'])
          reviewed = os.environ['REVIEWED_SHA']
          status = json.loads((root / 'status.json').read_text())
          evidence = json.loads((root / 'evidence.json').read_text())
          assert status['providerSetVersion'] == reviewed
          assert evidence['providerSetVersion'] == reviewed
          assert status['complete'] is True
          assert status['failures'] == []
          assert set(status['successfulProviderIds']) == expected
          rows = evidence['evidence']
          assert len(rows) == len(expected)
          assert {row['sourceId'] for row in rows} == expected
          PY

      - name: Remove private checkout and plaintext evidence
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/goanime-enabled-manga-evidence"

      - name: Publish sanitized gate result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          FORMAT: ${{ steps.format.outcome }}
          COLLECT: ${{ steps.collect.outcome }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          set -euo pipefail
          state=failure
          [ "$JOB_STATUS" = success ] && state=success
          failed_stage=none
          if [ "$ANALYZE" != success ]; then failed_stage=analyze
          elif [ "$TESTS" != success ]; then failed_stage=tests
          elif [ "$COLLECT" != success ]; then failed_stage=collect
          elif [ "$COVERAGE" != success ]; then failed_stage=coverage
          elif [ "$FORMAT" != success ]; then failed_stage=format
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$CONTROL_SHA" \
            -f state="$state" -f context='goanime/manga-enabled-reader-transport' \
            -f description="Enabled manga reader transport gate: $JOB_STATUS"
          result="$(jq -cn --arg controlSha "$CONTROL_SHA" --arg reviewedSha "$REVIEWED_SHA" --arg state "$state" --arg failedStage "$failed_stage" --arg analyze "$ANALYZE" --arg tests "$TESTS" --arg format "$FORMAT" --arg collect "$COLLECT" --arg coverage "$COVERAGE" '{schemaVersion:2,controlSha:$controlSha,reviewedSha:$reviewedSha,state:$state,failedStage:$failedStage,stages:{analyze:$analyze,tests:$tests,format:$format,collect:$collect,coverage:$coverage}}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-enabled-reader-transport/$CONTROL_SHA.json" \
            -f message="ci(result): record enabled manga transport $CONTROL_SHA" -f content="$encoded"
