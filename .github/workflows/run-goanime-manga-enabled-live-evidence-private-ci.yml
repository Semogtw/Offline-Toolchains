name: Run GoAnime enabled manga live evidence privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-manga-enabled-live-evidence/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-enabled-live-evidence-private-ci
  cancel-in-progress: false

jobs:
  evidence:
    name: Enabled manga live evidence
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-enabled-live-evidence/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false
          lfs: false
          submodules: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Validate and normalize enabled evidence transport
        id: format
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            test/services/manga/manga_remote_content_probe_test.dart
          flutter test --no-pub \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            test/services/manga/manga_remote_content_probe_test.dart
          dart format \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            test/services/manga/manga_remote_content_probe_test.dart >/dev/null
          if git diff --quiet -- \
            tools/manga/collect_enabled_manga_live_evidence.dart \
            test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
            lib/services/manga/manga_remote_content_probe.dart \
            test/services/manga/manga_remote_content_probe_test.dart; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo 'BEGIN_FORMAT_PATCH'
            git diff --no-ext-diff --unified=3 -- \
              tools/manga/collect_enabled_manga_live_evidence.dart \
              test/tools/manga/collect_enabled_manga_live_evidence_test.dart \
              lib/services/manga/manga_remote_content_probe.dart \
              test/services/manga/manga_remote_content_probe_test.dart
            echo 'END_FORMAT_PATCH'
          fi

      - name: Collect enabled live evidence
        working-directory: private-source
        shell: bash
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/goanime-enabled-manga-evidence
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          dart run tools/manga/collect_enabled_manga_live_evidence.dart \
            "$EVIDENCE_DIR/evidence.json" \
            "$EVIDENCE_DIR/status.json" \
            "$REVIEWED_SHA"

      - name: Verify exact enabled cohort coverage
        shell: bash
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          EVIDENCE_DIR: ${{ runner.temp }}/goanime-enabled-manga-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = {
              'ptbr.astratoons',
              'ptbr.capitoons',
              'ptbr.kivaratoons',
              'ptbr.leituramanga',
              'ptbr.maidscan',
              'ptbr.mangadash',
              'ptbr.mangaflix',
              'ptbr.mangalivreblog',
              'ptbr.ninjascan',
          }
          root = Path(os.environ['EVIDENCE_DIR'])
          reviewed = os.environ['REVIEWED_SHA']
          status = json.loads((root / 'status.json').read_text())
          evidence = json.loads((root / 'evidence.json').read_text())

          assert status['providerSetVersion'] == reviewed
          assert evidence['providerSetVersion'] == reviewed
          assert status['complete'] is True
          assert status['failures'] == []
          assert set(status['successfulProviderIds']) == expected
          rows = evidence['evidence']
          assert len(rows) == len(expected)
          assert {row['sourceId'] for row in rows} == expected
          PY
          echo "enabled_live_evidence=success"

      - name: Reject repository formatting drift
        if: steps.format.outputs.changed == 'true'
        shell: bash
        run: |
          echo 'enabled_live_evidence_format_drift=true'
          exit 1

      - name: Remove private checkout and plaintext evidence
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$GITHUB_WORKSPACE/private-source" \
            "$GITHUB_WORKSPACE/control" \
            "$RUNNER_TEMP/goanime-enabled-manga-evidence"
