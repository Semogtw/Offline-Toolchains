name: Report source bundle run once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/report-source-bundle-run-once.yml

permissions:
  actions: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report recent privileged bundle runs
        uses: actions/github-script@v7
        with:
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-private-source-bundle.yml',
              per_page: 5,
            });
            const lines = response.data.workflow_runs.map((run) =>
              `- ${run.id}: ${run.status}/${run.conclusion ?? 'pending'}; event=${run.event}; head=${run.head_sha}`
            );
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: `<!-- source-bundle-run-report:${context.runId} -->\n### Recent private source bundle runs\n\n${lines.join('\n')}`,
            });
