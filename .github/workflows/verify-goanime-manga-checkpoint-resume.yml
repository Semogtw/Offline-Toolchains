name: Verify GoAnime manga checkpoint resume

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-goanime-manga-checkpoint-resume.yml'
      - '.github/workflows/goanime-manga-global-cache.yml'
      - 'scripts/run_manga_checkpoint_budget_loop.sh'
      - 'tests/test_manga_global_cache_multi_unit_workflow.py'
      - 'triggers/goanime-manga-checkpoint-resume-verify/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-checkpoint-resume-verify
  cancel-in-progress: false

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Verify Toolchains multi-unit checkpoint contract
        shell: bash
        run: python3 tests/test_manga_global_cache_multi_unit_workflow.py

      - name: Resolve requested GoAnime ref
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-checkpoint-resume-verify/*.request' | head -n 1)"
          if [[ -n "$request" ]]; then
            ref="$(tr -d '\r\n ' < "$request")"
          else
            ref="feat/manga-catalog-canonicalization-v2-20260906"
          fi
          test -n "$ref"
          case "$ref" in
            feat/manga-checkpoint-resume-20260908|feat/manga-catalog-canonicalization-v2-20260906|feat/manga-checkpoint-deferred-rebuild-20260908|feat/manga-metadata-checkpoint-cursor-20260909|ci/manga-global-cache-f71a6d91cecc-34292292632) ;;
            *) echo "::error::Unexpected ref: $ref"; exit 1 ;;
          esac
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify checkpoint helper and shell
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest tools.tests.test_manga_checkpoint_state
          if [[ -f tools/tests/test_manga_checkpoint_snapshot_merge.py ]]; then
            python3 -m unittest tools.tests.test_manga_checkpoint_snapshot_merge
          fi
          python3 -m py_compile tools/manga/manga_checkpoint_state.py
          if [[ -f tools/manga/merge_manga_checkpoint_snapshots.py ]]; then
            python3 -m py_compile tools/manga/merge_manga_checkpoint_snapshots.py
          fi
          bash -n tools/manga/materialize_global_manga_availability_checkpointed_ci.sh

      - name: Verify persisted checkpoint snapshots
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          state=.ci/manga-global-cache/state.json
          if [[ ! -f "$state" ]]; then
            echo 'No persisted generation on this verification ref; skipping production snapshot merge smoke.'
            exit 0
          fi
          python3 tools/manga/merge_manga_checkpoint_snapshots.py \
            --state "$state" \
            --providers-dir .ci/manga-global-cache/providers \
            --output "$RUNNER_TEMP/combined_checkpoint_snapshot.json"
          python3 - "$state" "$RUNNER_TEMP/combined_checkpoint_snapshot.json" <<'PY'
          import json
          import sys
          state = json.load(open(sys.argv[1], encoding='utf-8'))
          merged = json.load(open(sys.argv[2], encoding='utf-8'))
          expected = state['completedProviders']
          providers = merged['providers']
          actual = [row['sourceId'] for row in providers]
          assert len(actual) == len(expected), (len(actual), len(expected))
          assert set(actual) == set(expected), (actual, expected)
          print(f'production checkpoint merge: {len(actual)} providers, {len(merged["occurrences"])} fresh occurrences')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get --enforce-lockfile >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)

      - name: Run checkpoint resume gate
        working-directory: private-source
        run: |
          flutter test --no-pub \
            test/tools/materialize_global_manga_checkpoint_resume_gate_test.dart \
            test/tools/manga_metadata_refresh_test.dart \
            test/tools/manga_jikan_title_fallback_regression_test.dart

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf private-source
