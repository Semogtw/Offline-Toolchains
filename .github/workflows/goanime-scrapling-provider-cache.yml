name: GoAnime Scrapling provider cache

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-provider-cache/*.request'
  workflow_dispatch:
    inputs:
      target_branch:
        description: GoAnime branch that owns the external Scrapling pipeline
        required: true
        default: main
      source_hint:
        description: Optional exact 40-character GoAnime source SHA
        required: false
        default: ''
      workers:
        description: Concurrent static fetch workers
        required: true
        default: '8'
  schedule:
    - cron: '23 07 * * *'

permissions:
  contents: read
  id-token: write
  statuses: write

concurrency:
  group: goanime-scrapling-provider-cache
  cancel-in-progress: true

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.actor == github.repository_owner || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCRAPLING_WORKERS: ${{ github.event.inputs.workers || '8' }}
      SCRAPLING_PROXY_PROVIDERS: animefire,animesonline
      TAILSCALE_EXIT_NODE: ${{ vars.GOANIME_TAILSCALE_EXIT_NODE }}
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve trusted refresh request
        id: request
        working-directory: trusted-source
        shell: bash
        env:
          DISPATCH_TARGET_BRANCH: ${{ github.event.inputs.target_branch || '' }}
          DISPATCH_SOURCE_HINT: ${{ github.event.inputs.source_hint || '' }}
        run: |
          set -euo pipefail
          python3 scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-scrapling-provider-cache \
            --workspace . \
            --dispatch-target "$DISPATCH_TARGET_BRANCH" \
            --dispatch-source-hint "$DISPATCH_SOURCE_HINT"

      - name: Validate request and credentials
        id: credentials
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          PROXY_URL: ${{ secrets.GOANIME_SCRAPLING_PROXY_URL }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"
          [[ "$SCRAPLING_WORKERS" =~ ^[0-9]+$ ]]
          test "$SCRAPLING_WORKERS" -ge 1
          test "$SCRAPLING_WORKERS" -le 16
          if [ -n "$WRITE_TOKEN" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'GOANIME_CATALOG_WRITE_TOKEN is not configured; build/validation only.'
          fi
          if [ -n "$PROXY_URL" ]; then
            echo 'proxy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'proxy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint || steps.request.outputs.target_branch }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Record immutable source revision
        id: source
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SOURCE_HINT: ${{ steps.request.outputs.source_hint }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -n "$EXPECTED_SOURCE_HINT" ] && [ "$sha" != "$EXPECTED_SOURCE_HINT" ]; then
            echo 'Checked-out GoAnime revision does not match source_hint.' >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          test -f tools/scrapling_provider_pipeline/requirements.txt
          test -f tools/scrapling_provider_pipeline/build_provider_cache.py
          test -f tools/scrapling_provider_pipeline/validate_provider_cache.py
          test -f tools/scrapling_provider_pipeline/mal_input_preflight.py

      - name: Preflight provider pipeline inputs
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scrapling_provider_pipeline/mal_input_preflight.py --repo-root .

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-source/tools/scrapling_provider_pipeline/requirements.txt

      - name: Restore browser binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: goanime-scrapling-browsers-v1-${{ runner.os }}-${{ hashFiles('private-source/tools/scrapling_provider_pipeline/requirements.txt') }}

      - name: Restore adaptive selector state
        uses: actions/cache@v5
        with:
          path: adaptive-state
          key: goanime-scrapling-adaptive-v1-${{ runner.os }}-${{ steps.request.outputs.target_branch }}-${{ github.run_id }}
          restore-keys: |
            goanime-scrapling-adaptive-v1-${{ runner.os }}-${{ steps.request.outputs.target_branch }}-

      - name: Seed adaptive selector database
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p private-source/.cache/scrapling-provider-pipeline
          if [ -d adaptive-state ]; then
            cp -a adaptive-state/. private-source/.cache/scrapling-provider-pipeline/
          fi

      - name: Install pinned Scrapling fetcher toolchain
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement tools/scrapling_provider_pipeline/requirements.txt
          scrapling install
          python ../trusted-source/scripts/goanime_install_patchright.py \
            --browser chromium \
            --attempts 3
          python - <<'PY'
          import importlib.metadata
          expected = {
              'scrapling': '0.4.14',
              'playwright': '1.62.0',
              'patchright': '1.61.2',
          }
          for package, wanted in expected.items():
              actual = importlib.metadata.version(package)
              if actual != wanted:
                  raise SystemExit(f'expected {package} {wanted}, got {actual}')
              print(f'{package} {actual} ready')
          PY

      - name: Run external pipeline unit tests
        working-directory: private-source/tools/scrapling_provider_pipeline
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Crawl providers and build cache
        id: crawl
        working-directory: private-source
        shell: bash
        env:
          SCRAPLING_PROXY_URL: ${{ secrets.GOANIME_SCRAPLING_PROXY_URL }}
        run: |
          set +e
          python tools/scrapling_provider_pipeline/build_provider_cache.py \
            --repo-root . \
            --state-dir .cache/scrapling-provider-pipeline \
            --workers "$SCRAPLING_WORKERS"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Unexpected crawler exit code: $code" >&2
            exit "$code"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo 'Some fresh provider crawls were rejected; optional residential fallback will be considered.'
          fi

      - name: Select failed providers eligible for phone retry
        if: steps.crawl.outputs.code == '2'
        id: residential_targets
        working-directory: private-source
        shell: bash
        env:
          ELIGIBLE_PROVIDERS: ${{ env.SCRAPLING_PROXY_PROVIDERS }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path('assets/data/anime_provider_catalog_manifest.json').read_text(encoding='utf-8')
          )
          providers = manifest.get('providers')
          if not isinstance(providers, dict):
              raise SystemExit('provider manifest has no provider map')
          eligible = list(dict.fromkeys(
              provider.strip().lower()
              for provider in os.environ.get('ELIGIBLE_PROVIDERS', '').split(',')
              if provider.strip()
          ))
          selected = [
              provider
              for provider in eligible
              if isinstance(providers.get(provider), dict)
              and providers[provider].get('status') in {'preserved', 'unavailable'}
          ]
          joined = ','.join(selected)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'providers={joined}\n')
              output.write(f'count={len(selected)}\n')
          print('Phone retry targets: ' + (joined if joined else 'none'))
          PY

      - name: Check phone fallback configuration
        if: steps.crawl.outputs.code == '2' && steps.residential_targets.outputs.providers != ''
        id: phone
        shell: bash
        env:
          TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.GOANIME_TAILSCALE_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ secrets.GOANIME_TAILSCALE_AUDIENCE }}
        run: |
          set -euo pipefail
          if [ -n "$TAILSCALE_OAUTH_CLIENT_ID" ] && [ -n "$TAILSCALE_AUDIENCE" ] && [ -n "$TAILSCALE_EXIT_NODE" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'Phone residential fallback is not fully configured; safe snapshots remain preserved.'
          fi

      - name: Connect optional phone exit node
        if: steps.crawl.outputs.code == '2' && steps.residential_targets.outputs.providers != '' && steps.phone.outputs.configured == 'true'
        id: tailscale
        continue-on-error: true
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.GOANIME_TAILSCALE_CLIENT_ID }}
          audience: ${{ secrets.GOANIME_TAILSCALE_AUDIENCE }}
          tags: tag:goanime-scraper
          tailscaled-args: --tun=userspace-networking --outbound-http-proxy-listen=127.0.0.1:1055
          args: --exit-node=${{ env.TAILSCALE_EXIT_NODE }}

      - name: Verify optional residential route
        if: steps.tailscale.outcome == 'success'
        id: residential_route
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          direct_ip="$(curl --fail --silent --show-error --max-time 20 \
            --noproxy '*' \
            https://checkip.amazonaws.com | tr -d '[:space:]')"
          proxy_ip="$(curl --fail --silent --show-error --max-time 20 \
            --proxy http://127.0.0.1:1055 \
            https://checkip.amazonaws.com | tr -d '[:space:]')"
          test -n "$direct_ip"
          test -n "$proxy_ip"
          if [ "$direct_ip" = "$proxy_ip" ]; then
            echo 'Phone proxy is reachable but did not change public egress.' >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 20 \
            --proxy http://127.0.0.1:1055 \
            https://www.google.com/generate_204 \
            --output /dev/null
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          unset direct_ip proxy_ip

      - name: Retry only failed providers through phone egress
        if: steps.tailscale.outcome == 'success' && steps.residential_route.outputs.ready == 'true'
        id: residential
        working-directory: private-source
        shell: bash
        env:
          SCRAPLING_PROXY_URL: http://127.0.0.1:1055
          SCRAPLING_PROXY_PROVIDERS: ${{ steps.residential_targets.outputs.providers }}
          RESIDENTIAL_PROVIDERS: ${{ steps.residential_targets.outputs.providers }}
        run: |
          set +e
          python tools/scrapling_provider_pipeline/build_provider_cache.py \
            --repo-root . \
            --state-dir .cache/scrapling-provider-pipeline \
            --workers "$SCRAPLING_WORKERS" \
            --only-providers "$RESIDENTIAL_PROVIDERS"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then
            echo "Unexpected residential crawler exit code: $code" >&2
            exit "$code"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo 'Residential retry still left at least one provider preserved/unavailable.'
          fi

      - name: Preserve learned adaptive selector state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf adaptive-state
          mkdir -p adaptive-state
          if [ -d private-source/.cache/scrapling-provider-pipeline ]; then
            cp -a private-source/.cache/scrapling-provider-pipeline/. adaptive-state/
          fi

      - name: Validate generated cache contract
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python tools/scrapling_provider_pipeline/validate_provider_cache.py \
            --repo-root . \
            --allow-preserved
          python -m json.tool assets/data/provider_scrape_evidence.json >/dev/null
          python -m json.tool tools/scrapling_provider_pipeline/provider_source_hints.json >/dev/null

      - name: Verify generated diff is cache-only
        id: diff
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(assets/data/(anime_provider_catalogs\.json|anime_provider_catalog_manifest\.json|available_animes\.json|available_anime_modes\.json|mal_provider_availability_map\.json|provider_scrape_evidence\.json)|tools/scrapling_provider_pipeline/provider_source_hints\.json)$'
          changed_paths="$(git status --porcelain=v1 | sed -E 's/^.. //' | grep -Ev '^\.cache/scrapling-provider-pipeline(/|$)' || true)"
          unexpected="$(printf '%s\n' "$changed_paths" | sed '/^$/d' | grep -Ev "$allowed" || true)"
          if [ -n "$unexpected" ]; then
            echo 'Unexpected generated files:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          if [ -z "$changed_paths" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit validated external cache
        if: steps.diff.outputs.changed == 'true' && steps.credentials.outputs.publish == 'true'
        id: commit
        working-directory: private-source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          EXPECTED_SHA: ${{ steps.source.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git add \
            assets/data/anime_provider_catalogs.json \
            assets/data/anime_provider_catalog_manifest.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_provider_availability_map.json \
            assets/data/provider_scrape_evidence.json \
            tools/scrapling_provider_pipeline/provider_source_hints.json
          git diff --cached --check
          git commit -m 'chore(cache): refresh providers with Scrapling'
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          extraheader="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$extraheader" fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git -c http.https://github.com/.extraheader="$extraheader" push origin "HEAD:$TARGET_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          unset auth extraheader WRITE_TOKEN

      - name: Upload validated cache and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: goanime-provider-scrape-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            private-source/assets/data/anime_provider_catalogs.json
            private-source/assets/data/anime_provider_catalog_manifest.json
            private-source/assets/data/available_animes.json
            private-source/assets/data/available_anime_modes.json
            private-source/assets/data/mal_provider_availability_map.json
            private-source/assets/data/provider_scrape_evidence.json
            private-source/tools/scrapling_provider_pipeline/provider_source_hints.json

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo '## GoAnime external Scrapling cache' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target branch: `${{ steps.request.outputs.target_branch }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Requested source revision: `${{ steps.request.outputs.source_hint }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source revision: `${{ steps.source.outputs.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Initial crawler result: `${{ steps.crawl.outputs.code }}` (0=fresh complete, 2=safe fallback present)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phone retry targets: `${{ steps.residential_targets.outputs.providers }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Phone fallback configured: `${{ steps.phone.outputs.configured }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tailnet connection: `${{ steps.tailscale.outcome }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Residential route ready: `${{ steps.residential_route.outputs.ready }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Residential retry result: `${{ steps.residential.outputs.code }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cache changed: `${{ steps.diff.outputs.changed }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic publication enabled: `${{ steps.credentials.outputs.publish }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Optional direct proxy configured: `${{ steps.credentials.outputs.proxy }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Published commit: `${{ steps.commit.outputs.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Adaptive selector state survives runs through the Toolchains Actions cache without entering the APK/repository.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish sanitized trigger status
        if: always()
        continue-on-error: true
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=error
          case "$JOB_STATUS" in
            success) state=success ;;
            failure) state=failure ;;
            cancelled) state=error ;;
          esac
          python3 scripts/goanime_post_status.py \
            --state "$state" \
            --context goanime-scrapling/provider-cache \
            --description "GoAnime provider-cache run finished: $state"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
