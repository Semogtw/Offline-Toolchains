name: Diagnose MangaDex offset boundary

on:
  push:
    branches: [main]
    paths:
      - 'triggers/mangadex-offset-boundary/*.request'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false
      - name: Probe public MangaDex request window
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.mangadex.org/manga'
          for i in $(seq 1 70); do
            offset=$(( (i - 1) * 24 ))
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 30 \
              --get "$base" \
              --data-urlencode 'limit=24' \
              --data-urlencode "offset=$offset" \
              --data-urlencode 'availableTranslatedLanguage[]=pt-br' \
              --data-urlencode 'contentRating[]=safe' \
              --data-urlencode 'contentRating[]=suggestive' \
              --data-urlencode 'includes[]=cover_art' \
              --output "$tmp" \
              --write-out '%{http_code}')"
            printf 'request=%02d offset=%d code=%s ' "$i" "$offset" "$code"
            if [[ "$code" == 200 ]]; then
              jq -r '"total=\(.total) count=\(.data|length)"' "$tmp"
            else
              jq -c '{result,errors}' "$tmp" 2>/dev/null || head -c 1000 "$tmp"
              echo
            fi
            rm -f "$tmp"
          done
