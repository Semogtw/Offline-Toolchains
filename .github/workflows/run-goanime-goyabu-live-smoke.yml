name: Run GoAnime Goyabu live smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/run-goanime-goyabu-live-smoke.yml'
      - 'scripts/goyabu_live_smoke.py'
      - 'triggers/goanime-goyabu-live/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-goyabu-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Probe public Goyabu playback shape
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout trusted probe
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/goyabu_live_smoke.py
            keys/source-bundles-public.asc
          sparse-checkout-cone-mode: false
          show-progress: false

      - name: Run sanitized live smoke
        id: smoke
        shell: bash
        env:
          CAPTURE_DIR: ${{ runner.temp }}/goyabu-live-capture
          SAFE_LOG: ${{ runner.temp }}/goyabu-live-safe.log
        run: |
          set +e
          python3 scripts/goyabu_live_smoke.py 2>&1 | tee "$SAFE_LOG"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Encrypt diagnostic capture
        if: steps.smoke.outputs.exit_code != '0'
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          capture="$RUNNER_TEMP/goyabu-live-capture/episode.html"
          test -s "$capture"
          export GNUPGHOME="$RUNNER_TEMP/goyabu-live-gpg"
          mkdir -p "$GNUPGHOME" "$RUNNER_TEMP/goyabu-live-out"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/source-bundles-public.asc
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" \
            --output "$RUNNER_TEMP/goyabu-live-out/episode.html.gpg" --encrypt "$capture"

      - name: Upload encrypted diagnostic capture
        if: steps.smoke.outputs.exit_code != '0'
        uses: actions/upload-artifact@v7
        with:
          name: goanime-goyabu-live-diagnostic-encrypted
          path: ${{ runner.temp }}/goyabu-live-out/episode.html.gpg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Publish sanitized live report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          TOOLCHAINS_SHA: ${{ github.sha }}
          SAFE_LOG: ${{ runner.temp }}/goyabu-live-safe.log
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/goyabu-live-report.json"
          python3 - "$report" "$SAFE_LOG" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          safe_prefixes = (
              'home ', 'nonce=', 'search ', 'search_shape=', 'search_result=',
              'anime_result=', 'anime ', 'episode=', 'episode_page ', 'player=',
              'player_profiles=', 'blogger_formats=', 'goyabu_ajax_error=',
              'playback_shape=', 'blogger_probe_error=', 'probe_error=',
          )
          log_path = Path(sys.argv[2])
          lines = []
          if log_path.is_file():
              for raw in log_path.read_text(encoding='utf-8', errors='replace').splitlines():
                  if raw.startswith(safe_prefixes):
                      lines.append(raw[:1000])
          payload = {
              'schemaVersion': 1,
              'runId': int(os.environ['RUN_ID']),
              'runAttempt': int(os.environ['RUN_ATTEMPT']),
              'toolchainsSha': os.environ['TOOLCHAINS_SHA'],
              'exitCode': int(os.environ.get('EXIT_CODE') or -1),
              'finishedAt': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'diagnostics': lines,
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          encoded="$(base64 -w0 < "$report")"
          path="reports/goanime-goyabu-live/${RUN_ID}.json"
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report Goyabu live run ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null

      - name: Enforce smoke result
        shell: bash
        env:
          EXIT_CODE: ${{ steps.smoke.outputs.exit_code }}
        run: test "$EXIT_CODE" = "0"

      - name: Remove transient capture
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/goyabu-live-capture" "$RUNNER_TEMP/goyabu-live-gpg" "$RUNNER_TEMP/goyabu-live-out" "$RUNNER_TEMP/goyabu-live-safe.log"
