name: Build Hydra offline toolchain

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Hydra branch, tag or commit
        required: false
        default: main
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-hydra.yml
      - scripts/build-hydra-toolchain.sh
      - scripts/sanitize-hydra-toolchain.sh
      - scripts/validate-source-bundle-request.py
      - triggers/hydra-toolchain.json
      - docs/HYDRA_TOOLCHAIN.md

permissions:
  contents: read

concurrency:
  group: hydra-toolchain-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.1"
  YARN_VERSION: "1.22.22"
  RUST_TOOLCHAIN: stable
  GTK4_LAYER_SHELL_COMMIT: "1c963c51514581c41b9bdae08cdf69171265cdda"

jobs:
  build:
    name: Node, Yarn, Rust and sanitized Hydra dependency caches
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout trusted toolchain definitions
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Resolve and validate Hydra ref
        id: request
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          if [[ -n "${DISPATCH_REF:-}" ]]; then
            ref="$DISPATCH_REF"
          else
            ref="$(python3 - <<'PY'
          import json
          from pathlib import Path

          request = json.loads(
              Path("triggers/hydra-toolchain.json").read_text(encoding="utf-8")
          )
          if request.get("profile") != "hydra":
              raise SystemExit("Hydra toolchain trigger must use profile=hydra")
          ref = request.get("ref")
          if not isinstance(ref, str) or not ref:
              raise SystemExit("Hydra toolchain trigger requires a non-empty ref")
          print(ref)
          PY
          )"
          fi

          normalized="$(
            printf '{"project":"hydra","mode":"ref","ref":%s}\n' \
              "$(python3 -c 'import json,sys; print(json.dumps(sys.argv[1]))' "$ref")" |
              python3 scripts/validate-source-bundle-request.py -
          )"
          python3 - "$normalized" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys

          request = json.loads(sys.argv[1])
          with open(sys.argv[2], "a", encoding="utf-8") as stream:
              stream.write(f"ref={request['ref']}\n")
          PY

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || {
            echo "Missing Actions secret PRIVATE_REPOSITORIES_TOKEN." >&2
            exit 1
          }

      - name: Checkout fixed Hydra repository
        uses: actions/checkout@v6
        with:
          repository: Semogtw/HydraPersonalizado
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: ${{ steps.request.outputs.ref }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: false

      - name: Install native build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            libgtk-4-dev \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            wayland-protocols \
            zstd

      - name: Build and prove portable Hydra toolchain
        id: bundle
        shell: bash
        env:
          HYDRA_REF: ${{ steps.request.outputs.ref }}
          GTK4_LAYER_SHELL_COMMIT: ${{ env.GTK4_LAYER_SHELL_COMMIT }}
        run: |
          set -euo pipefail
          bash scripts/build-hydra-toolchain.sh \
            "$GITHUB_WORKSPACE/private-source" \
            "$RUNNER_TEMP/hydra-toolchain" \
            "$NODE_VERSION" \
            "$YARN_VERSION" \
            "$RUST_TOOLCHAIN"

      - name: Remove private package and lockfile copies from public bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/sanitize-hydra-toolchain.sh \
            "${{ steps.bundle.outputs.bundle_root }}" \
            "${{ steps.bundle.outputs.parts_dir }}" \
            "${{ steps.bundle.outputs.archive_sha }}"

      - name: Prove transfer contains fingerprints only
        shell: bash
        run: |
          set -euo pipefail
          reference_dir="${{ steps.bundle.outputs.bundle_root }}/reference-inputs"
          test -f "$reference_dir/SHA256.txt"
          test ! -f "$reference_dir/package.json"
          test ! -f "$reference_dir/yarn.lock"
          test ! -f "$reference_dir/hydra-native.Cargo.lock"
          test ! -f "$reference_dir/game-agent.Cargo.lock"
          test -f "${{ steps.bundle.outputs.parts_dir }}/MANIFEST.txt"
          test -f "${{ steps.bundle.outputs.parts_dir }}/INPUT-SHA256.txt"
          test -f "${{ steps.bundle.outputs.parts_dir }}/ARCHIVE.sha256"

      - name: Upload sanitized Hydra public toolchain
        uses: actions/upload-artifact@v7
        with:
          name: hydra-toolchain-linux-x64-sanitized
          path: ${{ steps.bundle.outputs.parts_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove private and transient toolchain data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$RUNNER_TEMP/hydra-toolchain"
          rm -f "$RUNNER_TEMP/hydra-toolchain-linux-x64.tar.zst"
          rm -f "$RUNNER_TEMP/hydra-toolchain-linux-x64.tar.zst.sha256"
          rm -rf "$RUNNER_TEMP/hydra-toolchain-linux-x64-parts"
