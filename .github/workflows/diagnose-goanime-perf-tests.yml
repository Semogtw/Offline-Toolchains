name: Diagnose GoAnime perf test failure

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-goanime-perf-tests.yml
      - triggers/goanime-perf-test-diagnostic/*.request

permissions:
  contents: read

concurrency:
  group: diagnose-goanime-perf-tests
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  GOANIME_SHA: 35ab72bdda1cf992d254bfba973f26eff3b7d620

jobs:
  diagnose:
    name: Capture Flutter test failure
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      test_exit_code: ${{ steps.tests.outputs.exit_code }}

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get

      - name: Run Flutter tests and preserve output
        id: tests
        working-directory: private-source
        shell: bash
        run: |
          set +e
          set -o pipefail
          flutter test --no-pub 2>&1 | tee "$RUNNER_TEMP/goanime-flutter-test.log"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"

  report:
    name: Publish diagnostic metadata
    if: always()
    needs: diagnose
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Publish run id and sanitized result
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RESULT: ${{ needs.diagnose.result }}
          TEST_EXIT_CODE: ${{ needs.diagnose.outputs.test_exit_code }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/diagnostic.json"
          python3 - "$report" <<'PY'
          import json
          import os
          import sys
          payload = {
              "schemaVersion": 1,
              "runId": int(os.environ["RUN_ID"]),
              "runAttempt": int(os.environ["RUN_ATTEMPT"]),
              "result": os.environ["RESULT"],
              "testExitCode": os.environ.get("TEST_EXIT_CODE", ""),
              "toolchainsTriggerSha": os.environ["TRIGGER_SHA"],
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          encoded="$(base64 -w0 < "$report")"
          path="reports/goanime-perf-test-diagnostic/${RUN_ID}.json"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report diagnostic run ${RUN_ID}" \
            -f "content=${encoded}" >/dev/null
