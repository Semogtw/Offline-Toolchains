name: Diagnose GoAnime MangaDex offset ceiling

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangadex-offset-ceiling/*.request'

permissions:
  contents: read

jobs:
  diagnose:
    name: Probe MangaDex 10k offset ceiling
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Compare boundary requests
        shell: bash
        run: |
          set -euo pipefail
          base='https://api.mangadex.org/manga'
          probe() {
            local limit="$1" offset="$2"
            local body headers code
            body="$(mktemp)"; headers="$(mktemp)"
            code="$(curl --silent --show-error --location --max-time 30 \
              --get "$base" \
              --data-urlencode "limit=$limit" \
              --data-urlencode "offset=$offset" \
              --data-urlencode 'availableTranslatedLanguage[]=pt-br' \
              --data-urlencode 'contentRating[]=safe' \
              --data-urlencode 'contentRating[]=suggestive' \
              --data-urlencode 'includes[]=cover_art' \
              --dump-header "$headers" \
              --output "$body" \
              --write-out '%{http_code}')"
            printf '[offset-ceiling] limit=%s offset=%s code=%s content-type=' "$limit" "$offset" "$code"
            awk 'BEGIN{IGNORECASE=1} /^content-type:/{gsub("\r",""); print substr($0,index($0,":")+2); exit}' "$headers"
            if jq -e . "$body" >/dev/null 2>&1; then
              jq -c '{result,total,limit,offset,errors}' "$body"
            else
              grep -o -m2 -E '<h1>[^<]+</h1>|<p>[^<]+</p>' "$body" | tr '\n' ' '; echo
            fi
            rm -f "$body" "$headers"
          }
          probe 100 9900
          probe 100 9901
          probe 1 9999
          probe 1 10000
          probe 100 10000
