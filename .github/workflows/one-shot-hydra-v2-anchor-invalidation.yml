name: One-shot Hydra V2 anchor invalidation

on:
  push:
    paths:
      - "triggers/one-shot-hydra-v2-anchor-invalidation.json"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current Hydra V2 branch
        uses: actions/checkout@v4
        with:
          repository: Semogtw/HydraPersonalizado
          ref: feat/drive-cloud-saves-v2
          token: ${{ secrets.TOOLCHAIN_GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Invalidate anchors when remote lineage is V1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts")
          text = path.read_text()
          old = '''  private static async refreshAnchorFromRemote(game: Game, fileId: string) {\n    const backups = await GoogleDriveClient.listBackups(\n      levelKeys.game(game.shop, game.objectId),\n      getDriveV2GameFolderName(game)\n    );\n    const backup = backups.find((item) => item.id === fileId);\n    if (!backup?.v2ManifestPresent) return;\n\n    const loaded = await this.loadRemoteV2(game, backup);\n    try {\n      await writeDriveV2Anchor({ game, backup, manifest: loaded.manifest });\n    } finally {\n      await GameSaveArchive.cleanup(loaded.archivePath);\n    }\n  }\n\n  private static async refreshAnchorFromLatestRemote(game: Game) {\n    const backups = await GoogleDriveClient.listBackups(\n      levelKeys.game(game.shop, game.objectId),\n      getDriveV2GameFolderName(game)\n    );\n    const latest = backups.find(\n      (backup) => !backup.conflict && backup.v2ManifestPresent\n    );\n    if (latest) await this.refreshAnchorFromRemote(game, latest.id);\n  }\n'''
          new = '''  private static async refreshAnchorFromRemote(game: Game, fileId: string) {\n    const gameKey = levelKeys.game(game.shop, game.objectId);\n    const backups = await GoogleDriveClient.listBackups(\n      gameKey,\n      getDriveV2GameFolderName(game)\n    );\n    const backup = backups.find((item) => item.id === fileId);\n    if (!backup?.v2ManifestPresent) {\n      await googleDriveSyncAnchorSublevel.del(gameKey);\n      return;\n    }\n\n    const loaded = await this.loadRemoteV2(game, backup);\n    try {\n      await writeDriveV2Anchor({ game, backup, manifest: loaded.manifest });\n    } finally {\n      await GameSaveArchive.cleanup(loaded.archivePath);\n    }\n  }\n\n  private static async refreshAnchorFromLatestRemote(game: Game) {\n    const gameKey = levelKeys.game(game.shop, game.objectId);\n    const backups = await GoogleDriveClient.listBackups(\n      gameKey,\n      getDriveV2GameFolderName(game)\n    );\n    const latest = backups.find((backup) => !backup.conflict);\n    if (!latest?.v2ManifestPresent) {\n      await googleDriveSyncAnchorSublevel.del(gameKey);\n      return;\n    }\n    await this.refreshAnchorFromRemote(game, latest.id);\n  }\n'''
          if old not in text:
              if "await googleDriveSyncAnchorSublevel.del(gameKey);" in text and "const latest = backups.find((backup) => !backup.conflict);" in text:
                  print("Anchor invalidation already present")
                  raise SystemExit(0)
              raise SystemExit("expected anchor refresh implementation was not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push race-safely
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "toolchains-bot"
          git config user.email "toolchains-bot@users.noreply.github.com"
          git add src/main/services/cloud-save/google-drive/google-drive-cloud-save-provider-v2-runtime.ts
          git commit -m "fix(cloud-save): invalidate stale V2 anchors after V1 restore"
          git pull --rebase origin feat/drive-cloud-saves-v2
          git push origin HEAD:feat/drive-cloud-saves-v2

      - name: Remove one-shot files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAINS_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for file in ".github/workflows/one-shot-hydra-v2-anchor-invalidation.yml" "triggers/one-shot-hydra-v2-anchor-invalidation.json"; do
            encoded="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$file")"
            metadata="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}?ref=main")" || continue
            sha="$(printf '%s' "$metadata" | jq -er '.sha')"
            body="$(jq -cn --arg message "ci: remove completed stale V2 anchor patch" --arg sha "$sha" '{message:$message,sha:$sha,branch:"main"}')"
            curl --fail-with-body --silent --show-error -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${TOOLCHAINS_REPO}/contents/${encoded}" \
              -d "$body" >/dev/null || true
          done
