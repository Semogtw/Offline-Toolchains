name: Fix GoAnime MangaDex inventory budget

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangadex-inventory-budget-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-mangadex-inventory-budget-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Diagnose MangaDex inventory budget workflow
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Confirm workflow envelope
        run: echo '[diagnostic] workflow envelope is valid'
