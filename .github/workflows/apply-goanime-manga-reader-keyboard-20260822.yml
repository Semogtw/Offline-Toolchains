name: Apply GoAnime Manga reader keyboard hardening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-reader-keyboard-20260822/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-reader-keyboard-20260822
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact GoAnime revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-reader-keyboard-20260822/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'feature/manga-platform'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify current remote head
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"

      - name: Apply reviewed reader keyboard hardening
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one reviewed anchor, found {count}')
              file.write_text(text.replace(old, new, 1))

          reader = 'lib/screens/manga/manga_reader_screen.dart'
          replace_once(
              reader,
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
          )
          replace_once(
              reader,
              "    unawaited(_loadReaderMode());\n    unawaited(WakelockPlus.enable());\n    _recordPage(_pageIndex, _pageCount);",
              "    unawaited(_loadReaderMode());\n    unawaited(_setWakelock(enabled: true));\n    _recordPage(_pageIndex, _pageCount);",
          )
          replace_once(
              reader,
              "    _pdfController = null;\n    unawaited(WakelockPlus.disable());\n    super.dispose();",
              "    _pdfController = null;\n    unawaited(_setWakelock(enabled: false));\n    super.dispose();",
          )
          replace_once(
              reader,
              "  Future<void> _loadReaderMode() async {",
              "  Future<void> _setWakelock({required bool enabled}) async {\n    try {\n      if (enabled) {\n        await WakelockPlus.enable();\n      } else {\n        await WakelockPlus.disable();\n      }\n    } catch (_) {\n      // Wakelock is supplemental. Missing/unsupported platform integration\n      // must never prevent a chapter from opening or closing cleanly.\n    }\n  }\n\n  Future<void> _loadReaderMode() async {",
          )
          replace_once(
              reader,
              "      await _preferencesRepository.clearReaderMode(widget.chapter.workId);\n      final defaultMode = await _preferencesRepository.defaultReaderMode();",
              "      final defaultMode = await _preferencesRepository.defaultReaderMode();\n      await _preferencesRepository.clearReaderMode(widget.chapter.workId);",
          )
          keyboard_methods = r'''

            KeyEventResult _handleKeyEvent(FocusNode node, KeyEvent event) {
              if (event is! KeyDownEvent || _openingReaderRoute) {
                return KeyEventResult.ignored;
              }
              final key = event.logicalKey;
              if (key == LogicalKeyboardKey.escape) {
                _toggleChrome();
                return KeyEventResult.handled;
              }
              if (!_supportsImageModes) return KeyEventResult.ignored;

              if (_readerMode == MangaReaderMode.continuousVertical) {
                if (key == LogicalKeyboardKey.arrowDown ||
                    key == LogicalKeyboardKey.pageDown ||
                    key == LogicalKeyboardKey.space) {
                  _scrollContinuousBy(1);
                  return KeyEventResult.handled;
                }
                if (key == LogicalKeyboardKey.arrowUp ||
                    key == LogicalKeyboardKey.pageUp) {
                  _scrollContinuousBy(-1);
                  return KeyEventResult.handled;
                }
                return KeyEventResult.ignored;
              }

              final nextKey = switch (_readerMode) {
                MangaReaderMode.pagedRtl => LogicalKeyboardKey.arrowLeft,
                MangaReaderMode.pagedLtr => LogicalKeyboardKey.arrowRight,
                MangaReaderMode.pagedVertical => LogicalKeyboardKey.arrowDown,
                MangaReaderMode.continuousVertical => LogicalKeyboardKey.arrowDown,
              };
              final previousKey = switch (_readerMode) {
                MangaReaderMode.pagedRtl => LogicalKeyboardKey.arrowRight,
                MangaReaderMode.pagedLtr => LogicalKeyboardKey.arrowLeft,
                MangaReaderMode.pagedVertical => LogicalKeyboardKey.arrowUp,
                MangaReaderMode.continuousVertical => LogicalKeyboardKey.arrowUp,
              };
              if (key == nextKey ||
                  key == LogicalKeyboardKey.pageDown ||
                  key == LogicalKeyboardKey.space) {
                _movePagedReader(1);
                return KeyEventResult.handled;
              }
              if (key == previousKey || key == LogicalKeyboardKey.pageUp) {
                _movePagedReader(-1);
                return KeyEventResult.handled;
              }
              return KeyEventResult.ignored;
            }

            void _movePagedReader(int delta) {
              final controller = _imageController;
              final count = _pageCount;
              if (controller == null || !controller.hasClients || count == null || count <= 0) {
                return;
              }
              final target = (_pageIndex + delta).clamp(0, count - 1).toInt();
              if (target == _pageIndex) return;
              unawaited(
                controller.animateToPage(
                  target,
                  duration: const Duration(milliseconds: 180),
                  curve: Curves.easeOutCubic,
                ),
              );
            }

            void _scrollContinuousBy(int direction) {
              final controller = _continuousController;
              if (controller == null || !controller.hasClients) return;
              final position = controller.position;
              final target = (controller.offset + position.viewportDimension * 0.85 * direction)
                  .clamp(position.minScrollExtent, position.maxScrollExtent)
                  .toDouble();
              unawaited(
                controller.animateTo(
                  target,
                  duration: const Duration(milliseconds: 180),
                  curve: Curves.easeOutCubic,
                ),
              );
            }
          '''
          replace_once(
              reader,
              "\n  @override\n  Widget build(BuildContext context) {",
              keyboard_methods + "\n  @override\n  Widget build(BuildContext context) {",
          )
          replace_once(
              reader,
              "    return Scaffold(\n      backgroundColor: Colors.black,",
              "    return Focus(\n      autofocus: true,\n      onKeyEvent: _handleKeyEvent,\n      child: Scaffold(\n        backgroundColor: Colors.black,",
          )
          replace_once(
              reader,
              "      ),\n    );\n  }\n\n  Widget _buildReader(UiMangaLocalizations l10n) {",
              "      ),\n      ),\n    );\n  }\n\n  Widget _buildReader(UiMangaLocalizations l10n) {",
          )

          test = 'test/widgets/manga/manga_reader_screen_test.dart'
          replace_once(
              test,
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/services.dart';\n",
          )
          keyboard_tests = r'''

            testWidgets('keyboard arrows navigate paged vertical reader', (tester) async {
              const threePageManifest = LocalPackageContentManifest(
                sourceId: 'local.test',
                mangaId: 'work-source-1',
                chapterId: 'chapter-source-1',
                packageId: 'package-1',
                sourceContentKind: MangaContentKind.imageSequence,
                pageCount: 3,
              );
              await preferences.saveReaderMode('work-1', MangaReaderMode.pagedVertical);

              await tester.pumpWidget(
                _readerApp(
                  preferences: preferences,
                  progress: progress,
                  manifest: threePageManifest,
                  loader: (_) async => MangaLocalImageReaderContent(
                    <File>[pageFile, pageFile, pageFile],
                  ),
                ),
              );
              await tester.pumpAndSettle();

              expect(find.text('Page 1 of 3'), findsOneWidget);
              await tester.sendKeyEvent(LogicalKeyboardKey.arrowDown);
              await tester.pumpAndSettle();
              expect(find.text('Page 2 of 3'), findsOneWidget);
              await tester.sendKeyEvent(LogicalKeyboardKey.arrowUp);
              await tester.pumpAndSettle();
              expect(find.text('Page 1 of 3'), findsOneWidget);
            });

            testWidgets('keyboard arrows respect RTL reading direction', (tester) async {
              const threePageManifest = LocalPackageContentManifest(
                sourceId: 'local.test',
                mangaId: 'work-source-1',
                chapterId: 'chapter-source-1',
                packageId: 'package-1',
                sourceContentKind: MangaContentKind.imageSequence,
                pageCount: 3,
              );
              await preferences.saveReaderMode('work-1', MangaReaderMode.pagedRtl);

              await tester.pumpWidget(
                _readerApp(
                  preferences: preferences,
                  progress: progress,
                  manifest: threePageManifest,
                  loader: (_) async => MangaLocalImageReaderContent(
                    <File>[pageFile, pageFile, pageFile],
                  ),
                ),
              );
              await tester.pumpAndSettle();

              await tester.sendKeyEvent(LogicalKeyboardKey.arrowLeft);
              await tester.pumpAndSettle();
              expect(find.text('Page 2 of 3'), findsOneWidget);
              await tester.sendKeyEvent(LogicalKeyboardKey.arrowRight);
              await tester.pumpAndSettle();
              expect(find.text('Page 1 of 3'), findsOneWidget);
            });
          '''
          replace_once(
              test,
              "    expect(\n      find.text('This offline package could not be opened.'),\n      findsNothing,\n    );\n  });\n}",
              "    expect(\n      find.text('This offline package could not be opened.'),\n      findsNothing,\n    );\n  });" + keyboard_tests + "}\n",
          )
          replace_once(
              test,
              "  required MangaLocalContentLoader loader,\n}) {",
              "  required MangaLocalContentLoader loader,\n  LocalPackageContentManifest manifest = const LocalPackageContentManifest(\n    sourceId: 'local.test',\n    mangaId: 'work-source-1',\n    chapterId: 'chapter-source-1',\n    packageId: 'package-1',\n    sourceContentKind: MangaContentKind.imageSequence,\n    pageCount: 1,\n  ),\n}) {",
          )
          old_manifest = "      manifest: const LocalPackageContentManifest(\n        sourceId: 'local.test',\n        mangaId: 'work-source-1',\n        chapterId: 'chapter-source-1',\n        packageId: 'package-1',\n        sourceContentKind: MangaContentKind.imageSequence,\n        pageCount: 1,\n      ),"
          replace_once(test, old_manifest, "      manifest: manifest,")

          parity = 'docs/manga_product_parity.md'
          replace_once(
              parity,
              '- atalhos/ergonomia desktop;\n',
              '- refinamentos adicionais de ergonomia desktop além dos atalhos básicos;\n',
          )
          replace_once(
              parity,
              '- [ ] Melhorar navegação por teclado/desktop.',
              '- [x] Adicionar navegação básica por teclado no Reader (setas, Page Up/Down, espaço e Escape).',
          )

          issues = 'docs/known_issues_and_deferred_work.md'
          replace_once(
              issues,
              '- atalhos de teclado;\n- fullscreen/controles desktop;\n',
              '- fullscreen/controles desktop adicionais; os atalhos básicos do Reader já estão cobertos;\n',
          )
          PY
          git diff --check

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Format and validate reader checkpoint
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/screens/manga/manga_reader_screen.dart test/widgets/manga/manga_reader_screen_test.dart >/dev/null
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/validate_repository_guards.py
          bash tools/validate_release_workflows.sh
          bash tools/validate_project_health.sh
          git diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/widgets/manga/manga_reader_screen_test.dart

      - name: Commit reviewed checkpoint
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/screens/manga/manga_reader_screen.dart \
            test/widgets/manga/manga_reader_screen_test.dart \
            docs/manga_product_parity.md \
            docs/known_issues_and_deferred_work.md
          git commit -m 'feat(manga): harden reader keyboard navigation'
          test -z "$(git status --porcelain)"

      - name: Fast-forward private Manga branch
        id: publish
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Published Manga reader keyboard SHA ${{ steps.publish.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
