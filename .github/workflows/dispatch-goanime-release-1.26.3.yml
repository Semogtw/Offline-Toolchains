name: Dispatch GoAnime release 1.26.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-goanime-release-1.26.3.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Dispatch full GoAnime release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch release-goanime.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/dispatch.json"
          import json
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "source_ref": "d89b0871509af472506ee1607670f464872cf6a0",
                  "version": "1.26.3",
                  "platforms": "android,windows,linux",
                  "release_notes": "GoAnime 1.26.3 release from validated main d89b0871509af472506ee1607670f464872cf6a0. Full Android, Windows and Linux release published through Offline-Toolchains."
              }
          }))
          PY
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Semogtw/Offline-Toolchains/actions/workflows/release-goanime.yml/dispatches \
            --data-binary @"$RUNNER_TEMP/dispatch.json"
