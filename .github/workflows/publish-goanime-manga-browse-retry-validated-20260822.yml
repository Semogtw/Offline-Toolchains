name: Publish validated GoAnime Manga browse retry fix

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-browse-retry-publish-20260822/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-browse-retry-publish-20260822
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-browse-retry-publish-20260822/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha validation_run < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'feature/manga-platform'
          test "$validation_run" = '32610024252'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Verify exact remote head
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$remote" = "$EXPECTED_SHA"

      - name: Apply exactly validated patches
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          prod="$GITHUB_WORKSPACE/trusted-source/patches/goanime/manga-browse-retry-setstate-20260822.patch"
          tests="$GITHUB_WORKSPACE/trusted-source/patches/goanime/manga-browse-retry-tests-20260822.patch"
          git apply --check "$prod"
          git apply "$prod"
          git apply --check "$tests"
          git apply "$tests"
          git diff --check

      - name: Set up Flutter 3.44.1 formatter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format validated checkpoint
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/screens/manga/manga_home_screen.dart \
            lib/screens/manga/manga_categories_screen.dart \
            lib/screens/manga/manga_library_screen.dart \
            test/widgets/manga/manga_home_screen_test.dart \
            test/widgets/manga/manga_categories_screen_test.dart \
            test/widgets/manga/manga_library_screen_test.dart >/dev/null
          git diff --check

      - name: Commit validated checkpoint
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/screens/manga/manga_home_screen.dart \
            lib/screens/manga/manga_categories_screen.dart \
            lib/screens/manga/manga_library_screen.dart \
            test/widgets/manga/manga_home_screen_test.dart \
            test/widgets/manga/manga_categories_screen_test.dart \
            test/widgets/manga/manga_library_screen_test.dart
          git commit -m 'fix(manga): keep browse retry setState synchronous'
          test -z "$(git status --porcelain)"

      - name: Fast-forward Manga branch
        id: publish
        working-directory: private-source
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          new_sha="$(git rev-parse HEAD)"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/goanime-mobile.git "HEAD:refs/heads/$TARGET_BRANCH"
          echo "sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: echo "Published validation run 32610024252 as ${{ steps.publish.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
