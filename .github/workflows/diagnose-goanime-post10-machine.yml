name: Diagnose GoAnime post-10 Flutter machine

on:
  push:
    branches: [main]
    paths:
      - 'triggers/diagnose-goanime-post10-machine/*.request'

permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
      - id: req
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/diagnose-goanime-post10-machine/*.request' | head -n1)"
          read -r project base candidate < "control/$request"
          test "$project" = goanime
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.req.outputs.candidate }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
      - name: Reproduce v2 derived snapshot
        working-directory: source
        env:
          BASE: ${{ steps.req.outputs.base }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test/services/source/unified_source_stale_fallback_cache_test.dart')
          s=p.read_text()
          marker="import 'package:flutter_test/flutter_test.dart';\n"
          imp="import 'package:goanime_core/goanime_core.dart';\n"
          if imp not in s: s=s.replace(marker, marker+imp, 1)
          p.write_text(s)
          for f,line in [('lib/widgets/goanime_opening.dart',"import 'package:flutter/foundation.dart';\n"),('test/widgets/goanime_opening_test.dart',"import 'package:flutter/painting.dart';\n")]:
              q=Path(f); t=q.read_text(); q.write_text(t.replace(line,'',1))
          PY
          mapfile -t files < <(git diff --name-only "$BASE"..HEAD -- '*.dart')
          files+=(lib/widgets/goanime_opening.dart test/widgets/goanime_opening_test.dart)
          printf '%s\n' "${files[@]}" | sort -u | xargs dart format >/dev/null
          flutter pub get >/dev/null
      - name: Run machine suite and extract first failure
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          flutter test --no-pub --concurrency=1 --machine > "$RUNNER_TEMP/tests.jsonl" 2> "$RUNNER_TEMP/tests.err"
          rc=$?
          set -e
          python3 - "$RUNNER_TEMP/tests.jsonl" "$RUNNER_TEMP/tests.err" "$RUNNER_TEMP/report.json" "$rc" <<'PY'
          import json,re,sys
          events=[]
          stdout_lines=[]
          for raw in open(sys.argv[1],encoding='utf-8',errors='replace'):
              stdout_lines.append(raw)
              try:
                  decoded=json.loads(raw)
              except Exception:
                  continue
              if isinstance(decoded,dict):
                  events.append(decoded)
              elif isinstance(decoded,list):
                  events.extend(item for item in decoded if isinstance(item,dict))
          tests={}
          current=None
          failure=None
          for e in events:
              typ=e.get('type')
              if typ=='testStart':
                  t=e.get('test') or {}
                  if isinstance(t,dict):
                      tests[t.get('id')]=t.get('name')
                      current=t.get('name') or current
              elif typ in ('error','testDone'):
                  tid=e.get('testID') or e.get('testId')
                  name=tests.get(tid,current)
                  if typ=='error' or (typ=='testDone' and e.get('result') in ('failure','error')):
                      failure={
                          'type':typ,
                          'test':name,
                          'error':e.get('error'),
                          'stackTrace':e.get('stackTrace'),
                          'result':e.get('result'),
                      }
                      break
          secret_re=re.compile(r'(?i)(token|secret|password|authorization)(\s*[:=]\s*)\S+')
          err=''.join(open(sys.argv[2],encoding='utf-8',errors='replace').readlines())[-8000:]
          out=''.join(stdout_lines)[-12000:]
          err=secret_re.sub(r'\1\2[redacted]',err)
          out=secret_re.sub(r'\1\2[redacted]',out)
          payload={
              'schemaVersion':2,
              'exitCode':int(sys.argv[4]),
              'firstFailure':failure,
              'stderrTail':err,
              'stdoutTail':out,
          }
          open(sys.argv[3],'w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
          encoded="$(base64 -w0 < "$RUNNER_TEMP/report.json")"
          path="results/diagnose-goanime-post10-machine/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(diagnose): record post-10 machine result $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
          exit "$rc"
