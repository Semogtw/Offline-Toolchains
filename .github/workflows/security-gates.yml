name: Toolchain security gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate shell syntax
        run: |
          bash -n scripts/check-no-private-material.sh
          bash -n scripts/build-fichario-offline.sh
          bash -n tests/fichario-builder-contract.sh
          for script in scripts/goanime-release/*.sh; do
            bash -n "$script"
          done

      - name: Validate GoAnime release PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/goanime-release/windows.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

      - name: Validate Fichário builder contract
        run: bash tests/fichario-builder-contract.sh

      - name: Validate metadata Cloudflare readiness workflow contract
        run: python3 tests/test_goanime_metadata_cloudflare_readiness_workflow.py

      - name: Validate metadata D1 migration workflow contract
        run: python3 tests/test_goanime_metadata_d1_migrate_workflow.py

      - name: Validate public Manga edge probe workflow contract
        run: python3 tests/test_goanime_manga_public_edge_probe_workflow.py

      - name: Reject tracked private material
        run: bash scripts/check-no-private-material.sh
