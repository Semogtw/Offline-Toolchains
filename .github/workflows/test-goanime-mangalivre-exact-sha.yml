name: Test GoAnime MangaLivre exact SHA

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangalivre-exact-test/*.request'

permissions:
  contents: write

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: true
      - name: Resolve request
        id: request
        run: |
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangalivre-exact-test/*.request' | head -n1)"
          read -r project sha < "control/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: source
        run: |
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
      - name: Run MangaLivre fixture contract
        id: check
        working-directory: source
        shell: bash
        run: |
          set +e
          flutter test --no-pub --concurrency=1 test/services/manga/providers/mangalivre_org_manga_provider_test.dart > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic receipt
        if: always()
        working-directory: control
        env:
          SHA: ${{ steps.request.outputs.sha }}
          CODE: ${{ steps.check.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          code="${CODE:-99}"
          tail -n 120 "$RUNNER_TEMP/test.log" 2>/dev/null | sed -E 's#(/home/runner/work/)[^ ]+#<runner-path>#g' > "$RUNNER_TEMP/tail.txt" || true
          mkdir -p results/goanime-mangalivre-exact-test
          python3 - "$RUNNER_TEMP/tail.txt" "results/goanime-mangalivre-exact-test/${SHA}.json" <<'PY'
          import json, os, sys
          tail, out = sys.argv[1:]
          payload={'schemaVersion':1,'goanimeSha':os.environ['SHA'],'testExit':int(os.environ.get('CODE') or 99),'testTail':open(tail,encoding='utf-8',errors='replace').read() if __import__('pathlib').Path(tail).exists() else ''}
          payload['state']='success' if payload['testExit']==0 else 'failure'
          open(out,'w',encoding='utf-8').write(json.dumps(payload,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/goanime-mangalivre-exact-test
          git commit -m "ci(result): record MangaLivre exact test ${SHA:0:8}"
          git push
      - name: Enforce test
        if: steps.check.outputs.code != '0'
        run: exit 1
