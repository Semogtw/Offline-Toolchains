name: Test GoAnime MangaLivre exact SHA

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-mangalivre-exact-test/*.request'

permissions:
  contents: read
concurrency:
  group: goanime-manga-control-results
  cancel-in-progress: false

jobs:
  test:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
      - name: Resolve request
        id: request
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-mangalivre-exact-test/*.request' | head -n1)"
          test -n "$request"
          read -r project sha < "control/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"
      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: source
          fetch-depth: 1
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - working-directory: source
        run: |
          flutter config --no-analytics
          flutter pub get >/dev/null
          (cd packages/goanime_core && dart pub get >/dev/null)
      - name: Run MangaLivre fixture contract
        id: check
        working-directory: source
        shell: bash
        run: |
          set +e
          flutter test --no-pub --concurrency=1 test/services/manga/providers/mangalivre_org_manga_provider_test.dart > "$RUNNER_TEMP/test.log" 2>&1
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Publish diagnostic receipt
        if: always() && steps.request.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          SHA: ${{ steps.request.outputs.sha }}
          CODE: ${{ steps.check.outputs.code }}
        shell: bash
        run: |
          set -euo pipefail
          code="${CODE:-99}"
          tail_text="$(tail -n 120 "$RUNNER_TEMP/test.log" 2>/dev/null | sed -E 's#(/home/runner/work/)[^ ]+#<runner-path>#g' || true)"
          result="$(jq -cn --arg sha "$SHA" --arg code "$code" --arg tail "$tail_text" '{schemaVersion:2,goanimeSha:$sha,testExit:($code|tonumber),testTail:$tail,state:(if ($code|tonumber)==0 then "success" else "failure" end)}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-mangalivre-exact-test/${SHA}.json"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record MangaLivre exact test ${SHA:0:8}" -f content="$encoded")
          if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
      - name: Enforce test
        if: steps.check.outputs.code != '0'
        run: exit 1
