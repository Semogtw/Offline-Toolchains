name: Validate GoAnime manga full Flutter exact

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-full-flutter-exact/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-full-flutter-exact
  cancel-in-progress: false

jobs:
  validate:
    name: Full Flutter validation for exact GoAnime SHA
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact target
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-full-flutter-exact/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify branch head is still exact SHA
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/goanime-mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Full Flutter analyze
        id: analyze
        working-directory: private-source
        run: flutter analyze --no-pub

      - name: Full Flutter tests
        id: tests
        working-directory: private-source
        run: flutter test --no-pub -r compact

      - name: Core package tests
        id: core
        working-directory: private-source/packages/goanime_core
        run: dart test -r compact

      - name: Publish exact sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          SHA: ${{ steps.request.outputs.sha }}
          BRANCH: ${{ steps.request.outputs.branch }}
          ANALYZE: ${{ steps.analyze.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          CORE: ${{ steps.core.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(jq -cn --arg sha "$SHA" --arg branch "$BRANCH" --arg analyze "$ANALYZE" --arg tests "$TESTS" --arg core "$CORE" '{schemaVersion:1,goanimeSha:$sha,branch:$branch,flutterAnalyze:$analyze,flutterTests:$tests,coreTests:$core}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-manga-full-flutter-exact/$SHA.json"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record full Flutter manga gate ${SHA:0:8}" -f content="$encoded")
          if [[ -n "$existing" ]]; then args+=(-f sha="$existing"); fi
          gh api "${args[@]}" >/dev/null

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
