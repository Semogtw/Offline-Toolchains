name: Check GoAnime Experimental prebuffer once

on:
  push:
    paths:
      - '.github/workflows/check-goanime-experimental-prebuffer-once.yml'

permissions:
  contents: read

env:
  GOANIME_SHA: 37dfdf310c66324266f4766a5dfadd75258db835
  FLUTTER_VERSION: 3.44.1

jobs:
  focused-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout exact GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.GOANIME_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: false

      - name: Run focused prebuffer test
        working-directory: goanime
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOANIME_SHA"
          flutter config --no-analytics
          flutter pub get >/dev/null
          flutter test test/services/experimental_prebuffer_policy_test.dart
