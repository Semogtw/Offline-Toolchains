name: Finalize GoAnime format privately

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-format-finalize/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-format-finalize
  cancel-in-progress: false

jobs:
  format:
    name: Format and validate GoAnime private source
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout toolchain request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-format-finalize/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = "goanime"
          [[ "$branch" =~ ^[A-Za-z0-9._/-]{1,200}$ ]]
          [[ "$branch" != /* ]]
          [[ "$branch" != */ ]]
          [[ "$branch" != *..* ]]
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "temp_branch=toolchain/goanime-format-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies privately
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/dev/null 2>&1
          (cd packages/goanime_core && dart pub get >/dev/null 2>&1)

      - name: Apply scoped lint fixes and repository formatter
        id: format
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart fix --apply --code=curly_braces_in_flow_control_structures >/dev/null
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'lib/services/manga/download/manga_download_control_service.dart': [
                  (
                      "    if (parent == null) throw StateError('Unknown manga download: $downloadId.');",
                      "    if (parent == null) {\n      throw StateError('Unknown manga download: $downloadId.');\n    }",
                      1,
                  ),
              ],
              'lib/services/manga/download/manga_download_manager.dart': [
                  (
                      "    if (parent == null) throw StateError('Unknown manga download: $downloadId.');",
                      "    if (parent == null) {\n      throw StateError('Unknown manga download: $downloadId.');\n    }",
                      3,
                  ),
              ],
              'lib/services/manga/download/manga_download_repository.dart': [
                  (
                      "      if (rows.isEmpty) throw StateError('Unknown manga download: $downloadId.');",
                      "      if (rows.isEmpty) {\n        throw StateError('Unknown manga download: $downloadId.');\n      }",
                      1,
                  ),
              ],
              'lib/services/manga/providers/leitura_manga_manga_provider.dart': [
                  (
                      "    if (decoded is! List || decoded.length < 2 || decoded[1] is! String) continue;",
                      "    if (decoded is! List || decoded.length < 2 || decoded[1] is! String) {\n      continue;\n    }",
                      1,
                  ),
              ],
              'test/services/manga/providers/mangaflix_manga_provider_test.dart': [
                  (
                      "      if (request.url.path == '/v1/search/mangas') return _json(searchFixture);",
                      "      if (request.url.path == '/v1/search/mangas') {\n        return _json(searchFixture);\n      }",
                      1,
                  ),
                  (
                      "      if (request.url.path == '/v1/mangas/mf-example') return _json(detailsFixture);",
                      "      if (request.url.path == '/v1/mangas/mf-example') {\n        return _json(detailsFixture);\n      }",
                      1,
                  ),
                  (
                      "      if (request.url.path == '/v1/chapters/mf-ch-20') return _json(chapterFixture);",
                      "      if (request.url.path == '/v1/chapters/mf-ch-20') {\n        return _json(chapterFixture);\n      }",
                      1,
                  ),
              ],
          }

          for raw_path, rules in replacements.items():
              path = Path(raw_path)
              text = path.read_text(encoding='utf-8')
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(
                          f'{raw_path}: expected {expected} exact occurrences, found {count}: {old!r}'
                      )
                  text = text.replace(old, new)
              path.write_text(text, encoding='utf-8')
          PY
          dart format lib test packages tools >/dev/null
          git diff --check
          count="$(git diff --name-only -- '*.dart' | wc -l | tr -d ' ')"
          test "$count" -gt 0
          echo "changed_count=$count" >> "$GITHUB_OUTPUT"
          dart format --output=none --set-exit-if-changed lib test packages tools >/dev/null

      - name: Preserve manga and shared-media functional guarantees
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-pub \
            lib/services/manga \
            lib/screens/manga \
            lib/services/media \
            lib/controllers/media \
            lib/services/providers/provider_health_service.dart \
            test/services/manga \
            test/widgets/manga \
            test/services/media \
            test/controllers/media \
            test/architecture
          flutter test --no-pub test/services/manga/download
          flutter test --no-pub test/services/manga/offline
          flutter test --no-pub test/services/manga/archive
          flutter test --no-pub test/widgets/manga
          flutter test --no-pub test/services/media
          flutter test --no-pub test/controllers/media
          flutter test --no-pub test/architecture/shared_media_infrastructure_guard_test.dart
          flutter test --no-pub test/architecture/manga_offline_persistence_boundary_test.dart
          (cd packages/goanime_core && dart test test/media)

      - name: Commit formatting and scoped lint fixes
        id: commit
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib test packages tools
          git commit -m "style: normalize Dart formatting and flow-control braces" >/dev/null
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Push validated commit to temporary private branch
        working-directory: private-source
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          TEMP_BRANCH: ${{ steps.request.outputs.temp_branch }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$PRIVATE_REPOSITORIES_TOKEN" | base64 -w0)"
          remote_head="$(git -c http.extraheader="AUTHORIZATION: basic $auth" ls-remote https://github.com/Semogtw/GoAnime-Mobile.git "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote_head" = "$EXPECTED_SHA"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push https://github.com/Semogtw/GoAnime-Mobile.git "HEAD:refs/heads/$TEMP_BRANCH" >/dev/null
          unset auth PRIVATE_REPOSITORIES_TOKEN

      - name: Report validated formatter commit safely
        shell: bash
        run: |
          echo "Validated private commit: ${{ steps.commit.outputs.sha }}"
          echo "Formatted Dart files: ${{ steps.format.outputs.changed_count }}"
          echo "Temporary private branch: ${{ steps.request.outputs.temp_branch }}"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"

  report:
    name: Publish sanitized GoAnime formatter result
    if: always()
    needs: [format]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Publish formatter run id and result
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORMAT_RESULT: ${{ needs.format.result }}
          TOOLCHAINS_TRIGGER_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/goanime-format-report.json"
          python3 - "$report" <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          payload = {
              "schemaVersion": 1,
              "runId": int(os.environ["RUN_ID"]),
              "runAttempt": int(os.environ["RUN_ATTEMPT"]),
              "toolchainsTriggerSha": os.environ["TOOLCHAINS_TRIGGER_SHA"],
              "formatResult": os.environ["FORMAT_RESULT"],
              "finishedAt": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(payload, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY
          encoded="$(base64 -w0 < "$report")"
          path="reports/goanime-format-finalize/${RUN_ID}.json"
          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f "message=ci(goanime): report formatter run ${RUN_ID}" \
            -f "content=${encoded}" \
            >/dev/null
