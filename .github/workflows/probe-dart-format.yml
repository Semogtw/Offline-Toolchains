name: Probe Dart formatter layout

on:
  push:
    branches: [main]
    paths:
      - 'triggers/dart-format-probe/*.request'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true
      - name: Format synthetic scheduler variants
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          cat > probe.dart <<'DART'
          class UnifiedEpisode {}

          class Provider {
            Future<List<UnifiedEpisode>> schedule<T>({
              required String providerKey,
              required int priority,
              required int priorityRank,
              required Future<T> Function() operation,
            }) async => await operation() as List<UnifiedEpisode>;
          }

          Future<void> main() async {
            final episodePhaseScheduler = Provider();
            final provider = 'provider';
            final match = 'match';
            final cancellation = Object();
            final index = 0;

            final resolvedA = await episodePhaseScheduler.schedule<List<UnifiedEpisode>>(
              providerKey: provider,
              priority: 0,
              priorityRank: 0,
              operation: () async {
                final providerAggregator = Provider();
                return providerAggregator.schedule<List<UnifiedEpisode>>(
                  providerKey: provider,
                  priority: 0,
                  priorityRank: 0,
                  operation: () async {
                    return <UnifiedEpisode>[];
                  },
                );
              },
            );
            print(resolvedA);

            final resolvedB = await episodePhaseScheduler
                .schedule<List<UnifiedEpisode>>(
                  providerKey: provider,
                  priority: 0,
                  priorityRank: 0,
                  operation: () async {
                    final providerAggregator = Provider();
                    return providerAggregator.schedule<List<UnifiedEpisode>>(
                      providerKey: provider,
                      priority: 0,
                      priorityRank: 0,
                      operation: () async {
                        return <UnifiedEpisode>[];
                      },
                    );
                  },
                );
            print(resolvedB);

            final resolvedC =
                await episodePhaseScheduler.schedule<List<UnifiedEpisode>>(
              providerKey: provider,
              priority: 0,
              priorityRank: 0,
              operation: () async {
                final providerAggregator = Provider();
                return providerAggregator.schedule<List<UnifiedEpisode>>(
                  providerKey: provider,
                  priority: 0,
                  priorityRank: 0,
                  operation: () async {
                    return <UnifiedEpisode>[];
                  },
                );
              },
            );
            print(resolvedC);

            final resolvedD =
                await episodePhaseScheduler
                    .schedule<List<UnifiedEpisode>>(
                  providerKey: provider,
                  priority: 0,
                  priorityRank: 0,
                  operation: () async {
                    final providerAggregator = Provider();
                    return providerAggregator.schedule<List<UnifiedEpisode>>(
                      providerKey: provider,
                      priority: 0,
                      priorityRank: 0,
                      operation: () async {
                        return <UnifiedEpisode>[];
                      },
                    );
                  },
                );
            print(resolvedD);

            final resolvedE = await episodePhaseScheduler
                .schedule<List<UnifiedEpisode>>(
              providerKey: provider,
              priority: 0,
              priorityRank: 0,
              operation: () async {
                final providerAggregator = Provider();
                return providerAggregator.schedule<List<UnifiedEpisode>>(
                  providerKey: provider,
                  priority: 0,
                  priorityRank: 0,
                  operation: () async {
                    return <UnifiedEpisode>[];
                  },
                );
              },
            );
            print(resolvedE);
          }
          DART
          cat > probe_exact.dart <<'DART'
          class UnifiedEpisode {}

          class Provider {
            final String providerKey = 'provider';
          }

          class EpisodeAggregator {
            EpisodeAggregator({
              required Duration episodeSourceTimeout,
              required int maxConcurrentEpisodeLoads,
            });

            Future<List<UnifiedEpisode>> aggregate({
              required List<Object> providerMatches,
              required List<UnifiedEpisode> preliminary,
              required Object cancellation,
              required void Function(List<UnifiedEpisode> snapshot) onPartialResult,
            }) async => <UnifiedEpisode>[];
          }

          class Example {
            Future<void> outer() async {
              Future<void> exact() async {
                final episodePhaseScheduler = Provider();
                final provider = Provider();
                final match = Object();
                final cancellation = Object();
                final index = 0;
                final episodeSourceTimeout = Duration.zero;

                void publishProviderSnapshot(
                  int index,
                  List<UnifiedEpisode> snapshot,
                ) {}

                final resolved = await episodePhaseScheduler
                    .schedule<List<UnifiedEpisode>>(
                      providerKey: provider.providerKey,
                      priority: 0,
                      priorityRank: 0,
                      operation: () async {
                        cancellation.throwIfCancelled();
                        final providerAggregator = EpisodeAggregator(
                          episodeSourceTimeout: episodeSourceTimeout,
                          maxConcurrentEpisodeLoads: 1,
                        );
                        return providerAggregator.aggregate(
                          providerMatches: [match],
                          preliminary: const [],
                          cancellation: cancellation,
                          onPartialResult: (snapshot) {
                            publishProviderSnapshot(index, snapshot);
                          },
                        );
                      },
                    );
                print(resolved);
              }

              await exact();
            }
          }
          DART
          dart format --output=show probe_exact.dart
