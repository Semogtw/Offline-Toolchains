name: Hydra source batch live smoke

on:
  push:
    branches:
      - build/hydra-source-smoke
    paths:
      - .github/workflows/hydra-source-batch-live-smoke.yml

permissions:
  contents: read

concurrency:
  group: hydra-source-batch-live-smoke
  cancel-in-progress: true

jobs:
  batch-smoke:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REF: 446cb57095b5630e518d4465c890dcf9694f3795
    steps:
      - name: Require private repository token
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$READ_TOKEN"

      - name: Checkout exact Hydra revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/HydraPersonalizado
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: private-source/python_rpc/requirements-scrapling.txt

      - name: Install pinned discovery runtime
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/hydra-scrapling-browser" >> "$GITHUB_ENV"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/hydra-scrapling-browser"
          python -m pip install --disable-pip-version-check --requirement python_rpc/requirements-scrapling.txt
          python -m playwright install --with-deps chromium
          python -m patchright install chromium

      - name: Run discovery unit tests at final revision
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_rpc python -m unittest \
            python_rpc/test_source_discovery.py \
            python_rpc/test_source_discovery_batch.py

      - name: Exercise live batched browser sessions without downloads
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=python_rpc python - <<'PY'
          import contextlib
          import io
          import json
          import re
          import urllib.parse
          from lxml import html as lxml_html
          from source_discovery import discover_source
          from source_discovery_batch import discover_sources

          targets = [
              ('ecologica2verde.online', 'https://ecologica2verde.online/'),
              ('ankergames.net', 'https://ankergames.net/'),
              ('gamebounty.world', 'https://gamebounty.world/pt'),
          ]
          blocked = [
              'doubleclick.net', 'googlesyndication.com', 'googleadservices.com',
              'adservice.google.com', 'popads.net', 'popcash.net',
              'propellerads.com', 'adsterra.com', 'monetag.com', 'onclicka.com',
              'exoclick.com', 'trafficstars.com',
          ]
          asset = re.compile(r'\.(?:png|jpe?g|gif|webp|svg|ico|css|js|mjs|woff2?|ttf|otf|mp3|wav|ogg|mp4|webm|mkv|avi|pdf|zip|7z|rar|torrent|exe|msi|dmg|pkg|appimage|deb|rpm)(?:$|[?#])', re.I)
          cta = re.compile(r'\b(?:download|baixar|descargar|torrent|magnet|setup|installer)\b', re.I)

          validated_batches = 0
          for site, target in targets:
              sink = io.StringIO()
              with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  root = discover_source({
                      'url': target,
                      'timeout_ms': 60_000,
                      'max_html_bytes': 1024 * 1024,
                      'max_xhr_bytes': 64 * 1024,
                      'max_xhr_responses': 6,
                      'allow_stealth': True,
                      'blocked_domains': blocked,
                  })

              base = urllib.parse.urlsplit(root['finalUrl'])
              selected = []
              try:
                  document = lxml_html.fromstring(root['html'], base_url=root['finalUrl'])
                  scored = []
                  for index, anchor in enumerate(document.xpath('//a[@href]')):
                      href = (anchor.get('href') or '').strip()
                      text = ' '.join(anchor.itertext()).strip()
                      rel = (anchor.get('rel') or '').lower()
                      if not href or 'sponsored' in rel or cta.search(text):
                          continue
                      url = urllib.parse.urljoin(root['finalUrl'], href)
                      parsed = urllib.parse.urlsplit(url)
                      if parsed.scheme not in {'http', 'https'} or parsed.hostname != base.hostname:
                          continue
                      if asset.search(parsed.path):
                          continue
                      normalized = urllib.parse.urlunsplit((parsed.scheme, parsed.netloc, parsed.path, parsed.query, ''))
                      if normalized == root['finalUrl'] or normalized in selected:
                          continue
                      depth = len([part for part in parsed.path.split('/') if part])
                      score = depth
                      if '/game/' in parsed.path.lower():
                          score += 20
                      if site == 'gamebounty.world' and parsed.path.startswith('/pt/'):
                          score += 10
                      if re.search(r'/(?:privacy|terms|contact|about|login|register)(?:/|$)', parsed.path, re.I):
                          score -= 30
                      scored.append((score, -index, normalized))
                  for _, __, url in sorted(scored, reverse=True):
                      if url not in selected:
                          selected.append(url)
                      if len(selected) >= 2:
                          break
              except Exception:
                  selected = []

              if not selected:
                  print(json.dumps({'site': site, 'batchSkipped': True, 'reason': 'no-safe-internal-pages'}, sort_keys=True))
                  continue

              with contextlib.redirect_stdout(sink), contextlib.redirect_stderr(sink):
                  batch = discover_sources({
                      'urls': selected,
                      'timeout_ms': 45_000,
                      'max_html_bytes': 512 * 1024,
                      'max_xhr_bytes': 64 * 1024,
                      'max_xhr_responses': 4,
                      'allow_stealth': True,
                      'blocked_domains': blocked,
                  })
              if not batch['pages']:
                  raise SystemExit(f'batch returned no pages for {site}')
              validated_batches += 1
              print(json.dumps({
                  'site': site,
                  'requestedPages': len(selected),
                  'returnedPages': len(batch['pages']),
                  'errors': len(batch['errors']),
                  'modes': sorted({page['mode'] for page in batch['pages']}),
                  'statuses': sorted({page['status'] for page in batch['pages'] if page['status'] is not None}),
                  'xhrResponses': sum(len(page['capturedResponses']) for page in batch['pages']),
              }, sort_keys=True))

          if validated_batches < 2:
              raise SystemExit(f'expected at least 2 live batched sites, got {validated_batches}')
          PY

      - name: Remove private checkout and browser material
        if: always()
        shell: bash
        run: |
          rm -rf private-source "$RUNNER_TEMP/hydra-scrapling-browser"
