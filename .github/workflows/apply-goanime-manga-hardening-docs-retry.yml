name: Reconcile GoAnime manga hardening docs status

on:
  push:
    branches:
      - agent/apply-goanime-manga-hardening-docs-retry-20260827
    paths:
      - .github/workflows/apply-goanime-manga-hardening-docs-retry.yml

permissions:
  contents: read

jobs:
  reconcile:
    name: Reconcile private GoAnime hardening documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: fix/catalog-search-manga-regressions-20260826
      REQUIRED_DOCS_CHECKPOINT: e54dc7f320cd30712d79fbc44025fecad0f91e58
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: goanime
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Reconcile design and plan status
        shell: bash
        run: |
          set -euo pipefail
          cd goanime
          git merge-base --is-ancestor "$REQUIRED_DOCS_CHECKPOINT" HEAD

          python3 - <<'PY'
          from pathlib import Path

          def rewrite(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old[:80]!r}')
                  text = text.replace(old, new, 1)
              file.write_text(text.rstrip() + '\n', encoding='utf-8')

          rewrite(
              'docs/superpowers/specs/2026-08-27-manga-readable-catalog-hardening-design.md',
              [
                  (
                      '''## Current state verified in code\n\nThe regression branch already contains the first half of this contract:\n\n- `MangaAvailabilityRecord.isProvenReadable` requires matching source-link/evidence identity;\n- Home uses a bounded `readablePreview` and filters `isProvenReadable`;\n- Categories use `allReadable()` and filter `isProvenReadable`;\n- readable search rejects records without concrete evidence and deduplicates presentation results conservatively;\n- the global SQLite catalog still preserves `listed` occurrences separately from `readable` occurrences so discovery can inventory provider reach without manufacturing readable cards.\n\nTwo gaps remain:\n\n1. persisted readability proof currently survives a failed or skipped stale recheck forever, so `readable` is not a freshness guarantee;\n2. global work assignment is still primarily exact-normalized-title based and does not use historical aliases as a durable identity signal.''',
                      '''## Implemented state verified in code\n\nThe regression branch now enforces the complete contract:\n\n- `MangaAvailabilityRecord.isProvenReadable` requires matching source-link/evidence identity;\n- Home uses a bounded `readablePreview` and filters `isProvenReadable`;\n- Categories use `allReadable()` and filter `isProvenReadable`;\n- readable search rejects records without concrete evidence and deduplicates presentation results conservatively;\n- the global SQLite catalog preserves `listed` separately from `readable` while expiring stale proof fail-closed;\n- failed/inconclusive/degraded/budget-skipped rechecks do not extend stale proof;\n- fresh `listed` occurrences cannot inherit an older `readable` state;\n- carried provider partitions preserve listing while expiring proof older than 30 days;\n- global work assignment preserves exact occurrence identity, then reuses unique historical aliases before the conservative title fallback.'''
                  ),
                  (
                      '''Trusted external IDs (`mal`, `myanimelist`, `anilist`, `mangadex`) remain identity guards. A historical alias that resolves to multiple works is never collapsed merely because the text matches. Existing external IDs are preserved on the canonical work and may be used to detect conflicting historical candidates. The inventory does not add a per-title remote metadata/details fanout solely to obtain external IDs; doing so would make a 10k-work catalog refresh unnecessarily expensive and brittle.''',
                      '''Trusted external IDs (`mal`, `myanimelist`, `anilist`, `mangadex`) remain conflict guards in the existing presentation/search dedupe, and existing IDs are preserved on canonical works. The global alias index itself does not manufacture or remotely fetch IDs: when a historical alias resolves to multiple works, it fails closed instead of collapsing them by text. The inventory does not add a per-title remote metadata/details fanout solely to obtain external IDs; doing so would make a 10k-work catalog refresh unnecessarily expensive and brittle.'''
                  ),
              ],
          )

          rewrite(
              'docs/superpowers/plans/2026-08-27-manga-readable-catalog-hardening.md',
              [
                  ('- [ ] **Step 5: Commit checkpoint**\n\nCommit message: `perf(manga): scale readability verification safely`.', '- [x] **Step 5: Commit checkpoint**\n\nPublished as part of the hardening checkpoints on `fix/catalog-search-manga-regressions-20260826`.'),
                  ('- [ ] **Step 6: Commit checkpoint**\n\nCommit message: `feat(manga): enforce fresh readable catalog evidence`.', '- [x] **Step 6: Commit checkpoint**\n\nPublished as part of the hardening checkpoints on `fix/catalog-search-manga-regressions-20260826`.'),
                  ('- [ ] **Step 8: Commit checkpoint**\n\nCommit message: `fix(manga): reuse durable aliases in canonicalization`.', '- [x] **Step 8: Commit checkpoint**\n\nPublished as part of the hardening checkpoints on `fix/catalog-search-manga-regressions-20260826`.'),
                  ('- [ ] **Step 4: Commit only if test/code changes were needed**\n\nCommit message if needed: `test(manga): lock readable-only catalog surfaces`.', '- [x] **Step 4: Commit only if test/code changes were needed**\n\nNo separate surface-only commit was required; regression coverage shipped with the hardening checkpoints.'),
                  ('- [ ] **Step 4: Run shell/diff guards**', '- [x] **Step 4: Run shell/diff guards**'),
                  ('- [ ] **Step 5: Publish final commit(s) to `fix/catalog-search-manga-regressions-20260826` and verify branch head**', '- [x] **Step 5: Publish final commit(s) to `fix/catalog-search-manga-regressions-20260826` and verify branch head**'),
                  ('Functional code checkpoint: `be1a8a59556bf8587324249144adc95ca6c7d65c`.', 'Functional code checkpoint: `be1a8a59556bf8587324249144adc95ca6c7d65c`. Documentation checkpoint: `e54dc7f320cd30712d79fbc44025fecad0f91e58`.'),
              ],
          )
          PY

          git add \
            docs/superpowers/specs/2026-08-27-manga-readable-catalog-hardening-design.md \
            docs/superpowers/plans/2026-08-27-manga-readable-catalog-hardening.md
          git diff --cached --check

          mapfile -t paths < <(git diff --cached --name-only | sort)
          expected=(
            docs/superpowers/plans/2026-08-27-manga-readable-catalog-hardening.md
            docs/superpowers/specs/2026-08-27-manga-readable-catalog-hardening-design.md
          )
          printf '%s\n' "${expected[@]}" | sort > "$RUNNER_TEMP/expected.txt"
          printf '%s\n' "${paths[@]}" > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt"

      - name: Commit and push without force
        shell: bash
        run: |
          set -euo pipefail
          cd goanime
          git config user.name 'goanime-toolchains-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'docs(manga): reconcile hardening execution status'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
