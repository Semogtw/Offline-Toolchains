name: GoAnime finalizer runtime-overlay apply

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-finalizer-runtime-overlay/*.request'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 8
          persist-credentials: true

      - name: Apply and verify finalizer patch
        run: |
          set -euo pipefail
          python scripts/patch_goanime_finalizer_runtime_overlay.py
          git diff --check
          grep -F "echo 'commit=false'" .github/workflows/goanime-global-catalog-finalize.yml
          grep -F 'latest/mal_provider_availability_map.json' .github/workflows/goanime-global-catalog-finalize.yml
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/goanime-global-catalog-finalize.yml').read_text(encoding='utf-8')
          franchise = text.index('latest/franchise_availability.db')
          title = text.index('latest/title_availability.db')
          provider_map = text.index('latest/mal_provider_availability_map.json')
          manifest = text.index('latest/runtime_database_manifest.json', provider_map)
          if not (franchise < title < provider_map < manifest):
              raise SystemExit('runtime publication order is not payloads-before-manifest')
          PY

      - name: Commit finalizer update
        id: publish
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/goanime-global-catalog-finalize.yml
          git commit -m 'ci(goanime): keep consensus overlay runtime-only'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Record result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ job.status }}
          PUBLISHED_SHA: ${{ steps.publish.outputs.sha }}
        run: |
          set -euo pipefail
          body="$(jq -cn --arg state "$STATE" --arg publishedSha "${PUBLISHED_SHA:-}" --argjson runId "$GITHUB_RUN_ID" '{schemaVersion:1,state:$state,publishedSha:$publishedSha,runId:$runId}')"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='reports/goanime-finalizer-runtime-overlay/latest.json'
          existing="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f "message=ci(goanime): record finalizer runtime-overlay $GITHUB_RUN_ID" -f "content=$encoded" -f "branch=main")
          if [ -n "$existing" ]; then args+=( -f "sha=$existing" ); fi
          gh api "${args[@]}" >/dev/null
