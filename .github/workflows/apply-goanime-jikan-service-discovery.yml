name: Apply GoAnime Jikan service discovery hardening

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-goanime-jikan-service-discovery.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: apply-goanime-jikan-service-discovery
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Report start
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: `<!-- goanime-jikan-service-discovery:${context.runId} -->\n### Apply GoAnime Jikan service discovery hardening\n\n- Run: ${context.runId}\n- Status: started`,
            });

      - name: Checkout verified patch request
        uses: actions/checkout@v6
        with:
          ref: build/source-bundles
          persist-credentials: false

      - name: Verify patch payload
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            02dca7d997d4637cef6ab6a4c66a08bb954f07660d29620bce1c43afb75c906f \
            triggers/goanime-jikan-service-discovery.patch.gz.b64 | \
            sha256sum --check --strict
          base64 --decode \
            triggers/goanime-jikan-service-discovery.patch.gz.b64 | \
            gzip --decompress > \
            "$RUNNER_TEMP/goanime-jikan-service-discovery.patch"
          grep -Fq \
            'Subject: [PATCH 1/2] test(jikan): fail closed on service discovery errors' \
            "$RUNNER_TEMP/goanime-jikan-service-discovery.patch"
          grep -Fq \
            'Subject: [PATCH 2/2] fix(jikan): abort when service discovery fails' \
            "$RUNNER_TEMP/goanime-jikan-service-discovery.patch"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout GoAnime-Mobile Jikan branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          ref: feat/self-hosted-metadata-api-2026-07-30
          path: private-source
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified commits
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          expected_parent=46240ee8d1e473ef9b45b7c0e6acc29ea8d30657
          test "$(git rev-parse HEAD)" = "$expected_parent"
          git am --3way \
            "$RUNNER_TEMP/goanime-jikan-service-discovery.patch"
          git diff --check HEAD~2

      - name: Run focused deployment gates
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          bash infra/jikan/tests/run.sh
          npm --prefix services/metadata-api run check
          npm --prefix services/metadata-api test
          while IFS= read -r -d '' file; do
            php -l "$file" >/dev/null
          done < <(find infra/jikan/docker -type f -name '*.php' -print0)

      - name: Push verified checkpoints
        shell: bash
        working-directory: private-source
        run: |
          set -euo pipefail
          git push origin HEAD:feat/self-hosted-metadata-api-2026-07-30

      - name: Report result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 4,
              body: `<!-- goanime-jikan-service-discovery-result:${context.runId} -->\n### Apply GoAnime Jikan service discovery hardening result\n\n- Run: ${context.runId}\n- Result: ${{ job.status }}`,
            });
