name: Diagnose GoAnime Nox signer current

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-nox-signer-current/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-nox-signer-current
  cancel-in-progress: false

jobs:
  diagnose:
    name: Reproduce current Nox signer/session
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Verify explicit trigger
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-nox-signer-current/*.request' | head -n 1)"
          test -n "$request"
          test "$(tr -d '\r\n' < "control/$request")" = 'noxmangas.org'

      - name: Probe signer and signed catalog API
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/nox-result.json"
          import base64
          import hashlib
          import http.cookiejar
          import json
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://noxmangas.org'
          SITE_ID = '00000000-0000-0000-0000-000000000003'
          API_PATH = '/api/v1/comics'
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          common = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/152.0.0.0 Safari/537.36',
              'Accept-Language': 'pt-BR,pt;q=0.9,en;q=0.8',
              'Referer': BASE + '/',
              'Sec-Fetch-Site': 'same-origin',
          }

          def fetch(url, headers=None):
              req = urllib.request.Request(url, headers={**common, **(headers or {})})
              try:
                  with opener.open(req, timeout=20) as resp:
                      return resp.status, dict(resp.headers), resp.read(2 * 1024 * 1024)
              except urllib.error.HTTPError as exc:
                  return exc.code, dict(exc.headers), exc.read(2 * 1024 * 1024)

          result = {
              'schemaVersion': 1,
              'baseHost': 'noxmangas.org',
              'signerPath': '/_nix/signer.js',
              'apiPath': API_PATH,
          }

          home_status, home_headers, _ = fetch(BASE + '/', {'Accept': 'text/html,*/*;q=0.8'})
          result['homeStatus'] = home_status
          result['cookieCountAfterHome'] = len(list(jar))

          def load_signer():
              status, headers, body = fetch(BASE + '/_nix/signer.js', {'Accept': '*/*'})
              result['signerStatus'] = status
              if status != 200:
                  return None
              script = body.decode('utf-8', 'replace')
              array_match = re.search(r'z\s*=\s*\[(.*?)]', script, re.S)
              slot_match = re.search(r'=\s*r\(z\[(\d+)]\)', script)
              key_match = re.search(r'k\s*=\s*j\(z\.slice\((\d+)\s*,\s*(\d+)\)\)', script)
              token_match = re.search(r't\s*=\s*j\(z\.slice\((\d+)\)\)', script)
              if not all((array_match, slot_match, key_match, token_match)):
                  return None
              parts = [value[::-1] for value in re.findall(r'"([^"]*)"', array_match.group(1))]
              slot_index = int(slot_match.group(1))
              key_start, key_end = map(int, key_match.groups())
              token_start = int(token_match.group(1))
              if slot_index >= len(parts) or key_start < 0 or key_end > len(parts) or token_start > len(parts):
                  return None
              return parts[slot_index], ''.join(parts[key_start:key_end]), ''.join(parts[token_start:])

          def signed_headers(signer):
              slot, key, token = signer
              payload = '|'.join(('GET', API_PATH, SITE_ID, slot, token, key)).encode()
              digest = hashlib.sha256(payload).digest()
              signature = base64.urlsafe_b64encode(digest).decode().rstrip('=')
              return {
                  'Accept': 'application/json',
                  'X-Site-ID': SITE_ID,
                  'X-Web-Slot': slot,
                  'X-Web-Token': token,
                  'X-Web-Signature': signature,
              }

          signer = load_signer()
          result['signerParsed'] = signer is not None
          result['cookieCountAfterSigner'] = len(list(jar))
          if signer is None:
              print(json.dumps(result, sort_keys=True))
              raise SystemExit(1)

          query = urllib.parse.urlencode({'page': '1', 'per_page': '24'})
          api_url = BASE + API_PATH + '?' + query
          status, headers, body = fetch(api_url, signed_headers(signer))
          result['firstApiStatus'] = status
          result['retriedAfter401'] = False
          if status == 401:
              signer = load_signer()
              result['retriedAfter401'] = True
              if signer is not None:
                  status, headers, body = fetch(api_url, signed_headers(signer))
          result['finalApiStatus'] = status
          result['contentType'] = headers.get('Content-Type', '').split(';', 1)[0].lower()
          result['cookieCountFinal'] = len(list(jar))
          try:
              payload = json.loads(body.decode('utf-8', 'replace'))
          except Exception:
              payload = None
          result['jsonBody'] = payload is not None
          if isinstance(payload, dict):
              result['topLevelKeys'] = sorted(str(k) for k in payload.keys())[:20]
              comics = payload.get('comics')
              if isinstance(comics, list):
                  result['comicCount'] = len(comics)
          print(json.dumps(result, sort_keys=True))
          if status != 200 or payload is None:
              raise SystemExit(1)
          PY
          cat "$RUNNER_TEMP/nox-result.json"

      - name: Publish sanitized diagnostic receipt
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          file="$RUNNER_TEMP/nox-result.json"
          test -f "$file" || printf '%s\n' '{"schemaVersion":1,"probe":"not_run"}' > "$file"
          encoded="$(base64 -w0 "$file")"
          path="results/goanime-nox-signer-current/${{ github.run_id }}.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            -f message="ci(result): record current Nox signer diagnostic" \
            -f content="$encoded" >/dev/null

      - name: Remove diagnostic files
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/nox-result.json"
