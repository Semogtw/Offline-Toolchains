name: Refresh private GoAnime catalog and build encrypted APK

on:
  push:
    branches: [main]
    paths:
      - 'triggers/private-goanime-refresh.json'

permissions:
  contents: read

concurrency:
  group: private-goanime-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CACHE_BUILDER_MAX_RUNTIME_MINUTES: '45'

    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-refresh.json"
          sha="$(python3 - "$request" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          sha = str(payload.get('ref') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('ref must be an exact 40-character commit SHA')
          print(sha)
          PY
          )"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || { echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2; exit 1; }

      - name: Checkout private GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source and capture baseline
        id: baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          test "$resolved" = '${{ steps.request.outputs.ref }}'
          work="$RUNNER_TEMP/goanime-refresh"
          mkdir -p "$work/baseline"
          cp assets/data/available_animes.json "$work/baseline/available_animes.json"
          cp assets/data/available_anime_modes.json "$work/baseline/available_anime_modes.json"
          cp assets/data/mal_availability_map.json "$work/baseline/mal_availability_map.json"
          cp assets/data/mal_availability_unmatched.json "$work/baseline/mal_availability_unmatched.json"
          cp assets/data/franchise_availability_map.json "$work/baseline/franchise_availability_map.json"
          python3 - "$work/baseline/stats.json" <<'PY'
          import json, sys
          from pathlib import Path
          def read(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          stats = {
              'titles': len(read('assets/data/available_animes.json')),
              'modes': len(read('assets/data/available_anime_modes.json')),
              'mal': len(read('assets/data/mal_availability_map.json').get('entries') or []),
              'franchises': len(read('assets/data/franchise_availability_map.json').get('franchises') or []),
          }
          Path(sys.argv[1]).write_text(json.dumps(stats, sort_keys=True), encoding='utf-8')
          print('baseline', stats)
          PY
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Discover current season through AniList
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('tools/anime_metadata_seed_targets.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          targets = payload.setdefault('targets', [])
          existing = {x.get('malId') for x in targets if isinstance(x, dict) and isinstance(x.get('malId'), int)}
          now = datetime.now(timezone.utc)
          season = 'WINTER' if now.month <= 3 else 'SPRING' if now.month <= 6 else 'SUMMER' if now.month <= 9 else 'FALL'
          query = '''query ($page:Int!,$year:Int!,$season:MediaSeason!){Page(page:$page,perPage:50){pageInfo{hasNextPage} media(type:ANIME,seasonYear:$year,season:$season,isAdult:false,sort:POPULARITY_DESC){idMal title{english romaji}}}}'''
          discovered = set()
          for page_number in range(1, 5):
              body = json.dumps({'query': query, 'variables': {'page': page_number, 'year': now.year, 'season': season}}).encode()
              document = None
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request('https://graphql.anilist.co', data=body, headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'GoAnime-Mobile-toolchain/1.1'}, method='POST')
                      with urllib.request.urlopen(req, timeout=30) as response:
                          document = json.loads(response.read().decode())
                      break
                  except Exception as error:
                      last_error = error
                      if attempt < 3: time.sleep(attempt * 2)
              if document is None: raise RuntimeError(f'AniList page {page_number} failed: {last_error}')
              if document.get('errors'): raise RuntimeError(str(document['errors']))
              page = document['data']['Page']
              for media in page.get('media') or []:
                  mal_id = media.get('idMal')
                  if not isinstance(mal_id, int) or mal_id <= 0: continue
                  discovered.add(mal_id)
                  title_data = media.get('title') or {}
                  title = title_data.get('english') or title_data.get('romaji') or f'MAL {mal_id}'
                  if mal_id not in existing:
                      targets.append({'malId': mal_id, 'title': str(title).strip()})
                      existing.add(mal_id)
              if not page.get('pageInfo', {}).get('hasNextPage'): break
          if len(discovered) < 20: raise RuntimeError(f'Only {len(discovered)} current-season MAL IDs discovered')
          payload['queries'] = []
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'AniList current season: {season} {now.year}, discovered={len(discovered)}, metadata targets={len(targets)}')
          PY

      - name: Refresh Jikan metadata and broadcasts
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/build_anime_metadata_seed.dart
          cp dist/anime_metadata_cache/anime_metadata_seed.json assets/data/anime_metadata_seed.json
          cp dist/anime_metadata_cache/broadcast_schedule.json assets/data/broadcast_schedule.json

      - name: Build current-season availability targets from fresh metadata
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/.toolchain_current_availability_targets.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:goanime/utils/title_normalizer.dart';
          void main() {
            final metadata = jsonDecode(File('assets/data/anime_metadata_seed.json').readAsStringSync()) as Map<String, dynamic>;
            final malMap = jsonDecode(File('assets/data/mal_availability_map.json').readAsStringSync()) as Map<String, dynamic>;
            final available = (jsonDecode(File('assets/data/available_animes.json').readAsStringSync()) as List).whereType<String>().toList();
            final existingMal = <int>{for (final e in (malMap['entries'] as List? ?? const [])) if (e is Map && e['malId'] is int) e['malId'] as int};
            final availableKeys = <String>{};
            for (final title in available) { availableKeys.addAll(TitleNormalizer.keysForTitle(title)); }
            final now = DateTime.now().toUtc();
            final season = now.month <= 3 ? 'winter' : now.month <= 6 ? 'spring' : now.month <= 9 ? 'summer' : 'fall';
            final targets = <Map<String, dynamic>>[];
            var skipped = 0;
            for (final raw in (metadata['entries'] as List? ?? const [])) {
              if (raw is! Map) continue;
              final e = Map<String, dynamic>.from(raw);
              final malId = e['malId'];
              final title = (e['title'] ?? '').toString().trim();
              if (malId is! int || malId <= 0 || title.isEmpty || e['year'] != now.year || (e['season'] ?? '').toString().toLowerCase() != season) continue;
              final normalized = TitleNormalizer.normalize(title);
              final keys = <String>{...TitleNormalizer.keysForTitle(title)};
              final english = (e['titleEnglish'] ?? '').toString().trim();
              if (english.isNotEmpty) keys.addAll(TitleNormalizer.keysForTitle(english));
              for (final synonym in (e['synonyms'] as List? ?? const [])) { if (synonym is String) keys.addAll(TitleNormalizer.keysForTitle(synonym)); }
              if (existingMal.contains(malId) || keys.any(availableKeys.contains)) { skipped++; continue; }
              targets.add({'title': title, 'malId': malId, 'normalizedTitle': normalized, 'titleEnglish': english.isEmpty ? null : english, 'status': e['status'] ?? '', 'type': 'TV', 'source': 'fresh-metadata-current-season', 'airedFrom': null});
            }
            final out = {'schemaVersion': 1, 'generatedAt': now.toIso8601String(), 'sources': ['fresh-metadata-current-season'], 'skippedExisting': skipped, 'deferredCount': 0, 'targets': targets};
            File('tools/anime_availability_seed_targets.json').writeAsStringSync('${const JsonEncoder.withIndent('  ').convert(out)}\n');
            stdout.writeln('Current-season availability targets: ${targets.length}, skipped existing: $skipped');
          }
          DART
          dart run tools/.toolchain_current_availability_targets.dart
          rm tools/.toolchain_current_availability_targets.dart

      - name: Incrementally audit provider availability
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/cache_builder.dart --seed-only

      - name: Incrementally map only newly available titles to MAL
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['WORK'])
          before = set(json.loads((work/'baseline/available_animes.json').read_text(encoding='utf-8')))
          after = set(json.loads(Path('assets/data/available_animes.json').read_text(encoding='utf-8')))
          new = sorted(after - before)
          (work/'new_titles.json').write_text(json.dumps(new, ensure_ascii=False), encoding='utf-8')
          modes = json.loads(Path('assets/data/available_anime_modes.json').read_text(encoding='utf-8'))
          (work/'new_modes.json').write_text(json.dumps({k:v for k,v in modes.items() if k in set(new)}, ensure_ascii=False), encoding='utf-8')
          (work/'full_available.json').write_text(Path('assets/data/available_animes.json').read_text(encoding='utf-8'), encoding='utf-8')
          (work/'full_modes.json').write_text(Path('assets/data/available_anime_modes.json').read_text(encoding='utf-8'), encoding='utf-8')
          print(f'New provider-confirmed titles: {len(new)}')
          PY
          new_count="$(python3 -c 'import json,os; print(len(json.load(open(os.environ["WORK"]+"/new_titles.json"))))')"
          if [ "$new_count" -gt 0 ]; then
            cp "$WORK/new_titles.json" assets/data/available_animes.json
            cp "$WORK/new_modes.json" assets/data/available_anime_modes.json
            dart run tools/build_mal_availability_cache.dart
            cp assets/data/mal_availability_map.json "$WORK/new_mal_map.json"
            cp assets/data/mal_availability_unmatched.json "$WORK/new_mal_unmatched.json"
            cp "$WORK/full_available.json" assets/data/available_animes.json
            cp "$WORK/full_modes.json" assets/data/available_anime_modes.json
          else
            printf '{"schemaVersion":1,"generatedAt":"","entries":[]}' > "$WORK/new_mal_map.json"
            printf '{"schemaVersion":1,"generatedAt":"","entries":[]}' > "$WORK/new_mal_unmatched.json"
          fi
          cp "$WORK/baseline/mal_availability_map.json" assets/data/mal_availability_map.json
          cp "$WORK/baseline/mal_availability_unmatched.json" assets/data/mal_availability_unmatched.json
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          work = Path(os.environ['WORK'])
          old = json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          fresh = json.loads((work/'new_mal_map.json').read_text(encoding='utf-8'))
          modes = json.loads(Path('assets/data/available_anime_modes.json').read_text(encoding='utf-8'))
          by_id = {int(e['malId']): e for e in old.get('entries', []) if isinstance(e, dict) and isinstance(e.get('malId'), int)}
          old_ids = set(by_id)
          for entry in fresh.get('entries', []):
              if not isinstance(entry, dict) or not isinstance(entry.get('malId'), int): continue
              mid = int(entry['malId'])
              if mid in by_id:
                  cur = by_id[mid]
                  cur['matchedAvailableTitles'] = sorted(set(cur.get('matchedAvailableTitles') or []) | set(entry.get('matchedAvailableTitles') or []))
                  cm = cur.setdefault('modes', {'sub': False, 'dub': False}); em = entry.get('modes') or {}
                  cm['sub'] = bool(cm.get('sub')) or bool(em.get('sub')); cm['dub'] = bool(cm.get('dub')) or bool(em.get('dub'))
                  if float(entry.get('matchConfidence') or 0) > float(cur.get('matchConfidence') or 0):
                      for key in ('canonicalTitle','titleEnglish','titleJapanese','year','season','type','episodes','matchConfidence','matchType'):
                          if key in entry: cur[key] = entry[key]
              else:
                  by_id[mid] = entry
          for entry in by_id.values():
              matched = [t for t in entry.get('matchedAvailableTitles') or [] if t in modes]
              if matched:
                  entry['modes'] = {'sub': any(bool(modes[t].get('sub')) for t in matched), 'dub': any(bool(modes[t].get('dub')) for t in matched)}
          old['generatedAt'] = datetime.now(timezone.utc).isoformat()
          old['entries'] = sorted(by_id.values(), key=lambda e: int(e.get('malId') or 0))
          Path('assets/data/mal_availability_map.json').write_text(json.dumps(old, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          old_u = json.loads(Path('assets/data/mal_availability_unmatched.json').read_text(encoding='utf-8'))
          new_u = json.loads((work/'new_mal_unmatched.json').read_text(encoding='utf-8'))
          merged = {}
          for e in list(old_u.get('entries') or []) + list(new_u.get('entries') or []):
              if isinstance(e, dict): merged[(str(e.get('normalizedTitle') or ''), str(e.get('availableTitle') or ''))] = e
          old_u['generatedAt'] = datetime.now(timezone.utc).isoformat(); old_u['entries'] = sorted(merged.values(), key=lambda e:(str(e.get('normalizedTitle') or ''), str(e.get('availableTitle') or '')))
          Path('assets/data/mal_availability_unmatched.json').write_text(json.dumps(old_u, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          new_ids = sorted(set(by_id) - old_ids)
          (work/'new_mal_ids.txt').write_text('\n'.join(map(str,new_ids)), encoding='utf-8')
          print(f'MAL entries: {len(by_id)} (+{len(new_ids)})')
          PY

      - name: Rebuild derived availability databases
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          dart run tools/build_title_availability_database.dart
          if [ -s "$WORK/new_mal_ids.txt" ]; then
            args=()
            while IFS= read -r id; do [ -n "$id" ] && args+=("--mal-id=$id"); done < "$WORK/new_mal_ids.txt"
            dart run tools/build_franchise_availability_cache.dart "${args[@]}"
          else
            echo 'No new MAL IDs; preserving franchise graph cache.'
          fi
          dart run tools/build_franchise_runtime_artifacts.dart

      - name: Validate refreshed catalog cannot regress
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          work=Path(os.environ['WORK']); baseline=json.loads((work/'baseline/stats.json').read_text())
          def read(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          titles=read('assets/data/available_animes.json'); modes=read('assets/data/available_anime_modes.json')
          mal=read('assets/data/mal_availability_map.json').get('entries') or []
          franchises=read('assets/data/franchise_availability_map.json').get('franchises') or []
          metadata=read('assets/data/anime_metadata_seed.json'); broadcasts=read('assets/data/broadcast_schedule.json').get('entries') or {}
          now=datetime.now(timezone.utc); season='winter' if now.month<=3 else 'spring' if now.month<=6 else 'summer' if now.month<=9 else 'fall'
          current=[e for e in metadata.get('entries') or [] if e.get('year')==now.year and str(e.get('season') or '').lower()==season and str(e.get('imageUrl') or '').strip()]
          current_stats={'titles':len(titles),'modes':len(modes),'mal':len(mal),'franchises':len(franchises)}
          for key in ('titles','modes','mal','franchises'):
              if current_stats[key] < baseline[key]: raise SystemExit(f'{key} regressed: {current_stats[key]} < {baseline[key]}')
          if len(current) < 10: raise SystemExit(f'current metadata too small: {len(current)}')
          if len(broadcasts) < 5: raise SystemExit(f'broadcast snapshot too small: {len(broadcasts)}')
          db=sqlite3.connect('assets/data/title_availability.db')
          try: db_titles=db.execute('select count(*) from title_availability').fetchone()[0]
          finally: db.close()
          if db_titles < baseline['titles']: raise SystemExit(f'title DB regressed: {db_titles} < {baseline["titles"]}')
          print('validated', current_stats, f'current={len(current)} broadcasts={len(broadcasts)} title_db={db_titles}')
          PY

      - name: Run project gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./tools/validate_project_health.ps1
          dart format --output=none --set-exit-if-changed lib test packages tools
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=2
          (cd packages/goanime_core && dart test)
          pwsh ./tools/validate_release_workflows.ps1

      - name: Commit refreshed caches back to private main
        id: publish
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/anime_metadata_seed_targets.json \
            tools/anime_availability_seed_targets.json \
            assets/data/anime_metadata_seed.json \
            assets/data/broadcast_schedule.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_availability_map.json \
            assets/data/mal_availability_unmatched.json \
            assets/data/title_availability.db \
            assets/data/franchise_availability_map.json \
            assets/data/franchise_index.json \
            assets/data/franchise_availability.db
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
          else
            git commit -m 'chore(catalog): refresh current anime caches'
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != '${{ steps.request.outputs.ref }}' ]; then
            git rebase origin/main
          fi
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi
          final_sha="$(git rev-parse HEAD)"
          echo "sha=$final_sha" >> "$GITHUB_OUTPUT"
          echo "Published private SHA: $final_sha"

      - name: Build Android debug APK from refreshed caches
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Validate and encrypt APK
        id: package
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.publish.outputs.sha }}
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/private-source/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          work="$RUNNER_TEMP/goanime-apk"; gpg_home="$work/gpg"; mkdir -p "$gpg_home" "$work/transfer"; chmod 700 "$gpg_home"; export GNUPGHOME="$gpg_home"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"; size="$(stat -c '%s' "$apk")"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"; test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          encrypted="$work/transfer/GoAnime-${SOURCE_SHA:0:12}-debug.apk.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted" --encrypt "$apk"
          python3 - "$work/transfer/manifest.json" "$SOURCE_SHA" "$sha256" "$size" <<'PY'
          import datetime,json,sys
          path,source_sha,sha256,size=sys.argv[1:]
          data={'schema_version':1,'source_sha':source_sha,'build_type':'debug','apk_sha256':sha256,'apk_size_bytes':int(size),'encryption':'OpenPGP','recipient_fingerprint':'2DE29DC31427CF0A911AB96175679291435059B0','created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          open(path,'w',encoding='utf-8').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf "$GITHUB_WORKSPACE/private-source" "$gpg_home"
          echo "transfer_dir=$work/transfer" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "apk_size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted APK
        uses: actions/upload-artifact@v7
        with:
          name: goanime-private-refreshed-debug-apk-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        shell: bash
        run: |
          echo '## GoAnime incremental catalog refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "- Private source/cache commit: \`${{ steps.publish.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: \`${{ steps.package.outputs.apk_sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Availability refresh was incremental; baseline caches were not allowed to shrink.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Only OpenPGP ciphertext was uploaded by the public Toolchains repository.' >> "$GITHUB_STEP_SUMMARY"
