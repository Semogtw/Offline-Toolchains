name: Refresh private GoAnime catalog and build encrypted APK

on:
  push:
    branches: [main]
    paths:
      - 'triggers/private-goanime-refresh.json'

permissions:
  contents: read

concurrency:
  group: private-goanime-refresh
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CACHE_BUILDER_MAX_RUNTIME_MINUTES: '90'

    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Read and validate request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$GITHUB_WORKSPACE/trusted-source/triggers/private-goanime-refresh.json"
          sha="$(python3 - "$request" <<'PY'
          import json, re, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          sha = str(payload.get('ref') or '').strip().lower()
          if not re.fullmatch(r'[0-9a-f]{40}', sha):
              raise SystemExit('ref must be an exact 40-character commit SHA')
          print(sha)
          PY
          )"
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

      - name: Require read-only private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || { echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2; exit 1; }

      - name: Checkout private GoAnime source read-only
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.ref }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source and capture baseline
        id: baseline
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-parse HEAD)"
          test "$resolved" = '${{ steps.request.outputs.ref }}'
          work="$RUNNER_TEMP/goanime-refresh"
          mkdir -p "$work/baseline"
          cp assets/data/available_animes.json "$work/baseline/available_animes.json"
          cp assets/data/available_anime_modes.json "$work/baseline/available_anime_modes.json"
          cp assets/data/mal_availability_map.json "$work/baseline/mal_availability_map.json"
          cp assets/data/mal_availability_unmatched.json "$work/baseline/mal_availability_unmatched.json"
          cp assets/data/franchise_availability_map.json "$work/baseline/franchise_availability_map.json"
          cp assets/data/anime_metadata_seed.json "$work/baseline/anime_metadata_seed.json"
          python3 - "$work/baseline/stats.json" <<'PY'
          import json, sys
          from pathlib import Path
          def read(path): return json.loads(Path(path).read_text(encoding='utf-8'))
          stats = {
              'titles': len(read('assets/data/available_animes.json')),
              'modes': len(read('assets/data/available_anime_modes.json')),
              'mal': len(read('assets/data/mal_availability_map.json').get('entries') or []),
              'franchises': len(read('assets/data/franchise_availability_map.json').get('franchises') or []),
              'metadata': len(read('assets/data/anime_metadata_seed.json').get('entries') or []),
          }
          Path(sys.argv[1]).write_text(json.dumps(stats, sort_keys=True), encoding='utf-8')
          print('baseline', stats)
          PY
          echo "work=$work" >> "$GITHUB_OUTPUT"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd private-source
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Discover current season through AniList
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('tools/anime_metadata_seed_targets.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          targets = payload.setdefault('targets', [])
          existing = {x.get('malId') for x in targets if isinstance(x, dict) and isinstance(x.get('malId'), int)}
          now = datetime.now(timezone.utc)
          season = 'WINTER' if now.month <= 3 else 'SPRING' if now.month <= 6 else 'SUMMER' if now.month <= 9 else 'FALL'
          query = '''query ($page:Int!,$year:Int!,$season:MediaSeason!){Page(page:$page,perPage:50){pageInfo{hasNextPage} media(type:ANIME,seasonYear:$year,season:$season,isAdult:false,sort:POPULARITY_DESC){idMal title{english romaji}}}}'''
          discovered = set()
          for page_number in range(1, 5):
              body = json.dumps({'query': query, 'variables': {'page': page_number, 'year': now.year, 'season': season}}).encode()
              document = None
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = urllib.request.Request('https://graphql.anilist.co', data=body, headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':'GoAnime-Mobile-toolchain/1.1'}, method='POST')
                      with urllib.request.urlopen(req, timeout=30) as response:
                          document = json.loads(response.read().decode())
                      break
                  except Exception as error:
                      last_error = error
                      if attempt < 3: time.sleep(attempt * 2)
              if document is None: raise RuntimeError(f'AniList page {page_number} failed: {last_error}')
              if document.get('errors'): raise RuntimeError(str(document['errors']))
              page = document['data']['Page']
              for media in page.get('media') or []:
                  mal_id = media.get('idMal')
                  if not isinstance(mal_id, int) or mal_id <= 0: continue
                  discovered.add(mal_id)
                  title_data = media.get('title') or {}
                  title = title_data.get('english') or title_data.get('romaji') or f'MAL {mal_id}'
                  if mal_id not in existing:
                      targets.append({'malId': mal_id, 'title': str(title).strip()})
                      existing.add(mal_id)
              if not page.get('pageInfo', {}).get('hasNextPage'): break
          if len(discovered) < 20: raise RuntimeError(f'Only {len(discovered)} current-season MAL IDs discovered')
          payload['queries'] = []
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'AniList current season: {season} {now.year}, discovered={len(discovered)}, metadata targets={len(targets)}')
          PY

      - name: Refresh Jikan metadata and broadcasts for discovery targets
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/build_anime_metadata_seed.dart
          cp dist/anime_metadata_cache/anime_metadata_seed.json assets/data/anime_metadata_seed.json
          cp dist/anime_metadata_cache/broadcast_schedule.json assets/data/broadcast_schedule.json

      - name: Build current-season availability targets from fresh metadata
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          cat > tools/.toolchain_current_availability_targets.dart <<'DART'
          import 'dart:convert';
          import 'dart:io';
          import 'package:goanime/utils/title_normalizer.dart';
          void main() {
            final metadata = jsonDecode(File('assets/data/anime_metadata_seed.json').readAsStringSync()) as Map<String, dynamic>;
            final malMap = jsonDecode(File('assets/data/mal_availability_map.json').readAsStringSync()) as Map<String, dynamic>;
            final available = (jsonDecode(File('assets/data/available_animes.json').readAsStringSync()) as List).whereType<String>().toList();
            final existingMal = <int>{for (final e in (malMap['entries'] as List? ?? const [])) if (e is Map && e['malId'] is int) e['malId'] as int};
            final availableKeys = <String>{};
            for (final title in available) { availableKeys.addAll(TitleNormalizer.keysForTitle(title)); }
            final now = DateTime.now().toUtc();
            final season = now.month <= 3 ? 'winter' : now.month <= 6 ? 'spring' : now.month <= 9 ? 'summer' : 'fall';
            final targets = <Map<String, dynamic>>[];
            var skipped = 0;
            for (final raw in (metadata['entries'] as List? ?? const [])) {
              if (raw is! Map) continue;
              final e = Map<String, dynamic>.from(raw);
              final malId = e['malId'];
              final title = (e['title'] ?? '').toString().trim();
              if (malId is! int || malId <= 0 || title.isEmpty || e['year'] != now.year || (e['season'] ?? '').toString().toLowerCase() != season) continue;
              final normalized = TitleNormalizer.normalize(title);
              final keys = <String>{...TitleNormalizer.keysForTitle(title)};
              final english = (e['titleEnglish'] ?? '').toString().trim();
              if (english.isNotEmpty) keys.addAll(TitleNormalizer.keysForTitle(english));
              for (final synonym in (e['synonyms'] as List? ?? const [])) { if (synonym is String) keys.addAll(TitleNormalizer.keysForTitle(synonym)); }
              if (existingMal.contains(malId) || keys.any(availableKeys.contains)) { skipped++; continue; }
              targets.add({'title': title, 'malId': malId, 'normalizedTitle': normalized, 'titleEnglish': english.isEmpty ? null : english, 'status': e['status'] ?? '', 'type': 'TV', 'source': 'fresh-metadata-current-season', 'airedFrom': null});
            }
            final out = {'schemaVersion': 1, 'generatedAt': now.toIso8601String(), 'sources': ['fresh-metadata-current-season'], 'skippedExisting': skipped, 'deferredCount': 0, 'targets': targets};
            File('tools/anime_availability_seed_targets.json').writeAsStringSync('${const JsonEncoder.withIndent('  ').convert(out)}\n');
            stdout.writeln('Current-season availability targets: ${targets.length}, skipped existing: $skipped');
          }
          DART
          dart run tools/.toolchain_current_availability_targets.dart
          rm tools/.toolchain_current_availability_targets.dart

      - name: Refresh provider availability with guarded network fallback
        id: provider
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L --max-time 20 --silent --show-error -o "$RUNNER_TEMP/animefire-preflight.html" -w '%{http_code}' \
            -A 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36' \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8' \
            https://animefire.io/animes-atualizados || true)"
          if [ "$code" = '200' ]; then
            echo 'Provider catalog is directly reachable; running full audit.'
            dart run tools/cache_builder.dart
            echo 'status=full-provider-audit' >> "$GITHUB_OUTPUT"
          else
            echo "AnimeFire is blocked from this hosted runner (HTTP $code). Preserving the complete baseline and running only bounded incremental probes."
            dart run tools/cache_builder.dart --seed-only
            echo 'status=provider-blocked-baseline-plus-runtime-discovery' >> "$GITHUB_OUTPUT"
          fi
          rm -f "$RUNNER_TEMP/animefire-preflight.html"

      - name: Map every unprocessed provider title through checkpointed strict MAL mapping
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart run tools/build_mal_availability_cache_checkpointed.dart --incremental

      - name: Capture newly mapped MAL IDs and rebuild rich metadata
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ['WORK'])
          old = json.loads((work/'baseline/mal_availability_map.json').read_text(encoding='utf-8'))
          new = json.loads(Path('assets/data/mal_availability_map.json').read_text(encoding='utf-8'))
          old_ids = {int(e['malId']) for e in old.get('entries') or [] if isinstance(e, dict) and isinstance(e.get('malId'), int)}
          new_ids = {int(e['malId']) for e in new.get('entries') or [] if isinstance(e, dict) and isinstance(e.get('malId'), int)}
          added = sorted(new_ids - old_ids)
          (work/'new_mal_ids.txt').write_text('\n'.join(map(str, added)), encoding='utf-8')
          print(f'MAL entries: {len(new_ids)} (+{len(added)})')
          PY
          dart run tools/build_anime_metadata_seed.dart
          cp dist/anime_metadata_cache/anime_metadata_seed.json assets/data/anime_metadata_seed.json
          cp dist/anime_metadata_cache/broadcast_schedule.json assets/data/broadcast_schedule.json
          sha256sum assets/data/anime_metadata_seed.json | awk '{print $1}' > assets/data/anime_metadata_seed.json.sha256

      - name: Rebuild derived availability databases
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          dart run tools/build_title_availability_database.dart
          if [ -s "$WORK/new_mal_ids.txt" ]; then
            args=()
            while IFS= read -r id; do [ -n "$id" ] && args+=("--mal-id=$id"); done < "$WORK/new_mal_ids.txt"
            dart run tools/build_franchise_availability_cache.dart "${args[@]}"
            dart run tools/postprocess_franchise_availability_cache.dart --write
          else
            echo 'No new MAL IDs; preserving franchise graph cache.'
          fi
          dart run tools/build_franchise_runtime_artifacts.dart

      - name: Validate refreshed catalog, terminal mapping decisions, and rich metadata coverage
        id: validate
        working-directory: private-source
        shell: bash
        env:
          WORK: ${{ steps.baseline.outputs.work }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, sqlite3
          from datetime import datetime, timezone
          from pathlib import Path
          work = Path(os.environ['WORK'])
          baseline = json.loads((work/'baseline/stats.json').read_text(encoding='utf-8'))
          def read(p): return json.loads(Path(p).read_text(encoding='utf-8'))
          titles = read('assets/data/available_animes.json')
          modes = read('assets/data/available_anime_modes.json')
          mal_doc = read('assets/data/mal_availability_map.json')
          unmatched_doc = read('assets/data/mal_availability_unmatched.json')
          franchises = read('assets/data/franchise_availability_map.json').get('franchises') or []
          metadata_doc = read('assets/data/anime_metadata_seed.json')
          broadcasts = read('assets/data/broadcast_schedule.json').get('entries') or {}
          mal = mal_doc.get('entries') or []
          unmatched = unmatched_doc.get('entries') or []
          metadata = metadata_doc.get('entries') or []
          source = set(titles)
          matched = {title for entry in mal for title in (entry.get('matchedAvailableTitles') or []) if isinstance(title, str)}
          terminal = {entry.get('normalizedTitle') for entry in unmatched if isinstance(entry, dict) and entry.get('reason') != 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          retryable = {entry.get('normalizedTitle') for entry in unmatched if isinstance(entry, dict) and entry.get('reason') == 'jikan_error' and isinstance(entry.get('normalizedTitle'), str)}
          pending = source - matched - terminal
          if retryable & source:
              raise SystemExit(f'{len(retryable & source)} transient Jikan errors remain')
          if pending:
              raise SystemExit(f'{len(pending)} provider titles still lack a terminal MAL mapping decision')
          stats = {'titles': len(titles), 'modes': len(modes), 'mal': len(mal), 'franchises': len(franchises), 'metadata': len(metadata)}
          for key in ('titles', 'modes', 'mal', 'franchises', 'metadata'):
              if stats[key] < baseline[key]: raise SystemExit(f'{key} regressed: {stats[key]} < {baseline[key]}')
          mal_ids = {int(e['malId']) for e in mal if isinstance(e, dict) and isinstance(e.get('malId'), int)}
          metadata_ids = {int(e['malId']) for e in metadata if isinstance(e, dict) and isinstance(e.get('malId'), int)}
          rich_coverage = len(mal_ids & metadata_ids) / len(mal_ids) if mal_ids else 0.0
          if rich_coverage < 0.90: raise SystemExit(f'Rich metadata coverage below 90%: {rich_coverage:.3%}')
          digest = hashlib.sha256(Path('assets/data/anime_metadata_seed.json').read_bytes()).hexdigest()
          expected = Path('assets/data/anime_metadata_seed.json.sha256').read_text(encoding='utf-8').strip().lower()
          if digest != expected: raise SystemExit('Bundled metadata SHA-256 does not match rebuilt seed')
          now = datetime.now(timezone.utc)
          season = 'winter' if now.month <= 3 else 'spring' if now.month <= 6 else 'summer' if now.month <= 9 else 'fall'
          current = [e for e in metadata if e.get('year') == now.year and str(e.get('season') or '').lower() == season and str(e.get('imageUrl') or '').strip()]
          if len(current) < 10: raise SystemExit(f'current metadata too small: {len(current)}')
          if len(broadcasts) < 5: raise SystemExit(f'broadcast snapshot too small: {len(broadcasts)}')
          db = sqlite3.connect('assets/data/title_availability.db')
          try: db_titles = db.execute('select count(*) from title_availability').fetchone()[0]
          finally: db.close()
          if db_titles < len(source): raise SystemExit(f'title DB incomplete: {db_titles} < {len(source)}')
          result = {
              **stats,
              'matched_provider_titles': len(matched & source),
              'terminal_unmatched_titles': len(terminal & source),
              'rich_mal_coverage': round(rich_coverage, 6),
              'title_db_rows': db_titles,
              'mal_generated_at': mal_doc.get('generatedAt'),
              'metadata_generated_at': metadata_doc.get('generatedAt'),
          }
          Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8').write('stats=' + json.dumps(result, separators=(',', ':')) + '\n')
          print('validated', json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Run project gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          pwsh ./tools/validate_project_health.ps1
          dart format --output=none --set-exit-if-changed lib test packages tools
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=2
          (cd packages/goanime_core && dart test)
          pwsh ./tools/validate_release_workflows.ps1

      - name: Build Android debug APK from refreshed caches
        working-directory: private-source
        run: flutter build apk --debug --no-pub

      - name: Encrypt APK and refreshed cache handoff
        id: package
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
          PROVIDER_AUDIT_STATUS: ${{ steps.provider.outputs.status }}
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/private-source/build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          work="$RUNNER_TEMP/goanime-handoff"
          gpg_home="$work/gpg"
          transfer="$work/transfer"
          rm -rf "$work"
          mkdir -p "$gpg_home" "$transfer"
          chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          cache_archive="$work/goanime-catalog-refresh.tar.gz"
          tar -C "$GITHUB_WORKSPACE/private-source" -czf "$cache_archive" \
            tools/anime_metadata_seed_targets.json \
            tools/anime_availability_seed_targets.json \
            assets/data/anime_metadata_seed.json \
            assets/data/anime_metadata_seed.json.sha256 \
            assets/data/broadcast_schedule.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_availability_map.json \
            assets/data/mal_availability_unmatched.json \
            assets/data/title_availability.db \
            assets/data/franchise_availability_map.json \
            assets/data/franchise_index.json \
            assets/data/franchise_availability.db
          tar -tzf "$cache_archive" >/dev/null
          apk_sha256="$(sha256sum "$apk" | awk '{print $1}')"
          apk_size="$(stat -c '%s' "$apk")"
          cache_sha256="$(sha256sum "$cache_archive" | awk '{print $1}')"
          cache_size="$(stat -c '%s' "$cache_archive")"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          test -z "$(gpg --batch --with-colons --list-secret-keys 2>/dev/null | awk -F: '$1 == "sec" { print $1 }')"
          encrypted_apk="$transfer/GoAnime-refreshed-debug.apk.gpg"
          encrypted_cache="$transfer/GoAnime-refreshed-catalog.tar.gz.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted_apk" --encrypt "$apk"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted_cache" --encrypt "$cache_archive"
          test -s "$encrypted_apk"
          test -s "$encrypted_cache"
          python3 - "$transfer/manifest.json" "$apk_sha256" "$apk_size" "$cache_sha256" "$cache_size" "$GITHUB_RUN_ID" <<'PY'
          import datetime,json,os,sys
          path,apk_sha256,apk_size,cache_sha256,cache_size,run_id=sys.argv[1:]
          data={
              'schema_version':3,
              'project':'goanime',
              'refresh_mode':os.environ.get('PROVIDER_AUDIT_STATUS') or 'unknown',
              'mapping_mode':'checkpointed-strict-full-current-catalog',
              'build_type':'debug',
              'apk_sha256':apk_sha256,
              'apk_size_bytes':int(apk_size),
              'catalog_archive_sha256':cache_sha256,
              'catalog_archive_size_bytes':int(cache_size),
              'encryption':'OpenPGP',
              'recipient_fingerprint':'2DE29DC31427CF0A911AB96175679291435059B0',
              'workflow_run_id':run_id,
              'retention_days':1,
              'created_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          open(path,'w',encoding='utf-8').write(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          rm -rf "$gpg_home" "$cache_archive"
          echo "transfer_dir=$transfer" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"
          echo "catalog_sha256=$cache_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted recoverable handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-private-full-refresh-encrypted
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Optionally commit refreshed caches back to private main
        working-directory: private-source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$WRITE_TOKEN" ]; then
            echo 'GOANIME_CATALOG_WRITE_TOKEN is not configured; encrypted cache handoff was uploaded for trusted external persistence.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/anime_metadata_seed_targets.json \
            tools/anime_availability_seed_targets.json \
            assets/data/anime_metadata_seed.json \
            assets/data/anime_metadata_seed.json.sha256 \
            assets/data/broadcast_schedule.json \
            assets/data/available_animes.json \
            assets/data/available_anime_modes.json \
            assets/data/mal_availability_map.json \
            assets/data/mal_availability_unmatched.json \
            assets/data/title_availability.db \
            assets/data/franchise_availability_map.json \
            assets/data/franchise_index.json \
            assets/data/franchise_availability.db
          if git diff --cached --quiet; then
            echo 'No cache changes to commit.'
            exit 0
          fi
          git commit -m 'chore(catalog): refresh current anime caches'
          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          extraheader="AUTHORIZATION: basic $auth"
          git -c http.https://github.com/.extraheader="$extraheader" fetch origin main
          if [ "$(git rev-parse origin/main)" != '${{ steps.request.outputs.ref }}' ]; then
            git rebase origin/main
          fi
          git -c http.https://github.com/.extraheader="$extraheader" push origin HEAD:main
          unset auth extraheader WRITE_TOKEN
          echo 'Catalog refresh published to private main without persisting write credentials.'

      - name: Summary
        if: always()
        shell: bash
        env:
          STATS: ${{ steps.validate.outputs.stats }}
        run: |
          echo '## GoAnime full catalog refresh' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ref: \`${{ steps.request.outputs.ref }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- Provider refresh status: \`${{ steps.provider.outputs.status }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo '- MAL mapping: checkpointed strict incremental mapping over the complete current provider catalog.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Rich metadata is rebuilt after MAL mapping, so newly mapped IDs are included in the same refresh.' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$STATS" ]; then echo "- Validated stats: \`$STATS\`." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n '${{ steps.package.outputs.apk_sha256 }}' ]; then echo "- APK SHA-256: \`${{ steps.package.outputs.apk_sha256 }}\`." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -n '${{ steps.package.outputs.catalog_sha256 }}' ]; then echo "- Catalog archive SHA-256: \`${{ steps.package.outputs.catalog_sha256 }}\`." >> "$GITHUB_STEP_SUMMARY"; fi
          if [ '${{ steps.provider.outputs.status }}' != 'full-provider-audit' ]; then
            echo '- Hosted runner provider access was blocked; the validated complete baseline was preserved and bounded runtime discovery remains enabled.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- Matching thresholds were not relaxed.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Only OpenPGP ciphertext is uploaded by the public Toolchains repository.' >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all private and transient data
        if: always()
        shell: bash
        run: |
          rm -rf "$GITHUB_WORKSPACE/private-source"
          rm -rf "$GITHUB_WORKSPACE/trusted-source"
          rm -rf "$RUNNER_TEMP/goanime-refresh"
          rm -rf "$RUNNER_TEMP/goanime-handoff"
