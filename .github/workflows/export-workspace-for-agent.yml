name: Export workspace for agent

on:
  pull_request:
    paths:
      - .github/workflows/export-workspace-for-agent.yml
      - docs/superpowers/specs/2026-07-31-artifact-platform-v2-design.md
      - docs/superpowers/plans/2026-07-31-artifact-platform-v2.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create workspace archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/export"
          git archive --format=tar HEAD | zstd -T0 -6 -o "$RUNNER_TEMP/export/offline-toolchains-workspace.tar.zst"
          sha256sum "$RUNNER_TEMP/export/offline-toolchains-workspace.tar.zst" \
            > "$RUNNER_TEMP/export/SHA256SUMS"

      - uses: actions/upload-artifact@v7
        with:
          name: offline-toolchains-workspace
          path: ${{ runner.temp }}/export
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
