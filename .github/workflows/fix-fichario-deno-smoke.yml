name: Fix Fichário Deno offline smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-fichario-deno-smoke.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Patch cached-only Deno verification
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/build-fichario.yml')
          source = path.read_text()
          old = '''          pnpm --dir "$smoke" test:e2e
          pnpm --dir "$smoke" test:functions:check
          "$root/bin/doctor" "$smoke"
'''
          new = '''          pnpm --dir "$smoke" test:e2e
          unset npm_config_registry NPM_CONFIG_REGISTRY
          while IFS= read -r module; do
            deno check --cached-only --no-config "$smoke/$module"
          done < <(sed -n 's/^deno check --no-config //p' "$smoke/tools/checks/check-edge-functions.sh")
          "$root/bin/doctor" "$smoke"
'''
          if source.count(old) != 1:
              raise SystemExit('expected Deno smoke block exactly once')
          path.write_text(source.replace(old, new))
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-fichario.yml
          git commit -m 'fix: verify cached Deno modules without registry rewrite'
          git push origin HEAD:main
