name: Fix GoAnime manga relative catalog path

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-fix-relative-catalog/*.request'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source revision
        id: request
        working-directory: control
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-fix-relative-catalog/*.request' | head -n1)"
          read -r project branch sha < "$request"
          test "$project" = goanime && test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feature/manga-platform
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 2
          persist-credentials: true
          show-progress: false

      - name: Refuse branch drift
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null

      - name: Patch relative output handling and regression test
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          builder = Path('tools/manga/manga_availability_v2_builder.dart')
          text = builder.read_text(encoding='utf-8')
          old = """    final output = File(outputPath);\n    await output.parent.create(recursive: true);\n    if (await output.exists()) await output.delete();\n\n    final database = await databaseFactoryFfi.openDatabase(\n      outputPath,\n"""
          new = """    final output = File(outputPath).absolute;\n    await output.parent.create(recursive: true);\n    if (await output.exists()) await output.delete();\n\n    final database = await databaseFactoryFfi.openDatabase(\n      output.path,\n"""
          if old not in text:
              raise SystemExit('builder patch anchor not found')
          builder.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('test/tools/manga/manga_availability_v2_builder_test.dart')
          test = test_path.read_text(encoding='utf-8')
          anchor = "  test('rejects seeds that do not cover every enabled provider', () async {\n"
          block = """  test('writes relative output at the caller-visible path', () async {\n    final directory = await Directory.systemTemp.createTemp(\n      'goanime-manga-availability-v2-relative-',\n    );\n    addTearDown(() => directory.delete(recursive: true));\n    final previousCurrent = Directory.current;\n    Directory.current = directory;\n    addTearDown(() => Directory.current = previousCurrent);\n\n    const relativePath = 'nested/catalog.sqlite';\n    await const MangaAvailabilityV2DatabaseBuilder().build(\n      seed: _seed(),\n      enabledSourceIds: const {'ptbr.a', 'ptbr.b'},\n      outputPath: relativePath,\n    );\n\n    final output = File(relativePath);\n    expect(await output.exists(), isTrue);\n    expect(await output.length(), greaterThan(0));\n\n    final database = await databaseFactoryFfi.openDatabase(output.absolute.path);\n    addTearDown(database.close);\n    final metadataRows = await database.query('metadata');\n    expect(metadataRows, isNotEmpty);\n    expect(\n      metadataRows.any(\n        (row) => row['key'] == 'schemaVersion' && row['value'] == '2',\n      ),\n      isTrue,\n    );\n  });\n\n"""
          if block.strip() not in test:
              if anchor not in test:
                  raise SystemExit('test insertion anchor not found')
              test = test.replace(anchor, block + anchor, 1)
              test_path.write_text(test, encoding='utf-8')
          PY

          dart format \
            tools/manga/manga_availability_v2_builder.dart \
            test/tools/manga/manga_availability_v2_builder_test.dart >/dev/null
          git diff --check

      - name: Validate builder contract
        working-directory: private-source
        run: |
          flutter analyze --no-pub \
            tools/manga/manga_availability_v2_builder.dart \
            tools/manga/build_manga_production_catalog.dart \
            test/tools/manga/manga_availability_v2_builder_test.dart \
            test/tools/manga/build_manga_production_catalog_test.dart
          flutter test --no-pub --concurrency=1 \
            test/tools/manga/manga_availability_v2_builder_test.dart \
            test/tools/manga/build_manga_production_catalog_test.dart
          dart format --output=none --set-exit-if-changed \
            tools/manga/manga_availability_v2_builder.dart \
            test/tools/manga/manga_availability_v2_builder_test.dart

      - name: Commit fix atomically
        id: commit
        working-directory: private-source
        env:
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feature/manga-platform --quiet
          test "$(git rev-parse origin/feature/manga-platform)" = "$REVIEWED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/manga/manga_availability_v2_builder.dart test/tools/manga/manga_availability_v2_builder_test.dart
          git commit -m 'fix(manga): resolve production catalog output path'
          new_sha="$(git rev-parse HEAD)"
          git push origin HEAD:feature/manga-platform
          echo "new_sha=$new_sha" >> "$GITHUB_OUTPUT"

      - name: Publish sanitized receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_SHA: ${{ github.sha }}
          REVIEWED_SHA: ${{ steps.request.outputs.sha }}
          NEW_SHA: ${{ steps.commit.outputs.new_sha }}
          STATE: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
        run: |
          result="$(jq -cn --arg controlSha "$CONTROL_SHA" --arg reviewedSha "${REVIEWED_SHA:-}" --arg newSha "${NEW_SHA:-}" --arg state "$STATE" --argjson runId "$RUN_ID" '{schemaVersion:1,controlSha:$controlSha,reviewedSha:$reviewedSha,newSha:$newSha,state:$state,runId:$runId}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/results/goanime-manga-fix-relative-catalog/$CONTROL_SHA.json" -f message="ci(result): record relative catalog fix $CONTROL_SHA" -f content="$encoded"

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
