name: Finalize GoAnime Jikan Local v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-goanime-jikan-local-v3.yml'

permissions:
  contents: read

jobs:
  validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feat/self-hosted-metadata-api-2026-07-30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Jikan Local
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/self-hosted-metadata-api-2026-07-30
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply code-only fixes
        working-directory: target
        run: |
          set -euo pipefail
          python3 ../.github/scripts/finalize_goanime_jikan_local.py
          git diff --check
          git diff --stat

      - name: Focused Jikan gates
        working-directory: target/infra/jikan
        run: |
          set -euo pipefail
          bash tests/restore_compose_preflight_order_contract_test.sh
          bash tests/backup_restore_contract_test.sh
          bash tests/validate_images_compose_preflight_contract_test.sh
          bash tests/validate_images_contract_test.sh
          bash tests/measure_rpm_contract_test.sh

      - name: Focused Metadata API gates
        working-directory: target/services/metadata-api
        run: |
          set -euo pipefail
          node --test test/rate_limited_fetch.test.js test/jikan_client_shutdown_retry.test.js test/http_home_revalidation.test.js

      - name: Full Jikan infrastructure contracts
        working-directory: target/infra/jikan
        run: bash tests/run.sh

      - name: Full Metadata API tests
        working-directory: target/services/metadata-api
        run: npm test

      - name: Commit and push verified fixes
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name 'Arthur Almeida'
          git config user.email 'arthurgva1602@gmail.com'
          git add infra/jikan/scripts/restore.sh infra/jikan/tests/backup_restore_contract_test.sh infra/jikan/tests/validate_images_contract_test.sh infra/jikan/scripts/measure-rpm.sh services/metadata-api/src/http_server.js
          git commit -m 'fix(jikan): close final code-only production gaps'
          git push origin HEAD:"$TARGET_BRANCH"
