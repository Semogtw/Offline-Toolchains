name: Report GoAnime MAL backfill runs

on:
  workflow_run:
    workflows: ['Backfill private GoAnime MAL catalog']
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Record completed backfill
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;
            const jobsResponse = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: run.id, per_page: 100
            });
            const jobs = jobsResponse.data.jobs.map(j => ({
              id: j.id,
              name: j.name,
              status: j.status,
              conclusion: j.conclusion,
              started_at: j.started_at,
              completed_at: j.completed_at
            }));
            const report = {
              schema_version: 1,
              run_id: run.id,
              name: run.name,
              status: run.status,
              conclusion: run.conclusion,
              event: run.event,
              head_sha: run.head_sha,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url,
              jobs
            };
            const path = 'reports/goanime-mal-backfill/latest.json';
            let sha;
            try {
              const old = await github.rest.repos.getContent({owner, repo, path, ref: 'main'});
              if (!Array.isArray(old.data)) sha = old.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path,
              message: `ci(goanime): report MAL backfill ${run.id} [skip ci]`,
              content: Buffer.from(JSON.stringify(report, null, 2) + '\n').toString('base64'),
              branch: 'main',
              sha
            });
