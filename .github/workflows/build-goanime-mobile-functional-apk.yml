name: Build GoAnime Mobile functional APK

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-goanime-mobile-functional-apk.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goanime-mobile-functional-apk
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.1
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID || vars.FIREBASE_PROJECT_ID }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY || vars.FIREBASE_WEB_API_KEY }}
  UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL || vars.UPDATE_MANIFEST_URL }}
  UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL || vars.UPDATE_APPCAST_URL }}
  ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL || vars.ANIME_METADATA_SEED_MANIFEST_URL }}
  RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL || vars.RUNTIME_DATABASE_MANIFEST_URL }}
  GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  build:
    name: Validate, publish source fix and build APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN" || {
            echo 'Missing PRIVATE_REPOSITORIES_TOKEN.' >&2
            exit 1
          }

      - name: Checkout private GoAnime Mobile source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: main
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)

      - name: Preserve opaque HLS checkpoint references
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f'{path}: expected source fragment was not found')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'lib/services/download/hls/filesystem_hls_package_store.dart',
              """      return HlsPackagePromotion(
                packageRootReference: complete.path,
                playlistEntryReference: path.join(complete.path, _playlist),
              );""",
              """      return HlsPackagePromotion(
                packageRootReference: complete.path,
                playlistEntryReference: path.join(complete.path, _playlist),
                checkpointEntryReference: path.join(complete.path, _checkpoint),
              );""",
          )

          replace_once(
              'lib/services/download/hls/saf_hls_package_store.dart',
              """      final playlist = await _requireSafFile(
                treeUri: package.parent.treeUri,
                parentUri: finalUri,
                displayName: _safPlaylist,
              );
              if (!await _access.deleteDocument(marker.uri)) {""",
              """      final playlist = await _requireSafFile(
                treeUri: package.parent.treeUri,
                parentUri: finalUri,
                displayName: _safPlaylist,
              );
              final checkpoint = await _requireSafFile(
                treeUri: package.parent.treeUri,
                parentUri: finalUri,
                displayName: _safCheckpoint,
              );
              if (!await _access.deleteDocument(marker.uri)) {""",
          )

          replace_once(
              'lib/services/download/hls/saf_hls_package_store.dart',
              """      return HlsPackagePromotion(
                packageRootReference: finalUri,
                playlistEntryReference: playlist.uri,
              );""",
              """      return HlsPackagePromotion(
                packageRootReference: finalUri,
                playlistEntryReference: playlist.uri,
                checkpointEntryReference: checkpoint.uri,
              );""",
          )

          replace_once(
              'lib/services/download/hls/hls_download_engine_support.dart',
              """      return HlsTransferCompleted(
                packageRootReference: promotion.packageRootReference,
                playlistEntryReference: promotion.playlistEntryReference,
                committedBytes: latestCheckpoint.committedBytes,""",
              """      return HlsTransferCompleted(
                packageRootReference: promotion.packageRootReference,
                playlistEntryReference: promotion.playlistEntryReference,
                checkpointEntryReference: promotion.checkpointEntryReference,
                committedBytes: latestCheckpoint.committedBytes,""",
          )

          replace_once(
              'lib/services/download/download_queue_manager_hls.dart',
              """            checkpointPath: path.join(
                  result.packageRootReference,
                  'checkpoint.json',
                ),""",
              """            checkpointPath: result.checkpointEntryReference.isEmpty
                ? path.join(result.packageRootReference, 'checkpoint.json')
                : result.checkpointEntryReference,""",
          )
          PY

          dart format \
            lib/services/download/download_queue_manager_hls.dart \
            lib/services/download/hls/hls_package_store.dart \
            lib/services/download/hls/hls_transfer_models.dart \
            lib/services/download/hls/filesystem_hls_package_store.dart \
            lib/services/download/hls/saf_hls_package_store.dart \
            lib/services/download/hls/hls_download_engine_support.dart
          git diff --check

      - name: Validate focused and repository-wide gates
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter test --no-pub test/services/download/hls/hls_checkpoint_reference_test.dart
          flutter test --no-pub test/services/download/hls
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/validate_repository_guards.py
          flutter analyze --no-pub
          flutter test --no-pub
          (cd packages/goanime_core && dart test)
          bash ./tools/validate_release_workflows.sh
          dart format --output=none --set-exit-if-changed lib test packages tools

      - name: Publish verified source change without app-repository Actions
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to publish.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              lib/services/download/download_queue_manager_hls.dart \
              lib/services/download/hls/hls_package_store.dart \
              lib/services/download/hls/hls_transfer_models.dart \
              lib/services/download/hls/filesystem_hls_package_store.dart \
              lib/services/download/hls/saf_hls_package_store.dart \
              lib/services/download/hls/hls_download_engine_support.dart
            git commit -m 'fix(downloads): preserve opaque HLS checkpoint references [skip ci]'
            git push origin HEAD:main
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Prepare supported client configuration
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RUNTIME_DATABASE_MANIFEST_URL:-}" ] && [ -n "${UPDATE_MANIFEST_URL:-}" ]; then
            case "$UPDATE_MANIFEST_URL" in
              */latest/update.json)
                RUNTIME_DATABASE_MANIFEST_URL="${UPDATE_MANIFEST_URL%/update.json}/runtime_database_manifest.json"
                export RUNTIME_DATABASE_MANIFEST_URL
                ;;
            esac
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          names = [
              'FIREBASE_PROJECT_ID',
              'FIREBASE_WEB_API_KEY',
              'UPDATE_MANIFEST_URL',
              'UPDATE_APPCAST_URL',
              'ANIME_METADATA_SEED_MANIFEST_URL',
              'RUNTIME_DATABASE_MANIFEST_URL',
          ]
          values = {name: os.environ.get(name, '') for name in names}
          Path('/tmp/goanime-build-defines.json').write_text(
              json.dumps({name: value for name, value in values.items() if value})
          )
          Path('/tmp/goanime-config-presence.json').write_text(
              json.dumps({name: bool(value) for name, value in values.items()}, indent=2)
          )
          PY

          if [ -n "${GOOGLE_SERVICES_JSON_BASE64:-}" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
            echo 'GOOGLE_SERVICES_PRESENT=true' >> "$GITHUB_ENV"
          else
            echo 'GOOGLE_SERVICES_PRESENT=false' >> "$GITHUB_ENV"
          fi

      - name: Restore signing when available
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          present=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!name:-}" ] && present=$((present + 1))
          done
          if [ "$present" -eq 4 ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/goanime-release.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=goanime-release.jks"
            } > android/key.properties
            echo 'APK_SIGNING=release-keystore' >> "$GITHUB_ENV"
          elif [ "$present" -eq 0 ]; then
            echo 'APK_SIGNING=debug-fallback' >> "$GITHUB_ENV"
          else
            echo 'Android signing secrets are only partially configured.' >&2
            exit 1
          fi

      - name: Build and verify release APK
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --no-pub \
            --dart-define-from-file=/tmp/goanime-build-defines.json

          mkdir -p "$RUNNER_TEMP/goanime-apk"
          apk="$(find build/app/outputs -type f -name '*.apk' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          test -n "$apk" && test -f "$apk"
          cp "$apk" "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk"
          unzip -t "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk" >/dev/null

          entries="$(unzip -Z1 "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk" 'lib/*/libapp.so' || true)"
          test "$entries" = 'lib/arm64-v8a/libapp.so'

          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs \
            "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk" \
            > "$RUNNER_TEMP/goanime-apk/apk-signature-report.txt"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          presence = json.loads(Path('/tmp/goanime-config-presence.json').read_text())
          manifest = {
              'artifact': 'GoAnime-Mobile-functional-arm64.apk',
              'sourceCommit': os.environ['SOURCE_SHA'],
              'flutterVersion': os.environ['FLUTTER_VERSION'],
              'abi': 'arm64-v8a',
              'buildMode': 'release',
              'applicationId': 'com.example.goanime_mobile',
              'signing': os.environ['APK_SIGNING'],
              'googleServicesJson': os.environ['GOOGLE_SERVICES_PRESENT'] == 'true',
              'clientConfigurationPresent': presence,
              'intentionallyExcludedFromApk': [
                  'PRIVATE_REPOSITORIES_TOKEN',
                  'CLOUDFLARE_ACCOUNT_ID',
                  'R2_ACCESS_KEY_ID',
                  'R2_SECRET_ACCESS_KEY',
                  'SHOREBIRD_TOKEN',
                  'GitHub tokens',
                  'private signing key material',
              ],
          }
          output = Path(os.environ['RUNNER_TEMP']) / 'goanime-apk' / 'build-manifest.json'
          output.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY
          sha256sum "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk" \
            > "$RUNNER_TEMP/goanime-apk/GoAnime-Mobile-functional-arm64.apk.sha256"

      - name: Upload APK for handoff
        uses: actions/upload-artifact@v7
        with:
          name: goanime-mobile-functional-apk
          path: ${{ runner.temp }}/goanime-apk/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Remove private checkout and restored credentials
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
