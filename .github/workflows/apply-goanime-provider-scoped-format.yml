name: Apply GoAnime provider scoped format

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-provider-format-apply/latest.request'

permissions:
  contents: read

jobs:
  format-and-push:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require private repository tokens
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${READ_TOKEN:-}" || { echo 'PRIVATE_REPOSITORIES_TOKEN is required.' >&2; exit 1; }
          test -n "${WRITE_TOKEN:-}" || { echo 'GOANIME_CATALOG_WRITE_TOKEN is required.' >&2; exit 1; }

      - name: Checkout toolchain request
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve exact revision and target branch
        id: request
        shell: bash
        run: |
          set -euo pipefail
          read -r project sha branch < triggers/goanime-provider-format-apply/latest.request
          test "$project" = 'goanime'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v5
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Format only four-provider audit files
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/services/animefire_service.dart \
            lib/services/anitube_service.dart \
            test/services/animefire_player_source_test.dart \
            test/services/anitube_episode_list_ownership_test.dart \
            test/services/providers/four_provider_native_flow_test.dart \
            test/services/providers/anime_provider_live_smoke_test.dart
          git diff --check

      - name: Commit and push only if branch still matches requested SHA
        working-directory: private-source
        shell: bash
        env:
          WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          if git diff --quiet -- \
            lib/services/animefire_service.dart \
            lib/services/anitube_service.dart \
            test/services/animefire_player_source_test.dart \
            test/services/anitube_episode_list_ownership_test.dart \
            test/services/providers/four_provider_native_flow_test.dart \
            test/services/providers/anime_provider_live_smoke_test.dart; then
            echo 'No scoped formatting changes required.'
            exit 0
          fi

          auth="$(printf 'x-access-token:%s' "$WRITE_TOKEN" | base64 -w0)"
          extraheader="AUTHORIZATION: basic $auth"
          current="$(git -c http.https://github.com/.extraheader="$extraheader" ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          if [ "$current" != "$TARGET_SHA" ]; then
            echo "Target branch moved; refusing formatter push." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/services/animefire_service.dart \
            lib/services/anitube_service.dart \
            test/services/animefire_player_source_test.dart \
            test/services/anitube_episode_list_ownership_test.dart \
            test/services/providers/four_provider_native_flow_test.dart \
            test/services/providers/anime_provider_live_smoke_test.dart
          git commit -m 'style(providers): apply scoped Dart formatter'
          git -c http.https://github.com/.extraheader="$extraheader" push origin "HEAD:$TARGET_BRANCH"

      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf "$GITHUB_WORKSPACE/private-source"
