name: Validate GoAnime availability search index

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-availability-search-index/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-availability-search-index
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-availability-search-index/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          test "$branch" = 'perf/app-wide-optimization-20260819'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Apply precomputed title-key index
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/availability_service.dart')
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one target, got {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '  static final Map<String, AnimeModeAvailability> _modeKeys = {};\n',
              '  static final Map<String, AnimeModeAvailability> _modeKeys = {};\n'
              '  static final Map<String, Set<String>> _titleKeysByTitle = {};\n',
          )

          text = text.replace(
              '    _availableTitles.clear();\n    _availableKeys.clear();\n    _modeKeys.clear();\n',
              '    _availableTitles.clear();\n    _availableKeys.clear();\n    _modeKeys.clear();\n    _titleKeysByTitle.clear();\n',
          )

          replace_once(
              "      if (title.isNotEmpty) _availableTitles.add(title);\n      final modes = AnimeModeAvailability(\n",
              "      if (title.isNotEmpty) {\n        _availableTitles.add(title);\n        _titleKeysByTitle.putIfAbsent(title, () => <String>{}).addAll(entry.keys);\n      }\n      final modes = AnimeModeAvailability(\n",
          )

          replace_once(
              '    _availableTitles.add(normalizedTitle);\n    _availableKeys.addAll(keys);\n',
              '    _availableTitles.add(normalizedTitle);\n'
              '    _titleKeysByTitle.update(\n'
              '      normalizedTitle,\n'
              '      (existing) => <String>{...existing, ...keys},\n'
              '      ifAbsent: () => keys.toSet(),\n'
              '    );\n'
              '    _availableKeys.addAll(keys);\n',
          )

          replace_once(
              '    for (final title in _availableTitles) {\n      if (!_matchesConfirmed(title, mode: mode)) continue;\n      final score = _scoreLocalTitleMatch(title, normalizedQuery, queryTokens);\n',
              '    for (final title in _availableTitles) {\n'
              '      final keys =\n'
              '          _titleKeysByTitle[title] ?? TitleNormalizer.keysForTitle(title);\n'
              '      if (!_matchesConfirmedKeys(keys, mode: mode)) continue;\n'
              '      final score = _scoreLocalTitleMatch(title, normalizedQuery, queryTokens);\n',
          )

          old_matches = '''  static bool _matchesConfirmed(
    String title, {
    required AnimeAvailabilityMode mode,
  }) {
    final keys = TitleNormalizer.keysForTitle(title);
    if (mode == AnimeAvailabilityMode.any) {
      return keys.any(_availableKeys.contains) ||
          keys.any((key) => _availableKeys.contains('$key classico')) ||
          keys.any((key) => _availableKeys.contains('$key classic'));
    }

    final hasModeMatch = keys.any(
      (key) => _modeKeys[key]?.matches(mode) ?? false,
    );
    if (hasModeMatch) return true;

    final hasModeMetadata = keys.any(_modeKeys.containsKey);
    if (mode == AnimeAvailabilityMode.sub && !hasModeMetadata) {
      return keys.any(_availableKeys.contains);
    }
    return false;
  }
'''
          new_matches = '''  static bool _matchesConfirmed(
    String title, {
    required AnimeAvailabilityMode mode,
  }) {
    return _matchesConfirmedKeys(
      TitleNormalizer.keysForTitle(title),
      mode: mode,
    );
  }

  static bool _matchesConfirmedKeys(
    Iterable<String> keys, {
    required AnimeAvailabilityMode mode,
  }) {
    if (mode == AnimeAvailabilityMode.any) {
      return keys.any(_availableKeys.contains) ||
          keys.any((key) => _availableKeys.contains('$key classico')) ||
          keys.any((key) => _availableKeys.contains('$key classic'));
    }

    final hasModeMatch = keys.any(
      (key) => _modeKeys[key]?.matches(mode) ?? false,
    );
    if (hasModeMatch) return true;

    final hasModeMetadata = keys.any(_modeKeys.containsKey);
    if (mode == AnimeAvailabilityMode.sub && !hasModeMetadata) {
      return keys.any(_availableKeys.contains);
    }
    return false;
  }
'''
          replace_once(old_matches, new_matches)

          old_replace = '''  static void _replaceCache(Iterable<String> titles) {
    _availableTitles
      ..clear()
      ..addAll(
        titles
            .map(TitleNormalizer.normalize)
            .where((title) => title.isNotEmpty),
      );
    _availableKeys
      ..clear()
      ..addAll(_availableTitles.expand(TitleNormalizer.keysForTitle));
  }
'''
          new_replace = '''  static void _replaceCache(Iterable<String> titles) {
    _availableTitles.clear();
    _availableKeys.clear();
    _titleKeysByTitle.clear();
    for (final rawTitle in titles) {
      final title = TitleNormalizer.normalize(rawTitle);
      if (title.isEmpty || !_availableTitles.add(title)) continue;
      final keys = TitleNormalizer.keysForTitle(title);
      _titleKeysByTitle[title] = keys;
      _availableKeys.addAll(keys);
    }
  }
'''
          replace_once(old_replace, new_replace)

          replace_once(
              '      _availableTitles.add(title);\n      for (final key in TitleNormalizer.keysForTitle(title)) {\n',
              '      _availableTitles.add(title);\n'
              '      final keys = TitleNormalizer.keysForTitle(title);\n'
              '      _titleKeysByTitle[title] = keys;\n'
              '      for (final key in keys) {\n',
          )

          path.write_text(text)
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format and validate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          dart format lib/services/availability_service.dart
          git -c core.whitespace=cr-at-eol diff --check
          test "$(git diff --name-only)" = 'lib/services/availability_service.dart'
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 \
            test/services/availability_service_test.dart \
            test/services/runtime_home_catalog_resilience_test.dart

      - name: Publish validated output
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="generated/goanime-availability-search-index/$TARGET_SHA"
          destination="$prefix/lib/services/availability_service.dart"
          encoded="$(base64 -w0 private-source/lib/services/availability_service.dart)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$destination?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$destination" -f message='ci(goanime): publish availability search index output' -f content="$encoded" -f branch=main)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Record status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          OUTPUT_PREFIX: ${{ steps.publish.outputs.prefix }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({
            'status': os.environ['GATE_STATUS'],
            'targetSha': os.environ.get('TARGET_SHA') or None,
            'outputPrefix': os.environ.get('OUTPUT_PREFIX') or None,
            'runId': os.environ.get('GITHUB_RUN_ID'),
          }, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='status/goanime-availability-search-index.json'
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='ci(goanime): record availability search index status' -f content="$encoded" -f branch=main)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
