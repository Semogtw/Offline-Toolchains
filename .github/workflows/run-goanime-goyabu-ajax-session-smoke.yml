name: Run GoAnime Goyabu session AJAX smoke

on:
  push:
    branches:
      - main
    paths:
      - 'triggers/goanime-goyabu-ajax-session/*.request'

permissions:
  contents: read

jobs:
  smoke:
    name: Probe Goyabu decoder with browser session
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout trusted probe
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/goyabu_ajax_session_smoke.py
          sparse-checkout-cone-mode: false
          show-progress: false
      - name: Run sanitized session smoke
        shell: bash
        run: python3 scripts/goyabu_ajax_session_smoke.py
