name: Release GoAnime from public toolchains
run-name: GoAnime ${{ inputs.version }} from ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact GoAnime branch, tag, or commit to release
        required: true
        default: main
        type: string
      version:
        description: Version from pubspec.yaml, for example 1.0.1
        required: true
        type: string
      platforms:
        description: Comma-separated platforms to build
        required: true
        default: android,windows,linux
        type: string
      release_notes:
        description: Release notes
        required: false
        default: Release generated by the public GoAnime toolchain.
        type: string

permissions:
  contents: read

concurrency:
  group: goanime-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  GOANIME_REPOSITORY: Semogtw/goanime-mobile
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: 3.44.1
  ANDROID_TARGET_PLATFORM: android-arm64
  ANDROID_RELEASE_APK_NAME: GoAnime-android-arm64-v8a-release.apk
  GOANIME_OFFICIAL_RELEASE: "true"
  FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
  UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
  UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
  UPDATE_MANIFEST_PUBLIC_KEY_ID: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_ID }}
  UPDATE_MANIFEST_PUBLIC_KEY_B64: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY_B64 }}
  ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
  RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  prepare:
    name: Validate source and open staging draft
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_sha: ${{ steps.prepare.outputs.source_sha }}
      release_tag: ${{ steps.prepare.outputs.release_tag }}
      version_name: ${{ steps.prepare.outputs.version_name }}
      build_number: ${{ steps.prepare.outputs.build_number }}
      platforms: ${{ steps.prepare.outputs.platforms }}

    steps:
      - name: Checkout trusted toolchain
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Checkout private GoAnime source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 21
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Prepare immutable release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          PLATFORMS: ${{ inputs.platforms }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AUTO_UPDATER_DSA_PUBLIC_KEY: ${{ secrets.AUTO_UPDATER_DSA_PUBLIC_KEY }}
          AUTO_UPDATER_DSA_PRIVATE_KEY: ${{ secrets.AUTO_UPDATER_DSA_PRIVATE_KEY }}
        run: bash scripts/goanime-release/prepare.sh private-source

  android:
    name: Android arm64 release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',android,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true

      - name: Build and stage Android
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash scripts/goanime-release/android.sh private-source

  windows:
    name: Windows x64 release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',windows,') }}
    runs-on: windows-latest
    timeout-minutes: 120
    outputs:
      dsa_signature: ${{ steps.build.outputs.dsa_signature }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true

      - name: Install Windows packaging tools
        run: choco install innosetup openssl -y

      - name: Build and stage Windows
        id: build
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          AUTO_UPDATER_DSA_PUBLIC_KEY: ${{ secrets.AUTO_UPDATER_DSA_PUBLIC_KEY }}
          AUTO_UPDATER_DSA_PRIVATE_KEY: ${{ secrets.AUTO_UPDATER_DSA_PRIVATE_KEY }}
        run: ./scripts/goanime-release/windows.ps1 -SourceDir private-source

  linux:
    name: Linux x64 release
    needs: prepare
    if: ${{ contains(format(',{0},', needs.prepare.outputs.platforms), ',linux,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true

      - name: Build and stage Linux
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: bash scripts/goanime-release/linux.sh private-source

  publish:
    name: Publish R2 channel and GoAnime release
    if: ${{ always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    needs: [prepare, android, windows, linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ needs.prepare.outputs.source_sha }}
          token: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          GOANIME_RELEASE_PLATFORMS: ${{ needs.prepare.outputs.platforms }}
          WINDOWS_DSA_SIGNATURE: ${{ needs.windows.outputs.dsa_signature }}
          UPDATE_ASSET_URL_TEMPLATE: ${{ secrets.UPDATE_ASSET_URL_TEMPLATE }}
          UPDATE_RELEASE_PAGE_URL: ${{ secrets.UPDATE_RELEASE_PAGE_URL }}
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/goanime-release/publish.sh private-source
