name: GoAnime Manga APK8
on:
  push:
    paths: ['triggers/goanime-manga-apk8/**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public transfer key
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: keys/source-bundles-public.asc
          sparse-checkout-cone-mode: false

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: 5dd346f02abf553e758068940b64200de83b9f41
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
      - run: flutter pub get
      - name: Build 8-source profile
        run: |
          sed -i "/ptbr.ninjascan/d" lib/services/manga/default_manga_source_providers.dart
          sed -i "/'ptbr.ninjascan':/d" tools/manga/collect_enabled_manga_live_evidence.dart
          python3 - <<'PY'
          import json
          p='docs/manga_sources_ptbr.json'
          d=json.load(open(p))
          for r in d['providerRecords']:
            if r.get('goanimeSourceId')=='ptbr.ninjascan': r['implementationState']='planned'
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          open(p,'a').write('\n')
          PY
          mkdir -p /tmp/apk8
          dart run tools/manga/collect_enabled_manga_live_evidence.dart /tmp/apk8/evidence.json /tmp/apk8/status.json 5dd346f02abf553e758068940b64200de83b9f41
          python3 - <<'PY'
          import json
          p='docs/manga_sources_ptbr.json'; d=json.load(open(p)); s=json.load(open('/tmp/apk8/status.json'))
          for r in d['providerRecords']:
            if r.get('implementationState')=='enabled': r['rolloutGates']={'fixtureContractPassed':True,'liveReadabilityPassed':True,'verifiedAt':s['generatedAt']}
          json.dump(d,open(p,'w'),ensure_ascii=False,indent=2); open(p,'a').write('\n')
          PY
          echo '{"schemaVersion":1,"occurrenceMappings":[],"externalMappings":[]}' >/tmp/apk8/ledger0.json
          dart run tools/manga/bootstrap_manga_canonical_id_ledger.dart --allow-new-identities /tmp/apk8/evidence.json /tmp/apk8/ledger0.json /tmp/apk8/ledger.json /tmp/apk8/report.json
          dart run tools/manga/build_safe_manga_canonical_staging.dart /tmp/apk8/evidence.json /tmp/apk8/ledger.json /tmp/apk8/staging.json /tmp/apk8/ledger2.json
          dart run tools/manga/promote_manga_canonical_candidate.dart docs/manga_sources_ptbr.json /tmp/apk8/staging.json 5dd346f02abf553e758068940b64200de83b9f41 /tmp/apk8/seed.json --allow-production-transition
          dart run tools/manga/build_manga_production_catalog.dart docs/manga_sources_ptbr.json /tmp/apk8/seed.json 5dd346f02abf553e758068940b64200de83b9f41 "$PWD/assets/data/manga_availability.db"
          grep -q 'assets/data/manga_availability.db' pubspec.yaml || sed -i '/  assets:/a\    - assets/data/manga_availability.db' pubspec.yaml
          flutter pub get
          flutter build apk --debug --no-pub

      - name: Encrypt debug APK artifact
        id: package
        shell: bash
        env:
          EXPECTED_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
          SOURCE_SHA: 5dd346f02abf553e758068940b64200de83b9f41
          WORK: ${{ runner.temp }}/goanime-manga-apk8
        run: |
          set -euo pipefail
          transfer="$WORK/transfer"; gpg_home="$WORK/gpg"
          rm -rf "$WORK"; mkdir -p "$transfer" "$gpg_home"; chmod 700 "$gpg_home"
          export GNUPGHOME="$gpg_home"
          gpg --batch --import "$GITHUB_WORKSPACE/control/keys/source-bundles-public.asc" >/dev/null 2>&1
          fingerprint="$(gpg --batch --with-colons --fingerprint "$EXPECTED_FINGERPRINT" | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "$EXPECTED_FINGERPRINT"
          apk=private-source/build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          encrypted="$transfer/GoAnime-Manga-APK8-${SOURCE_SHA:0:12}-debug.apk.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_FINGERPRINT" --output "$encrypted" --encrypt "$apk"
          (cd "$transfer" && sha256sum *.gpg > SHA256SUMS)
          echo "transfer=$transfer" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: goanime-manga-apk8-encrypted
          path: ${{ steps.package.outputs.transfer }}
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup private build
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control" "$RUNNER_TEMP/goanime-manga-apk8"
