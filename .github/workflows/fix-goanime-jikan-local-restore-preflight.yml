name: Finalize GoAnime Jikan Local code gates

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goanime-jikan-local-restore-preflight.yml'

permissions:
  contents: read

concurrency:
  group: finalize-goanime-jikan-local-code-gates
  cancel-in-progress: true

jobs:
  patch-test-push:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feat/self-hosted-metadata-api-2026-07-30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Jikan Local branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/self-hosted-metadata-api-2026-07-30
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Patch remaining code-only issues
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          restore = Path('infra/jikan/scripts/restore.sh')
          text = restore.read_text(encoding='utf-8')
          marker = "require_command docker\n\n"
          probe = "if ! docker compose version >/dev/null 2>&1; then\n  printf 'Could not verify Docker Compose availability before restore.\\n' >&2\n  exit 74\nfi\n"
          old_probe = "if ! docker compose version >/dev/null; then\n  printf 'Could not verify Docker Compose availability before restore.\\n' >&2\n  exit 74\nfi\n"
          if text.count(marker) != 1 or text.count(old_probe) != 1:
              raise SystemExit('restore.sh Compose probe boundary changed')
          text = text.replace(marker, marker + probe + '\n', 1)
          text = text.replace(old_probe, '', 1)
          restore.write_text(text, encoding='utf-8')

          contract = Path('infra/jikan/tests/backup_restore_contract_test.sh')
          text = contract.read_text(encoding='utf-8')
          exact_cases = [
              ('restored secret stage creation failure reached Docker', 'restored secret stage creation failure'),
              ('restored secret stage chmod failure reached Docker', 'restored secret stage chmod failure'),
              ('staged secret synchronization failure must happen before Docker access', 'staged secret synchronization failure'),
              ('secret publication synchronization failure must happen before Docker access', 'secret publication synchronization failure'),
          ]
          for old_message, context in exact_cases:
              old = '[[ ! -s "$DOCKER_LOG" ]] || \\\n  fail \'%s\'\n' % old_message
              new = 'grep -Eq \'^compose version[[:space:]]*$\' "$DOCKER_LOG" || \\\n  fail \'%s skipped Compose preflight\'\n' % context
              new += 'if grep -Ev \'^compose version[[:space:]]*$\' "$DOCKER_LOG" | grep -q .; then\n'
              new += '  fail \'%s reached Docker beyond the read-only Compose preflight\'\n' % context
              new += 'fi\n'
              if text.count(old) != 1:
                  raise SystemExit('backup restore assertion changed: ' + old_message)
              text = text.replace(old, new, 1)
          contract.write_text(text, encoding='utf-8')

          images = Path('infra/jikan/tests/validate_images_contract_test.sh')
          text = images.read_text(encoding='utf-8')
          fake_marker = 'printf \'docker %s\\n\' "$*" >> "${CALL_LOG:?}"\n'
          fake_probe = 'if [[ "${1:-}" == "compose" && "${2:-}" == "version" ]]; then\n  exit 0\nfi\n'
          if text.count(fake_marker) != 1:
              raise SystemExit('validate-images fake Docker marker changed')
          text = text.replace(fake_marker, fake_marker + fake_probe, 1)
          old_mktemp = '[[ ! -s "$CALL_LOG" ]] || \\\n  fail \'temporary image listing failure reached Docker\'\n'
          new_mktemp = 'grep -Fxq \'docker compose version\' "$CALL_LOG" || \\\n  fail \'temporary image listing failure skipped Compose preflight\'\nif grep -Fvx \'docker compose version\' "$CALL_LOG" | grep -q .; then\n  fail \'temporary image listing failure reached Docker beyond the read-only Compose preflight\'\nfi\n'
          if text.count(old_mktemp) != 1:
              raise SystemExit('validate-images mktemp Docker assertion changed')
          text = text.replace(old_mktemp, new_mktemp, 1)
          images.write_text(text, encoding='utf-8')

          home = Path('services/metadata-api/src/http_server.js')
          text = home.read_text(encoding='utf-8')
          old_home = """          response.setHeader(
            'cache-control',
            `public, max-age=${Math.max(0, Math.floor((config.homeFreshTtlMs ?? 60_000) / 1_000))}`,
          );
"""
          new_home = """          // Home is assembled from independently aged section caches. A full
          // downstream max-age would reset their effective freshness whenever
          // the aggregate is requested, including stale fallback responses.
          // Revalidate via the stable ETag instead; the internal caches still
          // absorb refresh traffic without extending their freshness budget.
          response.setHeader(
            'cache-control',
            'public, max-age=0, must-revalidate',
          );
"""
          if text.count(old_home) != 1:
              raise SystemExit('Home cache-control block changed')
          home.write_text(text.replace(old_home, new_home, 1), encoding='utf-8')

          rpm = Path('infra/jikan/scripts/measure-rpm.sh')
          text = rpm.read_text(encoding='utf-8')
          replacements = [
              ('$1 ~ ("class=\\\\\\\"" class_name "\\\\\\\"")', 'index($1, "class=\\\"" class_name "\\\"") > 0'),
              ('$1 ~ ("cache=\\\\\\\"" cache_name "\\\\\\\"")', 'index($1, "cache=\\\"" cache_name "\\\"") > 0'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('measure-rpm label matcher changed: ' + old)
              text = text.replace(old, new, 1)
          rpm.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- infra/jikan/scripts/restore.sh infra/jikan/tests/backup_restore_contract_test.sh infra/jikan/tests/validate_images_contract_test.sh infra/jikan/scripts/measure-rpm.sh services/metadata-api/src/http_server.js

      - name: Install PHP CLI for indexer contracts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v | head -n1
          node --version

      - name: Run focused Jikan contracts
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/restore_compose_preflight_order_contract_test.sh
          bash tests/backup_restore_contract_test.sh
          bash tests/validate_images_compose_preflight_contract_test.sh
          bash tests/validate_images_contract_test.sh
          bash tests/measure_rpm_contract_test.sh

      - name: Run focused Metadata API tests
        working-directory: target/services/metadata-api
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/rate_limited_fetch.test.js \
            test/jikan_client_shutdown_retry.test.js \
            test/http_home_revalidation.test.js

      - name: Run Jikan infrastructure contracts
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh

      - name: Run Metadata API tests
        working-directory: target/services/metadata-api
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Commit and push verified fixes
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change remains to commit.'
            exit 0
          fi
          git config user.name 'Arthur Almeida'
          git config user.email 'arthurgva1602@gmail.com'
          git add \
            infra/jikan/scripts/restore.sh \
            infra/jikan/tests/backup_restore_contract_test.sh \
            infra/jikan/tests/validate_images_contract_test.sh \
            infra/jikan/scripts/measure-rpm.sh \
            services/metadata-api/src/http_server.js
          git commit -m 'fix(jikan): close final code-only production gaps'
          git push origin HEAD:"$TARGET_BRANCH"
