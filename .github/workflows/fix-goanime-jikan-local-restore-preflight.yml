name: Fix GoAnime Jikan Local restore preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-goanime-jikan-local-restore-preflight.yml'

permissions:
  contents: read

concurrency:
  group: fix-goanime-jikan-local-restore-preflight
  cancel-in-progress: true

jobs:
  patch-test-push:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_REPO: Semogtw/goanime-mobile
      TARGET_BRANCH: feat/self-hosted-metadata-api-2026-07-30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Jikan Local branch
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/self-hosted-metadata-api-2026-07-30
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Patch restore Compose preflight order
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('infra/jikan/scripts/restore.sh')
          text = path.read_text(encoding='utf-8')
          marker = "require_command docker\n\n"
          probe = """if ! docker compose version >/dev/null 2>&1; then
            printf 'Could not verify Docker Compose availability before restore.\\n' >&2
            exit 74
          fi
          """
          old_probe = """if ! docker compose version >/dev/null; then
            printf 'Could not verify Docker Compose availability before restore.\\n' >&2
            exit 74
          fi
          """
          if text.count(marker) != 1:
              raise SystemExit('restore.sh require_command docker marker changed')
          if text.count(old_probe) != 1:
              raise SystemExit('restore.sh Compose probe block changed')
          text = text.replace(marker, marker + probe + '\n', 1)
          text = text.replace(old_probe, '', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- infra/jikan/scripts/restore.sh

      - name: Install PHP CLI for indexer contracts
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v | head -n1
          node --version

      - name: Run focused restore contract
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/restore_compose_preflight_order_contract_test.sh

      - name: Run Jikan infrastructure contracts
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh

      - name: Run Metadata API tests
        working-directory: target/services/metadata-api
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Commit and push verified restore fix
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source change remains to commit.'
            exit 0
          fi
          git config user.name 'Arthur Almeida'
          git config user.email 'arthurgva1602@gmail.com'
          git add infra/jikan/scripts/restore.sh
          git commit -m 'fix(jikan): probe compose before restore secret transaction'
          git push origin HEAD:"$TARGET_BRANCH"
