name: Format GoAnime startup opening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-startup-opening-format/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-startup-opening-format
  cancel-in-progress: false

jobs:
  format:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted request
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact source request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-startup-opening-format/*.request' | head -n 1)"
          test -n "$request"
          read -r branch sha < "trusted-source/$request"
          test "$branch" = 'fix/startup-logo-shape-20260823'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Require private write token
        shell: bash
        env:
          GOANIME_WRITE_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        run: test -n "$GOANIME_WRITE_TOKEN"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true
          show-progress: false

      - name: Verify exact checkout
        working-directory: private-source
        shell: bash
        run: test "$(git rev-parse HEAD)" = '${{ steps.request.outputs.sha }}'

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Format only startup opening Dart files
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/widgets/goanime_opening.dart \
            test/widgets/goanime_opening_test.dart
          git -c core.whitespace=cr-at-eol diff --check
          changed="$(git diff --name-only | sort)"
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              case "$file" in
                lib/widgets/goanime_opening.dart|test/widgets/goanime_opening_test.dart) ;;
                *) echo "Unexpected formatter change: $file" >&2; exit 1 ;;
              esac
            done <<< "$changed"
          fi
          dart format --output=none --set-exit-if-changed \
            lib/widgets/goanime_opening.dart \
            test/widgets/goanime_opening_test.dart

      - name: Publish formatting commit
        id: publish
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA" || {
            echo 'Source branch moved; refusing to overwrite it.' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/widgets/goanime_opening.dart test/widgets/goanime_opening_test.dart
          if git diff --cached --quiet; then
            published="$EXPECTED_SHA"
          else
            git commit -m 'style(opening): apply Dart formatter'
            git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            published="$(git rev-parse HEAD)"
          fi
          echo "published_sha=$published" >> "$GITHUB_OUTPUT"
          echo "Published GoAnime SHA: $published"

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
