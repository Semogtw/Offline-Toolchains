name: Validate GoAnime performance baseline output

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-perf-baseline-output/*.request'

permissions:
  contents: write

concurrency:
  group: goanime-perf-baseline-output
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Require private token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C trusted-source diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-perf-baseline-output/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "trusted-source/$request"
          test "$project" = goanime
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Fix, format and validate
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter config --no-analytics
          flutter pub get
          (cd packages/goanime_core && dart pub get)
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/services/anime_image_cache_service.dart')
          text = path.read_text()
          old = '      cache.remove(cache.keys.first);\n'
          new = '      final evicted = cache.remove(cache.keys.first);\n      if (evicted == null) break;\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one bounded-cache eviction line, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          dart format lib/services/anime_image_cache_service.dart test/services/bundled_database_asset_service_test.dart
          dart format --output=none --set-exit-if-changed lib/services/anime_image_cache_service.dart test/services/bundled_database_asset_service_test.dart
          git -c core.whitespace=cr-at-eol diff --check
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1 test/services/anime_image_cache_service_test.dart test/services/bundled_database_asset_service_test.dart

      - name: Publish validated outputs
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="generated/goanime-perf-baseline-output/$TARGET_SHA"
          put_content() {
            local path="$1" source="$2" current args encoded
            encoded="$(base64 -w0 "$source")"
            current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='ci(goanime): publish validated performance baseline output' -f content="$encoded" -f branch=main)
            if [ -n "$current" ]; then args+=(-f sha="$current"); fi
            gh api "${args[@]}" >/dev/null
          }
          put_content "$prefix/lib/services/anime_image_cache_service.dart" private-source/lib/services/anime_image_cache_service.dart
          put_content "$prefix/test/services/bundled_database_asset_service_test.dart" private-source/test/services/bundled_database_asset_service_test.dart
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"

      - name: Record status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_STATUS: ${{ job.status }}
          TARGET_SHA: ${{ steps.request.outputs.sha }}
          OUTPUT_PREFIX: ${{ steps.publish.outputs.prefix }}
        run: |
          set -euo pipefail
          body="$(python3 - <<'PY'
          import json, os
          print(json.dumps({'status': os.environ['GATE_STATUS'], 'targetSha': os.environ.get('TARGET_SHA') or None, 'outputPrefix': os.environ.get('OUTPUT_PREFIX') or None, 'runId': os.environ.get('GITHUB_RUN_ID')}, indent=2))
          PY
          )"
          encoded="$(printf '%s\n' "$body" | base64 -w0)"
          path='status/goanime-perf-baseline-output.json'
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/$path?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/$path" -f message='ci(goanime): record performance baseline output status' -f content="$encoded" -f branch=main)
          if [ -n "$current" ]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
