name: Fix GoAnime reader content host suffix policy

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-reader-content-host-suffix-policy-fix/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-reader-content-host-suffix-policy-fix
  cancel-in-progress: false

jobs:
  fix:
    name: Honor content host suffix policy in reader
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Apply exact-SHA reader content host-suffix fix
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: bash scripts/fix-goanime-reader-content-host-suffix-policy.sh
