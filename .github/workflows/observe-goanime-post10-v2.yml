name: Observe GoAnime post-10 v2

on:
  push:
    branches: [main]
    paths:
      - 'triggers/observe-goanime-post10-v2/*.request'

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - name: Capture sanitized workflow state
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          target='publish-goanime-post-10-candidate-v2.yml'
          response="$(gh api "repos/$REPO/actions/workflows/$target/runs?per_page=5")"
          report="$(jq -c '{schemaVersion:1,runs:[.workflow_runs[] | {id,status,conclusion,event,head_sha,created_at,updated_at}]}' <<<"$response")"
          encoded="$(printf '%s\n' "$report" | base64 -w0)"
          path="results/observe-goanime-post10-v2/${GITHUB_RUN_ID}.json"
          gh api --method PUT "repos/$REPO/contents/$path" -f message="ci(observe): record GoAnime post-10 v2 state $GITHUB_RUN_ID" -f content="$encoded" >/dev/null
