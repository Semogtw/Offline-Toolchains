name: Finalize GoAnime Jikan Local v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-goanime-jikan-local-v2.yml'

permissions:
  contents: read

concurrency:
  group: finalize-goanime-jikan-local-v2
  cancel-in-progress: true

jobs:
  validate-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TARGET_BRANCH: feat/self-hosted-metadata-api-2026-07-30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout Jikan Local
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: feat/self-hosted-metadata-api-2026-07-30
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: target
          fetch-depth: 0
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply code-only fixes safely
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'infra/jikan/scripts/restore.sh',
              "require_command docker\n\n",
              "require_command docker\n\nif ! docker compose version >/dev/null 2>&1; then\n  printf 'Could not verify Docker Compose availability before restore.\\n' >&2\n  exit 74\nfi\n\n",
              'restore early Compose probe',
          )
          replace_once(
              'infra/jikan/scripts/restore.sh',
              "if ! docker compose version >/dev/null; then\n  printf 'Could not verify Docker Compose availability before restore.\\n' >&2\n  exit 74\nfi\n",
              '',
              'restore old Compose probe',
          )

          restore_contract = 'infra/jikan/tests/backup_restore_contract_test.sh'
          cases = [
              ('restored secret stage creation failure reached Docker', 'restored secret stage creation failure'),
              ('restored secret stage chmod failure reached Docker', 'restored secret stage chmod failure'),
              ('staged secret synchronization failure must happen before Docker access', 'staged secret synchronization failure'),
              ('secret publication synchronization failure must happen before Docker access', 'secret publication synchronization failure'),
          ]
          for old_message, context in cases:
              old = '[[ ! -s "$DOCKER_LOG" ]] || \\\n  fail \'%s\'\n' % old_message
              new = 'grep -Eq \'^compose version[[:space:]]*$\' "$DOCKER_LOG" || \\\n  fail \'%s skipped Compose preflight\'\n' % context
              new += 'if grep -Ev \'^compose version[[:space:]]*$\' "$DOCKER_LOG" | grep -q .; then\n'
              new += '  fail \'%s reached Docker beyond the read-only Compose preflight\'\n' % context
              new += 'fi\n'
              replace_once(restore_contract, old, new, context)

          replace_once(
              'infra/jikan/tests/validate_images_contract_test.sh',
              "printf 'docker %s\\n' \"$*\" >> \"${CALL_LOG:?}\"\n",
              "printf 'docker %s\\n' \"$*\" >> \"${CALL_LOG:?}\"\nif [[ \"${1:-}\" == \"compose\" && \"${2:-}\" == \"version\" ]]; then\n  exit 0\nfi\n",
              'validate-images fake Compose probe',
          )
          replace_once(
              'infra/jikan/tests/validate_images_contract_test.sh',
              "[[ ! -s \"$CALL_LOG\" ]] || \\\n  fail 'temporary image listing failure reached Docker'\n",
              "grep -Fxq 'docker compose version' \"$CALL_LOG\" || \\\n  fail 'temporary image listing failure skipped Compose preflight'\nif grep -Fvx 'docker compose version' \"$CALL_LOG\" | grep -q .; then\n  fail 'temporary image listing failure reached Docker beyond the read-only Compose preflight'\nfi\n",
              'validate-images mktemp assertion',
          )

          replace_once(
              'services/metadata-api/src/http_server.js',
              """          response.setHeader(
            'cache-control',
            `public, max-age=${Math.max(0, Math.floor((config.homeFreshTtlMs ?? 60_000) / 1_000))}`,
          );
""",
              """          // Home is assembled from independently aged section caches. A full
          // downstream max-age would reset their effective freshness whenever
          // the aggregate is requested, including stale fallback responses.
          // Revalidate via the stable ETag instead; internal section caches
          // still absorb upstream refresh traffic.
          response.setHeader(
            'cache-control',
            'public, max-age=0, must-revalidate',
          );
""",
              'Home downstream cache policy',
          )

          replace_once(
              'infra/jikan/scripts/measure-rpm.sh',
              '$1 ~ ("class=\\\\\\\"" class_name "\\\\\\\"")',
              'index($1, "class=\\\"" class_name "\\\"") > 0',
              'RPM class label matcher',
          )
          replace_once(
              'infra/jikan/scripts/measure-rpm.sh',
              '$1 ~ ("cache=\\\\\\\"" cache_name "\\\\\\\"")',
              'index($1, "cache=\\\"" cache_name "\\\"") > 0',
              'RPM cache label matcher',
          )
          PY
          git diff --check
          git diff --stat

      - name: Install PHP CLI if needed
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v php >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y php-cli
          fi
          php -v | head -n1
          node --version

      - name: Focused Jikan gates
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/restore_compose_preflight_order_contract_test.sh
          bash tests/backup_restore_contract_test.sh
          bash tests/validate_images_compose_preflight_contract_test.sh
          bash tests/validate_images_contract_test.sh
          bash tests/measure_rpm_contract_test.sh

      - name: Focused Metadata API gates
        working-directory: target/services/metadata-api
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            test/rate_limited_fetch.test.js \
            test/jikan_client_shutdown_retry.test.js \
            test/http_home_revalidation.test.js

      - name: Full Jikan infrastructure contracts
        working-directory: target/infra/jikan
        shell: bash
        run: |
          set -euo pipefail
          bash tests/run.sh

      - name: Full Metadata API tests
        working-directory: target/services/metadata-api
        shell: bash
        run: |
          set -euo pipefail
          npm test

      - name: Commit and push verified fixes
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Arthur Almeida'
          git config user.email 'arthurgva1602@gmail.com'
          git add \
            infra/jikan/scripts/restore.sh \
            infra/jikan/tests/backup_restore_contract_test.sh \
            infra/jikan/tests/validate_images_contract_test.sh \
            infra/jikan/scripts/measure-rpm.sh \
            services/metadata-api/src/http_server.js
          git commit -m 'fix(jikan): close final code-only production gaps'
          git push origin HEAD:"$TARGET_BRANCH"
