name: Build current GoAnime main private release APK v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-goanime-main-release-private-v2-20260824.yml'

permissions:
  contents: read

concurrency:
  group: goanime-main-private-release-v2-20260824
  cancel-in-progress: true

env:
  SOURCE_SHA: 7bd636136b7dac88bd679f1b98f9bec2d605efde
  OFFICIAL_RELEASE_ASSET_ID: '460794541'
  EXPECTED_PGP_FINGERPRINT: 2DE29DC31427CF0A911AB96175679291435059B0
  FLUTTER_VERSION: 3.44.1
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  UPDATE_MANIFEST_URL: ${{ secrets.UPDATE_MANIFEST_URL }}
  UPDATE_APPCAST_URL: ${{ secrets.UPDATE_APPCAST_URL }}
  ANIME_METADATA_SEED_MANIFEST_URL: ${{ secrets.ANIME_METADATA_SEED_MANIFEST_URL }}
  RUNTIME_DATABASE_MANIFEST_URL: ${{ secrets.RUNTIME_DATABASE_MANIFEST_URL }}

jobs:
  build:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout trusted toolchain source
        uses: actions/checkout@v6
        with:
          ref: main
          path: trusted-source
          persist-credentials: false

      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Expose Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Recover public Firebase Android client resources
        id: firebase
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/goanime-firebase-recovery-v2"
          mkdir -p "$work"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $PRIVATE_REPOSITORIES_TOKEN" \
            -H 'Accept: application/octet-stream' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/Semogtw/goanime-mobile/releases/assets/$OFFICIAL_RELEASE_ASSET_ID" \
            -o "$work/official.apk"
          test -s "$work/official.apk"
          unzip -tq "$work/official.apk" >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool >/dev/null
          apktool d --force --no-src "$work/official.apk" -o "$work/decoded" >/dev/null
          python3 - "$work/decoded" "$work/firebase.json" <<'PY'
          import json, pathlib, sys, xml.etree.ElementTree as ET
          wanted = {
              'google_app_id', 'gcm_defaultSenderId', 'google_api_key',
              'google_storage_bucket', 'project_id', 'firebase_database_url',
          }
          values = {}
          for file in pathlib.Path(sys.argv[1]).glob('res/values*/strings.xml'):
              try:
                  root = ET.parse(file).getroot()
              except Exception:
                  continue
              for node in root.findall('string'):
                  name = node.attrib.get('name')
                  if name in wanted and name not in values:
                      value = ''.join(node.itertext()).strip()
                      if value:
                          values[name] = value
          required = ['google_app_id', 'gcm_defaultSenderId', 'google_api_key', 'project_id']
          missing = [name for name in required if not values.get(name)]
          if missing:
              raise SystemExit('decoded official APK lacks Firebase client resources: ' + ', '.join(missing))
          json.dump(values, open(sys.argv[2], 'w', encoding='utf-8'))
          print('Recovered required Firebase Android client resources without logging their values.')
          PY
          echo "config=$work/firebase.json" >> "$GITHUB_OUTPUT"

      - name: Checkout exact current GoAnime main
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Verify exact source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C private-source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Restore client configuration in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          python3 - '${{ steps.firebase.outputs.config }}' private-source/android/app/google-services.json "$RUNNER_TEMP/goanime-build-defines.json" <<'PY'
          import json, os, sys
          v = json.load(open(sys.argv[1], encoding='utf-8'))
          payload = {
              'project_info': {
                  'project_number': v['gcm_defaultSenderId'],
                  'project_id': v['project_id'],
              },
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': v['google_app_id'],
                      'android_client_info': {'package_name': 'com.example.goanime_mobile'},
                  },
                  'api_key': [{'current_key': v['google_api_key']}],
                  'services': {},
              }],
              'configuration_version': '1',
          }
          if v.get('google_storage_bucket'):
              payload['project_info']['storage_bucket'] = v['google_storage_bucket']
          if v.get('firebase_database_url'):
              payload['project_info']['firebase_url'] = v['firebase_database_url']
          json.dump(payload, open(sys.argv[2], 'w', encoding='utf-8'), separators=(',', ':'))

          defaults = {
              'FIREBASE_PROJECT_ID': v['project_id'],
              'FIREBASE_WEB_API_KEY': v['google_api_key'],
              'UPDATE_MANIFEST_URL': 'https://github.com/Semogtw/goanime-mobile/releases/latest/download/update.json',
              'UPDATE_APPCAST_URL': 'https://github.com/Semogtw/goanime-mobile/releases/latest/download/appcast.xml',
              'ANIME_METADATA_SEED_MANIFEST_URL': 'https://github.com/Semogtw/goanime-mobile/releases/latest/download/anime_metadata_manifest.json',
              'RUNTIME_DATABASE_MANIFEST_URL': 'https://github.com/Semogtw/goanime-mobile/releases/latest/download/runtime_database_manifest.json',
          }
          for name in ['TMDB_API_KEY', 'UPDATE_MANIFEST_URL', 'UPDATE_APPCAST_URL', 'ANIME_METADATA_SEED_MANIFEST_URL', 'RUNTIME_DATABASE_MANIFEST_URL']:
              if os.environ.get(name):
                  defaults[name] = os.environ[name]
          json.dump(defaults, open(sys.argv[3], 'w', encoding='utf-8'), separators=(',', ':'))
          PY
          chmod 600 private-source/android/app/google-services.json "$RUNNER_TEMP/goanime-build-defines.json"

      - name: Resolve dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd private-source && flutter config --no-analytics && flutter pub get)
          (cd private-source/packages/goanime_core && dart pub get)

      - name: Validate current main
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=none --set-exit-if-changed lib test packages tools
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=2
          (cd packages/goanime_core && dart test)

      - name: Build release AOT APK
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm64 --no-pub \
            --dart-define-from-file="$RUNNER_TEMP/goanime-build-defines.json"

      - name: Validate and encrypt private APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          apk="$GITHUB_WORKSPACE/private-source/build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          test "$(unzip -Z1 "$apk" 'lib/*/libapp.so')" = 'lib/arm64-v8a/libapp.so'
          ! unzip -Z1 "$apk" | grep -q 'assets/flutter_assets/kernel_blob.bin'
          aapt2_bin="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name aapt2 | sort -V | tail -n1)"
          apksigner_bin="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          "$aapt2_bin" dump resources "$apk" > "$RUNNER_TEMP/final-resources.txt"
          for resource in google_app_id gcm_defaultSenderId google_api_key project_id; do grep -q ":string/$resource" "$RUNNER_TEMP/final-resources.txt"; done
          "$apksigner_bin" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/apksigner.txt"

          work="$RUNNER_TEMP/goanime-main-private-release-v2"
          mkdir -p "$work/transfer" "$work/gpg"
          chmod 700 "$work/gpg"
          export GNUPGHOME="$work/gpg"
          sha256="$(sha256sum "$apk" | awk '{print $1}')"
          size="$(stat -c '%s' "$apk")"
          gpg --batch --import "$GITHUB_WORKSPACE/trusted-source/keys/source-bundles-public.asc"
          test "$(gpg --batch --with-colons --fingerprint "$EXPECTED_PGP_FINGERPRINT" | awk -F: '$1=="fpr"{print $10;exit}')" = "$EXPECTED_PGP_FINGERPRINT"
          encrypted="$work/transfer/GoAnime-${SOURCE_SHA:0:12}-main-release-arm64.apk.gpg"
          gpg --batch --yes --trust-model always --recipient "$EXPECTED_PGP_FINGERPRINT" --output "$encrypted" --encrypt "$apk"
          cp "$RUNNER_TEMP/apksigner.txt" "$work/transfer/apksigner.txt"
          python3 - "$work/transfer/manifest.json" "$sha256" "$size" "$SOURCE_SHA" <<'PY'
          import datetime, json, os, sys
          json.dump({
              'schema_version': 2,
              'source_sha': sys.argv[4],
              'build_type': 'release-private',
              'flutter_mode': 'release',
              'target_platform': 'android-arm64',
              'firebase_native_configured': True,
              'firebase_rest_configured': True,
              'runtime_database_manifest_configured': True,
              'anime_metadata_manifest_configured': True,
              'tmdb_secret_present_in_toolchains': bool(os.environ.get('TMDB_API_KEY')),
              'signing': 'release build type; project debug-certificate fallback because production Android keystore is not available to Offline-Toolchains',
              'distribution': 'private encrypted Actions artifact only; no GitHub Release, Play Store, Shorebird, updater publication, or rollout',
              'apk_sha256': sys.argv[2],
              'apk_size_bytes': int(sys.argv[3]),
              'created_utc': datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }, open(sys.argv[1], 'w', encoding='utf-8'), indent=2, sort_keys=True)
          PY
          rm -rf "$GITHUB_WORKSPACE/private-source" "$work/gpg" "$RUNNER_TEMP/goanime-firebase-recovery-v2"
          rm -f "$RUNNER_TEMP/goanime-build-defines.json"
          echo "transfer_dir=$work/transfer" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"

      - name: Upload encrypted private APK
        uses: actions/upload-artifact@v7
        with:
          name: goanime-main-release-private-encrypted-v2
          path: ${{ steps.package.outputs.transfer_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Summary
        env:
          APK_SHA256: ${{ steps.package.outputs.sha256 }}
          APK_SIZE: ${{ steps.package.outputs.size }}
        shell: bash
        run: |
          {
            echo '## GoAnime current-main private release APK'
            echo
            echo "- Source: \`$SOURCE_SHA\`"
            echo '- Flutter: release/AOT, arm64-v8a'
            echo '- Firebase: configured'
            echo '- Runtime/update manifests: configured'
            echo '- Distribution: private encrypted artifact only; no user rollout'
            echo "- SHA-256: \`$APK_SHA256\`"
            echo "- Bytes: \`$APK_SIZE\`"
          } >> "$GITHUB_STEP_SUMMARY"
