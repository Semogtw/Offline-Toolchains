name: Diagnose GoAnime Scrapling crawler hardening

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-scrapling-crawler-hardening-diagnostics/*.request'

permissions:
  contents: read
  statuses: write

concurrency:
  group: goanime-scrapling-crawler-hardening-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted Toolchains source
        uses: actions/checkout@v6
        with:
          path: trusted-source
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve source-bound request
        id: request
        working-directory: trusted-source
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/goanime_resolve_request.py \
            --request-dir triggers/goanime-scrapling-crawler-hardening-diagnostics \
            --workspace .

      - name: Checkout exact GoAnime source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.source_hint }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
          show-progress: false

      - name: Apply patch in disposable checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 trusted-source/scripts/goanime_apply_scrapling_animesonline_hardening.py \
            --repo-root private-source

      - name: Diagnose crawler tests by slot
        working-directory: private-source/tools/scrapling_provider_pipeline
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ../../../trusted-source/scripts/goanime_run_unittest_file_slots.py \
            --test-file tests/test_provider_crawlers.py \
            --reporter ../../../trusted-source/scripts/goanime_post_status.py \
            --context-prefix goanime-scrapling/crawler-test-slot

      - name: Mark diagnostic success
        if: success()
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/goanime_post_status.py --state success --context goanime-scrapling/crawler-tests

      - name: Mark diagnostic failure
        if: failure()
        continue-on-error: true
        working-directory: trusted-source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/goanime_post_status.py --state failure --context goanime-scrapling/crawler-tests

      - name: Cleanup
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/trusted-source"
