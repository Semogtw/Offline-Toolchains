name: Validate private CI hub

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - scripts/private_ci_request.py
      - scripts/test_private_ci_request.py
      - scripts/test-private-ci-toolchain-policy.py
      - scripts/test-semogsite-install-policy.py
      - scripts/validate-private-ci-workflows.py
      - scripts/validate-runner-policy.py
      - triggers/private-ci.json
      - docs/private-project-ci.md
      - docs/superpowers/specs/2026-08-01-public-private-ci-hub-design.md
      - docs/superpowers/plans/2026-08-01-public-private-ci-hub.md
  push:
    branches:
      - main
      - feature/**
      - fix/**
    paths:
      - '.github/workflows/**'
      - scripts/private_ci_request.py
      - scripts/test_private_ci_request.py
      - scripts/test-private-ci-toolchain-policy.py
      - scripts/test-semogsite-install-policy.py
      - scripts/validate-private-ci-workflows.py
      - scripts/validate-runner-policy.py
      - triggers/private-ci.json
      - docs/private-project-ci.md
      - docs/superpowers/specs/2026-08-01-public-private-ci-hub-design.md
      - docs/superpowers/plans/2026-08-01-public-private-ci-hub.md

permissions:
  contents: read

concurrency:
  group: validate-private-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate request and workflow contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enforce GitHub Actions runner policy
        run: python3 scripts/validate-runner-policy.py

      - name: Parse workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t workflows < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print | sort
          )
          test "${#workflows[@]}" -gt 0
          ruby -e '
            require "psych"
            ARGV.each do |path|
              Psych.parse_file(path)
              puts "YAML syntax: PASS: #{path}"
            end
          ' "${workflows[@]}"

      - name: Run request validator tests
        run: python3 scripts/test_private_ci_request.py

      - name: Enforce project toolchain policy
        run: python3 scripts/test-private-ci-toolchain-policy.py

      - name: Enforce SemogSite install policy
        run: python3 scripts/test-semogsite-install-policy.py

      - name: Enforce private CI workflow contract
        run: python3 scripts/validate-private-ci-workflows.py
