name: Run GoAnime manga metadata privately

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-manga-metadata/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-manga-metadata-private-ci
  cancel-in-progress: false

jobs:
  metadata:
    name: Manga availability and MAL metadata
    if: github.actor == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require private repository token
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout control request
        uses: actions/checkout@v6
        with:
          path: control
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Resolve exact private revision
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git -C control diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-manga-metadata/*.request' | head -n 1)"
          test -n "$request"
          read -r project branch sha < "control/$request"
          test "$project" = goanime
          test "$branch" = feature/manga-platform
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private source
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Resolve dependencies
        working-directory: private-source
        run: flutter pub get >/dev/null 2>&1

      - name: Analyze metadata and availability integration
        working-directory: private-source
        run: >-
          flutter analyze --no-pub
          lib/services/manga/manga_work_merger.dart
          lib/services/manga/manga_availability_service.dart
          lib/services/manga/manga_search_catalog_persistence.dart
          lib/services/manga/manga_source_runtime.dart
          lib/services/manga/storage/manga_catalog_repository.dart
          lib/services/manga/metadata
          test/services/manga/manga_availability_service_test.dart
          test/services/manga/manga_availability_work_merge_test.dart
          test/services/manga/manga_search_metadata_preservation_test.dart
          test/services/manga/metadata

      - name: Test metadata and availability integration
        working-directory: private-source
        run: >-
          flutter test --no-pub
          test/services/manga/manga_availability_service_test.dart
          test/services/manga/manga_availability_work_merge_test.dart
          test/services/manga/manga_search_catalog_persistence_test.dart
          test/services/manga/manga_search_metadata_preservation_test.dart
          test/services/manga/metadata

      - name: Check focused formatting
        working-directory: private-source
        run: >-
          dart format --output=none --set-exit-if-changed
          lib/services/manga/manga_work_merger.dart
          lib/services/manga/manga_availability_service.dart
          lib/services/manga/manga_search_catalog_persistence.dart
          lib/services/manga/manga_source_runtime.dart
          lib/services/manga/storage/manga_catalog_repository.dart
          lib/services/manga/metadata
          test/services/manga/manga_availability_service_test.dart
          test/services/manga/manga_availability_work_merge_test.dart
          test/services/manga/manga_search_metadata_preservation_test.dart
          test/services/manga/metadata

      - name: Remove private checkout
        if: always()
        run: rm -rf "$GITHUB_WORKSPACE/private-source" "$GITHUB_WORKSPACE/control"
