name: Admin merge GoAnime PR 236

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-merge-goanime-pr236.yml'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Require private GoAnime credential
        env:
          GH_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"

      - name: Probe branch protection administration permission
        env:
          GH_TOKEN: ${{ secrets.GOANIME_CATALOG_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Semogtw/goanime-mobile/branches/main/protection \
            --jq '{required_status_checks, enforce_admins, required_pull_request_reviews, restrictions, required_linear_history, allow_force_pushes, allow_deletions, block_creations, required_conversation_resolution, lock_branch, allow_fork_syncing}'
