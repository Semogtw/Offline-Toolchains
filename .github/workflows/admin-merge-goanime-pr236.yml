name: Admin merge GoAnime PR 236

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-merge-goanime-pr236.yml'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Require GoAnime release credential
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo '::error::A GoAnime release/private repository token is required.'
            exit 1
          }

      - name: Admin merge externally validated cache PR
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr merge 236 \
            --repo Semogtw/goanime-mobile \
            --merge \
            --admin \
            --match-head-commit baaafa88d1927df9fcaa42bf9c691c5326d296e9

      - name: Verify merge reached main
        env:
          GH_TOKEN: ${{ secrets.GOANIME_RELEASE_TOKEN || secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr view 236 --repo Semogtw/goanime-mobile --json mergedAt,mergeCommit --jq '{mergedAt,mergeCommit}'
          gh api repos/Semogtw/goanime-mobile/branches/main --jq '.commit.sha'
