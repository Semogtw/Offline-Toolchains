name: Admin merge GoAnime PR 236

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-merge-goanime-pr236.yml'

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-24.04
    steps:
      - name: Require private repositories credential
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || {
            echo '::error::PRIVATE_REPOSITORIES_TOKEN is unavailable.'
            exit 1
          }

      - name: Probe PR and branch administration permissions
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/Semogtw/goanime-mobile/pulls/236 --jq '{number,state,head:.head.sha,base:.base.ref}'
          gh api repos/Semogtw/goanime-mobile/branches/main/protection --jq '{required_status_checks,enforce_admins}'
