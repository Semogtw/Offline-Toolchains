name: Probe GoAnime control actor

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-control-actor-probe/*.request'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Publish actor receipt
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(jq -cn --arg actor "$ACTOR" --arg owner "$OWNER" --arg event "$EVENT" --arg sha "$CONTROL_SHA" '{schemaVersion:1,actor:$actor,owner:$owner,event:$event,controlSha:$sha}')"
          encoded="$(printf '%s\n' "$result" | base64 -w0)"
          path="results/goanime-control-actor-probe/${CONTROL_SHA}.json"
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" -f message="ci(result): record GoAnime control actor" -f content="$encoded" >/dev/null
          echo "$result" >> "$GITHUB_STEP_SUMMARY"
