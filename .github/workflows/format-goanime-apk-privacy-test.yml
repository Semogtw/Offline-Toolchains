name: Format GoAnime APK privacy test

on:
  push:
    branches: [main]
    paths:
      - 'triggers/goanime-apk-privacy-format/*.request'

permissions:
  contents: read

concurrency:
  group: goanime-apk-privacy-format
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require private repository token
        shell: bash
        env:
          PRIVATE_REPOSITORIES_TOKEN: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
        run: test -n "$PRIVATE_REPOSITORIES_TOKEN"

      - name: Checkout trusted Toolchains request
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false
          show-progress: false

      - name: Read exact request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          request="$(git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD^ HEAD -- 'triggers/goanime-apk-privacy-format/*.request' | head -n1)"
          test -n "$request"
          mapfile -t lines < <(sed '/^[[:space:]]*$/d' "$request")
          test "${#lines[@]}" -eq 2
          branch="${lines[0]}"
          sha="${lines[1]}"
          test "$branch" = 'fix/apk-runtime-privacy'
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          printf 'branch=%s\nsha=%s\n' "$branch" "$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact private GoAnime revision
        uses: actions/checkout@v6
        with:
          repository: Semogtw/goanime-mobile
          ref: ${{ steps.request.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPOSITORIES_TOKEN }}
          path: private-source
          fetch-depth: 1
          persist-credentials: true
          lfs: false
          submodules: false
          show-progress: false

      - name: Set up Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: false

      - name: Format only the privacy reload regression test
        working-directory: private-source
        shell: bash
        run: |
          set -euo pipefail
          file='test/services/availability_reload_race_test.dart'
          dart format "$file"
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "$file"

      - name: Commit and push formatted test
        working-directory: private-source
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.sha }}
          TARGET_BRANCH: ${{ steps.request.outputs.branch }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          remote="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | awk '{print $1}')"
          test "$remote" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/services/availability_reload_race_test.dart
          git commit -m 'style(test): format availability reload regression'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"

      - name: Remove private checkout
        if: always()
        run: rm -rf private-source
